n<strong>installation id<\/strong> (Settings &gt; Modules), what you did,\nwhat you expected and what happened, a screenshot, and the\n<strong>request id<\/strong> and the matching lines from\n<code>niwe-erp-error.log<\/code> (Settings &gt; Server logs).<\/p>\n", "text": " Problem Likely cause and what to do A module is missing from the menu It is not in the licence, not yet activated, or the person's role has no access to it. Check Settings > Modules . Activation is by an Admin and is permanent. \"X is not part of your license\" (403) The module is locked. Install a licence that contains it (chapter 3). All non-core modules locked suddenly The licence has expired. Nothing is lost. Install the renewal. A person cannot see a screen they should Their custom role has No access for its area, the role is inactive , or the screen is admin-only (Settings, Staff, Backup). See the area table in chapter 4. A cashier cannot approve a void/discount They lack the matching approval permission. Add it under Extra permissions on their staff record, or ask an Admin to type their PIN. \"PIN not recognized\" at the terminal The PIN is wrong, or belongs to an inactive person. PINs are 4 to 6 digits and unique among active staff. Reset it on the Staff list. A till says it is refused / wrong device The register is bound to another device. Unbind it (Admin) or bind it to this PC (chapter 8). Cannot sell: warehouse message Multi-warehouse is on and the register still uses the Main warehouse. Assign a different warehouse to the register. Sale refused because of stock Allow negative stock is off and the sale would oversell. Receive stock or adjust it. A thermal printer does nothing Check the connection type, that the browser is Chrome or Edge on https/localhost, press Connect device... , then Print test page . A red line on the printout says why it fell back to the driver. Strange characters on receipts Change the code page to Plain ASCII in the PC's device settings. No e-mail arrives Check Email settings and use Send test email . Check the recipient's address and the server log. A failed e-mail never blocks the work itself. Daily job did not run Check the module settings for the job's on/off switch and time, and that the time zone in System settings is right. A job runs when the server is next up that day. Backup restore stuck on \"please wait\" Restore is running. Wait, then restart the application when it finishes. Server will not start: checksum or schema message See chapter 12, If a start-up fails . Import skips many rows Read the reasons in Rows that will be skipped after Check file ; correct and check again. A report looks wrong Check the filters and dates, and whether the books were closed for that period (Accounting > Controls). A user forgot their password If they have an e-mail address on file, use Forgot password? on the sign-in screen. Otherwise an Admin sets a new password on the Staff record. The online shop Problem Likely cause and what to do The shop says \"Sold out\" but I have stock The shop sells stock in sellable locations − reserved on confirmed sales orders − Units kept back for the till (default 1). Open Online Store > Shop settings > Products on the shop : the line under the product shows each number. A single unit shows as sold out because of the buffer (set it to 0 to change that). Stock in a Receiving , Damaged or inactive location, or never entered per warehouse, is not counted: move it to a sales location with a stock transfer. Goods promised on confirmed sales orders are not counted either. A product does not appear on the shop It is not added in Products on the shop , Shown is unticked, or the product is inactive. A product appears in a row only when its tick ( Featured , Best seller , Offer , New ) is on. The first page has no banner picture, or shows a plain colour No banner picture is uploaded (Shop settings > Front page > Banner pictures), or the upload was refused: only JPEG, PNG, WebP and GIF pictures up to 8 MB are accepted, at most 8. A review does not appear New reviews wait for staff: approve it in Online Store > Reviews . Only reviews with words appear on the first page, and only for completed orders. A customer pressed Subscribe but nothing arrived The newsletter needs working e-mail settings ( Send test email , chapter 9). Ask them to look in the spam folder; an address can ask for a new e-mail once every 10 minutes. The address stays Not confirmed until the link is opened. A newsletter stays on \"Sending\" and few e-mails leave It goes out in batches of app.online-store.newsletter.batch-size a minute and never more than daily-limit in 24 hours (chapter 7); the daily limit shown on Send a newsletter says how much of it is used. If several e-mails failed in a row it paused: read the reason shown on the newsletter, fix the mail settings ( Send test email , chapter 9) and press Try the failed ones again . The confirmation or unsubscribe link opens the wrong site app.frontend-url is not set to the public address of the site (chapter 7). The unsubscribe links in the downloaded newsletter list are built from the same setting. Customers say they get no abandoned-cart reminder Send reminders for abandoned carts is off in Shop settings, e-mail is not set up (chapter 9), or the customer did not type an e-mail address before leaving. Look at Online Store > Abandoned carts : Waiting carts get their first e-mail about an hour after the last change (the job runs every 3 minutes); Ordered and Stopped carts get nothing; Nothing to remind means every item was gone or the reminder was too late. A small warning sign on a row shows the mail server's reason. The link in the e-mail opens the wrong site when app.frontend-url is wrong (chapter 7). A customer cannot see or use loyalty points Customers earn and spend loyalty points is off in Shop settings, or Customer accounts is off, or the customer is not signed in (guests earn nothing). Points are earned only when the order is completed , not when it is placed; an order that is cancelled or refused gives the spent points back. Look at the customer's history in Online Store > Loyalty points . If a customer has no points to spend they see no points box; points may pay at most the share of the goods set in Shop settings. The online payment option is missing at checkout Customers can pay online is off, no provider is chosen, or the provider is not available (for MTN: not switched on, a key missing, or the base address is not https; the server log says which). An order stays \"Awaiting payment\" The customer has not approved the payment. A pending payment is checked about once a minute and the order is cancelled after a day. Look at Online Store > Online payments for Stuck pending . A payment is under review The amount or currency the provider reports differs from the order, or the order was paid twice. Look at it in Online payments , handle it (refund the difference if needed) and press Mark as dealt with . A refund says the provider did not confirm it Check the refund in the provider's portal. If it went through, record it by hand with the provider's reference ( I refunded it myself ); never refund twice. No texts are sent No text provider is chosen, the daily limit is reached, or the number is not valid. Online Store > Text messages lists every text with its result. Everyone is \"too many requests\" The server sits behind a proxy and server.forward-headers-strategy=native is not set (chapter 7). Link previews do not show in WhatsApp or Facebook The nginx rule for the crawlers (chapter 7, Link previews ) is missing, or app.frontend-url is wrong. Test with curl -A \"facebookexternalhit/1.1\" \"https://your-shop/shop?product=12\" . The customer did not get the delivery code Check the order's history line Code message: e-mail ... SMS ... . With no real text company the SMS is kept as Waiting for an SMS company (Online Store > Text messages); the customer can always read the code on the order page and in his account. Staff can press Send a new code to the customer . A driver's link does not work The link was switched off or replaced, the driver is not active , five wrong PINs locked it for 30 minutes (make a New PIN ), or app.frontend-url is wrong so the link is incomplete. \"Please call the shop\" when a driver hands over The completion was refused (for example not enough stock or a batch problem). Open the order: its history holds the real reason. A delivery window is missing at checkout Delivery times are off, the window is full, too close (notice), not on that weekday, the day is closed, or the day is beyond days ahead . Driver cash does not match Cash with Drivers An order was delivered before version 1.72.0 (its cash went to Cash and Bank), a settlement was posted twice, or a hand-in was posted by hand. Compare the To hand in total with the account's balance. A provider's balance keeps growing Payouts are not being recorded: record each payout with Online Store > Online payments > Payouts (gross, fee, date, reference). A balance that goes negative means a payout was recorded twice or for the wrong provider. Accounts by provider will not save The clearing account is already used by another provider, is not an ordinary asset account, equals the payout account, or the provider still owes money on the old clearing account (record its payouts first). Suspense account has a balance A posting did not balance and the program put the difference in Suspense. Find the entry in Accounting > Journal entries, correct it, and tell support the entry's source. Suspense must be zero. A payment is not in the books A payment Under review is not posted until staff deal with it. Open Online Store > Online payments > Under review . A product is sold out although stock is in a warehouse Only Sales locations outside the Main warehouse count, minus held units and the buffers (chapter 7, Stock the shop sells ). Look at the line under the product. When you contact support Send NIWE: the version number , the installation id (Settings > Modules), what you did, what you expected and what happened, a screenshot, and the request id and the matching lines from niwe-erp-error.log (Settings > Server logs). "}, {"id": "user-1-about-this-manual-and-getting-started", "manual": "user", "n": 1, "title": "About this manual and\ngetting started", "html": "\n<h2 id=\"who-this-manual-is-for\">Who this manual is for<\/h2>\n<p>This is the <strong>User Manual<\/strong> for NIWE ERP. It is for\neveryone who uses the system day to day: cashiers, sales staff, store\nkeepers, accountants, HR officers, front-desk and booking staff,\nmanagers and owners. It explains <strong>what you do<\/strong> in each\npart of the system, step by step, using the words you see on screen.<\/p>\n<p>You do not need to read it from start to finish. Read <em>Getting\nstarted<\/em> (this chapter), then the chapter or chapters for your own\nwork. The last page of each chapter lists the <strong>reports<\/strong>\nfor that module.<\/p>\n<p>Setting up the system (users, licences, printers, backups) is covered\nin the separate <strong>Administrator Manual<\/strong>. If you are a\ncashier, accountant or store keeper, the one-page <strong>Quick-start\ncard<\/strong> for your role is the fastest way to start.<\/p>\n<div class=\"callout note\">\n<p><strong>Note:<\/strong> You only see the parts of the system your\nbusiness has switched on and that your job needs. If a menu in this\nmanual is missing on your screen, your business may not use that module,\nor your role may not include it. Ask your administrator.<\/p>\n<\/div>\n<h2 id=\"signing-in\">Signing in<\/h2>\n<ol type=\"1\">\n<li>Open the system address in your browser (Chrome or Edge is\nrecommended). The home page shows a <strong>Staff Login<\/strong> button,\nand, if your business has switched them on, tiles for public pages such\nas booking or help requests.<\/li>\n<li>Press <strong>Staff Login<\/strong> and enter your\n<strong>Username<\/strong> and <strong>Password<\/strong>.<\/li>\n<li>After signing in you land on the screen that suits your role:\ncashiers on the registers list, managers on the dashboard, and so\non.<\/li>\n<\/ol>\n<p>If you forget your password, press <strong>Forgot password?<\/strong>\non the sign-in screen. A link is e-mailed to the address on your\nprofile. If you have no e-mail address on your profile, ask an\nadministrator to set a new password for you.<\/p>\n<div class=\"callout warning\">\n<p><strong>Warning:<\/strong> Never share your password or PIN.\nEverything you do is recorded under your name in the audit log.<\/p>\n<\/div>\n<h2 id=\"your-profile\">Your profile<\/h2>\n<p>Open <strong>My profile<\/strong> from the menu to:<\/p>\n<ul>\n<li>Change your <strong>Full name<\/strong> and <strong>Email<\/strong>.\nYour e-mail is needed to use <em>Forgot password?<\/em>.<\/li>\n<li><strong>Change password<\/strong>: enter your <strong>Current\npassword<\/strong>, a <strong>New password<\/strong> and <strong>Confirm\nnew password<\/strong>.<\/li>\n<li><strong>Change PIN<\/strong>: your PIN (4 to 6 digits) identifies you\nat the sales terminal and when you approve something at the till. It\nmust be different from every other active staff member's PIN.<\/li>\n<\/ul>\n<h2 id=\"appearance\">Appearance<\/h2>\n<p><strong>Appearance<\/strong> (under your settings) lets you choose\n<strong>Light<\/strong>, <strong>Dark<\/strong> or your own colours (a\npage background and an accent colour). The choice is saved for your\naccount and follows you to any device. Printed receipts, purchase orders\nand reports always stay white so that they print cleanly.<\/p>\n<h2 id=\"language\">Language<\/h2>\n<p>Use the language selector on the top bar (or on the sign-in page) to\nswitch between <strong>English<\/strong> and <strong>Français<\/strong>.\nYour choice is kept on this browser and wins over the business default.\nIf you have not chosen, you see the language your business set (Chad\nbusinesses start in French). Every module's screens, messages and report\nheadings are translated; printed documents (PDFs), e-mails and most\nmessages from the server are written in your <strong>business<\/strong>\nlanguage (Settings &gt; System settings), not in the language you picked\non your own screen, so that a customer gets a document in the language\nof the business. A few messages that carry a status word can still show\nthat word in English.<\/p>\n<h2 id=\"install-it-as-an-app\">Install it as an app<\/h2>\n<p>The system can be installed on a computer or phone like an app, so\nthat it starts from its own icon. In Chrome or Edge, or on Android, an\n<strong>Install the app<\/strong> card appears (press <strong>Not\nnow<\/strong> to hide it for two weeks); on an iPhone or iPad use\nSafari's Share button and <strong>Add to Home Screen<\/strong>. The app\nstarts faster and opens even without a connection, with a red strip\n<strong>You are offline<\/strong>. It never shows an old figure as\ncurrent: sales, stock, prices and customers always come from the server.\n(A till keeps selling and queues its sales when the connection drops;\nsee the POS chapter.) A new version waits until you press\n<strong>Reload<\/strong>; a till is never reloaded in the middle of a\nsale. The installed system needs the site to be served over\n<strong>https<\/strong>.<\/p>\n<h2 id=\"finding-your-way-around\">Finding your way around<\/h2>\n<ul>\n<li>The <strong>menu on the left<\/strong> is grouped by module (POS,\nSales, Customers, Inventory, Accounting, and so on). Click a group to\nopen it. On a phone, open the menu with the menu button at the top.<\/li>\n<li>Most lists have a <strong>search box<\/strong>,\n<strong>filters<\/strong> and <strong>quick views<\/strong> at the top,\npaging at the bottom, and <strong>Excel, PDF and CSV<\/strong> export\nbuttons that export exactly what is filtered on screen.<\/li>\n<li>Most records follow a path: <em>Draft<\/em> (you can still change\nit), then confirmed or issued, then paid or completed. Mistakes after\nthat are corrected by a <strong>void<\/strong>, a <strong>credit\nnote<\/strong> or a <strong>return<\/strong>, not by deleting, so that the\nbooks stay honest.<\/li>\n<li>Where a button is greyed out or missing, you either do not have the\npermission or the record is in a state that does not allow it.<\/li>\n<\/ul>\n<h2 id=\"approvals-manager-pin\">Approvals (manager PIN)<\/h2>\n<p>Some actions need a second person: a large discount, a void, a return\nafter many days, a hand-changed price, a big cash paid-out, an expense\nabove a limit. When this happens the screen asks for a <strong>Manager\nPIN<\/strong>, or says that an approver is needed. A manager types their\nown PIN on your screen; their name is recorded as the approver. You\nnever need to know their PIN.<\/p>\n<h2 id=\"my-hr-for-every-employee\">My HR (for every employee)<\/h2>\n<p>If your login is linked to an employee record, <strong>My HR<\/strong>\nshows your <strong>payslips<\/strong>, <strong>leave balance<\/strong>,\n<strong>attendance<\/strong> and documents, and lets you <strong>Clock\nin<\/strong> and <strong>Clock out<\/strong>, <strong>Request\nleave<\/strong> (choose the type, the dates, whether the first or last\nday is a half day, and a reason), and update your own <strong>contact\ndetails<\/strong> (phone, e-mail, address, emergency contact). Your bank\naccount, tax number and job details can only be changed by HR. If you\nsee \"Your login isn't linked to an employee record\", ask HR to link\nit.<\/p>\n<h2 id=\"dashboard\">Dashboard<\/h2>\n<p>Managers and accountants with access see the\n<strong>Dashboard<\/strong>, which summarises sales, stock and money owed\nand has a <strong>Needs your attention<\/strong> section: overdue\ninvoices, low stock, pending approvals and similar items that need\naction.<\/p>\n<h2 id=\"tips-that-apply-everywhere\">Tips that apply everywhere<\/h2>\n<ul>\n<li><strong>Type to search<\/strong> in any picker (customer, product,\nsupplier) instead of scrolling.<\/li>\n<li><strong>Export<\/strong> buttons give you the same list you are\nlooking at, filtered the same way.<\/li>\n<li><strong>Print and PDF<\/strong> buttons are on documents such as\ninvoices, quotations, purchase orders and statements.<\/li>\n<li><strong>Attachments<\/strong>: many records let you attach files or\nphotos; use them for proof (a signed delivery note, a supplier's\ninvoice).<\/li>\n<li>If something looks wrong, do not delete and re-enter. Ask a manager\nhow to correct it, and keep the reference number.<\/li>\n<\/ul>\n", "text": " Who this manual is for This is the User Manual for NIWE ERP. It is for everyone who uses the system day to day: cashiers, sales staff, store keepers, accountants, HR officers, front-desk and booking staff, managers and owners. It explains what you do in each part of the system, step by step, using the words you see on screen. You do not need to read it from start to finish. Read Getting started (this chapter), then the chapter or chapters for your own work. The last page of each chapter lists the reports for that module. Setting up the system (users, licences, printers, backups) is covered in the separate Administrator Manual . If you are a cashier, accountant or store keeper, the one-page Quick-start card for your role is the fastest way to start. Note: You only see the parts of the system your business has switched on and that your job needs. If a menu in this manual is missing on your screen, your business may not use that module, or your role may not include it. Ask your administrator. Signing in Open the system address in your browser (Chrome or Edge is recommended). The home page shows a Staff Login button, and, if your business has switched them on, tiles for public pages such as booking or help requests. Press Staff Login and enter your Username and Password . After signing in you land on the screen that suits your role: cashiers on the registers list, managers on the dashboard, and so on. If you forget your password, press Forgot password? on the sign-in screen. A link is e-mailed to the address on your profile. If you have no e-mail address on your profile, ask an administrator to set a new password for you. Warning: Never share your password or PIN. Everything you do is recorded under your name in the audit log. Your profile Open My profile from the menu to: Change your Full name and Email . Your e-mail is needed to use Forgot password? . Change password : enter your Current password , a New password and Confirm new password . Change PIN : your PIN (4 to 6 digits) identifies you at the sales terminal and when you approve something at the till. It must be different from every other active staff member's PIN. Appearance Appearance (under your settings) lets you choose Light , Dark or your own colours (a page background and an accent colour). The choice is saved for your account and follows you to any device. Printed receipts, purchase orders and reports always stay white so that they print cleanly. Language Use the language selector on the top bar (or on the sign-in page) to switch between English and Français . Your choice is kept on this browser and wins over the business default. If you have not chosen, you see the language your business set (Chad businesses start in French). Every module's screens, messages and report headings are translated; printed documents (PDFs), e-mails and most messages from the server are written in your business language (Settings > System settings), not in the language you picked on your own screen, so that a customer gets a document in the language of the business. A few messages that carry a status word can still show that word in English. Install it as an app The system can be installed on a computer or phone like an app, so that it starts from its own icon. In Chrome or Edge, or on Android, an Install the app card appears (press Not now to hide it for two weeks); on an iPhone or iPad use Safari's Share button and Add to Home Screen . The app starts faster and opens even without a connection, with a red strip You are offline . It never shows an old figure as current: sales, stock, prices and customers always come from the server. (A till keeps selling and queues its sales when the connection drops; see the POS chapter.) A new version waits until you press Reload ; a till is never reloaded in the middle of a sale. The installed system needs the site to be served over https . Finding your way around The menu on the left is grouped by module (POS, Sales, Customers, Inventory, Accounting, and so on). Click a group to open it. On a phone, open the menu with the menu button at the top. Most lists have a search box , filters and quick views at the top, paging at the bottom, and Excel, PDF and CSV export buttons that export exactly what is filtered on screen. Most records follow a path: Draft (you can still change it), then confirmed or issued, then paid or completed. Mistakes after that are corrected by a void , a credit note or a return , not by deleting, so that the books stay honest. Where a button is greyed out or missing, you either do not have the permission or the record is in a state that does not allow it. Approvals (manager PIN) Some actions need a second person: a large discount, a void, a return after many days, a hand-changed price, a big cash paid-out, an expense above a limit. When this happens the screen asks for a Manager PIN , or says that an approver is needed. A manager types their own PIN on your screen; their name is recorded as the approver. You never need to know their PIN. My HR (for every employee) If your login is linked to an employee record, My HR shows your payslips , leave balance , attendance and documents, and lets you Clock in and Clock out , Request leave (choose the type, the dates, whether the first or last day is a half day, and a reason), and update your own contact details (phone, e-mail, address, emergency contact). Your bank account, tax number and job details can only be changed by HR. If you see \"Your login isn't linked to an employee record\", ask HR to link it. Dashboard Managers and accountants with access see the Dashboard , which summarises sales, stock and money owed and has a Needs your attention section: overdue invoices, low stock, pending approvals and similar items that need action. Tips that apply everywhere Type to search in any picker (customer, product, supplier) instead of scrolling. Export buttons give you the same list you are looking at, filtered the same way. Print and PDF buttons are on documents such as invoices, quotations, purchase orders and statements. Attachments : many records let you attach files or photos; use them for proof (a signed delivery note, a supplier's invoice). If something looks wrong, do not delete and re-enter. Ask a manager how to correct it, and keep the reference number. "}, {"id": "user-2-pos-registers-the-sales-terminal-and-shi", "manual": "user", "n": 2, "title": "POS: registers, the\nsales terminal and shifts", "html": "\n<p>The <strong>POS<\/strong> (point of sale) group is where cashiers\nsell, count the till and handle returns. Its menu has: <strong>Registers\n&amp; Terminal, Shifts, Voids &amp; returns, Cash movements, POS\nsettings, Devices, Reports<\/strong>.<\/p>\n<h2 id=\"how-a-day-at-the-till-works\">How a day at the till works<\/h2>\n<ol type=\"1\">\n<li>A manager or admin <strong>opens a session (shift)<\/strong> on a\nregister and assigns it to a cashier, with an <strong>opening cash\nfloat<\/strong>.<\/li>\n<li>The cashier opens the <strong>terminal<\/strong> with their\n<strong>PIN<\/strong> and rings up sales. Payments are taken at\n<strong>Checkout<\/strong>.<\/li>\n<li>During the shift: cash <strong>paid in or out<\/strong>,\n<strong>drops into the safe<\/strong>, returns, and X reports as\nneeded.<\/li>\n<li>At the end the shift is <strong>closed<\/strong>: the drawer is\ncounted and the difference is recorded. A <strong>Z report<\/strong> is\nprinted.<\/li>\n<\/ol>\n<p>A <strong>register<\/strong> is the physical till. A\n<strong>session<\/strong> (or <strong>shift<\/strong>) is one working\nperiod on a register. One shift can have several\n<strong>cashiers<\/strong>, each with their own PIN and their own\ncarts.<\/p>\n<h2 id=\"opening-a-session\">Opening a session<\/h2>\n<p>Go to <strong>POS &gt; Registers &amp; Terminal<\/strong>. The list\nshows each register's <strong>Name, Location, Warehouse, Float,\nCashiers, Device<\/strong> and <strong>Status<\/strong> (<em>Switched\noff<\/em>, <em>Open session<\/em>, <em>Closed<\/em>).<\/p>\n<ol type=\"1\">\n<li>Press <strong>Open session<\/strong> on the register.<\/li>\n<li>In <strong>Assign to<\/strong>, choose the staff member who will work\nthe till.<\/li>\n<li>Enter the <strong>Opening cash float<\/strong>. (The most the till\nmay open with is shown.)<\/li>\n<li>Press <strong>Open till<\/strong>.<\/li>\n<\/ol>\n<p>If a register is tied to one PC, a note shows <em>Works on ...\nonly<\/em> and <em>Go to terminal<\/em> is available only on that PC.<\/p>\n<h2 id=\"opening-the-terminal\">Opening the terminal<\/h2>\n<p>Press <strong>Go to terminal<\/strong> on the open session. The\nterminal asks for your <strong>PIN<\/strong> first: type it and press\nEnter. A wrong PIN leaves the PIN screen up. If you do not have a PIN,\nask an admin to set one, or set your own in <strong>My\nprofile<\/strong>.<\/p>\n<div class=\"callout note\">\n<p><strong>Note:<\/strong> Your PIN opens <em>your own<\/em> working\nsession on the shift. Another cashier can use the same terminal by\npressing <strong>Switch cashier<\/strong> and typing their PIN; carts are\nkept separate.<\/p>\n<\/div>\n<h2 id=\"selling-at-the-terminal\">Selling at the terminal<\/h2>\n<h3 id=\"adding-items\">Adding items<\/h3>\n<ul>\n<li><strong>Scan a barcode<\/strong> into the barcode box (type it and\npress Enter), or tap a <strong>product tile<\/strong>, or <strong>search\nby name or SKU<\/strong>. The category tiles filter the product tiles.\n\"Showing the first 200 matches\" means: type more to narrow the\nsearch.<\/li>\n<li>Each line shows <strong>Item, Qty, Discount, Price<\/strong>. Use the\npencil to change quantity, the bin to remove a line. For serial-numbered\ngoods the terminal asks for the <strong>Serial no(s)<\/strong>.\nQuantities may be decimal where the product allows it (for example\n2.5).<\/li>\n<li>The cart shows <strong>Subtotal<\/strong>, <strong>Tax<\/strong>, any\n<strong>Discount on the sale<\/strong> and the\n<strong>Total<\/strong>.<\/li>\n<\/ul>\n<h3 id=\"customer\">Customer<\/h3>\n<p>Use the customer box to <strong>search by name or phone<\/strong>, or\npress <strong>Add<\/strong> to create one on the spot (name, phone,\ne-mail, <strong>Tax ID<\/strong>), which selects them for this sale. The\nbox shows if the customer <strong>Owes<\/strong> money, their\n<strong>available credit<\/strong>, and their <strong>loyalty\npoints<\/strong> and what the points are worth.<\/p>\n<h3 id=\"discounts\">Discounts<\/h3>\n<ul>\n<li><strong>% Discount<\/strong> gives a discount on the sale: choose\n<strong>Percent<\/strong> or <strong>Amount<\/strong>, enter it and a\n<strong>Reason<\/strong>.<\/li>\n<li>A cashier can give a discount only up to the limit in POS settings.\nA bigger one needs a manager's PIN (the <strong>Manager PIN<\/strong>\nbox). A reason is required when POS settings say so.<\/li>\n<li><strong>Promotions<\/strong> (such as buy-X-get-Y) apply\nautomatically and the cart shows <em>Saved with promotions<\/em>. Type a\n<strong>Coupon code<\/strong> and press <strong>Apply<\/strong> for\ncoupons.<\/li>\n<li>If your price differs from the product's price, the line shows\n<em>Price changed<\/em>. A manager may need to approve, and prices below\ncost may be refused.<\/li>\n<\/ul>\n<h3 id=\"several-carts-hold-and-discard\">Several carts: hold and\ndiscard<\/h3>\n<ul>\n<li><strong>+<\/strong> starts another cart tab. <strong>Hold<\/strong>\nparks the cart with a note and opens a new one. <strong>Discard<\/strong>\ncancels an open cart outright (stock is untouched).<\/li>\n<\/ul>\n<h3 id=\"payment-checkout\">Payment (checkout)<\/h3>\n<p>Press <strong>Payment<\/strong>. On <strong>Checkout<\/strong> choose\nhow the customer pays. Tap a payment method to enter an amount; you can\n<strong>split the payment across several methods<\/strong>.<\/p>\n<ul>\n<li><strong>Gift card<\/strong>: type the <strong>Gift card\ncode<\/strong>, press <strong>Check balance<\/strong>, then <strong>Use on\nthis sale<\/strong>.<\/li>\n<li><strong>Loyalty points<\/strong>: shows the points available and what\nthey are worth; enter the <strong>Points<\/strong> and press <strong>Use\npoints<\/strong>. Points can be used only when the amount reaches the\nminimum.<\/li>\n<li><strong>Store credit<\/strong> (credit sale): select a customer\nfirst. The customer must be enabled for credit (set on the customer\nrecord) and within their limit. You may set a <strong>Due date<\/strong>;\notherwise the customer's own payment term is used.<\/li>\n<li><strong>Charge to room<\/strong> (hotels): choose the guest who is\nchecked in and the <strong>Room<\/strong>.<\/li>\n<\/ul>\n<p>Press the final button to complete the sale. The receipt prints.\nChange due is shown for cash.<\/p>\n<h3 id=\"receipts-and-reprints\">Receipts and reprints<\/h3>\n<p><strong>Receipts<\/strong> shows this shift's completed sales (Time,\nInvoice, Customer, Total, Payment) with <strong>View / Reprint<\/strong>.\nThe first print is the original; each later print is marked <strong>COPY\n1, COPY 2...<\/strong> and is listed in <strong>Voids &amp;\nreturns<\/strong>.<\/p>\n<h3 id=\"gift-cards-at-the-till\">Gift cards at the till<\/h3>\n<p><strong>Gift card<\/strong> lets you <strong>Check / add\nmoney<\/strong> (type the code and press <strong>Check<\/strong>, see the\nbalance and expiry, then <strong>Add money<\/strong>) or <strong>Sell a\nnew card<\/strong> (amount, how it was paid, who it is for), and gives\nyou the code to hand over.<\/p>\n<h3 id=\"customer-display\">Customer display<\/h3>\n<p><strong>Customer display<\/strong> opens a second window for the\ncustomer showing the cart and total, then <em>Thank you<\/em>. Drag it to\nthe customer-facing screen.<\/p>\n<h3 id=\"offline-mode\">Offline mode<\/h3>\n<p>If the connection drops, the terminal shows <strong>Offline<\/strong>\nand keeps working from the catalogue of the last sync. Sales you ring up\nare <strong>queued<\/strong> on the PC (<strong>Offline queue<\/strong>)\nand sync automatically when the connection returns. Credit limits and\nsome checks are applied only when the sale syncs; a sale that cannot be\naccepted appears as <em>Failed<\/em> in the queue for review, where you\ncan <strong>Discard<\/strong> it or ask a manager.<\/p>\n<div class=\"callout warning\">\n<p><strong>Warning:<\/strong> Do not clear the browser's data or close\nthe browser while sales are waiting in the offline queue.<\/p>\n<\/div>\n<h3 id=\"other-terminal-buttons\">Other terminal buttons<\/h3>\n<p><strong>Cash<\/strong> (cash control), <strong>X report<\/strong>,\n<strong>Open drawer<\/strong>, <strong>Devices<\/strong> (printer set-up),\n<strong>Switch cashier<\/strong>, <strong>End my session<\/strong> (ends\n<em>your<\/em> session on the shift and discards carts you never checked\nout) and <strong>Exit<\/strong>.<\/p>\n<h2 id=\"cash-during-the-shift\">Cash during the shift<\/h2>\n<p>Press <strong>Cash<\/strong> to open the cash drawer screen. It shows\n<strong>Opening float, Cash sales, Cash refunds, Paid in, Paid out,\nDropped into the safe<\/strong> and <strong>Cash that should be in the\ndrawer<\/strong>.<\/p>\n<ul>\n<li><strong>Record<\/strong> a movement: choose the kind (<em>paid\nin<\/em>, <em>paid out<\/em>, <em>drop into the safe<\/em>), the\n<strong>Amount<\/strong>, and <strong>What was it for?<\/strong> A\npaid-out above the limit needs a <strong>Manager's PIN<\/strong>. If the\ndrawer holds more than the reminder level, you are told to drop some\ncash into the safe.<\/li>\n<li><strong>Count the drawer without closing the shift<\/strong> gives a\nspot check: nothing moves, and the difference is kept on record.<\/li>\n<li>A mistaken movement can be <strong>voided<\/strong> (a manager may be\nneeded). Voided movements stay visible.<\/li>\n<\/ul>\n<p>The page also has buttons for the <strong>X report<\/strong> and\n<strong>Z report<\/strong>, and <strong>Close the shift<\/strong>.<\/p>\n<h2 id=\"x-and-z-reports\">X and Z reports<\/h2>\n<ul>\n<li><strong>X report<\/strong>: a mid-shift snapshot of sales, payments,\nreturns and cash. Run it as often as you like; it changes nothing.<\/li>\n<li><strong>Z report<\/strong>: the closing report, numbered. It is\nprinted when the shift is closed.<\/li>\n<\/ul>\n<p>Both print to the receipt printer if one is set up.<\/p>\n<h2 id=\"closing-a-session\">Closing a session<\/h2>\n<ol type=\"1\">\n<li>Record any cash paid in, paid out or dropped, <strong>before\ncounting<\/strong>.<\/li>\n<li>Open the close screen. It shows <strong>Opening float, Cash sales,\nCash refunds, Paid in, Paid out, Dropped into the safe<\/strong> and\n<strong>Expected cash in drawer<\/strong>, plus <strong>Non-cash sales\n(card/mobile/bank)<\/strong> and <strong>Total sales this\nsession<\/strong>.<\/li>\n<li><strong>Count the drawer<\/strong> by notes and coins (enter the\nnumber of each denomination, or use <strong>+ Another value<\/strong>).\nThe system totals it.<\/li>\n<li>If the count differs from the expected cash by more than the allowed\namount, a note is required: <strong>Why is the count off?<\/strong><\/li>\n<li>Press <strong>Close session<\/strong>, then print the <strong>Z\nreport<\/strong>.<\/li>\n<\/ol>\n<p>Admins can <strong>Force close<\/strong> a shift or <strong>Close all\nsessions<\/strong> from <strong>POS &gt; Shifts<\/strong> if a cashier has\nleft without closing.<\/p>\n<h2 id=\"voids-and-returns\">Voids and returns<\/h2>\n<h3 id=\"returning-goods\">Returning goods<\/h3>\n<p>Use <strong>Process a return<\/strong>: type the <strong>Invoice\nnumber<\/strong> (for example the number on the receipt) and press\n<strong>Find<\/strong>. Choose the lines and <strong>Return qty<\/strong>\n(or <strong>Return all items<\/strong>), the <strong>Refund\nmethod<\/strong> and the <strong>Reason<\/strong>. Returns of old sales\n(older than the limit in POS settings), or refunds above a limit, need a\n<strong>Manager's PIN<\/strong>. Press <strong>Process return<\/strong>; a\nreturn receipt prints.<\/p>\n<h3 id=\"voiding-a-sale\">Voiding a sale<\/h3>\n<p>A sale can be voided only while its shift is open (after that it is a\nreturn). Voiding needs a manager's sign-in or PIN, and usually a\nreason.<\/p>\n<h3 id=\"the-log\">The log<\/h3>\n<p><strong>POS &gt; Voids &amp; returns<\/strong> lists every void,\nreturn, discount, price change and receipt reprint: When, What,\nReference, Customer, Register, By, Amount, Reason and <strong>Approved\nby<\/strong>. Use the search box and the register filter. This is where\nmanagers look when a till is short.<\/p>\n<h2 id=\"shifts-list-supervisors\">Shifts list (supervisors)<\/h2>\n<p><strong>POS &gt; Shifts<\/strong> lists shifts with <strong>Register,\nZ, Cashier, Opened, Closed, Status, Sales, Variance<\/strong>, with\nfilters for register and date, and buttons for <strong>Cash<\/strong>,\n<strong>X report<\/strong> and <strong>Z report<\/strong>. Expand a shift\nto see its <strong>Cashiers<\/strong> and add or end cashier\nsessions.<\/p>\n<h2 id=\"cash-movements-list\">Cash movements list<\/h2>\n<p><strong>POS &gt; Cash movements<\/strong> lists every paid-in,\npaid-out and safe drop (When, Register, What, Reason, Amount, By,\nApproved by), including voided ones.<\/p>\n<h2 id=\"devices\">Devices<\/h2>\n<p><strong>POS &gt; Devices<\/strong> sets up the receipt printer,\nkitchen and bar printers, the cash drawer and the customer display\n<strong>for this PC<\/strong>. Settings are kept in the browser of that\nPC. Your administrator normally does this once (see the Administrator\nManual, chapter 8). Use <strong>Print test page<\/strong> and\n<strong>Open cash drawer<\/strong> to check.<\/p>\n<h2 id=\"reports\">Reports<\/h2>\n<p><strong>POS &gt; Reports<\/strong> has these reports, each with\nfilters and export to Excel, PDF and CSV:<\/p>\n<ul>\n<li><strong>Sales and transactions<\/strong>: Total POS Categories Sales,\nTotal POS Brands Sales, Total POS Products Sales, POS Shifts Sales,\nDetailed POS Shifts Transactions.<\/li>\n<li><strong>Profit<\/strong>: POS Shifts Profit, Total POS Categories\nProfit, Total POS Brands Profit, Total POS Products Profit.<\/li>\n<li><strong>Operations<\/strong>: POS Sales by Cashier, POS Sales by\nHour, POS Sales by Payment Method, <strong>POS Exceptions<\/strong>\n(voids, returns, discounts, price changes, reprints) and POS Shift\nComparison.<\/li>\n<li><strong>Credit<\/strong>: Credit Sale Report, Daily Credit Collection\nReport, Outstanding Credit Report, Overdue Credit Report.<\/li>\n<\/ul>\n<div class=\"callout tip\">\n<p><strong>Tip:<\/strong> Managers should read <strong>POS\nExceptions<\/strong> and <strong>POS Shift Comparison<\/strong> weekly.\nThey show unusual voids, discounts and cash differences by cashier.<\/p>\n<\/div>\n", "text": " The POS (point of sale) group is where cashiers sell, count the till and handle returns. Its menu has: Registers & Terminal, Shifts, Voids & returns, Cash movements, POS settings, Devices, Reports . How a day at the till works A manager or admin opens a session (shift) on a register and assigns it to a cashier, with an opening cash float . The cashier opens the terminal with their PIN and rings up sales. Payments are taken at Checkout . During the shift: cash paid in or out , drops into the safe , returns, and X reports as needed. At the end the shift is closed : the drawer is counted and the difference is recorded. A Z report is printed. A register is the physical till. A session (or shift ) is one working period on a register. One shift can have several cashiers , each with their own PIN and their own carts. Opening a session Go to POS > Registers & Terminal . The list shows each register's Name, Location, Warehouse, Float, Cashiers, Device and Status ( Switched off , Open session , Closed ). Press Open session on the register. In Assign to , choose the staff member who will work the till. Enter the Opening cash float . (The most the till may open with is shown.) Press Open till . If a register is tied to one PC, a note shows Works on ... only and Go to terminal is available only on that PC. Opening the terminal Press Go to terminal on the open session. The terminal asks for your PIN first: type it and press Enter. A wrong PIN leaves the PIN screen up. If you do not have a PIN, ask an admin to set one, or set your own in My profile . Note: Your PIN opens your own working session on the shift. Another cashier can use the same terminal by pressing Switch cashier and typing their PIN; carts are kept separate. Selling at the terminal Adding items Scan a barcode into the barcode box (type it and press Enter), or tap a product tile , or search by name or SKU . The category tiles filter the product tiles. \"Showing the first 200 matches\" means: type more to narrow the search. Each line shows Item, Qty, Discount, Price . Use the pencil to change quantity, the bin to remove a line. For serial-numbered goods the terminal asks for the Serial no(s) . Quantities may be decimal where the product allows it (for example 2.5). The cart shows Subtotal , Tax , any Discount on the sale and the Total . Customer Use the customer box to search by name or phone , or press Add to create one on the spot (name, phone, e-mail, Tax ID ), which selects them for this sale. The box shows if the customer Owes money, their available credit , and their loyalty points and what the points are worth. Discounts % Discount gives a discount on the sale: choose Percent or Amount , enter it and a Reason . A cashier can give a discount only up to the limit in POS settings. A bigger one needs a manager's PIN (the Manager PIN box). A reason is required when POS settings say so. Promotions (such as buy-X-get-Y) apply automatically and the cart shows Saved with promotions . Type a Coupon code and press Apply for coupons. If your price differs from the product's price, the line shows Price changed . A manager may need to approve, and prices below cost may be refused. Several carts: hold and discard + starts another cart tab. Hold parks the cart with a note and opens a new one. Discard cancels an open cart outright (stock is untouched). Payment (checkout) Press Payment . On Checkout choose how the customer pays. Tap a payment method to enter an amount; you can split the payment across several methods . Gift card : type the Gift card code , press Check balance , then Use on this sale . Loyalty points : shows the points available and what they are worth; enter the Points and press Use points . Points can be used only when the amount reaches the minimum. Store credit (credit sale): select a customer first. The customer must be enabled for credit (set on the customer record) and within their limit. You may set a Due date ; otherwise the customer's own payment term is used. Charge to room (hotels): choose the guest who is checked in and the Room . Press the final button to complete the sale. The receipt prints. Change due is shown for cash. Receipts and reprints Receipts shows this shift's completed sales (Time, Invoice, Customer, Total, Payment) with View / Reprint . The first print is the original; each later print is marked COPY 1, COPY 2... and is listed in Voids & returns . Gift cards at the till Gift card lets you Check / add money (type the code and press Check , see the balance and expiry, then Add money ) or Sell a new card (amount, how it was paid, who it is for), and gives you the code to hand over. Customer display Customer display opens a second window for the customer showing the cart and total, then Thank you . Drag it to the customer-facing screen. Offline mode If the connection drops, the terminal shows Offline and keeps working from the catalogue of the last sync. Sales you ring up are queued on the PC ( Offline queue ) and sync automatically when the connection returns. Credit limits and some checks are applied only when the sale syncs; a sale that cannot be accepted appears as Failed in the queue for review, where you can Discard it or ask a manager. Warning: Do not clear the browser's data or close the browser while sales are waiting in the offline queue. Other terminal buttons Cash (cash control), X report , Open drawer , Devices (printer set-up), Switch cashier , End my session (ends your session on the shift and discards carts you never checked out) and Exit . Cash during the shift Press Cash to open the cash drawer screen. It shows Opening float, Cash sales, Cash refunds, Paid in, Paid out, Dropped into the safe and Cash that should be in the drawer . Record a movement: choose the kind ( paid in , paid out , drop into the safe ), the Amount , and What was it for? A paid-out above the limit needs a Manager's PIN . If the drawer holds more than the reminder level, you are told to drop some cash into the safe. Count the drawer without closing the shift gives a spot check: nothing moves, and the difference is kept on record. A mistaken movement can be voided (a manager may be needed). Voided movements stay visible. The page also has buttons for the X report and Z report , and Close the shift . X and Z reports X report : a mid-shift snapshot of sales, payments, returns and cash. Run it as often as you like; it changes nothing. Z report : the closing report, numbered. It is printed when the shift is closed. Both print to the receipt printer if one is set up. Closing a session Record any cash paid in, paid out or dropped, before counting . Open the close screen. It shows Opening float, Cash sales, Cash refunds, Paid in, Paid out, Dropped into the safe and Expected cash in drawer , plus Non-cash sales (card/mobile/bank) and Total sales this session . Count the drawer by notes and coins (enter the number of each denomination, or use + Another value ). The system totals it. If the count differs from the expected cash by more than the allowed amount, a note is required: Why is the count off? Press Close session , then print the Z report . Admins can Force close a shift or Close all sessions from POS > Shifts if a cashier has left without closing. Voids and returns Returning goods Use Process a return : type the Invoice number (for example the number on the receipt) and press Find . Choose the lines and Return qty (or Return all items ), the Refund method and the Reason . Returns of old sales (older than the limit in POS settings), or refunds above a limit, need a Manager's PIN . Press Process return ; a return receipt prints. Voiding a sale A sale can be voided only while its shift is open (after that it is a return). Voiding needs a manager's sign-in or PIN, and usually a reason. The log POS > Voids & returns lists every void, return, discount, price change and receipt reprint: When, What, Reference, Customer, Register, By, Amount, Reason and Approved by . Use the search box and the register filter. This is where managers look when a till is short. Shifts list (supervisors) POS > Shifts lists shifts with Register, Z, Cashier, Opened, Closed, Status, Sales, Variance , with filters for register and date, and buttons for Cash , X report and Z report . Expand a shift to see its Cashiers and add or end cashier sessions. Cash movements list POS > Cash movements lists every paid-in, paid-out and safe drop (When, Register, What, Reason, Amount, By, Approved by), including voided ones. Devices POS > Devices sets up the receipt printer, kitchen and bar printers, the cash drawer and the customer display for this PC . Settings are kept in the browser of that PC. Your administrator normally does this once (see the Administrator Manual, chapter 8). Use Print test page and Open cash drawer to check. Reports POS > Reports has these reports, each with filters and export to Excel, PDF and CSV: Sales and transactions : Total POS Categories Sales, Total POS Brands Sales, Total POS Products Sales, POS Shifts Sales, Detailed POS Shifts Transactions. Profit : POS Shifts Profit, Total POS Categories Profit, Total POS Brands Profit, Total POS Products Profit. Operations : POS Sales by Cashier, POS Sales by Hour, POS Sales by Payment Method, POS Exceptions (voids, returns, discounts, price changes, reprints) and POS Shift Comparison. Credit : Credit Sale Report, Daily Credit Collection Report, Outstanding Credit Report, Overdue Credit Report. Tip: Managers should read POS Exceptions and POS Shift Comparison weekly. They show unusual voids, discounts and cash differences by cashier. "}, {"id": "user-3-sales", "manual": "user", "n": 3, "title": "Sales", "html": "\n<p>The <strong>Sales<\/strong> group (back-office selling, as opposed to\nthe till) has: <strong>Quotations, Sale orders, Price lists, Customer\ngroups, Sale order returns, Invoices, Recurring invoices, Credit notes,\nReports, Settings<\/strong>. Promotions, gift cards and loyalty (switched\non in <strong>Sales &gt; Settings<\/strong>) have their own pages.<\/p>\n<h2 id=\"the-selling-path\">The selling path<\/h2>\n<p>For business-to-business or on-account selling the usual path is:<\/p>\n<p><strong>Quotation<\/strong> (an offer) → <strong>Sale order<\/strong>\n(the customer has agreed) → <strong>Fulfil<\/strong> (deliver the goods)\n→ <strong>Invoice<\/strong> (ask for payment) → <strong>Record\npayment<\/strong>.<\/p>\n<p>You can start at any step: an invoice can be raised without a\nquotation or order.<\/p>\n<h2 id=\"quotations\">Quotations<\/h2>\n<p>A quotation is an offer with a validity date. It does not move stock\nor accounting.<\/p>\n<ol type=\"1\">\n<li><strong>Sales &gt; Quotations &gt; New<\/strong>.<\/li>\n<li>Choose the <strong>Customer<\/strong> (or press <strong>+ New\ncustomer<\/strong> to add one: name, phone, e-mail, Tax ID).<\/li>\n<li>Optionally set <strong>Valid until<\/strong>, <strong>Branch<\/strong>\n(if you have several), and <strong>Notes<\/strong>.<\/li>\n<li>Optionally set a <strong>Discount (whole quotation)<\/strong> as a\n<strong>Percentage<\/strong> or <strong>Fixed amount<\/strong> (this field\nappears only when your administrator set discounts to <em>Global<\/em>;\nin <em>Per line<\/em> mode each line has its own <strong>Discount\n%<\/strong>).<\/li>\n<li>Under <strong>Line items<\/strong>, search a product by name, SKU or\ncode. The list shows stock and price. Set <strong>Quantity<\/strong> and\n<strong>Unit price<\/strong>. <strong>+ New product<\/strong> adds a quick\nproduct (name, unit price, description) that you complete later.<\/li>\n<li>Check the totals (<strong>Subtotal, Tax, Discount, Grand\ntotal<\/strong>) and press <strong>Save draft<\/strong>.<\/li>\n<\/ol>\n<p>On the quotation, buttons follow its status: <strong>Edit<\/strong>,\n<strong>Send to customer<\/strong> (e-mails the PDF, status\n<em>Sent<\/em>), <strong>Mark accepted<\/strong>, <strong>Mark\nexpired<\/strong>, <strong>Reject<\/strong>, and <strong>Convert to sale\norder<\/strong>. Statuses: <em>Draft, Sent, Accepted, Rejected,\nExpired<\/em>.<\/p>\n<div class=\"callout tip\">\n<p><strong>Tip:<\/strong> If the customer belongs to a <em>customer\ngroup<\/em>, the group's price list is used for the prices\nautomatically.<\/p>\n<\/div>\n<h2 id=\"sale-orders\">Sale orders<\/h2>\n<p>A sale order records what the customer has agreed to buy. It reserves\nnothing until you fulfil it.<\/p>\n<ol type=\"1\">\n<li><strong>Sales &gt; Sale orders &gt; New<\/strong> (or <strong>Convert\nto sale order<\/strong> on a quotation). The form is the same as a\nquotation, with <strong>Expected date<\/strong>.<\/li>\n<li><strong>Save draft<\/strong>. Press <strong>Confirm<\/strong> when it\nis agreed. A confirmed order cannot be freely edited; use <strong>Cancel\norder<\/strong> if it will not go ahead.<\/li>\n<li><strong>Fulfil order<\/strong>: choose <strong>Fulfil from<\/strong>\n(the warehouse or location), enter <strong>Fulfilling now<\/strong> for\neach line (the remaining quantity is shown), enter <strong>Serial\nnumbers delivered<\/strong> if the product is serial-tracked (otherwise\nthe oldest in stock is used), and press <strong>Record\nfulfillment<\/strong>. Stock goes down. Partly delivered orders are\n<em>Partially fulfilled<\/em>; when everything is delivered it is\n<em>Fulfilled<\/em>. You can print a <strong>delivery note<\/strong>.<\/li>\n<li><strong>Generate invoice<\/strong> creates the invoice for the order;\n<strong>View invoice<\/strong> opens it.<\/li>\n<\/ol>\n<p>The order page shows <strong>Paid<\/strong>,\n<strong>Outstanding<\/strong>, <strong>Returned<\/strong> and\n<strong>Refund due to customer<\/strong>.<\/p>\n<h3 id=\"returns-on-a-sale-order\">Returns on a sale order<\/h3>\n<p><strong>Process a return<\/strong> lets you choose what the customer\nis returning (<strong>Returning now<\/strong>), where to put the stock\nback (<strong>Return stock to<\/strong>) and a <strong>Reason<\/strong>.\nThe return appears under <strong>Return history<\/strong> and in\n<strong>Sales &gt; Sale order returns<\/strong>. A <strong>Refund\ndue<\/strong> amount is created if the order was already paid.<\/p>\n<h2 id=\"invoices\">Invoices<\/h2>\n<p><strong>Sales &gt; Invoices<\/strong> lists all invoices (search by\ninvoice number, customer or sale order; filter by status, date and\nbranch).<\/p>\n<ul>\n<li><strong>New invoice<\/strong>: same form as an order, plus\n<strong>Due date<\/strong>. Press <strong>Save draft<\/strong>.<\/li>\n<li>A <strong>Draft<\/strong> can still be edited or deleted\n(<strong>Delete draft<\/strong>). Press <strong>Issue invoice<\/strong> to\nmake it official: it gets its number, posts to accounting, reduces stock\nif not already fulfilled, and may be e-mailed to the customer and to the\ninvoice-receiver list set in Sales settings.<\/li>\n<li><strong>Record payment<\/strong>: enter the <strong>Payment\namount<\/strong> (up to the outstanding), the <strong>Payment\nmethod<\/strong> and an optional <strong>Note<\/strong>. Part-payments are\nnormal. <strong>Payment history for this invoice<\/strong> shows each\nreceipt. <strong>Record another payment<\/strong> for further\ninstalments.<\/li>\n<li><strong>Pay in instalments<\/strong> (if the Installments module is\non) turns an unpaid invoice into a payment plan.<\/li>\n<li>Mistakes after issuing: <strong>Void invoice<\/strong> (give a\nreason; nothing has been paid) or <strong>Cancel &amp; credit\ninvoice<\/strong> (when payments exist: you choose to\n<strong>Refund<\/strong> by a method or move the money to\n<strong>Customer credit<\/strong>). Both create a <strong>credit\nnote<\/strong>.<\/li>\n<\/ul>\n<p>Statuses: <em>Draft, Issued, Partially paid, Paid, Void,\nCancelled<\/em>.<\/p>\n<h2 id=\"credit-notes\">Credit notes<\/h2>\n<p><strong>Sales &gt; Credit notes<\/strong> lists credit notes (Credit\nnote #, Invoice #, Customer, Voided, Reason, Amount) with <strong>View\ninvoice<\/strong> and <strong>Print<\/strong>. A credit note is issued\nautomatically when an invoice is voided or cancelled; you do not create\none by hand.<\/p>\n<h2 id=\"recurring-invoices\">Recurring invoices<\/h2>\n<p>For regular billing (a monthly retainer, rent, service fees).<\/p>\n<ol type=\"1\">\n<li><strong>Sales &gt; Recurring invoices &gt; New<\/strong>.<\/li>\n<li>Give it a <strong>Name<\/strong>, the <strong>Customer<\/strong>, the\n<strong>Frequency<\/strong> (<em>Weekly, Monthly, Quarterly,\nYearly<\/em>), the <strong>Next run date<\/strong>, and <strong>Due in\ndays<\/strong>.<\/li>\n<li>Add the lines; the <strong>Grand total (each cycle)<\/strong> is\nshown.<\/li>\n<li>Tick <strong>Active<\/strong> and save.<\/li>\n<\/ol>\n<p>A daily job generates the next invoice on or after the next run date,\nthen moves the date forward one cycle. Untick <strong>Active<\/strong> to\npause.<\/p>\n<h2 id=\"price-lists-and-customer-groups\">Price lists and customer\ngroups<\/h2>\n<ul>\n<li><strong>Price lists<\/strong> hold special prices. A list can set a\nprice for individual products (even a lower price for bigger quantities)\nand move every other product up or down by a percentage (<strong>Adjust\nall other products by (%)<\/strong>: -10 means 10% below normal). It can\nbe limited by <strong>Valid from / Valid to<\/strong> and switched on or\noff.<\/li>\n<li><strong>Customer groups<\/strong> put customers in a group and give\nthe group a price list. At the till, and on invoices, quotations and\nsale orders, those customers then get the list's prices. Use <strong>Add\ncustomers<\/strong> on the group to assign members.<\/li>\n<li>A price you type by hand is never replaced by a price list.<\/li>\n<\/ul>\n<h2 id=\"promotions-and-coupons\">Promotions and coupons<\/h2>\n<p><strong>Sales &gt; Promotions<\/strong> (when switched on). Press\n<strong>New promotion<\/strong>:<\/p>\n<ul>\n<li><strong>What it does<\/strong>: <em>Percent off<\/em>, <em>Amount\noff<\/em>, or <em>Buy some, get some free<\/em> (for example buy 2 get 1\nfree, repeating).<\/li>\n<li><strong>It applies to<\/strong>: <em>One product<\/em>, <em>A\ncategory<\/em> or <em>The whole cart<\/em>.<\/li>\n<li>Optional: <strong>Needs at least this spend<\/strong>, <strong>Valid\nfrom/to<\/strong>, <strong>Coupon code<\/strong> (with a code the\npromotion works only when the cashier types it), <strong>Customer\ngroup<\/strong>, and limits on total uses and uses per customer.<\/li>\n<li>The list shows each promotion's <strong>Used<\/strong> count;\n<strong>Sales<\/strong> lists the sales that used it.<\/li>\n<\/ul>\n<p>The till works out promotions by itself: each line gets the one best\npromotion for its product or category, then the one best whole-cart\npromotion comes off what is left, after any discount the cashier typed.\nPromotions apply at the till, not on invoices, quotations or sale\norders. The Online Store also uses them: a product with no online price\nfollows the price list chosen in the shop settings and the best percent\nor amount promotion for everybody on the product or its category\n(promotions that need a coupon, a customer group, a limit, a minimum,\n\"buy X get Y\" or that cover the whole cart are not applied online; see\nthe Online Store chapter).<\/p>\n<h2 id=\"gift-cards\">Gift cards<\/h2>\n<p><strong>Sales &gt; Gift cards<\/strong> (when switched on).\n<strong>Sell a gift card<\/strong>: the <strong>Amount<\/strong>,\n<strong>Paid by<\/strong> (or <em>Given free<\/em>), <strong>Bought\nby<\/strong>, <strong>For<\/strong>, <strong>Expires on<\/strong> and a\n<strong>Card code<\/strong> (made for you if empty).<\/p>\n<div class=\"callout note\">\n<p><strong>Note:<\/strong> Money paid for a gift card is <strong>not\nsales yet<\/strong>. The shop owes it back as goods, shown as\n<strong>Owed on gift cards<\/strong>. It becomes sales when the card is\nspent at the till.<\/p>\n<\/div>\n<p>On the list you can see a card's <strong>History<\/strong>,\n<strong>Add money<\/strong>, change its <strong>Expiry<\/strong>,\n<strong>Block<\/strong> or <strong>Unblock<\/strong> it. Filters: <em>Can\nbe spent now, Money left, Empty, Blocked, Expired<\/em>. <strong>Release\nexpired balances<\/strong> moves expired, unspent balances from \"owed\"\ninto income.<\/p>\n<h2 id=\"loyalty-points\">Loyalty points<\/h2>\n<p><strong>Sales &gt; Loyalty<\/strong> (when switched on). A named\ncustomer earns points on every sale (the walk-in customer does not).\nPoints can pay part of a later sale at the till.<\/p>\n<p>Rules (set by a manager): spend per point, points earned, what\n<strong>one point is worth<\/strong>, the <strong>fewest points that can\nbe spent at once<\/strong>, and the maximum percentage of a sale that\npoints can pay. Open a customer from the list to see their\n<strong>History<\/strong> or to <strong>Add or take away points<\/strong>\n(use a minus to take away) with a <strong>Reason<\/strong>.<\/p>\n<h2 id=\"sales-settings\">Sales settings<\/h2>\n<p>Admin only: switch <strong>Promotions, Gift cards, Loyalty\npoints<\/strong> on or off and set the <strong>Invoice receiver\nemails<\/strong>.<\/p>\n<h2 id=\"reports\">Reports<\/h2>\n<p><strong>Sales &gt; Reports<\/strong>: Sales Orders, Sales by Customer,\nSales by Product, Sales by Category, Invoices, Credit Notes, Sale Order\nReturns, Customer Payments, <strong>Receivables Aging<\/strong>. Each has\ndate and other filters and exports to Excel, PDF and CSV.<\/p>\n", "text": " The Sales group (back-office selling, as opposed to the till) has: Quotations, Sale orders, Price lists, Customer groups, Sale order returns, Invoices, Recurring invoices, Credit notes, Reports, Settings . Promotions, gift cards and loyalty (switched on in Sales > Settings ) have their own pages. The selling path For business-to-business or on-account selling the usual path is: Quotation (an offer) → Sale order (the customer has agreed) → Fulfil (deliver the goods) → Invoice (ask for payment) → Record payment . You can start at any step: an invoice can be raised without a quotation or order. Quotations A quotation is an offer with a validity date. It does not move stock or accounting. Sales > Quotations > New . Choose the Customer (or press + New customer to add one: name, phone, e-mail, Tax ID). Optionally set Valid until , Branch (if you have several), and Notes . Optionally set a Discount (whole quotation) as a Percentage or Fixed amount (this field appears only when your administrator set discounts to Global ; in Per line mode each line has its own Discount % ). Under Line items , search a product by name, SKU or code. The list shows stock and price. Set Quantity and Unit price . + New product adds a quick product (name, unit price, description) that you complete later. Check the totals ( Subtotal, Tax, Discount, Grand total ) and press Save draft . On the quotation, buttons follow its status: Edit , Send to customer (e-mails the PDF, status Sent ), Mark accepted , Mark expired , Reject , and Convert to sale order . Statuses: Draft, Sent, Accepted, Rejected, Expired . Tip: If the customer belongs to a customer group , the group's price list is used for the prices automatically. Sale orders A sale order records what the customer has agreed to buy. It reserves nothing until you fulfil it. Sales > Sale orders > New (or Convert to sale order on a quotation). The form is the same as a quotation, with Expected date . Save draft . Press Confirm when it is agreed. A confirmed order cannot be freely edited; use Cancel order if it will not go ahead. Fulfil order : choose Fulfil from (the warehouse or location), enter Fulfilling now for each line (the remaining quantity is shown), enter Serial numbers delivered if the product is serial-tracked (otherwise the oldest in stock is used), and press Record fulfillment . Stock goes down. Partly delivered orders are Partially fulfilled ; when everything is delivered it is Fulfilled . You can print a delivery note . Generate invoice creates the invoice for the order; View invoice opens it. The order page shows Paid , Outstanding , Returned and Refund due to customer . Returns on a sale order Process a return lets you choose what the customer is returning ( Returning now ), where to put the stock back ( Return stock to ) and a Reason . The return appears under Return history and in Sales > Sale order returns . A Refund due amount is created if the order was already paid. Invoices Sales > Invoices lists all invoices (search by invoice number, customer or sale order; filter by status, date and branch). New invoice : same form as an order, plus Due date . Press Save draft . A Draft can still be edited or deleted ( Delete draft ). Press Issue invoice to make it official: it gets its number, posts to accounting, reduces stock if not already fulfilled, and may be e-mailed to the customer and to the invoice-receiver list set in Sales settings. Record payment : enter the Payment amount (up to the outstanding), the Payment method and an optional Note . Part-payments are normal. Payment history for this invoice shows each receipt. Record another payment for further instalments. Pay in instalments (if the Installments module is on) turns an unpaid invoice into a payment plan. Mistakes after issuing: Void invoice (give a reason; nothing has been paid) or Cancel & credit invoice (when payments exist: you choose to Refund by a method or move the money to Customer credit ). Both create a credit note . Statuses: Draft, Issued, Partially paid, Paid, Void, Cancelled . Credit notes Sales > Credit notes lists credit notes (Credit note #, Invoice #, Customer, Voided, Reason, Amount) with View invoice and Print . A credit note is issued automatically when an invoice is voided or cancelled; you do not create one by hand. Recurring invoices For regular billing (a monthly retainer, rent, service fees). Sales > Recurring invoices > New . Give it a Name , the Customer , the Frequency ( Weekly, Monthly, Quarterly, Yearly ), the Next run date , and Due in days . Add the lines; the Grand total (each cycle) is shown. Tick Active and save. A daily job generates the next invoice on or after the next run date, then moves the date forward one cycle. Untick Active to pause. Price lists and customer groups Price lists hold special prices. A list can set a price for individual products (even a lower price for bigger quantities) and move every other product up or down by a percentage ( Adjust all other products by (%) : -10 means 10% below normal). It can be limited by Valid from / Valid to and switched on or off. Customer groups put customers in a group and give the group a price list. At the till, and on invoices, quotations and sale orders, those customers then get the list's prices. Use Add customers on the group to assign members. A price you type by hand is never replaced by a price list. Promotions and coupons Sales > Promotions (when switched on). Press New promotion : What it does : Percent off , Amount off , or Buy some, get some free (for example buy 2 get 1 free, repeating). It applies to : One product , A category or The whole cart . Optional: Needs at least this spend , Valid from/to , Coupon code (with a code the promotion works only when the cashier types it), Customer group , and limits on total uses and uses per customer. The list shows each promotion's Used count; Sales lists the sales that used it. The till works out promotions by itself: each line gets the one best promotion for its product or category, then the one best whole-cart promotion comes off what is left, after any discount the cashier typed. Promotions apply at the till, not on invoices, quotations or sale orders. The Online Store also uses them: a product with no online price follows the price list chosen in the shop settings and the best percent or amount promotion for everybody on the product or its category (promotions that need a coupon, a customer group, a limit, a minimum, \"buy X get Y\" or that cover the whole cart are not applied online; see the Online Store chapter). Gift cards Sales > Gift cards (when switched on). Sell a gift card : the Amount , Paid by (or Given free ), Bought by , For , Expires on and a Card code (made for you if empty). Note: Money paid for a gift card is not sales yet . The shop owes it back as goods, shown as Owed on gift cards . It becomes sales when the card is spent at the till. On the list you can see a card's History , Add money , change its Expiry , Block or Unblock it. Filters: Can be spent now, Money left, Empty, Blocked, Expired . Release expired balances moves expired, unspent balances from \"owed\" into income. Loyalty points Sales > Loyalty (when switched on). A named customer earns points on every sale (the walk-in customer does not). Points can pay part of a later sale at the till. Rules (set by a manager): spend per point, points earned, what one point is worth , the fewest points that can be spent at once , and the maximum percentage of a sale that points can pay. Open a customer from the list to see their History or to Add or take away points (use a minus to take away) with a Reason . Sales settings Admin only: switch Promotions, Gift cards, Loyalty points on or off and set the Invoice receiver emails . Reports Sales > Reports : Sales Orders, Sales by Customer, Sales by Product, Sales by Category, Invoices, Credit Notes, Sale Order Returns, Customer Payments, Receivables Aging . Each has date and other filters and exports to Excel, PDF and CSV. "}, {"id": "user-4-customers", "manual": "user", "n": 4, "title": "Customers", "html": "\n<p>The <strong>Customers<\/strong> group has: <strong>Customer statement,\nCustomer payments, Collections<\/strong>. The customer list itself is\nunder <strong>Customers<\/strong> (the list of people and companies you\nsell to).<\/p>\n<h2 id=\"adding-and-editing-a-customer\">Adding and editing a\ncustomer<\/h2>\n<p><strong>Customers &gt; New<\/strong> (or the <strong>Add<\/strong>\nbutton at the till for a quick one). Fields:<\/p>\n<ul>\n<li><strong>Name<\/strong>, <strong>Phone<\/strong>,\n<strong>Email<\/strong>, <strong>Tax ID<\/strong> (needed for tax invoices\nto businesses).<\/li>\n<li><strong>Customer group (price list)<\/strong>: <em>None (normal\nprices)<\/em> or a group (see the Sales chapter).<\/li>\n<li><strong>Allow this customer to buy on credit<\/strong>: store credit.\n<strong>Only an administrator can change this.<\/strong> When on, set the\n<strong>Credit limit<\/strong> and the <strong>Default payment term\n(days)<\/strong>; leave the term blank for no default due date.<\/li>\n<\/ul>\n<p>The customer page shows <strong>Credit enabled / Credit off<\/strong>\nand buttons <strong>Edit, Invoices, Payments, Statement, Record\npayment<\/strong>.<\/p>\n<div class=\"callout note\">\n<p><strong>Note:<\/strong> Customers are never deleted if they have\nhistory. Untick or deactivate instead. Merge duplicates by asking an\nadministrator.<\/p>\n<\/div>\n<h2 id=\"credit-sales-and-limits\">Credit sales and limits<\/h2>\n<p>A customer with credit enabled may buy on account at the till or on\nan invoice, up to the <strong>Credit limit<\/strong>. The terminal shows\n<strong>Owes ...<\/strong> and <strong>available credit<\/strong> next to\nthe customer. A sale that would go over the limit is refused (offline\nsales are checked when they sync).<\/p>\n<h2 id=\"recording-a-customer-payment\">Recording a customer payment<\/h2>\n<p>From the customer page press <strong>Record payment<\/strong>, or from\nan invoice use <strong>Record payment<\/strong>.<\/p>\n<ol type=\"1\">\n<li>Enter the <strong>Payment amount<\/strong> and <strong>Payment\nmethod<\/strong>.<\/li>\n<li>Optionally add a <strong>Note<\/strong>.<\/li>\n<li>The payment is applied to the customer's oldest unpaid items first,\nunless you are paying a specific invoice.<\/li>\n<\/ol>\n<p><strong>Customers &gt; Customer payments<\/strong> lists all payments\n(Type, Receipt #, Customer, Date, Amount, Method, Recorded by, Note,\nApplied to), with <strong>View details<\/strong>. Switch on <strong>Show\nevery customer's payments<\/strong> to see everyone's.<\/p>\n<h2 id=\"customer-statement\">Customer statement<\/h2>\n<p><strong>Customers &gt; Customer statement<\/strong>: choose the\n<strong>Customer<\/strong> and the <strong>From<\/strong> and\n<strong>To<\/strong> dates. The statement lists every invoice (Invoice,\nDate, Register, Cashier, Items, Subtotal, Tax, Grand total, Payment,\nCredit, Due date, <strong>Outstanding<\/strong>) with totals.\n<strong>Export Excel<\/strong> or <strong>Export PDF<\/strong>, or e-mail\nit from Collections.<\/p>\n<h2 id=\"collections-who-owes-you-money\">Collections (who owes you\nmoney)<\/h2>\n<p><strong>Customers &gt; Collections<\/strong> is the credit\ncontroller's daily screen.<\/p>\n<ul>\n<li>At the top: <strong>Customers owe ...<\/strong> in total and how much\nof it is <strong>overdue<\/strong>, split by <strong>How late<\/strong>:\n<em>Not yet due, 1 to 30 days, 31 to 60 days, 61 to 90 days, Over 90\ndays<\/em>. Click an amount to list the items behind it.<\/li>\n<li>Three tabs: <strong>By customer<\/strong>, <strong>Unpaid\nitems<\/strong>, <strong>Reminders sent<\/strong>.<\/li>\n<li>Filters: search by customer, phone or number; <strong>Overdue\nonly<\/strong>; <strong>All branches<\/strong>.<\/li>\n<li><strong>Send reminder<\/strong>: tick the customers to remind and\npress <strong>Send reminder to ... chosen<\/strong>. Each customer gets\none e-mail listing everything overdue, with their statement attached. Or\nuse the <strong>PDF<\/strong> and <strong>E-mail<\/strong> buttons on a\nsingle row.<\/li>\n<li><strong>Automatic reminders<\/strong> can be switched on by the\nadministrator.<\/li>\n<li><strong>Export<\/strong> buttons give Excel, PDF and CSV.<\/li>\n<\/ul>\n<p>Counted here: issued invoices and till sales made on credit that are\nnot paid in full. An item with no due date falls due after the\ncustomer's default payment term (or immediately if there is none).<\/p>\n<div class=\"callout warning\">\n<p><strong>Warning:<\/strong> E-mail must be set up (Administrator\nManual, chapter 9) for reminders and statements to be sent. The page\ntells you if it is not.<\/p>\n<\/div>\n<h2 id=\"reports\">Reports<\/h2>\n<p>Customer-related reports are in <strong>Sales &gt; Reports<\/strong>:\nSales by Customer, Customer Payments, Receivables Aging; and in\n<strong>POS &gt; Reports<\/strong> (Credit): Credit Sale Report, Daily\nCredit Collection Report, Outstanding Credit Report, Overdue Credit\nReport.<\/p>\n", "text": " The Customers group has: Customer statement, Customer payments, Collections . The customer list itself is under Customers (the list of people and companies you sell to). Adding and editing a customer Customers > New (or the Add button at the till for a quick one). Fields: Name , Phone , Email , Tax ID (needed for tax invoices to businesses). Customer group (price list) : None (normal prices) or a group (see the Sales chapter). Allow this customer to buy on credit : store credit. Only an administrator can change this. When on, set the Credit limit and the Default payment term (days) ; leave the term blank for no default due date. The customer page shows Credit enabled / Credit off and buttons Edit, Invoices, Payments, Statement, Record payment . Note: Customers are never deleted if they have history. Untick or deactivate instead. Merge duplicates by asking an administrator. Credit sales and limits A customer with credit enabled may buy on account at the till or on an invoice, up to the Credit limit . The terminal shows Owes ... and available credit next to the customer. A sale that would go over the limit is refused (offline sales are checked when they sync). Recording a customer payment From the customer page press Record payment , or from an invoice use Record payment . Enter the Payment amount and Payment method . Optionally add a Note . The payment is applied to the customer's oldest unpaid items first, unless you are paying a specific invoice. Customers > Customer payments lists all payments (Type, Receipt #, Customer, Date, Amount, Method, Recorded by, Note, Applied to), with View details . Switch on Show every customer's payments to see everyone's. Customer statement Customers > Customer statement : choose the Customer and the From and To dates. The statement lists every invoice (Invoice, Date, Register, Cashier, Items, Subtotal, Tax, Grand total, Payment, Credit, Due date, Outstanding ) with totals. Export Excel or Export PDF , or e-mail it from Collections. Collections (who owes you money) Customers > Collections is the credit controller's daily screen. At the top: Customers owe ... in total and how much of it is overdue , split by How late : Not yet due, 1 to 30 days, 31 to 60 days, 61 to 90 days, Over 90 days . Click an amount to list the items behind it. Three tabs: By customer , Unpaid items , Reminders sent . Filters: search by customer, phone or number; Overdue only ; All branches . Send reminder : tick the customers to remind and press Send reminder to ... chosen . Each customer gets one e-mail listing everything overdue, with their statement attached. Or use the PDF and E-mail buttons on a single row. Automatic reminders can be switched on by the administrator. Export buttons give Excel, PDF and CSV. Counted here: issued invoices and till sales made on credit that are not paid in full. An item with no due date falls due after the customer's default payment term (or immediately if there is none). Warning: E-mail must be set up (Administrator Manual, chapter 9) for reminders and statements to be sent. The page tells you if it is not. Reports Customer-related reports are in Sales > Reports : Sales by Customer, Customer Payments, Receivables Aging; and in POS > Reports (Credit): Credit Sale Report, Daily Credit Collection Report, Outstanding Credit Report, Overdue Credit Report. "}, {"id": "user-5-purchases-and-suppliers", "manual": "user", "n": 5, "title": "Purchases and suppliers", "html": "\n<p>The <strong>Purchases<\/strong> group covers buying: <strong>Purchase\nrequisitions, Purchase orders, Bills, Purchase returns,\nReports<\/strong>. <strong>Suppliers<\/strong> has the supplier list,\n<strong>Supplier prices<\/strong>, <strong>Supplier payments<\/strong> and\nthe <strong>Supplier statement<\/strong>.<\/p>\n<h2 id=\"the-buying-path\">The buying path<\/h2>\n<p><strong>Requisition<\/strong> (a request to buy, optional) →\n<strong>Purchase order<\/strong> (sent to the supplier) →\n<strong>Receipt<\/strong> (goods arrive, stock goes up) →\n<strong>Bill<\/strong> (what you owe) → <strong>Supplier\npayment<\/strong>.<\/p>\n<h2 id=\"suppliers\">Suppliers<\/h2>\n<p><strong>Suppliers &gt; New supplier<\/strong>: <strong>Name, Contact\nperson, Phone, Email, Tax ID<\/strong> (VAT or tax registration number),\n<strong>Address<\/strong>, <strong>Notes<\/strong>, and\n<strong>Active<\/strong> (selectable on a new purchase order). Untick\n<em>Active<\/em> for a supplier you no longer use; do not delete a\nsupplier with history.<\/p>\n<p>You can also add a supplier on the spot from a purchase order with\n<strong>+ New supplier<\/strong>.<\/p>\n<h3 id=\"supplier-prices\">Supplier prices<\/h3>\n<p><strong>Supplier prices<\/strong> records agreed costs:\n<strong>Supplier, Product, Unit cost, Valid from, Valid to,\nNote<\/strong>. When you add that product to a purchase order for that\nsupplier the agreed cost is suggested.<\/p>\n<h2 id=\"purchase-requisitions\">Purchase requisitions<\/h2>\n<p>A requisition asks for something to be bought, and goes to someone\nwho may approve it.<\/p>\n<ol type=\"1\">\n<li><strong>Purchase requisitions &gt; New<\/strong>: add\n<strong>Notes<\/strong>, then search products and set <strong>Quantity\nrequested<\/strong> (with an optional note per line).<\/li>\n<li><strong>Save draft<\/strong>, then submit it for approval.<\/li>\n<li>A person with the <em>Approve purchase requisitions<\/em> right\napproves or rejects it. An approved requisition can be turned into a\npurchase order.<\/li>\n<\/ol>\n<div class=\"callout tip\">\n<p><strong>Tip:<\/strong> The <strong>Reorder<\/strong> screen (Inventory)\ncan create a requisition from every product that is low on stock, in one\nclick.<\/p>\n<\/div>\n<h2 id=\"purchase-orders\">Purchase orders<\/h2>\n<ol type=\"1\">\n<li><strong>Purchase orders &gt; New<\/strong>. Choose the\n<strong>Supplier<\/strong>, <strong>Expected date<\/strong> and, if you\nhave several warehouses, <strong>Receive into warehouse<\/strong>.\n(Received stock lands in that warehouse's <em>Receiving<\/em
