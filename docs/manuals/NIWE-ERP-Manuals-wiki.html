day and a time window. A signed-in\ncustomer picks one of the <strong>saved addresses<\/strong> or saves a\nnew one. Then they choose how to pay:<\/p>\n<ul>\n<li><strong>Cash on delivery<\/strong> or <strong>Cash at\npick-up<\/strong>. After <strong>Place order<\/strong> the order reaches\nyou at once.<\/li>\n<li><strong>Mobile money<\/strong> (they type the number to pay from and\napprove on their phone) or <strong>Card<\/strong>. When more than one\nprovider can take the chosen way to pay, a <strong>Pay with<\/strong> row\nshows one button per provider (with its logo when you have added it).\nAfter <strong>Place order and pay<\/strong> the order reaches you only\nonce the payment is <strong>confirmed<\/strong>.<\/li>\n<li>A <strong>coupon code<\/strong> can be typed and checked with\n<strong>Apply<\/strong> before ordering (when you have an active coupon),\nand a signed-in customer can <strong>use loyalty points<\/strong>.<\/li>\n<li>When text messages are on, a box offers updates about the order by\ntext (or WhatsApp).<\/li>\n<\/ul>\n<p>They then see an order <strong>code<\/strong>. The page\n<code>/shop/order/&lt;code&gt;<\/code> shows where the order is, the\ndelivery estimate, the driver once the order is out, the\n<strong>delivery code<\/strong>, lets them cancel it while it is new,\n<strong>order again<\/strong>, <strong>Download invoice (PDF)<\/strong>\nonce completed, <strong>Send this order to the shop on\nWhatsApp<\/strong>, ask for a <strong>return<\/strong> and\n<strong>rate<\/strong> the products. If they gave an e-mail address, they\nreceive a message when the order is received, accepted, on its way or\nready, completed or refused, each ending with a link <strong>View your\norder<\/strong>.<\/p>\n<h3 id=\"the-customers-account\">The customer's account<\/h3>\n<p>A customer may <strong>sign in<\/strong> (the account button at the\ntop of the shop): they type their e-mail address (or a saved phone\nnumber), receive a one-time code valid for 10 minutes, and enter the\nportal. No password is needed, and buying as a guest always works. The\nportal is at <code>/shop/account<\/code> and has a menu with one page for\neach:<\/p>\n<ul>\n<li><strong>My orders<\/strong>: all orders, filtered All / In progress /\nDelivered / Cancelled, with <strong>Track<\/strong>, <strong>Order\nagain<\/strong> (fills the cart with today's products and prices) and\n<strong>Invoice<\/strong> (PDF) on each completed order, and the delivery\ncode of an order that is on its way.<\/li>\n<li><strong>My invoices<\/strong>: one line per invoice, with\n<strong>Download (PDF)<\/strong>.<\/li>\n<li><strong>My wish list<\/strong>: the hearted products with price and\nstock and <strong>Add to cart<\/strong>. Guests keep their hearts in\ntheir browser; they join the account at sign-in.<\/li>\n<li><strong>My returns<\/strong>: every return asked for, with its\nstatus, the goods, the reason, the shop's note, the return code and\ndriver, and the amount refunded.<\/li>\n<li><strong>My addresses<\/strong>: up to 10 delivery addresses (name,\narea, address, a default).<\/li>\n<li><strong>Loyalty points<\/strong> (when the shop has them) and\n<strong>My profile<\/strong>, with sign-out and <strong>delete my\naccount<\/strong>.<\/li>\n<\/ul>\n<h3 id=\"ratings-and-reviews\">Ratings and reviews<\/h3>\n<p>A customer who bought a product on a <strong>completed<\/strong> order\ncan rate it from the order page, once per product per order. The\n<strong>rating<\/strong> (1 to 5 stars) counts <strong>at once<\/strong>;\nthe <strong>review<\/strong> (optional words) is shown only after staff\napprove it. A rating without words has nothing to check, so nothing\nwaits. Only real ratings exist: staff cannot add one.<\/p>\n<h2 id=\"answering-orders-staff\">Answering orders (staff)<\/h2>\n<p>Open <strong>Online Store &gt; Online orders<\/strong>. The tabs are\n<strong>New<\/strong>, <strong>Awaiting payment<\/strong>,\n<strong>Open<\/strong>, <strong>Refunds due<\/strong>,\n<strong>Completed<\/strong>, <strong>Rejected<\/strong>,\n<strong>Cancelled<\/strong> and <strong>Everything<\/strong>, each with\nits number. The <strong>New<\/strong> tab lists orders waiting for an\nanswer, with a <em>late<\/em> mark when one has waited too long. The list\nrefreshes by itself, so it can stay open on a counter screen. Buttons at\nthe top lead to <strong>Returns<\/strong>, <strong>Online\npayments<\/strong> (with the number needing attention) and <strong>Shop\nsettings<\/strong>.<\/p>\n<ul>\n<li><strong>Accept<\/strong> creates a confirmed sale order that holds\nthe stock. If the stock does not cover the order, the screen says so and\noffers <strong>Accept anyway<\/strong>; the sale order is then\nover-promised until stock arrives. Phone the customer if you are unsure.\nAn order paid online is already paid: there is no cash to collect.<\/li>\n<li><strong>Reject<\/strong> needs a reason; the customer sees it. An\norder paid online and rejected shows under <strong>Refunds\ndue<\/strong>.<\/li>\n<li><strong>Driver<\/strong>: on a delivery order, choose the driver (see\nthe next chapter), print the <strong>Delivery slip<\/strong> or the\n<strong>Run sheet<\/strong>, or send the order to the driver on\nWhatsApp.<\/li>\n<li><strong>Mark packed<\/strong> (optional), then <strong>Out for\ndelivery<\/strong> for a delivery or <strong>Ready for pick-up<\/strong>\nfor a pick-up. The customer is told and receives a 4-digit\n<strong>delivery code<\/strong> (or pick-up code) by e-mail and\ntext.<\/li>\n<li><strong>Complete<\/strong> hands the order over. The person who\nreceives the goods gives the 4-digit code, which you type; this takes\nthe stock out through the sale order, issues the invoice, records the\npayment, sends the invoice by e-mail and gives the loyalty points. For a\ncash order the cash is recorded as collected. A customer who lost the\ncode can have it sent again with <strong>Send a new code to the\ncustomer<\/strong>: staff never see the code itself.<\/li>\n<li><strong>Delivery failed<\/strong> and <strong>The customer keeps only\npart of the goods<\/strong> are described in the next chapter.<\/li>\n<li><strong>Cancel order<\/strong> (accepted but not completed) cancels\nthe sale order and releases the stock.<\/li>\n<li><strong>Awaiting payment<\/strong> lists orders whose customer has\nnot paid yet. They come to <strong>New<\/strong> when the payment is\nconfirmed. A payment the customer does not approve within\n<strong>Minutes the customer has to pay<\/strong> (30 unless changed in\nthe shop settings) expires, and the customer can try again from the\norder page.<\/li>\n<li>A customer who also gave a WhatsApp-capable phone has a\n<strong>WhatsApp<\/strong> link beside the number.<\/li>\n<\/ul>\n<p>A discount from a coupon or loyalty points is shown on the order.\n<strong>History<\/strong> lists every step with who did it and when,\nincluding whether the code message went by e-mail and text.<\/p>\n<p>The batch-tracked or <strong>serial-numbered<\/strong> goods delivered\nshow their serial numbers on the order, on the customer's order page and\non the invoice.<\/p>\n<h2 id=\"refunds-of-online-payments\">Refunds of online payments<\/h2>\n<p>When a customer who paid online cancels, or you reject the order, the\norder moves to <strong>Refunds due<\/strong>. Open it and press\n<strong>Refund through the provider<\/strong> to give the money back\nthrough the payment provider. If the provider cannot do it (Airtel Money\nrefunds are done by hand), refund by hand outside the program, type the\n<strong>reference<\/strong> of your refund and press <strong>I refunded\nit myself<\/strong>. Once an order is completed, goods coming back go\nthrough <strong>Returns<\/strong> (below). The accounting entries of\nevery refund are described in the payments and accounting chapter.<\/p>\n<h2 id=\"coupons\">Coupons<\/h2>\n<p><strong>Online Store &gt; Coupons<\/strong> holds the codes a customer\ntypes at checkout. When at least one coupon is active, the shop shows a\ncoupon box.<\/p>\n<ul>\n<li>A coupon gives <strong>Percent off the items<\/strong> (with an\noptional <em>Never more than<\/em> amount), <strong>Amount off the\nitems<\/strong>, or <strong>Free delivery<\/strong>.<\/li>\n<li>Optional limits: <strong>Minimum order<\/strong>, <strong>Valid\nfrom<\/strong>, <strong>Valid until<\/strong>, <strong>Orders it can be\nused on<\/strong>, and <strong>Once per customer<\/strong> (the same phone\nnumber or account).<\/li>\n<li>A rejected or cancelled order gives its use back. The discount is\npart of the sale order and the invoice, so the invoice always equals\nwhat the customer paid. In the books the discount is shown in\n<strong>Sales Discounts Given<\/strong>, not taken off Sales\nRevenue.<\/li>\n<li>One coupon per order, and it applies to the whole order, not to one\nproduct.<\/li>\n<\/ul>\n<h2 id=\"returns\">Returns<\/h2>\n<p>A customer can ask to return goods from a <strong>completed<\/strong>\norder, within the number of days set in the shop settings (14 unless\nchanged), from their order page or from <strong>My returns<\/strong>.\nThey choose the items and quantities, give a reason and the phone number\nof the order (not needed when signed in).<\/p>\n<ol type=\"1\">\n<li>Open <strong>Online Store &gt; Returns<\/strong>. The\n<strong>Waiting<\/strong> tab lists new requests. Press\n<strong>Approve<\/strong> or <strong>Refuse<\/strong> (a note for the\ncustomer is needed to refuse).<\/li>\n<li>For a <strong>delivery<\/strong> order a driver collects the goods at\nthe customer's door, free of charge (next chapter). For an order the\ncustomer <strong>picked up<\/strong> at the shop, the customer brings the\ngoods back.<\/li>\n<li>When the goods are back, press <strong>Goods received: put back and\nrefund<\/strong> (it works from <strong>Approved<\/strong> and from\n<strong>Collected<\/strong>), choose where the goods go back in, and give\nthe money back: <strong>Refund through the provider<\/strong> for an\nonline payment, or the same by hand with its reference; for a cash order\nthe screen says how much cash to hand back. For\n<strong>serial-numbered<\/strong> lines, tick the serial numbers that\ncame back; they are in stock again.<\/li>\n<li>The goods go back into stock through a normal sale order return, so\nstock, revenue, VAT and reports follow. The goods return to Inventory at\nthe <strong>cost they were sold at<\/strong>. A coupon discount follows\nthe goods (the customer gets back what they paid for them); the\n<strong>delivery fee is not refunded<\/strong>. Loyalty points follow the\ngoods too.<\/li>\n<\/ol>\n<p>The customer is e-mailed (and texted) at each step. Exchanges, store\ncredit and restocking fees are not part of this screen.<\/p>\n<h2 id=\"reviews\">Reviews<\/h2>\n<p>Open <strong>Online Store &gt; Reviews<\/strong>. The tabs are\n<strong>Waiting<\/strong> (new written reviews), <strong>Shown<\/strong>,\n<strong>Rating only<\/strong>, <strong>Hidden<\/strong> and\n<strong>Everything<\/strong>. <strong>Approve<\/strong> shows the words on\nthe shop, <strong>Hide<\/strong> keeps them but does not show them,\n<strong>Delete<\/strong> removes the entry for good. Two more buttons act\non the stars: <strong>Remove rating<\/strong> keeps an unfair rating out\nof the averages and <strong>Count rating again<\/strong> brings it back.\nThe shop's overall rating and the stars on cards and product pages\nfollow at once.<\/p>\n<h2 id=\"messages-contact-form\">Messages (contact form)<\/h2>\n<p>The shop has a <strong>Contact us<\/strong> page with the shop's\nphone, e-mail, WhatsApp, address and opening hours and a form (name,\ne-mail, phone, subject, message, an optional order code). The visitor\nmust give an e-mail or a phone number so that you can answer. Open\n<strong>Online Store &gt; Messages<\/strong>: the tabs\n<strong>New<\/strong>, <strong>Answered<\/strong> and\n<strong>Everything<\/strong> have a search box. For each message you can\n<strong>Reply by e-mail<\/strong> (a box opens: write the answer, press\n<strong>Send the answer<\/strong>; it goes from the shop's e-mail, in the\ncustomer's language, with the message quoted, and the message becomes\nAnswered), use the <strong>WhatsApp<\/strong> button, write a note,\n<strong>Mark as answered<\/strong> or <strong>Mark as new<\/strong> again,\nor <strong>Delete<\/strong>. The shop is told of each new message by\ne-mail (and by text when the owner alert is set up), and the visitor who\ngave an e-mail gets a copy. A visitor who gave only a phone number\ncannot be answered by e-mail: use the phone or WhatsApp.<\/p>\n<h2 id=\"waiting-customers-back-in-stock-alerts\">Waiting customers\n(back-in-stock alerts)<\/h2>\n<p><strong>Online Store &gt; Waiting customers<\/strong> lists the\nproducts customers asked to be told about, <strong>the most wanted\nfirst<\/strong>, so you know what to restock; it says <em>back in\nstock<\/em> when a product can be sold again. Below it is the list of\npeople (<strong>Waiting<\/strong>, <strong>Told<\/strong>, <strong>Could\nnot be told<\/strong>, <strong>Everything<\/strong>, with a search box).\nThe shop looks every five minutes: as soon as a product can be sold\nagain, each waiting customer gets <strong>one<\/strong> e-mail in their\nlanguage (and one text message when text messages are on), and the\nrequest is closed. If sending fails it is tried three times and then\nmarked <strong>Could not be told<\/strong>. Customers whose only contact\nis a phone number while text messages are off stay\n<strong>Waiting<\/strong> for you: use the <strong>WhatsApp<\/strong>\nbutton (the message and the link are already written), then <strong>Mark\nas told<\/strong>. <strong>Tell them now<\/strong> runs the notice at\nonce; <strong>Remove<\/strong> deletes a request.<\/p>\n<h2 id=\"newsletter\">Newsletter<\/h2>\n<p>Visitors can ask for your newsletter at the bottom of the first page.\nThe shop sends them an e-mail with a link; they are counted only after\nthey open it. Open <strong>Online Store &gt; Newsletter<\/strong> to see\nthe list (<strong>Subscribed<\/strong>, <strong>Not confirmed<\/strong>,\n<strong>Unsubscribed<\/strong>), to <strong>Remove<\/strong> an address,\nand to <strong>Download confirmed addresses (CSV)<\/strong>, with each\nperson's own unsubscribe link, for a mailing tool.<\/p>\n<h3 id=\"sending-a-newsletter\">Sending a newsletter<\/h3>\n<p>Open <strong>Online Store &gt; Send a newsletter<\/strong> (also a\nbutton on the Newsletter screen) and press <strong>New\nnewsletter<\/strong>.<\/p>\n<ol type=\"1\">\n<li>Type the <strong>Subject<\/strong> and the <strong>Message<\/strong>.\nA blank line starts a new paragraph. The message is plain text: nothing\nyou type is treated as formatting or code. You may add one\n<strong>button<\/strong> with its text and a link that starts with\n<code>https://<\/code> or <code>/<\/code> (for example\n<code>/shop<\/code>).<\/li>\n<li>Choose <strong>Who gets it<\/strong>: everyone who confirmed, only\nthe English readers, or only the French readers (each person's language\nis the one they had when they signed up). The number of people is\nshown.<\/li>\n<li>Press <strong>Save draft<\/strong>, type your own e-mail address and\npress <strong>Send me a test<\/strong>. The test looks like the real\ne-mail and has [TEST] in the subject. Change the draft and test again as\noften as you like.<\/li>\n<li>Press <strong>Send to N people<\/strong> and confirm. The list is\nfixed at that moment.<\/li>\n<\/ol>\n<p>The shop name and <strong>each person's own unsubscribe link<\/strong>\nare added at the bottom of every e-mail automatically, in the person's\nlanguage. The e-mails do not leave all at once: a small batch goes out\nabout every minute, and there is a limit per 24 hours (500 unless your\nadministrator changed it) so your mail server does not block you. Open\nthe newsletter from the list to follow it: a bar and the numbers\n<strong>Sent<\/strong>, <strong>Waiting<\/strong>, <strong>Failed<\/strong>\nand <strong>Skipped<\/strong>. The page updates by itself.<\/p>\n<ul>\n<li><strong>Stop sending<\/strong> stops the rest. What was already sent\nstays sent, and a stopped newsletter cannot be started again (write a\nnew one).<\/li>\n<li><strong>Skipped<\/strong> are people who unsubscribed (or were\nremoved) after you pressed send but before their turn: they get\nnothing.<\/li>\n<li><strong>Failed<\/strong> addresses are listed with the reason the\nmail server gave. After you have fixed the cause (for example the e-mail\nsettings; an address with a typo can only be removed), press <strong>Try\nthe failed ones again<\/strong>: only those are tried, nobody gets a\nsecond copy. If five e-mails fail one after another, sending pauses and\nshows the reason; fix it and press <strong>Try the failed ones\nagain<\/strong>.<\/li>\n<li>Pressing <strong>Send<\/strong> twice, or two people pressing it,\ncannot send a newsletter twice. A sent newsletter stays in the list as a\nrecord; only a draft can be changed or deleted.<\/li>\n<\/ul>\n<div class=\"callout note\">\n<p><strong>Note:<\/strong> The newsletter needs the e-mail settings of\nthe business to be working (Administrator Manual, chapter 9), and\n<code>app.frontend-url<\/code> must be the public address of the site\n(Administrator Manual, chapter 7), or the unsubscribe links will be\nwrong.<\/p>\n<\/div>\n<h2 id=\"abandoned-carts\">Abandoned carts<\/h2>\n<p>Many visitors fill a cart and then leave. When your manager switches\non <strong>Send reminders for abandoned carts<\/strong> (Shop settings),\nthe shop can remind the ones who typed an <strong>e-mail\naddress<\/strong> at checkout.<\/p>\n<ul>\n<li><strong>What the customer sees.<\/strong> Under the e-mail box a\nshort notice says the shop may remind them about their cart by e-mail,\nand that every e-mail has a link to stop the reminders. Nothing is saved\nuntil the customer has typed an address that looks right (guests too: no\naccount is needed).<\/li>\n<li><strong>Two reminders, no discount.<\/strong> The first goes out\nabout <strong>1 hour<\/strong> after the customer last changed the cart,\nthe second <strong>3 days<\/strong> after. The e-mail lists the cart as\nthe shop is today (current prices; what is sold out is named as no\nlonger available) with a button <strong>Go back to my cart<\/strong>. The\ne-mail is in the language the customer was using on the shop.<\/li>\n<li><strong>Nobody is pestered.<\/strong> An address that\n<strong>orders<\/strong> is not reminded any more. A link at the bottom\nof each e-mail (<strong>Stop these reminders<\/strong>) stops them at\nonce and for good. A cart whose items are all gone, or that is more than\n2 days old when its first reminder would go out, is dropped without an\ne-mail.<\/li>\n<li><strong>Your screen.<\/strong> <strong>Online Store &gt; Abandoned\ncarts<\/strong> shows the numbers (Waiting, Reminded once, Reminded\ntwice, Ordered, Stopped, Nothing to remind) and a list with the e-mail\naddress, the products and pieces, the last change and when each reminder\nwent out. Press a number to filter. <strong>Remove<\/strong> deletes a\ncart and its address (for example when a customer asks to be forgotten).\nCarts untouched for two months are deleted by themselves.<\/li>\n<\/ul>\n<div class=\"callout note\">\n<p><strong>Note:<\/strong> The reminders need the e-mail settings of the\nbusiness to be working and <code>app.frontend-url<\/code> set to the\npublic address of the site. They are off until you tick the box, and\nnothing is saved while they are off.<\/p>\n<\/div>\n<h2 id=\"loyalty-points\">Loyalty points<\/h2>\n<p>When your manager switches on <strong>Customers earn and spend\nloyalty points<\/strong> (Shop settings; it needs Customer accounts to be\non), customers who are <strong>signed in<\/strong> earn points and spend\nthem on later orders. Guests earn nothing: the points belong to the\naccount. These points are the shop's own and are separate from the\nloyalty programme at the till (Sales).<\/p>\n<ul>\n<li><strong>Earning.<\/strong> When an order is\n<strong>completed<\/strong> the customer earns points on what they paid\nfor the goods: <strong>1 point for every 100<\/strong> by default (your\nmanager can change it), after any coupon or points discount and without\nthe delivery fee. On a partial delivery they earn on what was\ndelivered.<\/li>\n<li><strong>Spending.<\/strong> At checkout a signed-in customer with\npoints sees <strong>Use loyalty points<\/strong>: they type how many, or\npress <strong>Use the most I can<\/strong>. <strong>One point takes 1\noff<\/strong> (1 unit of the shop's currency), and points can pay at most\na share of the goods (50% by default) that is left after a coupon. The\nshop checks the balance again when the order is sent, so the same points\ncan never be spent twice.<\/li>\n<li><strong>Their balance.<\/strong> In the portal (<strong>Loyalty\npoints<\/strong>) the customer sees the balance and the history (earned,\nused, returned).<\/li>\n<li><strong>Cancelled or refused orders<\/strong> give the spent points\nback. <strong>Returned goods<\/strong> give back the matching share of\nthe points spent on them and take back the matching share of the points\nthey earned; if the customer has already spent those points the balance\ncan go below zero until they earn more.<\/li>\n<li><strong>Your screen.<\/strong> <strong>Online Store &gt; Loyalty\npoints<\/strong> lists the customer accounts with their points (the most\nfirst, with a search box), shows the history of one customer, and lets\nyou <strong>add or remove points<\/strong> with a reason.<\/li>\n<li><strong>In your books.<\/strong> Points earned are an expense and a\nliability (<strong>Loyalty Points Liability<\/strong>); points spent on a\ndelivered order release the liability, and the cost then shows as\n<strong>Sales Discounts Given<\/strong>. Points never expire, and\ndeleting a customer's account deletes their points history. Points\nearned before version 1.73.0 are not in the liability; your accountant\nposts an opening entry for the points customers already hold.<\/li>\n<\/ul>\n<h2 id=\"text-messages\">Text messages<\/h2>\n<p>When your administrator has chosen a text provider, the shop can text\ncustomers about their order (only those who ticked the box at checkout),\ntext sign-in codes, and text you about new orders. The <strong>delivery\ncode<\/strong>, <strong>pick-up code<\/strong>, <strong>return\ncode<\/strong> and <strong>new code<\/strong> are the exception: they are\nsent by e-mail <strong>and<\/strong> by text to the phone number of the\norder whether or not the box was ticked, because the code is part of the\ndelivery. <strong>Online Store &gt; Text messages<\/strong> lists every\ntext, also the ones that failed or were not sent, and has a <strong>Send\ntest message<\/strong> form. There is a daily limit to keep the cost in\ncheck. Until a real text company is connected, a built-in sender keeps\nevery code text in the list marked <strong>Waiting for an SMS\ncompany<\/strong>: nothing leaves the server, and the e-mail still goes.\nThe code itself is never written in the text list.<\/p>\n<h2 id=\"good-to-know\">Good to know<\/h2>\n<ul>\n<li>Online orders from a phone number that already exists in\n<strong>Customers<\/strong> attach to that customer; otherwise a customer\nis created.<\/li>\n<li>A customer may have only a few orders waiting for an answer at once,\nand a script that sends many orders from one connection is slowed down.\nThese limits are in <strong>Shop settings<\/strong>.<\/li>\n<li>Link previews: when a shop link is pasted in WhatsApp, Facebook,\nTelegram and similar apps, a card appears with the product picture, name\nand price, and Google can show price, stock and stars. The administrator\nadds one rule to the web server for this (Administrator Manual, chapter\n7); without it the shop works but links show no preview.<\/li>\n<li>Newsletters are plain text with one optional button, with no\npictures, and cannot be scheduled for later. Online orders also appear\nin the normal sales reports.<\/li>\n<\/ul>\n", "text": " The Online Store module gives your business a public shop on the internet at /shop (for example https://erp.yourbusiness.com/shop ). When the module is on, /shop is also the first page a visitor sees at the main address, with a Staff Login link for your own people. Customers choose products, order for delivery or pick-up , and pay in cash or online (MTN Mobile Money, Airtel Money or card, when your administrator has set up a payment provider). You answer each order, and an accepted order becomes a normal sale order, invoice and payment, so stock, accounting and reports stay in one place. The module must be in your licence and activated by an administrator (Settings > Modules). The Online Store group then appears in the menu. Staff need the Operations area to use it. The chapters about the Online Store are: This chapter : what the shop looks like, how to set it up, why a product may say Sold out , what the customer does, how staff answer orders, refunds, coupons, returns, reviews, messages, newsletter, abandoned carts, loyalty points and text messages. Online Store: delivery, drivers and cash (next chapter): delivery areas and tax, delivery times, drivers and their private page, the delivery code, failed and partial deliveries, return pick-ups and the cash drivers hold. Online Store: payments, accounting and reports (the chapter after): payment providers, payouts, how an order reaches the books, advertising, sales reports and the accountant's checks. The menu entries are: Online orders , My deliveries , Driver cash , Online payments , Returns , Coupons , Reviews , Messages , Waiting customers , Shop pages , Newsletter , Send a newsletter , Abandoned carts , Loyalty points , Advertising , Sales reports , Text messages , Shop settings and Open the shop . What a visitor sees The first page From top to bottom, the first page of the shop shows: an announcement bar (a short message, optionally a link); the header with the shop name or logo, a search box, the wish list heart, the cart, the account button and Staff Login ; the banner : your pictures sliding one after the other, with a title, a text and a button; an advertisement (when you sell advertising space, see the payments and reports chapter); rows of products you choose: Featured products , Best-selling products , Special offers and discounts , New arrivals and, for a returning visitor, Recently viewed . Each row stays on one line and moves with its arrow buttons, the mouse wheel or a swipe of the finger. By default it does not move by itself; you can switch that on in Shop settings > Front page ( Product rows slide by themselves ); Shop by category : a tile for each category with a picture of one of its products and the number of products; the shop's overall rating (the average of the stars, how many ratings, and how many of each star) and the written customer reviews ; a newsletter sign-up; the footer with quick links, contact details, opening hours, an \"about\" text, links to your social pages and the information pages (Terms and Conditions, Privacy Policy, Returns and Refunds, Delivery and Shipping, Contact us); below the rows, All products with the category buttons. A part with nothing to show (no featured product, no review yet, no announcement) is simply left out. When a visitor searches or picks a category, the page goes straight to the matching products. Finding a product Search : every word typed must be found in the name, the title on the shop, the SKU, the barcode, the brand, the category or the description, in any order, so \"hose garden\" finds \"20m Garden Hose\". Suggestions (products, categories and brands) appear while typing. Filters : price range (as the customer sees it, tax included), brand, rating (4, 3 or 2 stars and up) and in stock only . Sort by recommended, newest, most popular (units sold on online orders), best rated, or price. Clear filters resets them. Product cards have the same size everywhere: picture, name, price (the normal price crossed out and a -NN% badge on an offer), stars with the number of ratings, In stock , Few left or Out of stock , a Quick view window and Add to cart . A product sold by weight or length shows \"/ kg\" or \"/ m\" next to the price. The product page Opening a product leads to its own page, at /shop?product=ID , which can be shared or bookmarked. It shows a big picture with a gallery (hover zoom, full-screen view), the price, the stock word, a quantity box and Add to cart , the full description, a table of specifications, the stars with a breakdown and the approved reviews, a Delivery box (the cheapest fee, the free-delivery amount, the pick-up address and an estimated delivery date range), Share on WhatsApp , a heart for the wish list, Related products , Frequently bought together (with Add all to cart ) and Recently viewed . Products with options. A product with sizes, colours or models (Products > Variants) is one card , with one button per value. The price, stock, SKU and pictures change with the choice. An option that is sold out stays visible, greyed, and cannot be added. A card says Starting at when the options do not all cost the same. Sold out? \"Tell me when it is back.\" On a sold-out product (or option) the customer leaves an e-mail address and/or a phone number. The shop tells them once when the product can be sold again (see Waiting customers below). Prices. A product with no online price follows the shop's price list and the best promotion from Sales (a percent or amount off the product or its category); the normal price is crossed out. See Prices below. Setting up the shop (manager) Open Online Store > Shop settings . The page is a series of cards; each has its own Save . Products on the shop Search a product and press Add . Only products you add here are shown or sold online. For each product you can set: Title on the shop and Online price (leave the price empty to use the normal price or the offer from Sales; an online price below the normal price shows the normal price crossed out as an offer); Order : the lower number comes first; Shown : untick to hide the product for a while; the four row ticks Featured , Best seller , Offer and New : the shop never picks products by itself, you decide which products appear in each row (up to 8 per row; the first three rows follow the Order number, New arrivals shows the most recently added first). Press Save at the end of the product's card; Sold by (kg, m ...) : for rice, cloth, cheese and other goods sold by weight or length. The customer may order decimals (0.1 to 100, three decimals); Buffer for this product : its own safety buffer (empty = the shop-wide one); Product page: pictures, description, specifications : write the description, add up to 5 more pictures (5 MB each, reorder, remove) and up to 20 specification rows (name and value). The product's own picture is always the first. A product with options is one row : Options: price, stock, pictures opens the list of its options with SKU, normal price, stock, an Online price for each, a Sold online switch and pictures of their own. Put the template of the product on the shop and all its options follow; new options added in Products > Variants appear by themselves within five minutes. The picture is the product's own picture: add one on the product screen. Under every product the screen shows where its stock figure comes from (see Why does the shop say \"Sold out\"? below). Front page wording In Front page write what the first page says. Everything is optional. Announcement bar and its link ; Banner title , Banner text , Banner button text and Banner button link (empty = down to the products). Banner pictures : choose up to 8 pictures (JPEG, PNG, WebP or GIF, 8 MB each; you can choose several at once). Use the arrows to put them in order and Remove to take one away. A wide picture, about 1600 × 600 pixels, looks best. With no picture the banner is a plain colour. About the shop , Contact e-mail , WhatsApp number of the shop and Opening hours . Shop colour for buttons and the announcement bar, and the estimated delivery time in days (for example 2 to 4), which the product page uses (a delivery area can have its own, see the next chapter). Footer links and Social links : one per line, written Label|address , for example Delivery|/shop or Facebook|https://facebook.com/yourshop . At most 8 and 6. An address must start with / (a page of this site), https:// , http:// , mailto: or tel: ; anything else is refused. Press Save the front page , then Open the shop to look at it. The shop switches The shop : set Delivery , Pick-up and Pay cash on delivery or at pick-up , the Pick-up address , the Minimum order , Free delivery from an amount, and the Service product for the delivery fee (see the next chapter). Customer accounts , Text messages , Returns (how many days after completion a customer may return goods; 0 = no returns through the shop) and Online payments are switched on here too. Your administrator sets up the providers (Administrator Manual, chapter 7). Branch the shop sells for : shown only when the business has more than one branch. The shop's sale orders, invoices, payments and loyalty entries carry this branch, so branch reports include the shop. Head office is the default. Tick Shop is open to the public and Save settings . Use Pause orders for now to stop taking orders without taking the page down; the message you write is shown to visitors. Press Open the shop and place a test order before telling customers. Tip: Prices on the shop include tax. Shop pages Online Store > Shop pages holds the four information pages every shop needs: Terms and Conditions, Privacy Policy, Returns and Refunds, and Delivery and Shipping. Each starts with a general starter text in English and French with the shop's name, phone, e-mail and address filled in. You can edit the title and the text of each (paragraphs; a line starting with ## is a heading, one starting with - is a bullet; {shop} , {phone} , {email} and {address} are replaced by the shop's details), switch a page off, or go back to the starter text. Warning: The starter texts are a general beginning, not legal advice . Read them, adapt them to your business and your country, and have them checked before you open the shop. A page you have saved is shown as you wrote it to every visitor, in one language. The checkout says \"By placing your order you agree to ...\" with links to the pages that are shown. Install the shop as an app The whole site, the shop included, can be installed on a phone or computer like an app (Chrome, Edge and Android offer an Install the app card; on an iPhone use Share > Add to Home Screen). The shop installs under the shop's own name and colour, the staff screens as \"NIWE ERP\". The installed app opens even without a connection, with a red strip \"You are offline\", but nothing from the server is kept : sales, stock and prices always come from the server, so an order cannot be placed offline. (The till has its own queue for sales when the connection drops; see the POS chapter.) Why does the shop say \"Sold out\"? You do not need a separate stock for the shop. The shop uses the same stock as the till and the warehouses: stock in the sellable locations of your warehouses − quantities reserved on confirmed sales orders − units held by shop orders nobody has answered yet − the product's buffer − the share kept for the till = what the shop may still sell The line under each product in Products on the shop shows every one of these numbers: in the sellable locations, reserved on confirmed orders, held by orders nobody answered yet, the buffer, the share kept for the till, what is expired or too close to its expiry date, and sellable now . When the last one is 0 or less the shop says Sold out . The card word, Only n left , the In stock filter, the check at checkout and the back-in-stock alerts all use this same figure. If the line says Stock is not tracked for this product , the shop always shows it as available. What counts as sellable locations : with several warehouses in use, only Sales locations outside the Main warehouse . Shop settings > Stock the shop sells from lets you choose one Sales location, or Automatic (all of them). Goods sitting in Receiving , Storage , Damaged or an inactive location are not counted. With one warehouse nothing changes. What the settings do: Units kept back for the till (shop-wide buffer, 1 unless you changed it) and Buffer for this product (its own, wins over the shop-wide one). Share kept for the till (%) : this share of the available units of every product is kept back for the till (rounded up), on top of the buffer. Release unanswered orders after (hours) : default 24, 0 = never. A shop order holds its units from the moment it is placed , so two customers cannot be sold the same last units. An order waiting for a payment, or a cash order nobody accepted, is cancelled after this many hours and its stock is free again; the customer is told. An order paid online is never cancelled this way: staff must answer it. Do not sell goods with fewer days left than (default 0): for batch-tracked products, expired batches are never sold; with a number here, batches closer to their expiry date are left out as well. Deliveries take the batches the shop may sell first, earliest expiry first. Cartons : when breakdown is on in Inventory, the units that can be had by opening cartons count as stock, and cartons are opened automatically when an order is accepted or delivered. When a product says sold out and you believe you have stock, look for: What you see Usual reason What to do Sellable now is exactly 0 and the stock is 1 The buffer of 1 Lower Units kept back for the till (or the product's own buffer) to 0 The stock figure is 0 but the product has stock The stock sits in a location that is not sellable ( Receiving , Damaged , the Main warehouse, an inactive location) or was never entered per warehouse Open Inventory and the product's stock; move the goods to a sales location with a stock transfer (see the Inventory chapter) Stock and reserved are both high The goods are already promised on confirmed sales orders, including accepted online orders Complete or cancel those orders, or add stock Held by unanswered orders is high Orders placed but not yet accepted hold their units Answer the orders in New Expired or too close to expiry shows a number Those batches are left out of the figure Sell them at the till, or change the setting Stock that arrives on a purchase receipt sits in the Receiving location until it is moved to a Sales location. The Reorder screen subtracts the units of shop orders nobody has answered yet and counts customers waiting for a back-in-stock e-mail as demand (columns Online orders and Waiting customers ); the stock valuation report has an Online orders column. Prices A product with an Online price is sold at that price. A product with no online price follows Shop settings > Price list used by the shop and the best promotion from Sales that applies to everybody on the product or its category; the normal price is crossed out. Prices are recalculated every 2 minutes; press Apply now to see a change at once. Promotions that need a coupon, a customer group, a limit, a minimum, \"buy X get Y\", or that apply to the whole cart, are not applied online. The product row shows \"Offer from Sales: price (name)\". What the customer does The customer opens /shop , searches or picks a category, adds products to the cart, and presses Proceed to checkout . They choose Delivery or Pick-up , give a name and a phone number (an e-mail address is optional), and for delivery an area, an address and, when the shop offers delivery times, a day and a time window. A signed-in customer picks one of the saved addresses or saves a new one. Then they choose how to pay: Cash on delivery or Cash at pick-up . After Place order the order reaches you at once. Mobile money (they type the number to pay from and approve on their phone) or Card . When more than one provider can take the chosen way to pay, a Pay with row shows one button per provider (with its logo when you have added it). After Place order and pay the order reaches you only once the payment is confirmed . A coupon code can be typed and checked with Apply before ordering (when you have an active coupon), and a signed-in customer can use loyalty points . When text messages are on, a box offers updates about the order by text (or WhatsApp). They then see an order code . The page /shop/order/<code> shows where the order is, the delivery estimate, the driver once the order is out, the delivery code , lets them cancel it while it is new, order again , Download invoice (PDF) once completed, Send this order to the shop on WhatsApp , ask for a return and rate the products. If they gave an e-mail address, they receive a message when the order is received, accepted, on its way or ready, completed or refused, each ending with a link View your order . The customer's account A customer may sign in (the account button at the top of the shop): they type their e-mail address (or a saved phone number), receive a one-time code valid for 10 minutes, and enter the portal. No password is needed, and buying as a guest always works. The portal is at /shop/account and has a menu with one page for each: My orders : all orders, filtered All / In progress / Delivered / Cancelled, with Track , Order again (fills the cart with today's products and prices) and Invoice (PDF) on each completed order, and the delivery code of an order that is on its way. My invoices : one line per invoice, with Download (PDF) . My wish list : the hearted products with price and stock and Add to cart . Guests keep their hearts in their browser; they join the account at sign-in. My returns : every return asked for, with its status, the goods, the reason, the shop's note, the return code and driver, and the amount refunded. My addresses : up to 10 delivery addresses (name, area, address, a default). Loyalty points (when the shop has them) and My profile , with sign-out and delete my account . Ratings and reviews A customer who bought a product on a completed order can rate it from the order page, once per product per order. The rating (1 to 5 stars) counts at once ; the review (optional words) is shown only after staff approve it. A rating without words has nothing to check, so nothing waits. Only real ratings exist: staff cannot add one. Answering orders (staff) Open Online Store > Online orders . The tabs are New , Awaiting payment , Open , Refunds due , Completed , Rejected , Cancelled and Everything , each with its number. The New tab lists orders waiting for an answer, with a late mark when one has waited too long. The list refreshes by itself, so it can stay open on a counter screen. Buttons at the top lead to Returns , Online payments (with the number needing attention) and Shop settings . Accept creates a confirmed sale order that holds the stock. If the stock does not cover the order, the screen says so and offers Accept anyway ; the sale order is then over-promised until stock arrives. Phone the customer if you are unsure. An order paid online is already paid: there is no cash to collect. Reject needs a reason; the customer sees it. An order paid online and rejected shows under Refunds due . Driver : on a delivery order, choose the driver (see the next chapter), print the Delivery slip or the Run sheet , or send the order to the driver on WhatsApp. Mark packed (optional), then Out for delivery for a delivery or Ready for pick-up for a pick-up. The customer is told and receives a 4-digit delivery code (or pick-up code) by e-mail and text. Complete hands the order over. The person who receives the goods gives the 4-digit code, which you type; this takes the stock out through the sale order, issues the invoice, records the payment, sends the invoice by e-mail and gives the loyalty points. For a cash order the cash is recorded as collected. A customer who lost the code can have it sent again with Send a new code to the customer : staff never see the code itself. Delivery failed and The customer keeps only part of the goods are described in the next chapter. Cancel order (accepted but not completed) cancels the sale order and releases the stock. Awaiting payment lists orders whose customer has not paid yet. They come to New when the payment is confirmed. A payment the customer does not approve within Minutes the customer has to pay (30 unless changed in the shop settings) expires, and the customer can try again from the order page. A customer who also gave a WhatsApp-capable phone has a WhatsApp link beside the number. A discount from a coupon or loyalty points is shown on the order. History lists every step with who did it and when, including whether the code message went by e-mail and text. The batch-tracked or serial-numbered goods delivered show their serial numbers on the order, on the customer's order page and on the invoice. Refunds of online payments When a customer who paid online cancels, or you reject the order, the order moves to Refunds due . Open it and press Refund through the provider to give the money back through the payment provider. If the provider cannot do it (Airtel Money refunds are done by hand), refund by hand outside the program, type the reference of your refund and press I refunded it myself . Once an order is completed, goods coming back go through Returns (below). The accounting entries of every refund are described in the payments and accounting chapter. Coupons Online Store > Coupons holds the codes a customer types at checkout. When at least one coupon is active, the shop shows a coupon box. A coupon gives Percent off the items (with an optional Never more than amount), Amount off the items , or Free delivery . Optional limits: Minimum order , Valid from , Valid until , Orders it can be used on , and Once per customer (the same phone number or account). A rejected or cancelled order gives its use back. The discount is part of the sale order and the invoice, so the invoice always equals what the customer paid. In the books the discount is shown in Sales Discounts Given , not taken off Sales Revenue. One coupon per order, and it applies to the whole order, not to one product. Returns A customer can ask to return goods from a completed order, within the number of days set in the shop settings (14 unless changed), from their order page or from My returns . They choose the items and quantities, give a reason and the phone number of the order (not needed when signed in). Open Online Store > Returns . The Waiting tab lists new requests. Press Approve or Refuse (a note for the customer is needed to refuse). For a delivery order a driver collects the goods at the customer's door, free of charge (next chapter). For an order the customer picked up at the shop, the customer brings the goods back. When the goods are back, press Goods received: put back and refund (it works from Approved and from Collected ), choose where the goods go back in, and give the money back: Refund through the provider for an online payment, or the same by hand with its reference; for a cash order the screen says how much cash to hand back. For serial-numbered lines, tick the serial numbers that came back; they are in stock again. The goods go back into stock through a normal sale order return, so stock, revenue, VAT and reports follow. The goods return to Inventory at the cost they were sold at . A coupon discount follows the goods (the customer gets back what they paid for them); the delivery fee is not refunded . Loyalty points follow the goods too. The customer is e-mailed (and texted) at each step. Exchanges, store credit and restocking fees are not part of this screen. Reviews Open Online Store > Reviews . The tabs are Waiting (new written reviews), Shown , Rating only , Hidden and Everything . Approve shows the words on the shop, Hide keeps them but does not show them, Delete removes the entry for good. Two more buttons act on the stars: Remove rating keeps an unfair rating out of the averages and Count rating again brings it back. The shop's overall rating and the stars on cards and product pages follow at once. Messages (contact form) The shop has a Contact us page with the shop's phone, e-mail, WhatsApp, address and opening hours and a form (name, e-mail, phone, subject, message, an optional order code). The visitor must give an e-mail or a phone number so that you can answer. Open Online Store > Messages : the tabs New , Answered and Everything have a search box. For each message you can Reply by e-mail (a box opens: write the answer, press Send the answer ; it goes from the shop's e-mail, in the customer's language, with the message quoted, and the message becomes Answered), use the WhatsApp button, write a note, Mark as answered or Mark as new again, or Delete . The shop is told of each new message by e-mail (and by text when the owner alert is set up), and the visitor who gave an e-mail gets a copy. A visitor who gave only a phone number cannot be answered by e-mail: use the phone or WhatsApp. Waiting customers (back-in-stock alerts) Online Store > Waiting customers lists the products customers asked to be told about, the most wanted first , so you know what to restock; it says back in stock when a product can be sold again. Below it is the list of people ( Waiting , Told , Could not be told , Everything , with a search box). The shop looks every five minutes: as soon as a product can be sold again, each waiting customer gets one e-mail in their language (and one text message when text messages are on), and the request is closed. If sending fails it is tried three times and then marked Could not be told . Customers whose only contact is a phone number while text messages are off stay Waiting for you: use the WhatsApp button (the message and the link are already written), then Mark as told . Tell them now runs the notice at once; Remove deletes a request. Newsletter Visitors can ask for your newsletter at the bottom of the first page. The shop sends them an e-mail with a link; they are counted only after they open it. Open Online Store > Newsletter to see the list ( Subscribed , Not confirmed , Unsubscribed ), to Remove an address, and to Download confirmed addresses (CSV) , with each person's own unsubscribe link, for a mailing tool. Sending a newsletter Open Online Store > Send a newsletter (also a button on the Newsletter screen) and press New newsletter . Type the Subject and the Message . A blank line starts a new paragraph. The message is plain text: nothing you type is treated as formatting or code. You may add one button with its text and a link that starts with https:// or / (for example /shop ). Choose Who gets it : everyone who confirmed, only the English readers, or only the French readers (each person's language is the one they had when they signed up). The number of people is shown. Press Save draft , type your own e-mail address and press Send me a test . The test looks like the real e-mail and has [TEST] in the subject. Change the draft and test again as often as you like. Press Send to N people and confirm. The list is fixed at that moment. The shop name and each person's own unsubscribe link are added at the bottom of every e-mail automatically, in the person's language. The e-mails do not leave all at once: a small batch goes out about every minute, and there is a limit per 24 hours (500 unless your administrator changed it) so your mail server does not block you. Open the newsletter from the list to follow it: a bar and the numbers Sent , Waiting , Failed and Skipped . The page updates by itself. Stop sending stops the rest. What was already sent stays sent, and a stopped newsletter cannot be started again (write a new one). Skipped are people who unsubscribed (or were removed) after you pressed send but before their turn: they get nothing. Failed addresses are listed with the reason the mail server gave. After you have fixed the cause (for example the e-mail settings; an address with a typo can only be removed), press Try the failed ones again : only those are tried, nobody gets a second copy. If five e-mails fail one after another, sending pauses and shows the reason; fix it and press Try the failed ones again . Pressing Send twice, or two people pressing it, cannot send a newsletter twice. A sent newsletter stays in the list as a record; only a draft can be changed or deleted. Note: The newsletter needs the e-mail settings of the business to be working (Administrator Manual, chapter 9), and app.frontend-url must be the public address of the site (Administrator Manual, chapter 7), or the unsubscribe links will be wrong. Abandoned carts Many visitors fill a cart and then leave. When your manager switches on Send reminders for abandoned carts (Shop settings), the shop can remind the ones who typed an e-mail address at checkout. What the customer sees. Under the e-mail box a short notice says the shop may remind them about their cart by e-mail, and that every e-mail has a link to stop the reminders. Nothing is saved until the customer has typed an address that looks right (guests too: no account is needed). Two reminders, no discount. The first goes out about 1 hour after the customer last changed the cart, the second 3 days after. The e-mail lists the cart as the shop is today (current prices; what is sold out is named as no longer available) with a button Go back to my cart . The e-mail is in the language the customer was using on the shop. Nobody is pestered. An address that orders is not reminded any more. A link at the bottom of each e-mail ( Stop these reminders ) stops them at once and for good. A cart whose items are all gone, or that is more than 2 days old when its first reminder would go out, is dropped without an e-mail. Your screen. Online Store > Abandoned carts shows the numbers (Waiting, Reminded once, Reminded twice, Ordered, Stopped, Nothing to remind) and a list with the e-mail address, the products and pieces, the last change and when each reminder went out. Press a number to filter. Remove deletes a cart and its address (for example when a customer asks to be forgotten). Carts untouched for two months are deleted by themselves. Note: The reminders need the e-mail settings of the business to be working and app.frontend-url set to the public address of the site. They are off until you tick the box, and nothing is saved while they are off. Loyalty points When your manager switches on Customers earn and spend loyalty points (Shop settings; it needs Customer accounts to be on), customers who are signed in earn points and spend them on later orders. Guests earn nothing: the points belong to the account. These points are the shop's own and are separate from the loyalty programme at the till (Sales). Earning. When an order is completed the customer earns points on what they paid for the goods: 1 point for every 100 by default (your manager can change it), after any coupon or points discount and without the delivery fee. On a partial delivery they earn on what was delivered. Spending. At checkout a signed-in customer with points sees Use loyalty points : they type how many, or press Use the most I can . One point takes 1 off (1 unit of the shop's currency), and points can pay at most a share of the goods (50% by default) that is left after a coupon. The shop checks the balance again when the order is sent, so the same points can never be spent twice. Their balance. In the portal ( Loyalty points ) the customer sees the balance and the history (earned, used, returned). Cancelled or refused orders give the spent points back. Returned goods give back the matching share of the points spent on them and take back the matching share of the points they earned; if the customer has already spent those points the balance can go below zero until they earn more. Your screen. Online Store > Loyalty points lists the customer accounts with their points (the most first, with a search box), shows the history of one customer, and lets you add or remove points with a reason. In your books. Points earned are an expense and a liability ( Loyalty Points Liability ); points spent on a delivered order release the liability, and the cost then shows as Sales Discounts Given . Points never expire, and deleting a customer's account deletes their points history. Points earned before version 1.73.0 are not in the liability; your accountant posts an opening entry for the points customers already hold. Text messages When your administrator has chosen a text provider, the shop can text customers about their order (only those who ticked the box at checkout), text sign-in codes, and text you about new orders. The delivery code , pick-up code , return code and new code are the exception: they are sent by e-mail and by text to the phone number of the order whether or not the box was ticked, because the code is part of the delivery. Online Store > Text messages lists every text, also the ones that failed or were not sent, and has a Send test message form. There is a daily limit to keep the cost in check. Until a real text company is connected, a built-in sender keeps every code text in the list marked Waiting for an SMS company : nothing leaves the server, and the e-mail still goes. The code itself is never written in the text list. Good to know Online orders from a phone number that already exists in Customers attach to that customer; otherwise a customer is created. A customer may have only a few orders waiting for an answer at once, and a script that sends many orders from one connection is slowed down. These limits are in Shop settings . Link previews: when a shop link is pasted in WhatsApp, Facebook, Telegram and similar apps, a card appears with the product picture, name and price, and Google can show price, stock and stars. The administrator adds one rule to the web server for this (Administrator Manual, chapter 7); without it the shop works but links show no preview. Newsletters are plain text with one optional button, with no pictures, and cannot be scheduled for later. Online orders also appear in the normal sales reports. "}, {"id": "user-24-online-store-delivery-drivers-and-cash", "manual": "user", "n": 24, "title": "Online Store: delivery,\ndrivers and cash", "html": "\n<p>This chapter follows an online delivery order from the moment staff\nset up the delivery rules to the moment the cash the driver took is\nhanded in. Everything here is on <strong>Online Store &gt; Shop\nsettings<\/strong> (the setup cards) and <strong>Online Store &gt; Online\norders<\/strong>, <strong>My deliveries<\/strong>, <strong>Driver\ncash<\/strong> and <strong>Returns<\/strong>.<\/p>\n<h2 id=\"delivery-areas-fees-and-tax\">Delivery areas, fees and tax<\/h2>\n<p>On <strong>Shop settings &gt; Delivery areas<\/strong> add each area\nyou deliver to. For each area:<\/p>\n<ul>\n<li><strong>Fee<\/strong>: what the customer pays for delivery in that\narea. With no area the shop delivers anywhere for free; with areas, the\ncustomer chooses one.<\/li>\n<li><strong>Minimum order<\/strong>: optional, for that area.<\/li>\n<li><strong>Tax<\/strong>: choose one of your existing taxes, or leave\n<em>The delivery product's tax<\/em>. The fee you type is <strong>the\namount the customer pays<\/strong>; the tax you choose is the part of it\nthat is tax, <strong>included in the fee<\/strong>. Example: a fee of\n2,000 with VAT 18% is 1,694.92 of fee plus 305.08 of tax; the customer\nstill pays 2,000. So the sale order, the invoice and the cash collected\nalways equal the total the customer saw.<\/li>\n<li><strong>Delivery days<\/strong>: <em>from<\/em> and <em>to<\/em>, in\ndays after the shop accepts the order (0 = the same day). Leave both\nempty to use the estimate of the whole shop (Shop settings &gt; Front\npage). The customer sees the estimate of <strong>his<\/strong> area at\ncheckout (as dates), on the order page and in the \"received\" and\n\"accepted\" messages. The estimate is kept on the order when it is\nplaced.<\/li>\n<\/ul>\n<p>Under <strong>The shop<\/strong>, choose the <strong>Service product\nfor the delivery fee<\/strong>: a <em>service<\/em> product (no stock)\nthat carries the delivery fee on the sale order and the invoice. Without\nit, an order that has a delivery fee cannot be accepted. When the area\nhas its own tax this product's tax is not used; otherwise give it a tax\nthat is <strong>inclusive<\/strong> (or none), because a tax added on top\nwould make the invoice, and the cash the driver should hand in, higher\nthan the total the customer saw.<\/p>\n<h2 id=\"delivery-times\">Delivery times<\/h2>\n<p><strong>Shop settings &gt; Delivery times<\/strong> lets customers\nchoose a day and a time window. It is switched off until you set it\nup.<\/p>\n<ul>\n<li><strong>Windows<\/strong>: a from and to time (for example\n08:00-11:00, 11:00-14:00, 14:00-17:00, 17:00-20:00), <strong>orders per\nday<\/strong> (0 = no limit), the <strong>weekdays<\/strong> the window\nexists, and <em>active<\/em>.<\/li>\n<li><strong>Switches<\/strong>: <em>customers choose a delivery\ntime<\/em>, <em>they must choose one<\/em> (off = \"As soon as possible\" is\nallowed), <strong>days ahead<\/strong> (0 to 60) and\n<strong>notice<\/strong> (hours before a window starts that it closes, 0\nto 72).<\/li>\n<li><strong>Days without deliveries<\/strong>: dates (a holiday, a\nstock-taking) with an optional reason. No window can be chosen that\nday.<\/li>\n<\/ul>\n<p>At checkout, under the address, the customer picks a day (Today,\nTomorrow, ...) and a window. A window that is full shows <em>Full<\/em>\nand one that starts too soon shows <em>Too late<\/em>; neither can be\npicked, even when two customers order at the same moment. Pick-up orders\nhave no window. A rejected or cancelled order frees its place.<\/p>\n<p>After the order, the window shows on the order page, in the messages,\non <strong>Online orders<\/strong> (where <strong>Change time<\/strong>\nlets staff pick any window and day, or go back to <em>As soon as\npossible<\/em>; the limit does not stop staff), on the driver's page, on\nthe <strong>delivery slip<\/strong>, and the <strong>run sheet<\/strong>\nis sorted by window then area.<\/p>\n<h2 id=\"drivers\">Drivers<\/h2>\n<p>A driver is a simple list entry, not an employee record. In\n<strong>Shop settings &gt; Drivers<\/strong> add the\n<strong>name<\/strong>, <strong>phone<\/strong> and a\n<strong>note<\/strong>, and keep <em>active<\/em> ticked. A driver with\norders still to deliver cannot be removed: switch him off instead.<\/p>\n<h3 id=\"giving-the-order-to-a-driver\">Giving the order to a driver<\/h3>\n<p>Every delivery order (New, Accepted, Packed, Out for delivery) has a\n<strong>Driver<\/strong> choice on <strong>Online orders<\/strong>. Set or\nchange it any time before delivery; the change is written in the\nhistory. <strong>Out for delivery<\/strong> asks for a driver when none\nis set, as long as the shop has active drivers. Three prints and\nshortcuts help the driver:<\/p>\n<ul>\n<li><strong>Delivery slip (PDF)<\/strong>: one page per order with the\ncustomer, phone, address, area, note, driver, delivery time, the goods,\nthe total, the amount to collect (or <em>Already paid online: nothing to\ncollect<\/em>) and signature lines. Not available for pick-up\norders.<\/li>\n<li><strong>Run sheet (PDF)<\/strong>: choose a driver (or <em>Not\nassigned<\/em>) in the filter above the orders and press <strong>Run\nsheet<\/strong>: all his orders still to deliver, grouped by area and\nsorted by time window, with the number of stops, the cash to collect and\na tick column.<\/li>\n<li><strong>WhatsApp to the driver<\/strong>: a link on the order opens\nWhatsApp to the driver with the order code, customer, phone, address and\namount to collect.<\/li>\n<\/ul>\n<p>Once the order is out for delivery the customer's order page shows\n<strong>Your driver: name, phone<\/strong>, and the \"on its way\" message\nadds them.<\/p>\n<h3 id=\"the-drivers-private-page-no-staff-login\">The driver's private\npage (no staff login)<\/h3>\n<p>A driver does not need a staff account. In <strong>Shop settings &gt;\nDrivers<\/strong> press <strong>Give a link<\/strong> on the driver. The\nprogram makes a private link (for example\n<code>https://your-shop/driver/...<\/code>) and a 4-digit\n<strong>PIN<\/strong>. The PIN is shown <strong>once<\/strong>, at that\nmoment; nobody can read it later. Buttons send the link, and the PIN\nseparately, to the driver on WhatsApp. Staff can later press\n<strong>Show link<\/strong>, make a <strong>New PIN<\/strong>, or\n<strong>Switch off<\/strong> the link; any of these signs the driver out\nat once.<\/p>\n<p>The driver opens the link on his phone, types his PIN, and sees only\n<strong>his own<\/strong> orders that are out for delivery: customer,\nphone (tap to call), address and map, the delivery time, what to\ncollect, and the goods. The page also shows:<\/p>\n<ul>\n<li><strong>Cash I hold<\/strong>: the total of the cash he took at the\ndoor and has not handed in (amber when there is something to hand in,\ngreen when nothing), the orders behind it, and his last ten hand-ins\nwith the difference. It is the same list staff settle in <strong>Driver\ncash<\/strong>. The page refreshes every 20 seconds.<\/li>\n<li><strong>Returns to collect<\/strong>: customers' returns assigned to\nhim (see below).<\/li>\n<\/ul>\n<div class=\"callout note\">\n<p><strong>Note:<\/strong> Safety: the link carries a long secret and the\nPIN is checked on top of it. Five wrong PINs lock the link for 30\nminutes (a new PIN from staff unlocks it). After the PIN the phone keeps\na session for up to 14 hours of use. Opening the link on a second phone\nsigns out the first. A driver switched off (not <em>active<\/em>) cannot\nuse his link. The site must be served over HTTPS and\n<code>app.frontend-url<\/code> must be the public address, so the link is\ncomplete.<\/p>\n<\/div>\n<p>Staff who prefer to use a phone themselves have the <strong>My\ndeliveries<\/strong> screen in the menu: pick your name once and it lists\nthe orders out for delivery with the same details.<\/p>\n<h3 id=\"handing-over-the-delivery-code\">Handing over: the delivery\ncode<\/h3>\n<p>When an order goes out for delivery (or is ready for pick-up) the\ncustomer gets a 4-digit <strong>delivery code<\/strong> by e-mail and\ntext, in the portal and on his order page. The driver, or the staff at\nthe counter, asks the customer for the code and types it under\n<strong>Hand over<\/strong>. The order is then completed exactly as if\nstaff pressed <strong>Complete<\/strong>: stock out, invoice, cash\nrecorded as collected (it then waits in <strong>Driver cash<\/strong>),\nthe customer thanked. The code is <strong>never<\/strong> shown to staff\nor drivers and is not on the delivery slip.<\/p>\n<ul>\n<li>Five wrong codes block the code for 30 minutes. A customer who lost\nthe code, or whose code was blocked, gets a new one with <strong>Send a\nnew code to the customer<\/strong> on the order; the old code stops\nworking.<\/li>\n<li>The customer can also complete the order himself: <strong>I received\nmy order<\/strong> on his order page, with an optional drawn signature. A\nsignature given there is kept and printed on the delivery slip. Drivers\nand the staff screen do not offer signatures: hand-over is by the code.\nA completed order shows how it was received (customer, code or\nsignature) and <strong>View signature<\/strong> when there is one.<\/li>\n<li>A customer's tap does not prove the driver collected the money:\ncheck the driver's cash against the run sheet as before.<\/li>\n<\/ul>\n<h2 id=\"when-the-delivery-does-not-go-as-planned\">When the delivery does\nnot go as planned<\/h2>\n<p>Only <strong>staff<\/strong> record a failed or partial delivery\n(screen <strong>Online orders<\/strong>). The driver's page tells him to\ncall the shop.<\/p>\n<h3 id=\"delivery-failed\">Delivery failed<\/h3>\n<p>On an order that is out for delivery press <strong>Delivery\nfailed<\/strong>, choose the reason (customer not at home, customer\nrefused the goods, wrong or unreachable address, no answer on the phone,\nother) and add details if you like. The order goes back to\n<strong>Packed<\/strong> with the reason and the number of tries; the\nstock stays reserved and the driver stays on the order; the customer is\ntold. Send it out again later (or give it to another driver) or cancel\nit; from the third failed try the screen suggests cancelling.<\/p>\n<p>When delivery times are on, the old window is <strong>freed at\nonce<\/strong> and the customer is asked, in the message and on his order\npage, to <strong>choose a new delivery time<\/strong> (a day, then a free\nwindow, then <strong>Confirm this delivery time<\/strong>). Staff see\n<em>Waiting for a new time<\/em> until it is set and can still use\n<strong>Change time<\/strong> after phoning the customer. If you made\ndelivery times compulsory, the order cannot go out again until a window\nis set.<\/p>\n<h3 id=\"the-customer-keeps-only-part-of-the-goods\">The customer keeps\nonly part of the goods<\/h3>\n<p>Tick the box on an order that is out for delivery (or ready for\npick-up), type the quantity <strong>kept<\/strong> for each line, then\n<strong>Complete<\/strong> (or confirm with the customer's code). The\ninvoice, the stock and the cash to collect cover only what the customer\nkept; what was not delivered is no longer reserved. The delivery fee\nstays on the invoice. Loyalty points are earned on what was\ndelivered.<\/p>\n<p>If the order was <strong>paid online<\/strong>, the part that was paid\nbut not delivered shows under <strong>Refunds due<\/strong> as <em>Refund\ndue for the goods not delivered<\/em>: refund it through the provider or\nrecord the refund you made yourself, with its reference. The customer is\ntold. Nothing delivered at all is refused: use <strong>Delivery\nfailed<\/strong> or cancel the order.<\/p>\n<h2 id=\"return-pick-ups\">Return pick-ups<\/h2>\n<p>A return of a <strong>delivered<\/strong> order is <strong>collected\nfrom the customer by a driver<\/strong>, free of charge. In\n<strong>Online Store &gt; Returns<\/strong>, when you\n<strong>Approve<\/strong> a return of a delivery order, a 4-digit\n<strong>return code<\/strong> is made and sent to the customer by e-mail\nand text (\"A driver will come to collect the goods ... Give the code to\nthe driver only when you hand over the goods\"). Choose the\n<strong>driver<\/strong> at the same time, or later in the <strong>A\ndriver collects the goods<\/strong> box (you can change or remove him\nuntil the goods are collected, and make a <strong>New return code (send\nagain)<\/strong>).<\/p>\n<p>The driver sees the return under <strong>Returns to collect<\/strong>\non his page, with the customer, phone, address, reason and goods. He\ntaps <strong>Collect the goods<\/strong>, types the return code the\ncustomer gives him and confirms. The return becomes\n<strong>Collected<\/strong> (a new tab lists them), the customer and the\nshop are told, and you then press <strong>Goods received: put back and\nrefund<\/strong> as usual. Five wrong codes lock that return for 30\nminutes; a new code unlocks it. A return of an order picked up at the\nshop has no address, code or driver: the customer brings the goods\nback.<\/p>\n<h2 id=\"cash-the-driver-holds\">Cash the driver holds<\/h2>\n<p>A delivery order paid <strong>in cash on delivery<\/strong> and\ncompleted keeps its cash as <strong>cash to be handed in<\/strong>. Open\n<strong>Online Store &gt; Driver cash<\/strong>:<\/p>\n<ul>\n<li>the tab <strong>To hand in<\/strong> shows, for each driver, the\ntotal and the orders behind it (customer, delivery time, cash\ncollected);<\/li>\n<li>the tab <strong>Settled<\/strong> shows the latest 200 settlements:\ncollected, handed in, difference, who and when, and the reason.<\/li>\n<\/ul>\n<p>To settle: choose the driver (or <em>All drivers<\/em>), and for each\norder type what the driver <strong>really handed in<\/strong> (it starts\nat the amount collected). A difference needs a <strong>reason<\/strong>\nof at least 3 characters. Tick the orders (or <strong>Select\nall<\/strong>) and press <strong>Settle the selected<\/strong>. All the\nselected orders are settled together or none is.<\/p>\n<p>In the books, the cash the driver took sits in <strong>Cash with\nDrivers<\/strong> until he hands it in; the settlement moves what he\nhanded in to <strong>Cash and Bank<\/strong> and posts a short or surplus\namount to <strong>Cash Over / Short<\/strong>. The order's history says\n<em>Driver cash handed in: X (difference Y)<\/em>. A settlement cannot be\nundone on this screen; correct a mistake with a journal entry.<\/p>\n<p>Only delivery orders paid in cash appear here. Orders paid online or\nby mobile money, and cash taken at the counter on a pick-up, never do.\nOrders delivered before version 1.72.0 settle with the difference only\n(see the accounting chapter).<\/p>\n<div class=\"callout tip\">\n<p><strong>Tip:<\/strong> Check <strong>Cash with Drivers<\/strong> in the\naccounts against the <em>To hand in<\/em> total every day. They should\nagree; a difference means an order was settled twice or a hand-in was\nposted by hand.<\/p>\n<\/div>\n", "text": " This chapter follows an online delivery order from the moment staff set up the delivery rules to the moment the cash the driver took is handed in. Everything here is on Online Store > Shop settings (the setup cards) and Online Store > Online orders , My deliveries , Driver cash and Returns . Delivery areas, fees and tax On Shop settings > Delivery areas add each area you deliver to. For each area: Fee : what the customer pays for delivery in that area. With no area the shop delivers anywhere for free; with areas, the customer chooses one. Minimum order : optional, for that area. Tax : choose one of your existing taxes, or leave The delivery product's tax . The fee you type is the amount the customer pays ; the tax you choose is the part of it that is tax, included in the fee . Example: a fee of 2,000 with VAT 18% is 1,694.92 of fee plus 305.08 of tax; the customer still pays 2,000. So the sale order, the invoice and the cash collected always equal the total the customer saw. Delivery days : from and to , in days after the shop accepts the order (0 = the same day). Leave both empty to use the estimate of the whole shop (Shop settings > Front page). The customer sees the estimate of his area at checkout (as dates), on the order page and in the \"received\" and \"accepted\" messages. The estimate is kept on the order when it is placed. Under The shop , choose the Service product for the delivery fee : a service product (no stock) that carries the delivery fee on the sale order and the invoice. Without it, an order that has a delivery fee cannot be accepted. When the area has its own tax this product's tax is not used; otherwise give it a tax that is inclusive (or none), because a tax added on top would make the invoice, and the cash the driver should hand in, higher than the total the customer saw. Delivery times Shop settings > Delivery times lets customers choose a day and a time window. It is switched off until you set it up. Windows : a from and to time (for example 08:00-11:00, 11:00-14:00, 14:00-17:00, 17:00-20:00), orders per day (0 = no limit), the weekdays the window exists, and active . Switches : customers choose a delivery time , they must choose one (off = \"As soon as possible\" is allowed), days ahead (0 to 60) and notice (hours before a window starts that it closes, 0 to 72). Days without deliveries : dates (a holiday, a stock-taking) with an optional reason. No window can be chosen that day. At checkout, under the address, the customer picks a day (Today, Tomorrow, ...) and a window. A window that is full shows Full and one that starts too soon shows Too late ; neither can be picked, even when two customers order at the same moment. Pick-up orders have no window. A rejected or cancelled order frees its place. After the order, the window shows on the order page, in the messages, on Online orders (where Change time lets staff pick any window and day, or go back to As soon as possible ; the limit does not stop staff), on the driver's page, on the delivery slip , and the run sheet is sorted by window then area. Drivers A driver is a simple list entry, not an employee record. In Shop settings > Drivers add the name , phone and a note , and keep active ticked. A driver with orders still to deliver cannot be removed: switch him off instead. Giving the order to a driver Every delivery order (New, Accepted, Packed, Out for delivery) has a Driver choice on Online orders . Set or change it any time before delivery; the change is written in the history. Out for delivery asks for a driver when none is set, as long as the shop has active drivers. Three prints and shortcuts help the driver: Delivery slip (PDF) : one page per order with the customer, phone, address, area, note, driver, delivery time, the goods, the total, the amount to collect (or Already paid online: nothing to collect ) and signature lines. Not available for pick-up orders. Run sheet (PDF) : choose a driver (or Not assigned ) in the filter above the orders and press Run sheet : all his orders still to deliver, grouped by area and sorted by time window, with the number of stops, the cash to collect and a tick column. WhatsApp to the driver : a link on the order opens WhatsApp to the driver with the order code, customer, phone, address and amount to collect. Once the order is out for delivery the customer's order page shows Your driver: name, phone , and the \"on its way\" message adds them. The driver's private page (no staff login) A driver does not need a staff account. In Shop settings > Drivers press Give a link on the driver. The program makes a private link (for example https://your-shop/driver/... ) and a 4-digit PIN . The PIN is shown once , at that moment; nobody can read it later. Buttons send the link, and the PIN separately, to the driver on WhatsApp. Staff can later press Show link , make a New PIN , or Switch off the link; any of these signs the driver out at once. The driver opens the link on his phone, types his PIN, and sees only his own orders that are out for delivery: customer, phone (tap to call), address and map, the delivery time, what to collect, and the goods. The page also shows: Cash I hold : the total of the cash he took at the door and has not handed in (amber when there is something to hand in, green when nothing), the orders behind it, and his last ten hand-ins with the difference. It is the same list staff settle in Driver cash . The page refreshes every 20 seconds. Returns to collect : customers' returns assigned to him (see below). Note: Safety: the link carries a long secret and the PIN is checked on top of it. Five wrong PINs lock the link for 30 minutes (a new PIN from staff unlocks it). After the PIN the phone keeps a session for up to 14 hours of use. Opening the link on a second phone signs out the first. A driver switched off (not active ) cannot use his link. The site must be served over HTTPS and app.frontend-url must be the public address, so the link is complete. Staff who prefer to use a phone themselves have the My deliveries screen in the menu: pick your name once and it lists the orders out for delivery with the same details. Handing over: the delivery code When an order goes out for delivery (or is ready for pick-up) the customer gets a 4-
