\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Version running, date installed or upgraded<\/td>\n<td>1.76.0, 2026-11-24<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Installation id, licence number and expiry, modules<\/td>\n<td>..., LIC-0007, 2027-11-30, Sales, Purchases, Accounting, POS, Online\nStore<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Chart (Rwanda or Chad), currency, language<\/td>\n<td>Rwanda, RWF, English<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Payment providers on, and who registered each<\/td>\n<td>MTN MoMo (Acme Ltd), Airtel Money (Acme Ltd)<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Backups: where copies go, retention, date of the last restore\ntest<\/td>\n<td>bucket-acme, 30/12/12, 2026-11-24<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Support agreement and hours<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"secrets\">Secrets<\/h2>\n<ul>\n<li><strong>One password manager<\/strong> for the team, with a folder\nfor each customer: database password, JWT secret, e-mail account,\nprovider keys, the server login.<\/li>\n<li><strong>Rotate<\/strong> the secrets of a customer when a person who\nknew them leaves, when a secret was ever pasted in a chat, e-mail or\nrepository, and once a year. Rotating the JWT secret signs everyone out\n(harmless). Rotating the database password means changing it in\nPostgreSQL and in <code>config/application.properties<\/code>, then\nrestarting.<\/li>\n<li>A payment provider key that was ever committed or sent unprotected\nis <strong>burnt<\/strong>: ask the provider for a new one and revoke the\nold.<\/li>\n<li>The <strong>licence signing key<\/strong> is NIWE's own: it never\ngoes to a customer's machine and is backed up in two places.<\/li>\n<\/ul>\n<h2 id=\"the-yearly-security-routine\">The yearly security routine<\/h2>\n<p>For every customer, once a year (and after any incident): the\nchecklist of the Administrator Manual (chapter 13); updates of the\noperating system, Java, PostgreSQL and nginx; a review of the staff list\nand removal of leavers; a look at the sign-in log and the audit log; a\nrestore drill; a check that the database and backend ports are not\nreachable from outside (<code>nmap<\/code> from another machine); and a\ncheck that the demo account and the <code>dev<\/code> profile are not in\nuse.<\/p>\n<h2 id=\"privacy\">Privacy<\/h2>\n<p>A customer's installation holds personal data: staff, customers, and\nfor an Online Store the names, phone numbers, addresses and e-mail\naddresses of shoppers, newsletter subscribers and abandoned-cart\nvisitors. Tell the customer that the <strong>data-protection rules of\ntheir country<\/strong> apply to them as the owner of the data, that the\nshop pages (Privacy Policy, Terms) must be adapted to their business and\nchecked, that backups must be kept private, and that a shopper's account\ncan be deleted from the portal and a subscriber removed from the\nNewsletter screen on request.<\/p>\n<h2 id=\"known-gaps-to-keep-in-mind\">Known gaps to keep in mind<\/h2>\n<ul>\n<li>The jar's built-in default for <code>app.jwt.secret<\/code> is\npublic. <strong>Always<\/strong> set a value of your own in the\ncustomer's settings.<\/li>\n<li>Real MTN Mobile Money, Airtel Money and card payments have been\ntested only against imitations. A customer's first live provider must be\ntested with small real payments before the shop opens.<\/li>\n<li>The text message provider is a placeholder until a real company is\nconnected; codes by text stay in the text list until then (the e-mail\nstill goes).<\/li>\n<\/ul>\n", "text": " The customer register Keep one table (a spreadsheet kept in a shared place that only the team can reach) with a line for each customer. It is the first thing you open when anything happens. It does not hold passwords or keys : those are in the password manager. Column Example Customer code, name, country acme , Acme Ltd, Rwanda Contact person for IT and for the business names, phones, e-mails Server, address and domain server-3, erp.acme.com Backend port, folder, database name 9101, /opt/niwe/acme, niwe_acme Version running, date installed or upgraded 1.76.0, 2026-11-24 Installation id, licence number and expiry, modules ..., LIC-0007, 2027-11-30, Sales, Purchases, Accounting, POS, Online Store Chart (Rwanda or Chad), currency, language Rwanda, RWF, English Payment providers on, and who registered each MTN MoMo (Acme Ltd), Airtel Money (Acme Ltd) Backups: where copies go, retention, date of the last restore test bucket-acme, 30/12/12, 2026-11-24 Support agreement and hours Secrets One password manager for the team, with a folder for each customer: database password, JWT secret, e-mail account, provider keys, the server login. Rotate the secrets of a customer when a person who knew them leaves, when a secret was ever pasted in a chat, e-mail or repository, and once a year. Rotating the JWT secret signs everyone out (harmless). Rotating the database password means changing it in PostgreSQL and in config/application.properties , then restarting. A payment provider key that was ever committed or sent unprotected is burnt : ask the provider for a new one and revoke the old. The licence signing key is NIWE's own: it never goes to a customer's machine and is backed up in two places. The yearly security routine For every customer, once a year (and after any incident): the checklist of the Administrator Manual (chapter 13); updates of the operating system, Java, PostgreSQL and nginx; a review of the staff list and removal of leavers; a look at the sign-in log and the audit log; a restore drill; a check that the database and backend ports are not reachable from outside ( nmap from another machine); and a check that the demo account and the dev profile are not in use. Privacy A customer's installation holds personal data: staff, customers, and for an Online Store the names, phone numbers, addresses and e-mail addresses of shoppers, newsletter subscribers and abandoned-cart visitors. Tell the customer that the data-protection rules of their country apply to them as the owner of the data, that the shop pages (Privacy Policy, Terms) must be adapted to their business and checked, that backups must be kept private, and that a shopper's account can be deleted from the portal and a subscriber removed from the Newsletter screen on request. Known gaps to keep in mind The jar's built-in default for app.jwt.secret is public. Always set a value of your own in the customer's settings. Real MTN Mobile Money, Airtel Money and card payments have been tested only against imitations. A customer's first live provider must be tested with small real payments before the shop opens. The text message provider is a placeholder until a real company is connected; codes by text stay in the text list until then (the e-mail still goes). "}, {"id": "onboard-1-the-onboarding-path", "manual": "onboard", "n": 1, "title": "The onboarding path", "html": "\n<h2 id=\"who-this-guide-is-for\">Who this guide is for<\/h2>\n<p>This guide is for the person who brings <strong>a new business onto\nNIWE ERP<\/strong>: a NIWE implementer, a partner, or the customer's own\nproject lead. It follows the customer from the first conversation to the\nend of the first month-end close. The server work is in the\n<strong>Installation and deployment guide<\/strong>; day-to-day screens\nare in the <strong>User Manual<\/strong>; settings are in the\n<strong>Administrator Manual<\/strong>. Here you will find the order of\nthe work, the questions to ask, the data to prepare, how to train, how\nto launch the online shop and how to hand over.<\/p>\n<p>A business that follows these steps in order, and ticks each box,\nstarts with books it can trust. A business that skips the opening\nbalances or the training starts with a mess it will spend months\ncleaning.<\/p>\n<h2 id=\"the-path-in-five-stages\">The path in five stages<\/h2>\n<div class=\"tablewrap\"><table>\n<colgroup>\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Stage<\/th>\n<th>Typical time<\/th>\n<th>What happens<\/th>\n<th>Result<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>1. Discovery<\/strong><\/td>\n<td>1 to 3 days<\/td>\n<td>Understand the business; agree the modules, the chart of accounts,\nthe users and the date to start (chapter 2).<\/td>\n<td>A signed list of what will be installed and used.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>2. Install<\/strong><\/td>\n<td>1 day<\/td>\n<td>The server and the program are installed for this customer and the\nlicence is loaded (Installation guide).<\/td>\n<td>A running, empty system at the customer's own address.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>3. Set up and load<\/strong><\/td>\n<td>1 to 2 weeks<\/td>\n<td>Business details, taxes, accounts, roles, products, customers,\nsuppliers, opening balances (chapters 3 and 4).<\/td>\n<td>A system that matches the business on the start date.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>4. Train and rehearse<\/strong><\/td>\n<td>1 week<\/td>\n<td>Each role is trained on its own tasks; the team runs a full day of\n\"pretend\" work (chapter 5).<\/td>\n<td>People who can do their job without help.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>5. Go live and look after<\/strong><\/td>\n<td>Day 0 to the first month-end<\/td>\n<td>Real work starts; daily support; first routines; first close\n(chapters 7 and 8).<\/td>\n<td>A signed hand-over.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>An online shop adds a sixth, parallel stage: the <strong>shop\nlaunch<\/strong> (chapter 6), which should only start once the first five\nstages are finished for the till and the books.<\/p>\n<h2 id=\"who-does-what\">Who does what<\/h2>\n<p>Name these people on the first day and write them in the customer\nregister:<\/p>\n<ul>\n<li><strong>The owner or sponsor<\/strong>: decides, signs, and is the\nperson to call when something is stuck.<\/li>\n<li><strong>The business administrator<\/strong>: holds the Admin\naccount, creates users, does the daily checks. This person reads the\nAdministrator Manual.<\/li>\n<li><strong>The accountant<\/strong>: owns the chart of accounts, the\nopening balances and the month-end close.<\/li>\n<li><strong>A champion for each module<\/strong> (cashier lead, store\nkeeper, HR officer, shop manager): learns first and helps the\nothers.<\/li>\n<li><strong>The NIWE implementer<\/strong> and <strong>the NIWE support\ncontact<\/strong>.<\/li>\n<\/ul>\n<div class=\"callout tip\">\n<p><strong>Tip:<\/strong> Choose a <strong>start date at the beginning of\na month<\/strong> (or of a financial year). Opening balances, stock\ncounts and the first close are much simpler when the old system and the\nnew one meet on a clean boundary.<\/p>\n<\/div>\n<h2 id=\"what-the-customer-must-provide\">What the customer must\nprovide<\/h2>\n<p>Ask for these early; most delays come from waiting for one of\nthem:<\/p>\n<ul>\n<li>the business's legal name, address, tax number and logo;<\/li>\n<li>a <strong>domain name<\/strong> (or permission to use one of NIWE's)\nand who manages its DNS;<\/li>\n<li>an <strong>e-mail account<\/strong> the system can send from (SMTP\ndetails) and addresses for the owner's alerts;<\/li>\n<li>the list of <strong>modules<\/strong> wanted, the\n<strong>branches<\/strong>, and the <strong>people<\/strong> who will use\nthe system with their e-mail addresses and roles;<\/li>\n<li><strong>products, customers and suppliers<\/strong> in a spreadsheet\n(chapter 3), and the <strong>opening figures<\/strong> at the start\ndate;<\/li>\n<li>for an online shop: pictures and descriptions, delivery areas and\nfees, the <strong>payment providers<\/strong> and accounts (chapter 6),\nand the shop's terms.<\/li>\n<\/ul>\n", "text": " Who this guide is for This guide is for the person who brings a new business onto NIWE ERP : a NIWE implementer, a partner, or the customer's own project lead. It follows the customer from the first conversation to the end of the first month-end close. The server work is in the Installation and deployment guide ; day-to-day screens are in the User Manual ; settings are in the Administrator Manual . Here you will find the order of the work, the questions to ask, the data to prepare, how to train, how to launch the online shop and how to hand over. A business that follows these steps in order, and ticks each box, starts with books it can trust. A business that skips the opening balances or the training starts with a mess it will spend months cleaning. The path in five stages Stage Typical time What happens Result 1. Discovery 1 to 3 days Understand the business; agree the modules, the chart of accounts, the users and the date to start (chapter 2). A signed list of what will be installed and used. 2. Install 1 day The server and the program are installed for this customer and the licence is loaded (Installation guide). A running, empty system at the customer's own address. 3. Set up and load 1 to 2 weeks Business details, taxes, accounts, roles, products, customers, suppliers, opening balances (chapters 3 and 4). A system that matches the business on the start date. 4. Train and rehearse 1 week Each role is trained on its own tasks; the team runs a full day of \"pretend\" work (chapter 5). People who can do their job without help. 5. Go live and look after Day 0 to the first month-end Real work starts; daily support; first routines; first close (chapters 7 and 8). A signed hand-over. An online shop adds a sixth, parallel stage: the shop launch (chapter 6), which should only start once the first five stages are finished for the till and the books. Who does what Name these people on the first day and write them in the customer register: The owner or sponsor : decides, signs, and is the person to call when something is stuck. The business administrator : holds the Admin account, creates users, does the daily checks. This person reads the Administrator Manual. The accountant : owns the chart of accounts, the opening balances and the month-end close. A champion for each module (cashier lead, store keeper, HR officer, shop manager): learns first and helps the others. The NIWE implementer and the NIWE support contact . Tip: Choose a start date at the beginning of a month (or of a financial year). Opening balances, stock counts and the first close are much simpler when the old system and the new one meet on a clean boundary. What the customer must provide Ask for these early; most delays come from waiting for one of them: the business's legal name, address, tax number and logo; a domain name (or permission to use one of NIWE's) and who manages its DNS; an e-mail account the system can send from (SMTP details) and addresses for the owner's alerts; the list of modules wanted, the branches , and the people who will use the system with their e-mail addresses and roles; products, customers and suppliers in a spreadsheet (chapter 3), and the opening figures at the start date; for an online shop: pictures and descriptions, delivery areas and fees, the payment providers and accounts (chapter 6), and the shop's terms. "}, {"id": "onboard-2-stage-1-discovery", "manual": "onboard", "n": 2, "title": "Stage 1: discovery", "html": "\n<p>A one-hour conversation with the owner and the accountant, and a\nshort walk around the business. Take the answers into the customer\nregister and into a one-page <strong>scope<\/strong> the owner signs.<\/p>\n<h2 id=\"questions-to-ask\">Questions to ask<\/h2>\n<p><strong>The business<\/strong><\/p>\n<ul>\n<li>What does the business sell or do? Which of these apply: shop with\ntills, restaurant, hotel, manufacturing, services with work orders,\nbookings, subscriptions, instalment sales, helpdesk, law firm, real\nestate, property management, an online shop?<\/li>\n<li>How many <strong>branches<\/strong>, <strong>warehouses<\/strong> and\n<strong>tills<\/strong>? How many people will have a login?<\/li>\n<li>Which <strong>country<\/strong> and which <strong>chart of\naccounts<\/strong> (Rwanda or Chad; this also sets the currency, RWF or\nXAF, and the starting language)? Does the accountant have a chart they\nmust keep?<\/li>\n<li>Which <strong>taxes<\/strong> (VAT rate, exempt goods)? Are prices\nshown with tax included?<\/li>\n<li>Which <strong>payment methods<\/strong> are used: cash, card, MTN\nMobile Money, Airtel Money, bank transfer, credit to customers, gift\ncards, loyalty points?<\/li>\n<li>How are <strong>suppliers<\/strong> paid and\n<strong>customers<\/strong> invoiced today? Is there credit? What are the\ncredit limits?<\/li>\n<li>Who <strong>approves<\/strong> discounts, voids, large expenses?<\/li>\n<li>What <strong>reports<\/strong> does the owner want every day, week\nand month? Should some be e-mailed on a schedule?<\/li>\n<li>Which <strong>devices<\/strong>: PCs for tills, thermal printers,\ncash drawers, barcode scanners, customer displays?<\/li>\n<li>What exists today (another system, spreadsheets, paper) and what\ndata can come from it?<\/li>\n<\/ul>\n<p><strong>The online shop<\/strong> (when wanted)<\/p>\n<ul>\n<li>Delivery, pick-up or both? Which <strong>areas<\/strong> and fees?\nWho delivers (own drivers)? Is cash on delivery accepted?<\/li>\n<li>Which <strong>online payment providers<\/strong>: MTN Mobile Money,\nAirtel Money, card? Who in the business can <strong>register<\/strong>\nthem (it must be the business, in its own name)? Is there a separate\nwallet or bank account for each?<\/li>\n<li>Who answers orders, how fast, and from which screen? Who packs and\nwho hands over?<\/li>\n<li>What are the shop's <strong>Terms<\/strong>, <strong>returns\npolicy<\/strong> and <strong>privacy<\/strong> rules? (The program\nsupplies starter texts, not legal advice.)<\/li>\n<li>Pictures and descriptions for how many products? Is there a brand\ncolour and logo?<\/li>\n<\/ul>\n<h2 id=\"the-scope-sheet\">The scope sheet<\/h2>\n<p>Write down, and have the owner sign: the modules; the branches,\nwarehouses and tills; the number of users by role; the chart and\ncurrency; the languages; the payment methods and providers; the data to\nbe loaded; the start date; the dates of training and go-live; the shop's\nlaunch date if any; what is <strong>not<\/strong> included. Everything\nnot on the sheet is a later project.<\/p>\n<h2 id=\"licence\">Licence<\/h2>\n<p>Send NIWE the list of modules. The licence is issued for the\ninstallation id shown on <strong>Settings &gt; Modules<\/strong> after\nthe server is installed (Installation guide, chapter 6). It is checked\nwithout internet. Note the <strong>expiry date<\/strong> in the register\nand set a reminder 60 days before; the administrator sees a warning only\nin the last 30 days.<\/p>\n", "text": " A one-hour conversation with the owner and the accountant, and a short walk around the business. Take the answers into the customer register and into a one-page scope the owner signs. Questions to ask The business What does the business sell or do? Which of these apply: shop with tills, restaurant, hotel, manufacturing, services with work orders, bookings, subscriptions, instalment sales, helpdesk, law firm, real estate, property management, an online shop? How many branches , warehouses and tills ? How many people will have a login? Which country and which chart of accounts (Rwanda or Chad; this also sets the currency, RWF or XAF, and the starting language)? Does the accountant have a chart they must keep? Which taxes (VAT rate, exempt goods)? Are prices shown with tax included? Which payment methods are used: cash, card, MTN Mobile Money, Airtel Money, bank transfer, credit to customers, gift cards, loyalty points? How are suppliers paid and customers invoiced today? Is there credit? What are the credit limits? Who approves discounts, voids, large expenses? What reports does the owner want every day, week and month? Should some be e-mailed on a schedule? Which devices : PCs for tills, thermal printers, cash drawers, barcode scanners, customer displays? What exists today (another system, spreadsheets, paper) and what data can come from it? The online shop (when wanted) Delivery, pick-up or both? Which areas and fees? Who delivers (own drivers)? Is cash on delivery accepted? Which online payment providers : MTN Mobile Money, Airtel Money, card? Who in the business can register them (it must be the business, in its own name)? Is there a separate wallet or bank account for each? Who answers orders, how fast, and from which screen? Who packs and who hands over? What are the shop's Terms , returns policy and privacy rules? (The program supplies starter texts, not legal advice.) Pictures and descriptions for how many products? Is there a brand colour and logo? The scope sheet Write down, and have the owner sign: the modules; the branches, warehouses and tills; the number of users by role; the chart and currency; the languages; the payment methods and providers; the data to be loaded; the start date; the dates of training and go-live; the shop's launch date if any; what is not included. Everything not on the sheet is a later project. Licence Send NIWE the list of modules. The licence is issued for the installation id shown on Settings > Modules after the server is installed (Installation guide, chapter 6). It is checked without internet. Note the expiry date in the register and set a reminder 60 days before; the administrator sees a warning only in the last 30 days. "}, {"id": "onboard-3-stage-3-preparing-and-loading-the-data", "manual": "onboard", "n": 3, "title": "Stage 3: preparing and\nloading the data", "html": "\n<p>The quality of the data decides the quality of the first month.\nPrepare it in spreadsheets <strong>before<\/strong> the training, check\nit with the program's <em>Check file<\/em> (which saves nothing), and\nload it only when the result is what you want.<\/p>\n<h2 id=\"order-of-work\">Order of work<\/h2>\n<ol type=\"1\">\n<li><strong>Settings first.<\/strong> Business details, system settings\n(currency, date format, language, discount mode), taxes, payment\nmethods, branches and warehouses, then the <strong>chart of\naccounts<\/strong> and the accounting controls (Administrator Manual,\nchapters 5 and 6). Choose the chart country carefully: it is locked\nafter the first screen.<\/li>\n<li><strong>Roles and staff<\/strong> (Administrator Manual, chapter 4),\nwith each person's e-mail address.<\/li>\n<li><strong>Categories and brands<\/strong>, then\n<strong>products<\/strong> (with barcodes, cost and sale prices, taxes,\nunits, reorder levels), then <strong>customers<\/strong> and\n<strong>suppliers<\/strong>.<\/li>\n<li><strong>Opening stock<\/strong>, <strong>customer balances<\/strong>\nand <strong>supplier balances<\/strong>, then <strong>ledger opening\nbalances<\/strong> for the rest.<\/li>\n<\/ol>\n<h2 id=\"importing\">Importing<\/h2>\n<p><strong>Settings &gt; Backup &amp; Data &gt; Bulk import<\/strong>\n(also inside some modules for employees, law clients, properties). For\neach importer: <strong>Download template<\/strong>, fill it keeping the\nheader row, choose the file and press <strong>Check file<\/strong>; read\nhow many rows can be imported and the <strong>list of rows that will be\nskipped, with the reason<\/strong>; correct the file and check again\nuntil it is clean; then press <strong>Import<\/strong>. A bad row is\nskipped and listed; the rest still imports. Split big files (module\nimports read the first sheet only, up to 2,000 rows).<\/p>\n<p>Rules of thumb:<\/p>\n<ul>\n<li>One product, one barcode, one unit. Decide the <strong>naming\nrules<\/strong> (capitals, brand first or last) before importing, so the\ncatalogue is consistent.<\/li>\n<li>Check <strong>tax<\/strong> on every product: a wrong tax on the\nfirst import is a wrong tax on every sale.<\/li>\n<li>Customer and supplier <strong>opening balances<\/strong> become real\n<code>OB-<\/code> invoices and bills that age and are collected and paid\nlike any other. Load them one line per open document, not one\ntotal.<\/li>\n<\/ul>\n<h2 id=\"opening-balances-the-books-must-start-from-the-truth\">Opening\nbalances: the books must start from the truth<\/h2>\n<p>Choose the <strong>opening date<\/strong> (for example the first of a\nmonth) and have the accountant approve each figure:<\/p>\n<ul class=\"task-list\">\n<li><label><input type=\"checkbox\" /><strong>Cash and Bank<\/strong>: the\ncounted cash and each bank balance on that date.<\/label><\/li>\n<li><label><input type=\"checkbox\" /><strong>Mobile money and\ncard<\/strong>: what each provider owes the business at that date (the\nclearing accounts) and the balance of each wallet or bank account that\nreceives payouts.<\/label><\/li>\n<li><label><input type=\"checkbox\" /><strong>Stock<\/strong>: a\n<strong>stock count<\/strong> of every product (quantity and cost), so\nthat Inventory agrees with the shelf. Count on the opening date or\nadjust back to it.<\/label><\/li>\n<li><label><input type=\"checkbox\" /><strong>Customers who owe and\nsuppliers owed<\/strong>: one document per open invoice or\nbill.<\/label><\/li>\n<li><label><input type=\"checkbox\" /><strong>Loyalty points<\/strong>\ncustomers already hold, <strong>gift cards<\/strong> and <strong>store\ncredit<\/strong> already sold: these are liabilities.<\/label><\/li>\n<li><label><input type=\"checkbox\" /><strong>Fixed assets, loans and the\nowner's equity.<\/strong><\/label><\/li>\n<li><label><input type=\"checkbox\" /><strong>Check:<\/strong> the trial\nbalance balances and <strong>Suspense is zero<\/strong>.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Set the <strong>accounting lock\ndate<\/strong> to the day before the opening date, so nobody can post\ninto closed days.<\/label><\/li>\n<\/ul>\n<div class=\"callout warning\">\n<p><strong>Warning:<\/strong> Do not start trading on the new system with\na stock list that nobody counted. A negative or invented stock quantity\nis the most common reason owners stop trusting a new system.<\/p>\n<\/div>\n", "text": " The quality of the data decides the quality of the first month. Prepare it in spreadsheets before the training, check it with the program's Check file (which saves nothing), and load it only when the result is what you want. Order of work Settings first. Business details, system settings (currency, date format, language, discount mode), taxes, payment methods, branches and warehouses, then the chart of accounts and the accounting controls (Administrator Manual, chapters 5 and 6). Choose the chart country carefully: it is locked after the first screen. Roles and staff (Administrator Manual, chapter 4), with each person's e-mail address. Categories and brands , then products (with barcodes, cost and sale prices, taxes, units, reorder levels), then customers and suppliers . Opening stock , customer balances and supplier balances , then ledger opening balances for the rest. Importing Settings > Backup & Data > Bulk import (also inside some modules for employees, law clients, properties). For each importer: Download template , fill it keeping the header row, choose the file and press Check file ; read how many rows can be imported and the list of rows that will be skipped, with the reason ; correct the file and check again until it is clean; then press Import . A bad row is skipped and listed; the rest still imports. Split big files (module imports read the first sheet only, up to 2,000 rows). Rules of thumb: One product, one barcode, one unit. Decide the naming rules (capitals, brand first or last) before importing, so the catalogue is consistent. Check tax on every product: a wrong tax on the first import is a wrong tax on every sale. Customer and supplier opening balances become real OB- invoices and bills that age and are collected and paid like any other. Load them one line per open document, not one total. Opening balances: the books must start from the truth Choose the opening date (for example the first of a month) and have the accountant approve each figure: Cash and Bank : the counted cash and each bank balance on that date. Mobile money and card : what each provider owes the business at that date (the clearing accounts) and the balance of each wallet or bank account that receives payouts. Stock : a stock count of every product (quantity and cost), so that Inventory agrees with the shelf. Count on the opening date or adjust back to it. Customers who owe and suppliers owed : one document per open invoice or bill. Loyalty points customers already hold, gift cards and store credit already sold: these are liabilities. Fixed assets, loans and the owner's equity. Check: the trial balance balances and Suspense is zero . Set the accounting lock date to the day before the opening date, so nobody can post into closed days. Warning: Do not start trading on the new system with a stock list that nobody counted. A negative or invented stock quantity is the most common reason owners stop trusting a new system. "}, {"id": "onboard-4-stage-3-continued-the-set-up-workshop", "manual": "onboard", "n": 4, "title": "Stage 3 continued: the\nset-up workshop", "html": "\n<p>Run this with the business administrator beside you, so that they\nlearn where each setting lives.<\/p>\n<h2 id=\"per-module\">Per module<\/h2>\n<p>Go through the module settings of every module the customer uses\n(Administrator Manual, chapter 7): sales (discount limits, switches for\npromotions, gift cards and loyalty), POS (receipts, shifts, cash rules),\ninventory (negative stock, batch and expiry, cartons), expenses\n(approval limits), assets, and so on. Write down every choice in the\nregister's notes so that the next person knows why.<\/p>\n<h2 id=\"tills-and-devices\">Tills and devices<\/h2>\n<p>For each till PC (Administrator Manual, chapter 8): bind the register\nto the PC where tills are in public areas; connect the thermal printer\nand press <strong>Print test page<\/strong>; test the cash drawer, the\nbarcode scanner and the customer display. A direct thermal printing\nneeds Chrome or Edge on <strong>https<\/strong> (or localhost). Print a\ntest receipt and check the business name, tax number, VAT lines and the\nfooter text.<\/p>\n<h2 id=\"e-mail-alerts-and-reports\">E-mail, alerts and reports<\/h2>\n<p>Set up e-mail and press <strong>Send test email<\/strong> (chapter 9).\nChoose the addresses for the <strong>business alerts<\/strong> (low\nstock, expiring quotations, credit limit warnings, unanswered shop\norders) and the <strong>scheduled reports<\/strong> the owner asked for\n(for example the daily sales summary and the Online Store sales\nreports).<\/p>\n<h2 id=\"security-before-real-data\">Security before real data<\/h2>\n<p>Run the Administrator Manual's <strong>Security checklist<\/strong>\n(chapter 13): new admin password, no demo accounts, each person with\ntheir own login and PIN, approval permissions only where needed, https\nonly, a nightly backup with a copy off the server, and the first\n<strong>restore test<\/strong>.<\/p>\n<h2 id=\"a-first-test-day\">A first test day<\/h2>\n<p>Before the training, the administrator and the implementer do a\n<strong>dry run<\/strong> with the real data: ring up a few sales of each\nkind at the till, take a payment, return an item, close a session and\nprint the Z report; create an invoice and receive a purchase; open the\nJournal and the Trial Balance and check that the entries make sense. Fix\nthe settings that did not behave as expected now, not on the first day\nof real trading.<\/p>\n", "text": " Run this with the business administrator beside you, so that they learn where each setting lives. Per module Go through the module settings of every module the customer uses (Administrator Manual, chapter 7): sales (discount limits, switches for promotions, gift cards and loyalty), POS (receipts, shifts, cash rules), inventory (negative stock, batch and expiry, cartons), expenses (approval limits), assets, and so on. Write down every choice in the register's notes so that the next person knows why. Tills and devices For each till PC (Administrator Manual, chapter 8): bind the register to the PC where tills are in public areas; connect the thermal printer and press Print test page ; test the cash drawer, the barcode scanner and the customer display. A direct thermal printing needs Chrome or Edge on https (or localhost). Print a test receipt and check the business name, tax number, VAT lines and the footer text. E-mail, alerts and reports Set up e-mail and press Send test email (chapter 9). Choose the addresses for the business alerts (low stock, expiring quotations, credit limit warnings, unanswered shop orders) and the scheduled reports the owner asked for (for example the daily sales summary and the Online Store sales reports). Security before real data Run the Administrator Manual's Security checklist (chapter 13): new admin password, no demo accounts, each person with their own login and PIN, approval permissions only where needed, https only, a nightly backup with a copy off the server, and the first restore test . A first test day Before the training, the administrator and the implementer do a dry run with the real data: ring up a few sales of each kind at the till, take a payment, return an item, close a session and print the Z report; create an invoice and receive a purchase; open the Journal and the Trial Balance and check that the entries make sense. Fix the settings that did not behave as expected now, not on the first day of real trading. "}, {"id": "onboard-5-stage-4-training-and-rehearsal", "manual": "onboard", "n": 5, "title": "Stage 4: training and\nrehearsal", "html": "\n<h2 id=\"train-by-role-not-by-screen\">Train by role, not by screen<\/h2>\n<p>People remember what they do every day. Give each role a\n<strong>short session on their own tasks<\/strong>, with the real system\nand real (but test) data, and the matching <strong>Quick Start\ncard<\/strong> on paper beside them. Keep sessions to 60 to 90 minutes\nand let people click.<\/p>\n<div class=\"tablewrap\"><table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Role<\/th>\n<th>Teach (User Manual chapters)<\/th>\n<th>Card<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Cashier<\/td>\n<td>POS: sell, take payment, returns, cash, the offline queue, end of\nshift (chapter 2)<\/td>\n<td>Cashier<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Shift supervisor<\/td>\n<td>Open and close sessions, approvals with a manager PIN, X and Z\nreports<\/td>\n<td>Supervisor<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Sales staff<\/td>\n<td>Quotations, sale orders, invoices, customers, price lists (chapters\n3 and 4)<\/td>\n<td>Sales<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Store keeper<\/td>\n<td>Receiving, stock counts, transfers, adjustments, reorder (chapters 5\nand 6)<\/td>\n<td>Storekeeper<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Purchasing<\/td>\n<td>Requisitions, purchase orders, supplier bills (chapter 5)<\/td>\n<td>Purchasing<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Accountant<\/td>\n<td>Chart, journal entries, controls, bank reconciliation, reports,\nexpenses (chapters 10 and 11)<\/td>\n<td>Accountant<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Restaurant, hotel, front desk, HR, booking, helpdesk<\/td>\n<td>Their module chapters<\/td>\n<td>Their card<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Online shop staff and drivers<\/td>\n<td>Online Store chapters 23 to 25<\/td>\n<td>Online shop staff<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Administrator<\/td>\n<td>The Administrator Manual: users, modules, backup, upgrades, logs,\ntroubleshooting<\/td>\n<td>Administrator<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"the-three-habits-to-teach-first\">The three habits to teach\nfirst<\/h2>\n<ol type=\"1\">\n<li><strong>Never share a login or PIN.<\/strong> Everything is recorded\nunder the person's name.<\/li>\n<li><strong>Do not delete: void, credit or return.<\/strong> The books\nstay honest and the audit log keeps the trail.<\/li>\n<li><strong>Count the till and record the difference.<\/strong> At the\nend of each shift, every day.<\/li>\n<\/ol>\n<h2 id=\"the-rehearsal-day\">The rehearsal day<\/h2>\n<p>One full \"pretend\" day, a few days before go-live, with everybody at\ntheir post and the implementer walking around:<\/p>\n<ul>\n<li>tills open with a float, sell all day with test products, take every\nkind of payment the business uses, make returns and voids;<\/li>\n<li>the store keeper receives a purchase and does a stock count;<\/li>\n<li>the accountant looks at the journal and the trial balance at the\nend, and closes a test session;<\/li>\n<li>the administrator restores a backup into the spare database (the\nrestore test) and reads the log;<\/li>\n<li>for the shop: a test customer places orders, staff answer them, and\na driver (or a colleague) completes one by code.<\/li>\n<\/ul>\n<p>Write down every question that came up; the answers become the\ncustomer's own cheat sheet and, if the manuals are unclear, feedback to\nNIWE.<\/p>\n<h2 id=\"after-training-the-cheat-sheet\">After training: the cheat\nsheet<\/h2>\n<p>Give the customer a one-page sheet with: the address of the system,\nwho the administrator is, who to call at NIWE and in what hours, how to\nreset a password, what to do when the connection drops (keep selling; do\nnot clear the browser while the offline queue has sales), and where to\nfind the manuals and the wiki.<\/p>\n", "text": " Train by role, not by screen People remember what they do every day. Give each role a short session on their own tasks , with the real system and real (but test) data, and the matching Quick Start card on paper beside them. Keep sessions to 60 to 90 minutes and let people click. Role Teach (User Manual chapters) Card Cashier POS: sell, take payment, returns, cash, the offline queue, end of shift (chapter 2) Cashier Shift supervisor Open and close sessions, approvals with a manager PIN, X and Z reports Supervisor Sales staff Quotations, sale orders, invoices, customers, price lists (chapters 3 and 4) Sales Store keeper Receiving, stock counts, transfers, adjustments, reorder (chapters 5 and 6) Storekeeper Purchasing Requisitions, purchase orders, supplier bills (chapter 5) Purchasing Accountant Chart, journal entries, controls, bank reconciliation, reports, expenses (chapters 10 and 11) Accountant Restaurant, hotel, front desk, HR, booking, helpdesk Their module chapters Their card Online shop staff and drivers Online Store chapters 23 to 25 Online shop staff Administrator The Administrator Manual: users, modules, backup, upgrades, logs, troubleshooting Administrator The three habits to teach first Never share a login or PIN. Everything is recorded under the person's name. Do not delete: void, credit or return. The books stay honest and the audit log keeps the trail. Count the till and record the difference. At the end of each shift, every day. The rehearsal day One full \"pretend\" day, a few days before go-live, with everybody at their post and the implementer walking around: tills open with a float, sell all day with test products, take every kind of payment the business uses, make returns and voids; the store keeper receives a purchase and does a stock count; the accountant looks at the journal and the trial balance at the end, and closes a test session; the administrator restores a backup into the spare database (the restore test) and reads the log; for the shop: a test customer places orders, staff answer them, and a driver (or a colleague) completes one by code. Write down every question that came up; the answers become the customer's own cheat sheet and, if the manuals are unclear, feedback to NIWE. After training: the cheat sheet Give the customer a one-page sheet with: the address of the system, who the administrator is, who to call at NIWE and in what hours, how to reset a password, what to do when the connection drops (keep selling; do not clear the browser while the offline queue has sales), and where to find the manuals and the wiki. "}, {"id": "onboard-6-launching-the-online-shop", "manual": "onboard", "n": 6, "title": "Launching the online shop", "html": "\n<p>The Online Store is a public shop that takes real orders and real\nmoney from strangers. Launch it only after the till and the books are\nworking, and follow the order below. Each item has the person who does\nit and how you know it is done. It is also the go-live checklist for one\nbusiness.<\/p>\n<h2 id=\"the-business-decisions\">The business decisions<\/h2>\n<ul class=\"task-list\">\n<li><label><input type=\"checkbox\" /><strong>Delivery or pick-up or\nboth<\/strong>, the <strong>delivery areas<\/strong> with their fees and\ntax, the minimum order and the free-delivery amount, the estimate in\ndays for each area, and the delivery <strong>time windows<\/strong> if\nthe business wants them.<\/label><\/li>\n<li><label><input type=\"checkbox\" /><strong>Who delivers<\/strong>: a\nlist of drivers with phones. Each gets a private link and a 4-digit PIN,\nsent in two messages.<\/label><\/li>\n<li><label><input type=\"checkbox\" /><strong>Payment providers<\/strong>:\nMTN Mobile Money, Airtel Money, card. The <strong>business\nregisters<\/strong> with each provider in its own name (the provider asks\nfor company documents); the keys belong to the business. This takes days\nor weeks: start it in stage 1.<\/label><\/li>\n<li><label><input type=\"checkbox\" /><strong>Accounts<\/strong>: for each\nprovider, whether the business has a separate wallet or bank account.\nAgree with the accountant the provider's <strong>clearing\naccount<\/strong> and <strong>payout account<\/strong>.<\/label><\/li>\n<li><label><input type=\"checkbox\" /><strong>Terms and\nConditions<\/strong>, <strong>Privacy Policy<\/strong>, <strong>Returns\nand Refunds<\/strong>, <strong>Delivery and Shipping<\/strong>: read the\nstarter texts in Online Store &gt; Shop pages, adapt them to the\nbusiness and the country, and have someone responsible check\nthem.<\/label><\/li>\n<li><label><input type=\"checkbox\" /><strong>Returns window<\/strong>\n(days), loyalty points rules, coupons, whether newsletters and\nabandoned-cart reminders are wanted (they need e-mail).<\/label><\/li>\n<\/ul>\n<h2 id=\"technical-set-up-the-implementer\">Technical set-up (the\nimplementer)<\/h2>\n<ul class=\"task-list\">\n<li><label><input type=\"checkbox\" />The site is on\n<strong>https<\/strong> with the customer's domain and\n<code>app.frontend-url<\/code> is that address.<\/label><\/li>\n<li><label><input type=\"checkbox\" />The <strong>nginx rule<\/strong> for\nlink previews, the sitemap and robots.txt is in place (Installation\nguide, chapter 5) and the test with\n<code>curl -A \"facebookexternalhit/1.1\"<\/code> returns a small\npage.<\/label><\/li>\n<li><label><input type=\"checkbox\" /><strong>E-mail<\/strong> is working\n(Send test email) and the shop's address for new-order e-mails is\nset.<\/label><\/li>\n<li><label><input type=\"checkbox\" />A <strong>text message\nprovider<\/strong> is chosen, or the business knows that codes by text\nstay in the text list until one is connected (codes also go by e-mail\nand show on the order page).<\/label><\/li>\n<li><label><input type=\"checkbox\" /><strong>Payment provider\nkeys<\/strong> are in the server's environment or private settings file,\nnever in a repository; the provider shows as <em>available<\/em> in Shop\nsettings &gt; Online payments; the webhook address from the screen is\ngiven to the provider.<\/label><\/li>\n<li><label><input type=\"checkbox\" />The business's own\n<strong>logos<\/strong> of the providers are in\n<code>frontend/src/assets/payment/<\/code> before the frontend was built\n(otherwise the buttons show names).<\/label><\/li>\n<\/ul>\n<h2 id=\"shop-set-up-the-shop-manager-with-the-implementer\">Shop set-up\n(the shop manager, with the implementer)<\/h2>\n<ul class=\"task-list\">\n<li><label><input type=\"checkbox\" /><strong>Products on the\nshop<\/strong>: add the products, titles, online prices (or the price\nlist), pictures, descriptions, specifications, and the four row ticks;\nfor products with sizes or colours, put the template on the\nshop.<\/label><\/li>\n<li><label><input type=\"checkbox\" /><strong>Stock the shop sells\nfrom<\/strong>, the buffer, the share kept for the till and the hours\nafter which unanswered orders are released. Check the line under a few\nproducts and agree it with a real count.<\/label><\/li>\n<li><label><input type=\"checkbox\" /><strong>Delivery service\nproduct<\/strong> (a service product, tax inclusive or none), delivery\nareas, delivery times, drivers and their links.<\/label><\/li>\n<li><label><input type=\"checkbox\" /><strong>Front page<\/strong>:\nannouncement, banner pictures, colour, about, opening hours, contact and\nWhatsApp numbers, footer and social links.<\/label><\/li>\n<li><label><input type=\"checkbox\" /><strong>Branch the shop sells\nfor<\/strong> (only with more than one branch).<\/label><\/li>\n<li><label><input type=\"checkbox\" /><strong>Online Store &gt; Online\npayments &gt; Accounts by provider<\/strong>: every provider has its\nclearing account and payout account chosen.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Tax rates on products and on the\ndelivery fee; the accounting <strong>lock date<\/strong> set to the day\nbefore the opening date.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Users and roles: the shop staff have\nthe <strong>Operations<\/strong> area; only the owner and the accountant\nmanage Accounting and lock periods; drivers use their private page\nonly.<\/label><\/li>\n<\/ul>\n<h2 id=\"test-with-real-money-small-amounts-one-at-a-time\">Test with real\nmoney (small amounts, one at a time)<\/h2>\n<p>Do each with a small real order, then read the journal entries\n(Accounting &gt; Journal; search for the order code).<\/p>\n<ul class=\"task-list\">\n<li><label><input type=\"checkbox\" /><strong>MTN payment<\/strong>,\ndelivered: the payment debits MTN's clearing account and credits Online\nCustomer Deposits; delivery releases the deposit.<\/label><\/li>\n<li><label><input type=\"checkbox\" /><strong>Airtel payment<\/strong>,\ndelivered: the same, on the Airtel accounts.<\/label><\/li>\n<li><label><input type=\"checkbox\" /><strong>Card payment<\/strong>,\ndelivered (when card is used).<\/label><\/li>\n<li><label><input type=\"checkbox\" />A <strong>paid order\ncancelled<\/strong> and refunded through the provider (Airtel: by hand\nwith the reference): the provider's clearing account returns to\nzero.<\/label><\/li>\n<li><label><input type=\"checkbox\" />A <strong>delivered order, part\nreturned<\/strong> and refunded: the VAT and the cost are reversed and\nthe goods are back in stock.<\/label><\/li>\n<li><label><input type=\"checkbox\" />A <strong>cash-on-delivery<\/strong>\norder: the driver's cash shows under <em>Cash with Drivers<\/em> until\nthe hand-in; the hand-in clears it.<\/label><\/li>\n<li><label><input type=\"checkbox\" />An order with a\n<strong>coupon<\/strong> and one with <strong>loyalty points<\/strong>:\n<em>Sales Discounts Given<\/em> and <em>Loyalty Points Liability<\/em>\nshow the amounts.<\/label><\/li>\n<li><label><input type=\"checkbox\" />A <strong>failed delivery<\/strong>\nand a <strong>new delivery time<\/strong> chosen by the customer; a\n<strong>partial delivery<\/strong>.<\/label><\/li>\n<li><label><input type=\"checkbox\" /><strong>One payout<\/strong> from\neach provider recorded under Online Store &gt; Online payments &gt;\nPayouts with its fee; compare the amounts with the provider's own\nstatement.<\/label><\/li>\n<li><label><input type=\"checkbox\" />A <strong>message<\/strong> sent from\nthe contact form is answered; a <strong>back-in-stock<\/strong> request\nis notified.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Open the shop on a phone: the first\npage, a product page, the cart, the checkout, the order page. Install it\nas an app on one phone.<\/label><\/li>\n<\/ul>\n<h2 id=\"opening-the-shop\">Opening the shop<\/h2>\n<ul class=\"task-list\">\n<li><label><input type=\"checkbox\" />Tick <strong>Shop is open to the\npublic<\/strong> and save. Announce it to a few friendly customers\nfirst.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Watch <strong>Online orders<\/strong>\n(New), <strong>Online payments<\/strong> (Under review, Refunds due,\nStuck pending) and <strong>Messages<\/strong> closely for the first week,\nseveral times a day.<\/label><\/li>\n<li><label><input type=\"checkbox\" />After a week, review: how fast are\norders answered, are deliveries completed with the code, do the clearing\nbalances look right, are returns and refunds handled.<\/label><\/li>\n<\/ul>\n<h2 id=\"routines-after-the-launch\">Routines after the launch<\/h2>\n<p><strong>Daily<\/strong> (owner or cashier): count the till and record\nthe difference; compare <strong>Cash with Drivers<\/strong> with the\n<em>To hand in<\/em> total of Driver cash; look at Online payments for\npayments <em>Under review<\/em> and <em>Refunds due<\/em>.<\/p>\n<p><strong>Weekly<\/strong> (one named person): record every provider\npayout received, with its fee. Each provider's balance should be about\nwhat it has collected since its last payout; a balance that keeps\ngrowing or goes negative means a payout or a payment is missing. Look\nfor orders stuck in one status, failed deliveries and returns\nwaiting.<\/p>\n<p><strong>Monthly<\/strong> (accountant): the bank, MTN, Airtel and card\nstatements agree with their accounts; the trial balance balances; VAT\npayable agrees with the tax return; receivables, payables and inventory\n(against a count of a few products) are right; Customer Credit Payable,\nGift Card Liability and Loyalty Points Liability agree with their lists;\nreview Cash Over / Short, Payment Provider Fees and\n<strong>Suspense<\/strong> (it must be zero). Then lock the month and\ntake a backup named after it.<\/p>\n<p><strong>Quarterly<\/strong>: a restore test; review user accounts and\nremove people who left; update the software.<\/p>\n<h2 id=\"limits-to-tell-the-owner\">Limits to tell the owner<\/h2>\n<ul>\n<li>A payment under review is not in the books until staff deal with\nit.<\/li>\n<li>Orders paid before version 1.71.0 have no deposit; orders delivered\nbefore 1.72.0 settle driver cash with the difference only; returns\nbefore 1.70.0 keep their old figure; loyalty points earned before 1.73.0\nare not in the liability. These matter only to a business upgrading an\nexisting shop.<\/li>\n<li>Real provider payments have not been tested by NIWE with the\ncustomer's own keys: step 4 is that test.<\/li>\n<\/ul>\n<h2 id=\"who-does-what\">Who does what<\/h2>\n<p>Fill in the names: the owner, the accountant, the person who records\npayouts, the person who restores backups, and the NIWE contact to call\nwhen something fails.<\/p>\n", "text": " The Online Store is a public shop that takes real orders and real money from strangers. Launch it only after the till and the books are working, and follow the order below. Each item has the person who does it and how you know it is done. It is also the go-live checklist for one business. The business decisions Delivery or pick-up or both , the delivery areas with their fees and tax, the minimum order and the free-delivery amount, the estimate in days for each area, and the delivery time windows if the business wants them. Who delivers : a list of drivers with phones. Each gets a private link and a 4-digit PIN, sent in two messages. Payment providers : MTN Mobile Money, Airtel Money, card. The business registers with each provider in its own name (the provider asks for company documents); the keys belong to the business. This takes days or weeks: start it in stage 1. Accounts : for each provider, whether the business has a separate wallet or bank account. Agree with the accountant the provider's clearing account and payout account . Terms and Conditions , Privacy Policy , Returns and Refunds , Delivery and Shipping : read the starter texts in Online Store > Shop pages, adapt them to the business and the country, and have someone responsible check them. Returns window (days), loyalty points rules, coupons, whether newsletters and abandoned-cart reminders are wanted (they need e-mail). Technical set-up (the implementer) The site is on https with the customer's domain and app.frontend-url is that address. The nginx rule for link previews, the sitemap and robots.txt is in place (Installation guide, chapter 5) and the test with curl -A \"facebookexternalhit/1.1\" returns a small page. E-mail is working (Send test email) and the shop's address for new-order e-mails is set. A text message provider is chosen, or the business knows that codes by text stay in the text list until one is connected (codes also go by e-mail and show on the order page). Payment provider keys are in the server's environment or private settings file, never in a repository; the provider shows as available in Shop settings > Online payments; the webhook address from the screen is given to the provider. The business's own logos of the providers are in frontend/src/assets/payment/ before the frontend was built (otherwise the buttons show names). Shop set-up (the shop manager, with the implementer) Products on the shop : add the products, titles, online prices (or the price list), pictures, descriptions, specifications, and the four row ticks; for products with sizes or colours, put the template on the shop. Stock the shop sells from , the buffer, the share kept for the till and the hours after which unanswered orders are released. Check the line under a few products and agree it with a real count. Delivery service product (a service product, tax inclusive or none), delivery areas, delivery times, drivers and their links. Front page : announcement, banner pictures, colour, about, opening hours, contact and WhatsApp numbers, footer and social links. Branch the shop sells for (only with more than one branch). Online Store > Online payments > Accounts by provider : every provider has its clearing account and payout account chosen. Tax rates on products and on the delivery fee; the accounting lock date set to the day before the opening date. Users and roles: the shop staff have the Operations area; only the owner and the accountant manage Accounting and lock periods; drivers use their private page only. Test with real money (small amounts, one at a time) Do each with a small real order, then read the journal entries (Accounting > Journal; search for the order code). MTN payment , delivered: the payment debits MTN's clearing account and credits Online Customer Deposits; delivery releases the deposit. Airtel payment , delivered: the same, on the Airtel accounts. Card payment , delivered (when card is used). A paid order cancelled and refunded through the provider (Airtel: by hand with the reference): the provider's clearing account returns to zero. A delivered order, part returned and refunded: the VAT and the cost are reversed and the goods are back in stock. A cash-on-delivery order: the driver's cash shows under Cash with Drivers until the hand-in; the hand-in clears it. An order with a coupon and one with loyalty points : Sales Discounts Given and Loyalty Points Liability show the amounts. A failed delivery and a new delivery time chosen by the customer; a partial delivery . One payout from each provider recorded under Online Store > Online payments > Payouts with its fee; compare the amounts with the provider's own statement. A message sent from the contact form is answered; a back-in-stock request is notified. Open the shop on a phone: the first page, a product page, the cart, the checkout, the order page. Install it as an app on one phone. Opening the shop Tick Shop is open to the public and save. Announce it to a few friendly customers first. Watch Online orders (New), Online payments (Under review, Refunds due, Stuck pending) and Messages closely for the first week, several times a day. After a week, review: how fast are orders answered, are deliveries completed with the code, do the clearing balances look right, are returns and refunds handled. Routines after the launch Daily (owner or cashier): count the till and record the difference; compare Cash with Drivers with the To hand in total of Driver cash; look at Online payments for payments Under review and Refunds due . Weekly (one named person): record every provider payout received, with its fee. Each provider's balance should be about what it has collected since its last payout; a balance that keeps growing or goes negative means a payout or a payment is missing. Look for orders stuck in one status, failed deliveries and returns waiting. Monthly (accountant): the bank, MTN, Airtel and card statements agree with their accounts; the trial balance balances; VAT payable agrees with the tax return; receivables, payables and inventory (against a count of a few products) are right; Customer Credit Payable, Gift Card Liability and Loyalty Points Liability agree with their lists; review Cash Over / Short, Payment Provider Fees and Suspense (it must be zero). Then lock the month and take a backup named after it. Quarterly : a restore test; review user accounts and remove people who left; update the software. Limits to tell the owner A payment under review is not in the books until staff deal with it. Orders paid before version 1.71.0 have no deposit; orders delivered before 1.72.0 settle driver cash with the difference only; returns before 1.70.0 keep their old figure; loyalty points earned before 1.73.0 are not in the liability. These matter only to a business upgrading an existing shop. Real provider payments have not been tested by NIWE with the customer's own keys: step 4 is that test. Who does what Fill in the names: the owner, the accountant, the person who records payouts, the person who restores backups, and the NIWE contact to call when something fails. "}, {"id": "onboard-7-stage-5-go-live-and-the-first-month", "manual": "onboard", "n": 7, "title": "Stage 5: go-live and the\nfirst month", "html": "\n<h2 id=\"the-week-before\">The week before<\/h2>\n<ul class=\"task-list\">\n<li><label><input type=\"checkbox\" />Final <strong>backup<\/strong> of the\nempty (or loaded) system, copied off the server, and a <strong>restore\ntest<\/strong> done.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Every user has signed in once and\nchanged their password; every till PC has printed a test\nreceipt.<\/label><\/li>\n<li><label><input type=\"checkbox\" />The <strong>opening\nbalances<\/strong> are loaded, checked by the accountant and the lock\ndate is set.<\/label><\/li>\n<li><label><input type=\"checkbox\" />The cheat sheet is printed and\nhanded out; the support contacts and hours are agreed.<\/label><\/li>\n<li><label><input type=\"checkbox\" />A <strong>go / no-go\nmeeting<\/strong> with the owner and the accountant: if a box above is\nnot ticked, say why and decide.<\/label><\/li>\n<\/ul>\n<h2 id=\"day-0\">Day 0<\/h2>\n<ul>\n<li>Be there (or on the phone) from the opening of the business. Start\nthe day with the <strong>opening of the till sessions<\/strong> with the\nfloat.<\/li>\n<li>Keep a list of every question and every small problem; fix settings\nin the evening, not in the middle of a sale.<\/li>\n<li>At the end of the day: count the tills, close the sessions, print\nthe <strong>Z reports<\/strong>, check the daily sales against the cash\nand the trial balance, and <strong>back up<\/strong>.<\/li>\n<\/ul>\n<h2 id=\"the-first-two-weeks\">The first two weeks<\/h2>\n<ul>\n<li><strong>Daily check-in<\/strong> of 15 minutes with the\nadministrator: what went wrong, what was slow, who needs help.<\/li>\n<li>Watch the <strong>dashboard's \"Needs your attention\"<\/strong> list\nand the audit log for voids, returns, price overrides and stock\nadjustments: they show whether the habits taught in training are being\nfollowed.<\/li>\n<li>Check <strong>stock<\/strong> against a few products on the shelf\nevery day, then every week.<\/li>\n<li>Fix the <strong>naming and data mistakes<\/strong> found in the first\ndays (a wrong tax, a duplicate customer) with the right tools: edit the\nrecord, or void and redo; never delete.<\/li>\n<\/ul>\n<h2 id=\"the-first-month-end\">The first month-end<\/h2>\n<p>With the accountant, once the month is finished:<\/p>\n<ol type=\"1\">\n<li>All sales sessions closed, all invoices issued, supplier bills\nentered, expenses approved.<\/li>\n<li>Bank and mobile money <strong>reconciliation<\/strong> (Accounting\n&gt; Controls).<\/li>\n<li>Trial balance reviewed; <strong>Suspense<\/strong> is zero; VAT\nreport agreed with the tax return.<\/li>\n<li>Stock valuation against a count of key products.<\/li>\n<li><strong>Close the books<\/strong> up to the month-end date (an admin\ndoes this; the reason is logged), then take a <strong>backup named with\nthe month<\/strong> and copy it off the server.<\/li>\n<li>Look at the month's reports and send the owner the figures.<\/li>\n<\/ol>\n<h2 id=\"hand-over-and-sign-off\">Hand-over and sign-off<\/h2>\n<p>At the end of the first month, meet the owner and sign a one-page\nhand-over:<\/p>\n<ul class=\"task-list\">\n<li><label><input type=\"checkbox\" />The system runs on the agreed\nversion; the licence number and expiry are recorded.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Backups run nightly, a copy leaves\nthe server, and a <strong>restore test<\/strong> was done within the last\nquarter.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Each person has their own login;\nleavers are removed.<\/label><\/li>\n<li><label><input type=\"checkbox\" />The administrator knows how to reset\na password, restore a backup, read the log and contact\nsupport.<\/label><\/li>\n<li><label><input type=\"checkbox\" />The first month-end was closed with\na trial balance that balances and Suspense at zero.<\/label><\/li>\n<li><label><input type=\"checkbox\" />The customer knows the\n<strong>upgrade routine<\/strong> and has agreed a window for the first\nupgrade (see the <em>Release and upgrade notes for\ncustomers<\/em>).<\/label><\/li>\n<li><label><input type=\"checkbox\" />Open points are listed with an owner\nand a date.<\/label><\/li>\n<\/ul>\n<p>After sign-off the customer moves to normal support (see the\n<em>Support and troubleshooting guide<\/em>).<\/p>\n", "text": " The week before Final backup of the empty (or loaded) system, copied off the server, and a restore test done. Every user has signed in once and changed their password; every till PC has printed a test receipt. The opening balances are loaded, checked by the accountant and the lock date is set. The cheat sheet is printed and handed out; the support contacts and hours are agreed. A go / no-go meeting with the owner and the accountant: if a box above is not ticked, say why and decide. Day 0 Be there (or on the phone) from the opening of the business. Start the day with the opening of the till sessions with the float. Keep a list of every question and every small problem; fix settings in the evening, not in the middle of a sale. At the end of the day: count the tills, close the sessions, print the Z reports , check the daily sales against the cash and the trial balance, and back up . The first two weeks Daily check-in of 15 minutes with the administrator: what went wrong, what was slow, who needs help. Watch the dashboard's \"Needs your attention\" list and the audit log for voids, returns, price overrides and stock adjustments: they show whether the habits taught in training are being followed. Check stock against a few products on the shelf every day, then every week. Fix the naming and data mistakes found in the first days (a wrong tax, a duplicate customer) with the right tools: edit the record, or void and redo; never delete. The first month-end With the accountant, once the month is finished: All sales sessions closed, all invoices issued, supplier bills entered, expenses approved. Bank and mobile money reconciliation (Accounting > Controls). Trial balance reviewed; Suspense is zero; VAT report agreed with the tax return. Stock valuation against a count of key products. Close the books up to the month-end date (an admin does this; the reason is logged), then take a backup named with the month and copy it off the server. Look at the month's reports and send the owner the figures. Hand-over and sign-off At the end of the first month, meet the owner and sign a one-page hand-over: The system runs on the agreed version; the licence number and expiry are recorded. Backups run nightly, a copy leaves the server, and a restore test was done within the last quarter. Each person has their own login; leavers are removed. The administrator knows how to reset a password, restore a backup, read the log and contact support. The first month-end was closed with a trial balance that balances and Suspense at zero. The customer knows the upgrade routine and has agreed a window for the first upgrade (see the Release and upgrade notes for customers ). Open points are listed with an owner and a date. After sign-off the customer moves to normal support (see the Support and troubleshooting guide ). "}, {"id": "releases-1-how-upgrades-work", "manual": "releases", "n": 1, "title": "How upgrades work", "html": "\n<h2 id=\"why-there-are-new-versions\">Why there are new versions<\/h2>\n<p>NIWE ERP is improved in small steps. Each step is a\n<strong>version<\/strong> with a number such as <strong>1.76.0<\/strong>\nand its own release notes. A new version brings new screens, fixes, and\nsometimes a change to the database. This document is the customer's view\nof them: what each version brings, and what you must do, if anything,\nwhen you move to it. It is for the business owner, the administrator and\nthe person at NIWE who looks after the installation.<\/p>\n<h2 id=\"what-an-upgrade-is-and-what-it-is-not\">What an upgrade is, and\nwhat it is not<\/h2>\n<ul>\n<li>An upgrade replaces the <strong>program<\/strong> (the backend and\nthe web pages). Your <strong>data stays<\/strong>: sales, invoices,\ncustomers, stock and accounts are in your database and are kept.<\/li>\n<li>If the new version needs a change to the <strong>database\nstructure<\/strong>, it makes it by itself the first time it starts (this\nis called a <em>migration<\/em>). Migrations are numbered and run once,\nin order, and are never changed afterwards.<\/li>\n<li>Your <strong>licence<\/strong>, your <strong>modules<\/strong> and\nyour <strong>settings<\/strong> stay as they are. Staff are signed out\nonce and sign in again.<\/li>\n<li>An upgrade is <strong>not<\/strong> automatic. NIWE (or your own\ntechnician) does it on a day you agree, usually outside business hours.\nNothing changes under your feet.<\/li>\n<li>You can go <strong>from an old version straight to the\nnewest<\/strong>; the migrations in between run in order. When the gap is\nlarge, NIWE first tries the upgrade on a copy of your data.<\/li>\n<\/ul>\n<h2 id=\"how-long-it-takes\">How long it takes<\/h2>\n<p>A normal upgrade stops the system for <strong>five to fifteen\nminutes<\/strong>: stop, replace, start, check. The first start after a\nversion with migrations can take a minute or two longer. Choose a quiet\nmoment, and tell staff when it will happen. Tills keep selling during a\nshort break and queue the sales (see the POS chapter of the User\nManual); do not clear the browser while sales are waiting.<\/p>\n<h2 id=\"your-part\">Your part<\/h2>\n<ol type=\"1\">\n<li><strong>Agree the day and the version<\/strong> with NIWE. Read the\nentry of the version in chapter 2 and any <strong>action<\/strong> for\nyou in chapter 3.<\/li>\n<li><strong>Close the day<\/strong> if you can: tills closed, nothing\nhalf-finished.<\/li>\n<li><strong>Be reachable<\/strong> during the window, so that someone can\ncheck the system afterwards.<\/li>\n<li><strong>After the upgrade<\/strong>, sign in, look at the screens you\nuse every day, make a test sale or a test order, and tell NIWE at once\nif anything looks wrong.<\/li>\n<\/ol>\n<h2 id=\"niwes-part-in-short\">NIWE's part, in short<\/h2>\n<p>Before upgrading, NIWE takes a <strong>backup<\/strong> and copies it\noff the server and keeps the previous version so that it can go back;\napplies the one-time actions of the version; checks the log for the\nmigrations and for errors; and checks a few screens with you. If\nsomething goes wrong the previous version and the backup are put back\n(see the Installation guide, chapter 7).<\/p>\n<h2 id=\"fixes-between-versions\">Fixes between versions<\/h2>\n<p>Small fixes carry a third number: <strong>1.58.1<\/strong>,\n<strong>1.64.1<\/strong>. They are usually a single change and need no\naction.<\/p>\n<h2 id=\"reading-a-version-number\">Reading a version number<\/h2>\n<p>The first number changes only for a very big step. The second number\nchanges with each release of new features (1.76). The third number is a\nfix (1.76.1). The <strong>Release notes<\/strong> of each version are the\nexact, technical list; this document is the short version for the\nbusiness.<\/p>\n", "text": " Why there are new versions NIWE ERP is improved in small steps. Each step is a version with a number such as 1.76.0 and its own release notes. A new version brings new screens, fixes, and sometimes a change to the database. This document is the customer's view of them: what each version brings, and what you must do, if anything, when you move to it. It is for the business owner, the administrator and the person at NIWE who looks after the installation. What an upgrade is, and what it is not An upgrade replaces the program (the backend and the web pages). Your data stays : sales, invoices, customers, stock and accounts are in your database and are kept. If the new version needs a change to the database structure , it makes it by itself the first time it starts (this is called a migration ). Migrations are numbered and run once, in order, and are never changed afterwards. Your licence , your modules and your settings stay as they are. Staff are signed out once and sign in again. An upgrade is not automatic. NIWE (or your own technician) does it on a day you agree, usually outside business hours. Nothing changes under your feet. You can go from an old version straight to the newest ; the migrations in between run in order. When the gap is large, NIWE first tries the upgrade on a copy of your data. How long it takes A normal upgrade stops the system for five to fifteen minutes : stop, replace, start, check. The first start after a version with migrations can take a minute or two longer. Choose a quiet moment, and tell staff when it will happen. Tills keep selling during a short break and queue the sales (see the POS chapter of the User Manual); do not clear the browser while sales are waiting. Your part Agree the day and the version with NIWE. Read the entry of the version in chapter 2 and any action for you in chapter 3. Close the day if you can: tills closed, nothing half-finished. Be reachable during the window, so that someone can check the system afterwards. After the upgrade , sign in, look at the screens you use every day, make a test sale or a test order, and tell NIWE at once if anything looks wrong. NIWE's part, in short Before upgrading, NIWE takes a backup and copies it off the server and keeps the previous version so that it can go back; applies the one-time actions of the version; checks the log for the migrations and for errors; and checks a few screens with you. If something goes wrong the previous version and the backup are put back (see the Installation guide, chapter 7). Fixes between versions Small fixes carry a third number: 1.58.1 , 1.64.1 . They are usually a single change and need no action. Reading a version number The first number changes only for a very big step. The second number changes with each release of new features (1.76). The third number is a fix (1.76.1). The Release notes of each version are the exact, technical list; this document is the short version for the business. "}, {"id": "releases-2-what-is-new-version-by-version", "manual": "releases", "n": 2, "title": "What is new, version by\nversion", "html": "\n<p>The versions are grouped by what they bring. Each line says what you\ncan now do. Versions before 1.23 are summarised in the last section.<\/p>\n<h2 id=\"choose-the-accounts-of-each-payment-provider\">1.76: choose the\naccounts of each payment provider<\/h2>\n<p>In <strong>Online Store &gt; Online payments &gt; Accounts by\nprovider<\/strong> you choose, for each payment provider (MTN, Airtel,\ncard, and later ones), the account for <strong>what the provider still\nowes you<\/strong> and the <strong>wallet or bank account its payouts\narrive in<\/strong>. Each can be an existing account or one created on\nthe spot. Payouts are recorded one provider at a time.<\/p>\n<h2 id=\"an-account-for-each-payment-provider\">1.75: an account for each\npayment provider<\/h2>\n<p>MTN Mobile Money, Airtel Money and card each have their own accounts,\nso each balance can be matched to that provider's own statement. Orders\npaid before this version keep their old accounts, so no balance\nmoves.<\/p>\n<h2\nid=\"and-1.74-the-shops-accounts-show-discounts-delivery-income-and-loyalty-points-returns-at-cost\">1.73\nand 1.74: the shop's accounts show discounts, delivery income and\nloyalty points; returns at cost<\/h2>\n<p>Sales Revenue now shows the <strong>full price<\/strong> of the goods;\ncoupon and points discounts are in <strong>Sales Discounts\nGiven<\/strong> and delivery fees in <strong>Delivery Income<\/strong>.\nLoyalty points the shop owes are a <strong>liability<\/strong>. A return\nputs the goods back into stock at the <strong>cost they were sold\nat<\/strong>. A <strong>branch<\/strong> can be chosen for the online\nshop.<\/p>\n<h2 id=\"cash-that-drivers-hold\">1.72: cash that drivers hold<\/h2>\n<p>Cash a driver takes at the door is booked to <strong>Cash with\nDrivers<\/strong> until he hands it in. The hand-in moves it to Cash and\nBank and books any difference.<\/p>\n<h2 id=\"online-payments-are-held-and-cleared-against-payouts\">1.71:\nonline payments are held and cleared against payouts<\/h2>\n<p>Money paid online is recorded when the provider confirms it, held\nuntil the order is delivered, and cleared when the provider pays out. A\nnew <strong>Payouts<\/strong> panel records each payout and its fee.<\/p>\n<h2 id=\"returns-post-the-vat-and-the-refund\">1.70: returns post the VAT\nand the refund<\/h2>\n<p>A return now reverses the VAT as well as the sale and posts the money\nhanded back to the customer.<\/p>\n<h2 id=\"to-1.69-the-stock-and-the-prices-the-shop-uses\">1.65 to 1.69:\nthe stock and the prices the shop uses<\/h2>\n<ul>\n<li>The shop sells only from <strong>Sales locations<\/strong> (outside\nthe Main warehouse), one chosen or all.<\/li>\n<li>A shop order <strong>holds its stock from the moment it is\nplaced<\/strong>, so two customers cannot be sold the last unit;\nunanswered orders are cancelled after a number of hours you set.<\/li>\n<li>A <strong>buffer for each product<\/strong> and a <strong>share kept\nfor the till<\/strong>.<\/li>\n<li><strong>Expired goods<\/strong> are never sold; batches near their\nexpiry can be left out; <strong>serial numbers<\/strong> are shown and\nreturned correctly.<\/li>\n<li><strong>Cartons<\/strong> count as stock; <strong>Reorder<\/strong>\ntakes shop orders and waiting customers into account.<\/li>\n<li><strong>Prices and promotions from Sales<\/strong> are used online;\nproducts can be <strong>sold by weight or length<\/strong>.<\/li>\n<li>Fixes: completing an order with several warehouses no longer fails,\nand refusals show their real reason.<\/li>\n<\/ul>\n<h2 id=\"to-1.64-delivery\">1.52 to 1.64: delivery<\/h2>\n<ul>\n<li><strong>Drivers<\/strong>, <strong>delivery slips<\/strong> and\n<strong>run sheets<\/strong>; the customer sees his driver's name and\nphone.<\/li>\n<li>A <strong>4-digit delivery code<\/strong>: the customer gives it to\nthe driver to complete the order. Staff never see it. It is sent by\ne-mail and text (text is a placeholder until a text company is\nconnected).<\/li>\n<li>A <strong>private page for each driver<\/strong> (link and PIN, no\nstaff login) with his orders, his cash and his returns to collect.<\/li>\n<li><strong>Driver cash<\/strong>: follow the cash drivers take until it\nis handed in, with differences recorded.<\/li>\n<li><strong>Failed deliveries<\/strong> and <strong>partial\ndeliveries<\/strong>, with the customer choosing a <strong>new delivery\ntime<\/strong>.<\/li>\n<li><strong>Delivery time windows<\/strong> (limits per window, closed\ndays, notice).<\/li>\n<li><strong>Return pick-ups<\/strong>: a driver collects returned goods\nwith a return code.<\/li>\n<li><strong>Delivery estimate and tax for each area<\/strong>; the fee is\nthe amount the customer pays and the tax is included.<\/li>\n<li>Every accounting entry from an online order ends with the order\nnumber.<\/li>\n<\/ul>\n<h2 id=\"to-1.51-and-1.53-to-1.55-a-richer-shop\">1.41 to 1.51 and 1.53 to\n1.55: a richer shop<\/h2>\n<ul>\n<li><strong>Airtel Money<\/strong> as a second payment provider, and\nseveral providers at once with a choice at checkout (1.41, 1.42).<\/li>\n<li><strong>Advertising<\/strong>: sell space in the shop to other\nbusinesses, with a report of views and clicks (1.43).<\/li>\n<li>A <strong>product page<\/strong> for each product; search, filters\nand sorting; product cards, quick view, recently viewed;\n<strong>ratings<\/strong> (stars count at once) and\n<strong>reviews<\/strong> (words, approved by staff) (1.44 to 1.46).<\/li>\n<li><strong>Invoice download<\/strong>, an <strong>address book<\/strong>,\na <strong>wish list<\/strong> and <strong>WhatsApp<\/strong> links (1.47);\nproduct rows that slide (1.48).<\/li>\n<li><strong>Product variants<\/strong> (size, colour, model) as one\nproduct with options (1.50); a <strong>contact form<\/strong> with\nreplies inside the program, and four <strong>information pages<\/strong>\n(1.51).<\/li>\n<li><strong>Link previews<\/strong> in WhatsApp, Facebook and others, a\n<strong>sitemap<\/strong> and Google product data (1.53);\n<strong>back-in-stock alerts<\/strong> (1.54); the customer\n<strong>portal<\/strong> (1.55); and the <strong>installable app<\/strong>\nfor the whole site (1.49).<\/li>\n<\/ul>\n<h2 id=\"to-1.40-the-online-store-is-born\">1.27 to 1.40: the Online Store\nis born<\/h2>\n<p>A public shop with delivery and pick-up and cash orders (1.27);\ne-mails at every step (1.28); <strong>online payment<\/strong> with a\ntest provider and then <strong>MTN Mobile Money<\/strong> (1.29, 1.34);\ncustomer <strong>accounts<\/strong> by e-mailed code (1.30);\n<strong>coupons<\/strong> (1.31); <strong>text messages<\/strong> (1.32);\n<strong>returns and refunds<\/strong> (1.33); the shop as the first page;\na full first page with banner pictures, rows, reviews, newsletter and\nfooter (1.34 to 1.36); six <strong>sales reports<\/strong> (1.37);\n<strong>newsletters<\/strong> sent from the program (1.38);\n<strong>abandoned-cart reminders<\/strong> (1.39); <strong>loyalty\npoints<\/strong> (1.40).<\/p>\n<h2 id=\"to-1.26-french\">1.23 to 1.26: French<\/h2>\n<p>French throughout: screens, messages, lists, report headings, printed\ndocuments, e-mails and the messages the server writes. Each user can\nswitch language, and the business has a default language (Chad starts in\nFr
