so that\nit can be used only from that PC.<\/p>\n<ol type=\"1\">\n<li>Sit at the till PC and sign in as an Admin.<\/li>\n<li>Go to <strong>POS &gt; Registers &amp; Terminal<\/strong> and press\n<strong>Bind to this device<\/strong> on the register.<\/li>\n<li>Give the PC a name, and choose whether its network address must also\nmatch (the <em>IP check<\/em> option).<\/li>\n<li>From then on, any other device is refused by the server for that\nregister: the terminal, sales, opening a shift, offline sync and cash\nmovements, each with a clear message.<\/li>\n<\/ol>\n<p>Press <strong>Unbind<\/strong> (an Admin, from any device) to free it.\nReports, receipts, history and closing a shift stay available from the\nback office. A device can be the till of one register only. Registers\nthat are not bound behave as before. Binding and unbinding are written\nto the audit log (<em>REGISTER_DEVICE_BOUND<\/em> and\n<em>REGISTER_DEVICE_UNBOUND<\/em>).<\/p>\n<p>If the server sits behind a reverse proxy and you use the IP check,\nset <code>app.device-binding.trusted-proxies<\/code> to the proxy's\naddress so that the real address of the till is seen.<\/p>\n<h2 id=\"thermal-printing-and-the-cash-drawer-version-1.12\">Thermal\nprinting and the cash drawer (version 1.12)<\/h2>\n<p>Thermal printing is configured <strong>per PC, in the\nbrowser<\/strong>, at <strong>POS &gt; Devices<\/strong>, because each\ntill has its own hardware. Nothing is stored on the server. The complete\nguide is in the file <code>THERMAL-PRINTING.md<\/code> supplied with the\nsystem; this is a summary.<\/p>\n<h3 id=\"connection-types\">Connection types<\/h3>\n<div class=\"tablewrap\"><table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Connection<\/th>\n<th>Use it when<\/th>\n<th>Needs<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>Windows driver<\/strong><\/td>\n<td>You want the normal print dialog, laid out for the roll (exactly 80\nmm or 58 mm, no margins).<\/td>\n<td>Any browser, the printer's Windows driver.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Serial / COM<\/strong><\/td>\n<td>You want raw ESC/POS: native text, logo, QR code, cut, cash\ndrawer.<\/td>\n<td>Chrome or Edge on <strong>https<\/strong> or\n<strong>localhost<\/strong>; a printer with a serial port or a virtual\nCOM port.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>USB<\/strong><\/td>\n<td>Same raw printing over WebUSB.<\/td>\n<td>Chrome or Edge; the printer on the WinUSB driver (for example with\nZadig).<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Chrome or Edge ask once to allow each device (<strong>Connect\ndevice...<\/strong>); the permission is remembered for the site. If a\ndirect printer does not answer, the document is printed through the\nWindows driver and a red line explains why.<\/p>\n<h3 id=\"setting-up-a-till-step-by-step\">Setting up a till, step by\nstep<\/h3>\n<ol type=\"1\">\n<li>Open <strong>POS &gt; Devices<\/strong>.<\/li>\n<li><strong>Receipt printer<\/strong>: choose the connection, press\n<strong>Connect device...<\/strong>, pick the printer. For COM, choose\nthe printer's baud rate (the printer's self-test page shows it).<\/li>\n<li><strong>Paper and options<\/strong>: paper width (80 or 58 mm),\ncharacters per line, code page (use <em>Plain ASCII<\/em> if strange\ncharacters print), cut after each document, open the drawer on cash\nsales.<\/li>\n<li>Press <strong>Print test page<\/strong> and <strong>Open cash\ndrawer<\/strong>.<\/li>\n<li>Press <strong>Save<\/strong>.<\/li>\n<\/ol>\n<h3 id=\"restaurant-printers\">Restaurant printers<\/h3>\n<p>The <strong>Kitchen printer<\/strong> and <strong>Bar printer<\/strong>\nare optional. In <em>Stations on this printer<\/em>, type the station\nnames exactly as on the menu items (for example <code>Grill, Cold<\/code>\nfor the kitchen and <code>Bar<\/code> for the bar). Tick <em>Print\nkitchen / bar tickets when items are sent to the kitchen<\/em>. On the\norder screen, <strong>Bill<\/strong> prints the guest's bill (never opens\nthe drawer) and <strong>Tickets<\/strong> reprints tickets still in the\nkitchen, marked REPRINT.<\/p>\n<h3 id=\"what-prints-where\">What prints where<\/h3>\n<div class=\"tablewrap\"><table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Document<\/th>\n<th>Printer<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Sale receipt and its COPY reprints, return receipt, restaurant bill\nand paid receipt, X and Z reports<\/td>\n<td>Receipt<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Kitchen and bar tickets<\/td>\n<td>Kitchen / Bar<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Cash drawer pulse (cash sale, restaurant cash bill, <em>Open\ndrawer<\/em> on the till)<\/td>\n<td>Receipt printer<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>A4 reports and documents print through the browser.<\/p>\n<h3 id=\"customer-display-on-a-com-port\">Customer display on a COM\nport<\/h3>\n<p>Under <em>Customer display (COM)<\/em> tick <em>Use a customer display\non this PC<\/em>, press <em>Connect COM port...<\/em>, choose the command\nset (<strong>ESC/POS<\/strong>, <strong>CD5220<\/strong> or <strong>Plain\ntext<\/strong>), baud rate, data bits, parity and stop bits as set on the\ndisplay (usual: 9600, 8, none, 1), characters per line (20 for a 2 x 20\ndisplay), and welcome lines. Press <em>Send test message<\/em>. On the\ntill the display shows the item just added, then the running total, then\nPAID with THANK YOU or CHANGE, and the welcome text again.<\/p>\n<p>There is also a second-screen <strong>Customer display<\/strong> on\nthe till (a browser window) that shows the current cart and total to the\ncustomer.<\/p>\n<h2 id=\"settings-made-on-each-pc\">Settings made on each PC<\/h2>\n<p>Because device settings live in the browser, they must be repeated on\neach till PC and are lost if the browser's site data is cleared. Keep a\nnote of each PC's printer settings.<\/p>\n", "text": " Registers A register is a till. Create and edit registers under POS > Registers & Terminal (Admin only). Each register has a name, can be pinned to one specific Sales location of a warehouse (and, when multi-warehouse is on, must be assigned a warehouse other than Main), and can be tied to one device (below). Cashiers do not need to be given register access one by one: a shift is opened on a register, and the terminal always asks for a PIN before it opens. The PIN identifies the cashier and starts or resumes their own working session on that shift. Binding a register to one device (version 1.13) You can tie a register to one known device so that it can be used only from that PC. Sit at the till PC and sign in as an Admin. Go to POS > Registers & Terminal and press Bind to this device on the register. Give the PC a name, and choose whether its network address must also match (the IP check option). From then on, any other device is refused by the server for that register: the terminal, sales, opening a shift, offline sync and cash movements, each with a clear message. Press Unbind (an Admin, from any device) to free it. Reports, receipts, history and closing a shift stay available from the back office. A device can be the till of one register only. Registers that are not bound behave as before. Binding and unbinding are written to the audit log ( REGISTER_DEVICE_BOUND and REGISTER_DEVICE_UNBOUND ). If the server sits behind a reverse proxy and you use the IP check, set app.device-binding.trusted-proxies to the proxy's address so that the real address of the till is seen. Thermal printing and the cash drawer (version 1.12) Thermal printing is configured per PC, in the browser , at POS > Devices , because each till has its own hardware. Nothing is stored on the server. The complete guide is in the file THERMAL-PRINTING.md supplied with the system; this is a summary. Connection types Connection Use it when Needs Windows driver You want the normal print dialog, laid out for the roll (exactly 80 mm or 58 mm, no margins). Any browser, the printer's Windows driver. Serial / COM You want raw ESC/POS: native text, logo, QR code, cut, cash drawer. Chrome or Edge on https or localhost ; a printer with a serial port or a virtual COM port. USB Same raw printing over WebUSB. Chrome or Edge; the printer on the WinUSB driver (for example with Zadig). Chrome or Edge ask once to allow each device ( Connect device... ); the permission is remembered for the site. If a direct printer does not answer, the document is printed through the Windows driver and a red line explains why. Setting up a till, step by step Open POS > Devices . Receipt printer : choose the connection, press Connect device... , pick the printer. For COM, choose the printer's baud rate (the printer's self-test page shows it). Paper and options : paper width (80 or 58 mm), characters per line, code page (use Plain ASCII if strange characters print), cut after each document, open the drawer on cash sales. Press Print test page and Open cash drawer . Press Save . Restaurant printers The Kitchen printer and Bar printer are optional. In Stations on this printer , type the station names exactly as on the menu items (for example Grill, Cold for the kitchen and Bar for the bar). Tick Print kitchen / bar tickets when items are sent to the kitchen . On the order screen, Bill prints the guest's bill (never opens the drawer) and Tickets reprints tickets still in the kitchen, marked REPRINT. What prints where Document Printer Sale receipt and its COPY reprints, return receipt, restaurant bill and paid receipt, X and Z reports Receipt Kitchen and bar tickets Kitchen / Bar Cash drawer pulse (cash sale, restaurant cash bill, Open drawer on the till) Receipt printer A4 reports and documents print through the browser. Customer display on a COM port Under Customer display (COM) tick Use a customer display on this PC , press Connect COM port... , choose the command set ( ESC/POS , CD5220 or Plain text ), baud rate, data bits, parity and stop bits as set on the display (usual: 9600, 8, none, 1), characters per line (20 for a 2 x 20 display), and welcome lines. Press Send test message . On the till the display shows the item just added, then the running total, then PAID with THANK YOU or CHANGE, and the welcome text again. There is also a second-screen Customer display on the till (a browser window) that shows the current cart and total to the customer. Settings made on each PC Because device settings live in the browser, they must be repeated on each till PC and are lost if the browser's site data is cleared. Keep a note of each PC's printer settings. "}, {"id": "admin-9-e-mail-alerts-and-scheduled-reports", "manual": "admin", "n": 9, "title": "E-mail, alerts and\nscheduled reports", "html": "\n<h2 id=\"e-mail-settings\">E-mail settings<\/h2>\n<p>Many features send e-mail: invoices, statements, reminders, daily\ndigests, scheduled reports, forgotten-password links, public-page\nconfirmations. They all depend on <strong>Settings &gt; Email\nsettings<\/strong>. Fill in:<\/p>\n<ul>\n<li><strong>SMTP host<\/strong> and <strong>port<\/strong>: 587 (STARTTLS)\nor 465 (SSL).<\/li>\n<li><strong>Username<\/strong> and <strong>Password<\/strong> of the mail\naccount.<\/li>\n<li><strong>From email<\/strong> and <strong>From name<\/strong>: what\nrecipients see as the sender.<\/li>\n<li><strong>Skip certificate check<\/strong>: only for a mail server with\na self-signed certificate; avoid it when you can.<\/li>\n<li><strong>Business alerts email<\/strong> (the \"notifications email\"):\nthe address that receives system alerts, daily digests, low-stock\ne-mails and so on.<\/li>\n<\/ul>\n<p>Press <strong>Send test email<\/strong> and check that it arrives.\nMany features show a message such as \"Needs e-mail set up in Settings\"\nuntil this works.<\/p>\n<div class=\"callout tip\">\n<p><strong>Tip:<\/strong> For Gmail or Microsoft 365 accounts you\nnormally need an <em>app password<\/em> rather than the person's normal\npassword. Use a dedicated mailbox for the system, not a personal\none.<\/p>\n<\/div>\n<p>A failed e-mail never blocks the underlying work: an invoice is still\nissued, a job still completed. Look at the server log (chapter 11) if\nmail does not arrive.<\/p>\n<h2 id=\"scheduled-reports\">Scheduled reports<\/h2>\n<p><strong>Settings &gt; Scheduled reports<\/strong> e-mails a report as\nan <strong>Excel or PDF<\/strong> attachment on a schedule.<\/p>\n<ol type=\"1\">\n<li>Press to add a schedule and give it a <strong>Name<\/strong> (for\nexample <em>Monday stock valuation<\/em>).<\/li>\n<li>Choose the <strong>Report<\/strong> and the <strong>Format<\/strong>\n(Excel .xlsx or PDF).<\/li>\n<li>Choose <strong>Repeat<\/strong>: Daily, Weekly (pick the weekday) or\nMonthly (pick the day of month), and the <strong>time<\/strong>.<\/li>\n<li>Add optional filters (Category, Warehouse, Branch, Days) where the\nreport supports them.<\/li>\n<li><strong>Send to<\/strong>: comma-separated addresses, or blank to use\nthe notifications e-mail.<\/li>\n<li>Tick <strong>Active<\/strong> and save.<\/li>\n<\/ol>\n<p>How periods are chosen: reports that cover a date range send the\nperiod that <strong>just ended<\/strong>: yesterday for daily, the\nprevious 7 days for weekly, the previous calendar month for monthly.\nSnapshot reports (stock valuation, ageing and similar) are taken at the\nmoment of sending.<\/p>\n<p>The list shows each schedule's last run. <strong>Send now<\/strong>\nsends it immediately; a paused schedule is marked <em>(paused)<\/em>.\nMore than fifteen reports are available, including the asset reports\nadded in version 1.22.<\/p>\n<div class=\"callout note\">\n<p><strong>Note:<\/strong> Scheduled reports are not stopped when the\nreport's module is locked by an expired licence.<\/p>\n<\/div>\n<h2 id=\"other-automatic-e-mails-and-daily-jobs\">Other automatic e-mails\nand daily jobs<\/h2>\n<div class=\"tablewrap\"><table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Job<\/th>\n<th>Where it is switched on<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Low-stock digest, automatic draft purchase requisitions<\/td>\n<td>Inventory settings<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Customer collection reminders (ageing)<\/td>\n<td>Customers &gt; Collections<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Subscription billing, reminders and digest<\/td>\n<td>Subscriptions job settings<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Rent invoicing, tenant reminders, owner statements<\/td>\n<td>Property management settings<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Lead follow-ups, viewing reminders<\/td>\n<td>Real Estate settings<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Limitation-date warnings, fee reminders, daily deadlines<\/td>\n<td>Law firm settings<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Installment reminders<\/td>\n<td>Installments settings<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Booking and appointment reminders<\/td>\n<td>Booking settings<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Help Desk deadline warnings and automatic closing<\/td>\n<td>Help Desk settings<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Weekly timesheet reminder<\/td>\n<td>Time tracking settings<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>The jobs run once a day at the time shown in each module's settings,\nin the time zone of <strong>System settings<\/strong>. If the server was\noff at that time, a job runs when the server is next up the same\nday.<\/p>\n", "text": " E-mail settings Many features send e-mail: invoices, statements, reminders, daily digests, scheduled reports, forgotten-password links, public-page confirmations. They all depend on Settings > Email settings . Fill in: SMTP host and port : 587 (STARTTLS) or 465 (SSL). Username and Password of the mail account. From email and From name : what recipients see as the sender. Skip certificate check : only for a mail server with a self-signed certificate; avoid it when you can. Business alerts email (the \"notifications email\"): the address that receives system alerts, daily digests, low-stock e-mails and so on. Press Send test email and check that it arrives. Many features show a message such as \"Needs e-mail set up in Settings\" until this works. Tip: For Gmail or Microsoft 365 accounts you normally need an app password rather than the person's normal password. Use a dedicated mailbox for the system, not a personal one. A failed e-mail never blocks the underlying work: an invoice is still issued, a job still completed. Look at the server log (chapter 11) if mail does not arrive. Scheduled reports Settings > Scheduled reports e-mails a report as an Excel or PDF attachment on a schedule. Press to add a schedule and give it a Name (for example Monday stock valuation ). Choose the Report and the Format (Excel .xlsx or PDF). Choose Repeat : Daily, Weekly (pick the weekday) or Monthly (pick the day of month), and the time . Add optional filters (Category, Warehouse, Branch, Days) where the report supports them. Send to : comma-separated addresses, or blank to use the notifications e-mail. Tick Active and save. How periods are chosen: reports that cover a date range send the period that just ended : yesterday for daily, the previous 7 days for weekly, the previous calendar month for monthly. Snapshot reports (stock valuation, ageing and similar) are taken at the moment of sending. The list shows each schedule's last run. Send now sends it immediately; a paused schedule is marked (paused) . More than fifteen reports are available, including the asset reports added in version 1.22. Note: Scheduled reports are not stopped when the report's module is locked by an expired licence. Other automatic e-mails and daily jobs Job Where it is switched on Low-stock digest, automatic draft purchase requisitions Inventory settings Customer collection reminders (ageing) Customers > Collections Subscription billing, reminders and digest Subscriptions job settings Rent invoicing, tenant reminders, owner statements Property management settings Lead follow-ups, viewing reminders Real Estate settings Limitation-date warnings, fee reminders, daily deadlines Law firm settings Installment reminders Installments settings Booking and appointment reminders Booking settings Help Desk deadline warnings and automatic closing Help Desk settings Weekly timesheet reminder Time tracking settings The jobs run once a day at the time shown in each module's settings, in the time zone of System settings . If the server was off at that time, a job runs when the server is next up the same day. "}, {"id": "admin-10-backup-restore-import-and-export", "manual": "admin", "n": 10, "title": "Backup, restore, import and\nexport", "html": "\n<p>All of this is on <strong>Settings &gt; Backup &amp; Data<\/strong>\n(Admin only).<\/p>\n<h2 id=\"backups\">Backups<\/h2>\n<ul>\n<li>A <strong>full database backup runs automatically every\nnight<\/strong>. You can also press <strong>Backup now<\/strong> at any\ntime.<\/li>\n<li>The list shows each backup file with its <strong>size<\/strong> and\n<strong>creation time<\/strong>, with <strong>Download<\/strong>,\n<strong>Restore<\/strong> and <strong>Delete<\/strong> buttons.<\/li>\n<li><strong>Where the files are:<\/strong> when the server runs from its\njar (for example as a Windows service), backups are written to a folder\nnamed <strong>backups<\/strong> next to the jar, beside the\n<strong>logs<\/strong> folder; the folder is created if it is missing. To\nuse another folder, set <code>app.backup.directory<\/code> in\n<code>application.properties<\/code>, as an environment variable\n(<code>APP_BACKUP_DIRECTORY<\/code>) or on the command line.<\/li>\n<li>Backups include the Flyway migration history, so a restore brings\nthe data and its structure version back together.<\/li>\n<\/ul>\n<div class=\"callout warning\">\n<p><strong>Warning:<\/strong> The backup lives on the server. If the\nserver is lost, so are the backups. Regularly <strong>Download<\/strong>\na backup and copy it to another computer or cloud storage, together with\nthe server's document storage folder.<\/p>\n<\/div>\n<h3 id=\"restoring\">Restoring<\/h3>\n<ol type=\"1\">\n<li>Take a fresh backup of the current state first (<strong>Backup\nnow<\/strong>), in case you restore the wrong file.<\/li>\n<li>Press <strong>Restore<\/strong> next to the backup you want, or use\n<em>Restore from an uploaded backup file<\/em> for a file you downloaded\nearlier or brought from another machine.<\/li>\n<li>Confirm. <strong>Restoring replaces the entire current\ndatabase.<\/strong><\/li>\n<li>While it runs the whole system goes into <strong>maintenance\nmode<\/strong>: everyone else (cashiers, other admins) sees a \"please\nwait\" screen.<\/li>\n<li>When it finishes, <strong>restart the application<\/strong> for a\nclean start.<\/li>\n<\/ol>\n<div class=\"callout warning\">\n<p><strong>Warning:<\/strong> Restoring a backup made by a <em>newer<\/em>\nversion into an <em>older<\/em> version makes the migration check fail\n(\"a migration it does not know\"). Deploy the newer version instead, then\nrestore.<\/p>\n<\/div>\n<h3 id=\"good-practice\">Good practice<\/h3>\n<ul>\n<li>Test a restore on a spare computer at least once, before you need\nit.<\/li>\n<li>Keep at least one backup per week for a month and one per month for\na year, outside the server.<\/li>\n<li>Back up before every upgrade (chapter 12), every import, and before\nclosing the books.<\/li>\n<\/ul>\n<h2 id=\"bulk-import\">Bulk import<\/h2>\n<p><strong>Bulk import<\/strong> loads data from a CSV or Excel file. The\nimporters include products, customers, suppliers, categories, brands,\n<strong>customer balances<\/strong>, <strong>supplier balances<\/strong>\nand <strong>ledger balances<\/strong>, plus module imports (employees,\nlaw clients and matters, real estate, and others) inside their own\nmodules.<\/p>\n<p>The process is always the same and is designed to be safe:<\/p>\n<ol type=\"1\">\n<li>Press <strong>Download template<\/strong> for the importer you want\nand fill it in. Keep the header row.<\/li>\n<li>Choose the file and press <strong>Check file<\/strong> first. It\nprocesses the file exactly as the real import would, but <strong>saves\nnothing<\/strong>.<\/li>\n<li>Read the result: how many rows were read, how many <strong>can be\nimported<\/strong> and how many <strong>will be skipped<\/strong>, a list\nof <strong>Rows that will be skipped<\/strong> with the reason for each,\nand a preview of <strong>what will be created<\/strong>.<\/li>\n<li>Correct the file and check again until the result is what you want.\nA row that cannot be used is skipped and listed with the reason; the\nrest of the file still imports.<\/li>\n<li>Press <strong>Import<\/strong>. The result shows how many were\nimported and skipped.<\/li>\n<\/ol>\n<p>Notes:<\/p>\n<ul>\n<li><strong>Opening balances<\/strong> (customer and supplier) become\nreal <code>OB-<\/code> invoices and bills, so they age, appear in\nstatements and collections, and are paid like any other.<\/li>\n<li>For <strong>ledger balances<\/strong>, you can choose <em>Put any\ndifference in Owner's Equity<\/em> so that the opening journal\nbalances.<\/li>\n<li>Module imports read the first sheet only, up to 2,000 rows (.xlsx or\nCSV).<\/li>\n<li>Imports have not been tested on very large files; split big\nfiles.<\/li>\n<\/ul>\n<h2 id=\"export-and-year-end-archive\">Export and year-end archive<\/h2>\n<ul>\n<li><strong>Export products<\/strong> and <strong>Export\ncustomers<\/strong> download the current lists.<\/li>\n<li><strong>Year-end archive<\/strong> downloads a snapshot of one year's\nbusiness activity (sales, purchases, payments, stock adjustments) for\nclosing out a financial year.<\/li>\n<\/ul>\n<div class=\"callout note\">\n<p><strong>Note:<\/strong> The year-end archive is a curated snapshot,\n<strong>not<\/strong> a full database backup. Always keep a real backup\nas well.<\/p>\n<\/div>\n<p>Each list in the system also has its own <strong>Excel, PDF and\nCSV<\/strong> export, with the same filters as the screen.<\/p>\n", "text": " All of this is on Settings > Backup & Data (Admin only). Backups A full database backup runs automatically every night . You can also press Backup now at any time. The list shows each backup file with its size and creation time , with Download , Restore and Delete buttons. Where the files are: when the server runs from its jar (for example as a Windows service), backups are written to a folder named backups next to the jar, beside the logs folder; the folder is created if it is missing. To use another folder, set app.backup.directory in application.properties , as an environment variable ( APP_BACKUP_DIRECTORY ) or on the command line. Backups include the Flyway migration history, so a restore brings the data and its structure version back together. Warning: The backup lives on the server. If the server is lost, so are the backups. Regularly Download a backup and copy it to another computer or cloud storage, together with the server's document storage folder. Restoring Take a fresh backup of the current state first ( Backup now ), in case you restore the wrong file. Press Restore next to the backup you want, or use Restore from an uploaded backup file for a file you downloaded earlier or brought from another machine. Confirm. Restoring replaces the entire current database. While it runs the whole system goes into maintenance mode : everyone else (cashiers, other admins) sees a \"please wait\" screen. When it finishes, restart the application for a clean start. Warning: Restoring a backup made by a newer version into an older version makes the migration check fail (\"a migration it does not know\"). Deploy the newer version instead, then restore. Good practice Test a restore on a spare computer at least once, before you need it. Keep at least one backup per week for a month and one per month for a year, outside the server. Back up before every upgrade (chapter 12), every import, and before closing the books. Bulk import Bulk import loads data from a CSV or Excel file. The importers include products, customers, suppliers, categories, brands, customer balances , supplier balances and ledger balances , plus module imports (employees, law clients and matters, real estate, and others) inside their own modules. The process is always the same and is designed to be safe: Press Download template for the importer you want and fill it in. Keep the header row. Choose the file and press Check file first. It processes the file exactly as the real import would, but saves nothing . Read the result: how many rows were read, how many can be imported and how many will be skipped , a list of Rows that will be skipped with the reason for each, and a preview of what will be created . Correct the file and check again until the result is what you want. A row that cannot be used is skipped and listed with the reason; the rest of the file still imports. Press Import . The result shows how many were imported and skipped. Notes: Opening balances (customer and supplier) become real OB- invoices and bills, so they age, appear in statements and collections, and are paid like any other. For ledger balances , you can choose Put any difference in Owner's Equity so that the opening journal balances. Module imports read the first sheet only, up to 2,000 rows (.xlsx or CSV). Imports have not been tested on very large files; split big files. Export and year-end archive Export products and Export customers download the current lists. Year-end archive downloads a snapshot of one year's business activity (sales, purchases, payments, stock adjustments) for closing out a financial year. Note: The year-end archive is a curated snapshot, not a full database backup. Always keep a real backup as well. Each list in the system also has its own Excel, PDF and CSV export, with the same filters as the screen. "}, {"id": "admin-11-logs-and-monitoring", "manual": "admin", "n": 11, "title": "Logs and monitoring", "html": "\n<p>The system keeps three records of what happens. They answer different\nquestions.<\/p>\n<div class=\"tablewrap\"><table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Record<\/th>\n<th>Question it answers<\/th>\n<th>Where<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>Audit Log<\/strong><\/td>\n<td>Who changed what in the business?<\/td>\n<td>Settings &gt; Audit Log<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Sign-in log<\/strong><\/td>\n<td>Who signed in, and who failed to?<\/td>\n<td>Settings &gt; Sign-in log<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Server logs<\/strong><\/td>\n<td>What is the application itself doing, and why did something\nfail?<\/td>\n<td>Settings &gt; Server logs<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>All three are Admin only.<\/p>\n<h2 id=\"audit-log\">Audit Log<\/h2>\n<p>Every important action is recorded with the time, the user, an action\ncode and a description. Examples: voids and returns, stock adjustments\nand their approvals, price and discount overrides, imports and exports,\nshift opening and closing, binding a register, role and staff changes,\ntime-tracking budget warnings, and many module actions.<\/p>\n<p>Use the filters at the top: a <strong>search box<\/strong> (user or\ndescription), an <strong>action<\/strong> drop-down (<em>All\nactions<\/em>), <strong>From<\/strong> and <strong>To<\/strong> dates and a\npage size (25, 50, 100, 200). The table shows <strong>When, Who, Action,\nWhat happened<\/strong>.<\/p>\n<p>Typical uses: find out who approved a discount, who voided a sale,\nwho changed a price, who exported the customer list.<\/p>\n<h2 id=\"sign-in-log\">Sign-in log<\/h2>\n<p>Every sign-in attempt is recorded, successful or not. The top of the\npage shows how many people <strong>signed in in the last 24\nhours<\/strong>, how many <strong>failed attempts<\/strong> there were,\nand how many <strong>addresses had failures<\/strong>. Below, filter by\n<em>User name<\/em>, by result (<em>All attempts<\/em>, <em>Signed\nin<\/em>, <em>Failed<\/em>) and by dates. Columns: <strong>When, User\nname, Result, Why, Address, Device<\/strong>.<\/p>\n<p>Watch for many failures from one address or for one user name (a sign\nsomeone is guessing passwords). Press <strong>Refresh<\/strong> to\nupdate.<\/p>\n<h2 id=\"server-logs\">Server logs<\/h2>\n<p>The server writes rotating log files. When the backend runs as a jar,\nfor example as a service, they are in a folder named\n<strong>logs<\/strong> next to the jar (before version 1.26.2 they were\nin the jar's folder itself). When it is started from a development tool\nwithout a jar, they are in a <code>logs<\/code> folder where it was\nstarted. The setting <code>app.logging.dir<\/code> (or the environment\nvariable <code>APP_LOGGING_DIR<\/code>) can point them to another folder,\nand then it wins.<\/p>\n<p>The files are:<\/p>\n<ul>\n<li><code>niwe-erp.log<\/code>: the normal application log.<\/li>\n<li><code>niwe-erp-error.log<\/code>: warnings and errors only.<\/li>\n<li><code>niwe-access.log<\/code>: one line per request.<\/li>\n<\/ul>\n<p>Every line carries a <strong>request id<\/strong> and the\n<strong>user<\/strong>. The same request id is returned to the browser in\nthe <code>X-Request-Id<\/code> header, so a support person can match what\na user saw with the server's record.<\/p>\n<p>On <strong>Settings &gt; Server logs<\/strong>:<\/p>\n<ul>\n<li>Choose a file, a level (<em>All levels<\/em>, <em>Info and\nabove<\/em>, <em>Warnings and errors<\/em>, <em>Errors only<\/em>), type a\ntext to search, and pick how many lines to show (last 100, 300, 1000,\n2000).<\/li>\n<li><strong>Auto-refresh<\/strong> keeps watching. <strong>Download\nfile<\/strong> gets the whole file (the screen shows only the last part\nof a large file).<\/li>\n<li>Before the server has written anything the page says <em>No log\nfiles yet<\/em>.<\/li>\n<li>Only files whose names start with <code>niwe-<\/code> and end with\n<code>.log<\/code> appear here. Other files in the same folder are never\nshown or downloadable from the screen.<\/li>\n<\/ul>\n<p>When you ask NIWE for support, send the request id and the relevant\npart of <code>niwe-erp-error.log<\/code>.<\/p>\n<p>The log behaviour is controlled by the <code>app.logging.*<\/code>\nproperties in the backend settings (folder, size and number of files to\nkeep). The account that runs the service must be allowed to write in the\nlog folder; if it is not, no log files appear.<\/p>\n<div class=\"callout tip\">\n<p><strong>Tip:<\/strong> After installing the backend as a service,\nstart it once, then open <strong>Settings &gt; Server logs<\/strong> to\nconfirm the files appear. If the page says <em>No log files yet<\/em>,\ncheck that the service account can write in the jar's folder (it has to\ncreate the <code>logs<\/code> folder).<\/p>\n<\/div>\n<h2 id=\"other-places-to-look\">Other places to look<\/h2>\n<ul>\n<li>The <strong>dashboard<\/strong> has a <em>Needs your attention<\/em>\nsection (overdue invoices, low stock, pending approvals and\nsimilar).<\/li>\n<li><strong>Settings &gt; Modules<\/strong> shows the licence status and\nexpiry.<\/li>\n<li>Each module's <strong>Overview<\/strong> and <strong>Reports<\/strong>\npages show its day-to-day health.<\/li>\n<\/ul>\n", "text": " The system keeps three records of what happens. They answer different questions. Record Question it answers Where Audit Log Who changed what in the business? Settings > Audit Log Sign-in log Who signed in, and who failed to? Settings > Sign-in log Server logs What is the application itself doing, and why did something fail? Settings > Server logs All three are Admin only. Audit Log Every important action is recorded with the time, the user, an action code and a description. Examples: voids and returns, stock adjustments and their approvals, price and discount overrides, imports and exports, shift opening and closing, binding a register, role and staff changes, time-tracking budget warnings, and many module actions. Use the filters at the top: a search box (user or description), an action drop-down ( All actions ), From and To dates and a page size (25, 50, 100, 200). The table shows When, Who, Action, What happened . Typical uses: find out who approved a discount, who voided a sale, who changed a price, who exported the customer list. Sign-in log Every sign-in attempt is recorded, successful or not. The top of the page shows how many people signed in in the last 24 hours , how many failed attempts there were, and how many addresses had failures . Below, filter by User name , by result ( All attempts , Signed in , Failed ) and by dates. Columns: When, User name, Result, Why, Address, Device . Watch for many failures from one address or for one user name (a sign someone is guessing passwords). Press Refresh to update. Server logs The server writes rotating log files. When the backend runs as a jar, for example as a service, they are in a folder named logs next to the jar (before version 1.26.2 they were in the jar's folder itself). When it is started from a development tool without a jar, they are in a logs folder where it was started. The setting app.logging.dir (or the environment variable APP_LOGGING_DIR ) can point them to another folder, and then it wins. The files are: niwe-erp.log : the normal application log. niwe-erp-error.log : warnings and errors only. niwe-access.log : one line per request. Every line carries a request id and the user . The same request id is returned to the browser in the X-Request-Id header, so a support person can match what a user saw with the server's record. On Settings > Server logs : Choose a file, a level ( All levels , Info and above , Warnings and errors , Errors only ), type a text to search, and pick how many lines to show (last 100, 300, 1000, 2000). Auto-refresh keeps watching. Download file gets the whole file (the screen shows only the last part of a large file). Before the server has written anything the page says No log files yet . Only files whose names start with niwe- and end with .log appear here. Other files in the same folder are never shown or downloadable from the screen. When you ask NIWE for support, send the request id and the relevant part of niwe-erp-error.log . The log behaviour is controlled by the app.logging.* properties in the backend settings (folder, size and number of files to keep). The account that runs the service must be allowed to write in the log folder; if it is not, no log files appear. Tip: After installing the backend as a service, start it once, then open Settings > Server logs to confirm the files appear. If the page says No log files yet , check that the service account can write in the jar's folder (it has to create the logs folder). Other places to look The dashboard has a Needs your attention section (overdue invoices, low stock, pending approvals and similar). Settings > Modules shows the licence status and expiry. Each module's Overview and Reports pages show its day-to-day health. "}, {"id": "admin-12-upgrades-and-migrations", "manual": "admin", "n": 12, "title": "Upgrades and migrations", "html": "\n<h2 id=\"how-the-database-stays-in-step\">How the database stays in\nstep<\/h2>\n<p>The database structure is owned by <strong>Flyway<\/strong>. Each\nrelease carries numbered SQL migration files; on start-up Flyway applies\nany the database has not seen and records them in the\n<code>flyway_schema_history<\/code> table. Hibernate only\n<em>validates<\/em> that the code and the database agree\n(<code>ddl-auto=validate<\/code>); it never changes tables.<\/p>\n<p>Rules that matter to an administrator:<\/p>\n<ol type=\"1\">\n<li><strong>Never edit or delete a migration that has been\napplied.<\/strong> Flyway stores a checksum and refuses to start if a\nfile changed.<\/li>\n<li>A new release is simply started: the new migrations run once, each\nin its own transaction.<\/li>\n<li><strong>Back up first.<\/strong> Always (chapter 10).<\/li>\n<\/ol>\n<h2 id=\"installing-a-new-release\">Installing a new release<\/h2>\n<p>Each release is delivered as a package (for example\n<code>niwe-pos-v1.76.0.tgz<\/code>) with its own release notes\n(<code>RELEASE-NOTES-v1.76.0.md<\/code>). The usual steps:<\/p>\n<ol type=\"1\">\n<li>Announce a short maintenance window. Take a <strong>Backup\nnow<\/strong> and download it.<\/li>\n<li>Stop the backend.<\/li>\n<li>Unpack the package over the project folder.<\/li>\n<li>Run the release's apply script(s), as named in the release notes:\n<code>tools/apply-vXXXX.py<\/code> and\n<code>tools/wire-vXXX.py frontend/src/app<\/code>.<\/li>\n<li>Build the frontend and the backend.<\/li>\n<li>Start the backend. Watch the log for Flyway applying the new\nmigrations and for <em>Started PosApplication<\/em>.<\/li>\n<li>Open the system, sign in, and check <strong>Settings &gt;\nModules<\/strong> (licence and module states) and a few screens.<\/li>\n<\/ol>\n<p>If a release adds a new permission (for example <em>Approve large\nasset disposals<\/em>), nobody has it until you grant it under\n<strong>Staff<\/strong>; Admins have all permissions automatically.<\/p>\n<h2 id=\"upgrading-a-customer-who-is-several-versions-behind\">Upgrading a\ncustomer who is several versions behind<\/h2>\n<p>Migrations are applied in order, so a customer can go straight from\nan old version to the latest: Flyway applies every migration the\ndatabase has not seen. Take a backup first, check the <strong>release\nnotes<\/strong> of every version in between for <strong>one-time\nactions<\/strong> (for example the nginx rule of 1.53 or the new setting\n<code>app.frontend-url<\/code>), upgrade a <strong>copy<\/strong> of the\ncustomer's database first when the gap is large, and keep the old jar\nand the backup until the customer has worked a day on the new version.\nThe <em>Release and upgrade notes for customers<\/em> list the version\ntable and the actions per version; the <em>Installation and deployment\nguide<\/em> has the step-by-step upgrade routine for many customers.<\/p>\n<h2 id=\"the-first-time-on-an-old-database-one-time-per-database\">The\nfirst time on an old database (one time per database)<\/h2>\n<p>The current builds start with schema validation. If an old database\nwas created before Flyway and lacks tables or columns:<\/p>\n<ol type=\"1\">\n<li>Take a backup.<\/li>\n<li>Start the backend <strong>once<\/strong> with the extra profile\n<code>dbsync<\/code> (for example\n<code>mvn spring-boot:run -Dspring-boot.run.profiles=dbsync<\/code>, or\nyour usual profile plus <code>dbsync<\/code>).<\/li>\n<li>Wait for <em>Started PosApplication<\/em>, then stop it.<\/li>\n<li>Start normally. Flyway baselines the database and carries on.<\/li>\n<\/ol>\n<div class=\"callout warning\">\n<p><strong>Warning:<\/strong> Never use <code>dbsync<\/code> on a database\nthat Flyway already manages.<\/p>\n<\/div>\n<p>A database created during development with the older 23 migrations\nmust be dropped and recreated (safe only if it has no real data),\nbecause the single V1 baseline has a different checksum.<\/p>\n<h2 id=\"version-history-in-brief\">Version history in brief<\/h2>\n<div class=\"tablewrap\"><table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Version<\/th>\n<th>Main theme<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>1.1<\/td>\n<td>Module licensing<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>1.2 to 1.4<\/td>\n<td>Property Management, Real Estate and Law firm improvements<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>1.5<\/td>\n<td>Core: paging, search and exports everywhere; collections; imports\nwith check-first; accounting controls; price lists; promotions, gift\ncards and loyalty<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>1.6 to 1.10<\/td>\n<td>HR and Payroll, Hotel, Restaurant, POS, Manufacturing; decimal\nquantities<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>1.11<\/td>\n<td>Receipt tax ID, dashboard paging, sales feature switches<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>1.12<\/td>\n<td>Thermal printing and COM customer display<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>1.13<\/td>\n<td>Register tied to one device<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>1.14<\/td>\n<td>Server logs, sign-in log, wider audit log<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>1.15 to 1.22<\/td>\n<td>Work orders, Time tracking, Booking, Installments, Subscriptions,\nHelp Desk, Expenses, Assets<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>1.23 to 1.26<\/td>\n<td>French throughout: screens, messages, lists, reports and printed\ndocuments<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>1.27<\/td>\n<td>Online Store: the public shop, cash orders<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>1.28 to 1.34<\/td>\n<td>Online Store: shop improvements, online payments (simulated\nprovider, then MTN Mobile Money), customer accounts, coupons, text\nmessages, returns and refunds<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>1.35 to 1.36<\/td>\n<td>Online Store: a full first page (announcement, banner pictures that\nslide, product rows, reviews, newsletter, footer), Reviews and\nNewsletter screens, \"Sellable now\" figures<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>1.37<\/td>\n<td>Online Store: six sales reports, also available as scheduled\ne-mailed reports; no database change<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>1.38<\/td>\n<td>Online Store: send a newsletter from the program; new tables\n(migration V74, runs by itself at start-up); optional settings\n<code>app.online-store.newsletter.batch-size<\/code> and\n<code>daily-limit<\/code><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>1.39<\/td>\n<td>Online Store: abandoned-cart reminders; new tables and a new setting\ncolumn (migration V75, runs by itself at start-up); optional setting\n<code>app.online-store.cart-reminders.batch-size<\/code>; the shop must\nhave working e-mail settings and <code>app.frontend-url<\/code><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>1.40<\/td>\n<td>Online Store: loyalty points for shop accounts; new table and\ncolumns (migration V76, runs by itself at start-up); off until switched\non in Shop settings<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>1.41 to 1.42<\/td>\n<td>Online Store: Airtel Money, several payment providers chosen at\ncheckout; new setting column (migration V77). Provider keys go in the\nserver's environment<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>1.43<\/td>\n<td>Online Store: advertising; three new tables (V78)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>1.44 to 1.48<\/td>\n<td>Online Store: product page, shop experience, ratings and reviews,\ninvoice download, address book, wish list, WhatsApp, product rows (V79\nto V82)<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>1.49<\/td>\n<td>The site can be installed as an app (PWA); no database change; needs\nhttps<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>1.50 to 1.51<\/td>\n<td>Online Store: product variants, contact form, information pages (V84\nto V86)<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>1.52 to 1.64<\/td>\n<td>Online Store delivery: drivers, delivery code, driver private link\nand PIN, driver cash, failed and partial deliveries, delivery time\nslots, return pick-ups, estimate and tax per area (V87 to V97).\n<strong>Add the nginx rule for link previews<\/strong> (1.53) and set\n<code>app.frontend-url<\/code><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>1.55<\/td>\n<td>The customer portal (no database change)<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>1.54<\/td>\n<td>Back-in-stock alerts (V88)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>1.65 to 1.69<\/td>\n<td>Online Store stock and prices: Sales locations, held stock, buffer\nper product, expiry and serials, cartons, reorder, prices from Sales,\nweights and lengths (V98 to V101)<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>1.70 to 1.76<\/td>\n<td>Online Store accounting: VAT and refunds on returns, online payments\nheld and cleared by payouts, Cash with Drivers, discounts, delivery\nincome and loyalty liability, returns at the cost sold, branch for the\nshop, an account for each payment provider (V102 to V106). New accounts\nare added to the chart by themselves a few seconds after start-up; check\n<strong>Accounting &gt; Chart of accounts<\/strong>, then <strong>Online\nStore &gt; Online payments &gt; Accounts by provider<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"if-a-start-up-fails\">If a start-up fails<\/h2>\n<ul>\n<li><em>Migration checksum mismatch<\/em>: a migration file was changed\nafter being applied. Restore the original file.<\/li>\n<li><em>Schema-validation: missing column/table<\/em>: the database is\nbehind the code. Run the one-time <code>dbsync<\/code> start described\nabove (after a backup).<\/li>\n<li>A message naming a <em>migration it does not know<\/em>: you are\nrunning an older build against a database made by a newer one. Deploy\nthe newer build.<\/li>\n<\/ul>\n", "text": " How the database stays in step The database structure is owned by Flyway . Each release carries numbered SQL migration files; on start-up Flyway applies any the database has not seen and records them in the flyway_schema_history table. Hibernate only validates that the code and the database agree ( ddl-auto=validate ); it never changes tables. Rules that matter to an administrator: Never edit or delete a migration that has been applied. Flyway stores a checksum and refuses to start if a file changed. A new release is simply started: the new migrations run once, each in its own transaction. Back up first. Always (chapter 10). Installing a new release Each release is delivered as a package (for example niwe-pos-v1.76.0.tgz ) with its own release notes ( RELEASE-NOTES-v1.76.0.md ). The usual steps: Announce a short maintenance window. Take a Backup now and download it. Stop the backend. Unpack the package over the project folder. Run the release's apply script(s), as named in the release notes: tools/apply-vXXXX.py and tools/wire-vXXX.py frontend/src/app . Build the frontend and the backend. Start the backend. Watch the log for Flyway applying the new migrations and for Started PosApplication . Open the system, sign in, and check Settings > Modules (licence and module states) and a few screens. If a release adds a new permission (for example Approve large asset disposals ), nobody has it until you grant it under Staff ; Admins have all permissions automatically. Upgrading a customer who is several versions behind Migrations are applied in order, so a customer can go straight from an old version to the latest: Flyway applies every migration the database has not seen. Take a backup first, check the release notes of every version in between for one-time actions (for example the nginx rule of 1.53 or the new setting app.frontend-url ), upgrade a copy of the customer's database first when the gap is large, and keep the old jar and the backup until the customer has worked a day on the new version. The Release and upgrade notes for customers list the version table and the actions per version; the Installation and deployment guide has the step-by-step upgrade routine for many customers. The first time on an old database (one time per database) The current builds start with schema validation. If an old database was created before Flyway and lacks tables or columns: Take a backup. Start the backend once with the extra profile dbsync (for example mvn spring-boot:run -Dspring-boot.run.profiles=dbsync , or your usual profile plus dbsync ). Wait for Started PosApplication , then stop it. Start normally. Flyway baselines the database and carries on. Warning: Never use dbsync on a database that Flyway already manages. A database created during development with the older 23 migrations must be dropped and recreated (safe only if it has no real data), because the single V1 baseline has a different checksum. Version history in brief Version Main theme 1.1 Module licensing 1.2 to 1.4 Property Management, Real Estate and Law firm improvements 1.5 Core: paging, search and exports everywhere; collections; imports with check-first; accounting controls; price lists; promotions, gift cards and loyalty 1.6 to 1.10 HR and Payroll, Hotel, Restaurant, POS, Manufacturing; decimal quantities 1.11 Receipt tax ID, dashboard paging, sales feature switches 1.12 Thermal printing and COM customer display 1.13 Register tied to one device 1.14 Server logs, sign-in log, wider audit log 1.15 to 1.22 Work orders, Time tracking, Booking, Installments, Subscriptions, Help Desk, Expenses, Assets 1.23 to 1.26 French throughout: screens, messages, lists, reports and printed documents 1.27 Online Store: the public shop, cash orders 1.28 to 1.34 Online Store: shop improvements, online payments (simulated provider, then MTN Mobile Money), customer accounts, coupons, text messages, returns and refunds 1.35 to 1.36 Online Store: a full first page (announcement, banner pictures that slide, product rows, reviews, newsletter, footer), Reviews and Newsletter screens, \"Sellable now\" figures 1.37 Online Store: six sales reports, also available as scheduled e-mailed reports; no database change 1.38 Online Store: send a newsletter from the program; new tables (migration V74, runs by itself at start-up); optional settings app.online-store.newsletter.batch-size and daily-limit 1.39 Online Store: abandoned-cart reminders; new tables and a new setting column (migration V75, runs by itself at start-up); optional setting app.online-store.cart-reminders.batch-size ; the shop must have working e-mail settings and app.frontend-url 1.40 Online Store: loyalty points for shop accounts; new table and columns (migration V76, runs by itself at start-up); off until switched on in Shop settings 1.41 to 1.42 Online Store: Airtel Money, several payment providers chosen at checkout; new setting column (migration V77). Provider keys go in the server's environment 1.43 Online Store: advertising; three new tables (V78) 1.44 to 1.48 Online Store: product page, shop experience, ratings and reviews, invoice download, address book, wish list, WhatsApp, product rows (V79 to V82) 1.49 The site can be installed as an app (PWA); no database change; needs https 1.50 to 1.51 Online Store: product variants, contact form, information pages (V84 to V86) 1.52 to 1.64 Online Store delivery: drivers, delivery code, driver private link and PIN, driver cash, failed and partial deliveries, delivery time slots, return pick-ups, estimate and tax per area (V87 to V97). Add the nginx rule for link previews (1.53) and set app.frontend-url 1.55 The customer portal (no database change) 1.54 Back-in-stock alerts (V88) 1.65 to 1.69 Online Store stock and prices: Sales locations, held stock, buffer per product, expiry and serials, cartons, reorder, prices from Sales, weights and lengths (V98 to V101) 1.70 to 1.76 Online Store accounting: VAT and refunds on returns, online payments held and cleared by payouts, Cash with Drivers, discounts, delivery income and loyalty liability, returns at the cost sold, branch for the shop, an account for each payment provider (V102 to V106). New accounts are added to the chart by themselves a few seconds after start-up; check Accounting > Chart of accounts , then Online Store > Online payments > Accounts by provider If a start-up fails Migration checksum mismatch : a migration file was changed after being applied. Restore the original file. Schema-validation: missing column/table : the database is behind the code. Run the one-time dbsync start described above (after a backup). A message naming a migration it does not know : you are running an older build against a database made by a newer one. Deploy the newer build. "}, {"id": "admin-13-security-checklist", "manual": "admin", "n": 13, "title": "Security checklist", "html": "\n<p>Work through this list before the system holds real data, and again\nonce a year.<\/p>\n<h2 id=\"before-going-live\">Before going live<\/h2>\n<ul class=\"task-list\">\n<li><label><input type=\"checkbox\" /><strong>Change the admin\npassword<\/strong> and remove or deactivate the demo <code>cashier<\/code>\naccount (or change its password and PIN).<\/label><\/li>\n<li><label><input type=\"checkbox\" />Change <strong>all terminal\nPINs<\/strong> from the demo values (1234 and 5678).<\/label><\/li>\n<li><label><input type=\"checkbox\" />Set a long random\n<strong><code>JWT_SECRET<\/code><\/strong> (the\n<code>app.jwt.secret<\/code> setting). Anyone who knows it can forge a\nsign-in.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Set\n<strong><code>app.seed-demo-data=false<\/code><\/strong>.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Use your own database user and\npassword (<code>DB_USER<\/code>, <code>DB_PASSWORD<\/code>), never share\nthem in files that are copied around, and do not expose the database\nport to the network.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Serve the system over\n<strong>https<\/strong> (a reverse proxy or web server certificate). This\nis also required for direct thermal printing on till PCs that are not on\nlocalhost.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Set\n<code>app.cors.allowed-origins<\/code> to your real address\nonly.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Make sure the\n<strong><code>dev<\/code> profile<\/strong> is never used and\n<code>app.license.dev-all-modules<\/code> is off.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Set up <strong>E-mail\nsettings<\/strong> so that staff can use <em>Forgot password?<\/em>, and\ngive each person an e-mail address.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Confirm that a nightly backup exists\nand that a copy leaves the server.<\/label><\/li>\n<\/ul>\n<h2 id=\"ongoing\">Ongoing<\/h2>\n<ul>\n<li>Give each person their own account; use custom roles and the\napproval permissions rather than extra Admins.<\/li>\n<li>Review <strong>Staff<\/strong> quarterly and untick <em>Active<\/em>\nfor leavers immediately.<\/li>\n<li>Review the <strong>Sign-in log<\/strong> weekly for repeated\nfailures.<\/li>\n<li>Review the <strong>Audit Log<\/strong> for voids, returns, price\noverrides and stock adjustments.<\/li>\n<li>Keep the server's operating system, Java, PostgreSQL and the browser\nup to date.<\/li>\n<li>Restrict who can reach the server physically and by remote\naccess.<\/li>\n<li>Bind each register to its till PC (chapter 8) where tills sit in\npublic areas.<\/li>\n<li>Download a backup before every upgrade and keep one off-site.<\/li>\n<\/ul>\n<h2 id=\"if-you-open-the-online-store-to-the-internet\">If you open the\nOnline Store to the internet<\/h2>\n<p>The public shop is the one part of NIWE ERP meant for strangers, so\ntreat the server as exposed.<\/p>\n<ul>\n<li>Serve it over <strong>HTTPS only<\/strong> (a certificate on the web\nserver or load balancer) and keep the admin screens behind the same\naddress or a separate one you can restrict.<\/li>\n<li>Only <code>/shop<\/code>, <code>/shop/order/...<\/code> and the\n<code>/api/public/...<\/code> addresses are meant to be public. The staff\nscreens still need a sign-in, and the shop's server calls never return\ncosts, suppliers or other customers.<\/li>\n<li>Set <code>server.forward-headers-strategy=native<\/code> when a proxy\nsits in front, so the per-connection limit works (chapter 7).<\/li>\n<li>Keep <strong>Orders waiting per phone<\/strong> and <strong>Orders\nper connection per hour<\/strong> low, watch the <strong>New<\/strong>\norders tab, and phone a customer before packing an unusual order.<\/li>\n<li>Only <code>/shop<\/code>, <code>/shop/order/...<\/code>,\n<code>/shop/newsletter/...<\/code>, <code>/shop/cart/...<\/code> and the\n<code>/api/public/...<\/code> addresses are public. Customer sign-in uses\none-time codes that expire and are limited; reviews, newsletter sign-ups\nand returns are limited per connection and per phone number, and a\nhidden field catches simple robots.<\/li>\n<li>Online payments: keep the payment provider's keys in the server's\nenvironment, never in a file that is copied or committed, and use the\n<strong>live<\/strong> keys only on the live server. A payment call-back\nis never believed on its own: the shop checks the payment again with the\nprovider.<\/li>\n<li>Banner pictures are checked by their content, not their name, and\nshrunk; the footer and banner links written by staff are limited to\n<code>/<\/code>, <code>https://<\/code>, <code>http://<\/code>,\n<code>mailto:<\/code> and <code>tel:<\/code> addresses.<\/li>\n<li>Customers' names, phone numbers, addresses, newsletter e-mail\naddresses and the e-mail addresses kept for abandoned-cart reminders are\npersonal data: back up daily, keep the backups private, and check what\nthe data-protection rules of your country require before you\nlaunch.<\/li>\n<li><strong>Drivers' private links<\/strong>: a driver's page is\nprotected by a long secret in the link plus a 4-digit PIN (five wrong\nPINs lock it for 30 minutes). Send the link and the PIN in two separate\nmessages, <strong>Switch off<\/strong> the link when a driver leaves, and\nmake a <strong>New PIN<\/strong> if a phone is lost. The delivery code is\nnever shown to staff or drivers.<\/li>\n<li><strong>Keys of payment providers<\/strong> belong to each customer\nbusiness and live in that customer's server environment. A key that was\never written in a file that went into a repository or an e-mail is\n<strong>burnt<\/strong>: ask the provider for a new one. Use sandbox keys\nfor tests only and live keys only on the live server.<\/li>\n<li>Set <code>app.frontend-url<\/code> to the real https address so that\nlinks in e-mails, driver links and share previews are right.<\/li>\n<li>Have the server tested by someone outside the team before the shop\nis announced.<\/li>\n<\/ul>\n<h2 id=\"what-the-system-does-for-you\">What the system does for you<\/h2>\n<ul>\n<li>Passwords and PINs are stored securely, not in clear text.<\/li>\n<li>Sign-in uses signed tokens that expire; every server request is\nchecked against the person's role, areas and branch access, not just\nhidden in the menu.<\/li>\n<li>Locked modules are refused by the server, not only hidden.<\/li>\n<li>Deleting is limited: most records are voided, reversed or\ndeactivated, leaving a trail in the audit log.<\/li>\n<\/ul>\n", "text": " Work through this list before the system holds real data, and again once a year. Before going live Change the admin password and remove or deactivate the demo cashier account (or change its password and PIN). Change all terminal PINs from the demo values (1234 and 5678). Set a long random JWT_SECRET (the app.jwt.secret setting). Anyone who knows it can forge a sign-in. Set app.seed-demo-data=false . Use your own database user and password ( DB_USER , DB_PASSWORD ), never share them in files that are copied around, and do not expose the database port to the network. Serve the system over https (a reverse proxy or web server certificate). This is also required for direct thermal printing on till PCs that are not on localhost. Set app.cors.allowed-origins to your real address only. Make sure the dev profile is never used and app.license.dev-all-modules is off. Set up E-mail settings so that staff can use Forgot password? , and give each person an e-mail address. Confirm that a nightly backup exists and that a copy leaves the server. Ongoing Give each person their own account; use custom roles and the approval permissions rather than extra Admins. Review Staff quarterly and untick Active for leavers immediately. Review the Sign-in log weekly for repeated failures. Review the Audit Log for voids, returns, price overrides and stock adjustments. Keep the server's operating system, Java, PostgreSQL and the browser up to date. Restrict who can reach the server physically and by remote access. Bind each register to its till PC (chapter 8) where tills sit in public areas. Download a backup before every upgrade and keep one off-site. If you open the Online Store to the internet The public shop is the one part of NIWE ERP meant for strangers, so treat the server as exposed. Serve it over HTTPS only (a certificate on the web server or load balancer) and keep the admin screens behind the same address or a separate one you can restrict. Only /shop , /shop/order/... and the /api/public/... addresses are meant to be public. The staff screens still need a sign-in, and the shop's server calls never return costs, suppliers or other customers. Set server.forward-headers-strategy=native when a proxy sits in front, so the per-connection limit works (chapter 7). Keep Orders waiting per phone and Orders per connection per hour low, watch the New orders tab, and phone a customer before packing an unusual order. Only /shop , /shop/order/... , /shop/newsletter/... , /shop/cart/... and the /api/public/... addresses are public. Customer sign-in uses one-time codes that expire and are limited; reviews, newsletter sign-ups and returns are limited per connection and per phone number, and a hidden field catches simple robots. Online payments: keep the payment provider's keys in the server's environment, never in a file that is copied or committed, and use the live keys only on the live server. A payment call-back is never believed on its own: the shop checks the payment again with the provider. Banner pictures are checked by their content, not their name, and shrunk; the footer and banner links written by staff are limited to / , https:// , http:// , mailto: and tel: addresses. Customers' names, phone numbers, addresses, newsletter e-mail addresses and the e-mail addresses kept for abandoned-cart reminders are personal data: back up daily, keep the backups private, and check what the data-protection rules of your country require before you launch. Drivers' private links : a driver's page is protected by a long secret in the link plus a 4-digit PIN (five wrong PINs lock it for 30 minutes). Send the link and the PIN in two separate messages, Switch off the link when a driver leaves, and make a New PIN if a phone is lost. The delivery code is never shown to staff or drivers. Keys of payment providers belong to each customer business and live in that customer's server environment. A key that was ever written in a file that went into a repository or an e-mail is burnt : ask the provider for a new one. Use sandbox keys for tests only and live keys only on the live server. Set app.frontend-url to the real https address so that links in e-mails, driver links and share previews are right. Have the server tested by someone outside the team before the shop is announced. What the system does for you Passwords and PINs are stored securely, not in clear text. Sign-in uses signed tokens that expire; every server request is checked against the person's role, areas and branch access, not just hidden in the menu. Locked modules are refused by the server, not only hidden. Deleting is limited: most records are voided, reversed or deactivated, leaving a trail in the audit log. "}, {"id": "admin-14-troubleshooting", "manual": "admin", "n": 14, "title": "Troubleshooting", "html": "\n<div class=\"tablewrap\"><table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Problem<\/th>\n<th>Likely cause and what to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>A module is missing from the menu<\/strong><\/td>\n<td>It is not in the licence, not yet activated, or the person's role\nhas no access to it. Check <strong>Settings &gt; Modules<\/strong>.\nActivation is by an Admin and is permanent.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>\"X is not part of your license\" (403)<\/strong><\/td>\n<td>The module is locked. Install a licence that contains it (chapter\n3).<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>All non-core modules locked suddenly<\/strong><\/td>\n<td>The licence has expired. Nothing is lost. Install the renewal.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>A person cannot see a screen they should<\/strong><\/td>\n<td>Their custom role has <em>No access<\/em> for its area, the role is\n<em>inactive<\/em>, or the screen is admin-only (Settings, Staff,\nBackup). See the area table in chapter 4.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>A cashier cannot approve a void/discount<\/strong><\/td>\n<td>They lack the matching approval permission. Add it under\n<strong>Extra permissions<\/strong> on their staff record, or ask an\nAdmin to type their PIN.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>\"PIN not recognized\" at the terminal<\/strong><\/td>\n<td>The PIN is wrong, or belongs to an inactive person. PINs are 4 to 6\ndigits and unique among active staff. Reset it on the Staff list.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>A till says it is refused / wrong device<\/strong><\/td>\n<td>The register is bound to another device. Unbind it (Admin) or bind\nit to this PC (chapter 8).<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Cannot sell: warehouse message<\/strong><\/td>\n<td>Multi-warehouse is on and the register still uses the Main\nwarehouse. Assign a different warehouse to the register.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Sale refused because of stock<\/strong><\/td>\n<td><em>Allow negative stock<\/em> is off and the sale would oversell.\nReceive stock or adjust it.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>A thermal printer does nothing<\/strong><\/td>\n<td>Check the connection type, that the browser is Chrome or Edge on\nhttps/localhost, press <em>Connect device...<\/em>, then <em>Print test\npage<\/em>. A red line on the printout says why it fell back to the\ndriver.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Strange characters on receipts<\/strong><\/td>\n<td>Change the code page to <em>Plain ASCII<\/em> in the PC's device\nsettings.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>No e-mail arrives<\/strong><\/td>\n<td>Check <strong>Email settings<\/strong> and use <strong>Send test\nemail<\/strong>. Check the recipient's address and the server log. A\nfailed e-mail never blocks the work itself.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Daily job did not run<\/strong><\/td>\n<td>Check the module settings for the job's on/off switch and time, and\nthat the time zone in System settings is right. A job runs when the\nserver is next up that day.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Backup restore stuck on \"please wait\"<\/strong><\/td>\n<td>Restore is running. Wait, then restart the application when it\nfinishes.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Server will not start: checksum or schema\nmessage<\/strong><\/td>\n<td>See chapter 12, <em>If a start-up fails<\/em>.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Import skips many rows<\/strong><\/td>\n<td>Read the reasons in <em>Rows that will be skipped<\/em> after\n<strong>Check file<\/strong>; correct and check again.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>A report looks wrong<\/strong><\/td>\n<td>Check the filters and dates, and whether the books were closed for\nthat period (Accounting &gt; Controls).<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>A user forgot their password<\/strong><\/td>\n<td>If they have an e-mail address on file, use <em>Forgot\npassword?<\/em> on the sign-in screen. Otherwise an Admin sets a new\npassword on the Staff record.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"the-online-shop\">The online shop<\/h2>\n<div class=\"tablewrap\"><table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Problem<\/th>\n<th>Likely cause and what to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>The shop says \"Sold out\" but I have stock<\/strong><\/td>\n<td>The shop sells <em>stock in sellable locations − reserved on\nconfirmed sales orders − Units kept back for the till<\/em> (default 1).\nOpen <strong>Online Store &gt; Shop settings &gt; Products on the\nshop<\/strong>: the line under the product shows each number. A single\nunit shows as sold out because of the buffer (set it to 0 to change\nthat). Stock in a <em>Receiving<\/em>, <em>Damaged<\/em> or inactive\nlocation, or never entered per warehouse, is not counted: move it to a\nsales location with a stock transfer. Goods promised on confirmed sales\norders are not counted either.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>A product does not appear on the shop<\/strong><\/td>\n<td>It is not added in <strong>Products on the shop<\/strong>,\n<strong>Shown<\/strong> is unticked, or the product is inactive. A\nproduct appears in a row only when its tick (<strong>Featured<\/strong>,\n<strong>Best seller<\/strong>, <strong>Offer<\/strong>,\n<strong>New<\/strong>) is on.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>The first page has no banner picture, or shows a plain\ncolour<\/strong><\/td>\n<td>No banner picture is uploaded (Shop settings &gt; Front page &gt;\nBanner pictures), or the upload was refused: only JPEG, PNG, WebP and\nGIF pictures up to 8 MB are accepted, at most 8.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>A review does not appear<\/strong><\/td>\n<td>New reviews wait for staff: approve it in <strong>Online Store &gt;\nReviews<\/strong>. Only reviews with words appear on the first page, and\nonly for completed orders.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>A customer pressed Subscribe but nothing\narrived<\/strong><\/td>\n<td>The newsletter needs working e-mail settings (<strong>Send test\nemail<\/strong>, chapter 9). Ask them to look in the spam folder; an\naddress can ask for a new e-mail once every 10 minutes. The address\nstays <strong>Not confirmed<\/strong> until the link is opened.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>A newsletter stays on \"Sending\" and few e-mails\nleave<\/strong><\/td>\n<td>It goes out in batches of\n<code>app.online-store.newsletter.batch-size<\/code> a minute and never\nmore than <code>daily-limit<\/code> in 24 hours (chapter 7); the daily\nlimit shown on <strong>Send a newsletter<\/strong> says how much of it is\nused. If several e-mails failed in a row it paused: read the reason\nshown on the newsletter, fix the mail settings (<strong>Send test\nemail<\/strong>, chapter 9) and press <strong>Try the failed ones\nagain<\/strong>.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>The confirmation or unsubscribe link opens the wrong\nsite<\/strong><\/td>\n<td><code>app.frontend-url<\/code> is not set to the public address of\nthe site (chapter 7). The unsubscribe links in the downloaded newsletter\nlist are built from the same setting.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Customers say they get no abandoned-cart\nreminder<\/strong><\/td>\n<td><strong>Send reminders for abandoned carts<\/strong> is off in Shop\nsettings, e-mail is not set up (chapter 9), or the customer did not type\nan e-mail address before leaving. Look at <strong>Online Store &gt;\nAbandoned carts<\/strong>: <strong>Waiting<\/strong> carts get their first\ne-mail about an hour after the last change (the job runs every 3\nminutes); <strong>Ordered<\/strong> and <strong>Stopped<\/strong> carts\nget nothing; <strong>Nothing to remind<\/strong> means every item was\ngone or the reminder was too late. A small warning sign on a row shows\nthe mail server's reason. The link in the e-mail opens the wrong site\nwhen <code>app.frontend-url<\/code> is wrong (chapter 7).<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>A customer cannot see or use loyalty points<\/strong><\/td>\n<td><strong>Customers earn and spend loyalty points<\/strong> is off in\nShop settings, or <strong>Customer accounts<\/strong> is off, or the\ncustomer is not signed in (guests earn nothing). Points are earned only\nwhen the order is <strong>completed<\/strong>, not when it is placed; an\norder that is cancelled or refused gives the spent points back. Look at\nthe customer's history in <strong>Online Store &gt; Loyalty\npoints<\/strong>. If a customer has no points to spend they see no points\nbox; points may pay at most the share of the goods set in Shop\nsettings.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>The online payment option is missing at\ncheckout<\/strong><\/td>\n<td><strong>Customers can pay online<\/strong> is off, no provider is\nchosen, or the provider is not available (for MTN: not switched on, a\nkey missing, or the base address is not https; the server log says\nwhich).<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>An order stays \"Awaiting payment\"<\/strong><\/td>\n<td>The customer has not approved the payment. A pending payment is\nchecked about once a minute and the order is cancelled after a day. Look\nat <strong>Online Store &gt; Online payments<\/strong> for <em>Stuck\npending<\/em>.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>A payment is under review<\/strong><\/td>\n<td>The amount or currency the provider reports differs from the order,\nor the order was paid twice. Look at it in <strong>Online\npayments<\/strong>, handle it (refund the difference if needed) and press\n<strong>Mark as dealt with<\/strong>.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>A refund says the provider did not confirm it<\/strong><\/td>\n<td>Check the refund in the provider's portal. If it went through,\nrecord it by hand with the provider's reference (<strong>I refunded it\nmyself<\/strong>); never refund twice.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>No texts are sent<\/strong><\/td>\n<td>No text provider is chosen, the daily limit is reached, or the\nnumber is not valid. <strong>Online Store &gt; Text messages<\/strong>\nlists every text with its result.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Everyone is \"too many requests\"<\/strong><\/td>\n<td>The server sits behind a proxy and\n<code>server.forward-headers-strategy=native<\/code> is not set (chapter\n7).<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Link previews do not show in WhatsApp or\nFacebook<\/strong><\/td>\n<td>The nginx rule for the crawlers (chapter 7, <em>Link previews<\/em>)\nis missing, or <code>app.frontend-url<\/code> is wrong. Test with\n<code>curl -A \"facebookexternalhit/1.1\" \"https://your-shop/shop?product=12\"<\/code>.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>The customer did not get the delivery code<\/strong><\/td>\n<td>Check the order's history line <em>Code message: e-mail ... SMS\n...<\/em>. With no real text company the SMS is kept as <em>Waiting for\nan SMS company<\/em> (Online Store &gt; Text messages); the customer can\nalways read the code on the order page and in his account. Staff can\npress <strong>Send a new code to the customer<\/strong>.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>A driver's link does not work<\/strong><\/td>\n<td>The link was switched off or replaced, the driver is not\n<em>active<\/em>, five wrong PINs locked it for 30 minutes (make a\n<strong>New PIN<\/strong>), or <code>app.frontend-url<\/code> is wrong so\nthe link is incomplete.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>\"Please call the shop\" when a driver hands\nover<\/strong><\/td>\n<td>The completion was refused (for example not enough stock or a batch\nproblem). Open the order: its history holds the real reason.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>A delivery window is missing at checkout<\/strong><\/td>\n<td>Delivery times are off, the window is full, too close (notice), not\non that weekday, the day is closed, or the day is beyond <em>days\nahead<\/em>.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Driver cash does not match Cash with Drivers<\/strong><\/td>\n<td>An order was delivered before version 1.72.0 (its cash went to Cash\nand Bank), a settlement was posted twice, or a hand-in was posted by\nhand. Compare the <em>To hand in<\/em> total with the account's\nbalance.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>A provider's balance keeps growing<\/strong><\/td>\n<td>Payouts are not being recorded: record each payout with\n<strong>Online Store &gt; Online payments &gt; Payouts<\/strong> (gross,\nfee, date, reference). A balance that goes negative means a payout was\nrecorded twice or for the wrong provider.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Accounts by provider will not save<\/strong><\/td>\n<td>The clearing account is already used by another provider, is not an\nordinary asset account, equals the payout account, or the provider still\nowes money on the old clearing account (record its payouts first).<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Suspense account has a balance<\/strong><\/td>\n<td>A posting did not balance and the program put the difference in\nSuspense. Find the entry in Accounting &gt; Journal entries, correct it,\nand tell support the entry's source. Suspense must be zero.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>A payment is not in the books<\/strong><\/td>\n<td>A payment <em>Under review<\/em> is not posted until staff deal with\nit. Open Online Store &gt; Online payments &gt; <em>Under\nreview<\/em>.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>A product is sold out although stock is in a\nwarehouse<\/strong><\/td>\n<td>Only Sales locations outside the Main warehouse count, minus held\nunits and the buffers (chapter 7, <em>Stock the shop sells<\/em>). Look\nat the line under the product.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"when-you-contact-support\">When you contact support<\/h2>\n<p>Send NIWE: the <strong>version number<\/strong>, the\
