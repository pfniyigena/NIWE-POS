y handed in. The project page summarises hours logged, billable, ready to invoice and budget used % , and links to billing. Approvals and team time (manager) Approvals shows: Not submitted : for the chosen week, the people who normally log time but have not handed in everything, with Remind per person or Send reminder to everyone listed . Waiting for approval : filter by status ( Not yet submitted, Approved, Sent back, Invoiced ), person and project. Tick entries and Approve , or Send back with a reason. Correct lets a manager fix the time or description before approving. Bill time Bill time lists Project, Customer, Billable hours, Ready to invoice . Press Prepare invoice for a project: choose the period and due date. The screen shows one line per person and rate (Hours, Rate, Amount). Create draft invoice creates a draft in Sales that you can still edit before issuing. Tax follows the service product set in Time tracking settings. Undo a time invoice releases time so it can be billed again after a draft invoice was deleted or an issued one was voided. Reports Time tracking > Reports : Timesheet Summary, Project Hours vs Budget, Unbilled Time, Utilisation, Time Entries. Settings (administrator) Approval switch, rounding of timers, default rate, daily hour limit, forgotten-timer stop, time lock, weekly reminder, budget warning % and the service product (Administrator Manual, chapter 7). "}, {"id": "user-15-work-orders", "manual": "user", "n": 15, "title": "Work orders", "html": "\n<p>The <strong>Work orders<\/strong> group has: <strong>Work orders,\nBoard, Calendar, Planned maintenance, Service packages,\nReports<\/strong>. A work order (job card) records a piece of work for a\ncustomer, or internal maintenance, with its people, parts, time, costs\nand billing. Staff with a login see their own jobs under <strong>My\njobs<\/strong>.<\/p>\n<h2 id=\"creating-a-job\">Creating a job<\/h2>\n<p><strong>Work orders &gt; New work order<\/strong>:<\/p>\n<ul>\n<li><strong>Type<\/strong>: <em>Customer job (billed)<\/em> or\n<em>Internal maintenance or repair<\/em>.<\/li>\n<li><strong>Priority<\/strong>: <em>Low, Normal, High, Urgent<\/em>.<\/li>\n<li><strong>Start from a service package<\/strong> (optional): copies the\npackage's checklist, parts and price.<\/li>\n<li><strong>Title<\/strong>, <strong>Description<\/strong>,\n<strong>Customer<\/strong>, <strong>Asset (optional)<\/strong> (an item\nfrom the asset register, for maintenance cost reports), <strong>What is\nbeing worked on<\/strong> (for example <em>Laptop serial 123<\/em> or\n<em>Vehicle RAB 123A<\/em>).<\/li>\n<li><strong>Assigned to<\/strong>, <strong>Scheduled<\/strong>,\n<strong>Due<\/strong>, <strong>Hourly rate<\/strong> and an optional\n<strong>Fixed price<\/strong> (leave empty to bill hours and parts).<\/li>\n<\/ul>\n<h2 id=\"estimates-and-customer-approval\">Estimates and customer\napproval<\/h2>\n<p>If your administrator switched on <em>New customer jobs need the\ncustomer's approval<\/em>, work cannot start until an\n<strong>estimate<\/strong> has been sent to the customer and\n<strong>approved<\/strong> (the job shows <em>Approved<\/em> or\n<em>Declined<\/em>). You can switch this off for a single job. The\ncustomer receives a PDF estimate and the <strong>job card<\/strong> and a\ncompletion note are PDFs you can print or e-mail.<\/p>\n<h2 id=\"working-on-a-job\">Working on a job<\/h2>\n<p>On the job page you have:<\/p>\n<ul>\n<li><strong>Checklist<\/strong>: steps to tick off (<strong>Edit\nsteps<\/strong>: one step per line). A job cannot be completed with open\nsteps unless you tick <em>Complete even though ... checklist step(s) are\nnot done<\/em>.<\/li>\n<li><strong>Parts and materials<\/strong>: search a product and add it\nwith a quantity and price (or mark <em>In fixed price<\/em>).\n<strong>Stock moves and the cost is posted when the job is\ncompleted<\/strong>, so record every part first.<\/li>\n<li><strong>Outside costs<\/strong>: a supplier's work or a purchased\nitem (date, what, supplier, cost, <strong>Charge customer<\/strong>),\noptionally <strong>Record as expense in<\/strong> an account, or\n<em>Don't record<\/em>.<\/li>\n<li><strong>Hours<\/strong>: time logged on the job by people through\n<em>Log time<\/em> (internal hours are recorded for information; salaries\nare paid through payroll; with a fixed price the hours are not\nbilled).<\/li>\n<li><strong>Cost and price<\/strong>: parts cost, outside costs, total\ncost and the price.<\/li>\n<li><strong>Manufacturing Order<\/strong>: to make something for the job,\ncreate a linked manufacturing order from a bill of materials; the job\ncannot be completed until the order is produced.<\/li>\n<li>Photos and files can be attached.<\/li>\n<\/ul>\n<p>Buttons: <strong>Put on hold<\/strong>, <strong>Log time<\/strong>,\n<strong>Edit details<\/strong>, <strong>Complete...<\/strong>,\n<strong>Reopen<\/strong>, <strong>Cancel job<\/strong>,\n<strong>Delete<\/strong>.<\/p>\n<h3 id=\"completing-and-invoicing\">Completing and invoicing<\/h3>\n<p><strong>Complete...<\/strong> takes the parts out of stock and posts\ntheir cost, with an optional note. Then <strong>Invoice<\/strong>:\npreview what will be billed (lines and total before tax), set a due date\nand <strong>Create draft invoice<\/strong>. The job shows <strong>On\ninvoice<\/strong>. <strong>Release (bill again)<\/strong> frees it if the\ndraft was deleted.<\/p>\n<h2 id=\"board-and-calendar\">Board and calendar<\/h2>\n<ul>\n<li><strong>Board<\/strong>: columns by status. <strong>Drag a card into\nIn progress to start it, or into On hold<\/strong>. Filter by\n<strong>Everyone / Unassigned<\/strong>, <strong>Customer and\ninternal<\/strong>, <strong>Customer jobs<\/strong>, <strong>Internal\nmaintenance<\/strong>, or search. Cards show <em>Due ... (late)<\/em>,\nurgency and checklist progress.<\/li>\n<li><strong>Calendar<\/strong>: jobs by scheduled date, to plan the\nweek.<\/li>\n<\/ul>\n<h2 id=\"planned-maintenance\">Planned maintenance<\/h2>\n<p><strong>Planned maintenance<\/strong> creates jobs for you on a\nrepeating schedule (for example servicing a generator every 3 months).\n<strong>+ New schedule<\/strong>: <strong>Title<\/strong>,\n<strong>Type<\/strong>, <strong>Priority<\/strong>,\n<strong>Customer<\/strong>, <strong>Asset<\/strong>, <strong>Service\npackage<\/strong>, <strong>Assigned to<\/strong>, prices, <strong>Repeat\nevery n days/weeks/months<\/strong>, <strong>Next one is due<\/strong>,\n<strong>Create the job this many days early<\/strong>, <strong>Job is due\nafter n days<\/strong>, and <em>Do not create a new job while the last\none is still open<\/em>. A check runs every morning; <strong>Run\nnow<\/strong> creates due jobs immediately.<\/p>\n<h2 id=\"service-packages\">Service packages<\/h2>\n<p><strong>Service packages<\/strong> are templates: <strong>Name, Code,\nDescription, Fixed price<\/strong> (0 = bill hours and parts),\n<strong>Estimated hours<\/strong>, a <strong>Checklist<\/strong> and\n<strong>Usual parts<\/strong> (with quantity and whether in the\nprice).<\/p>\n<h2 id=\"reports\">Reports<\/h2>\n<p><strong>Work orders &gt; Reports<\/strong>: Work Orders, Work Order\nProfitability, Maintenance Cost by Asset, Overdue Work Orders.<\/p>\n", "text": " The Work orders group has: Work orders, Board, Calendar, Planned maintenance, Service packages, Reports . A work order (job card) records a piece of work for a customer, or internal maintenance, with its people, parts, time, costs and billing. Staff with a login see their own jobs under My jobs . Creating a job Work orders > New work order : Type : Customer job (billed) or Internal maintenance or repair . Priority : Low, Normal, High, Urgent . Start from a service package (optional): copies the package's checklist, parts and price. Title , Description , Customer , Asset (optional) (an item from the asset register, for maintenance cost reports), What is being worked on (for example Laptop serial 123 or Vehicle RAB 123A ). Assigned to , Scheduled , Due , Hourly rate and an optional Fixed price (leave empty to bill hours and parts). Estimates and customer approval If your administrator switched on New customer jobs need the customer's approval , work cannot start until an estimate has been sent to the customer and approved (the job shows Approved or Declined ). You can switch this off for a single job. The customer receives a PDF estimate and the job card and a completion note are PDFs you can print or e-mail. Working on a job On the job page you have: Checklist : steps to tick off ( Edit steps : one step per line). A job cannot be completed with open steps unless you tick Complete even though ... checklist step(s) are not done . Parts and materials : search a product and add it with a quantity and price (or mark In fixed price ). Stock moves and the cost is posted when the job is completed , so record every part first. Outside costs : a supplier's work or a purchased item (date, what, supplier, cost, Charge customer ), optionally Record as expense in an account, or Don't record . Hours : time logged on the job by people through Log time (internal hours are recorded for information; salaries are paid through payroll; with a fixed price the hours are not billed). Cost and price : parts cost, outside costs, total cost and the price. Manufacturing Order : to make something for the job, create a linked manufacturing order from a bill of materials; the job cannot be completed until the order is produced. Photos and files can be attached. Buttons: Put on hold , Log time , Edit details , Complete... , Reopen , Cancel job , Delete . Completing and invoicing Complete... takes the parts out of stock and posts their cost, with an optional note. Then Invoice : preview what will be billed (lines and total before tax), set a due date and Create draft invoice . The job shows On invoice . Release (bill again) frees it if the draft was deleted. Board and calendar Board : columns by status. Drag a card into In progress to start it, or into On hold . Filter by Everyone / Unassigned , Customer and internal , Customer jobs , Internal maintenance , or search. Cards show Due ... (late) , urgency and checklist progress. Calendar : jobs by scheduled date, to plan the week. Planned maintenance Planned maintenance creates jobs for you on a repeating schedule (for example servicing a generator every 3 months). + New schedule : Title , Type , Priority , Customer , Asset , Service package , Assigned to , prices, Repeat every n days/weeks/months , Next one is due , Create the job this many days early , Job is due after n days , and Do not create a new job while the last one is still open . A check runs every morning; Run now creates due jobs immediately. Service packages Service packages are templates: Name, Code, Description, Fixed price (0 = bill hours and parts), Estimated hours , a Checklist and Usual parts (with quantity and whether in the price). Reports Work orders > Reports : Work Orders, Work Order Profitability, Maintenance Cost by Asset, Overdue Work Orders. "}, {"id": "user-16-booking-appointments", "manual": "user", "n": 16, "title": "Booking (appointments)", "html": "\n<p>The <strong>Booking<\/strong> group has: <strong>Calendar,\nAppointments, Services, Rooms &amp; equipment, Working hours, Reports,\nSettings<\/strong>. It is for businesses that sell time slots: salons,\nclinics, studios, courts. Staff who perform services see their own list\nunder <strong>My appointments<\/strong>. Guests can also book by\nthemselves on the public page, if your business switched it on.<\/p>\n<h2 id=\"set-up-manager\">Set-up (manager)<\/h2>\n<h3 id=\"services\">Services<\/h3>\n<p><strong>Services &gt; New<\/strong>: <strong>Name<\/strong>,\n<strong>Description<\/strong> (shown on the public page), <strong>Length\n(minutes)<\/strong>, <strong>Buffer after (minutes)<\/strong> (cleaning or\nrest time), <strong>Price<\/strong>, <strong>Payment needed to\nconfirm<\/strong> (<em>None: pay at the visit; A deposit; The full\nprice<\/em>, with <strong>Deposit (% of price)<\/strong>), whether it\n<strong>Needs a room or piece of equipment<\/strong> of a kind (for\nexample Room, Chair, Court), a <strong>Colour on the calendar<\/strong>,\n<strong>Who can do this<\/strong> (leave empty for anyone), <strong>Can\nbe booked<\/strong> and <strong>Show on the public booking\npage<\/strong>.<\/p>\n<h3 id=\"rooms-and-equipment\">Rooms and equipment<\/h3>\n<p><strong>Rooms &amp; equipment<\/strong>: add a room or piece of\nequipment (Name, Kind, Capacity, Notes) only if your services need one.\n<strong>Blocked time<\/strong> stops bookings for everything (a public\nholiday), one person (leave) or one room (repairs): choose <em>Applies\nto<\/em>, the dates and a reason.<\/p>\n<h3 id=\"working-hours-and-leave\">Working hours and leave<\/h3>\n<p>By default everyone who performs a service can be booked during the\nbusiness opening hours. <strong>Working hours<\/strong> lets you give a\nperson their own days and hours (inside the opening hours) and add\n<strong>Leave<\/strong> for days they are away.<\/p>\n<h2 id=\"making-an-appointment\">Making an appointment<\/h2>\n<p><strong>Calendar &gt; New appointment<\/strong>:<\/p>\n<ol type=\"1\">\n<li>Choose the <strong>Service<\/strong>. Its length and price are\nshown.<\/li>\n<li>Choose the <strong>Date<\/strong>, optionally <strong>Prefer a\nperson<\/strong> (<em>Anyone free<\/em>), and pick a <strong>Time<\/strong>\nfrom the free slots. If nothing is free, try another day or person.<\/li>\n<li><strong>Person<\/strong> and <strong>Room / equipment<\/strong>:\n<em>Assign automatically<\/em> or pick.<\/li>\n<li><strong>Who is it for?<\/strong> An existing customer, or a walk-in\n(name, phone, e-mail for the confirmation) and notes.<\/li>\n<li>If the service needs payment to confirm, an <strong>invoice is\nraised<\/strong> and the time is <strong>held<\/strong> for the guest to\npay. Tick <strong>Confirm now without waiting for payment<\/strong> to\nskip this.<\/li>\n<\/ol>\n<h2 id=\"the-calendar\">The calendar<\/h2>\n<p><strong>Booking calendar<\/strong> shows the day by hour, <strong>By\nperson<\/strong> or <strong>By room / equipment<\/strong>, with counts for\n<em>Today, Next 7 days, Waiting for payment<\/em> and <em>No-shows this\nmonth<\/em>. Unpaid and no-show appointments are marked. <strong>Print\nday sheet<\/strong> gives a sheet for the day.<\/p>\n<h2 id=\"working-with-an-appointment\">Working with an appointment<\/h2>\n<p>Open an appointment to see the time, the person, a\n<strong>Code<\/strong>, how long it is held, and the guest's other visits\n(a warning shows if the guest has missed earlier appointments).\nActions:<\/p>\n<ul>\n<li><strong>Confirm without payment<\/strong>, <strong>Mark\ndone<\/strong>, <strong>No-show<\/strong>.<\/li>\n<li><strong>Move to another time<\/strong>: pick a free slot.<\/li>\n<li><strong>Cancel appointment<\/strong> (optional reason). An unpaid\ninvoice for this booking is voided; money already received stays on the\ninvoice for you to refund or keep.<\/li>\n<li><strong>Payment<\/strong>: shows price and deposit, the\n<strong>Invoice<\/strong>, what is paid; <strong>Record payment<\/strong>\nor <strong>Create invoice<\/strong>.<\/li>\n<li><strong>Reminder and calendar<\/strong>: <strong>Send reminder\nnow<\/strong> (e-mail with a calendar file) or <strong>Download calendar\nfile<\/strong>. A reminder is sent automatically before the visit when\nthe setting is on. Guests can also move their own booking online.<\/li>\n<li><strong>Notes<\/strong>.<\/li>\n<\/ul>\n<h2 id=\"reports\">Reports<\/h2>\n<p><strong>Booking &gt; Reports<\/strong>: Appointments, Booking\nutilisation, Bookings by service.<\/p>\n<h2 id=\"settings-administrator\">Settings (administrator)<\/h2>\n<p>Opening hours, booking rules (earliest, furthest ahead, hold for\npayment, online cancel), reminders, the public page at\n<code>/book<\/code> and how to pay.<\/p>\n", "text": " The Booking group has: Calendar, Appointments, Services, Rooms & equipment, Working hours, Reports, Settings . It is for businesses that sell time slots: salons, clinics, studios, courts. Staff who perform services see their own list under My appointments . Guests can also book by themselves on the public page, if your business switched it on. Set-up (manager) Services Services > New : Name , Description (shown on the public page), Length (minutes) , Buffer after (minutes) (cleaning or rest time), Price , Payment needed to confirm ( None: pay at the visit; A deposit; The full price , with Deposit (% of price) ), whether it Needs a room or piece of equipment of a kind (for example Room, Chair, Court), a Colour on the calendar , Who can do this (leave empty for anyone), Can be booked and Show on the public booking page . Rooms and equipment Rooms & equipment : add a room or piece of equipment (Name, Kind, Capacity, Notes) only if your services need one. Blocked time stops bookings for everything (a public holiday), one person (leave) or one room (repairs): choose Applies to , the dates and a reason. Working hours and leave By default everyone who performs a service can be booked during the business opening hours. Working hours lets you give a person their own days and hours (inside the opening hours) and add Leave for days they are away. Making an appointment Calendar > New appointment : Choose the Service . Its length and price are shown. Choose the Date , optionally Prefer a person ( Anyone free ), and pick a Time from the free slots. If nothing is free, try another day or person. Person and Room / equipment : Assign automatically or pick. Who is it for? An existing customer, or a walk-in (name, phone, e-mail for the confirmation) and notes. If the service needs payment to confirm, an invoice is raised and the time is held for the guest to pay. Tick Confirm now without waiting for payment to skip this. The calendar Booking calendar shows the day by hour, By person or By room / equipment , with counts for Today, Next 7 days, Waiting for payment and No-shows this month . Unpaid and no-show appointments are marked. Print day sheet gives a sheet for the day. Working with an appointment Open an appointment to see the time, the person, a Code , how long it is held, and the guest's other visits (a warning shows if the guest has missed earlier appointments). Actions: Confirm without payment , Mark done , No-show . Move to another time : pick a free slot. Cancel appointment (optional reason). An unpaid invoice for this booking is voided; money already received stays on the invoice for you to refund or keep. Payment : shows price and deposit, the Invoice , what is paid; Record payment or Create invoice . Reminder and calendar : Send reminder now (e-mail with a calendar file) or Download calendar file . A reminder is sent automatically before the visit when the setting is on. Guests can also move their own booking online. Notes . Reports Booking > Reports : Appointments, Booking utilisation, Bookings by service. Settings (administrator) Opening hours, booking rules (earliest, furthest ahead, hold for payment, online cancel), reminders, the public page at /book and how to pay. "}, {"id": "user-17-subscriptions", "manual": "user", "n": 17, "title": "Subscriptions", "html": "\n<p>The <strong>Subscriptions<\/strong> group has: <strong>Subscription\nplans, Subscriptions, Overview, Reports, Job settings<\/strong>. Use it\nfor anything billed on a regular cycle: memberships, support contracts,\nsoftware, rent-like services.<\/p>\n<h2 id=\"plans\">Plans<\/h2>\n<p><strong>Subscription plans &gt; New<\/strong>: <strong>Name<\/strong>\n(for example <em>Gold membership<\/em>), <strong>Description<\/strong>,\n<strong>Price<\/strong>, <strong>Billing interval<\/strong> (<em>Weekly,\nMonthly, Quarterly, Yearly<\/em>), <strong>Tax rate<\/strong>,\n<strong>Discount %<\/strong> (default for new subscriptions; editable per\ncustomer), and <strong>Active<\/strong>. Inactive plans stay on existing\nsubscriptions but cannot be chosen for new ones.<\/p>\n<h2 id=\"starting-a-subscription\">Starting a subscription<\/h2>\n<p><strong>Subscriptions &gt; New subscription<\/strong>:<\/p>\n<ol type=\"1\">\n<li><strong>Customer<\/strong> (or <strong>+ New customer<\/strong>) and\n<strong>Plan<\/strong> (or <strong>+ New plan<\/strong>).<\/li>\n<li>The price, interval, tax and discount are pre-filled from the plan;\nchange them to give this customer a different deal.<\/li>\n<li><strong>Quantity (seats / units)<\/strong>: each invoice bills\nquantity × price.<\/li>\n<li><strong>Setup fee (one time)<\/strong> is added to the first invoice\nonly. <strong>Free trial (days)<\/strong>: billing starts when the trial\nends.<\/li>\n<li><strong>Start date<\/strong> and <strong>Billing timing<\/strong>:\n<em>Prepaid<\/em> (bill on the start date, before that cycle's service)\nor <em>Paid after service<\/em> (bill one cycle after the start).<\/li>\n<li><strong>Term (billing cycles)<\/strong>: blank = until cancelled; for\na fixed term choose what happens <strong>at the end of the\nterm<\/strong>: <em>Renew for another term<\/em> or <em>End the\nsubscription<\/em>.<\/li>\n<li><strong>Create subscription<\/strong>.<\/li>\n<\/ol>\n<h2 id=\"managing-a-subscription\">Managing a subscription<\/h2>\n<p>The page shows status, price, interval, next and last billing, term\nand notices (<em>Free trial until...<\/em>, <em>Paused<\/em>,\n<em>Cancellation scheduled<\/em>). Buttons:<\/p>\n<ul>\n<li><strong>Bill now<\/strong>: issue the next invoice right away.<\/li>\n<li><strong>Edit terms<\/strong>: change price, quantity, interval,\ndiscount, tax, setup fee or term. <em>Changes apply from the next bill.\nNothing is charged or credited now.<\/em><\/li>\n<li><strong>Change plan<\/strong>: move to another plan, with the option\nto <strong>settle the unused part of the current period now<\/strong>\n(for prepaid subscriptions already billed). The screen shows days left\nand the monthly value before and after.<\/li>\n<li><strong>Pause...<\/strong> with an optional reason and <strong>Resume\nautomatically on<\/strong> date; <strong>Resume<\/strong> when ready.<\/li>\n<li><strong>Skip next billing<\/strong>: skip one cycle.<\/li>\n<li><strong>Cancel subscription<\/strong>: <strong>Cancel now<\/strong>,\nor <strong>At the end of the paid period<\/strong>. A scheduled\ncancellation can be withdrawn. Cancelling now cannot be undone.<\/li>\n<\/ul>\n<p><strong>Billing history<\/strong> lists the invoices and their status;\n<strong>Activity<\/strong> records every change.<\/p>\n<p>Invoices are generated automatically each day for subscriptions whose\nbilling date has arrived (if your administrator left that on). The job\ncan also send reminders before billing, pause or cancel subscriptions\nwhose invoice stays unpaid, and e-mail the customer when an invoice is\noverdue.<\/p>\n<h2 id=\"overview\">Overview<\/h2>\n<p><strong>Subscriptions &gt; Overview<\/strong>: <strong>Monthly\nrecurring revenue<\/strong>, yearly value, <strong>Paying\nsubscriptions<\/strong>, average, <strong>On trial / paused<\/strong>,\n<strong>Left in the last 30 days<\/strong>, <strong>Churn %<\/strong> and\nnew ones, <strong>Billing in 7 / 30 days<\/strong>, <strong>Unpaid\ninvoices<\/strong>, <strong>Ending<\/strong>, and lists of <em>On trial,\nCancelling, Term ending, Resuming, Billing next<\/em>, plus the unpaid\nsubscription invoices with <em>Days late<\/em> and\n<em>Reminders<\/em>.<\/p>\n<h2 id=\"reports\">Reports<\/h2>\n<p><strong>Subscriptions &gt; Reports<\/strong>: Subscriptions by Plan,\nCancelled and Ended Subscriptions, Unpaid Subscription Invoices.<\/p>\n<h2 id=\"job-settings-administrator\">Job settings (administrator)<\/h2>\n<p>The daily run time, automatic billing, reminders, what to do with\nunpaid invoices, the daily digest and catching up missed cycles.<\/p>\n", "text": " The Subscriptions group has: Subscription plans, Subscriptions, Overview, Reports, Job settings . Use it for anything billed on a regular cycle: memberships, support contracts, software, rent-like services. Plans Subscription plans > New : Name (for example Gold membership ), Description , Price , Billing interval ( Weekly, Monthly, Quarterly, Yearly ), Tax rate , Discount % (default for new subscriptions; editable per customer), and Active . Inactive plans stay on existing subscriptions but cannot be chosen for new ones. Starting a subscription Subscriptions > New subscription : Customer (or + New customer ) and Plan (or + New plan ). The price, interval, tax and discount are pre-filled from the plan; change them to give this customer a different deal. Quantity (seats / units) : each invoice bills quantity × price. Setup fee (one time) is added to the first invoice only. Free trial (days) : billing starts when the trial ends. Start date and Billing timing : Prepaid (bill on the start date, before that cycle's service) or Paid after service (bill one cycle after the start). Term (billing cycles) : blank = until cancelled; for a fixed term choose what happens at the end of the term : Renew for another term or End the subscription . Create subscription . Managing a subscription The page shows status, price, interval, next and last billing, term and notices ( Free trial until... , Paused , Cancellation scheduled ). Buttons: Bill now : issue the next invoice right away. Edit terms : change price, quantity, interval, discount, tax, setup fee or term. Changes apply from the next bill. Nothing is charged or credited now. Change plan : move to another plan, with the option to settle the unused part of the current period now (for prepaid subscriptions already billed). The screen shows days left and the monthly value before and after. Pause... with an optional reason and Resume automatically on date; Resume when ready. Skip next billing : skip one cycle. Cancel subscription : Cancel now , or At the end of the paid period . A scheduled cancellation can be withdrawn. Cancelling now cannot be undone. Billing history lists the invoices and their status; Activity records every change. Invoices are generated automatically each day for subscriptions whose billing date has arrived (if your administrator left that on). The job can also send reminders before billing, pause or cancel subscriptions whose invoice stays unpaid, and e-mail the customer when an invoice is overdue. Overview Subscriptions > Overview : Monthly recurring revenue , yearly value, Paying subscriptions , average, On trial / paused , Left in the last 30 days , Churn % and new ones, Billing in 7 / 30 days , Unpaid invoices , Ending , and lists of On trial, Cancelling, Term ending, Resuming, Billing next , plus the unpaid subscription invoices with Days late and Reminders . Reports Subscriptions > Reports : Subscriptions by Plan, Cancelled and Ended Subscriptions, Unpaid Subscription Invoices. Job settings (administrator) The daily run time, automatic billing, reminders, what to do with unpaid invoices, the daily digest and catching up missed cycles. "}, {"id": "user-18-installments", "manual": "user", "n": 18, "title": "Installments", "html": "\n<p>The <strong>Installments<\/strong> group has: <strong>Agreements,\nCollections, New plan, Reports, Settings<\/strong>. It lets a customer\npay an existing invoice in parts over time, with optional interest and\nlate fees.<\/p>\n<h2 id=\"creating-a-plan\">Creating a plan<\/h2>\n<ol type=\"1\">\n<li>Issue the invoice first (Sales &gt; Invoices). On the invoice press\n<strong>Pay in instalments<\/strong>, or use <strong>Installments &gt;\nNew plan<\/strong> and choose an <strong>Invoice<\/strong> (an issued\ninvoice with a customer and an unpaid balance).<\/li>\n<li>The screen shows the <strong>Invoice total, paid<\/strong> and\n<strong>still owed<\/strong>.<\/li>\n<li>Optionally take a <strong>Deposit now<\/strong> (and how it is\n<strong>paid by<\/strong>). The deposit is recorded as a payment on the\ninvoice.<\/li>\n<li>Set the <strong>Number of instalments<\/strong>,\n<strong>Every<\/strong> (week, 2 weeks, month, 3 months) and the\n<strong>First due date<\/strong>.<\/li>\n<li><strong>Interest<\/strong>: <em>None<\/em>, <em>Flat (on the whole\namount)<\/em> or <em>Reducing balance<\/em>, with a <strong>Yearly rate\n%<\/strong>. Add <strong>Grace days<\/strong>, a <strong>Late fee\n(fixed)<\/strong> and/or a <strong>Late fee (% of unpaid)<\/strong>. Tick\n<strong>Whole amounts (no cents)<\/strong> for currencies without cents;\nthe last instalment takes any rounding.<\/li>\n<li>Tick <strong>Email the customer reminders for this plan<\/strong> if\nwanted.<\/li>\n<li>Press <strong>Preview schedule<\/strong> to see each instalment's due\ndate, principal, interest and total, then save. The starting values come\nfrom Installments settings.<\/li>\n<\/ol>\n<h2 id=\"collecting\">Collecting<\/h2>\n<p>On a plan, <strong>Record a payment<\/strong>: amount, method and\nnote. A payment goes to the <strong>oldest unpaid instalment\nfirst<\/strong>; interest and late fees are settled before principal. The\nplan shows <strong>Total payable, Paid, Outstanding,\nOverdue<\/strong>.<\/p>\n<p>Documents: <strong>Schedule (PDF)<\/strong>, <strong>Statement\n(PDF)<\/strong>, <strong>Agreement (PDF)<\/strong> (printed with the\nterms), <strong>E-mail statement<\/strong> (optionally with the\nagreement), <strong>Send reminder<\/strong>.<\/p>\n<h2 id=\"managing-a-plan\">Managing a plan<\/h2>\n<ul>\n<li><strong>Edit schedule<\/strong>: change dates and amounts, add or\nremove unpaid instalments. What is already paid stays as it is; the\nprincipal must still add up and interest cannot go below what was paid.\n<strong>Split principal evenly<\/strong> helps.<\/li>\n<li><strong>Pay off early<\/strong>: settles every unpaid instalment\ntoday. Part of the interest on instalments not yet due can be waived (a\npercentage, changeable per payoff). It shows <em>Principal left,\nInterest left, Late fees left, Interest waived<\/em> and <strong>To pay\nnow<\/strong>; press <strong>Receive ... and close the\nplan<\/strong>.<\/li>\n<li><strong>Mark defaulted<\/strong>: the customer has stopped paying. No\nmore late fees or reminders are added; payments are still accepted; use\n<strong>Back to active<\/strong> to reverse. Your settings may default\nplans automatically after a number of days overdue.<\/li>\n<li><strong>Write off<\/strong>: books the unpaid principal as a bad debt\nand the invoice shows nothing outstanding. A reason is required. This\ncannot be undone from here.<\/li>\n<li><strong>Cancel plan<\/strong>: whatever is unpaid stays on the\ninvoice as an ordinary debt; unpaid interest and late fees are\ndropped.<\/li>\n<\/ul>\n<h2 id=\"collections\">Collections<\/h2>\n<p><strong>Installments &gt; Collections<\/strong> is the collector's\nwork list: <strong>Overdue in this list<\/strong>, <strong>Broken\npromises<\/strong>, <strong>Promised for today<\/strong>, <strong>Never\ncontacted<\/strong>. For each plan it shows the customer, overdue amount\nand age, next due date, last contact and promise to pay. <strong>Log\ncontact<\/strong>: <em>Phone call, Visit<\/em> or <em>Promise to pay<\/em>\n(with a date and amount) and a note. Every send is added to the\ncollections log.<\/p>\n<h2 id=\"reports\">Reports<\/h2>\n<p><strong>Installments &gt; Reports<\/strong>: Instalment Agreements,\nInstalments Due (next 30 days), Overdue Instalments, Defaulted and\nWritten-off Instalments, Instalment Collections.<\/p>\n<h2 id=\"settings-administrator\">Settings (administrator)<\/h2>\n<p>Reminder timing, starting values for new plans, early-payoff interest\nwaiver, automatic default, and the agreement wording.<\/p>\n", "text": " The Installments group has: Agreements, Collections, New plan, Reports, Settings . It lets a customer pay an existing invoice in parts over time, with optional interest and late fees. Creating a plan Issue the invoice first (Sales > Invoices). On the invoice press Pay in instalments , or use Installments > New plan and choose an Invoice (an issued invoice with a customer and an unpaid balance). The screen shows the Invoice total, paid and still owed . Optionally take a Deposit now (and how it is paid by ). The deposit is recorded as a payment on the invoice. Set the Number of instalments , Every (week, 2 weeks, month, 3 months) and the First due date . Interest : None , Flat (on the whole amount) or Reducing balance , with a Yearly rate % . Add Grace days , a Late fee (fixed) and/or a Late fee (% of unpaid) . Tick Whole amounts (no cents) for currencies without cents; the last instalment takes any rounding. Tick Email the customer reminders for this plan if wanted. Press Preview schedule to see each instalment's due date, principal, interest and total, then save. The starting values come from Installments settings. Collecting On a plan, Record a payment : amount, method and note. A payment goes to the oldest unpaid instalment first ; interest and late fees are settled before principal. The plan shows Total payable, Paid, Outstanding, Overdue . Documents: Schedule (PDF) , Statement (PDF) , Agreement (PDF) (printed with the terms), E-mail statement (optionally with the agreement), Send reminder . Managing a plan Edit schedule : change dates and amounts, add or remove unpaid instalments. What is already paid stays as it is; the principal must still add up and interest cannot go below what was paid. Split principal evenly helps. Pay off early : settles every unpaid instalment today. Part of the interest on instalments not yet due can be waived (a percentage, changeable per payoff). It shows Principal left, Interest left, Late fees left, Interest waived and To pay now ; press Receive ... and close the plan . Mark defaulted : the customer has stopped paying. No more late fees or reminders are added; payments are still accepted; use Back to active to reverse. Your settings may default plans automatically after a number of days overdue. Write off : books the unpaid principal as a bad debt and the invoice shows nothing outstanding. A reason is required. This cannot be undone from here. Cancel plan : whatever is unpaid stays on the invoice as an ordinary debt; unpaid interest and late fees are dropped. Collections Installments > Collections is the collector's work list: Overdue in this list , Broken promises , Promised for today , Never contacted . For each plan it shows the customer, overdue amount and age, next due date, last contact and promise to pay. Log contact : Phone call, Visit or Promise to pay (with a date and amount) and a note. Every send is added to the collections log. Reports Installments > Reports : Instalment Agreements, Instalments Due (next 30 days), Overdue Instalments, Defaulted and Written-off Instalments, Instalment Collections. Settings (administrator) Reminder timing, starting values for new plans, early-payoff interest waiver, automatic default, and the agreement wording. "}, {"id": "user-19-help-desk", "manual": "user", "n": 19, "title": "Help Desk", "html": "\n<p>The <strong>Help Desk<\/strong> group has: <strong>Overview, Tickets,\nSaved replies, Categories, Settings, Reports<\/strong>. It handles\nrequests from customers and from colleagues (internal requests), with\ndeadlines, replies by e-mail and a full history.<\/p>\n<h2 id=\"where-tickets-come-from\">Where tickets come from<\/h2>\n<ul>\n<li>Staff create them: <strong>Tickets &gt; New<\/strong> (a phone call,\na walk-in).<\/li>\n<li>Customers send a request themselves on the public page\n<code>/helpdesk<\/code> (if switched on) and can follow the ticket,\nreply, add files and rate the help.<\/li>\n<\/ul>\n<h2 id=\"creating-a-ticket\">Creating a ticket<\/h2>\n<p><strong>Tickets &gt; New ticket<\/strong>: <strong>Type<\/strong>\n(<em>Customer request<\/em> or <em>Internal request<\/em>; the type cannot\nbe changed afterwards), <strong>Customer<\/strong> (optional, an existing\ncustomer or not), <strong>Requester name, email, phone<\/strong>,\n<strong>Subject<\/strong>, <strong>Description<\/strong>,\n<strong>Category<\/strong>, <strong>Priority<\/strong> (<em>Low, Medium,\nHigh, Urgent<\/em>) and <strong>Assign to<\/strong>.<\/p>\n<h2 id=\"working-a-ticket\">Working a ticket<\/h2>\n<p>A ticket's page shows its status, priority, category, requester,\ndates and, if deadlines are on, <strong>First reply due<\/strong> and\n<strong>Resolve by<\/strong>, with a colour when late.<\/p>\n<ul>\n<li><strong>Conversation<\/strong>: choose <strong>Internal note<\/strong>\n(staff only) or <strong>Reply to the customer<\/strong>. A reply is\ne-mailed to the customer when the ticket has an e-mail address.\n<strong>Insert a saved reply...<\/strong> inserts a ready answer;\nplaceholders are filled from the ticket. Tick <strong>Then wait for the\ncustomer's answer<\/strong> to set the status to waiting.<\/li>\n<li><strong>Wait for customer<\/strong>: pauses the deadline clock until\nthe customer answers.<\/li>\n<li><strong>Resolve<\/strong> (with optional <em>Resolution notes<\/em>),\n<strong>Close<\/strong>, <strong>Reopen<\/strong>. Resolved tickets are\nclosed automatically after the number of days set in settings.<\/li>\n<li><strong>Assigned to<\/strong> and <strong>Tags<\/strong> (for example\n<em>billing, vip<\/em>).<\/li>\n<li><strong>Links<\/strong>: attach an <strong>Invoice number<\/strong> or\na <strong>Job (work order) number<\/strong> to the ticket, and follow the\nlink back and forth.<\/li>\n<li><strong>Merge into another ticket...<\/strong>: use it when the same\nproblem was reported twice. The conversation and files move to the\nticket you choose, and this one is closed as merged.<\/li>\n<li><strong>Files<\/strong>: add pictures, PDFs or text (up to 10 MB\neach); tick <strong>Customer can see<\/strong> to share it on the public\nticket page.<\/li>\n<li><strong>History<\/strong>: every change, with who and when.<\/li>\n<\/ul>\n<h2 id=\"the-ticket-list\">The ticket list<\/h2>\n<p>Filter by status, priority, category, assignee and quick views\n(<em>overdue, unassigned, mine<\/em>). Tick several tickets for bulk\nactions such as assigning.<\/p>\n<h2 id=\"overview\">Overview<\/h2>\n<p><strong>Help Desk &gt; Overview<\/strong> shows:\n<strong>Unanswered<\/strong>, <strong>Overdue<\/strong> (past a deadline),\n<strong>Due soon<\/strong>, <strong>Unassigned<\/strong>, <strong>Open /\nin progress<\/strong>, <strong>Mine<\/strong>, last 7 days in and out,\n<strong>On time (30 days)<\/strong>, <strong>Avg first reply<\/strong>,\n<strong>Avg time to resolve<\/strong>, <strong>Customer rating<\/strong>,\ntickets by priority and age, <strong>Workload<\/strong> per agent\n(<em>Active, Overdue, Resolved (30 days)<\/em>) and a <strong>Needs\nattention<\/strong> list with the reason.<\/p>\n<h2 id=\"saved-replies\">Saved replies<\/h2>\n<p><strong>Saved replies &gt; New<\/strong>: a <strong>Title<\/strong>,\nthe <strong>Reply text<\/strong> and an optional\n<strong>Category<\/strong>. Placeholders for the ticket's details are\nfilled in when you insert the reply.<\/p>\n<h2 id=\"categories\">Categories<\/h2>\n<p><strong>Categories<\/strong> group tickets (for example <em>Billing,\nTechnical, Delivery<\/em>) for routing and reports.<\/p>\n<h2 id=\"reports\">Reports<\/h2>\n<p><strong>Help Desk &gt; Reports<\/strong>: Help Desk Tickets, Help Desk\nDeadlines (SLA), Help Desk by Agent, Help Desk by Category, Help Desk\nSatisfaction, Overdue Help Desk Tickets.<\/p>\n<h2 id=\"settings-administrator\">Settings (administrator)<\/h2>\n<p>Public page on/off, notification e-mails, replies by e-mail,\ndeadlines (SLA) by priority, warnings and automatic closing\n(Administrator Manual, chapter 7).<\/p>\n", "text": " The Help Desk group has: Overview, Tickets, Saved replies, Categories, Settings, Reports . It handles requests from customers and from colleagues (internal requests), with deadlines, replies by e-mail and a full history. Where tickets come from Staff create them: Tickets > New (a phone call, a walk-in). Customers send a request themselves on the public page /helpdesk (if switched on) and can follow the ticket, reply, add files and rate the help. Creating a ticket Tickets > New ticket : Type ( Customer request or Internal request ; the type cannot be changed afterwards), Customer (optional, an existing customer or not), Requester name, email, phone , Subject , Description , Category , Priority ( Low, Medium, High, Urgent ) and Assign to . Working a ticket A ticket's page shows its status, priority, category, requester, dates and, if deadlines are on, First reply due and Resolve by , with a colour when late. Conversation : choose Internal note (staff only) or Reply to the customer . A reply is e-mailed to the customer when the ticket has an e-mail address. Insert a saved reply... inserts a ready answer; placeholders are filled from the ticket. Tick Then wait for the customer's answer to set the status to waiting. Wait for customer : pauses the deadline clock until the customer answers. Resolve (with optional Resolution notes ), Close , Reopen . Resolved tickets are closed automatically after the number of days set in settings. Assigned to and Tags (for example billing, vip ). Links : attach an Invoice number or a Job (work order) number to the ticket, and follow the link back and forth. Merge into another ticket... : use it when the same problem was reported twice. The conversation and files move to the ticket you choose, and this one is closed as merged. Files : add pictures, PDFs or text (up to 10 MB each); tick Customer can see to share it on the public ticket page. History : every change, with who and when. The ticket list Filter by status, priority, category, assignee and quick views ( overdue, unassigned, mine ). Tick several tickets for bulk actions such as assigning. Overview Help Desk > Overview shows: Unanswered , Overdue (past a deadline), Due soon , Unassigned , Open / in progress , Mine , last 7 days in and out, On time (30 days) , Avg first reply , Avg time to resolve , Customer rating , tickets by priority and age, Workload per agent ( Active, Overdue, Resolved (30 days) ) and a Needs attention list with the reason. Saved replies Saved replies > New : a Title , the Reply text and an optional Category . Placeholders for the ticket's details are filled in when you insert the reply. Categories Categories group tickets (for example Billing, Technical, Delivery ) for routing and reports. Reports Help Desk > Reports : Help Desk Tickets, Help Desk Deadlines (SLA), Help Desk by Agent, Help Desk by Category, Help Desk Satisfaction, Overdue Help Desk Tickets. Settings (administrator) Public page on/off, notification e-mails, replies by e-mail, deadlines (SLA) by priority, warnings and automatic closing (Administrator Manual, chapter 7). "}, {"id": "user-20-law-firm", "manual": "user", "n": 20, "title": "Law firm", "html": "\n<p>The <strong>Law firm<\/strong> group has: <strong>Overview, Matters,\nClients, Deadlines &amp; tasks, Billing, Fee collections, Client money,\nTemplates, Reports, Settings<\/strong>. Lawyers also have <strong>My\nwork<\/strong> (their own deadlines and tasks) and log hours in\n<strong>My time<\/strong>.<\/p>\n<h2 id=\"clients-and-matters\">Clients and matters<\/h2>\n<p>A <strong>matter<\/strong> is one case or engagement. A client appears\nunder <strong>Clients<\/strong> as soon as a matter is opened for a\ncustomer; clients are ordinary customers, shared with Sales.<\/p>\n<h3 id=\"opening-a-matter\">Opening a matter<\/h3>\n<p><strong>Matters &gt; New matter<\/strong>:<\/p>\n<ul>\n<li><strong>Title<\/strong> (for example <em>Mukamana v. Habimana, land\ndispute<\/em>), <strong>Client<\/strong>, <strong>Lead lawyer<\/strong>\n(default: you).<\/li>\n<li><strong>Practice area<\/strong>, <strong>Jurisdiction<\/strong>,\n<strong>Court or forum<\/strong>, <strong>Court case number<\/strong>,\n<strong>Opened<\/strong> date.<\/li>\n<li><strong>How it is billed<\/strong>: <em>Hourly, Fixed fee, Retainer,\nContingency, Pro bono / legal aid<\/em>, and a <strong>Fee\nagreement<\/strong> in words.<\/li>\n<li><strong>Description<\/strong>.<\/li>\n<li><strong>Restricted: only the team and admins can open this\nmatter<\/strong>. Restricted matters are hidden from everyone else,\nincluding in lists, reports and fee collections.<\/li>\n<\/ul>\n<p><strong>Run the conflict check on the next screen before you start\nwork.<\/strong> The <strong>conflict check<\/strong> searches clients,\ncontacts and the opposing parties, lawyers and witnesses recorded on\nmatters, and logs the search. Record each <strong>party<\/strong> on the\nmatter (name, role, phone, e-mail, ID, note) so the check can see\nthem.<\/p>\n<h3 id=\"on-the-matter\">On the matter<\/h3>\n<p>The matter page has tabs and sections for the <strong>team<\/strong>,\n<strong>deadlines<\/strong>, <strong>tasks<\/strong>,\n<strong>parties<\/strong>, <strong>documents<\/strong>,\n<strong>billing<\/strong>, <strong>client money<\/strong> and\n<strong>papers<\/strong>. Matter status buttons: <strong>Put on hold,\nResume, Close matter<\/strong> (enter the <strong>Outcome<\/strong>, how\nit ended), <strong>Reopen<\/strong>, <strong>Delete<\/strong>. A matter\nthat still holds client money cannot be closed.<\/p>\n<ul>\n<li><strong>Deadlines and tasks<\/strong>: add court dates, filing dates\nand limitation dates so nothing is missed: <strong>What, Type, Date,\nTime, Assigned to<\/strong>, notes. <strong>Done<\/strong>,\n<strong>Reopen<\/strong>, <strong>Edit<\/strong>, <strong>Delete<\/strong>.\nTasks have <strong>Due, Assigned to, Priority<\/strong> (<em>Low, Normal,\nHigh, Urgent<\/em>) and <strong>Start<\/strong>.<\/li>\n<li><strong>Papers<\/strong>: a file cover sheet, an engagement and fee\nletter, and a closing letter. Print them, keep them in the matter's\ndocuments, or e-mail the two letters to the client.<\/li>\n<li><strong>Documents<\/strong>: upload and keep files on the matter; a\nclient portal can share chosen documents.<\/li>\n<\/ul>\n<h2 id=\"deadlines-tasks-and-the-calendar\">Deadlines, tasks and the\ncalendar<\/h2>\n<p><strong>Deadlines &amp; tasks<\/strong> lists everything due, with\nfilters for mine or everyone. The <strong>Calendar<\/strong> shows month\nand week views of deadlines (mine or everyone's), with tasks and\nfinished items on request, and a <strong>calendar file (.ics)<\/strong>\nyou can download into Outlook, Google Calendar or a phone. Lawyers see a\n<strong>daily e-mail<\/strong> of deadlines and tasks due soon or overdue\nif your administrator switched it on.<\/p>\n<div class=\"callout warning\">\n<p><strong>Warning:<\/strong> <strong>Limitation dates<\/strong> are\nspecial. Missing one can lose the case. The lead lawyer and the person\nassigned receive e-mail warnings at the interval set in Law firm\nsettings (first warning, a second 3 days before, and one if the date has\npassed and the deadline is still open). <strong>Mark the deadline as\ndone to stop them.<\/strong><\/p>\n<\/div>\n<h2 id=\"time-and-billing\">Time and billing<\/h2>\n<ul>\n<li>Lawyers log hours in <strong>My time<\/strong> and pick the matter.\nHours on hourly and retainer matters are billed; on other kinds they are\ntracked but not billed.<\/li>\n<li>On a matter's <strong>Billing<\/strong> tab: <strong>Hours logged,\nApproved time to bill, Costs to bill, Fixed-fee stages to bill, Billed\n(before tax), Retainer left<\/strong>. <strong>Fee terms<\/strong> shows\nand lets you change the rate, fixed fee, retainer or contingency %.\n<strong>Rates per person<\/strong> override the matter rate. Approve\nwaiting time (<strong>Approve selected<\/strong> or <strong>Send\nback<\/strong> with a reason).<\/li>\n<li><strong>Costs paid for the client<\/strong> (court and filing fees,\ntravel, courier): record the date, what, paid to, cost, <strong>Charge\nclient<\/strong>, and optionally <strong>Also record in\nExpenses<\/strong>. Charged costs go on the next invoice.<\/li>\n<li><strong>Fixed-fee stages<\/strong> are billed as each stage\ncompletes.<\/li>\n<li>Create the invoice from the matter; <strong>Open the\ninvoice<\/strong> to review and issue it. The <strong>Billing<\/strong>\nmenu shows an overview across matters, and <strong>Law billing and work\nin progress<\/strong> is a report.<\/li>\n<\/ul>\n<h2 id=\"fee-collections\">Fee collections<\/h2>\n<p><strong>Fee collections<\/strong> lists unpaid issued invoices with\ndays late and a \"how late\" table. You can <strong>send reminder\ne-mails<\/strong> (one per client, with the fee statement attached),\nproduce a <strong>PDF statement of fees<\/strong> per client (and e-mail\nit), and export the list. Automatic reminders can be switched on in\nsettings.<\/p>\n<h2 id=\"client-money-trust-account\">Client money (trust account)<\/h2>\n<p>Client money belongs to the client, not the firm, and is kept\nseparately. If it is switched off, an administrator must turn it on in\nLaw firm settings.<\/p>\n<p>On a matter's <strong>Client money<\/strong> tab:<\/p>\n<ul>\n<li><strong>Receive money<\/strong>: <strong>Amount, Date received, How\npaid, Reference, Paid in by, What it is for<\/strong>. A\n<strong>receipt<\/strong> can be printed. <em>Never put the firm's own\nmoney or its fees in the trust account.<\/em><\/li>\n<li><strong>Pay out<\/strong>: <strong>Amount<\/strong> (never more than\nthe client has), <strong>Date<\/strong>, <strong>How paid<\/strong>,\n<strong>Reference<\/strong>, <strong>Paid to<\/strong>, <strong>What it is\nfor<\/strong>. The money leaves <strong>only after another person\napproves<\/strong> (the matter's lead lawyer or an admin): you press\n<strong>Ask for approval<\/strong>. A <strong>payment voucher<\/strong>\ncan be printed.<\/li>\n<li><strong>Pay an invoice from trust<\/strong>: choose the invoice and\namount; it is marked paid and the client's balance goes down when\nanother person approves. A <strong>fee transfer voucher<\/strong> is\nprinted.<\/li>\n<li><strong>Client statement<\/strong>: choose dates, <strong>Print\nstatement<\/strong> or <strong>E-mail to the client<\/strong>.<\/li>\n<\/ul>\n<p><strong>Client money &gt; Overview<\/strong> shows what is held per\nclient and matter and what is waiting to be paid out.\n<strong>Reconcile<\/strong> compares the trust account with the bank\nstatement; a printable sheet exists for any past reconciliation.<\/p>\n<h2 id=\"templates\">Templates<\/h2>\n<p><strong>Templates<\/strong> keep standard letters and documents with\nfields filled from the matter.<\/p>\n<h2 id=\"importing-clients-and-matters\">Importing clients and\nmatters<\/h2>\n<p>An administrator or manager can <strong>Import clients<\/strong> and\n<strong>Import matters<\/strong> from Excel or CSV: download the\ntemplate, choose the file, <strong>Check<\/strong> (nothing is saved),\nthen <strong>Import<\/strong>. Time, deadlines, documents, invoices, fee\namounts and stages are not imported; set the fees on the matter\nafterwards.<\/p>\n<h2 id=\"reports\">Reports<\/h2>\n<p><strong>Law firm &gt; Reports<\/strong> (13): Law matters, Law\ndeadlines, Law billing and work in progress, Law fees billed, Client\nmoney held, Client money ledger, Law workload, Law lawyer productivity,\nLaw matter profitability, Law unpaid invoices by age, Law documents and\nclient portal, Law conflict check log, Law caseload by practice area and\ncourt. Matters, clients, contacts, deadlines, tasks, billing, balances\nand ledger can also be exported from their own lists (restricted matters\nstay hidden from people not on the team).<\/p>\n<h2 id=\"settings-administrator\">Settings (administrator)<\/h2>\n<p>Practice areas and jurisdictions, default billing basis,\nrestricted-by-default, limitation warnings, unpaid fee reminders and the\nclient money switch (Administrator Manual, chapter 7).<\/p>\n", "text": " The Law firm group has: Overview, Matters, Clients, Deadlines & tasks, Billing, Fee collections, Client money, Templates, Reports, Settings . Lawyers also have My work (their own deadlines and tasks) and log hours in My time . Clients and matters A matter is one case or engagement. A client appears under Clients as soon as a matter is opened for a customer; clients are ordinary customers, shared with Sales. Opening a matter Matters > New matter : Title (for example Mukamana v. Habimana, land dispute ), Client , Lead lawyer (default: you). Practice area , Jurisdiction , Court or forum , Court case number , Opened date. How it is billed : Hourly, Fixed fee, Retainer, Contingency, Pro bono / legal aid , and a Fee agreement in words. Description . Restricted: only the team and admins can open this matter . Restricted matters are hidden from everyone else, including in lists, reports and fee collections. Run the conflict check on the next screen before you start work. The conflict check searches clients, contacts and the opposing parties, lawyers and witnesses recorded on matters, and logs the search. Record each party on the matter (name, role, phone, e-mail, ID, note) so the check can see them. On the matter The matter page has tabs and sections for the team , deadlines , tasks , parties , documents , billing , client money and papers . Matter status buttons: Put on hold, Resume, Close matter (enter the Outcome , how it ended), Reopen , Delete . A matter that still holds client money cannot be closed. Deadlines and tasks : add court dates, filing dates and limitation dates so nothing is missed: What, Type, Date, Time, Assigned to , notes. Done , Reopen , Edit , Delete . Tasks have Due, Assigned to, Priority ( Low, Normal, High, Urgent ) and Start . Papers : a file cover sheet, an engagement and fee letter, and a closing letter. Print them, keep them in the matter's documents, or e-mail the two letters to the client. Documents : upload and keep files on the matter; a client portal can share chosen documents. Deadlines, tasks and the calendar Deadlines & tasks lists everything due, with filters for mine or everyone. The Calendar shows month and week views of deadlines (mine or everyone's), with tasks and finished items on request, and a calendar file (.ics) you can download into Outlook, Google Calendar or a phone. Lawyers see a daily e-mail of deadlines and tasks due soon or overdue if your administrator switched it on. Warning: Limitation dates are special. Missing one can lose the case. The lead lawyer and the person assigned receive e-mail warnings at the interval set in Law firm settings (first warning, a second 3 days before, and one if the date has passed and the deadline is still open). Mark the deadline as done to stop them. Time and billing Lawyers log hours in My time and pick the matter. Hours on hourly and retainer matters are billed; on other kinds they are tracked but not billed. On a matter's Billing tab: Hours logged, Approved time to bill, Costs to bill, Fixed-fee stages to bill, Billed (before tax), Retainer left . Fee terms shows and lets you change the rate, fixed fee, retainer or contingency %. Rates per person override the matter rate. Approve waiting time ( Approve selected or Send back with a reason). Costs paid for the client (court and filing fees, travel, courier): record the date, what, paid to, cost, Charge client , and optionally Also record in Expenses . Charged costs go on the next invoice. Fixed-fee stages are billed as each stage completes. Create the invoice from the matter; Open the invoice to review and issue it. The Billing menu shows an overview across matters, and Law billing and work in progress is a report. Fee collections Fee collections lists unpaid issued invoices with days late and a \"how late\" table. You can send reminder e-mails (one per client, with the fee statement attached), produce a PDF statement of fees per client (and e-mail it), and export the list. Automatic reminders can be switched on in settings. Client money (trust account) Client money belongs to the client, not the firm, and is kept separately. If it is switched off, an administrator must turn it on in Law firm settings. On a matter's Client money tab: Receive money : Amount, Date received, How paid, Reference, Paid in by, What it is for . A receipt can be printed. Never put the firm's own money or its fees in the trust account. Pay out : Amount (never more than the client has), Date , How paid , Reference , Paid to , What it is for . The money leaves only after another person approves (the matter's lead lawyer or an admin): you press Ask for approval . A payment voucher can be printed. Pay an invoice from trust : choose the invoice and amount; it is marked paid and the client's balance goes down when another person approves. A fee transfer voucher is printed. Client statement : choose dates, Print statement or E-mail to the client . Client money > Overview shows what is held per client and matter and what is waiting to be paid out. Reconcile compares the trust account with the bank statement; a printable sheet exists for any past reconciliation. Templates Templates keep standard letters and documents with fields filled from the matter. Importing clients and matters An administrator or manager can Import clients and Import matters from Excel or CSV: download the template, choose the file, Check (nothing is saved), then Import . Time, deadlines, documents, invoices, fee amounts and stages are not imported; set the fees on the matter afterwards. Reports Law firm > Reports (13): Law matters, Law deadlines, Law billing and work in progress, Law fees billed, Client money held, Client money ledger, Law workload, Law lawyer productivity, Law matter profitability, Law unpaid invoices by age, Law documents and client portal, Law conflict check log, Law caseload by practice area and court. Matters, clients, contacts, deadlines, tasks, billing, balances and ledger can also be exported from their own lists (restricted matters stay hidden from people not on the team). Settings (administrator) Practice areas and jurisdictions, default billing basis, restricted-by-default, limitation warnings, unpaid fee reminders and the client money switch (Administrator Manual, chapter 7). "}, {"id": "user-21-real-estate-sales-and-brokerage", "manual": "user", "n": 21, "title": "Real estate (sales and\nbrokerage)", "html": "\n<p>The <strong>Real estate<\/strong> group has: <strong>Overview,\nProperties, Leads, My follow-ups, Viewings, Deals, Projects, Unit sales,\nCollections, Commissions, Reports, Settings<\/strong>. It is for agents\nand developers who list properties, work with buyers and tenants, and\nsell units in building projects.<\/p>\n<h2 id=\"the-sales-path\">The sales path<\/h2>\n<p><strong>Property<\/strong> (a listing) and <strong>Lead<\/strong> (a\nperson interested) → <strong>Viewing<\/strong> → <strong>Deal<\/strong>\n(offer, reservation, agreement, commission) → money collected. For a\ndeveloper: <strong>Project<\/strong> → <strong>Units<\/strong> →\n<strong>Unit sale<\/strong> → <strong>Collections<\/strong>.<\/p>\n<h2 id=\"properties\">Properties<\/h2>\n<p><strong>Properties &gt; New property<\/strong>: type, address and\narea, price (sale or rent), size and features, description,\n<strong>photos<\/strong> (several; one is the main image), owner details\nand the <strong>status<\/strong> (for example available, reserved, sold).\nAdd <strong>documents<\/strong> such as title deeds with optional expiry\ndates. A property can have <strong>valuations<\/strong> recorded over\ntime. Print a <strong>flyer with photos<\/strong> for a property.<\/p>\n<h2 id=\"leads\">Leads<\/h2>\n<p><strong>Leads &gt; New lead<\/strong>: contact details, what they want\n(buy, rent, budget, area), the <strong>source<\/strong> and the\n<strong>agent<\/strong>. Each lead has a <strong>diary<\/strong> where\ncalls, visits and notes are logged.<\/p>\n<h3 id=\"my-follow-ups\">My follow-ups<\/h3>\n<p><strong>My follow-ups<\/strong> is the agent's daily list:\n<strong>late, due today, coming up, gone quiet<\/strong> (a lead is\n\"quiet\" after the number of days in settings). Log a call or move the\nlead on; set the <strong>next follow-up date<\/strong>. If switched on,\neach agent gets a <strong>morning e-mail<\/strong> (about 06:30) listing\nlate and due calls and quiet leads.<\/p>\n<h2 id=\"viewings\">Viewings<\/h2>\n<p><strong>Viewings<\/strong> is the diary: schedule a viewing of a\nproperty for a lead, with date, time and agent. A <strong>reminder\ne-mail<\/strong> goes to the client and one list to the agent before the\nviewing (hours ahead set in settings); use <strong>Remind<\/strong> to\nsend one by hand. A <strong>week calendar<\/strong> (Monday to Sunday)\nshows the diary.<\/p>\n<h2 id=\"deals\">Deals<\/h2>\n<p><strong>Deals &gt; New deal<\/strong>: choose the\n<strong>property<\/strong> and the <strong>lead or client<\/strong>, the\ntype (sale or rental), the agreed price, <strong>commission\nshares<\/strong> between agents (staff or outsiders), and the payment\nschedule. Stages run from offer through reservation and agreement to\ncompletion.<\/p>\n<p>Printable documents for a deal: <strong>offer, reservation, sale\nagreement (with the payment schedule), payment list and payment\nreceipt<\/strong>. The wording can be replaced in settings.<\/p>\n<h2 id=\"projects-and-unit-sales-developers\">Projects and unit sales\n(developers)<\/h2>\n<ul>\n<li><strong>Projects<\/strong>: a building or development with its\n<strong>units<\/strong> (type, size, price). <strong>Print a price\nlist<\/strong> for a project.<\/li>\n<li><strong>Unit sales<\/strong>: sell a unit to a buyer with a payment\nschedule (<strong>Unit sales &gt; New<\/strong>). Print the <strong>sale\nagreement, payment list and receipts<\/strong>.<\/li>\n<li><strong>Collections<\/strong>: lists buyers who still owe\n(<strong>late, due soon, no schedule<\/strong>). Log <strong>calls,\npromises to pay and notes<\/strong> on each sold unit, send a\n<strong>reminder e-mail<\/strong> to the buyer, and print or e-mail a\n<strong>buyer statement<\/strong>.<\/li>\n<\/ul>\n<h2 id=\"commissions\">Commissions<\/h2>\n<p><strong>Commissions<\/strong> groups every commission share by person\n(staff or outsider) with its stage: <strong>not earned yet, earned,\nawaiting approval, approved to pay, paid, rejected<\/strong>.\n<strong>Post all earned<\/strong> sends earned commission to\n<strong>Expenses<\/strong>, where it is approved and paid. A <strong>PDF\nstatement<\/strong> per person can be e-mailed to staff. Unit sales have\nno commission shares; this screen covers deals.<\/p>\n<h2 id=\"importing\">Importing<\/h2>\n<p><strong>Import<\/strong> on the <strong>Leads<\/strong> and\n<strong>Properties<\/strong> screens loads Excel or CSV files: download a\ntemplate, choose a file, read the check (nothing is saved), then import.\nEvery skipped row is listed with its spreadsheet row number and reason;\nduplicates are caught.<\/p>\n<h2 id=\"reports\">Reports<\/h2>\n<p><strong>Real estate &gt; Reports<\/strong> (10): listings, leads,\nviewings, deals, commission, projects, price list, unit sales,\nvaluations and documents. Lists also have Excel, PDF and CSV export.<\/p>\n<h2 id=\"settings-administrator\">Settings (administrator)<\/h2>\n<p>Areas, viewing length, quiet-lead days, morning e-mail to agents,\nviewing reminders, and the standard wording of printed documents.<\/p>\n", "text": " The Real estate group has: Overview, Properties, Leads, My follow-ups, Viewings, Deals, Projects, Unit sales, Collections, Commissions, Reports, Settings . It is for agents and developers who list properties, work with buyers and tenants, and sell units in building projects. The sales path Property (a listing) and Lead (a person interested) → Viewing → Deal (offer, reservation, agreement, commission) → money collected. For a developer: Project → Units → Unit sale → Collections . Properties Properties > New property : type, address and area, price (sale or rent), size and features, description, photos (several; one is the main image), owner details and the status (for example available, reserved, sold). Add documents such as title deeds with optional expiry dates. A property can have valuations recorded over time. Print a flyer with photos for a property. Leads Leads > New lead : contact details, what they want (buy, rent, budget, area), the source and the agent . Each lead has a diary where calls, visits and notes are logged. My follow-ups My follow-ups is the agent's daily list: late, due today, coming up, gone quiet (a lead is \"quiet\" after the number of days in settings). Log a call or move the lead on; set the next follow-up date . If switched on, each agent gets a morning e-mail (about 06:30) listing late and due calls and quiet leads. Viewings Viewings is the diary: schedule a viewing of a property for a lead, with date, time and agent. A reminder e-mail goes to the client and one list to the agent before the viewing (hours ahead set in settings); use Remind to send one by hand. A week calendar (Monday to Sunday) shows the diary. Deals Deals > New deal : choose the property and the lead or client , the type (sale or rental), the agreed price, commission shares between agents (staff or outsiders), and the payment schedule. Stages run from offer through reservation and agreement to completion. Printable documents for a deal: offer, reservation, sale agreement (with the payment schedule), payment list and payment receipt . The wording can be replaced in settings. Projects and unit sales (developers) Projects : a building or development with its units (type, size, price). Print a price list for a project. Unit sales : sell a unit to a buyer with a payment schedule ( Unit sales > New ). Print the sale agreement, payment list and receipts . Collections : lists buyers who still owe ( late, due soon, no schedule ). Log calls, promises to pay and notes on each sold unit, send a reminder e-mail to the buyer, and print or e-mail a buyer statement . Commissions Commissions groups every commission share by person (staff or outsider) with its stage: not earned yet, earned, awaiting approval, approved to pay, paid, rejected . Post all earned sends earned commission to Expenses , where it is approved and paid. A PDF statement per person can be e-mailed to staff. Unit sales have no commission shares; this screen covers deals. Importing Import on the Leads and Properties screens loads Excel or CSV files: download a template, choose a file, read the check (nothing is saved), then import. Every skipped row is listed with its spreadsheet row number and reason; duplicates are caught. Reports Real estate > Reports (10): listings, leads, viewings, deals, commission, projects, price list, unit sales, valuations and documents. Lists also have Excel, PDF and CSV export. Settings (administrator) Areas, viewing length, quiet-lead days, morning e-mail to agents, viewing reminders, and the standard wording of printed documents. "}, {"id": "user-22-property-management-rentals", "manual": "user", "n": 22, "title": "Property management (rentals)", "html": "\n<p>The <strong>Property management<\/strong> group has: <strong>Overview,\nProperties, Units, Owners, Tenants, Leases, Rent, Arrears, Deposits,\nCharges, Maintenance, Owner statements, Fee invoices, Reports,\nSettings<\/strong>. It is for agencies that manage rented property for\nowners: collecting rent, paying owners, charging a management fee and\nhandling repairs.<\/p>\n<h2 id=\"the-rental-path\">The rental path<\/h2>\n<p><strong>Owner<\/strong> and <strong>property/units<\/strong> →\n<strong>Tenant<\/strong> → <strong>Lease<\/strong> → monthly\n<strong>Rent<\/strong> invoice → <strong>payment<\/strong> → monthly\n<strong>Owner statement<\/strong> → pay the owner.<\/p>\n<h2 id=\"setting-up\">Setting up<\/h2>\n<ul>\n<li><strong>Owners<\/strong>: the people you manage for (contact, bank\ndetails, fee percentage if different).<\/li>\n<li><strong>Properties<\/strong> and <strong>Units<\/strong>: a property\nhas units (flats, shops). Set the <strong>management fee %<\/strong> on a\nproperty, or leave it so the owner's or the module's default is\nused.<\/li>\n<li><strong>Co-owners<\/strong>: on a property page, the\n<strong>Owners<\/strong> panel shows who owns it. <strong>Change\nowners<\/strong> sets owners and their percentages (they must add up to\n100%) from a date. Rent, management fee and repairs are shared by the\nsplit in force. Each owner gets their own statement and fee invoice. A\nsplit covered by an agreed statement is locked.<\/li>\n<li><strong>Tenants<\/strong> and <strong>Leases<\/strong>: <strong>Leases\n&gt; New<\/strong>: tenant, unit, start and end dates, rent amount and\ndue day, deposit. Attach documents (lease, ID, title deeds) with\noptional expiry dates; an overview card shows lapsing documents.<\/li>\n<\/ul>\n<h2 id=\"rent\">Rent<\/h2>\n<p><strong>Rent<\/strong> lists rent due and received. Rent invoices are\nmade <strong>automatically each morning<\/strong> (the number of days\nbefore the due date is set by an administrator) or by pressing\n<strong>Invoice the rent that is ready<\/strong>. Each invoice goes to\nthe tenant as a customer and is paid in Invoices as usual. A\n<strong>rent receipt<\/strong> (PDF, e-mail) is available for every\npayment.<\/p>\n<ul>\n<li><strong>Tenant account statement<\/strong>: a running account per\ntenant (PDF, e-mail).<\/li>\n<li><strong>Reminders and late fees<\/strong>: a morning job e-mails the\ntenant before the due date and when rent is late. An optional\n<strong>late fee<\/strong> (a percentage with a cap, or a fixed amount)\nis invoiced once per rent, on the rent part only.<\/li>\n<li><strong>Arrears<\/strong>: tenants who are behind, with age and\namounts.<\/li>\n<\/ul>\n<h2 id=\"charges-utilities-and-service-charges\">Charges (utilities and\nservice charges)<\/h2>\n<p><strong>Charges<\/strong> defines <strong>charge types<\/strong> (fixed\nmonthly or metered, for example water, service charge). Add charges to a\nlease, enter <strong>meter readings<\/strong> and one-off charges; they\nbecome lines on the tenant's <strong>rent invoice<\/strong>. The money\nbelongs to the agency: the owner statement counts only the rent part,\nand late fees are worked out on the rent only. Charges are not\ntaxed.<\/p>\n<h2 id=\"deposits-and-inspections\">Deposits and inspections<\/h2>\n<p><strong>Deposits<\/strong> keeps each lease's security deposit as a\nledger of movements: <em>received, kept for rent, kept for damage or\nother reasons, refunded, moved to a renewal<\/em>, and voids. Keeping a\ndeposit for unpaid rent settles the rent invoice for real.\n<strong>Inspections<\/strong> (move-in and move-out): a room list with\nconditions, repair costs and sign-off.<\/p>\n<h2 id=\"maintenance\">Maintenance<\/h2>\n<p><strong>Maintenance<\/strong> logs repair requests with priority,\ncontractor, cost and who pays (owner or agency). Photos and documents\ncan be attached. Repairs the owner pays for appear on the owner's\nstatement, shared by the owners' percentages.<\/p>\n<h2 id=\"owner-statements-and-fee-invoices\">Owner statements and fee\ninvoices<\/h2>\n<ul>\n<li><strong>Owner statements<\/strong>: each month the system prepares a\n<strong>draft statement<\/strong> for every owner who had rent or repairs\nlast month, showing rent received, the management fee (and VAT on it),\nrepairs and the <strong>amount to pay the owner<\/strong>. Review any\nwarnings, then <strong>agree<\/strong> the statement: it is booked to the\naccounts and can be e-mailed to the owner (PDF). To change an agreed\nstatement, <strong>reopen<\/strong> it.<\/li>\n<li><strong>Fee invoices<\/strong>: when a statement is agreed, a\nnumbered <strong>tax invoice for the management fee<\/strong> is made for\nthe owner (a document only; the statement already books the fee and\nVAT). It is voided when the statement is reopened and attached to the\ne-mailed statement.<\/li>\n<li>Statements can be created automatically from a chosen day each\nmonth, and even agreed and e-mailed when they have no warning and the\nowner is to be paid something (a setting).<\/li>\n<\/ul>\n<h2 id=\"overview-and-reports\">Overview and reports<\/h2>\n<p><strong>Overview<\/strong> shows rent collected, arrears, vacancy and\nleases ending soon. <strong>Reports<\/strong> (16): rent roll, vacancy,\nlease expiry, owners, arrears, rent collection, maintenance requests,\nmaintenance cost, owner statements, security deposits, fee invoices,\nutilities and service charges, rent increases due, monthly trend,\nrepairs by contractor, documents. The owner, tenant and lease lists\nexport to Excel, PDF and CSV.<\/p>\n<h2 id=\"settings-administrator\">Settings (administrator)<\/h2>\n<p>Areas, \"lease ending soon\" days, rent due day, usual management fee %\nand VAT on it, rent invoicing, owner statements every month, and tenant\nreminder and late-fee rules.<\/p>\n", "text": " The Property management group has: Overview, Properties, Units, Owners, Tenants, Leases, Rent, Arrears, Deposits, Charges, Maintenance, Owner statements, Fee invoices, Reports, Settings . It is for agencies that manage rented property for owners: collecting rent, paying owners, charging a management fee and handling repairs. The rental path Owner and property/units → Tenant → Lease → monthly Rent invoice → payment → monthly Owner statement → pay the owner. Setting up Owners : the people you manage for (contact, bank details, fee percentage if different). Properties and Units : a property has units (flats, shops). Set the management fee % on a property, or leave it so the owner's or the module's default is used. Co-owners : on a property page, the Owners panel shows who owns it. Change owners sets owners and their percentages (they must add up to 100%) from a date. Rent, management fee and repairs are shared by the split in force. Each owner gets their own statement and fee invoice. A split covered by an agreed statement is locked. Tenants and Leases : Leases > New : tenant, unit, start and end dates, rent amount and due day, deposit. Attach documents (lease, ID, title deeds) with optional expiry dates; an overview card shows lapsing documents. Rent Rent lists rent due and received. Rent invoices are made automatically each morning (the number of days before the due date is set by an administrator) or by pressing Invoice the rent that is ready . Each invoice goes to the tenant as a customer and is paid in Invoices as usual. A rent receipt (PDF, e-mail) is available for every payment. Tenant account statement : a running account per tenant (PDF, e-mail). Reminders and late fees : a morning job e-mails the tenant before the due date and when rent is late. An optional late fee (a percentage with a cap, or a fixed amount) is invoiced once per rent, on the rent part only. Arrears : tenants who are behind, with age and amounts. Charges (utilities and service charges) Charges defines charge types (fixed monthly or metered, for example water, service charge). Add charges to a lease, enter meter readings and one-off charges; they become lines on the tenant's rent invoice . The money belongs to the agency: the owner statement counts only the rent part, and late fees are worked out on the rent only. Charges are not taxed. Deposits and inspections Deposits keeps each lease's security deposit as a ledger of movements: received, kept for rent, kept for damage or other reasons, refunded, moved to a renewal , and voids. Keeping a deposit for unpaid rent settles the rent invoice for real. Inspections (move-in and move-out): a room list with conditions, repair costs and sign-off. Maintenance Maintenance logs repair requests with priority, contractor, cost and who pays (owner or agency). Photos and documents can be attached. Repairs the owner pays for appear on the owner's statement, shared by the owners' percentages. Owner statements and fee invoices Owner statements : each month the system prepares a draft statement for every owner who had rent or repairs last month, showing rent received, the management fee (and VAT on it), repairs and the amount to pay the owner . Review any warnings, then agree the statement: it is booked to the accounts and can be e-mailed to the owner (PDF). To change an agreed statement, reopen it. Fee invoices : when a statement is agreed, a numbered tax invoice for the management fee is made for the owner (a document only; the statement already books the fee and VAT). It is voided when the statement is reopened and attached to the e-mailed statement. Statements can be created automatically from a chosen day each month, and even agreed and e-mailed when they have no warning and the owner is to be paid something (a setting). Overview and reports Overview shows rent collected, arrears, vacancy and leases ending soon. Reports (16): rent roll, vacancy, lease expiry, owners, arrears, rent collection, maintenance requests, maintenance cost, owner statements, security deposits, fee invoices, utilities and service charges, rent increases due, monthly trend, repairs by contractor, documents. The owner, tenant and lease lists export to Excel, PDF and CSV. Settings (administrator) Areas, \"lease ending soon\" days, rent due day, usual management fee % and VAT on it, rent invoicing, owner statements every month, and tenant reminder and late-fee rules. "}, {"id": "user-23-online-store", "manual": "user", "n": 23, "title": "Online Store", "html": "\n<p>The <strong>Online Store<\/strong> module gives your business a public\nshop on the internet at <code>/shop<\/code> (for example\n<code>https://erp.yourbusiness.com/shop<\/code>). When the module is on,\n<code>/shop<\/code> is also the first page a visitor sees at the main\naddress, with a <strong>Staff Login<\/strong> link for your own people.\nCustomers choose products, order for <strong>delivery<\/strong> or\n<strong>pick-up<\/strong>, and pay <strong>in cash<\/strong> or\n<strong>online<\/strong> (mobile money or card, when your administrator\nhas set up a payment provider). You answer each order, and an accepted\norder becomes a normal sale order, invoice and payment, so stock,\naccounting and reports stay in one place.<\/p>\n<p>The module must be in your licence and activated by an administrator\n(Settings &gt; Modules). The <strong>Online Store<\/strong> group then\nappears in the menu with <strong>Online orders<\/strong>, <strong>Online\npayments<\/strong>, <strong>Returns<\/strong>, <strong>Reviews<\/strong>,\n<strong>Newsletter<\/strong>, <strong>Coupons<\/strong>, <strong>Text\nmessages<\/strong>, <strong>Shop settings<\/strong> and <strong>Open the\nshop<\/strong>. Staff need the <strong>Operations<\/strong> area to use\nthem.<\/p>\n<h2 id=\"what-a-visitor-sees-on-the-first-page\">What a visitor sees on\nthe first page<\/h2>\n<p>From top to bottom, the first page of the shop shows:<\/p>\n<ol type=\"1\">\n<li>an <strong>announcement bar<\/strong> (a short message, optionally a\nlink);<\/li>\n<li>the <strong>header<\/strong> with the shop name or logo, a\n<strong>search<\/strong> box, the cart, <strong>Sign in<\/strong> and\n<strong>Staff Login<\/strong>;<\/li>\n<li>the <strong>banner<\/strong>: your pictures sliding one after the\nother, with a title, a text and a button;<\/li>\n<li>four rows of products you choose: <strong>Featured\nproducts<\/strong>, <strong>Best-selling products<\/strong>,\n<strong>Special offers and discounts<\/strong> and <strong>New\narrivals<\/strong>. Each row slides left and right by itself and by the\narrows;<\/li>\n<li><strong>Customer reviews<\/strong> and the shop's average rating\n(real reviews only, see below);<\/li>\n<li>a <strong>newsletter<\/strong> sign-up;<\/li>\n<li>the <strong>footer<\/strong> with quick links, contact details,\nopening hours, an \"about\" text and links to your social pages;<\/li>\n<li>below the rows, <strong>All products<\/strong> with the category\nbuttons.<\/li>\n<\/ol>\n<
