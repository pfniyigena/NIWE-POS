. Choose who each bill is Billed to : the guest, a company with credit enabled, or the group. A company must first be set up for credit under Customers . Room nights here moves the room charges to a particular bill. Reservation chart Reservation chart shows rooms down the side and days across (two weeks, with « and » buttons to move). Green bars are in-house guests, amber are bookings; each bar runs from the arrival day up to, but not including, the departure day. Rooms out of order are marked. Use it to see gaps and move bookings. Housekeeping Housekeeping lists rooms with their status: Dirty, Cleaning, Clean, Inspected , plus Occupied , DND (do not disturb), Vacant and Out of order . Housekeepers press Start cleaning , Clean ; a supervisor marks Inspected . Check-in expects a clean room. Housekeeping also has boards for supplies and for lost and found items. Maintenance Maintenance logs room problems. Enter the Room , the Problem (for example Air conditioner not cooling ), the Priority ( Low, Normal, High, Urgent ) and details. Tick Take the room out of service until fixed and set Out of service from / Back in service on . With dates, only those nights are blocked; with no dates the room is blocked right away until the request is Done . If existing bookings fall inside the blocked dates the screen warns you; move those guests or change dates. Buttons: Start , Done , Reopen , Delete . Guests and the guest register Guests lists guests. Open a guest to see Stays, Lifetime spend, Average per stay, Last stay, Usually books via , and ID documents (passport, national ID, driving licence, visa; upload scans). Mark a guest VIP or Blacklisted . Merge a duplicate into combines two records of the same person: all bookings, groups, lost-and-found items and ID documents move over and the other record is removed. This cannot be undone. Guest register is the official arrivals-and-departures register, with export, for authorities that require it. Rooms, room types and rates (set-up) Room types : name and nightly rate (the standard price). Rooms : room number, type, floor and status. Rates : Seasonal rules change a room type's price for a date range and optionally certain weekdays (a fixed price, a percentage change, or an amount added/taken off; Min nights ; Priority : the rule with the highest priority wins). Rate plans give a discount on top (percent or amount). The Price calendar shows the resulting one-night price per day. Existing bookings keep their price. Company accounts Company accounts lists stays billed to a company at check-out: Company, Billed, Received, Owing, Overdue, Open bills . Open a company, Show bills , and when it pays use Receive money : Amount, Method, Reference (cheque or transfer number), Date . Overdue bills are highlighted. Groups For weddings, conferences and tours. Groups > New : Group name , Arrival , Departure , Contact person , phone, e-mail, Who pays ( Each guest pays their own bill; The group pays the rooms, guests pay extras; The group pays everything ) and an invoice-to customer. Room blocks : hold rooms off general sale ( Room type, Rooms, Group rate / night, From, To , and a Release unbooked rooms on date; unbooked rooms go back on sale then, or Release now ). Add rooms for the group, then Rooming list : paste guest names, one per line, with Put names on rooms . Export the rooming list to Excel, PDF or CSV. Statement shows what the group owes. Confirm , Complete or Cancel group (cancels every room that has not arrived; you can waive cancellation fees). Online booking If the hotel's public booking page is on, guests choose room types and dates and book online. Bookings arrive in Bookings with source Website . An administrator sets the page's text and rules under Online booking . Night audit At the night audit time set in Hotel settings, the system posts each night's room charge to accounting. The Night audit report checks the hotel's cash, revenue, tax, deposits, city ledger and group ledger against Accounting, and is the manager's end-of-day check. Reports Hotel > Reports : the Daily report; Occupancy with Room nights sold, Room nights available, Room revenue, ADR (average daily rate) and RevPAR (revenue per available room); Revenue by booking source ; Forecast and pick-up ; and the Night audit . Choose Last 7 days, Last 30 days or This month , or enter dates. All export to Excel, PDF and CSV. "}, {"id": "user-9-manufacturing", "manual": "user", "n": 9, "title": "Manufacturing", "html": "\n<p>The <strong>Manufacturing<\/strong> group has: <strong>Bill of\nmaterials, Production plans, Manufacturing orders, Workstations,\nRoutings, Indirect costs, Reports<\/strong>.<\/p>\n<h2 id=\"how-production-works\">How production works<\/h2>\n<p>A <strong>bill of materials (BOM)<\/strong> is the recipe for one\nfinished product. A <strong>manufacturing order<\/strong> says \"make this\nmany\". When you <strong>record production<\/strong>, the components are\ntaken out of stock, the finished goods are added to stock, and the cost\nof making them is worked out from materials, labour, machine time and\nindirect costs.<\/p>\n<h2 id=\"set-up-once\">Set-up (once)<\/h2>\n<h3 id=\"workstations\">Workstations<\/h3>\n<p><strong>Workstations &gt; New<\/strong>: a <strong>Code<\/strong>\n(cannot change later), <strong>Name<\/strong>,\n<strong>Description<\/strong>, and an <strong>Hourly rate<\/strong>: the\noperating cost of that machine or work area per hour.<\/p>\n<h3 id=\"routings\">Routings<\/h3>\n<p>A routing lists the steps (operations) to make a product.\n<strong>Routings &gt; New<\/strong>: <strong>Name<\/strong>,\n<strong>Description<\/strong>, then <strong>+ Add operation<\/strong> for\neach step: <strong>Seq<\/strong> (order), <strong>Operation name<\/strong>\n(for example Cut, Assemble, Paint, Pack), <strong>Workstation<\/strong>,\n<strong>Est. minutes/unit<\/strong> and <strong>Labour rate /\nhour<\/strong>. At least one operation is needed.<\/p>\n<h3 id=\"indirect-costs\">Indirect costs<\/h3>\n<p>Overheads such as rent share and power. <strong>Indirect costs &gt;\nNew<\/strong>: <strong>Code<\/strong>, <strong>Name<\/strong>,\n<strong>Allocation method<\/strong> and <strong>Rate<\/strong>:<\/p>\n<ul>\n<li><em>Flat<\/em>: a fixed total spread over the order's runs in\nproportion to quantity.<\/li>\n<li><em>Per unit produced<\/em>: the rate for every unit produced.<\/li>\n<li><em>Percent of material cost<\/em>: a percentage of each run's\nmaterial cost.<\/li>\n<\/ul>\n<h3 id=\"bill-of-materials\">Bill of materials<\/h3>\n<p><strong>Bill of materials &gt; New<\/strong>:<\/p>\n<ol type=\"1\">\n<li><strong>Finished-good product<\/strong>: the product this BOM makes\n(cannot be changed after creation).<\/li>\n<li>Optionally a <strong>Name<\/strong> (for example <em>Standard<\/em>,\n<em>Alt, no walnut<\/em>; a product can have several BOMs) and a\n<strong>Routing<\/strong>.<\/li>\n<li><strong>Components<\/strong>: search a product and set\n<strong>Quantity per unit<\/strong>: how many of that component it takes\nto make exactly <strong>one<\/strong> unit of the finished good.<\/li>\n<li>The screen shows the <strong>Cost of one unit (today's\nprices)<\/strong>: <em>Components, Labour, Machines, Cost per unit, After\nby-products, Selling price, Margin<\/em>. Indirect costs are added per\norder and are not included here. Save to refresh after editing.<\/li>\n<li><strong>By-products<\/strong> (optional): bran, offcuts, whey. Each\ngood unit also puts the stated quantity of the by-product into stock,\nand a <strong>Share of the cost (%)<\/strong> is taken off the finished\ngood's unit cost.<\/li>\n<li>Tick <strong>Active<\/strong> and <strong>Save<\/strong>.<\/li>\n<\/ol>\n<h2 id=\"production-plans\">Production plans<\/h2>\n<p><strong>Production plans<\/strong> suggest what to make. A plan looks\nat <strong>sales<\/strong> and <strong>low stock<\/strong> and lists, for\neach product, the <strong>Bill of materials<\/strong>, the quantities\n<strong>From sales<\/strong> and <strong>From low stock<\/strong>, the\n<strong>Suggested qty<\/strong> and any <strong>Component\nshortfalls<\/strong>. Press <strong>Generate order<\/strong> on a line to\nopen <strong>Generate manufacturing order<\/strong>: confirm\n<strong>Quantity<\/strong>, optional <strong>Scheduled date<\/strong> and\nindirect costs, and press <strong>Create manufacturing\norder<\/strong>.<\/p>\n<h2 id=\"manufacturing-orders\">Manufacturing orders<\/h2>\n<h3 id=\"create\">Create<\/h3>\n<p><strong>Manufacturing orders &gt; New<\/strong>: choose the\n<strong>Bill of materials<\/strong>, the <strong>Planned\nquantity<\/strong>, an optional <strong>Scheduled date<\/strong>,\n<strong>Produce at<\/strong> (the location where components are consumed\nand finished goods added), a <strong>Note<\/strong>, and any\n<strong>Indirect costs to apply<\/strong>. Orders are numbered\n<em>MO-0001<\/em>, <em>MO-0002<\/em>...<\/p>\n<h3 id=\"confirm\">Confirm<\/h3>\n<p>An order starts as a draft. <strong>Confirm<\/strong> fixes the\nrecipe, indirect costs and location; afterwards only the planned\nquantity, date and note can change. <strong>Copy as new draft<\/strong>\nrepeats an order. <strong>Cancel order<\/strong> abandons it.\n<strong>Print job card<\/strong> gives the shop floor a sheet with the\nsteps.<\/p>\n<h3 id=\"see-what-you-need\">See what you need<\/h3>\n<p>The order shows <strong>Components for the ... still to\nmake<\/strong>: <em>Per unit, Needed, On hand, Short by<\/em>. It tells\nyou if stock is short (\"Negative stock is allowed, so production will\nstill go through\" if your business allows it).<\/p>\n<h3 id=\"record-production\">Record production<\/h3>\n<p>Press <strong>Record production<\/strong>:<\/p>\n<ul>\n<li><strong>Quantity to produce now<\/strong> (the remaining quantity is\nshown). <strong>Use what stock allows<\/strong> fills in the most you can\nmake today.<\/li>\n<li><strong>Scrapped / rejected units<\/strong> and a\n<strong>Reason<\/strong> (burnt, wrong size, failed check).<\/li>\n<li>Optionally the <strong>Actual quantity used<\/strong> of components\n(otherwise the recipe's quantity is used) and <strong>Actual minutes\ntaken<\/strong>.<\/li>\n<\/ul>\n<p>You can record production in several runs. Each run moves stock and\nposts the cost. The order shows <strong>Produced, Scrapped, Yield %,\nTotal material / overhead / labour / machine cost, Total cost,\nBy-product credit<\/strong> and <strong>Unit cost<\/strong>, compared with\nthe <strong>Planned cost<\/strong>.<\/p>\n<h2 id=\"reports\">Reports<\/h2>\n<p><strong>Manufacturing &gt; Reports<\/strong>: <strong>Production runs,\nCost per product, Component use against recipe, Workstation time and\ncost, Scrap and rejects, Orders: plan against actual.<\/strong> Export to\nExcel, PDF and CSV. <em>Component use against recipe<\/em> and\n<em>Orders: plan against actual<\/em> show where waste and overruns\nhappen.<\/p>\n", "text": " The Manufacturing group has: Bill of materials, Production plans, Manufacturing orders, Workstations, Routings, Indirect costs, Reports . How production works A bill of materials (BOM) is the recipe for one finished product. A manufacturing order says \"make this many\". When you record production , the components are taken out of stock, the finished goods are added to stock, and the cost of making them is worked out from materials, labour, machine time and indirect costs. Set-up (once) Workstations Workstations > New : a Code (cannot change later), Name , Description , and an Hourly rate : the operating cost of that machine or work area per hour. Routings A routing lists the steps (operations) to make a product. Routings > New : Name , Description , then + Add operation for each step: Seq (order), Operation name (for example Cut, Assemble, Paint, Pack), Workstation , Est. minutes/unit and Labour rate / hour . At least one operation is needed. Indirect costs Overheads such as rent share and power. Indirect costs > New : Code , Name , Allocation method and Rate : Flat : a fixed total spread over the order's runs in proportion to quantity. Per unit produced : the rate for every unit produced. Percent of material cost : a percentage of each run's material cost. Bill of materials Bill of materials > New : Finished-good product : the product this BOM makes (cannot be changed after creation). Optionally a Name (for example Standard , Alt, no walnut ; a product can have several BOMs) and a Routing . Components : search a product and set Quantity per unit : how many of that component it takes to make exactly one unit of the finished good. The screen shows the Cost of one unit (today's prices) : Components, Labour, Machines, Cost per unit, After by-products, Selling price, Margin . Indirect costs are added per order and are not included here. Save to refresh after editing. By-products (optional): bran, offcuts, whey. Each good unit also puts the stated quantity of the by-product into stock, and a Share of the cost (%) is taken off the finished good's unit cost. Tick Active and Save . Production plans Production plans suggest what to make. A plan looks at sales and low stock and lists, for each product, the Bill of materials , the quantities From sales and From low stock , the Suggested qty and any Component shortfalls . Press Generate order on a line to open Generate manufacturing order : confirm Quantity , optional Scheduled date and indirect costs, and press Create manufacturing order . Manufacturing orders Create Manufacturing orders > New : choose the Bill of materials , the Planned quantity , an optional Scheduled date , Produce at (the location where components are consumed and finished goods added), a Note , and any Indirect costs to apply . Orders are numbered MO-0001 , MO-0002 ... Confirm An order starts as a draft. Confirm fixes the recipe, indirect costs and location; afterwards only the planned quantity, date and note can change. Copy as new draft repeats an order. Cancel order abandons it. Print job card gives the shop floor a sheet with the steps. See what you need The order shows Components for the ... still to make : Per unit, Needed, On hand, Short by . It tells you if stock is short (\"Negative stock is allowed, so production will still go through\" if your business allows it). Record production Press Record production : Quantity to produce now (the remaining quantity is shown). Use what stock allows fills in the most you can make today. Scrapped / rejected units and a Reason (burnt, wrong size, failed check). Optionally the Actual quantity used of components (otherwise the recipe's quantity is used) and Actual minutes taken . You can record production in several runs. Each run moves stock and posts the cost. The order shows Produced, Scrapped, Yield %, Total material / overhead / labour / machine cost, Total cost, By-product credit and Unit cost , compared with the Planned cost . Reports Manufacturing > Reports : Production runs, Cost per product, Component use against recipe, Workstation time and cost, Scrap and rejects, Orders: plan against actual. Export to Excel, PDF and CSV. Component use against recipe and Orders: plan against actual show where waste and overruns happen. "}, {"id": "user-10-accounting", "manual": "user", "n": 10, "title": "Accounting", "html": "\n<p><strong>Accounting<\/strong> is the ledger that every other module\nposts to. The group has: <strong>Chart of accounts, Cost centers,\nJournal entries, Controls, Incomes, Reports<\/strong>, and, when the\nExpenses module is used, the Expenses pages (next chapter).<\/p>\n<div class=\"callout note\">\n<p><strong>Note:<\/strong> Most entries are posted\n<strong>automatically<\/strong>: a sale posts revenue, tax and stock\ncost; a purchase posts stock and payables; payroll, depreciation, hotel\nnight audit and so on post by themselves. Manual journal entries are for\nthe exceptions. Setting up the chart of accounts and the controls is\ndescribed in the Administrator Manual (chapter 6).<\/p>\n<\/div>\n<h2 id=\"chart-of-accounts\">Chart of accounts<\/h2>\n<p><strong>Accounting &gt; Chart of accounts<\/strong> lists accounts\n(Code, Name, Description, Status). Accounts marked <em>system<\/em> are\nposted to automatically and cannot be deactivated.<\/p>\n<p><strong>New account<\/strong>: <strong>Code<\/strong> (cannot be\nchanged later; for example 5300), <strong>Name<\/strong> (Rent Expense),\n<strong>Type<\/strong> (<em>Asset, Liability, Equity, Revenue,\nExpense<\/em>), <strong>Description<\/strong>, <strong>Active<\/strong>.\nPress <strong>Ledger<\/strong> on an account to see every transaction on\nit between two dates, with a running <strong>Balance<\/strong>.<\/p>\n<h2 id=\"cost-centers\">Cost centers<\/h2>\n<p><strong>Cost centers<\/strong> are tags (department, branch, project)\nthat journal lines, expenses and incomes can carry, so that you can\nreport cost by center. <strong>New cost center<\/strong>: Code, Name. Use\n<em>Inactive<\/em> to retire one.<\/p>\n<h2 id=\"journal-entries\">Journal entries<\/h2>\n<p><strong>Journal entries &gt; New manual journal entry<\/strong>:<\/p>\n<ol type=\"1\">\n<li><strong>Date<\/strong> and <strong>Memo<\/strong> (for example\n<em>Owner contribution<\/em> or <em>March rent<\/em>).<\/li>\n<li>For each line choose the <strong>Account<\/strong>, a\n<strong>Description<\/strong>, an optional <strong>Cost center<\/strong>,\nand a <strong>Debit<\/strong> or a <strong>Credit<\/strong>. <strong>+ Add\nline<\/strong> adds more.<\/li>\n<li><strong>Debits and credits must add up to the same total<\/strong>\nbefore you can save; the screen shows the totals.<\/li>\n<li><strong>Save<\/strong>.<\/li>\n<\/ol>\n<p>The list shows entries from every module as well as manual ones; open\none to see its lines and its source.<\/p>\n<div class=\"callout warning\">\n<p><strong>Warning:<\/strong> Posted entries are not edited. To correct a\nmistake, enter a reversing entry or void the source document. If the\nbooks are closed up to a date, you cannot record anything on or before\nthat date.<\/p>\n<\/div>\n<h2 id=\"incomes-money-received-that-is-not-a-sale\">Incomes (money\nreceived that is not a sale)<\/h2>\n<p><strong>Incomes &gt; New income<\/strong>: <strong>Date<\/strong>,\n<strong>Category<\/strong> (a revenue-type account; add <em>Other\nIncome<\/em> in the chart first if needed), <strong>Received\nfrom<\/strong> (<em>Customer, Vendor (supplier), Staff, Other /\none-off<\/em>), the person or <strong>Payer name<\/strong>,\n<strong>Amount<\/strong>, <strong>Received immediately (into\nCash)<\/strong> (if unticked it is posted as money still owed to the\nstore), optional cost center, branch and memo.<\/p>\n<h2 id=\"controls-accountant-and-administrator\">Controls (accountant and\nadministrator)<\/h2>\n<p><strong>Accounting &gt; Controls<\/strong> has three tabs:<\/p>\n<ul>\n<li><strong>Close the books<\/strong>: close the books up to a date once\na period is final (for example after the March accounts are approved).\nNothing dated on or before that day can then be recorded: invoices,\nbills, expenses, journals, imports. Voiding or correcting still works\nbecause it is recorded today. Enter the date and <strong>Why<\/strong>.\n<strong>Only an admin can close or reopen the books<\/strong>, and every\nchange is logged with the reason and who did it.<\/li>\n<li><strong>Bank reconciliation<\/strong>: <strong>Start a\nreconciliation<\/strong> by choosing the account, the <strong>Statement\ndate<\/strong> and the <strong>Ending balance on the statement<\/strong>.\nTick the ledger lines that appear on your bank or mobile-money\nstatement; the screen shows <strong>Statement balance, Matched so far,\nDifference<\/strong>. When the difference is zero, save and complete it.\n<strong>Undo<\/strong> reverses a reconciliation. The system records all\ncash, bank and mobile money in one account called <em>Cash and\nBank<\/em>; to reconcile a bank separately, add it as an asset account\nand move money to it with a journal entry.<\/li>\n<li><strong>Opening balances<\/strong>: enter the balances of accounts\nwhen you start part-way through a year.<\/li>\n<\/ul>\n<h2 id=\"reports\">Reports<\/h2>\n<p><strong>Accounting &gt; Reports<\/strong> is a menu of reports. All\ncan be exported to Excel and PDF.<\/p>\n<div class=\"tablewrap\"><table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Group<\/th>\n<th>Reports<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>Accounting Reports<\/strong><\/td>\n<td>Tax Report, Tax Declaration, Income Statement, Balance Sheet, Profit\n&amp; Loss, Financial Transactions, Cash Flow Report, Assets<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Journals Reports<\/strong><\/td>\n<td>General Ledger (with opening and closing balance per account), Trial\nBalance &amp; Nets, Trial Balance, Trial Nets, Ledger, Cost Centers,\nJournals Report, Chart of Accounts Directory<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Expenses Reports<\/strong><\/td>\n<td>Expenses by Category, by Vendor, by Staff, by Client, Daily, Weekly,\nMonthly and Yearly Expenses<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Choose the <strong>From<\/strong> and <strong>To<\/strong> dates. For\nthe <strong>Trial Balance<\/strong>, click a line to see the entries\nbehind it. The <strong>Balance Sheet<\/strong> and <strong>Income\nStatement<\/strong> use the whole ledger to the end date.<\/p>\n<div class=\"callout tip\">\n<p><strong>Tip:<\/strong> Each month: review the trial balance, reconcile\ncash and bank, run the tax report, then <strong>Close the books<\/strong>\nup to the month end.<\/p>\n<\/div>\n", "text": " Accounting is the ledger that every other module posts to. The group has: Chart of accounts, Cost centers, Journal entries, Controls, Incomes, Reports , and, when the Expenses module is used, the Expenses pages (next chapter). Note: Most entries are posted automatically : a sale posts revenue, tax and stock cost; a purchase posts stock and payables; payroll, depreciation, hotel night audit and so on post by themselves. Manual journal entries are for the exceptions. Setting up the chart of accounts and the controls is described in the Administrator Manual (chapter 6). Chart of accounts Accounting > Chart of accounts lists accounts (Code, Name, Description, Status). Accounts marked system are posted to automatically and cannot be deactivated. New account : Code (cannot be changed later; for example 5300), Name (Rent Expense), Type ( Asset, Liability, Equity, Revenue, Expense ), Description , Active . Press Ledger on an account to see every transaction on it between two dates, with a running Balance . Cost centers Cost centers are tags (department, branch, project) that journal lines, expenses and incomes can carry, so that you can report cost by center. New cost center : Code, Name. Use Inactive to retire one. Journal entries Journal entries > New manual journal entry : Date and Memo (for example Owner contribution or March rent ). For each line choose the Account , a Description , an optional Cost center , and a Debit or a Credit . + Add line adds more. Debits and credits must add up to the same total before you can save; the screen shows the totals. Save . The list shows entries from every module as well as manual ones; open one to see its lines and its source. Warning: Posted entries are not edited. To correct a mistake, enter a reversing entry or void the source document. If the books are closed up to a date, you cannot record anything on or before that date. Incomes (money received that is not a sale) Incomes > New income : Date , Category (a revenue-type account; add Other Income in the chart first if needed), Received from ( Customer, Vendor (supplier), Staff, Other / one-off ), the person or Payer name , Amount , Received immediately (into Cash) (if unticked it is posted as money still owed to the store), optional cost center, branch and memo. Controls (accountant and administrator) Accounting > Controls has three tabs: Close the books : close the books up to a date once a period is final (for example after the March accounts are approved). Nothing dated on or before that day can then be recorded: invoices, bills, expenses, journals, imports. Voiding or correcting still works because it is recorded today. Enter the date and Why . Only an admin can close or reopen the books , and every change is logged with the reason and who did it. Bank reconciliation : Start a reconciliation by choosing the account, the Statement date and the Ending balance on the statement . Tick the ledger lines that appear on your bank or mobile-money statement; the screen shows Statement balance, Matched so far, Difference . When the difference is zero, save and complete it. Undo reverses a reconciliation. The system records all cash, bank and mobile money in one account called Cash and Bank ; to reconcile a bank separately, add it as an asset account and move money to it with a journal entry. Opening balances : enter the balances of accounts when you start part-way through a year. Reports Accounting > Reports is a menu of reports. All can be exported to Excel and PDF. Group Reports Accounting Reports Tax Report, Tax Declaration, Income Statement, Balance Sheet, Profit & Loss, Financial Transactions, Cash Flow Report, Assets Journals Reports General Ledger (with opening and closing balance per account), Trial Balance & Nets, Trial Balance, Trial Nets, Ledger, Cost Centers, Journals Report, Chart of Accounts Directory Expenses Reports Expenses by Category, by Vendor, by Staff, by Client, Daily, Weekly, Monthly and Yearly Expenses Choose the From and To dates. For the Trial Balance , click a line to see the entries behind it. The Balance Sheet and Income Statement use the whole ledger to the end date. Tip: Each month: review the trial balance, reconcile cash and bank, run the tax report, then Close the books up to the month end. "}, {"id": "user-11-expenses", "manual": "user", "n": 11, "title": "Expenses", "html": "\n<p>The <strong>Expenses<\/strong> group (under Accounting) has:\n<strong>Overview, Expenses, Budgets, Recurring expenses, Reports,\nSettings<\/strong>. It records money the business spends outside purchase\norders: rent, utilities, transport, repairs, fees.<\/p>\n<h2 id=\"the-expense-path\">The expense path<\/h2>\n<p><strong>Enter<\/strong> the expense → <strong>Approve<\/strong> (if\napprovals apply) → <strong>Pay<\/strong> (now, or later if it is a bill)\n→ reports.<\/p>\n<h2 id=\"entering-an-expense\">Entering an expense<\/h2>\n<p><strong>Expenses &gt; New expense<\/strong>:<\/p>\n<div class=\"tablewrap\"><table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Field<\/th>\n<th>What to enter<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>Date<\/strong> and <strong>Category<\/strong><\/td>\n<td>Choose an <em>expense account<\/em> (add one in the chart of accounts\nfirst if needed).<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Paid to<\/strong><\/td>\n<td><em>Vendor (supplier), Staff, Customer, Other / one-off<\/em>, then\nthe supplier, staff member or customer, or a <strong>Payee name<\/strong>\n(for example City Water Authority).<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Total amount (including any VAT)<\/strong><\/td>\n<td>What was paid, VAT included.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>VAT included in the total (optional)<\/strong><\/td>\n<td>Enter the VAT, or type a <strong>%<\/strong> and press\n<strong>Calculate<\/strong>. Enter <strong>only VAT you can claim\nback<\/strong>. It is kept in its own account, so the category carries\nonly the cost without VAT.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Reference<\/strong><\/td>\n<td>Supplier invoice or receipt number.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Paid immediately<\/strong><\/td>\n<td>Tick it and choose the account it was <strong>paid from<\/strong>\n(Cash, a bank or a mobile-money account). If unticked, the expense is a\n<strong>bill owed to the payee<\/strong> that you can pay later, in full\nor in parts. Set a <strong>Due date<\/strong>; if empty it comes from the\ndays set in Expenses settings.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Branch, Cost center, Memo<\/strong><\/td>\n<td>Optional tags and notes.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Receipts and bills<\/strong><\/td>\n<td>Attach photos, PDFs or text files, up to 10 MB each. More files can\nbe added later on the expense page.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Every expense gets a <strong>number<\/strong>. Press\n<strong>Save<\/strong>.<\/p>\n<h2 id=\"approval\">Approval<\/h2>\n<p>Depending on settings, a new expense is <strong>Pending<\/strong>\nuntil approved.<\/p>\n<ul>\n<li>A person with the <em>Approve/reject Expenses<\/em> right presses\n<strong>Approve<\/strong> or <strong>Reject<\/strong> (with a reason).\nThey may also <strong>Void<\/strong> an approved one.<\/li>\n<li>Expenses <strong>above the approval limit<\/strong> need an\nadministrator or someone with <em>Approve large Expenses<\/em>.<\/li>\n<li>The settings may stop you approving an expense you entered yourself,\nand may block approval when it would go <strong>over the monthly\nbudget<\/strong> (an administrator can still use <strong>Approve anyway\n(over budget)<\/strong>; the override is written to the history).<\/li>\n<li>A pending or rejected expense can be <strong>deleted<\/strong>; an\napproved one can only be voided.<\/li>\n<\/ul>\n<h2 id=\"the-expenses-list\">The expenses list<\/h2>\n<p>Filters: search (payee, memo, number, reference), status\n(<em>Pending, Approved, Rejected, Voided<\/em>), category, dates, amount\nrange, branch. Quick views include <em>overdue<\/em> and <em>due\nsoon<\/em> bills. Tick several lines to <strong>Approve selected<\/strong>\nor <strong>Reject selected<\/strong> at once. Columns show\n<strong>Number, Date, Payee, Category, Amount<\/strong> (with VAT),\n<strong>Payment<\/strong> (<em>Paid, Settled, Unpaid, Part paid<\/em> and\n<em>Overdue / Due soon<\/em>), <strong>Approval<\/strong>, and a paperclip\nfor attachments. <strong>Excel<\/strong> and <strong>PDF<\/strong> export\nthe filtered list.<\/p>\n<h2 id=\"paying-a-bill\">Paying a bill<\/h2>\n<p>Open an unpaid or part-paid expense and use <strong>Pay this\nbill<\/strong>: <strong>Amount<\/strong>, <strong>Date<\/strong>,\n<strong>Paid from<\/strong> (the account), <strong>Note<\/strong>. Paying\nless than the amount owed leaves the rest open.\n<strong>Payments<\/strong> lists each payment, and <strong>Files<\/strong>\nand <strong>History<\/strong> show attachments and every change.<\/p>\n<h2 id=\"budgets\">Budgets<\/h2>\n<p><strong>Budgets<\/strong>: set a <strong>Monthly budget<\/strong> for\nan <strong>expense category<\/strong> or a <strong>cost center<\/strong>,\nfor a chosen year and month. The screen shows <strong>Spent<\/strong>\n(approved expenses dated in the month, without recoverable VAT),\n<strong>Waiting for approval<\/strong> (not counted yet),\n<strong>Left<\/strong> and <strong>Used %<\/strong>. Use\n<strong>Change<\/strong> or <strong>Remove<\/strong>. To enforce budgets,\nan administrator turns on <em>Block approval when it would go over the\nmonthly budget<\/em>.<\/p>\n<h2 id=\"recurring-expenses\">Recurring expenses<\/h2>\n<p>For regular costs such as rent. <strong>Recurring expenses &gt;\nNew<\/strong>: <strong>Name<\/strong>, <strong>Category<\/strong>,\n<strong>Paid to<\/strong>, <strong>Amount<\/strong>, <strong>Paid\nimmediately (from Cash)<\/strong> (otherwise each generated expense is a\nbill), cost center, memo, <strong>Frequency<\/strong> (<em>Weekly,\nMonthly<\/em>), <strong>Next run date<\/strong>, <strong>Active<\/strong>.\nA daily job creates the next expense on or after that date and moves the\ndate forward. Generated expenses are marked <em>Auto-generated by a\nrecurring expense template<\/em> and go through approval like any\nother.<\/p>\n<h2 id=\"overview\">Overview<\/h2>\n<p><strong>Expenses &gt; Overview<\/strong> gives a summary: <strong>This\nmonth / Last month / This year<\/strong>, <strong>VAT to claim back (this\nmonth)<\/strong>, <strong>Awaiting approval<\/strong>, <strong>Unpaid\nbills<\/strong>, <strong>Overdue<\/strong>, <strong>Due soon<\/strong>, the\nlast six months, <strong>Top categories<\/strong> and <strong>Top\nvendors<\/strong>, <strong>Paid out this month, by account<\/strong>,\n<strong>Budgets near or over the limit<\/strong> and <strong>Bills that\nneed attention<\/strong>. Click a figure to open the matching list.<\/p>\n<h2 id=\"reports\">Reports<\/h2>\n<p><strong>Expenses &gt; Reports<\/strong> (four reports):\n<strong>Expense Register<\/strong>, <strong>Unpaid Bills by Age<\/strong>,\n<strong>Budget vs Actual<\/strong> and <strong>Expenses by Payment\nAccount<\/strong>. Expenses by category, vendor, staff and period are\nunder <strong>Accounting &gt; Reports<\/strong>.<\/p>\n<h2 id=\"settings-administrator\">Settings (administrator)<\/h2>\n<p>Approval limit, the \"not your own expense\" rule, blocking approval\nover budget, days until a bill is due and the warning days before the\ndue date. See the Administrator Manual, chapter 7.<\/p>\n", "text": " The Expenses group (under Accounting) has: Overview, Expenses, Budgets, Recurring expenses, Reports, Settings . It records money the business spends outside purchase orders: rent, utilities, transport, repairs, fees. The expense path Enter the expense → Approve (if approvals apply) → Pay (now, or later if it is a bill) → reports. Entering an expense Expenses > New expense : Field What to enter Date and Category Choose an expense account (add one in the chart of accounts first if needed). Paid to Vendor (supplier), Staff, Customer, Other / one-off , then the supplier, staff member or customer, or a Payee name (for example City Water Authority). Total amount (including any VAT) What was paid, VAT included. VAT included in the total (optional) Enter the VAT, or type a % and press Calculate . Enter only VAT you can claim back . It is kept in its own account, so the category carries only the cost without VAT. Reference Supplier invoice or receipt number. Paid immediately Tick it and choose the account it was paid from (Cash, a bank or a mobile-money account). If unticked, the expense is a bill owed to the payee that you can pay later, in full or in parts. Set a Due date ; if empty it comes from the days set in Expenses settings. Branch, Cost center, Memo Optional tags and notes. Receipts and bills Attach photos, PDFs or text files, up to 10 MB each. More files can be added later on the expense page. Every expense gets a number . Press Save . Approval Depending on settings, a new expense is Pending until approved. A person with the Approve/reject Expenses right presses Approve or Reject (with a reason). They may also Void an approved one. Expenses above the approval limit need an administrator or someone with Approve large Expenses . The settings may stop you approving an expense you entered yourself, and may block approval when it would go over the monthly budget (an administrator can still use Approve anyway (over budget) ; the override is written to the history). A pending or rejected expense can be deleted ; an approved one can only be voided. The expenses list Filters: search (payee, memo, number, reference), status ( Pending, Approved, Rejected, Voided ), category, dates, amount range, branch. Quick views include overdue and due soon bills. Tick several lines to Approve selected or Reject selected at once. Columns show Number, Date, Payee, Category, Amount (with VAT), Payment ( Paid, Settled, Unpaid, Part paid and Overdue / Due soon ), Approval , and a paperclip for attachments. Excel and PDF export the filtered list. Paying a bill Open an unpaid or part-paid expense and use Pay this bill : Amount , Date , Paid from (the account), Note . Paying less than the amount owed leaves the rest open. Payments lists each payment, and Files and History show attachments and every change. Budgets Budgets : set a Monthly budget for an expense category or a cost center , for a chosen year and month. The screen shows Spent (approved expenses dated in the month, without recoverable VAT), Waiting for approval (not counted yet), Left and Used % . Use Change or Remove . To enforce budgets, an administrator turns on Block approval when it would go over the monthly budget . Recurring expenses For regular costs such as rent. Recurring expenses > New : Name , Category , Paid to , Amount , Paid immediately (from Cash) (otherwise each generated expense is a bill), cost center, memo, Frequency ( Weekly, Monthly ), Next run date , Active . A daily job creates the next expense on or after that date and moves the date forward. Generated expenses are marked Auto-generated by a recurring expense template and go through approval like any other. Overview Expenses > Overview gives a summary: This month / Last month / This year , VAT to claim back (this month) , Awaiting approval , Unpaid bills , Overdue , Due soon , the last six months, Top categories and Top vendors , Paid out this month, by account , Budgets near or over the limit and Bills that need attention . Click a figure to open the matching list. Reports Expenses > Reports (four reports): Expense Register , Unpaid Bills by Age , Budget vs Actual and Expenses by Payment Account . Expenses by category, vendor, staff and period are under Accounting > Reports . Settings (administrator) Approval limit, the \"not your own expense\" rule, blocking approval over budget, days until a bill is due and the warning days before the due date. See the Administrator Manual, chapter 7. "}, {"id": "user-12-assets", "manual": "user", "n": 12, "title": "Assets", "html": "\n<p>The <strong>Assets<\/strong> group (fixed-asset register) has:\n<strong>Asset register, Overview, New asset, From purchases, Categories,\nVerification, Reports, Settings<\/strong>. It tracks things the business\nowns for years (vehicles, computers, furniture, equipment), depreciates\nthem, and posts the entries to Accounting.<\/p>\n<h2 id=\"categories-set-up-first\">Categories (set up first)<\/h2>\n<p><strong>Assets &gt; Categories<\/strong> defines the defaults for each\nkind of asset: <strong>Name<\/strong>, <strong>Method<\/strong>,\n<strong>Useful life<\/strong> (in months), <strong>Salvage value (% of\ncost)<\/strong> and <strong>Prorate the first month by days<\/strong>. A\nnew asset of that kind starts with these. Changing a category later does\nnot change assets already registered. A category may have its own\naccounts (asset, accumulated depreciation, depreciation expense); left\nempty, the standard accounts are used. Examples: <em>Computers<\/em> (36\nmonths), <em>Vehicles<\/em> (60), <em>Furniture<\/em> (84).<\/p>\n<h2 id=\"registering-an-asset\">Registering an asset<\/h2>\n<p><strong>Assets &gt; New asset<\/strong>:<\/p>\n<div class=\"tablewrap\"><table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Field<\/th>\n<th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>Asset name<\/strong> and <strong>Tag<\/strong><\/td>\n<td>For example <em>Delivery van<\/em>. If the tag is left empty one is\ngenerated (FA-0001...).<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Branch<\/strong>, <strong>Category<\/strong><\/td>\n<td>Where it belongs and what kind it is.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Purchase date<\/strong>, <strong>Cost<\/strong><\/td>\n<td>When and for how much.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Depreciation Method<\/strong><\/td>\n<td><em>Straight line<\/em> (same amount each month) or <em>Declining\nbalance<\/em> (bigger early). <strong>Useful life (months)<\/strong>,\n<strong>Salvage value<\/strong>, <strong>Start depreciating in<\/strong>,\n<strong>Prorate the first month by days<\/strong>.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Depreciation already charged before this\nsystem<\/strong><\/td>\n<td>For an asset you already own: set <em>Start depreciating in<\/em> to\nthe first month still to be charged. This opening amount is not posted\nto Accounting. Record it with a journal entry if needed.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Purchase posting<\/strong><\/td>\n<td><em>Don't post<\/em> (the purchase is already in the books),\n<em>Post: paid in cash<\/em>, or <em>Post: owed to the\nsupplier<\/em>.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Location, Held by, Serial number, Supplier<\/strong><\/td>\n<td>Where it is and who has it.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Warranty ends, Insurance ends, Insurance\npolicy<\/strong><\/td>\n<td>The register and overview warn you before these dates.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Notes<\/strong>; photos and files<\/td>\n<td>Attach several photos and files, such as the invoice and warranty\ncard.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>From a purchase<\/strong> turns an item on a received purchase\norder into an asset in one step.<\/p>\n<h2 id=\"the-asset-register\">The asset register<\/h2>\n<p>The register lists assets with <strong>Tag, Asset, Category,\nPurchased, Cost, Accumulated, Book value, Branch, Place, Held by,\nStatus<\/strong> and totals at the top. Use the search (tag, name,\nserial, holder, place), filters (category, branch, place, held by) and\n<strong>quick views<\/strong>: <em>All assets, Active, Fully depreciated,\nDisposed, Warranty ending, Warranty ended, Insurance ending, Insurance\nended<\/em>.<\/p>\n<p><strong>Run depreciation<\/strong> charges every full month up to the\ndate you choose that has not been charged yet and posts it to\nAccounting. It also runs by itself every day for months that have\nended.<\/p>\n<p>Tick several assets for bulk actions: <strong>Move...<\/strong> (to\nanother branch or place, with date and reason), <strong>Hand\nout...<\/strong> (to a user or a typed name), <strong>Take back<\/strong>,\n<strong>Print tags<\/strong>.<\/p>\n<h2 id=\"working-with-one-asset\">Working with one asset<\/h2>\n<p>Open an asset to see its details and <strong>history of everything\ndone to it<\/strong>. Buttons:<\/p>\n<ul>\n<li><strong>Print tag<\/strong>: a printable QR tag to stick on the\nasset.<\/li>\n<li><strong>Maintenance history<\/strong>.<\/li>\n<li><strong>Edit<\/strong>: details only. If depreciation or the purchase\nposting already exists, cost, dates and depreciation terms cannot be\nedited here; use the actions below.<\/li>\n<li><strong>Transfer...<\/strong>: move it to another branch\n(depreciation up to the month before stays with the old branch; later\nmonths go to the new one) and/or a new location.<\/li>\n<li><strong>Add an improvement<\/strong>: money spent that makes the\nasset worth more or last longer is added to its cost; depreciation is\nspread again over the remaining life from the month after.<\/li>\n<li><strong>Write the value down (impairment)<\/strong>: for damage or\nwhen worth less than the book value. It is charged as an expense and\nadded to the accumulated depreciation.<\/li>\n<li><strong>Change the depreciation terms<\/strong>: new remaining life,\nsalvage value or method, from the month after the date you choose.\nMonths already charged are not changed.<\/li>\n<li><strong>Take back the last month of depreciation<\/strong>: removes\nthe latest charge with a reversing entry. Not possible if an\nimprovement, write-down or change of terms is dated after that\nmonth.<\/li>\n<li><strong>Hand this asset to someone<\/strong>: gives custody to a user\nor named person and prints a <strong>handover sheet<\/strong>.<\/li>\n<li><strong>Dispose...<\/strong>: enter the <strong>Disposal\ndate<\/strong>, <strong>Sale proceeds<\/strong> (0 = written off) and a\nnote. Depreciation is charged to the month before disposal, then\nAccounting records the cash received, removes the asset and its\naccumulated depreciation, and books the gain or loss. <strong>A book\nvalue above the approval limit needs an administrator or a user with the\n<em>Approve large asset disposals<\/em> right.<\/strong><\/li>\n<li><strong>Undo disposal...<\/strong>: a person with approval rights can\nreverse a disposal made by mistake. Accounting gets a reversing entry\nand the asset becomes active again.<\/li>\n<li><strong>Delete<\/strong>: only for an asset that has no\npostings.<\/li>\n<\/ul>\n<h2 id=\"verification-physical-counting\">Verification (physical\ncounting)<\/h2>\n<p><strong>Assets &gt; Verification<\/strong> checks that assets are\nreally where the books say.<\/p>\n<ol type=\"1\">\n<li><strong>Start a round<\/strong>: give it a <strong>Name<\/strong> (for\nexample <em>Year-end count<\/em>) and limit it by <strong>Branch,\nCategory<\/strong> or <strong>Place<\/strong>. <strong>Start\nRound<\/strong> lists the assets that should be there.<\/li>\n<li>Walk around and mark each asset <strong>Found<\/strong>,\n<strong>Missing<\/strong> or <strong>Damaged<\/strong> (with <strong>found\nat<\/strong> and a note). <strong>Mark everything still unchecked as\nFound<\/strong> speeds up a quiet round. <strong>Move assets to the place\nwhere they were found<\/strong> corrects locations.<\/li>\n<li><strong>Close the round<\/strong> once everything is checked.<\/li>\n<li>A <strong>Missing<\/strong> asset can be <strong>Written\noff...<\/strong> from the round.<\/li>\n<\/ol>\n<h2 id=\"overview\">Overview<\/h2>\n<p><strong>Assets &gt; Overview<\/strong>: <strong>Assets in use, Total\ncost, Accumulated depreciation, Book value, Next month's depreciation,\nFully depreciated, Disposed, Nobody holding, Open verification\nrounds<\/strong>, a warning if depreciation is <strong>months\nbehind<\/strong>, breakdowns <strong>by category<\/strong> and <strong>by\nbranch<\/strong>, and a watch list: warranty or insurance ending soon,\nand assets that will be fully depreciated soon.<\/p>\n<h2 id=\"reports\">Reports<\/h2>\n<p><strong>Assets &gt; Reports<\/strong>: Asset Register, Assets by\nCategory, Assets by Location, Assets by Holder, Warranty and Insurance\nExpiry, Depreciation Forecast, Fixed Asset Movement, Asset Verification,\nDepreciation Schedule, Asset Disposals, Asset Transfers.<\/p>\n<h2 id=\"settings-administrator\">Settings (administrator)<\/h2>\n<p>The warning days for warranty and insurance, the <em>fully\ndepreciated soon<\/em> window, and the <strong>disposal approval\nlimit<\/strong>.<\/p>\n", "text": " The Assets group (fixed-asset register) has: Asset register, Overview, New asset, From purchases, Categories, Verification, Reports, Settings . It tracks things the business owns for years (vehicles, computers, furniture, equipment), depreciates them, and posts the entries to Accounting. Categories (set up first) Assets > Categories defines the defaults for each kind of asset: Name , Method , Useful life (in months), Salvage value (% of cost) and Prorate the first month by days . A new asset of that kind starts with these. Changing a category later does not change assets already registered. A category may have its own accounts (asset, accumulated depreciation, depreciation expense); left empty, the standard accounts are used. Examples: Computers (36 months), Vehicles (60), Furniture (84). Registering an asset Assets > New asset : Field Meaning Asset name and Tag For example Delivery van . If the tag is left empty one is generated (FA-0001...). Branch , Category Where it belongs and what kind it is. Purchase date , Cost When and for how much. Depreciation Method Straight line (same amount each month) or Declining balance (bigger early). Useful life (months) , Salvage value , Start depreciating in , Prorate the first month by days . Depreciation already charged before this system For an asset you already own: set Start depreciating in to the first month still to be charged. This opening amount is not posted to Accounting. Record it with a journal entry if needed. Purchase posting Don't post (the purchase is already in the books), Post: paid in cash , or Post: owed to the supplier . Location, Held by, Serial number, Supplier Where it is and who has it. Warranty ends, Insurance ends, Insurance policy The register and overview warn you before these dates. Notes ; photos and files Attach several photos and files, such as the invoice and warranty card. From a purchase turns an item on a received purchase order into an asset in one step. The asset register The register lists assets with Tag, Asset, Category, Purchased, Cost, Accumulated, Book value, Branch, Place, Held by, Status and totals at the top. Use the search (tag, name, serial, holder, place), filters (category, branch, place, held by) and quick views : All assets, Active, Fully depreciated, Disposed, Warranty ending, Warranty ended, Insurance ending, Insurance ended . Run depreciation charges every full month up to the date you choose that has not been charged yet and posts it to Accounting. It also runs by itself every day for months that have ended. Tick several assets for bulk actions: Move... (to another branch or place, with date and reason), Hand out... (to a user or a typed name), Take back , Print tags . Working with one asset Open an asset to see its details and history of everything done to it . Buttons: Print tag : a printable QR tag to stick on the asset. Maintenance history . Edit : details only. If depreciation or the purchase posting already exists, cost, dates and depreciation terms cannot be edited here; use the actions below. Transfer... : move it to another branch (depreciation up to the month before stays with the old branch; later months go to the new one) and/or a new location. Add an improvement : money spent that makes the asset worth more or last longer is added to its cost; depreciation is spread again over the remaining life from the month after. Write the value down (impairment) : for damage or when worth less than the book value. It is charged as an expense and added to the accumulated depreciation. Change the depreciation terms : new remaining life, salvage value or method, from the month after the date you choose. Months already charged are not changed. Take back the last month of depreciation : removes the latest charge with a reversing entry. Not possible if an improvement, write-down or change of terms is dated after that month. Hand this asset to someone : gives custody to a user or named person and prints a handover sheet . Dispose... : enter the Disposal date , Sale proceeds (0 = written off) and a note. Depreciation is charged to the month before disposal, then Accounting records the cash received, removes the asset and its accumulated depreciation, and books the gain or loss. A book value above the approval limit needs an administrator or a user with the Approve large asset disposals right. Undo disposal... : a person with approval rights can reverse a disposal made by mistake. Accounting gets a reversing entry and the asset becomes active again. Delete : only for an asset that has no postings. Verification (physical counting) Assets > Verification checks that assets are really where the books say. Start a round : give it a Name (for example Year-end count ) and limit it by Branch, Category or Place . Start Round lists the assets that should be there. Walk around and mark each asset Found , Missing or Damaged (with found at and a note). Mark everything still unchecked as Found speeds up a quiet round. Move assets to the place where they were found corrects locations. Close the round once everything is checked. A Missing asset can be Written off... from the round. Overview Assets > Overview : Assets in use, Total cost, Accumulated depreciation, Book value, Next month's depreciation, Fully depreciated, Disposed, Nobody holding, Open verification rounds , a warning if depreciation is months behind , breakdowns by category and by branch , and a watch list: warranty or insurance ending soon, and assets that will be fully depreciated soon. Reports Assets > Reports : Asset Register, Assets by Category, Assets by Location, Assets by Holder, Warranty and Insurance Expiry, Depreciation Forecast, Fixed Asset Movement, Asset Verification, Depreciation Schedule, Asset Disposals, Asset Transfers. Settings (administrator) The warning days for warranty and insurance, the fully depreciated soon window, and the disposal approval limit . "}, {"id": "user-13-human-resources-and-payroll", "manual": "user", "n": 13, "title": "Human resources and payroll", "html": "\n<p>The HR menus are: <strong>Employees<\/strong> (<em>Employees, New\nemployee, Documents, Onboarding, HR reports<\/em>), <strong>Org<\/strong>\n(<em>Departments &amp; positions, Organization chart<\/em>),\n<strong>Attendance<\/strong> (<em>Attendance, Leave, Team calendar,\nSettings<\/em>), <strong>Contracts<\/strong>, and <strong>Payroll<\/strong>\n(<em>Payroll runs, Adjustments, Advances &amp; loans, Tax &amp; social\nsecurity, Rules &amp; tax bands<\/em>).<\/p>\n<p>Access to HR needs the <em>Human resources<\/em> area, and to\ncontracts and payroll the separate <em>Payroll and contracts<\/em> area,\nbecause they carry salary data.<\/p>\n<h2 id=\"employees\">Employees<\/h2>\n<h3 id=\"adding-an-employee\">Adding an employee<\/h3>\n<p><strong>Employees &gt; New employee<\/strong>:<\/p>\n<ul>\n<li><strong>Personal details<\/strong>: first and last name, date of\nbirth, national ID, phone, e-mail, address, emergency contact and\nphone.<\/li>\n<li><strong>Job<\/strong>: <strong>Employee number<\/strong> (automatic:\nEMP-0001...), <strong>Hire date<\/strong>, <strong>Employment\ntype<\/strong> (<em>Full time, Part time, Casual, Intern<\/em>),\n<strong>Job title<\/strong>, <strong>Department<\/strong>,\n<strong>Position<\/strong>, <strong>Reports to<\/strong>,\n<strong>Branch<\/strong>.<\/li>\n<li><strong>Staff login (lets them clock in and out\nthemselves)<\/strong>: link the employee to a user account, or create one\nwith <strong>Give login<\/strong>. The password is shown once; give it to\nthe employee. They then use <strong>My HR<\/strong>.<\/li>\n<li><strong>Track attendance for pay<\/strong>: when ticked, payroll\ndeducts absent days and pays overtime from attendance records. Leave it\noff for salaried staff who do not clock in.<\/li>\n<li><strong>Bank and statutory numbers<\/strong>: bank, account number,\ntax number, social security number.<\/li>\n<\/ul>\n<p>Several employees can be loaded at once with the <strong>employee\nimport<\/strong> (Excel/CSV with a template; use <em>Check file<\/em>\nfirst).<\/p>\n<h3 id=\"the-employee-page\">The employee page<\/h3>\n<p>Shows details, <strong>Leave balances<\/strong>, <strong>Leave\nrequests<\/strong>, <strong>Contracts<\/strong> (with <strong>+ New\ncontract<\/strong>), documents, checklists and the <strong>Annual\nearnings and tax certificate<\/strong> (month by month gross pay, income\ntax and contributions of approved and paid payrolls for a year).<\/p>\n<p>Actions: <strong>Edit<\/strong>, <strong>Mark inactive<\/strong>,\n<strong>Delete<\/strong> (only if no history), <strong>Give\nlogin<\/strong>, and <strong>Employee left<\/strong> (enter the\n<strong>Last day<\/strong> and <strong>Reason<\/strong>; this also ends\nthe active contract on that date and can prepare <strong>Final\npay<\/strong>).<\/p>\n<h3 id=\"documents\">Documents<\/h3>\n<p><strong>Employees &gt; Documents<\/strong> stores contracts, IDs,\ncertificates and other files per employee, with an <strong>expiry\ndate<\/strong>; expiring documents are summarised so that you can renew\nthem. An employee can see the documents HR shares with them in\n<strong>My HR<\/strong>.<\/p>\n<h3 id=\"onboarding-and-offboarding\">Onboarding and offboarding<\/h3>\n<p><strong>Onboarding<\/strong> holds checklists of tasks. A\n<strong>template<\/strong> is a ready list (name, <em>For<\/em> new\nstarters or leavers, tasks with who is responsible and a due date\ncounted in days from the hire date or the last working day). Start a\nchecklist from an employee's page. <strong>Open tasks<\/strong> lists\nwhat is waiting, with <strong>Overdue only<\/strong> and <strong>Mark\ndone<\/strong>.<\/p>\n<h2 id=\"organisation\">Organisation<\/h2>\n<ul>\n<li><strong>Departments &amp; positions<\/strong>: create departments and\npositions that you pick on employees.<\/li>\n<li><strong>Organization chart<\/strong>: shows departments and\n<strong>reporting lines<\/strong> from the <em>Reports to<\/em>\nfield.<\/li>\n<\/ul>\n<h2 id=\"attendance\">Attendance<\/h2>\n<p><strong>Attendance<\/strong> has two tabs. <strong>Daily\nrecords<\/strong> lists each day's <em>In, Out, Hours, Overtime,\nStatus<\/em> (<em>Present, Late, Absent<\/em>) with filters. Employees\nwith a login see <strong>My day<\/strong> and press <strong>Clock\nin<\/strong> and <strong>Clock out<\/strong>. HR uses <strong>Add or\ncorrect a day<\/strong> to enter or fix a record (saving a day that\nalready has a record replaces it). Hours and overtime are worked out\nfrom the in and out times and the working hours in\n<strong>Settings<\/strong>. <strong>Summary<\/strong> shows each\nemployee's expected days, present, late, absent, on leave, hours and\novertime for a period.<\/p>\n<h2 id=\"leave\">Leave<\/h2>\n<p><strong>Leave<\/strong> has <strong>Requests<\/strong> and\n<strong>Balances<\/strong>.<\/p>\n<ul>\n<li><strong>New leave request<\/strong>: employee, leave type,\n<strong>From<\/strong>, <strong>To<\/strong>, reason, and tick <em>first\nday / last day is a half day<\/em>. Weekends and public holidays are not\ncounted; the working days are shown. An employee can ask for leave\nthemselves in <strong>My HR<\/strong>.<\/li>\n<li>HR or a manager presses <strong>Approve<\/strong> or\n<strong>Reject<\/strong>, or <strong>Cancel<\/strong>.<\/li>\n<li><strong>Balances<\/strong> show for the year: <strong>Entitled,\nEarned so far, Carried over, Used, Pending, Remaining<\/strong>. Types\nearned monthly add one twelfth of the days per month worked.\nCarried-over days come from unused days of earlier years, up to the\ntype's limit.<\/li>\n<li><strong>Team calendar<\/strong> shows who is away when.<\/li>\n<\/ul>\n<h2 id=\"contracts\">Contracts<\/h2>\n<p><strong>Contracts &gt; New<\/strong>: <strong>Employee<\/strong>,\n<strong>Type<\/strong> (<em>Permanent, Fixed term, Probation, Casual,\nInternship<\/em>), <strong>Job title<\/strong>, <strong>Start\ndate<\/strong>, <strong>End date<\/strong>, <strong>Monthly basic\nsalary<\/strong>, and <strong>Allowances and fixed deductions\n(monthly)<\/strong>: each has a name, a kind (<em>Allowance (added)<\/em>\nor <em>Deduction (taken)<\/em>), an amount and whether it is\n<strong>Taxable<\/strong>. A deduction, for example a loan repayment, is\ntaken from net pay after tax. A new contract is a\n<strong>draft<\/strong>; <strong>activate it from the contract list when\nit is signed<\/strong>. A report lists contracts expiring in the next 60\ndays.<\/p>\n<h2 id=\"payroll\">Payroll<\/h2>\n<h3 id=\"monthly-routine\">Monthly routine<\/h3>\n<ol type=\"1\">\n<li>Before the month closes: make sure contracts, leave, attendance,\n<strong>Adjustments<\/strong> and <strong>Advances &amp; loans<\/strong>\nare up to date.<\/li>\n<li><strong>Payroll &gt; Payroll runs &gt; Run payroll for a\nmonth<\/strong>: choose the month. The system works out the pay of\neveryone with a contract in that month.<\/li>\n<li>Review the run: <strong>Gross pay, Income tax (PAYE), Contributions,\nNet pay, Employer cost<\/strong> for each employee. If you change\ncontracts, leave or attendance, press <strong>Recalculate<\/strong>.<\/li>\n<li><strong>Approve and post<\/strong>: the payroll is posted to\nAccounting and locked.<\/li>\n<li><strong>Pay the salaries<\/strong>: download the <strong>Bank\ntransfer file<\/strong> (CSV or Excel; columns <em>No, SURNAME, NAME, NET\nSALARY, ACCOUNT NO, BANK NAME<\/em>), upload it to your bank, then press\n<strong>Mark salaries as paid<\/strong>. Employees without a bank account\nare listed.<\/li>\n<li><strong>Payslips<\/strong> can be e-mailed to each employee as a PDF\n(needs e-mail set up).<\/li>\n<li><strong>Papers<\/strong>: the <strong>Payroll register<\/strong>\n(Excel, PDF, CSV) and <strong>Returns for the authorities<\/strong>:\nincome tax and social security (Excel and PDF).<\/li>\n<li><strong>Record payments<\/strong> of tax and social security when you\npay the authorities (below).<\/li>\n<\/ol>\n<p>If something was wrong: <strong>Reopen<\/strong> an approved payroll\n(entries are reversed and loan repayments given back), or <strong>Cancel\npayment<\/strong> if the bank transfer failed. Neither is possible while\ntax or social-security payments are recorded for that month.<\/p>\n<h3 id=\"adjustments\">Adjustments<\/h3>\n<p><strong>Payroll &gt; Adjustments<\/strong>: a one-off item for an\nemployee in a month: a <strong>bonus, arrears or allowance<\/strong>\n(adds) or a <strong>fine or uniform charge<\/strong> (takes), with a\nname, amount, month, whether it is taxable and a note. It is included\nthe next time that month's payroll is generated. After approval it\ncannot be changed.<\/p>\n<h3 id=\"advances-and-loans\">Advances and loans<\/h3>\n<p><strong>Advances &amp; loans &gt; Give an advance or a loan<\/strong>:\nchoose the <strong>employee<\/strong>, the <strong>Kind<\/strong>\n(<em>Salary advance (taken in one go)<\/em> or <em>Loan (repaid over\nmonths)<\/em>), the <strong>Amount given<\/strong>, <strong>Taken each\nmonth<\/strong> and the date. The cash given is recorded in Accounting.\nEvery payroll then takes the installment until nothing is left (the last\none is only what remains). An advance starts in the month it is given, a\nloan in the next. Open a loan to see <strong>Repayments<\/strong>,\n<strong>Record<\/strong> a cash repayment, <strong>Write off<\/strong> the\nrest (it becomes a salary cost) or <strong>Cancel this loan<\/strong>\n(only if nothing has been repaid).<\/p>\n<h3 id=\"tax-and-social-security\">Tax and social security<\/h3>\n<p><strong>Payroll &gt; Tax &amp; social security<\/strong> lists, for\neach approved payroll month, what is <strong>Owed<\/strong>,\n<strong>Paid<\/strong> and <strong>Still owed<\/strong>, with the\n<strong>Due<\/strong> date (income tax and contributions are due by a day\nof the next month), marked <em>Settled<\/em> or <em>Overdue<\/em>. Use\n<strong>Record payment<\/strong>: <strong>Amount, Paid on, Paid to,\nReceipt / reference, Note<\/strong>. <strong>Payments made<\/strong> lists\nthem and lets you cancel one entered by mistake.<\/p>\n<h3 id=\"rules-and-tax-bands-administrator-or-payroll-manager\">Rules and\ntax bands (administrator or payroll manager)<\/h3>\n<p><strong>Rules &amp; tax bands<\/strong> holds the <strong>Income tax\nbands<\/strong> (each taxes the part of taxable pay inside it: From, To,\nRate %) and the <strong>Contribution rules<\/strong> (name, paid by\nemployee or employer, rate %, based on gross, basic or net pay, monthly\ncap, owed to <em>Social security<\/em> or other, and whether it reduces\ntaxable pay). <strong>The ready-made figures are a starting point, not\nlegal advice. Confirm every rate, ceiling and band with your accountant\nbefore running a real payroll.<\/strong> If no tax bands are set, income\ntax is 0 for everyone.<\/p>\n<h3 id=\"final-pay\">Final pay<\/h3>\n<p>When an employee leaves, <strong>Final pay<\/strong> adds the\nremaining days' pay, <strong>unused leave days paid out<\/strong>,\n<strong>notice days the company pays<\/strong> or <strong>notice days not\nserved<\/strong>, and can take the loans back from this pay (pay is never\ncut below zero; what is left stays owed). It is added to the payroll of\nthe month and taxed like the rest.<\/p>\n<h2 id=\"reports\">Reports<\/h2>\n<p><strong>HR &gt; Reports<\/strong>: Employee Directory, Headcount by\nDepartment, Leave Balances, Leave Requests, Attendance Summary,\nContracts Expiring (60 days), <strong>Payroll Register<\/strong> and\n<strong>Payroll Summary<\/strong>. Salary reports are restricted to\npeople with payroll access. A <strong>yearly summary<\/strong> (one row\nper employee) is on the Payroll runs page.<\/p>\n", "text": " The HR menus are: Employees ( Employees, New employee, Documents, Onboarding, HR reports ), Org ( Departments & positions, Organization chart ), Attendance ( Attendance, Leave, Team calendar, Settings ), Contracts , and Payroll ( Payroll runs, Adjustments, Advances & loans, Tax & social security, Rules & tax bands ). Access to HR needs the Human resources area, and to contracts and payroll the separate Payroll and contracts area, because they carry salary data. Employees Adding an employee Employees > New employee : Personal details : first and last name, date of birth, national ID, phone, e-mail, address, emergency contact and phone. Job : Employee number (automatic: EMP-0001...), Hire date , Employment type ( Full time, Part time, Casual, Intern ), Job title , Department , Position , Reports to , Branch . Staff login (lets them clock in and out themselves) : link the employee to a user account, or create one with Give login . The password is shown once; give it to the employee. They then use My HR . Track attendance for pay : when ticked, payroll deducts absent days and pays overtime from attendance records. Leave it off for salaried staff who do not clock in. Bank and statutory numbers : bank, account number, tax number, social security number. Several employees can be loaded at once with the employee import (Excel/CSV with a template; use Check file first). The employee page Shows details, Leave balances , Leave requests , Contracts (with + New contract ), documents, checklists and the Annual earnings and tax certificate (month by month gross pay, income tax and contributions of approved and paid payrolls for a year). Actions: Edit , Mark inactive , Delete (only if no history), Give login , and Employee left (enter the Last day and Reason ; this also ends the active contract on that date and can prepare Final pay ). Documents Employees > Documents stores contracts, IDs, certificates and other files per employee, with an expiry date ; expiring documents are summarised so that you can renew them. An employee can see the documents HR shares with them in My HR . Onboarding and offboarding Onboarding holds checklists of tasks. A template is a ready list (name, For new starters or leavers, tasks with who is responsible and a due date counted in days from the hire date or the last working day). Start a checklist from an employee's page. Open tasks lists what is waiting, with Overdue only and Mark done . Organisation Departments & positions : create departments and positions that you pick on employees. Organization chart : shows departments and reporting lines from the Reports to field. Attendance Attendance has two tabs. Daily records lists each day's In, Out, Hours, Overtime, Status ( Present, Late, Absent ) with filters. Employees with a login see My day and press Clock in and Clock out . HR uses Add or correct a day to enter or fix a record (saving a day that already has a record replaces it). Hours and overtime are worked out from the in and out times and the working hours in Settings . Summary shows each employee's expected days, present, late, absent, on leave, hours and overtime for a period. Leave Leave has Requests and Balances . New leave request : employee, leave type, From , To , reason, and tick first day / last day is a half day . Weekends and public holidays are not counted; the working days are shown. An employee can ask for leave themselves in My HR . HR or a manager presses Approve or Reject , or Cancel . Balances show for the year: Entitled, Earned so far, Carried over, Used, Pending, Remaining . Types earned monthly add one twelfth of the days per month worked. Carried-over days come from unused days of earlier years, up to the type's limit. Team calendar shows who is away when. Contracts Contracts > New : Employee , Type ( Permanent, Fixed term, Probation, Casual, Internship ), Job title , Start date , End date , Monthly basic salary , and Allowances and fixed deductions (monthly) : each has a name, a kind ( Allowance (added) or Deduction (taken) ), an amount and whether it is Taxable . A deduction, for example a loan repayment, is taken from net pay after tax. A new contract is a draft ; activate it from the contract list when it is signed . A report lists contracts expiring in the next 60 days. Payroll Monthly routine Before the month closes: make sure contracts, leave, attendance, Adjustments and Advances & loans are up to date. Payroll > Payroll runs > Run payroll for a month : choose the month. The system works out the pay of everyone with a contract in that month. Review the run: Gross pay, Income tax (PAYE), Contributions, Net pay, Employer cost for each employee. If you change contracts, leave or attendance, press Recalculate . Approve and post : the payroll is posted to Accounting and locked. Pay the salaries : download the Bank transfer file (CSV or Excel; columns No, SURNAME, NAME, NET SALARY, ACCOUNT NO, BANK NAME ), upload it to your bank, then press Mark salaries as paid . Employees without a bank account are listed. Payslips can be e-mailed to each employee as a PDF (needs e-mail set up). Papers : the Payroll register (Excel, PDF, CSV) and Returns for the authorities : income tax and social security (Excel and PDF). Record payments of tax and social security when you pay the authorities (below). If something was wrong: Reopen an approved payroll (entries are reversed and loan repayments given back), or Cancel payment if the bank transfer failed. Neither is possible while tax or social-security payments are recorded for that month. Adjustments Payroll > Adjustments : a one-off item for an employee in a month: a bonus, arrears or allowance (adds) or a fine or uniform charge (takes), with a name, amount, month, whether it is taxable and a note. It is included the next time that month's payroll is generated. After approval it cannot be changed. Advances and loans Advances & loans > Give an advance or a loan : choose the employee , the Kind ( Salary advance (taken in one go) or Loan (repaid over months) ), the Amount given , Taken each month and the date. The cash given is recorded in Accounting. Every payroll then takes the installment until nothing is left (the last one is only what remains). An advance starts in the month it is given, a loan in the next. Open a loan to see Repayments , Record a cash repayment, Write off the rest (it becomes a salary cost) or Cancel this loan (only if nothing has been repaid). Tax and social security Payroll > Tax & social security lists, for each approved payroll month, what is Owed , Paid and Still owed , with the Due date (income tax and contributions are due by a day of the next month), marked Settled or Overdue . Use Record payment : Amount, Paid on, Paid to, Receipt / reference, Note . Payments made lists them and lets you cancel one entered by mistake. Rules and tax bands (administrator or payroll manager) Rules & tax bands holds the Income tax bands (each taxes the part of taxable pay inside it: From, To, Rate %) and the Contribution rules (name, paid by employee or employer, rate %, based on gross, basic or net pay, monthly cap, owed to Social security or other, and whether it reduces taxable pay). The ready-made figures are a starting point, not legal advice. Confirm every rate, ceiling and band with your accountant before running a real payroll. If no tax bands are set, income tax is 0 for everyone. Final pay When an employee leaves, Final pay adds the remaining days' pay, unused leave days paid out , notice days the company pays or notice days not served , and can take the loans back from this pay (pay is never cut below zero; what is left stays owed). It is added to the payroll of the month and taxed like the rest. Reports HR > Reports : Employee Directory, Headcount by Department, Leave Balances, Leave Requests, Attendance Summary, Contracts Expiring (60 days), Payroll Register and Payroll Summary . Salary reports are restricted to people with payroll access. A yearly summary (one row per employee) is on the Payroll runs page. "}, {"id": "user-14-time-tracking", "manual": "user", "n": 14, "title": "Time tracking", "html": "\n<p>The <strong>Time tracking<\/strong> group has: <strong>Projects,\nApprovals, Bill time, Reports, Settings<\/strong>. Every person who logs\ntime uses <strong>My time<\/strong>.<\/p>\n<h2 id=\"the-path-of-a-piece-of-time\">The path of a piece of time<\/h2>\n<p><strong>Log<\/strong> (timer or manual) → <strong>Submit for\napproval<\/strong> at the end of the week → <strong>Manager\napproves<\/strong> → <strong>Bill time<\/strong> creates a draft invoice →\nissue the invoice.<\/p>\n<h2 id=\"logging-your-time-everyone\">Logging your time (everyone)<\/h2>\n<p>Open <strong>My time<\/strong>. The top shows <strong>Today, This\nweek, This month<\/strong> hours and what you still need to submit.<\/p>\n<p><strong>With the timer<\/strong>: choose the <strong>Project<\/strong>\n(and <strong>Task<\/strong>), write <em>What are you working on?<\/em> and\npress <strong>Start<\/strong>. When finished press <strong>Stop and\nsave<\/strong>, or <strong>Discard<\/strong>. A timer left running is\nstopped automatically after a number of hours set by your administrator,\nand kept as a draft for you to check. If you forgot a timer, stop it and\ncorrect the time.<\/p>\n<p><strong>By hand<\/strong>: choose the <strong>Date<\/strong>,\n<strong>Project<\/strong>, <strong>Task<\/strong>, enter\n<strong>Time<\/strong> (type 1:30, 1.5, 90m or 2h), <em>What did you\ndo?<\/em>, and tick <strong>Billable<\/strong> if it is billable. Rates\ncome from the project; you do not enter any.<\/p>\n<p><strong>Your week<\/strong>: use <strong>Previous week / Next\nweek<\/strong> to move around. <strong>Copy last week<\/strong> repeats\nlast week's entries. Edit or delete a line while it is still a draft.\nWhen the week is complete press <strong>Submit ... for\napproval<\/strong>. An entry that is <strong>Sent back<\/strong> shows the\nmanager's reason: correct it and submit again.<\/p>\n<div class=\"callout note\">\n<p><strong>Note:<\/strong> Your administrator can lock time up to a date\n(approved and invoiced weeks cannot be changed), cap hours per day and\ne-mail a weekly reminder to people who have not handed in last week's\ntime.<\/p>\n<\/div>\n<h2 id=\"projects-manager\">Projects (manager)<\/h2>\n<p><strong>Projects &gt; New<\/strong>:<\/p>\n<ul>\n<li><strong>Name<\/strong>, <strong>Code<\/strong>, <strong>Customer (who\nis billed)<\/strong>, <strong>Status<\/strong> (<em>Active: time can be\nlogged; Completed: no new time; Archived: hidden<\/em>),\n<strong>Description<\/strong>.<\/li>\n<li><strong>Hourly rate<\/strong> (or use the default), <strong>Budget\n(hours)<\/strong>, <strong>Start<\/strong> and <strong>End<\/strong>.<\/li>\n<li><strong>Time on this project is billable to the customer<\/strong>,\nand <strong>Refuse time that would go over the budget<\/strong> (needs a\nbudget; managers can still correct entries).<\/li>\n<li><strong>Project team<\/strong>: only the people listed can log time\non the project (administrators always can).<\/li>\n<li><strong>Tasks<\/strong>: optional breakdown with an <strong>Estimate\n(h)<\/strong> and the hours logged so far.<\/li>\n<li><strong>Rates per person<\/strong>: anyone not listed is billed at\nthe project rate. A rate is fixed on an entry when it is submitted, so a\nlater change does not alter time already handed in.<\/li>\n<\/ul>\n<p>The project page summarises <strong>hours logged, billable, ready to\ninvoice<\/strong> and <strong>budget used %<\/strong>, and links to\nbilling.<\/p>\n<h2 id=\"approvals-and-team-time-manager\">Approvals and team time\n(manager)<\/h2>\n<p><strong>Approvals<\/strong> shows:<\/p>\n<ul>\n<li><strong>Not submitted<\/strong>: for the chosen week, the people who\nnormally log time but have not handed in everything, with\n<strong>Remind<\/strong> per person or <strong>Send reminder to everyone\nlisted<\/strong>.<\/li>\n<li><strong>Waiting for approval<\/strong>: filter by status (<em>Not yet\nsubmitted, Approved, Sent back, Invoiced<\/em>), person and project. Tick\nentries and <strong>Approve<\/strong>, or <strong>Send back<\/strong> with\na reason. <strong>Correct<\/strong> lets a manager fix the time or\ndescription before approving.<\/li>\n<\/ul>\n<h2 id=\"bill-time\">Bill time<\/h2>\n<p><strong>Bill time<\/strong> lists <strong>Project, Customer, Billable\nhours, Ready to invoice<\/strong>. Press <strong>Prepare invoice<\/strong>\nfor a project: choose the period and due date. The screen shows one line\nper person and rate (Hours, Rate, Amount). <strong>Create draft\ninvoice<\/strong> creates a draft in Sales that you can still edit before\nissuing. Tax follows the service product set in Time tracking settings.\n<strong>Undo a time invoice<\/strong> releases time so it can be billed\nagain after a draft invoice was deleted or an issued one was voided.<\/p>\n<h2 id=\"reports\">Reports<\/h2>\n<p><strong>Time tracking &gt; Reports<\/strong>: Timesheet Summary,\nProject Hours vs Budget, Unbilled Time, Utilisation, Time Entries.<\/p>\n<h2 id=\"settings-administrator\">Settings (administrator)<\/h2>\n<p>Approval switch, rounding of timers, default rate, daily hour limit,\nforgotten-timer stop, time lock, weekly reminder, budget warning % and\nthe service product (Administrator Manual, chapter 7).<\/p>\n", "text": " The Time tracking group has: Projects, Approvals, Bill time, Reports, Settings . Every person who logs time uses My time . The path of a piece of time Log (timer or manual) → Submit for approval at the end of the week → Manager approves → Bill time creates a draft invoice → issue the invoice. Logging your time (everyone) Open My time . The top shows Today, This week, This month hours and what you still need to submit. With the timer : choose the Project (and Task ), write What are you working on? and press Start . When finished press Stop and save , or Discard . A timer left running is stopped automatically after a number of hours set by your administrator, and kept as a draft for you to check. If you forgot a timer, stop it and correct the time. By hand : choose the Date , Project , Task , enter Time (type 1:30, 1.5, 90m or 2h), What did you do? , and tick Billable if it is billable. Rates come from the project; you do not enter any. Your week : use Previous week / Next week to move around. Copy last week repeats last week's entries. Edit or delete a line while it is still a draft. When the week is complete press Submit ... for approval . An entry that is Sent back shows the manager's reason: correct it and submit again. Note: Your administrator can lock time up to a date (approved and invoiced weeks cannot be changed), cap hours per day and e-mail a weekly reminder to people who have not handed in last week's time. Projects (manager) Projects > New : Name , Code , Customer (who is billed) , Status ( Active: time can be logged; Completed: no new time; Archived: hidden ), Description . Hourly rate (or use the default), Budget (hours) , Start and End . Time on this project is billable to the customer , and Refuse time that would go over the budget (needs a budget; managers can still correct entries). Project team : only the people listed can log time on the project (administrators always can). Tasks : optional breakdown with an Estimate (h) and the hours logged so far. Rates per person : anyone not listed is billed at the project rate. A rate is fixed on an entry when it is submitted, so a later change does not alter time alread
