p>A part with nothing to show (no featured product, no review yet, no\nannouncement) is simply left out. When a visitor searches or picks a\ncategory, the page goes straight to the matching products.<\/p>\n<h2 id=\"setting-up-the-shop-manager\">Setting up the shop (manager)<\/h2>\n<p>Open <strong>Online Store &gt; Shop settings<\/strong>.<\/p>\n<h3 id=\"products-on-the-shop\">Products on the shop<\/h3>\n<p>Search a product and press <strong>Add<\/strong>. Only products you\nadd here are shown or sold online. For each product you can set:<\/p>\n<ul>\n<li><strong>Title on the shop<\/strong> and <strong>Online price<\/strong>\n(leave the price empty to use the normal price; an online price below\nthe normal price shows the normal price crossed out as an offer);<\/li>\n<li><strong>Order<\/strong>: the lower number comes first;<\/li>\n<li><strong>Shown<\/strong>: untick to hide the product for a while;<\/li>\n<li>the four row ticks <strong>Featured<\/strong>, <strong>Best\nseller<\/strong>, <strong>Offer<\/strong> and <strong>New<\/strong>: the\nshop never picks products by itself, you decide which products appear in\neach row (up to 8 per row; the first three rows follow the\n<strong>Order<\/strong> number, <strong>New arrivals<\/strong> shows the\nmost recently added first). Press <strong>Save<\/strong> at the end of\nthe product's card.<\/li>\n<\/ul>\n<p>The picture is the product's own picture: add one on the product\nscreen. Under every product the screen shows where its stock figure\ncomes from (see <em>Why does the shop say \"Sold out\"?<\/em> below).<\/p>\n<h3 id=\"front-page-wording\">Front page wording<\/h3>\n<p>In <strong>Front page<\/strong> write what the first page says.\nEverything is optional.<\/p>\n<ul>\n<li><strong>Announcement bar<\/strong> and its <strong>link<\/strong>;\n<strong>Banner title<\/strong>, <strong>Banner text<\/strong>,\n<strong>Banner button text<\/strong> and <strong>Banner button\nlink<\/strong> (empty = down to the products).<\/li>\n<li><strong>Banner pictures<\/strong>: choose up to <strong>8\npictures<\/strong> (JPEG, PNG, WebP or GIF, 8 MB each; you can choose\nseveral at once). Use the arrows to put them in order and\n<strong>Remove<\/strong> to take one away. They slide every few seconds\non the shop, and a visitor can use the arrows, the dots, or swipe. A\nwide picture, about 1600 × 600 pixels, looks best. With no picture the\nbanner is a plain colour.<\/li>\n<li><strong>About the shop<\/strong>, <strong>Contact e-mail<\/strong> and\n<strong>Opening hours<\/strong> for the footer.<\/li>\n<li><strong>Footer links<\/strong> and <strong>Social links<\/strong>: one\nper line, written <strong>Label|address<\/strong>, for example\n<code>Delivery|/shop<\/code> or\n<code>Facebook|https://facebook.com/yourshop<\/code>. At most 8 and 6. An\naddress must start with <code>/<\/code> (a page of this site),\n<code>https://<\/code>, <code>http://<\/code>, <code>mailto:<\/code> or\n<code>tel:<\/code>; anything else is refused.<\/li>\n<\/ul>\n<p>Press <strong>Save the front page<\/strong>, then <strong>Open the\nshop<\/strong> to look at it.<\/p>\n<h3 id=\"delivery-pick-up-and-the-rest\">Delivery, pick-up and the\nrest<\/h3>\n<ol type=\"1\">\n<li><strong>Delivery areas<\/strong>: add each area you deliver to, with\nits <strong>Fee<\/strong> and an optional <strong>Minimum order<\/strong>.\nWith no area the shop delivers anywhere for free. With areas, the\ncustomer chooses one.<\/li>\n<li><strong>The shop<\/strong>: choose the <strong>Service product for\nthe delivery fee<\/strong> (a service product, ideally without tax added\non top), set <strong>Delivery<\/strong>, <strong>Pick-up<\/strong> and\n<strong>Pay cash on delivery or at pick-up<\/strong>, the <strong>Pick-up\naddress<\/strong>, the <strong>Minimum order<\/strong>, <strong>Free\ndelivery from<\/strong> an amount, and <strong>Units kept back for the\ntill<\/strong> (the shop sells that many fewer than you hold, so the last\nunit is not sold twice).<\/li>\n<li><strong>Customer accounts<\/strong>, <strong>Text messages<\/strong>,\n<strong>Returns<\/strong> (how many days after completion a customer may\nreturn goods; 0 = no returns through the shop) and <strong>Online\npayments<\/strong> are switched on here too. Your administrator sets up\nthe providers (Administrator Manual, chapter 7).<\/li>\n<li>Tick <strong>Shop is open to the public<\/strong> and <strong>Save\nsettings<\/strong>. Use <strong>Pause orders for now<\/strong> to stop\ntaking orders without taking the page down; the message you write is\nshown to visitors.<\/li>\n<li>Press <strong>Open the shop<\/strong> and place a test order before\ntelling customers.<\/li>\n<\/ol>\n<p><em>Tip:<\/em> Prices on the shop include tax. Customers see stock\nonly as <em>Few left<\/em> (5 or fewer) or <em>Sold out<\/em>, never as a\nnumber.<\/p>\n<h2 id=\"why-does-the-shop-say-sold-out\">Why does the shop say \"Sold\nout\"?<\/h2>\n<p>You do <strong>not<\/strong> need a separate stock for the shop. The\nshop uses the same stock as the till and the warehouses:<\/p>\n<div class=\"callout note\">\n<p>stock in the <strong>sellable locations<\/strong> of your warehouses −\nquantities <strong>reserved<\/strong> on confirmed sales orders − the\nshop's <strong>buffer<\/strong> (\"Units kept back for the till\", 1 unless\nyou changed it) = what the shop may still sell<\/p>\n<\/div>\n<p>The line under each product in <strong>Products on the shop<\/strong>\nshows these four numbers. When the last one is 0 or less the shop says\n<em>Sold out<\/em>. If the line says <em>Stock is not tracked for this\nproduct<\/em>, the shop always shows it as available. When a product says\nsold out and you believe you have stock, look for:<\/p>\n<div class=\"tablewrap\"><table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>What you see<\/th>\n<th>Usual reason<\/th>\n<th>What to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>The last number is exactly 0 and the first is 1<\/td>\n<td>The buffer of 1<\/td>\n<td>Lower <strong>Units kept back for the till<\/strong> to 0 in the shop\nsettings<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>The first number is 0 but the product has stock<\/td>\n<td>The stock sits in a location that is not sellable\n(<em>Receiving<\/em>, <em>Damaged<\/em>, an inactive location) or was\nnever entered per warehouse<\/td>\n<td>Open <strong>Inventory<\/strong> and the product's stock; move the\ngoods to a sales location with a stock transfer (see the chapter on\nInventory)<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>The first number is high and the second is high too<\/td>\n<td>The goods are already promised on confirmed sales orders, including\naccepted online orders<\/td>\n<td>Complete or cancel those orders, or add stock<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Stock that arrives on a purchase receipt sits in the\n<em>Receiving<\/em> location until it is moved to a <em>Sales<\/em>\nlocation.<\/p>\n<h2 id=\"what-the-customer-does\">What the customer does<\/h2>\n<p>The customer opens <code>/shop<\/code>, searches or picks a category,\nadds products to the cart, and presses <strong>Proceed to\ncheckout<\/strong>. They choose <strong>Delivery<\/strong> or\n<strong>Pick-up<\/strong>, give a name and a phone number (an e-mail\naddress is optional), and for delivery an area and an address. Then they\nchoose how to pay:<\/p>\n<ul>\n<li><strong>Cash on delivery<\/strong> or <strong>Cash at\npick-up<\/strong>. After <strong>Place order<\/strong> the order reaches\nyou at once.<\/li>\n<li><strong>Mobile money<\/strong> (they type the number to pay from and\napprove on their phone) or <strong>Card<\/strong>. After <strong>Place\norder and pay<\/strong> the order reaches you only once the payment is\n<strong>confirmed<\/strong>.<\/li>\n<li>A <strong>coupon code<\/strong> can be typed and checked with\n<strong>Apply<\/strong> before ordering (when you have an active\ncoupon).<\/li>\n<li>When text messages are on, a box offers updates about the order by\ntext (or WhatsApp).<\/li>\n<\/ul>\n<p>They then see an order <strong>code<\/strong>. The page\n<code>/shop/order/&lt;code&gt;<\/code> shows where the order is, lets\nthem cancel it while it is new, <strong>order again<\/strong>, ask for a\n<strong>return<\/strong> or write <strong>reviews<\/strong> once it is\ncompleted. If they gave an e-mail address, they receive a message when\nthe order is received, accepted, on its way or ready, completed or\nrefused.<\/p>\n<p>A customer may also <strong>sign in<\/strong> (top of the shop): they\ntype their e-mail address (or a saved phone number), receive a one-time\ncode valid for 10 minutes, and then see their orders, keep their details\nand use <strong>Order again<\/strong>. No password is needed, and buying\nas a guest always works.<\/p>\n<h2 id=\"answering-orders-staff\">Answering orders (staff)<\/h2>\n<p>Open <strong>Online Store &gt; Online orders<\/strong>. The tabs are\n<strong>New<\/strong>, <strong>Awaiting payment<\/strong>,\n<strong>Open<\/strong>, <strong>Refunds due<\/strong>,\n<strong>Completed<\/strong>, <strong>Rejected<\/strong>,\n<strong>Cancelled<\/strong> and <strong>Everything<\/strong>. The\n<strong>New<\/strong> tab lists orders waiting for an answer, with their\nnumber in brackets and a <em>late<\/em> mark when one has waited too\nlong. The list refreshes by itself, so it can stay open on a counter\nscreen.<\/p>\n<ul>\n<li><strong>Accept<\/strong> creates a confirmed sale order that holds\nthe stock. If the stock does not cover the order, the screen says so and\noffers <strong>Accept anyway<\/strong>; the sale order is then\nover-promised until stock arrives. Phone the customer if you are unsure.\nAn order paid online is already paid: there is no cash to collect.<\/li>\n<li><strong>Reject<\/strong> needs a reason; the customer sees it. An\norder paid online and rejected shows under <strong>Refunds\ndue<\/strong>.<\/li>\n<li><strong>Mark packed<\/strong> (optional), then <strong>Out for\ndelivery<\/strong> for a delivery or <strong>Ready for pick-up<\/strong>\nfor a pick-up. The customer is told.<\/li>\n<li><strong>Complete<\/strong> when the goods are handed over. This takes\nthe stock out through the sale order, issues the invoice, and records\nthe payment. For a cash order tick <strong>Cash collected<\/strong>\nunless the customer has not paid yet; choose <strong>Take stock\nfrom<\/strong> a location if your business uses several warehouses.<\/li>\n<li><strong>Cancel order<\/strong> (accepted but not completed, for\nexample nobody answered the door) cancels the sale order and releases\nthe stock.<\/li>\n<li><strong>Awaiting payment<\/strong> lists orders whose customer has\nnot paid yet. They come to <strong>New<\/strong> when the payment is\nconfirmed, and are cancelled by themselves after a day. A payment the\ncustomer does not approve within <strong>Minutes the customer has to\npay<\/strong> (30 unless changed in the shop settings) expires, and the\ncustomer can try again from the order page.<\/li>\n<\/ul>\n<p>A discount from a coupon is shown on the order (<em>Coupon ... : ...\noff the items<\/em>, or <em>delivery fee waived<\/em>).\n<strong>History<\/strong> lists every step with who did it and when.<\/p>\n<h2 id=\"refunds-of-online-payments\">Refunds of online payments<\/h2>\n<p>When a customer who paid online cancels, or you reject the order, the\norder moves to <strong>Refunds due<\/strong>. Open it and press\n<strong>Refund through the provider<\/strong> to give the money back\nthrough the payment provider. If the provider cannot do it, refund by\nhand outside the program, type the <strong>reference<\/strong> of your\nrefund and press <strong>I refunded it myself<\/strong>. Once an order is\ncompleted, goods coming back go through <strong>Returns<\/strong>\n(below).<\/p>\n<h2 id=\"online-payments-report\">Online payments (report)<\/h2>\n<p><strong>Online Store &gt; Online payments<\/strong> lists every online\npayment for a period, with cards for <strong>Paid<\/strong>, <strong>In\nthe books<\/strong>, <strong>Held for open orders<\/strong>,\n<strong>Refunds due<\/strong>, <strong>Refunded<\/strong>, <strong>To\nreview<\/strong> and <strong>Failed or expired<\/strong>. A payment is\nrecorded in the books as a payment on the invoice when the order is\ncompleted; until then it is held for the order. Use the filters to see\nwhat needs a person:<\/p>\n<ul>\n<li><strong>Under review<\/strong>: money arrived that needs a person,\nfor example a different amount than the order, or a second payment for\nthe same order. Look at it, deal with it (for instance refund the\nextra), write what you did and press <strong>Mark as dealt\nwith<\/strong>.<\/li>\n<li><strong>Refunds due<\/strong> (press <em>Go to the orders to refund\nit<\/em>) and <strong>Stuck pending<\/strong> (a payment still pending\nlong after it should have closed).<\/li>\n<\/ul>\n<h2 id=\"coupons\">Coupons<\/h2>\n<p><strong>Online Store &gt; Coupons<\/strong> holds the codes a customer\ntypes at checkout. When at least one coupon is active, the shop shows a\ncoupon box.<\/p>\n<ul>\n<li>A coupon gives <strong>Percent off the items<\/strong> (with an\noptional <em>Never more than<\/em> amount), <strong>Amount off the\nitems<\/strong>, or <strong>Free delivery<\/strong>.<\/li>\n<li>Optional limits: <strong>Minimum order<\/strong>, <strong>Valid\nfrom<\/strong>, <strong>Valid until<\/strong>, <strong>Orders it can be\nused on<\/strong>, and <strong>Once per customer<\/strong> (the same phone\nnumber or account).<\/li>\n<li>A rejected or cancelled order gives its use back. The discount is\npart of the sale order and the invoice, so the invoice always equals\nwhat the customer paid.<\/li>\n<li>One coupon per order, and it applies to the whole order, not to one\nproduct.<\/li>\n<\/ul>\n<h2 id=\"returns\">Returns<\/h2>\n<p>A customer can ask to return goods from a <strong>completed<\/strong>\norder, within the number of days set in the shop settings (14 unless\nchanged), from their order page. They choose the items and quantities,\ngive a reason and the phone number of the order (not needed when signed\nin).<\/p>\n<ol type=\"1\">\n<li>Open <strong>Online Store &gt; Returns<\/strong>. The\n<strong>Waiting<\/strong> tab lists new requests. Press\n<strong>Approve<\/strong> or <strong>Refuse<\/strong> (a note for the\ncustomer is needed to refuse).<\/li>\n<li>When the customer has brought the goods back, press <strong>Goods\nreceived: put back and refund<\/strong> (the <strong>To refund<\/strong>\ntab), choose where the goods go back in, and give the money back:\n<strong>Refund through the provider<\/strong> for an online payment, or\nthe same by hand with its reference; for a cash order the screen says\nhow much cash to hand back.<\/li>\n<li>The goods go back into stock through a normal sale order return, so\nstock, revenue and reports follow. A coupon discount follows the goods\n(the customer gets back what they paid for them); the <strong>delivery\nfee is not refunded<\/strong>.<\/li>\n<\/ol>\n<p>The customer is e-mailed at each step. Exchanges, store credit and\nrestocking fees are not part of this screen.<\/p>\n<h2 id=\"reviews\">Reviews<\/h2>\n<p>A customer whose order is <strong>completed<\/strong> can review each\nproduct of that order from the order page (a rating of 1 to 5 stars and\noptional words), using the phone number of the order or their account.\nOne review per product per order. Only <strong>real<\/strong> reviews\nexist: you cannot add one yourself.<\/p>\n<p>Open <strong>Online Store &gt; Reviews<\/strong>. A new review is\n<strong>Waiting<\/strong>: press <strong>Approve<\/strong> to show it on\nthe shop, <strong>Hide<\/strong> to keep it but not show it, or\n<strong>Delete<\/strong> to remove it for good. Only approved reviews are\nshown and counted in the stars of a product and of the shop. The newest\napproved reviews with words appear on the first page.<\/p>\n<h2 id=\"newsletter\">Newsletter<\/h2>\n<p>Visitors can ask for your newsletter at the bottom of the first page.\nThe shop sends them an e-mail with a link; they are counted only after\nthey open it. Open <strong>Online Store &gt; Newsletter<\/strong> to see\nthe list (<strong>Subscribed<\/strong>, <strong>Not confirmed<\/strong>,\n<strong>Unsubscribed<\/strong>), to <strong>Remove<\/strong> an address,\nand to <strong>Download confirmed addresses (CSV)<\/strong>, with each\nperson's own unsubscribe link, for a mailing tool.<\/p>\n<div class=\"callout note\">\n<p><strong>Note:<\/strong> The program does not send newsletters itself.\nThe downloaded file has four columns: <code>email<\/code>,\n<code>language<\/code>, <code>confirmed_at<\/code> and\n<code>unsubscribe_link<\/code>. Import it into your own mailing tool and\nput each person's <strong>unsubscribe_link<\/strong> in every message\n(most tools call this a merge field). The link opens a page that\nunsubscribes that person at once, and they no longer appear in the next\ndownload, so download the list again before each mailing. A person can\nalso unsubscribe from the page they see right after confirming, and you\ncan <strong>Remove<\/strong> an address here when someone asks. The\nnewsletter needs the e-mail settings of the business to be working\n(Administrator Manual, chapter 9). Links in the file use\n<code>app.frontend-url<\/code> (Administrator Manual, chapter 7).<\/p>\n<\/div>\n<h2 id=\"text-messages\">Text messages<\/h2>\n<p>When your administrator has chosen a text provider, the shop can text\ncustomers about their order (only those who ticked the box at checkout),\ntext sign-in codes, and text you about new orders. <strong>Online Store\n&gt; Text messages<\/strong> lists every text, also the ones that failed\nor were not sent, and has a <strong>Send test message<\/strong> form.\nThere is a daily limit to keep the cost in check.<\/p>\n<h2 id=\"good-to-know\">Good to know<\/h2>\n<ul>\n<li>Online orders from a phone number that already exists in\n<strong>Customers<\/strong> attach to that customer; otherwise a customer\nis created.<\/li>\n<li>A customer may have only a few orders waiting for an answer at once,\nand a script that sends many orders from one connection is slowed down.\nThese limits are in <strong>Shop settings<\/strong>.<\/li>\n<li>Not built yet: loyalty points on online orders, abandoned-cart\nreminders, and a sales report just for online orders (online orders\nappear in the normal sales reports).<\/li>\n<\/ul>\n", "text": " The Online Store module gives your business a public shop on the internet at /shop (for example https://erp.yourbusiness.com/shop ). When the module is on, /shop is also the first page a visitor sees at the main address, with a Staff Login link for your own people. Customers choose products, order for delivery or pick-up , and pay in cash or online (mobile money or card, when your administrator has set up a payment provider). You answer each order, and an accepted order becomes a normal sale order, invoice and payment, so stock, accounting and reports stay in one place. The module must be in your licence and activated by an administrator (Settings > Modules). The Online Store group then appears in the menu with Online orders , Online payments , Returns , Reviews , Newsletter , Coupons , Text messages , Shop settings and Open the shop . Staff need the Operations area to use them. What a visitor sees on the first page From top to bottom, the first page of the shop shows: an announcement bar (a short message, optionally a link); the header with the shop name or logo, a search box, the cart, Sign in and Staff Login ; the banner : your pictures sliding one after the other, with a title, a text and a button; four rows of products you choose: Featured products , Best-selling products , Special offers and discounts and New arrivals . Each row slides left and right by itself and by the arrows; Customer reviews and the shop's average rating (real reviews only, see below); a newsletter sign-up; the footer with quick links, contact details, opening hours, an \"about\" text and links to your social pages; below the rows, All products with the category buttons. A part with nothing to show (no featured product, no review yet, no announcement) is simply left out. When a visitor searches or picks a category, the page goes straight to the matching products. Setting up the shop (manager) Open Online Store > Shop settings . Products on the shop Search a product and press Add . Only products you add here are shown or sold online. For each product you can set: Title on the shop and Online price (leave the price empty to use the normal price; an online price below the normal price shows the normal price crossed out as an offer); Order : the lower number comes first; Shown : untick to hide the product for a while; the four row ticks Featured , Best seller , Offer and New : the shop never picks products by itself, you decide which products appear in each row (up to 8 per row; the first three rows follow the Order number, New arrivals shows the most recently added first). Press Save at the end of the product's card. The picture is the product's own picture: add one on the product screen. Under every product the screen shows where its stock figure comes from (see Why does the shop say \"Sold out\"? below). Front page wording In Front page write what the first page says. Everything is optional. Announcement bar and its link ; Banner title , Banner text , Banner button text and Banner button link (empty = down to the products). Banner pictures : choose up to 8 pictures (JPEG, PNG, WebP or GIF, 8 MB each; you can choose several at once). Use the arrows to put them in order and Remove to take one away. They slide every few seconds on the shop, and a visitor can use the arrows, the dots, or swipe. A wide picture, about 1600 × 600 pixels, looks best. With no picture the banner is a plain colour. About the shop , Contact e-mail and Opening hours for the footer. Footer links and Social links : one per line, written Label|address , for example Delivery|/shop or Facebook|https://facebook.com/yourshop . At most 8 and 6. An address must start with / (a page of this site), https:// , http:// , mailto: or tel: ; anything else is refused. Press Save the front page , then Open the shop to look at it. Delivery, pick-up and the rest Delivery areas : add each area you deliver to, with its Fee and an optional Minimum order . With no area the shop delivers anywhere for free. With areas, the customer chooses one. The shop : choose the Service product for the delivery fee (a service product, ideally without tax added on top), set Delivery , Pick-up and Pay cash on delivery or at pick-up , the Pick-up address , the Minimum order , Free delivery from an amount, and Units kept back for the till (the shop sells that many fewer than you hold, so the last unit is not sold twice). Customer accounts , Text messages , Returns (how many days after completion a customer may return goods; 0 = no returns through the shop) and Online payments are switched on here too. Your administrator sets up the providers (Administrator Manual, chapter 7). Tick Shop is open to the public and Save settings . Use Pause orders for now to stop taking orders without taking the page down; the message you write is shown to visitors. Press Open the shop and place a test order before telling customers. Tip: Prices on the shop include tax. Customers see stock only as Few left (5 or fewer) or Sold out , never as a number. Why does the shop say \"Sold out\"? You do not need a separate stock for the shop. The shop uses the same stock as the till and the warehouses: stock in the sellable locations of your warehouses − quantities reserved on confirmed sales orders − the shop's buffer (\"Units kept back for the till\", 1 unless you changed it) = what the shop may still sell The line under each product in Products on the shop shows these four numbers. When the last one is 0 or less the shop says Sold out . If the line says Stock is not tracked for this product , the shop always shows it as available. When a product says sold out and you believe you have stock, look for: What you see Usual reason What to do The last number is exactly 0 and the first is 1 The buffer of 1 Lower Units kept back for the till to 0 in the shop settings The first number is 0 but the product has stock The stock sits in a location that is not sellable ( Receiving , Damaged , an inactive location) or was never entered per warehouse Open Inventory and the product's stock; move the goods to a sales location with a stock transfer (see the chapter on Inventory) The first number is high and the second is high too The goods are already promised on confirmed sales orders, including accepted online orders Complete or cancel those orders, or add stock Stock that arrives on a purchase receipt sits in the Receiving location until it is moved to a Sales location. What the customer does The customer opens /shop , searches or picks a category, adds products to the cart, and presses Proceed to checkout . They choose Delivery or Pick-up , give a name and a phone number (an e-mail address is optional), and for delivery an area and an address. Then they choose how to pay: Cash on delivery or Cash at pick-up . After Place order the order reaches you at once. Mobile money (they type the number to pay from and approve on their phone) or Card . After Place order and pay the order reaches you only once the payment is confirmed . A coupon code can be typed and checked with Apply before ordering (when you have an active coupon). When text messages are on, a box offers updates about the order by text (or WhatsApp). They then see an order code . The page /shop/order/<code> shows where the order is, lets them cancel it while it is new, order again , ask for a return or write reviews once it is completed. If they gave an e-mail address, they receive a message when the order is received, accepted, on its way or ready, completed or refused. A customer may also sign in (top of the shop): they type their e-mail address (or a saved phone number), receive a one-time code valid for 10 minutes, and then see their orders, keep their details and use Order again . No password is needed, and buying as a guest always works. Answering orders (staff) Open Online Store > Online orders . The tabs are New , Awaiting payment , Open , Refunds due , Completed , Rejected , Cancelled and Everything . The New tab lists orders waiting for an answer, with their number in brackets and a late mark when one has waited too long. The list refreshes by itself, so it can stay open on a counter screen. Accept creates a confirmed sale order that holds the stock. If the stock does not cover the order, the screen says so and offers Accept anyway ; the sale order is then over-promised until stock arrives. Phone the customer if you are unsure. An order paid online is already paid: there is no cash to collect. Reject needs a reason; the customer sees it. An order paid online and rejected shows under Refunds due . Mark packed (optional), then Out for delivery for a delivery or Ready for pick-up for a pick-up. The customer is told. Complete when the goods are handed over. This takes the stock out through the sale order, issues the invoice, and records the payment. For a cash order tick Cash collected unless the customer has not paid yet; choose Take stock from a location if your business uses several warehouses. Cancel order (accepted but not completed, for example nobody answered the door) cancels the sale order and releases the stock. Awaiting payment lists orders whose customer has not paid yet. They come to New when the payment is confirmed, and are cancelled by themselves after a day. A payment the customer does not approve within Minutes the customer has to pay (30 unless changed in the shop settings) expires, and the customer can try again from the order page. A discount from a coupon is shown on the order ( Coupon ... : ... off the items , or delivery fee waived ). History lists every step with who did it and when. Refunds of online payments When a customer who paid online cancels, or you reject the order, the order moves to Refunds due . Open it and press Refund through the provider to give the money back through the payment provider. If the provider cannot do it, refund by hand outside the program, type the reference of your refund and press I refunded it myself . Once an order is completed, goods coming back go through Returns (below). Online payments (report) Online Store > Online payments lists every online payment for a period, with cards for Paid , In the books , Held for open orders , Refunds due , Refunded , To review and Failed or expired . A payment is recorded in the books as a payment on the invoice when the order is completed; until then it is held for the order. Use the filters to see what needs a person: Under review : money arrived that needs a person, for example a different amount than the order, or a second payment for the same order. Look at it, deal with it (for instance refund the extra), write what you did and press Mark as dealt with . Refunds due (press Go to the orders to refund it ) and Stuck pending (a payment still pending long after it should have closed). Coupons Online Store > Coupons holds the codes a customer types at checkout. When at least one coupon is active, the shop shows a coupon box. A coupon gives Percent off the items (with an optional Never more than amount), Amount off the items , or Free delivery . Optional limits: Minimum order , Valid from , Valid until , Orders it can be used on , and Once per customer (the same phone number or account). A rejected or cancelled order gives its use back. The discount is part of the sale order and the invoice, so the invoice always equals what the customer paid. One coupon per order, and it applies to the whole order, not to one product. Returns A customer can ask to return goods from a completed order, within the number of days set in the shop settings (14 unless changed), from their order page. They choose the items and quantities, give a reason and the phone number of the order (not needed when signed in). Open Online Store > Returns . The Waiting tab lists new requests. Press Approve or Refuse (a note for the customer is needed to refuse). When the customer has brought the goods back, press Goods received: put back and refund (the To refund tab), choose where the goods go back in, and give the money back: Refund through the provider for an online payment, or the same by hand with its reference; for a cash order the screen says how much cash to hand back. The goods go back into stock through a normal sale order return, so stock, revenue and reports follow. A coupon discount follows the goods (the customer gets back what they paid for them); the delivery fee is not refunded . The customer is e-mailed at each step. Exchanges, store credit and restocking fees are not part of this screen. Reviews A customer whose order is completed can review each product of that order from the order page (a rating of 1 to 5 stars and optional words), using the phone number of the order or their account. One review per product per order. Only real reviews exist: you cannot add one yourself. Open Online Store > Reviews . A new review is Waiting : press Approve to show it on the shop, Hide to keep it but not show it, or Delete to remove it for good. Only approved reviews are shown and counted in the stars of a product and of the shop. The newest approved reviews with words appear on the first page. Newsletter Visitors can ask for your newsletter at the bottom of the first page. The shop sends them an e-mail with a link; they are counted only after they open it. Open Online Store > Newsletter to see the list ( Subscribed , Not confirmed , Unsubscribed ), to Remove an address, and to Download confirmed addresses (CSV) , with each person's own unsubscribe link, for a mailing tool. Note: The program does not send newsletters itself. The downloaded file has four columns: email , language , confirmed_at and unsubscribe_link . Import it into your own mailing tool and put each person's unsubscribe_link in every message (most tools call this a merge field). The link opens a page that unsubscribes that person at once, and they no longer appear in the next download, so download the list again before each mailing. A person can also unsubscribe from the page they see right after confirming, and you can Remove an address here when someone asks. The newsletter needs the e-mail settings of the business to be working (Administrator Manual, chapter 9). Links in the file use app.frontend-url (Administrator Manual, chapter 7). Text messages When your administrator has chosen a text provider, the shop can text customers about their order (only those who ticked the box at checkout), text sign-in codes, and text you about new orders. Online Store > Text messages lists every text, also the ones that failed or were not sent, and has a Send test message form. There is a daily limit to keep the cost in check. Good to know Online orders from a phone number that already exists in Customers attach to that customer; otherwise a customer is created. A customer may have only a few orders waiting for an answer at once, and a script that sends many orders from one connection is slowed down. These limits are in Shop settings . Not built yet: loyalty points on online orders, abandoned-cart reminders, and a sales report just for online orders (online orders appear in the normal sales reports). "}, {"id": "user-24-glossary-and-common-questions", "manual": "user", "n": 24, "title": "Glossary and common\nquestions", "html": "\n<h2 id=\"glossary\">Glossary<\/h2>\n<div class=\"tablewrap\"><table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Term<\/th>\n<th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>Online order<\/strong><\/td>\n<td>An order a customer placed on the public shop at <code>/shop<\/code>.\nIt waits for staff, then becomes a sale order.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Sellable now<\/strong><\/td>\n<td>What the online shop may still sell of a product: stock in sellable\nwarehouse locations, minus quantities reserved on confirmed sales\norders, minus the shop's buffer.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Buffer (Units kept back for the till)<\/strong><\/td>\n<td>The number of units per product the shop never sells, so the last\nunit is not sold twice. 1 unless changed.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Coupon<\/strong><\/td>\n<td>A code a customer types at checkout on the online shop for a\npercentage or amount off the items, or free delivery.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Webhook<\/strong><\/td>\n<td>The address a payment provider calls to say a payment was made. The\nshop also checks pending payments itself.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Register<\/strong><\/td>\n<td>A physical till.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Session / Shift<\/strong><\/td>\n<td>One working period on a register, opened with a float and closed\nwith a count.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Float<\/strong><\/td>\n<td>The cash put in the drawer at the start of a shift.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>X report / Z report<\/strong><\/td>\n<td>A mid-shift snapshot (X) and the closing, numbered report (Z).<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Void<\/strong><\/td>\n<td>Cancelling a document before or instead of correcting it; leaves a\ntrail.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Credit note<\/strong><\/td>\n<td>A document that reduces what a customer owes, issued when an invoice\nis voided or cancelled.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Quotation / Sale order / Invoice<\/strong><\/td>\n<td>An offer / a confirmed order / a request for payment.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Bill<\/strong><\/td>\n<td>A supplier's invoice to you.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>GRN<\/strong><\/td>\n<td>Goods received note, printed when stock is received.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>BOM<\/strong><\/td>\n<td>Bill of materials: the recipe for a manufactured product.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>SKU<\/strong><\/td>\n<td>Stock keeping unit: a product's own code.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Landed cost<\/strong><\/td>\n<td>Freight, duty and clearing added to the cost of goods received.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Reorder level<\/strong><\/td>\n<td>The stock level at which a product should be re-bought.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Warehouse / Location<\/strong><\/td>\n<td>A place stock is kept, and a shelf or area inside it (Receiving,\nSales, Storage, Damaged).<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Branch<\/strong><\/td>\n<td>A business location for reporting: sales, purchases and expenses are\ntagged with it.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Cost center<\/strong><\/td>\n<td>A tag (department, project) for cost reporting.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Chart of accounts<\/strong><\/td>\n<td>The list of accounts the ledger posts to.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Journal entry<\/strong><\/td>\n<td>A set of debit and credit lines that balance.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Approver / Manager PIN<\/strong><\/td>\n<td>A person with the right to approve; their PIN confirms it at your\nscreen.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Accrual / Depreciation<\/strong><\/td>\n<td>Recognising a cost when incurred / spreading an asset's cost over\nits life.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>ADR / RevPAR<\/strong><\/td>\n<td>Average daily rate / revenue per available room (hotels).<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>SLA<\/strong><\/td>\n<td>A promised reply or resolution time (Help Desk deadlines).<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>MRR / Churn<\/strong><\/td>\n<td>Monthly recurring revenue / share of subscriptions lost\n(Subscriptions).<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Trust account<\/strong><\/td>\n<td>The account holding a client's money, separate from the firm's (Law\nfirm).<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"common-questions\">Common questions<\/h2>\n<p><strong>I cannot see a menu item mentioned in this manual.<\/strong>\nYour business may not use that module, or your role does not include it.\nAsk your administrator.<\/p>\n<p><strong>I made a mistake on an invoice.<\/strong> If it is still a\ndraft, edit or delete it. If it is issued, void it (or cancel and credit\nit if payments exist) and create it again.<\/p>\n<p><strong>A sale was refused because of stock.<\/strong> Stock may be\nlow and negative stock is not allowed. Receive or adjust stock first, or\nask a manager.<\/p>\n<p><strong>A discount asks for a manager.<\/strong> The discount is above\nyour allowed limit. A manager types their PIN on your screen.<\/p>\n<p><strong>The till shows Offline.<\/strong> Keep selling; sales queue\nand sync automatically when the connection returns. Do not clear browser\ndata meanwhile.<\/p>\n<p><strong>I forgot my password or PIN.<\/strong> Use <em>Forgot\npassword?<\/em> if your e-mail is on your profile; otherwise ask an\nadministrator. Change your own PIN in <strong>My profile<\/strong>.<\/p>\n<p><strong>How do I get the numbers out to Excel?<\/strong> Every list\nand report has <strong>Excel, PDF and CSV<\/strong> buttons; they export\nexactly what is on screen, with the same filters.<\/p>\n<p><strong>Who changed this?<\/strong> Ask an administrator to check the\n<strong>Audit Log<\/strong>; most important actions are recorded with the\nperson and time.<\/p>\n", "text": " Glossary Term Meaning Online order An order a customer placed on the public shop at /shop . It waits for staff, then becomes a sale order. Sellable now What the online shop may still sell of a product: stock in sellable warehouse locations, minus quantities reserved on confirmed sales orders, minus the shop's buffer. Buffer (Units kept back for the till) The number of units per product the shop never sells, so the last unit is not sold twice. 1 unless changed. Coupon A code a customer types at checkout on the online shop for a percentage or amount off the items, or free delivery. Webhook The address a payment provider calls to say a payment was made. The shop also checks pending payments itself. Register A physical till. Session / Shift One working period on a register, opened with a float and closed with a count. Float The cash put in the drawer at the start of a shift. X report / Z report A mid-shift snapshot (X) and the closing, numbered report (Z). Void Cancelling a document before or instead of correcting it; leaves a trail. Credit note A document that reduces what a customer owes, issued when an invoice is voided or cancelled. Quotation / Sale order / Invoice An offer / a confirmed order / a request for payment. Bill A supplier's invoice to you. GRN Goods received note, printed when stock is received. BOM Bill of materials: the recipe for a manufactured product. SKU Stock keeping unit: a product's own code. Landed cost Freight, duty and clearing added to the cost of goods received. Reorder level The stock level at which a product should be re-bought. Warehouse / Location A place stock is kept, and a shelf or area inside it (Receiving, Sales, Storage, Damaged). Branch A business location for reporting: sales, purchases and expenses are tagged with it. Cost center A tag (department, project) for cost reporting. Chart of accounts The list of accounts the ledger posts to. Journal entry A set of debit and credit lines that balance. Approver / Manager PIN A person with the right to approve; their PIN confirms it at your screen. Accrual / Depreciation Recognising a cost when incurred / spreading an asset's cost over its life. ADR / RevPAR Average daily rate / revenue per available room (hotels). SLA A promised reply or resolution time (Help Desk deadlines). MRR / Churn Monthly recurring revenue / share of subscriptions lost (Subscriptions). Trust account The account holding a client's money, separate from the firm's (Law firm). Common questions I cannot see a menu item mentioned in this manual. Your business may not use that module, or your role does not include it. Ask your administrator. I made a mistake on an invoice. If it is still a draft, edit or delete it. If it is issued, void it (or cancel and credit it if payments exist) and create it again. A sale was refused because of stock. Stock may be low and negative stock is not allowed. Receive or adjust stock first, or ask a manager. A discount asks for a manager. The discount is above your allowed limit. A manager types their PIN on your screen. The till shows Offline. Keep selling; sales queue and sync automatically when the connection returns. Do not clear browser data meanwhile. I forgot my password or PIN. Use Forgot password? if your e-mail is on your profile; otherwise ask an administrator. Change your own PIN in My profile . How do I get the numbers out to Excel? Every list and report has Excel, PDF and CSV buttons; they export exactly what is on screen, with the same filters. Who changed this? Ask an administrator to check the Audit Log ; most important actions are recorded with the person and time. "}, {"id": "cards-1-cashier", "manual": "cards", "n": 1, "title": "Cashier", "html": "\n<p><em>Sell, take payment, count the till.<\/em><\/p>\n<h2 id=\"start-of-shift\">Start of shift<\/h2>\n<ul>\n<li>Your supervisor opens the session on your register with the opening\nfloat (POS &gt; Registers &amp; Terminal &gt; Open session).<\/li>\n<li>Press <strong>Go to terminal<\/strong> and type your\n<strong>PIN<\/strong>.<\/li>\n<\/ul>\n<h2 id=\"selling\">Selling<\/h2>\n<ul>\n<li>Scan the barcode or tap a product tile. Search by name or SKU if\nneeded.<\/li>\n<li>Choose or add the <strong>customer<\/strong> if needed (credit,\nloyalty points).<\/li>\n<li>Press <strong>Payment<\/strong>, pick the method (split across\nseveral if needed), complete the sale.<\/li>\n<li>A discount over your limit, a void or a hand-changed price needs a\n<strong>manager's PIN<\/strong>.<\/li>\n<\/ul>\n<h2 id=\"returns-and-mistakes\">Returns and mistakes<\/h2>\n<ul>\n<li><strong>Receipts<\/strong> shows this shift's sales with <strong>View\n/ Reprint<\/strong> (reprints are marked COPY).<\/li>\n<li>A return: <strong>Process a return<\/strong>, type the invoice\nnumber, choose items, refund method and reason.<\/li>\n<\/ul>\n<h2 id=\"cash\">Cash<\/h2>\n<ul>\n<li>Press <strong>Cash<\/strong> for paid-in, paid-out and safe drops.\nDrop cash into the safe when the drawer is heavy.<\/li>\n<li><strong>X report<\/strong> any time; it changes nothing.<\/li>\n<\/ul>\n<h2 id=\"end-of-shift\">End of shift<\/h2>\n<ul>\n<li>Record paid-in, paid-out and drops first. Open the close screen,\n<strong>count the drawer<\/strong> by notes and coins, explain any\ndifference, <strong>Close session<\/strong>, print the <strong>Z\nreport<\/strong>.<\/li>\n<\/ul>\n<h2 id=\"if-the-connection-drops\">If the connection drops<\/h2>\n<ul>\n<li>Keep selling: sales are queued and sync by themselves. Do not clear\nthe browser or close it while the offline queue has sales.<\/li>\n<\/ul>\n<div class=\"callout note\">\n<p><strong>Need more?<\/strong> See the matching chapter of the User\nManual, or ask your administrator.<\/p>\n<\/div>\n", "text": " Sell, take payment, count the till. Start of shift Your supervisor opens the session on your register with the opening float (POS > Registers & Terminal > Open session). Press Go to terminal and type your PIN . Selling Scan the barcode or tap a product tile. Search by name or SKU if needed. Choose or add the customer if needed (credit, loyalty points). Press Payment , pick the method (split across several if needed), complete the sale. A discount over your limit, a void or a hand-changed price needs a manager's PIN . Returns and mistakes Receipts shows this shift's sales with View / Reprint (reprints are marked COPY). A return: Process a return , type the invoice number, choose items, refund method and reason. Cash Press Cash for paid-in, paid-out and safe drops. Drop cash into the safe when the drawer is heavy. X report any time; it changes nothing. End of shift Record paid-in, paid-out and drops first. Open the close screen, count the drawer by notes and coins, explain any difference, Close session , print the Z report . If the connection drops Keep selling: sales are queued and sync by themselves. Do not clear the browser or close it while the offline queue has sales. Need more? See the matching chapter of the User Manual, or ask your administrator. "}, {"id": "cards-2-shift-supervisor-and-manager", "manual": "cards", "n": 2, "title": "Shift supervisor and manager", "html": "\n<p><em>Open and close tills, approve exceptions, watch for\nloss.<\/em><\/p>\n<h2 id=\"open-and-close\">Open and close<\/h2>\n<ul>\n<li><strong>POS &gt; Registers &amp; Terminal &gt; Open\nsession<\/strong>: assign the cashier, enter the float.<\/li>\n<li><strong>POS &gt; Shifts<\/strong>: see every shift with variance;\n<strong>Force close<\/strong> or <strong>Close all sessions<\/strong> if\nsomeone left without closing.<\/li>\n<\/ul>\n<h2 id=\"approvals-at-the-till\">Approvals at the till<\/h2>\n<ul>\n<li>Type your <strong>PIN<\/strong> on the cashier's screen to approve a\nlarge discount, a void, an old return, a changed price or a big\npaid-out. Your name is recorded as the approver.<\/li>\n<\/ul>\n<h2 id=\"daily-review\">Daily review<\/h2>\n<ul>\n<li><strong>POS &gt; Voids &amp; returns<\/strong>: every void, return,\ndiscount, price change and reprint, with who approved.<\/li>\n<li><strong>POS &gt; Cash movements<\/strong> and each shift's\nvariance.<\/li>\n<li>Reports: <strong>POS Exceptions<\/strong>, <strong>POS Shift\nComparison<\/strong>, <strong>POS Sales by Cashier<\/strong>.<\/li>\n<\/ul>\n<h2 id=\"restaurant-managers\">Restaurant managers<\/h2>\n<ul>\n<li><strong>End of day<\/strong>: settle open orders, count the drawer,\nclose the day (Z report).<\/li>\n<li><strong>Voids &amp; comps<\/strong> log; <strong>Wastage<\/strong>\nconfirmations.<\/li>\n<\/ul>\n<h2 id=\"remember\">Remember<\/h2>\n<ul>\n<li>You see the dashboard's <strong>Needs your attention<\/strong> list:\nact on overdue items, low stock and pending approvals.<\/li>\n<\/ul>\n<div class=\"callout note\">\n<p><strong>Need more?<\/strong> See the matching chapter of the User\nManual, or ask your administrator.<\/p>\n<\/div>\n", "text": " Open and close tills, approve exceptions, watch for loss. Open and close POS > Registers & Terminal > Open session : assign the cashier, enter the float. POS > Shifts : see every shift with variance; Force close or Close all sessions if someone left without closing. Approvals at the till Type your PIN on the cashier's screen to approve a large discount, a void, an old return, a changed price or a big paid-out. Your name is recorded as the approver. Daily review POS > Voids & returns : every void, return, discount, price change and reprint, with who approved. POS > Cash movements and each shift's variance. Reports: POS Exceptions , POS Shift Comparison , POS Sales by Cashier . Restaurant managers End of day : settle open orders, count the drawer, close the day (Z report). Voids & comps log; Wastage confirmations. Remember You see the dashboard's Needs your attention list: act on overdue items, low stock and pending approvals. Need more? See the matching chapter of the User Manual, or ask your administrator. "}, {"id": "cards-3-sales-clerk", "manual": "cards", "n": 3, "title": "Sales clerk", "html": "\n<p><em>Quote, order, invoice and get paid.<\/em><\/p>\n<h2 id=\"the-path\">The path<\/h2>\n<ul>\n<li><strong>Quotation<\/strong> (offer) then <strong>Sale order<\/strong>\n(agreed) then <strong>Fulfil<\/strong> (deliver) then\n<strong>Invoice<\/strong> then <strong>Record payment<\/strong>. You can\nstart at any step.<\/li>\n<\/ul>\n<h2 id=\"quotation-or-order\">Quotation or order<\/h2>\n<ul>\n<li>Sales &gt; Quotations or Sale orders &gt; <strong>New<\/strong>.\nChoose the customer (or <strong>+ New customer<\/strong>), add products\nby name, SKU or code, check the totals, <strong>Save\ndraft<\/strong>.<\/li>\n<li>On a quotation: <strong>Send to customer<\/strong>, <strong>Mark\naccepted<\/strong>, <strong>Convert to sale order<\/strong>.<\/li>\n<li>On an order: <strong>Confirm<\/strong>, <strong>Fulfil\norder<\/strong>, <strong>Generate invoice<\/strong>.<\/li>\n<\/ul>\n<h2 id=\"invoice\">Invoice<\/h2>\n<ul>\n<li><strong>Issue invoice<\/strong> makes it official. <strong>Record\npayment<\/strong> (part payments are fine).<\/li>\n<li>Wrong invoice? Draft: edit or delete. Issued: <strong>Void\ninvoice<\/strong>, or <strong>Cancel &amp; credit invoice<\/strong> if\npayments exist.<\/li>\n<\/ul>\n<h2 id=\"customers\">Customers<\/h2>\n<ul>\n<li><strong>Customers &gt; Collections<\/strong> shows who owes and for\nhow long; tick customers and <strong>Send reminder<\/strong>.<\/li>\n<li><strong>Customer statement<\/strong> for any customer and\nperiod.<\/li>\n<\/ul>\n<h2 id=\"prices\">Prices<\/h2>\n<ul>\n<li>Customers in a <strong>customer group<\/strong> get the group's\n<strong>price list<\/strong> automatically. A price you type by hand is\nnever replaced.<\/li>\n<\/ul>\n<div class=\"callout note\">\n<p><strong>Need more?<\/strong> See the matching chapter of the User\nManual, or ask your administrator.<\/p>\n<\/div>\n", "text": " Quote, order, invoice and get paid. The path Quotation (offer) then Sale order (agreed) then Fulfil (deliver) then Invoice then Record payment . You can start at any step. Quotation or order Sales > Quotations or Sale orders > New . Choose the customer (or + New customer ), add products by name, SKU or code, check the totals, Save draft . On a quotation: Send to customer , Mark accepted , Convert to sale order . On an order: Confirm , Fulfil order , Generate invoice . Invoice Issue invoice makes it official. Record payment (part payments are fine). Wrong invoice? Draft: edit or delete. Issued: Void invoice , or Cancel & credit invoice if payments exist. Customers Customers > Collections shows who owes and for how long; tick customers and Send reminder . Customer statement for any customer and period. Prices Customers in a customer group get the group's price list automatically. A price you type by hand is never replaced. Need more? See the matching chapter of the User Manual, or ask your administrator. "}, {"id": "cards-4-accountant", "manual": "cards", "n": 4, "title": "Accountant", "html": "\n<p><em>Keep the books right, close the period.<\/em><\/p>\n<h2 id=\"daily-and-weekly\">Daily and weekly<\/h2>\n<ul>\n<li><strong>Customers &gt; Collections<\/strong> and <strong>Purchases\n&gt; Payables Aging<\/strong>: chase and pay on time.<\/li>\n<li>Approve <strong>Expenses<\/strong> (Expenses &gt; Expenses &gt; tick,\n<strong>Approve selected<\/strong>); check <strong>Overview<\/strong> for\nbills overdue or due soon.<\/li>\n<li>Record <strong>supplier payments<\/strong> with the oldest-first\nsuggestion.<\/li>\n<\/ul>\n<h2 id=\"month-end\">Month end<\/h2>\n<ul>\n<li>Review the <strong>Trial Balance<\/strong>, <strong>Income\nStatement<\/strong>, <strong>Balance Sheet<\/strong>, <strong>Cash\nFlow<\/strong>; run the <strong>Tax Report<\/strong>.<\/li>\n<li><strong>Accounting &gt; Controls &gt; Bank reconciliation<\/strong>:\nenter the statement date and balance, tick matching lines until the\ndifference is zero.<\/li>\n<li>Post depreciation (<strong>Assets &gt; Run depreciation<\/strong>)\nand any manual <strong>journal entries<\/strong> (debits = credits).<\/li>\n<li><strong>Close the books<\/strong> up to the month end (admin).<\/li>\n<\/ul>\n<h2 id=\"rules-to-remember\">Rules to remember<\/h2>\n<ul>\n<li>Do not edit posted entries; reverse or void the source\ndocument.<\/li>\n<li>Freight on a purchase goes in the receipt's <strong>Landed\ncost<\/strong>, not in a separate expense.<\/li>\n<li>Gift card money is owed (liability) until the card is spent.<\/li>\n<\/ul>\n<h2 id=\"payroll\">Payroll<\/h2>\n<ul>\n<li>Run payroll monthly, <strong>Approve and post<\/strong>, pay by the\nbank file, record tax and social-security payments. Rates are a starting\npoint: confirm with your accountant.<\/li>\n<\/ul>\n<div class=\"callout note\">\n<p><strong>Need more?<\/strong> See the matching chapter of the User\nManual, or ask your administrator.<\/p>\n<\/div>\n", "text": " Keep the books right, close the period. Daily and weekly Customers > Collections and Purchases > Payables Aging : chase and pay on time. Approve Expenses (Expenses > Expenses > tick, Approve selected ); check Overview for bills overdue or due soon. Record supplier payments with the oldest-first suggestion. Month end Review the Trial Balance , Income Statement , Balance Sheet , Cash Flow ; run the Tax Report . Accounting > Controls > Bank reconciliation : enter the statement date and balance, tick matching lines until the difference is zero. Post depreciation ( Assets > Run depreciation ) and any manual journal entries (debits = credits). Close the books up to the month end (admin). Rules to remember Do not edit posted entries; reverse or void the source document. Freight on a purchase goes in the receipt's Landed cost , not in a separate expense. Gift card money is owed (liability) until the card is spent. Payroll Run payroll monthly, Approve and post , pay by the bank file, record tax and social-security payments. Rates are a starting point: confirm with your accountant. Need more? See the matching chapter of the User Manual, or ask your administrator. "}, {"id": "cards-5-store-keeper", "manual": "cards", "n": 5, "title": "Store keeper", "html": "\n<p><em>Know what you have and where it is.<\/em><\/p>\n<h2 id=\"receiving\">Receiving<\/h2>\n<ul>\n<li><strong>Purchases &gt; Purchase orders<\/strong>, open the order,\n<strong>Record a receipt<\/strong>: quantities now, batch/lot or serial\nnumbers, <strong>Landed cost<\/strong>. Print the GRN.<\/li>\n<li>Goods land in the warehouse's <strong>Receiving<\/strong> location.\nMove them to a <strong>Sales<\/strong> location with a <strong>Stock\ntransfer<\/strong>.<\/li>\n<\/ul>\n<h2 id=\"corrections\">Corrections<\/h2>\n<ul>\n<li><strong>Stock adjustments &gt; New<\/strong>: product, quantity\nchange (+/-), reason. It stays <em>logged<\/em> until an approver presses\n<strong>Confirm<\/strong>.<\/li>\n<li><strong>Stock counts<\/strong>: <strong>Start a stock count<\/strong>,\nprint the sheet, enter counted quantities, <strong>Submit for\napproval<\/strong>.<\/li>\n<\/ul>\n<h2 id=\"reorder\">Reorder<\/h2>\n<ul>\n<li><strong>Inventory &gt; Reorder<\/strong> lists what is at or below\nits reorder level. <strong>Create requisition<\/strong> to turn it into a\npurchase request.<\/li>\n<\/ul>\n<h2 id=\"moving-stock\">Moving stock<\/h2>\n<ul>\n<li><strong>Stock transfers &gt; New<\/strong>: product, from and to\nlocations, quantity. Between branches, the receiver presses\n<strong>Receive<\/strong> and records any shortage.<\/li>\n<\/ul>\n<h2 id=\"look-it-up\">Look it up<\/h2>\n<ul>\n<li>Product page &gt; <strong>Stock movement history<\/strong>. Reports:\nStock On Hand &amp; Valuation, Expiring Stock, Dead Stock.<\/li>\n<\/ul>\n<div class=\"callout note\">\n<p><strong>Need more?<\/strong> See the matching chapter of the User\nManual, or ask your administrator.<\/p>\n<\/div>\n", "text": " Know what you have and where it is. Receiving Purchases > Purchase orders , open the order, Record a receipt : quantities now, batch/lot or serial numbers, Landed cost . Print the GRN. Goods land in the warehouse's Receiving location. Move them to a Sales location with a Stock transfer . Corrections Stock adjustments > New : product, quantity change (+/-), reason. It stays logged until an approver presses Confirm . Stock counts : Start a stock count , print the sheet, enter counted quantities, Submit for approval . Reorder Inventory > Reorder lists what is at or below its reorder level. Create requisition to turn it into a purchase request. Moving stock Stock transfers > New : product, from and to locations, quantity. Between branches, the receiver presses Receive and records any shortage. Look it up Product page > Stock movement history . Reports: Stock On Hand & Valuation, Expiring Stock, Dead Stock. Need more? See the matching chapter of the User Manual, or ask your administrator. "}, {"id": "cards-6-purchasing-officer", "manual": "cards", "n": 6, "title": "Purchasing officer", "html": "\n<p><em>Order, track and pay suppliers.<\/em><\/p>\n<h2 id=\"order\">Order<\/h2>\n<ul>\n<li><strong>Purchase requisitions<\/strong> to ask, <strong>Purchase\norders &gt; New<\/strong> to buy: supplier, expected date, receive-into\nwarehouse, lines with unit cost.<\/li>\n<li><strong>Send to supplier<\/strong> by e-mail or\n<strong>Print<\/strong>.<\/li>\n<\/ul>\n<h2 id=\"receive-and-bill\">Receive and bill<\/h2>\n<ul>\n<li>Partial deliveries are fine. When fully received a\n<strong>Bill<\/strong> is generated. <strong>Issue bill<\/strong>, then\n<strong>Record payment<\/strong>.<\/li>\n<li>Wrong goods? <strong>Process a return<\/strong> on the order.<\/li>\n<\/ul>\n<h2 id=\"pay\">Pay<\/h2>\n<ul>\n<li><strong>Suppliers &gt; Record payment<\/strong>: amount, then\n<strong>Suggest oldest-first<\/strong> to allocate. Print the\nreceipt.<\/li>\n<\/ul>\n<h2 id=\"prices\">Prices<\/h2>\n<ul>\n<li><strong>Supplier prices<\/strong> keep agreed costs with validity\ndates.<\/li>\n<\/ul>\n<h2 id=\"reports\">Reports<\/h2>\n<ul>\n<li>Outstanding Payables, Payables Aging, Purchases by Supplier or\nProduct.<\/li>\n<\/ul>\n<div class=\"callout note\">\n<p><strong>Need more?<\/strong> See the matching chapter of the User\nManual, or ask your administrator.<\/p>\n<\/div>\n", "text": " Order, track and pay suppliers. Order Purchase requisitions to ask, Purchase orders > New to buy: supplier, expected date, receive-into warehouse, lines with unit cost. Send to supplier by e-mail or Print . Receive and bill Partial deliveries are fine. When fully received a Bill is generated. Issue bill , then Record payment . Wrong goods? Process a return on the order. Pay Suppliers > Record payment : amount, then Suggest oldest-first to allocate. Print the receipt. Prices Supplier prices keep agreed costs with validity dates. Reports Outstanding Payables, Payables Aging, Purchases by Supplier or Product. Need more? See the matching chapter of the User Manual, or ask your administrator. "}, {"id": "cards-7-restaurant-waiter", "manual": "cards", "n": 7, "title": "Restaurant waiter", "html": "\n<p><em>Take orders, send to kitchen, bill the table.<\/em><\/p>\n<h2 id=\"open-a-table\">Open a table<\/h2>\n<ul>\n<li>Floor plan &gt; tap a free table &gt; enter <strong>Guests<\/strong>\n&gt; <strong>Open order<\/strong>. Note <strong>allergies<\/strong>.<\/li>\n<\/ul>\n<h2 id=\"order\">Order<\/h2>\n<ul>\n<li>Tap menu items; choose options; add a <strong>note for the\nkitchen<\/strong>; set <strong>Seat<\/strong> and\n<strong>Course<\/strong>.<\/li>\n<li><strong>Send to kitchen<\/strong>. Later courses wait <em>on\nhold<\/em> until you <strong>Fire course<\/strong>.<\/li>\n<\/ul>\n<h2 id=\"changes\">Changes<\/h2>\n<ul>\n<li>After an item is sent, removing it needs a <strong>manager<\/strong>\nand a reason (<strong>Void it<\/strong>). <strong>Give free<\/strong>\nneeds a reason.<\/li>\n<li><strong>Move table<\/strong>, <strong>Merge into<\/strong>,\n<strong>Split / move items<\/strong> for guests who pay separately.<\/li>\n<\/ul>\n<h2 id=\"bill-and-pay\">Bill and pay<\/h2>\n<ul>\n<li><strong>Bill<\/strong> prints the pre-bill.\n<strong>Checkout<\/strong>: add payments (split equally, by item or by\nshares), choose the <strong>tip<\/strong>, or <strong>Charge to\nroom<\/strong> for hotel guests. Give back the change shown.<\/li>\n<\/ul>\n<div class=\"callout note\">\n<p><strong>Need more?<\/strong> See the matching chapter of the User\nManual, or ask your administrator.<\/p>\n<\/div>\n", "text": " Take orders, send to kitchen, bill the table. Open a table Floor plan > tap a free table > enter Guests > Open order . Note allergies . Order Tap menu items; choose options; add a note for the kitchen ; set Seat and Course . Send to kitchen . Later courses wait on hold until you Fire course . Changes After an item is sent, removing it needs a manager and a reason ( Void it ). Give free needs a reason. Move table , Merge into , Split / move items for guests who pay separately. Bill and pay Bill prints the pre-bill. Checkout : add payments (split equally, by item or by shares), choose the tip , or Charge to room for hotel guests. Give back the change shown. Need more? See the matching chapter of the User Manual, or ask your administrator. "}, {"id": "cards-8-kitchen-and-bar", "manual": "cards", "n": 8, "title": "Kitchen and bar", "html": "\n<p><em>Prepare, mark ready, remake.<\/em><\/p>\n<h2 id=\"kitchen-display\">Kitchen display<\/h2>\n<ul>\n<li>Tickets move <strong>waiting, cooking, ready<\/strong>. <strong>Start\npreparing<\/strong>, <strong>Mark ready<\/strong>, <strong>Mark\nserved<\/strong>, <strong>Bump all<\/strong> for an order.<\/li>\n<li>Tickets turn amber then red as time runs out.\n<strong>ALLERGY<\/strong> warnings show in red.<\/li>\n<li><strong>Remake<\/strong> records a remade dish (counted in wastage\nreports).<\/li>\n<\/ul>\n<h2 id=\"sold-out\">Sold out<\/h2>\n<ul>\n<li>Press <strong>Sold out (86)<\/strong>, search the item, add a reason.\nIt disappears from the waiters' menu until switched back.<\/li>\n<\/ul>\n<h2 id=\"expo\">Expo<\/h2>\n<ul>\n<li>The pass: check an order is complete, <strong>Mark everything\nready<\/strong> or <strong>Serve<\/strong>.<\/li>\n<\/ul>\n<div class=\"callout note\">\n<p><strong>Need more?<\/strong> See the matching chapter of the User\nManual, or ask your administrator.<\/p>\n<\/div>\n", "text": " Prepare, mark ready, remake. Kitchen display Tickets move waiting, cooking, ready . Start preparing , Mark ready , Mark served , Bump all for an order. Tickets turn amber then red as time runs out. ALLERGY warnings show in red. Remake records a remade dish (counted in wastage reports). Sold out Press Sold out (86) , search the item, add a reason. It disappears from the waiters' menu until switched back. Expo The pass: check an order is complete, Mark everything ready or Serve . Need more? See the matching chapter of the User Manual, or ask your administrator. "}, {"id": "cards-9-hotel-front-desk", "manual": "cards", "n": 9, "title": "Hotel front desk", "html": "\n<p><em>Book, check in, bill, check out.<\/em><\/p>\n<h2 id=\"start-of-day\">Start of day<\/h2>\n<ul>\n<li><strong>Hotel &gt; Front desk<\/strong>: arrivals, in-house,\ndepartures, rooms to clean, out of order.<\/li>\n<\/ul>\n<h2 id=\"booking\">Booking<\/h2>\n<ul>\n<li><strong>New booking<\/strong> or <strong>Walk-in<\/strong>: choose or\nadd the guest, arrival and departure, room type and room, rate plan,\nsource, deposit.<\/li>\n<\/ul>\n<h2 id=\"check-in\">Check in<\/h2>\n<ul>\n<li>Open the booking &gt; <strong>Check in<\/strong> &gt; confirm the\nroom (the room should be clean). Print the <strong>Registration\ncard<\/strong>.<\/li>\n<\/ul>\n<h2 id=\"during-the-stay\">During the stay<\/h2>\n<ul>\n<li><strong>+ Charge<\/strong> for extras. <strong>Move room<\/strong>,\n<strong>Change departure<\/strong>.<\/li>\n<li><strong>+ Split bill / bill a company<\/strong> when someone else\npays part.<\/li>\n<\/ul>\n<h2 id=\"check-out\">Check out<\/h2>\n<ul>\n<li>Open the booking &gt; <strong>Check out<\/strong>, take payment,\n<strong>Print invoice<\/strong>.<\/li>\n<\/ul>\n<h2 id=\"remember\">Remember<\/h2>\n<ul>\n<li>VIP and blacklist flags show on the guest. Cancellation, no-show and\nlate check-out fees follow the hotel policy; the desk may waive.<\/li>\n<\/ul>\n<div class=\"callout note\">\n<p><strong>Need more?<\/strong> See the matching chapter of the User\nManual, or ask your administrator.<\/p>\n<\/div>\n", "text": " Book, check in, bill, check out. Start of day Hotel > Front desk : arrivals, in-house, departures, rooms to clean, out of order. Booking New booking or Walk-in : choose or add the guest, arrival and departure, room type and room, rate plan, source, deposit. Check in Open the booking > Check in > confirm the room (the room should be clean). Print the Registration card . During the stay + Charge for extras. Move room , Change departure . + Split bill / bill a company when someone else pays part. Check out Open the booking > Check out , take payment, Print invoice . Remember VIP and blacklist flags show on the guest. Cancellation, no-show and late check-out fees follow the hotel policy; the desk may waive. Need more? See the matching chapter of the User Manual, or ask your administrator. "}, {"id": "cards-10-hr-officer", "manual": "cards", "n": 10, "title": "HR officer", "html": "\n<p><em>People, leave, attendance and pay.<\/em><\/p>\n<h2 id=\"new-employee\">New employee<\/h2>\n<ul>\n<li><strong>Employees &gt; New employee<\/strong>; give a\n<strong>login<\/strong> so they can use My HR; set <strong>Track\nattendance for pay<\/strong> only for staff who clock in.<\/li>\n<li><strong>Contracts &gt; New<\/strong>: salary and allowances, then\n<strong>activate<\/strong> when signed.<\/li>\n<\/ul>\n<h2 id=\"every-month\">Every month<\/h2>\n<ul>\n<li>Approve <strong>Leave<\/strong> requests; correct\n<strong>Attendance<\/strong>; enter <strong>Adjustments<\/strong> (bonus,\nfine) and loans.<\/li>\n<li><strong>Payroll &gt; Run payroll for a month<\/strong>, review,\n<strong>Approve and post<\/strong>, download the <strong>bank transfer\nfile<\/strong>, <strong>Mark salaries as paid<\/strong>, e-mail\npayslips.<\/li>\n<li><strong>Record payments<\/strong> of tax and social security by their\ndue date.<\/li>\n<\/ul>\n<h2 id=\"when-someone-leaves\">When someone leaves<\/h2>\n<ul>\n<li>Employee page &gt; <strong>Employee left<\/strong>; open\n<strong>Final pay<\/strong>.<\/li>\n<\/ul>\n<h2 id=\"remember\">Remember<\/h2>\n<ul>\n<li>Check tax bands and contribution rates with your accountant. Salary\nreports are restricted to payroll access.<\/li>\n<\/ul>\n<div class=\"callout note\">\n<p><strong>Need more?<\/strong> See the matching chapter of the User\nManual, or ask your administrator.<\/p>\n<\/div>\n", "text": " People, leave, attendance and pay. New employee Employees > New employee ; give a login so they can use My HR; set Track attendance for pay only for staff who clock in. Contracts > New : salary and allowances, then activate when signed. Every month Approve Leave requests; correct Attendance ; enter Adjustments (bonus, fine) and loans. Payroll > Run payroll for a month , review, Approve and post , download the bank transfer file , Mark salaries as paid , e-mail payslips. Record payments of tax and social security by their due date. When someone leaves Employee page > Employee left ; open Final pay . Remember Check tax bands and contribution rates with your accountant. Salary reports are restricted to payroll access. Need more? See the matching chapter of the User Manual, or ask your administrator. "}, {"id": "cards-11-booking-and-reception", "manual": "cards", "n": 11, "title": "Booking and reception", "html": "\n<p><em>Appointments and walk-ins.<\/em><\/p>\n<h2 id=\"make-a-booking\">Make a booking<\/h2>\n<ul>\n<li>Booking &gt; <strong>New appointment<\/strong>: service, date,\npreferred person, a free time, who it is for. If a deposit is needed an\ninvoice holds the time; tick <strong>Confirm now<\/strong> to skip.<\/li>\n<\/ul>\n<h2 id=\"the-day\">The day<\/h2>\n<ul>\n<li><strong>Calendar<\/strong> by person or room; <strong>Print day\nsheet<\/strong>.<\/li>\n<li>On the visit: <strong>Mark done<\/strong> or\n<strong>No-show<\/strong>. <strong>Move to another time<\/strong> or\n<strong>Cancel appointment<\/strong> (unpaid invoice is voided).<\/li>\n<\/ul>\n<h2 id=\"reminders\">Reminders<\/h2>\n<ul>\n<li><strong>Send reminder now<\/strong> or <strong>Download calendar\nfile<\/strong>. Automatic reminders go out before the visit.<\/li>\n<\/ul>\n<div class=\"callout note\">\n<p><strong>Need more?<\/strong> See the matching chapter of the User\nManual, or ask your administrator.<\/p>\n<\/div>\n", "text": " Appointments and walk-ins. Make a booking Booking > New appointment : service, date, preferred person, a free time, who it is for. If a deposit is needed an invoice holds the time; tick Confirm now to skip. The day Calendar by person or room; Print day sheet . On the visit: Mark done or No-show . Move to another time or Cancel appointment (unpaid invoice is voided). Reminders Send reminder now or Download calendar file . Automatic reminders go out before the visit. Need more? See the matching chapter of the User Manual, or ask your administrator. "}, {"id": "cards-12-help-desk-agent", "manual": "cards", "n": 12, "title": "Help desk agent", "html": "\n<p><em>Answer fast, keep deadlines.<\/em><\/p>\n<h2 id=\"start\">Start<\/h2>\n<ul>\n<li><strong>Help Desk &gt; Overview<\/strong>: unanswered, overdue, due\nsoon, mine. Open <strong>Needs attention<\/strong> first.<\/li>\n<\/ul>\n<h2 id=\"work-a-ticket\">Work a ticket<\/h2>\n<ul>\n<li><strong>Reply to the customer<\/strong> (e-mailed) or add an\n<strong>Internal note<\/strong>; <strong>Insert a saved reply<\/strong>\nfor common answers.<\/li>\n<li>Waiting on the customer? <strong>Wait for customer<\/strong> pauses\nthe deadline clock.<\/li>\n<li><strong>Resolve<\/strong> with notes; <strong>Close<\/strong>;\n<strong>Reopen<\/strong> if needed.<\/li>\n<\/ul>\n<h2 id=\"housekeeping\">Housekeeping<\/h2>\n<ul>\n<li><strong>Merge into another ticket<\/strong> for duplicates. Link an\n<strong>Invoice<\/strong> or <strong>Job<\/strong>. Add\n<strong>Tags<\/strong>. Only tick <strong>Customer can see<\/strong> on\nfiles you want shared.<\/li>\n<\/ul>\n<div class=\"callout note\">\n<p><strong>Need more?<\/strong> See the matching chapter of the User\nManual, or ask your administrator.<\/p>\n<\/div>\n", "text": " Answer fast, keep deadlines. Start Help Desk > Overview : unanswered, overdue, due soon, mine. Open Needs attention first. Work a ticket Reply to the customer (e-mailed) or add an Internal note ; Insert a saved reply for common answers. Waiting on the customer? Wait for customer pauses the deadline clock. Resolve with notes; Close ; Reopen if needed. Housekeeping Merge into another ticket for duplicates. Link an Invoice or Job . Add Tags . Only tick Customer can see on files you want shared. Need more? See the matching chapter of the User Manual, or ask your administrator. "}, {"id": "cards-13-every-employee-my-hr-and-my-time", "manual": "cards", "n": 13, "title": "Every employee (My HR and My\ntime)", "html": "\n<p><em>Self-service.<\/em><\/p>\n<h2 id=\"my-hr\">My HR<\/h2>\n<ul>\n<li><strong>Clock in<\/strong> and <strong>Clock out<\/strong>.\n<strong>Request leave<\/strong> (type, dates, half days). See payslips\nonce payroll is approved, your leave balance and documents. Update your\nphone, e-mail, address and emergency contact.<\/li>\n<\/ul>\n<h2 id=\"my-time\">My time<\/h2>\n<ul>\n<li>Start the <strong>timer<\/strong> or add time by hand (type 1:30,\n1.5, 90m or 2h). At the end of the week press <strong>Submit for\napproval<\/strong>. Fix anything <strong>Sent back<\/strong>.<\/li>\n<\/ul>\n<h2 id=\"my-profile\">My profile<\/h2>\n<ul>\n<li>Change your password and your <strong>PIN<\/strong> (4 to 6 digits).\nKeep both private.<\/li>\n<\/ul>\n<div class=\"callout note\">\n<p><strong>Need more?<\/strong> See the matching chapter of the User\nManual, or ask your administrator.<\/p>\n<\/div>\n", "text": " Self-service. My HR Clock in and Clock out . Request leave (type, dates, half days). See payslips once payroll is approved, your leave balance and documents. Update your phone, e-mail, address and emergency contact. My time Start the timer or add time by hand (type 1:30, 1.5, 90m or 2h). At the end of the week press Submit for approval . Fix anything Sent back . My profile Change your password and your PIN (4 to 6 digits). Keep both private. Need more? See the matching chapter of the User Manual, or ask your administrator. "}, {"id": "cards-14-administrator", "manual": "cards", "n": 14, "title": "Administrator", "html": "\n<p><em>Set up, secure, back up.<\/em><\/p>\n<h2 id=\"first-day\">First day<\/h2>\n<ul>\n<li>Change the <strong>admin password<\/strong> and the JWT secret; set\n<strong>Business details<\/strong>, <strong>System settings<\/strong>,\n<strong>Taxes<\/strong>, <strong>Payment methods<\/strong>.<\/li>\n<li><strong>Settings &gt; Modules<\/strong>: copy the installation id,\ninstall the licence, activate only needed modules.<\/li>\n<\/ul>\n<h2 id=\"people\">People<\/h2>\n<ul>\n<li><strong>Staff &gt; Roles<\/strong> for access areas (None / View /\nManage). On each person: role, extra approval permissions, branch\naccess, <strong>PIN<\/strong>.<\/li>\n<\/ul>\n<h2 id=\"every-week\">Every week<\/h2>\n<ul>\n<li>Check the <strong>backup<\/strong> exists and download one off the\nserver. Review the <strong>Sign-in log<\/strong> and <strong>Audit\nLog<\/strong>. Look at <strong>Server logs<\/strong> if anything\nfailed.<\/li>\n<\/ul>\n<h2 id=\"before-an-upgrade\">Before an upgrade<\/h2>\n<ul>\n<li><strong>Backup now<\/strong>, download it, then follow the release\nnotes.<\/li>\n<\/ul>\n<h2 id=\"remember\">Remember<\/h2>\n<ul>\n<li>Module activation is permanent. Restoring a backup replaces\neverything and needs a restart.<\/li>\n<\/ul>\n<div class=\"callout note\">\n<p><strong>Need more?<\/strong> See the matching chapter of the User\nManual, or ask your administrator.<\/p>\n<\/div>\n", "text": " Set up, secure, back up. First day Change the admin password and the JWT secret; set Business details , System settings , Taxes , Payment methods . Settings > Modules : copy the installation id, install the licence, activate only needed modules. People Staff > Roles for access areas (None / View / Manage). On each person: role, extra approval permissions, branch access, PIN . Every week Check the backup exists and download one off the server. Review the Sign-in log and Audit Log . Look at Server logs if anything failed. Before an upgrade Backup now , download it, then follow the release notes. Remember Module activation is permanent. Restoring a backup replaces everything and needs a restart. Need more? See the matching chapter of the User Manual, or ask your administrator. "}, {"id": "cards-15-online-shop-staff", "manual": "cards", "n": 15, "title": "Online shop staff", "html": "\n<p><em>Answer orders, keep the shop fresh.<\/em><\/p>\n<h2 id=\"every-day\">Every day<\/h2>\n<ul>\n<li><strong>Online Store &gt; Online orders<\/strong>, tab\n<strong>New<\/strong>: <strong>Accept<\/strong> (holds the stock) or\n<strong>Reject<\/strong> (give a reason). Then <strong>Mark\npacked<\/strong>, <strong>Out for delivery<\/strong> or <strong>Ready for\npick-up<\/strong>, and <strong>Complete<\/strong> when the goods are\nhanded over (tick <strong>Cash collected<\/strong> for cash).<\/li>\n<li><strong>Refunds due<\/strong>: open the order and press\n<strong>Refund through the provider<\/strong>, or refund by hand and\nenter the reference.<\/li>\n<li><strong>Online payments<\/strong>: look at <em>Under review<\/em> and\n<em>Stuck pending<\/em>.<\/li>\n<\/ul>\n<h2 id=\"when-asked\">When asked<\/h2>\n<ul>\n<li><strong>Returns<\/strong>: <strong>Approve<\/strong> or\n<strong>Refuse<\/strong>; when the goods are back press <strong>Goods\nreceived: put back and refund<\/strong>.<\/li>\n<li><strong>Reviews<\/strong>: <strong>Approve<\/strong> or\n<strong>Hide<\/strong> the new ones.<\/li>\n<\/ul>\n<h2 id=\"keep-the-shop-fresh\">Keep the shop fresh<\/h2>\n<ul>\n<li><strong>Shop settings &gt; Products on the shop<\/strong>: titles,\nonline prices, and the ticks <strong>Featured<\/strong>, <strong>Best\nseller<\/strong>, <strong>Offer<\/strong>, <strong>New<\/strong> for the\nrows of the first page.<\/li>\n<li><strong>Front page<\/strong>: announcement, banner text and up to 8\nbanner pictures, footer links.<\/li>\n<li><strong>Coupons<\/strong> for a promotion;\n<strong>Newsletter<\/strong> to download the confirmed addresses.<\/li>\n<\/ul>\n<h2 id=\"it-says-sold-out\">\"It says Sold out\"<\/h2>\n<ul>\n<li>Under the product: <em>sellable warehouse stock − reserved − buffer\n= sellable now<\/em>. Lower the buffer, move stock to a sales location,\nor complete the orders that hold it.<\/li>\n<\/ul>\n<div class=\"callout note\">\n<p><strong>Need more?<\/strong> See <em>Online Store<\/em> in the User\nManual, or ask your administrator.<\/p>\n<\/div>\n", "text": " Answer orders, keep the shop fresh. Every day Online Store > Online orders , tab New : Accept (holds the stock) or Reject (give a reason). Then Mark packed , Out for delivery or Ready for pick-up , and Complete when the goods are handed over (tick Cash collected for cash). Refunds due : open the order and press Refund through the provider , or refund by hand and enter the reference. Online payments : look at Under review and Stuck pending . When asked Returns : Approve or Refuse ; when the goods are back press Goods received: put back and refund . Reviews : Approve or Hide the new ones. Keep the shop fresh Shop settings > Products on the shop : titles, online prices, and the t
