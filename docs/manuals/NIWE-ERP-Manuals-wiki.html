. The reasons offered for a return (separated by commas).<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Discounts and prices at the till<\/strong><\/td>\n<td>A cashier may give a discount up to a percent alone; above it a\nmanager approves (0 = every discount needs a manager). A discount needs\na reason. A manager may change a price at the till. Refuse a price below\nthe item's cost. The reasons offered for a discount.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Receipts<\/strong><\/td>\n<td>Paper: 80 mm or 58 mm thermal roll. Extra lines under the business\ndetails (opening hours, phone, VAT note). Text at the bottom of every\nreceipt. Print the business logo. Print a QR code of the invoice number\n(sales sent to EFRIS keep their own QR code).<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>The first printing of a receipt is the original; every later printing\nis marked <strong>COPY 1, COPY 2...<\/strong> and listed in <strong>Voids\n&amp; returns<\/strong>. \"A manager\" means an Admin, or a person with the\n<em>Approve voids and returns / price changes / big paid-outs<\/em>\npermissions from chapter 4.<\/p>\n<h2 id=\"inventory-settings-inventory-inventory-settings\">Inventory\nsettings (Inventory &gt; Inventory settings)<\/h2>\n<ul>\n<li><strong>Allow negative stock<\/strong> (default on): a sale or manual\nadjustment may take stock below zero. Untick it to make checkout refuse\na sale that would oversell and Stock adjustments refuse a correction\nthat would go negative.<\/li>\n<li><strong>Product packaging &amp; breakdown<\/strong>: lets you break\none product into smaller sellable units (a bottle into shots, a case\ninto bottles). Off by default; packaging rules can be configured but a\nbreakdown is refused until this is on.<\/li>\n<li><strong>Multi-warehouse<\/strong>: off by default, the store stays on\none warehouse (\"Main\"). When on, you can create further warehouses, but\nno sale may complete against Main any more: every register must be\nassigned a different warehouse (<strong>POS &gt; Registers &amp;\nTerminal<\/strong>) before it can ring a sale. Purchases always land on\nMain's default location.<\/li>\n<li><strong>Costing method<\/strong>: <em>Weighted average<\/em>\n(recommended), <em>Last purchase cost<\/em>, or <em>Manual<\/em> (never\nchange cost automatically). Landed cost on receiving needs weighted\naverage or last purchase.<\/li>\n<li><strong>Daily stock jobs<\/strong>: <em>Email a daily low-stock\ndigest<\/em> (one e-mail a day to the notifications address, nothing on a\nday when nothing is low); <em>Draft purchase requisitions\nautomatically<\/em> (each day one DRAFT requisition for products at or\nbelow their reorder level; it never submits or approves, and skips\nproducts already on an open requisition); <em>Run from<\/em> (store\ntime); and a <em>Run now<\/em> button that uses the saved settings.<\/li>\n<li><strong>Restaurant kitchen location<\/strong>: where restaurant\norders and wastage take their stock from (shown when the store has more\nthan one location).<\/li>\n<\/ul>\n<h2 id=\"expenses-settings-expenses-settings\">Expenses settings (Expenses\n&gt; Settings)<\/h2>\n<ul>\n<li><strong>Approval limit<\/strong>: expenses above this amount can only\nbe approved by an Admin or someone with <em>Approve large expenses<\/em>.\n0 = no limit.<\/li>\n<li><strong>Nobody approves, rejects or voids an expense they entered\nthemselves<\/strong> (option).<\/li>\n<li><strong>Block approval when it would go over the monthly\nbudget<\/strong>: an Admin can still approve with an override, which is\nwritten to the expense history.<\/li>\n<li><strong>Days until a bill is due<\/strong> (used when an unpaid bill\nis entered without a due date) and <strong>Warn this many days before\nthe due date<\/strong>.<\/li>\n<\/ul>\n<h2 id=\"assets-settings-assets-settings\">Assets settings (Assets &gt;\nSettings)<\/h2>\n<ul>\n<li><strong>Warn before a warranty or insurance ends\n(days)<\/strong>.<\/li>\n<li><strong>\"Fully depreciated soon\" means within\n(months)<\/strong>.<\/li>\n<li><strong>Disposal approval limit (book value)<\/strong>: disposing of\nan asset whose book value is above this needs an Admin or a user with\n<em>Approve large asset disposals<\/em>. 0 = no limit.<\/li>\n<\/ul>\n<h2 id=\"installments-settings-installments-settings\">Installments\nsettings (Installments &gt; Settings)<\/h2>\n<ul>\n<li><strong>Email reminders<\/strong>: send reminders to customers (needs\ne-mail), how many days before a due date, and how often to chase overdue\ninstalments.<\/li>\n<li><strong>Starting values for a new plan<\/strong>: whole amounts (no\ncents) for currencies such as RWF and XAF, yearly interest %, grace\ndays, late fee (fixed) and late fee (% of unpaid).<\/li>\n<li><strong>Early payoff and default<\/strong>: the percent of interest\nwaived on an early payoff (changeable per payoff); mark a plan defaulted\nafter this many days overdue (0 = never automatically).<\/li>\n<li><strong>Agreement wording<\/strong>: one term per line, printed under\n\"Terms\" on the agreement PDF. Leave empty for the standard wording; have\nyour own text checked by a lawyer.<\/li>\n<\/ul>\n<h2\nid=\"subscriptions-job-settings-subscriptions-job-settings\">Subscriptions\njob settings (Subscriptions &gt; Job settings)<\/h2>\n<ul>\n<li><strong>Run from (store time)<\/strong>: the daily job time, using\nthe time zone in System settings. If the server was off then, it runs\nwhen next up the same day.<\/li>\n<li><strong>Bill due subscriptions automatically<\/strong>: each active\nsubscription whose next billing date has arrived gets its invoice. Turn\noff to bill only by hand with <strong>Bill now<\/strong>.<\/li>\n<li><strong>Email upcoming-billing reminders<\/strong>: how many days\nbefore, to the customer and/or the notifications e-mail.<\/li>\n<li><strong>When an invoice stays unpaid<\/strong>: do nothing, pause the\nsubscription, or cancel it after a number of days past the invoice date.\nPausing can be undone with <strong>Resume<\/strong>; cancelling\ncannot.<\/li>\n<li><strong>Email a daily results digest<\/strong> to the notifications\ne-mail (not sent on days when nothing happened).<\/li>\n<li><strong>Overdue reminders and catching up<\/strong>: e-mail the\ncustomer when a subscription invoice is overdue (first reminder after n\ndays, then every n days, at most n reminders), and <strong>Missed\nbilling cycles to bill in one run<\/strong> (1 = one per day; a higher\nnumber catches up at once, each with its own period).<\/li>\n<li><strong>Run now<\/strong> uses the saved settings and counts as\ntoday's run.<\/li>\n<\/ul>\n<h2 id=\"help-desk-settings-help-desk-settings\">Help Desk settings (Help\nDesk &gt; Settings)<\/h2>\n<ul>\n<li><strong>Public website<\/strong>: when on, anyone can send a support\nrequest and follow a ticket at <code>/helpdesk<\/code> on your site\nwithout signing in; options let customers reply and attach files and\nrate the help. Switch it off to close the page.<\/li>\n<li><strong>Notification emails<\/strong>: one address per line; they get\nan e-mail for each new ticket, for customer replies to an unassigned\nticket, and for missed deadlines.<\/li>\n<li><strong>E-mail each reply to the customer<\/strong> when the ticket\nhas an e-mail address.<\/li>\n<li><strong>Deadlines (SLA)<\/strong>: give every new ticket a\nfirst-reply and a resolution deadline by priority (Urgent, High, Medium,\nLow), counted in calendar hours from creation; time <em>waiting for the\ncustomer<\/em> does not count. Only tickets created after you switch this\non get deadlines. Options: internal tickets too; warning e-mail before\nthe deadline and alert when missed; <strong>Close a resolved ticket\nautomatically after (days)<\/strong>.<\/li>\n<\/ul>\n<h2 id=\"time-tracking-settings-time-tracking-settings\">Time tracking\nsettings (Time tracking &gt; Settings)<\/h2>\n<ul>\n<li>A manager must approve submitted time (switch off to approve\neverything automatically).<\/li>\n<li><strong>Round stopped timers up to<\/strong> exact minutes, 5, 6, 10,\n15, 30 minutes or 1 hour.<\/li>\n<li><strong>Default hourly rate<\/strong>, <strong>most hours one person\ncan log in a day<\/strong>, <strong>working hours in a day<\/strong> (for\nutilisation).<\/li>\n<li><strong>Keeping timesheets tidy<\/strong>: stop a timer running more\nthan n hours (kept as a draft for the person to check; 0 = never);\n<strong>Lock time up to and including<\/strong> a date so approved and\ninvoiced weeks stay as they are; a weekly reminder e-mail to people who\nhave not handed in last week's time; a warning when a project has used\nn% of its budget (recorded in the audit log).<\/li>\n<li><strong>Service product billed time is invoiced under<\/strong>: the\nproduct named \"Professional services (time)\" can be created\nautomatically; its tax rate and accounting follow the product.<\/li>\n<\/ul>\n<h2 id=\"booking-settings-booking-settings\">Booking settings (Booking\n&gt; Settings)<\/h2>\n<ul>\n<li><strong>Opening hours<\/strong>: opens, closes, time between start\ntimes, working days.<\/li>\n<li><strong>Booking rules<\/strong>: earliest booking (minutes ahead),\nfurthest ahead (days), hold for payment (minutes), online cancel until\n(hours before).<\/li>\n<li><strong>Reminders and moving a booking<\/strong>: e-mail the guest a\nreminder (with a calendar file) n hours before; guests may move their\nown booking on the public page.<\/li>\n<li><strong>Public website<\/strong>: guests pick a service and a time\nthemselves at <code>/book<\/code>. Also confirmation e-mail, bookings per\nphone number per day, page title, intro text, and how to pay (shown to\nguests who owe a deposit).<\/li>\n<\/ul>\n<h2 id=\"work-orders-settings-work-orders\">Work orders settings (Work\norders)<\/h2>\n<ul>\n<li><strong>New customer jobs need the customer's approval<\/strong>:\nwork cannot start until an estimate has been sent and approved (can be\nswitched off for a single job).<\/li>\n<li><strong>E-mail the customer when a job is completed<\/strong>: a\ncompletion note (PDF) is sent. If the e-mail fails, the job is still\ncompleted.<\/li>\n<\/ul>\n<h2 id=\"attendance-and-leave-settings-hr-attendance-settings\">Attendance\nand leave settings (HR &gt; Attendance &gt; Settings)<\/h2>\n<ul>\n<li><strong>Working time<\/strong>: work starts at, grace period\n(minutes), hours in a normal day, overtime pays (multiple of normal\nhourly pay), working days. Clocking in after the start time plus grace\ncounts as late.<\/li>\n<li><strong>Leave types<\/strong>: name, days a year, whether days become\navailable all at the start of the year or are earned month by month,\ncarry-over (max days), paid or unpaid, paid out when leaving.<\/li>\n<li><strong>Public holidays<\/strong>: add the holidays of each year;\nthey are not counted as leave or working days.<\/li>\n<\/ul>\n<h2 id=\"hotel-settings-hotel-settings\">Hotel settings (Hotel &gt;\nSettings)<\/h2>\n<ul>\n<li><strong>How room revenue reaches Accounting<\/strong>: <em>Every\nnight<\/em> (posted by the night audit; best for most hotels), <em>At\ncheck-out<\/em>, or <em>At booking and check-out<\/em> (booked value is\nheld as unearned revenue until check-out). The mode can only be changed\nwhen no booking is open.<\/li>\n<li><strong>Tax on rooms and services (%)<\/strong>, <strong>check-in\ntime<\/strong>, <strong>check-out time<\/strong>, <strong>night audit runs\nat<\/strong>.<\/li>\n<li><strong>Cancellation and fee policy<\/strong>: free cancellation\nuntil n days before arrival; late-cancellation, no-show, early-departure\nfees (in nights); late check-out fee. The front desk can waive any fee.\nSee also <strong>Online booking<\/strong> settings for the hotel's public\nbooking page.<\/li>\n<\/ul>\n<h2 id=\"restaurant-settings-restaurant-settings\">Restaurant settings\n(Restaurant &gt; Settings)<\/h2>\n<p>Service charge by order type (dine-in, takeaway, delivery) and VAT on\nit; the most a waiter may discount without a manager; tips (quick-choice\npercents); quick kitchen notes; usual preparation time and amber/red\nthresholds for kitchen tickets; rounding of the bill; and table bookings\nfrom the public site at <code>/reserve<\/code>.<\/p>\n<h2 id=\"online-store-settings-online-store-shop-settings\">Online Store\nsettings (Online Store &gt; Shop settings)<\/h2>\n<p>The Online Store needs the <strong>Online Store<\/strong> module in\nthe licence and activated. Its pages are <code>/shop<\/code> (the public\nshop, also the first page of the site for a visitor who is not signed\nin), <code>/shop/order/&lt;code&gt;<\/code> (where a customer follows an\norder) and a few small pages for the newsletter; staff use the\n<strong>Online Store<\/strong> group of the menu (<strong>Online\norders<\/strong>, <strong>Online payments<\/strong>,\n<strong>Returns<\/strong>, <strong>Reviews<\/strong>,\n<strong>Newsletter<\/strong>, <strong>Coupons<\/strong>, <strong>Text\nmessages<\/strong>, <strong>Shop settings<\/strong>). Everything starts\nclosed: the public pages answer \"not available\" until the module is\nactivated and <strong>Shop is open to the public<\/strong> is ticked. The\nUser Manual (Online Store) describes the screens for the shop staff;\nthis section is for the person who sets it up.<\/p>\n<p>Set up, in this order:<\/p>\n<ol type=\"1\">\n<li><strong>Products on the shop<\/strong>: only products added here are\nshown or sold. The picture is the product's own; the price is the normal\nprice unless an <strong>Online price<\/strong> is set. Prices are shown\nwith tax included. The ticks <strong>Featured<\/strong>, <strong>Best\nseller<\/strong>, <strong>Offer<\/strong> and <strong>New<\/strong> choose\nthe products of the four rows on the first page.<\/li>\n<li><strong>Delivery areas<\/strong> with a fee and an optional minimum\norder each. With none, the shop delivers anywhere for free.<\/li>\n<li><strong>Service product for the delivery fee<\/strong>: a\n<em>service<\/em> product (no stock) that carries the delivery fee on the\nsale order and the invoice. Without it, an order that has a delivery fee\ncannot be accepted. Give it no tax, or tax included, so that the invoice\ntotal matches what the customer saw.<\/li>\n<li>The shop switches and limits: <strong>Delivery<\/strong>,\n<strong>Pick-up<\/strong>, <strong>Pay cash on delivery or at\npick-up<\/strong>, <strong>Minimum order<\/strong>, <strong>Free delivery\nfrom<\/strong>, <strong>Units kept back for the till<\/strong> (the shop\nsells this many fewer than you hold), <strong>Orders waiting per\nphone<\/strong> and <strong>Orders per connection per hour<\/strong>.\n<strong>Send new-order e-mails to<\/strong> and <strong>Alert by e-mail\nwhen an order waits this many minutes<\/strong> tell the shop who to\nwarn.<\/li>\n<li><strong>Front page<\/strong>: the announcement, banner texts and\npictures, footer text and links (see the User Manual). Banner pictures\nare stored in the database: up to 8, so a backup is slightly\nlarger.<\/li>\n<\/ol>\n<p><strong>Stock.<\/strong> The shop has no stock of its own. It sells\nwhat the warehouses hold in sellable locations, minus quantities\nreserved on confirmed sales orders, minus <strong>Units kept back for\nthe till<\/strong>. Under each product in <strong>Products on the\nshop<\/strong> the screen shows these figures. If products say <em>Sold\nout<\/em> although you have stock, see <em>The online shop<\/em> in\nchapter 14.<\/p>\n<p>Accepting an order creates a confirmed sale order for the customer\n(found by phone number, or created), which holds the stock. Completing\nit fulfils the sale order from the chosen warehouse location (required\nwhen several warehouses are in use), issues the invoice and records the\npayment: the first cash payment method for a cash order, or the online\npayment already received. Staff need the <strong>Operations<\/strong>\narea to answer orders.<\/p>\n<h3 id=\"customer-accounts\">Customer accounts<\/h3>\n<p>Tick <strong>Customers can sign in to see their orders<\/strong>. A\ncustomer types an e-mail address and receives a one-time code (valid 10\nminutes, 5 tries); there are no passwords. This needs the <strong>e-mail\nsettings<\/strong> of the business (chapter 9), or text messages for a\ncode sent to a saved phone number.<\/p>\n<h3 id=\"online-payments\">Online payments<\/h3>\n<p>In <strong>Online payments<\/strong> choose a <strong>Payment\nprovider<\/strong>, tick <strong>Customers can pay online<\/strong>, and\nset <strong>Minutes the customer has to pay<\/strong>. A customer who\npays online has an order that reaches the shop only once the payment is\nconfirmed; an order that is never paid is cancelled after a day. Set the\n<strong>currency of the business<\/strong> (Business details) to the\ncurrency you charge in. The providers are:<\/p>\n<ul>\n<li><strong>Simulated provider<\/strong> (for tests only; it exists when\nthe server is started with\n<code>app.online-store.payments.simulated.enabled=true<\/code> and a\n<code>...simulated.secret<\/code>). The customer lands on a test page\nwith <strong>Pay<\/strong> and <strong>Decline<\/strong>. Never use it\nwith real customers.<\/li>\n<li><strong>MTN Mobile Money (MoMo)<\/strong> for Rwanda. The customer\ntypes an MTN number and approves on the phone. It stays\n<strong>unavailable<\/strong> (it cannot be chosen) until it is switched\non and keyed in the server's environment:\n<code>app.online-store.payments.mtn.enabled=true<\/code>,\n<code>...subscription-key<\/code>, <code>...api-user<\/code>,\n<code>...api-key<\/code>, <code>...base-url<\/code> (https only) and\n<code>...target-environment<\/code> (<code>sandbox<\/code> while testing).\nPut the keys in the environment of the server, never in a file that is\ncopied around; the program never shows or logs them. Replace dots and\ndashes by underscores and use capitals for an environment variable\n(<code>APP_ONLINE_STORE_PAYMENTS_MTN_API_KEY<\/code>). The step-by-step\nguide to get sandbox keys, test, and go live is\n<code>docs/online-store-mtn-momo.md<\/code> in the program's files. The\nsandbox accepts only the currency EUR. <strong>This provider has been\ntested only against an imitation of MTN; do a sandbox test, then one\nsmall real purchase and one refund, before opening the\nshop.<\/strong><\/li>\n<\/ul>\n<p>Give the provider the <strong>webhook address<\/strong> shown on the\nscreen:\n<code>&lt;your address&gt;/api/public/store/payments/&lt;provider code&gt;/webhook<\/code>.\nThe shop also checks every pending payment about once a minute, so a\nlost call-back only delays the order a little. A payment that does not\nmatch its order (another amount or currency, or a double payment) goes\nto <strong>review<\/strong> instead of being accepted: watch\n<strong>Online Store &gt; Online payments<\/strong>.<\/p>\n<p>Another provider (Airtel Money, a card gateway) is a small piece of\nprogramming for a developer;\n<code>docs/online-store-payment-providers.md<\/code> describes it.<\/p>\n<h3 id=\"text-messages-sms-or-whatsapp\">Text messages (SMS or\nWhatsApp)<\/h3>\n<p>In <strong>Text messages<\/strong> choose a <strong>Text\nprovider<\/strong>, the channel (<strong>Send as<\/strong>), the\n<strong>Country code<\/strong> (250 for Rwanda; it is put in front of\nnumbers that start with 0), <strong>Most texts per day<\/strong> (default\n300; 0 = no limit) and <strong>Text the owner at<\/strong> a phone\nnumber. Nothing is sent until a provider is chosen. The program includes\na <strong>test sender<\/strong> (it sends nothing: every text is listed\nin <strong>Online Store &gt; Text messages<\/strong>) and needs a\ndeveloper to add a real provider\n(<code>docs/online-store-text-providers.md<\/code>). Order updates are\ntexted only to customers who ticked the box at checkout.<\/p>\n<h3 id=\"returns\">Returns<\/h3>\n<p><strong>Customers can return goods up to this many days after the\norder is completed<\/strong> (14 by default; 0 = no returns through the\nshop).<\/p>\n<h3 id=\"newsletter-and-links-in-e-mails\">Newsletter and links in\ne-mails<\/h3>\n<p>The newsletter sign-up needs the e-mail settings to be working. The\nconfirmation link in the e-mail, and the unsubscribe links in the\ndownloaded newsletter list, are built from the setting\n<code>app.frontend-url<\/code>: <strong>set it to the public address of\nthe site<\/strong> (for example\n<code>https://shop.yourbusiness.com<\/code>), otherwise the link will\npoint to the wrong place (the default is\n<code>http://localhost:4200<\/code>).<\/p>\n<p><strong>Behind a reverse proxy<\/strong> (nginx, IIS, a cloud load\nbalancer): add <code>server.forward-headers-strategy=native<\/code> to\nthe server's settings so that the limit per connection sees each\nvisitor's own address. Without it all visitors share the proxy's address\nand the limit applies to everybody together.<\/p>\n<h2 id=\"law-firm-settings-law-firm-settings\">Law firm settings (Law firm\n&gt; Settings)<\/h2>\n<p>Practice areas and jurisdictions (one per line); \"due soon\" window;\ndefault billing basis for new matters (Hourly, Fixed fee, Retainer,\nContingency, Pro bono); daily e-mail of deadlines and tasks to each\nlawyer; new matters restricted by default; <strong>limitation date\nwarnings<\/strong> (first warning n days before, a second 3 days before,\nand one if the date has passed); and <strong>unpaid fees<\/strong>: the\nusual payment term and automatic client reminders listing late invoices\nwith a statement attached.<\/p>\n<h2 id=\"real-estate-settings-real-estate-settings\">Real Estate settings\n(Real Estate &gt; Settings)<\/h2>\n<p>Areas you work in; how long a viewing lasts; when a lead is \"quiet\";\na morning e-mail to each agent about late and due calls and quiet leads\n(agents need an e-mail address on their user account); and viewing\nreminders to the person viewing and the agent.<\/p>\n<h2\nid=\"property-management-settings-property-management-settings\">Property\nManagement settings (Property management &gt; Settings)<\/h2>\n<p>Areas; when a lease is \"ending soon\"; the day rent usually falls due;\nthe usual management fee % and VAT on it; rent invoicing (how many days\nbefore the due date, and automatically every morning); and <strong>owner\nstatements every month<\/strong> (make last month's statements\nautomatically from a chosen day, and optionally agree them and e-mail\nowners when they have no warnings). There is also a separate reminder\nand late-fee page for tenants.<\/p>\n<h2 id=\"settings-that-are-not-in-a-module\">Settings that are not in a\nmodule<\/h2>\n<p><strong>Settings &gt; System settings, Business details, Email\nsettings, Payment methods, Taxes, Scheduled reports, Apps, Backup &amp;\nData<\/strong> are covered in chapters 5, 9 and 10. The\n<strong>Loyalty<\/strong>, <strong>Promotions<\/strong>, <strong>Gift\ncards<\/strong> and <strong>Price lists<\/strong> pages are maintained by\nstaff with the Sales area and are described in the User Manual.<\/p>\n", "text": " Every module that needs choices keeps them on its own Settings page, at the bottom of that module's menu. All of these pages are Admin only . This chapter lists them, in the order of the menu, and explains the choices that matter. Press Save on each page; most show Saved when done. Tip: Set a module up before staff start using it. Some settings (for example Help Desk deadlines) only apply to records created after you switch them on. Sales settings (Sales > Settings) Features : switch on only what you use: Promotions (discounts, buy-X-get-Y, coupons), Gift cards , Loyalty points (the earning and spending rules are set on the Loyalty page). When a feature is off, its menu entries and till parts are hidden and the server refuses to use it. What was already saved is kept and works again when you switch it back on. Invoice receiver emails : one address per line. Whenever an invoice is issued, a PDF copy is e-mailed to the customer's own address and to everyone on this list. It is sent only if e-mail is set up (chapter 9); a failed send never blocks or undoes the invoice. POS settings (POS > POS settings) The rules the till enforces. They are the main control against loss at the counter. Group Setting Cash at the till A closing difference up to a set amount is accepted without comment; a bigger one needs a note saying why. Closing a shift needs the notes and coins counted (option). A paid-out from the drawer above an amount needs a manager's PIN (0 = no limit). Remind the cashier to drop cash into the safe when the drawer holds more than an amount (0 = no reminder). Voids and returns Voiding a sale needs a manager (their sign-in or PIN). A sale can be voided only while its shift is open (afterwards it is a return). A return needs a reason. Returns of sales older than a number of days need a manager (0 = no limit). A refund above an amount needs a manager (0 = no limit). The reasons offered for a return (separated by commas). Discounts and prices at the till A cashier may give a discount up to a percent alone; above it a manager approves (0 = every discount needs a manager). A discount needs a reason. A manager may change a price at the till. Refuse a price below the item's cost. The reasons offered for a discount. Receipts Paper: 80 mm or 58 mm thermal roll. Extra lines under the business details (opening hours, phone, VAT note). Text at the bottom of every receipt. Print the business logo. Print a QR code of the invoice number (sales sent to EFRIS keep their own QR code). The first printing of a receipt is the original; every later printing is marked COPY 1, COPY 2... and listed in Voids & returns . \"A manager\" means an Admin, or a person with the Approve voids and returns / price changes / big paid-outs permissions from chapter 4. Inventory settings (Inventory > Inventory settings) Allow negative stock (default on): a sale or manual adjustment may take stock below zero. Untick it to make checkout refuse a sale that would oversell and Stock adjustments refuse a correction that would go negative. Product packaging & breakdown : lets you break one product into smaller sellable units (a bottle into shots, a case into bottles). Off by default; packaging rules can be configured but a breakdown is refused until this is on. Multi-warehouse : off by default, the store stays on one warehouse (\"Main\"). When on, you can create further warehouses, but no sale may complete against Main any more: every register must be assigned a different warehouse ( POS > Registers & Terminal ) before it can ring a sale. Purchases always land on Main's default location. Costing method : Weighted average (recommended), Last purchase cost , or Manual (never change cost automatically). Landed cost on receiving needs weighted average or last purchase. Daily stock jobs : Email a daily low-stock digest (one e-mail a day to the notifications address, nothing on a day when nothing is low); Draft purchase requisitions automatically (each day one DRAFT requisition for products at or below their reorder level; it never submits or approves, and skips products already on an open requisition); Run from (store time); and a Run now button that uses the saved settings. Restaurant kitchen location : where restaurant orders and wastage take their stock from (shown when the store has more than one location). Expenses settings (Expenses > Settings) Approval limit : expenses above this amount can only be approved by an Admin or someone with Approve large expenses . 0 = no limit. Nobody approves, rejects or voids an expense they entered themselves (option). Block approval when it would go over the monthly budget : an Admin can still approve with an override, which is written to the expense history. Days until a bill is due (used when an unpaid bill is entered without a due date) and Warn this many days before the due date . Assets settings (Assets > Settings) Warn before a warranty or insurance ends (days) . \"Fully depreciated soon\" means within (months) . Disposal approval limit (book value) : disposing of an asset whose book value is above this needs an Admin or a user with Approve large asset disposals . 0 = no limit. Installments settings (Installments > Settings) Email reminders : send reminders to customers (needs e-mail), how many days before a due date, and how often to chase overdue instalments. Starting values for a new plan : whole amounts (no cents) for currencies such as RWF and XAF, yearly interest %, grace days, late fee (fixed) and late fee (% of unpaid). Early payoff and default : the percent of interest waived on an early payoff (changeable per payoff); mark a plan defaulted after this many days overdue (0 = never automatically). Agreement wording : one term per line, printed under \"Terms\" on the agreement PDF. Leave empty for the standard wording; have your own text checked by a lawyer. <h2 id=\"subscriptions-job-settings-subscriptions-job-settings\">Subscriptions job settings (Subscriptions > Job settings) Run from (store time) : the daily job time, using the time zone in System settings. If the server was off then, it runs when next up the same day. Bill due subscriptions automatically : each active subscription whose next billing date has arrived gets its invoice. Turn off to bill only by hand with Bill now . Email upcoming-billing reminders : how many days before, to the customer and/or the notifications e-mail. When an invoice stays unpaid : do nothing, pause the subscription, or cancel it after a number of days past the invoice date. Pausing can be undone with Resume ; cancelling cannot. Email a daily results digest to the notifications e-mail (not sent on days when nothing happened). Overdue reminders and catching up : e-mail the customer when a subscription invoice is overdue (first reminder after n days, then every n days, at most n reminders), and Missed billing cycles to bill in one run (1 = one per day; a higher number catches up at once, each with its own period). Run now uses the saved settings and counts as today's run. Help Desk settings (Help Desk > Settings) Public website : when on, anyone can send a support request and follow a ticket at /helpdesk on your site without signing in; options let customers reply and attach files and rate the help. Switch it off to close the page. Notification emails : one address per line; they get an e-mail for each new ticket, for customer replies to an unassigned ticket, and for missed deadlines. E-mail each reply to the customer when the ticket has an e-mail address. Deadlines (SLA) : give every new ticket a first-reply and a resolution deadline by priority (Urgent, High, Medium, Low), counted in calendar hours from creation; time waiting for the customer does not count. Only tickets created after you switch this on get deadlines. Options: internal tickets too; warning e-mail before the deadline and alert when missed; Close a resolved ticket automatically after (days) . Time tracking settings (Time tracking > Settings) A manager must approve submitted time (switch off to approve everything automatically). Round stopped timers up to exact minutes, 5, 6, 10, 15, 30 minutes or 1 hour. Default hourly rate , most hours one person can log in a day , working hours in a day (for utilisation). Keeping timesheets tidy : stop a timer running more than n hours (kept as a draft for the person to check; 0 = never); Lock time up to and including a date so approved and invoiced weeks stay as they are; a weekly reminder e-mail to people who have not handed in last week's time; a warning when a project has used n% of its budget (recorded in the audit log). Service product billed time is invoiced under : the product named \"Professional services (time)\" can be created automatically; its tax rate and accounting follow the product. Booking settings (Booking > Settings) Opening hours : opens, closes, time between start times, working days. Booking rules : earliest booking (minutes ahead), furthest ahead (days), hold for payment (minutes), online cancel until (hours before). Reminders and moving a booking : e-mail the guest a reminder (with a calendar file) n hours before; guests may move their own booking on the public page. Public website : guests pick a service and a time themselves at /book . Also confirmation e-mail, bookings per phone number per day, page title, intro text, and how to pay (shown to guests who owe a deposit). Work orders settings (Work orders) New customer jobs need the customer's approval : work cannot start until an estimate has been sent and approved (can be switched off for a single job). E-mail the customer when a job is completed : a completion note (PDF) is sent. If the e-mail fails, the job is still completed. Attendance and leave settings (HR > Attendance > Settings) Working time : work starts at, grace period (minutes), hours in a normal day, overtime pays (multiple of normal hourly pay), working days. Clocking in after the start time plus grace counts as late. Leave types : name, days a year, whether days become available all at the start of the year or are earned month by month, carry-over (max days), paid or unpaid, paid out when leaving. Public holidays : add the holidays of each year; they are not counted as leave or working days. Hotel settings (Hotel > Settings) How room revenue reaches Accounting : Every night (posted by the night audit; best for most hotels), At check-out , or At booking and check-out (booked value is held as unearned revenue until check-out). The mode can only be changed when no booking is open. Tax on rooms and services (%) , check-in time , check-out time , night audit runs at . Cancellation and fee policy : free cancellation until n days before arrival; late-cancellation, no-show, early-departure fees (in nights); late check-out fee. The front desk can waive any fee. See also Online booking settings for the hotel's public booking page. Restaurant settings (Restaurant > Settings) Service charge by order type (dine-in, takeaway, delivery) and VAT on it; the most a waiter may discount without a manager; tips (quick-choice percents); quick kitchen notes; usual preparation time and amber/red thresholds for kitchen tickets; rounding of the bill; and table bookings from the public site at /reserve . Online Store settings (Online Store > Shop settings) The Online Store needs the Online Store module in the licence and activated. Its pages are /shop (the public shop, also the first page of the site for a visitor who is not signed in), /shop/order/<code> (where a customer follows an order) and a few small pages for the newsletter; staff use the Online Store group of the menu ( Online orders , Online payments , Returns , Reviews , Newsletter , Coupons , Text messages , Shop settings ). Everything starts closed: the public pages answer \"not available\" until the module is activated and Shop is open to the public is ticked. The User Manual (Online Store) describes the screens for the shop staff; this section is for the person who sets it up. Set up, in this order: Products on the shop : only products added here are shown or sold. The picture is the product's own; the price is the normal price unless an Online price is set. Prices are shown with tax included. The ticks Featured , Best seller , Offer and New choose the products of the four rows on the first page. Delivery areas with a fee and an optional minimum order each. With none, the shop delivers anywhere for free. Service product for the delivery fee : a service product (no stock) that carries the delivery fee on the sale order and the invoice. Without it, an order that has a delivery fee cannot be accepted. Give it no tax, or tax included, so that the invoice total matches what the customer saw. The shop switches and limits: Delivery , Pick-up , Pay cash on delivery or at pick-up , Minimum order , Free delivery from , Units kept back for the till (the shop sells this many fewer than you hold), Orders waiting per phone and Orders per connection per hour . Send new-order e-mails to and Alert by e-mail when an order waits this many minutes tell the shop who to warn. Front page : the announcement, banner texts and pictures, footer text and links (see the User Manual). Banner pictures are stored in the database: up to 8, so a backup is slightly larger. Stock. The shop has no stock of its own. It sells what the warehouses hold in sellable locations, minus quantities reserved on confirmed sales orders, minus Units kept back for the till . Under each product in Products on the shop the screen shows these figures. If products say Sold out although you have stock, see The online shop in chapter 14. Accepting an order creates a confirmed sale order for the customer (found by phone number, or created), which holds the stock. Completing it fulfils the sale order from the chosen warehouse location (required when several warehouses are in use), issues the invoice and records the payment: the first cash payment method for a cash order, or the online payment already received. Staff need the Operations area to answer orders. Customer accounts Tick Customers can sign in to see their orders . A customer types an e-mail address and receives a one-time code (valid 10 minutes, 5 tries); there are no passwords. This needs the e-mail settings of the business (chapter 9), or text messages for a code sent to a saved phone number. Online payments In Online payments choose a Payment provider , tick Customers can pay online , and set Minutes the customer has to pay . A customer who pays online has an order that reaches the shop only once the payment is confirmed; an order that is never paid is cancelled after a day. Set the currency of the business (Business details) to the currency you charge in. The providers are: Simulated provider (for tests only; it exists when the server is started with app.online-store.payments.simulated.enabled=true and a ...simulated.secret ). The customer lands on a test page with Pay and Decline . Never use it with real customers. MTN Mobile Money (MoMo) for Rwanda. The customer types an MTN number and approves on the phone. It stays unavailable (it cannot be chosen) until it is switched on and keyed in the server's environment: app.online-store.payments.mtn.enabled=true , ...subscription-key , ...api-user , ...api-key , ...base-url (https only) and ...target-environment ( sandbox while testing). Put the keys in the environment of the server, never in a file that is copied around; the program never shows or logs them. Replace dots and dashes by underscores and use capitals for an environment variable ( APP_ONLINE_STORE_PAYMENTS_MTN_API_KEY ). The step-by-step guide to get sandbox keys, test, and go live is docs/online-store-mtn-momo.md in the program's files. The sandbox accepts only the currency EUR. This provider has been tested only against an imitation of MTN; do a sandbox test, then one small real purchase and one refund, before opening the shop. Give the provider the webhook address shown on the screen: <your address>/api/public/store/payments/<provider code>/webhook . The shop also checks every pending payment about once a minute, so a lost call-back only delays the order a little. A payment that does not match its order (another amount or currency, or a double payment) goes to review instead of being accepted: watch Online Store > Online payments . Another provider (Airtel Money, a card gateway) is a small piece of programming for a developer; docs/online-store-payment-providers.md describes it. Text messages (SMS or WhatsApp) In Text messages choose a Text provider , the channel ( Send as ), the Country code (250 for Rwanda; it is put in front of numbers that start with 0), Most texts per day (default 300; 0 = no limit) and Text the owner at a phone number. Nothing is sent until a provider is chosen. The program includes a test sender (it sends nothing: every text is listed in Online Store > Text messages ) and needs a developer to add a real provider ( docs/online-store-text-providers.md ). Order updates are texted only to customers who ticked the box at checkout. Returns Customers can return goods up to this many days after the order is completed (14 by default; 0 = no returns through the shop). Newsletter and links in e-mails The newsletter sign-up needs the e-mail settings to be working. The confirmation link in the e-mail, and the unsubscribe links in the downloaded newsletter list, are built from the setting app.frontend-url : set it to the public address of the site (for example https://shop.yourbusiness.com ), otherwise the link will point to the wrong place (the default is http://localhost:4200 ). Behind a reverse proxy (nginx, IIS, a cloud load balancer): add server.forward-headers-strategy=native to the server's settings so that the limit per connection sees each visitor's own address. Without it all visitors share the proxy's address and the limit applies to everybody together. Law firm settings (Law firm > Settings) Practice areas and jurisdictions (one per line); \"due soon\" window; default billing basis for new matters (Hourly, Fixed fee, Retainer, Contingency, Pro bono); daily e-mail of deadlines and tasks to each lawyer; new matters restricted by default; limitation date warnings (first warning n days before, a second 3 days before, and one if the date has passed); and unpaid fees : the usual payment term and automatic client reminders listing late invoices with a statement attached. Real Estate settings (Real Estate > Settings) Areas you work in; how long a viewing lasts; when a lead is \"quiet\"; a morning e-mail to each agent about late and due calls and quiet leads (agents need an e-mail address on their user account); and viewing reminders to the person viewing and the agent. <h2 id=\"property-management-settings-property-management-settings\">Property Management settings (Property management > Settings) Areas; when a lease is \"ending soon\"; the day rent usually falls due; the usual management fee % and VAT on it; rent invoicing (how many days before the due date, and automatically every morning); and owner statements every month (make last month's statements automatically from a chosen day, and optionally agree them and e-mail owners when they have no warnings). There is also a separate reminder and late-fee page for tenants. Settings that are not in a module Settings > System settings, Business details, Email settings, Payment methods, Taxes, Scheduled reports, Apps, Backup & Data are covered in chapters 5, 9 and 10. The Loyalty , Promotions , Gift cards and Price lists pages are maintained by staff with the Sales area and are described in the User Manual. "}, {"id": "admin-8-tills-printers-and-devices", "manual": "admin", "n": 8, "title": "Tills, printers and devices", "html": "\n<h2 id=\"registers\">Registers<\/h2>\n<p>A <strong>register<\/strong> is a till. Create and edit registers\nunder <strong>POS &gt; Registers &amp; Terminal<\/strong> (Admin only).\nEach register has a name, can be pinned to one specific <em>Sales<\/em>\nlocation of a warehouse (and, when multi-warehouse is on, must be\nassigned a warehouse other than Main), and can be tied to one device\n(below).<\/p>\n<p>Cashiers do not need to be given register access one by one: a shift\nis opened on a register, and the terminal always asks for a\n<strong>PIN<\/strong> before it opens. The PIN identifies the cashier and\nstarts or resumes their own working session on that shift.<\/p>\n<h2 id=\"binding-a-register-to-one-device-version-1.13\">Binding a\nregister to one device (version 1.13)<\/h2>\n<p>You can tie a register to <strong>one known device<\/strong> so that\nit can be used only from that PC.<\/p>\n<ol type=\"1\">\n<li>Sit at the till PC and sign in as an Admin.<\/li>\n<li>Go to <strong>POS &gt; Registers &amp; Terminal<\/strong> and press\n<strong>Bind to this device<\/strong> on the register.<\/li>\n<li>Give the PC a name, and choose whether its network address must also\nmatch (the <em>IP check<\/em> option).<\/li>\n<li>From then on, any other device is refused by the server for that\nregister: the terminal, sales, opening a shift, offline sync and cash\nmovements, each with a clear message.<\/li>\n<\/ol>\n<p>Press <strong>Unbind<\/strong> (an Admin, from any device) to free it.\nReports, receipts, history and closing a shift stay available from the\nback office. A device can be the till of one register only. Registers\nthat are not bound behave as before. Binding and unbinding are written\nto the audit log (<em>REGISTER_DEVICE_BOUND<\/em> and\n<em>REGISTER_DEVICE_UNBOUND<\/em>).<\/p>\n<p>If the server sits behind a reverse proxy and you use the IP check,\nset <code>app.device-binding.trusted-proxies<\/code> to the proxy's\naddress so that the real address of the till is seen.<\/p>\n<h2 id=\"thermal-printing-and-the-cash-drawer-version-1.12\">Thermal\nprinting and the cash drawer (version 1.12)<\/h2>\n<p>Thermal printing is configured <strong>per PC, in the\nbrowser<\/strong>, at <strong>POS &gt; Devices<\/strong>, because each\ntill has its own hardware. Nothing is stored on the server. The complete\nguide is in the file <code>THERMAL-PRINTING.md<\/code> supplied with the\nsystem; this is a summary.<\/p>\n<h3 id=\"connection-types\">Connection types<\/h3>\n<div class=\"tablewrap\"><table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Connection<\/th>\n<th>Use it when<\/th>\n<th>Needs<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>Windows driver<\/strong><\/td>\n<td>You want the normal print dialog, laid out for the roll (exactly 80\nmm or 58 mm, no margins).<\/td>\n<td>Any browser, the printer's Windows driver.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Serial / COM<\/strong><\/td>\n<td>You want raw ESC/POS: native text, logo, QR code, cut, cash\ndrawer.<\/td>\n<td>Chrome or Edge on <strong>https<\/strong> or\n<strong>localhost<\/strong>; a printer with a serial port or a virtual\nCOM port.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>USB<\/strong><\/td>\n<td>Same raw printing over WebUSB.<\/td>\n<td>Chrome or Edge; the printer on the WinUSB driver (for example with\nZadig).<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Chrome or Edge ask once to allow each device (<strong>Connect\ndevice...<\/strong>); the permission is remembered for the site. If a\ndirect printer does not answer, the document is printed through the\nWindows driver and a red line explains why.<\/p>\n<h3 id=\"setting-up-a-till-step-by-step\">Setting up a till, step by\nstep<\/h3>\n<ol type=\"1\">\n<li>Open <strong>POS &gt; Devices<\/strong>.<\/li>\n<li><strong>Receipt printer<\/strong>: choose the connection, press\n<strong>Connect device...<\/strong>, pick the printer. For COM, choose\nthe printer's baud rate (the printer's self-test page shows it).<\/li>\n<li><strong>Paper and options<\/strong>: paper width (80 or 58 mm),\ncharacters per line, code page (use <em>Plain ASCII<\/em> if strange\ncharacters print), cut after each document, open the drawer on cash\nsales.<\/li>\n<li>Press <strong>Print test page<\/strong> and <strong>Open cash\ndrawer<\/strong>.<\/li>\n<li>Press <strong>Save<\/strong>.<\/li>\n<\/ol>\n<h3 id=\"restaurant-printers\">Restaurant printers<\/h3>\n<p>The <strong>Kitchen printer<\/strong> and <strong>Bar printer<\/strong>\nare optional. In <em>Stations on this printer<\/em>, type the station\nnames exactly as on the menu items (for example <code>Grill, Cold<\/code>\nfor the kitchen and <code>Bar<\/code> for the bar). Tick <em>Print\nkitchen / bar tickets when items are sent to the kitchen<\/em>. On the\norder screen, <strong>Bill<\/strong> prints the guest's bill (never opens\nthe drawer) and <strong>Tickets<\/strong> reprints tickets still in the\nkitchen, marked REPRINT.<\/p>\n<h3 id=\"what-prints-where\">What prints where<\/h3>\n<div class=\"tablewrap\"><table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Document<\/th>\n<th>Printer<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Sale receipt and its COPY reprints, return receipt, restaurant bill\nand paid receipt, X and Z reports<\/td>\n<td>Receipt<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Kitchen and bar tickets<\/td>\n<td>Kitchen / Bar<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Cash drawer pulse (cash sale, restaurant cash bill, <em>Open\ndrawer<\/em> on the till)<\/td>\n<td>Receipt printer<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>A4 reports and documents print through the browser.<\/p>\n<h3 id=\"customer-display-on-a-com-port\">Customer display on a COM\nport<\/h3>\n<p>Under <em>Customer display (COM)<\/em> tick <em>Use a customer display\non this PC<\/em>, press <em>Connect COM port...<\/em>, choose the command\nset (<strong>ESC/POS<\/strong>, <strong>CD5220<\/strong> or <strong>Plain\ntext<\/strong>), baud rate, data bits, parity and stop bits as set on the\ndisplay (usual: 9600, 8, none, 1), characters per line (20 for a 2 x 20\ndisplay), and welcome lines. Press <em>Send test message<\/em>. On the\ntill the display shows the item just added, then the running total, then\nPAID with THANK YOU or CHANGE, and the welcome text again.<\/p>\n<p>There is also a second-screen <strong>Customer display<\/strong> on\nthe till (a browser window) that shows the current cart and total to the\ncustomer.<\/p>\n<h2 id=\"settings-made-on-each-pc\">Settings made on each PC<\/h2>\n<p>Because device settings live in the browser, they must be repeated on\neach till PC and are lost if the browser's site data is cleared. Keep a\nnote of each PC's printer settings.<\/p>\n", "text": " Registers A register is a till. Create and edit registers under POS > Registers & Terminal (Admin only). Each register has a name, can be pinned to one specific Sales location of a warehouse (and, when multi-warehouse is on, must be assigned a warehouse other than Main), and can be tied to one device (below). Cashiers do not need to be given register access one by one: a shift is opened on a register, and the terminal always asks for a PIN before it opens. The PIN identifies the cashier and starts or resumes their own working session on that shift. Binding a register to one device (version 1.13) You can tie a register to one known device so that it can be used only from that PC. Sit at the till PC and sign in as an Admin. Go to POS > Registers & Terminal and press Bind to this device on the register. Give the PC a name, and choose whether its network address must also match (the IP check option). From then on, any other device is refused by the server for that register: the terminal, sales, opening a shift, offline sync and cash movements, each with a clear message. Press Unbind (an Admin, from any device) to free it. Reports, receipts, history and closing a shift stay available from the back office. A device can be the till of one register only. Registers that are not bound behave as before. Binding and unbinding are written to the audit log ( REGISTER_DEVICE_BOUND and REGISTER_DEVICE_UNBOUND ). If the server sits behind a reverse proxy and you use the IP check, set app.device-binding.trusted-proxies to the proxy's address so that the real address of the till is seen. Thermal printing and the cash drawer (version 1.12) Thermal printing is configured per PC, in the browser , at POS > Devices , because each till has its own hardware. Nothing is stored on the server. The complete guide is in the file THERMAL-PRINTING.md supplied with the system; this is a summary. Connection types Connection Use it when Needs Windows driver You want the normal print dialog, laid out for the roll (exactly 80 mm or 58 mm, no margins). Any browser, the printer's Windows driver. Serial / COM You want raw ESC/POS: native text, logo, QR code, cut, cash drawer. Chrome or Edge on https or localhost ; a printer with a serial port or a virtual COM port. USB Same raw printing over WebUSB. Chrome or Edge; the printer on the WinUSB driver (for example with Zadig). Chrome or Edge ask once to allow each device ( Connect device... ); the permission is remembered for the site. If a direct printer does not answer, the document is printed through the Windows driver and a red line explains why. Setting up a till, step by step Open POS > Devices . Receipt printer : choose the connection, press Connect device... , pick the printer. For COM, choose the printer's baud rate (the printer's self-test page shows it). Paper and options : paper width (80 or 58 mm), characters per line, code page (use Plain ASCII if strange characters print), cut after each document, open the drawer on cash sales. Press Print test page and Open cash drawer . Press Save . Restaurant printers The Kitchen printer and Bar printer are optional. In Stations on this printer , type the station names exactly as on the menu items (for example Grill, Cold for the kitchen and Bar for the bar). Tick Print kitchen / bar tickets when items are sent to the kitchen . On the order screen, Bill prints the guest's bill (never opens the drawer) and Tickets reprints tickets still in the kitchen, marked REPRINT. What prints where Document Printer Sale receipt and its COPY reprints, return receipt, restaurant bill and paid receipt, X and Z reports Receipt Kitchen and bar tickets Kitchen / Bar Cash drawer pulse (cash sale, restaurant cash bill, Open drawer on the till) Receipt printer A4 reports and documents print through the browser. Customer display on a COM port Under Customer display (COM) tick Use a customer display on this PC , press Connect COM port... , choose the command set ( ESC/POS , CD5220 or Plain text ), baud rate, data bits, parity and stop bits as set on the display (usual: 9600, 8, none, 1), characters per line (20 for a 2 x 20 display), and welcome lines. Press Send test message . On the till the display shows the item just added, then the running total, then PAID with THANK YOU or CHANGE, and the welcome text again. There is also a second-screen Customer display on the till (a browser window) that shows the current cart and total to the customer. Settings made on each PC Because device settings live in the browser, they must be repeated on each till PC and are lost if the browser's site data is cleared. Keep a note of each PC's printer settings. "}, {"id": "admin-9-e-mail-alerts-and-scheduled-reports", "manual": "admin", "n": 9, "title": "E-mail, alerts and\nscheduled reports", "html": "\n<h2 id=\"e-mail-settings\">E-mail settings<\/h2>\n<p>Many features send e-mail: invoices, statements, reminders, daily\ndigests, scheduled reports, forgotten-password links, public-page\nconfirmations. They all depend on <strong>Settings &gt; Email\nsettings<\/strong>. Fill in:<\/p>\n<ul>\n<li><strong>SMTP host<\/strong> and <strong>port<\/strong>: 587 (STARTTLS)\nor 465 (SSL).<\/li>\n<li><strong>Username<\/strong> and <strong>Password<\/strong> of the mail\naccount.<\/li>\n<li><strong>From email<\/strong> and <strong>From name<\/strong>: what\nrecipients see as the sender.<\/li>\n<li><strong>Skip certificate check<\/strong>: only for a mail server with\na self-signed certificate; avoid it when you can.<\/li>\n<li><strong>Business alerts email<\/strong> (the \"notifications email\"):\nthe address that receives system alerts, daily digests, low-stock\ne-mails and so on.<\/li>\n<\/ul>\n<p>Press <strong>Send test email<\/strong> and check that it arrives.\nMany features show a message such as \"Needs e-mail set up in Settings\"\nuntil this works.<\/p>\n<div class=\"callout tip\">\n<p><strong>Tip:<\/strong> For Gmail or Microsoft 365 accounts you\nnormally need an <em>app password<\/em> rather than the person's normal\npassword. Use a dedicated mailbox for the system, not a personal\none.<\/p>\n<\/div>\n<p>A failed e-mail never blocks the underlying work: an invoice is still\nissued, a job still completed. Look at the server log (chapter 11) if\nmail does not arrive.<\/p>\n<h2 id=\"scheduled-reports\">Scheduled reports<\/h2>\n<p><strong>Settings &gt; Scheduled reports<\/strong> e-mails a report as\nan <strong>Excel or PDF<\/strong> attachment on a schedule.<\/p>\n<ol type=\"1\">\n<li>Press to add a schedule and give it a <strong>Name<\/strong> (for\nexample <em>Monday stock valuation<\/em>).<\/li>\n<li>Choose the <strong>Report<\/strong> and the <strong>Format<\/strong>\n(Excel .xlsx or PDF).<\/li>\n<li>Choose <strong>Repeat<\/strong>: Daily, Weekly (pick the weekday) or\nMonthly (pick the day of month), and the <strong>time<\/strong>.<\/li>\n<li>Add optional filters (Category, Warehouse, Branch, Days) where the\nreport supports them.<\/li>\n<li><strong>Send to<\/strong>: comma-separated addresses, or blank to use\nthe notifications e-mail.<\/li>\n<li>Tick <strong>Active<\/strong> and save.<\/li>\n<\/ol>\n<p>How periods are chosen: reports that cover a date range send the\nperiod that <strong>just ended<\/strong>: yesterday for daily, the\nprevious 7 days for weekly, the previous calendar month for monthly.\nSnapshot reports (stock valuation, ageing and similar) are taken at the\nmoment of sending.<\/p>\n<p>The list shows each schedule's last run. <strong>Send now<\/strong>\nsends it immediately; a paused schedule is marked <em>(paused)<\/em>.\nMore than fifteen reports are available, including the asset reports\nadded in version 1.22.<\/p>\n<div class=\"callout note\">\n<p><strong>Note:<\/strong> Scheduled reports are not stopped when the\nreport's module is locked by an expired licence.<\/p>\n<\/div>\n<h2 id=\"other-automatic-e-mails-and-daily-jobs\">Other automatic e-mails\nand daily jobs<\/h2>\n<div class=\"tablewrap\"><table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Job<\/th>\n<th>Where it is switched on<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Low-stock digest, automatic draft purchase requisitions<\/td>\n<td>Inventory settings<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Customer collection reminders (ageing)<\/td>\n<td>Customers &gt; Collections<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Subscription billing, reminders and digest<\/td>\n<td>Subscriptions job settings<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Rent invoicing, tenant reminders, owner statements<\/td>\n<td>Property management settings<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Lead follow-ups, viewing reminders<\/td>\n<td>Real Estate settings<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Limitation-date warnings, fee reminders, daily deadlines<\/td>\n<td>Law firm settings<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Installment reminders<\/td>\n<td>Installments settings<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Booking and appointment reminders<\/td>\n<td>Booking settings<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Help Desk deadline warnings and automatic closing<\/td>\n<td>Help Desk settings<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Weekly timesheet reminder<\/td>\n<td>Time tracking settings<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>The jobs run once a day at the time shown in each module's settings,\nin the time zone of <strong>System settings<\/strong>. If the server was\noff at that time, a job runs when the server is next up the same\nday.<\/p>\n", "text": " E-mail settings Many features send e-mail: invoices, statements, reminders, daily digests, scheduled reports, forgotten-password links, public-page confirmations. They all depend on Settings > Email settings . Fill in: SMTP host and port : 587 (STARTTLS) or 465 (SSL). Username and Password of the mail account. From email and From name : what recipients see as the sender. Skip certificate check : only for a mail server with a self-signed certificate; avoid it when you can. Business alerts email (the \"notifications email\"): the address that receives system alerts, daily digests, low-stock e-mails and so on. Press Send test email and check that it arrives. Many features show a message such as \"Needs e-mail set up in Settings\" until this works. Tip: For Gmail or Microsoft 365 accounts you normally need an app password rather than the person's normal password. Use a dedicated mailbox for the system, not a personal one. A failed e-mail never blocks the underlying work: an invoice is still issued, a job still completed. Look at the server log (chapter 11) if mail does not arrive. Scheduled reports Settings > Scheduled reports e-mails a report as an Excel or PDF attachment on a schedule. Press to add a schedule and give it a Name (for example Monday stock valuation ). Choose the Report and the Format (Excel .xlsx or PDF). Choose Repeat : Daily, Weekly (pick the weekday) or Monthly (pick the day of month), and the time . Add optional filters (Category, Warehouse, Branch, Days) where the report supports them. Send to : comma-separated addresses, or blank to use the notifications e-mail. Tick Active and save. How periods are chosen: reports that cover a date range send the period that just ended : yesterday for daily, the previous 7 days for weekly, the previous calendar month for monthly. Snapshot reports (stock valuation, ageing and similar) are taken at the moment of sending. The list shows each schedule's last run. Send now sends it immediately; a paused schedule is marked (paused) . More than fifteen reports are available, including the asset reports added in version 1.22. Note: Scheduled reports are not stopped when the report's module is locked by an expired licence. Other automatic e-mails and daily jobs Job Where it is switched on Low-stock digest, automatic draft purchase requisitions Inventory settings Customer collection reminders (ageing) Customers > Collections Subscription billing, reminders and digest Subscriptions job settings Rent invoicing, tenant reminders, owner statements Property management settings Lead follow-ups, viewing reminders Real Estate settings Limitation-date warnings, fee reminders, daily deadlines Law firm settings Installment reminders Installments settings Booking and appointment reminders Booking settings Help Desk deadline warnings and automatic closing Help Desk settings Weekly timesheet reminder Time tracking settings The jobs run once a day at the time shown in each module's settings, in the time zone of System settings . If the server was off at that time, a job runs when the server is next up the same day. "}, {"id": "admin-10-backup-restore-import-and-export", "manual": "admin", "n": 10, "title": "Backup, restore, import and\nexport", "html": "\n<p>All of this is on <strong>Settings &gt; Backup &amp; Data<\/strong>\n(Admin only).<\/p>\n<h2 id=\"backups\">Backups<\/h2>\n<ul>\n<li>A <strong>full database backup runs automatically every\nnight<\/strong>. You can also press <strong>Backup now<\/strong> at any\ntime.<\/li>\n<li>The list shows each backup file with its <strong>size<\/strong> and\n<strong>creation time<\/strong>, with <strong>Download<\/strong>,\n<strong>Restore<\/strong> and <strong>Delete<\/strong> buttons.<\/li>\n<li><strong>Where the files are:<\/strong> when the server runs from its\njar (for example as a Windows service), backups are written to a folder\nnamed <strong>backups<\/strong> next to the jar, beside the\n<strong>logs<\/strong> folder; the folder is created if it is missing. To\nuse another folder, set <code>app.backup.directory<\/code> in\n<code>application.properties<\/code>, as an environment variable\n(<code>APP_BACKUP_DIRECTORY<\/code>) or on the command line.<\/li>\n<li>Backups include the Flyway migration history, so a restore brings\nthe data and its structure version back together.<\/li>\n<\/ul>\n<div class=\"callout warning\">\n<p><strong>Warning:<\/strong> The backup lives on the server. If the\nserver is lost, so are the backups. Regularly <strong>Download<\/strong>\na backup and copy it to another computer or cloud storage, together with\nthe server's document storage folder.<\/p>\n<\/div>\n<h3 id=\"restoring\">Restoring<\/h3>\n<ol type=\"1\">\n<li>Take a fresh backup of the current state first (<strong>Backup\nnow<\/strong>), in case you restore the wrong file.<\/li>\n<li>Press <strong>Restore<\/strong> next to the backup you want, or use\n<em>Restore from an uploaded backup file<\/em> for a file you downloaded\nearlier or brought from another machine.<\/li>\n<li>Confirm. <strong>Restoring replaces the entire current\ndatabase.<\/strong><\/li>\n<li>While it runs the whole system goes into <strong>maintenance\nmode<\/strong>: everyone else (cashiers, other admins) sees a \"please\nwait\" screen.<\/li>\n<li>When it finishes, <strong>restart the application<\/strong> for a\nclean start.<\/li>\n<\/ol>\n<div class=\"callout warning\">\n<p><strong>Warning:<\/strong> Restoring a backup made by a <em>newer<\/em>\nversion into an <em>older<\/em> version makes the migration check fail\n(\"a migration it does not know\"). Deploy the newer version instead, then\nrestore.<\/p>\n<\/div>\n<h3 id=\"good-practice\">Good practice<\/h3>\n<ul>\n<li>Test a restore on a spare computer at least once, before you need\nit.<\/li>\n<li>Keep at least one backup per week for a month and one per month for\na year, outside the server.<\/li>\n<li>Back up before every upgrade (chapter 12), every import, and before\nclosing the books.<\/li>\n<\/ul>\n<h2 id=\"bulk-import\">Bulk import<\/h2>\n<p><strong>Bulk import<\/strong> loads data from a CSV or Excel file. The\nimporters include products, customers, suppliers, categories, brands,\n<strong>customer balances<\/strong>, <strong>supplier balances<\/strong>\nand <strong>ledger balances<\/strong>, plus module imports (employees,\nlaw clients and matters, real estate, and others) inside their own\nmodules.<\/p>\n<p>The process is always the same and is designed to be safe:<\/p>\n<ol type=\"1\">\n<li>Press <strong>Download template<\/strong> for the importer you want\nand fill it in. Keep the header row.<\/li>\n<li>Choose the file and press <strong>Check file<\/strong> first. It\nprocesses the file exactly as the real import would, but <strong>saves\nnothing<\/strong>.<\/li>\n<li>Read the result: how many rows were read, how many <strong>can be\nimported<\/strong> and how many <strong>will be skipped<\/strong>, a list\nof <strong>Rows that will be skipped<\/strong> with the reason for each,\nand a preview of <strong>what will be created<\/strong>.<\/li>\n<li>Correct the file and check again until the result is what you want.\nA row that cannot be used is skipped and listed with the reason; the\nrest of the file still imports.<\/li>\n<li>Press <strong>Import<\/strong>. The result shows how many were\nimported and skipped.<\/li>\n<\/ol>\n<p>Notes:<\/p>\n<ul>\n<li><strong>Opening balances<\/strong> (customer and supplier) become\nreal <code>OB-<\/code> invoices and bills, so they age, appear in\nstatements and collections, and are paid like any other.<\/li>\n<li>For <strong>ledger balances<\/strong>, you can choose <em>Put any\ndifference in Owner's Equity<\/em> so that the opening journal\nbalances.<\/li>\n<li>Module imports read the first sheet only, up to 2,000 rows (.xlsx or\nCSV).<\/li>\n<li>Imports have not been tested on very large files; split big\nfiles.<\/li>\n<\/ul>\n<h2 id=\"export-and-year-end-archive\">Export and year-end archive<\/h2>\n<ul>\n<li><strong>Export products<\/strong> and <strong>Export\ncustomers<\/strong> download the current lists.<\/li>\n<li><strong>Year-end archive<\/strong> downloads a snapshot of one year's\nbusiness activity (sales, purchases, payments, stock adjustments) for\nclosing out a financial year.<\/li>\n<\/ul>\n<div class=\"callout note\">\n<p><strong>Note:<\/strong> The year-end archive is a curated snapshot,\n<strong>not<\/strong> a full database backup. Always keep a real backup\nas well.<\/p>\n<\/div>\n<p>Each list in the system also has its own <strong>Excel, PDF and\nCSV<\/strong> export, with the same filters as the screen.<\/p>\n", "text": " All of this is on Settings > Backup & Data (Admin only). Backups A full database backup runs automatically every night . You can also press Backup now at any time. The list shows each backup file with its size and creation time , with Download , Restore and Delete buttons. Where the files are: when the server runs from its jar (for example as a Windows service), backups are written to a folder named backups next to the jar, beside the logs folder; the folder is created if it is missing. To use another folder, set app.backup.directory in application.properties , as an environment variable ( APP_BACKUP_DIRECTORY ) or on the command line. Backups include the Flyway migration history, so a restore brings the data and its structure version back together. Warning: The backup lives on the server. If the server is lost, so are the backups. Regularly Download a backup and copy it to another computer or cloud storage, together with the server's document storage folder. Restoring Take a fresh backup of the current state first ( Backup now ), in case you restore the wrong file. Press Restore next to the backup you want, or use Restore from an uploaded backup file for a file you downloaded earlier or brought from another machine. Confirm. Restoring replaces the entire current database. While it runs the whole system goes into maintenance mode : everyone else (cashiers, other admins) sees a \"please wait\" screen. When it finishes, restart the application for a clean start. Warning: Restoring a backup made by a newer version into an older version makes the migration check fail (\"a migration it does not know\"). Deploy the newer version instead, then restore. Good practice Test a restore on a spare computer at least once, before you need it. Keep at least one backup per week for a month and one per month for a year, outside the server. Back up before every upgrade (chapter 12), every import, and before closing the books. Bulk import Bulk import loads data from a CSV or Excel file. The importers include products, customers, suppliers, categories, brands, customer balances , supplier balances and ledger balances , plus module imports (employees, law clients and matters, real estate, and others) inside their own modules. The process is always the same and is designed to be safe: Press Download template for the importer you want and fill it in. Keep the header row. Choose the file and press Check file first. It processes the file exactly as the real import would, but saves nothing . Read the result: how many rows were read, how many can be imported and how many will be skipped , a list of Rows that will be skipped with the reason for each, and a preview of what will be created . Correct the file and check again until the result is what you want. A row that cannot be used is skipped and listed with the reason; the rest of the file still imports. Press Import . The result shows how many were imported and skipped. Notes: Opening balances (customer and supplier) become real OB- invoices and bills, so they age, appear in statements and collections, and are paid like any other. For ledger balances , you can choose Put any difference in Owner's Equity so that the opening journal balances. Module imports read the first sheet only, up to 2,000 rows (.xlsx or CSV). Imports have not been tested on very large files; split big files. Export and year-end archive Export products and Export customers download the current lists. Year-end archive downloads a snapshot of one year's business activity (sales, purchases, payments, stock adjustments) for closing out a financial year. Note: The year-end archive is a curated snapshot, not a full database backup. Always keep a real backup as well. Each list in the system also has its own Excel, PDF and CSV export, with the same filters as the screen. "}, {"id": "admin-11-logs-and-monitoring", "manual": "admin", "n": 11, "title": "Logs and monitoring", "html": "\n<p>The system keeps three records of what happens. They answer different\nquestions.<\/p>\n<div class=\"tablewrap\"><table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Record<\/th>\n<th>Question it answers<\/th>\n<th>Where<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>Audit Log<\/strong><\/td>\n<td>Who changed what in the business?<\/td>\n<td>Settings &gt; Audit Log<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Sign-in log<\/strong><\/td>\n<td>Who signed in, and who failed to?<\/td>\n<td>Settings &gt; Sign-in log<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Server logs<\/strong><\/td>\n<td>What is the application itself doing, and why did something\nfail?<\/td>\n<td>Settings &gt; Server logs<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>All three are Admin only.<\/p>\n<h2 id=\"audit-log\">Audit Log<\/h2>\n<p>Every important action is recorded with the time, the user, an action\ncode and a description. Examples: voids and returns, stock adjustments\nand their approvals, price and discount overrides, imports and exports,\nshift opening and closing, binding a register, role and staff changes,\ntime-tracking budget warnings, and many module actions.<\/p>\n<p>Use the filters at the top: a <strong>search box<\/strong> (user or\ndescription), an <strong>action<\/strong> drop-down (<em>All\nactions<\/em>), <strong>From<\/strong> and <strong>To<\/strong> dates and a\npage size (25, 50, 100, 200). The table shows <strong>When, Who, Action,\nWhat happened<\/strong>.<\/p>\n<p>Typical uses: find out who approved a discount, who voided a sale,\nwho changed a price, who exported the customer list.<\/p>\n<h2 id=\"sign-in-log\">Sign-in log<\/h2>\n<p>Every sign-in attempt is recorded, successful or not. The top of the\npage shows how many people <strong>signed in in the last 24\nhours<\/strong>, how many <strong>failed attempts<\/strong> there were,\nand how many <strong>addresses had failures<\/strong>. Below, filter by\n<em>User name<\/em>, by result (<em>All attempts<\/em>, <em>Signed\nin<\/em>, <em>Failed<\/em>) and by dates. Columns: <strong>When, User\nname, Result, Why, Address, Device<\/strong>.<\/p>\n<p>Watch for many failures from one address or for one user name (a sign\nsomeone is guessing passwords). Press <strong>Refresh<\/strong> to\nupdate.<\/p>\n<h2 id=\"server-logs\">Server logs<\/h2>\n<p>The server writes rotating log files. When the backend runs as a jar,\nfor example as a service, they are in a folder named\n<strong>logs<\/strong> next to the jar (before version 1.26.2 they were\nin the jar's folder itself). When it is started from a development tool\nwithout a jar, they are in a <code>logs<\/code> folder where it was\nstarted. The setting <code>app.logging.dir<\/code> (or the environment\nvariable <code>APP_LOGGING_DIR<\/code>) can point them to another folder,\nand then it wins.<\/p>\n<p>The files are:<\/p>\n<ul>\n<li><code>niwe-erp.log<\/code>: the normal application log.<\/li>\n<li><code>niwe-erp-error.log<\/code>: warnings and errors only.<\/li>\n<li><code>niwe-access.log<\/code>: one line per request.<\/li>\n<\/ul>\n<p>Every line carries a <strong>request id<\/strong> and the\n<strong>user<\/strong>. The same request id is returned to the browser in\nthe <code>X-Request-Id<\/code> header, so a support person can match what\na user saw with the server's record.<\/p>\n<p>On <strong>Settings &gt; Server logs<\/strong>:<\/p>\n<ul>\n<li>Choose a file, a level (<em>All levels<\/em>, <em>Info and\nabove<\/em>, <em>Warnings and errors<\/em>, <em>Errors only<\/em>), type a\ntext to search, and pick how many lines to show (last 100, 300, 1000,\n2000).<\/li>\n<li><strong>Auto-refresh<\/strong> keeps watching. <strong>Download\nfile<\/strong> gets the whole file (the screen shows only the last part\nof a large file).<\/li>\n<li>Before the server has written anything the page says <em>No log\nfiles yet<\/em>.<\/li>\n<li>Only files whose names start with <code>niwe-<\/code> and end with\n<code>.log<\/code> appear here. Other files in the same folder are never\nshown or downloadable from the screen.<\/li>\n<\/ul>\n<p>When you ask NIWE for support, send the request id and the relevant\npart of <code>niwe-erp-error.log<\/code>.<\/p>\n<p>The log behaviour is controlled by the <code>app.logging.*<\/code>\nproperties in the backend settings (folder, size and number of files to\nkeep). The account that runs the service must be allowed to write in the\nlog folder; if it is not, no log files appear.<\/p>\n<div class=\"callout tip\">\n<p><strong>Tip:<\/strong> After installing the backend as a service,\nstart it once, then open <strong>Settings &gt; Server logs<\/strong> to\nconfirm the files appear. If the page says <em>No log files yet<\/em>,\ncheck that the service account can write in the jar's folder (it has to\ncreate the <code>logs<\/code> folder).<\/p>\n<\/div>\n<h2 id=\"other-places-to-look\">Other places to look<\/h2>\n<ul>\n<li>The <strong>dashboard<\/strong> has a <em>Needs your attention<\/em>\nsection (overdue invoices, low stock, pending approvals and\nsimilar).<\/li>\n<li><strong>Settings &gt; Modules<\/strong> shows the licence status and\nexpiry.<\/li>\n<li>Each module's <strong>Overview<\/strong> and <strong>Reports<\/strong>\npages show its day-to-day health.<\/li>\n<\/ul>\n", "text": " The system keeps three records of what happens. They answer different questions. Record Question it answers Where Audit Log Who changed what in the business? Settings > Audit Log Sign-in log Who signed in, and who failed to? Settings > Sign-in log Server logs What is the application itself doing, and why did something fail? Settings > Server logs All three are Admin only. Audit Log Every important action is recorded with the time, the user, an action code and a description. Examples: voids and returns, stock adjustments and their approvals, price and discount overrides, imports and exports, shift opening and closing, binding a register, role and staff changes, time-tracking budget warnings, and many module actions. Use the filters at the top: a search box (user or description), an action drop-down ( All actions ), From and To dates and a page size (25, 50, 100, 200). The table shows When, Who, Action, What happened . Typical uses: find out who approved a discount, who voided a sale, who changed a price, who exported the customer list. Sign-in log Every sign-in attempt is recorded, successful or not. The top of the page shows how many people signed in in the last 24 hours , how many failed attempts there were, and how many addresses had failures . Below, filter by User name , by result ( All attempts , Signed in , Failed ) and by dates. Columns: When, User name, Result, Why, Address, Device . Watch for many failures from one address or for one user name (a sign someone is guessing passwords). Press Refresh to update. Server logs The server writes rotating log files. When the backend runs as a jar, for example as a service, they are in a folder named logs next to the jar (before version 1.26.2 they were in the jar's folder itself). When it is started from a development tool without a jar, they are in a logs folder where it was started. The setting app.logging.dir (or the environment variable APP_LOGGING_DIR ) can point them to another folder, and then it wins. The files are: niwe-erp.log : the normal application log. niwe-erp-error.log : warnings and errors only. niwe-access.log : one line per request. Every line carries a request id and the user . The same request id is returned to the browser in the X-Request-Id header, so a support person can match what a user saw with the server's record. On Settings > Server logs : Choose a file, a level ( All levels , Info and above , Warnings and errors , Errors only ), type a text to search, and pick how many lines to show (last 100, 300, 1000, 2000). Auto-refresh keeps watching. Download file gets the whole fi
