digit delivery code by e-mail and text, in the portal and on his order page. The driver, or the staff at the counter, asks the customer for the code and types it under Hand over . The order is then completed exactly as if staff pressed Complete : stock out, invoice, cash recorded as collected (it then waits in Driver cash ), the customer thanked. The code is never shown to staff or drivers and is not on the delivery slip. Five wrong codes block the code for 30 minutes. A customer who lost the code, or whose code was blocked, gets a new one with Send a new code to the customer on the order; the old code stops working. The customer can also complete the order himself: I received my order on his order page, with an optional drawn signature. A signature given there is kept and printed on the delivery slip. Drivers and the staff screen do not offer signatures: hand-over is by the code. A completed order shows how it was received (customer, code or signature) and View signature when there is one. A customer's tap does not prove the driver collected the money: check the driver's cash against the run sheet as before. When the delivery does not go as planned Only staff record a failed or partial delivery (screen Online orders ). The driver's page tells him to call the shop. Delivery failed On an order that is out for delivery press Delivery failed , choose the reason (customer not at home, customer refused the goods, wrong or unreachable address, no answer on the phone, other) and add details if you like. The order goes back to Packed with the reason and the number of tries; the stock stays reserved and the driver stays on the order; the customer is told. Send it out again later (or give it to another driver) or cancel it; from the third failed try the screen suggests cancelling. When delivery times are on, the old window is freed at once and the customer is asked, in the message and on his order page, to choose a new delivery time (a day, then a free window, then Confirm this delivery time ). Staff see Waiting for a new time until it is set and can still use Change time after phoning the customer. If you made delivery times compulsory, the order cannot go out again until a window is set. The customer keeps only part of the goods Tick the box on an order that is out for delivery (or ready for pick-up), type the quantity kept for each line, then Complete (or confirm with the customer's code). The invoice, the stock and the cash to collect cover only what the customer kept; what was not delivered is no longer reserved. The delivery fee stays on the invoice. Loyalty points are earned on what was delivered. If the order was paid online , the part that was paid but not delivered shows under Refunds due as Refund due for the goods not delivered : refund it through the provider or record the refund you made yourself, with its reference. The customer is told. Nothing delivered at all is refused: use Delivery failed or cancel the order. Return pick-ups A return of a delivered order is collected from the customer by a driver , free of charge. In Online Store > Returns , when you Approve a return of a delivery order, a 4-digit return code is made and sent to the customer by e-mail and text (\"A driver will come to collect the goods ... Give the code to the driver only when you hand over the goods\"). Choose the driver at the same time, or later in the A driver collects the goods box (you can change or remove him until the goods are collected, and make a New return code (send again) ). The driver sees the return under Returns to collect on his page, with the customer, phone, address, reason and goods. He taps Collect the goods , types the return code the customer gives him and confirms. The return becomes Collected (a new tab lists them), the customer and the shop are told, and you then press Goods received: put back and refund as usual. Five wrong codes lock that return for 30 minutes; a new code unlocks it. A return of an order picked up at the shop has no address, code or driver: the customer brings the goods back. Cash the driver holds A delivery order paid in cash on delivery and completed keeps its cash as cash to be handed in . Open Online Store > Driver cash : the tab To hand in shows, for each driver, the total and the orders behind it (customer, delivery time, cash collected); the tab Settled shows the latest 200 settlements: collected, handed in, difference, who and when, and the reason. To settle: choose the driver (or All drivers ), and for each order type what the driver really handed in (it starts at the amount collected). A difference needs a reason of at least 3 characters. Tick the orders (or Select all ) and press Settle the selected . All the selected orders are settled together or none is. In the books, the cash the driver took sits in Cash with Drivers until he hands it in; the settlement moves what he handed in to Cash and Bank and posts a short or surplus amount to Cash Over / Short . The order's history says Driver cash handed in: X (difference Y) . A settlement cannot be undone on this screen; correct a mistake with a journal entry. Only delivery orders paid in cash appear here. Orders paid online or by mobile money, and cash taken at the counter on a pick-up, never do. Orders delivered before version 1.72.0 settle with the difference only (see the accounting chapter). Tip: Check Cash with Drivers in the accounts against the To hand in total every day. They should agree; a difference means an order was settled twice or a hand-in was posted by hand. "}, {"id": "user-25-online-store-payments-accounting-and-rep", "manual": "user", "n": 25, "title": "Online Store:\npayments, accounting and reports", "html": "\n<p>This chapter is for the person who watches the money of the shop: the\nowner, the cashier who records payouts, and the accountant. It explains\nthe <strong>Online payments<\/strong> screen, how each payment provider\nis booked, what the program posts at each step of an order, the weekly\nand monthly checks, advertising and the sales reports.<\/p>\n<h2 id=\"online-payments-screen\">Online payments (screen)<\/h2>\n<p><strong>Online Store &gt; Online payments<\/strong> lists every online\npayment for a period, with cards for <strong>Paid<\/strong>, <strong>In\nthe books<\/strong>, <strong>Held for open orders<\/strong>,\n<strong>Refunds due<\/strong>, <strong>Refunded<\/strong>, <strong>To\nreview<\/strong> and <strong>Failed or expired<\/strong>. Use the filters\n(<strong>Under review<\/strong>, <strong>Refunds due<\/strong>,\n<strong>Stuck pending<\/strong>, <strong>Paid<\/strong>,\n<strong>Pending<\/strong>, <strong>Failed<\/strong>,\n<strong>Expired<\/strong>) to see what needs a person:<\/p>\n<ul>\n<li><strong>Under review<\/strong>: money arrived that needs a person,\nfor example a different amount than the order, or a second payment for\nthe same order. Such a payment is <strong>not in the books<\/strong>\nuntil a person has dealt with it. Look at it, deal with it (for instance\nrefund the extra), write what you did and press <strong>Mark as dealt\nwith<\/strong>.<\/li>\n<li><strong>Refunds due<\/strong> (press <em>Go to the orders to refund\nit<\/em>) and <strong>Stuck pending<\/strong> (a payment still pending\nlong after it should have closed).<\/li>\n<\/ul>\n<p>The card <strong>Needs attention<\/strong> on the Online orders screen\nshows how many payments wait for a person.<\/p>\n<h3 id=\"payment-providers\">Payment providers<\/h3>\n<p>The customer chooses a provider at checkout when more than one can\ntake the way to pay. The providers are switched on by your administrator\n(Administrator Manual, chapter 7) and chosen in <strong>Shop settings\n&gt; Online payments<\/strong>:<\/p>\n<ul>\n<li><strong>MTN Mobile Money (MoMo)<\/strong> for Rwanda: the customer\ntypes an MTN number and approves on the phone. Refunds can go back\nthrough MTN.<\/li>\n<li><strong>Airtel Money<\/strong> for Rwanda: the customer types an\nAirtel number and approves on the phone. <strong>Refunds are done by\nhand<\/strong>: refund from the Airtel Money account, then record it with\n<strong>I refunded it myself<\/strong> and the Airtel reference.<\/li>\n<li><strong>Card<\/strong>, when a card provider has been connected.<\/li>\n<li><strong>A simulated provider<\/strong> exists for tests only; never\nuse it with real customers.<\/li>\n<\/ul>\n<p>A callback from a provider is never believed on its own: the shop\nasks the provider for the payment's status and accepts the callback only\nwhen the provider's own answer agrees. A lost callback is covered by a\nstatus check about once a minute.<\/p>\n<h2 id=\"where-the-money-goes-accounts-of-each-provider\">Where the money\ngoes: accounts of each provider<\/h2>\n<p>Money paid online is <strong>not<\/strong> cash in your hand. The\nprovider holds it until it pays you out. So each provider has two\naccounts in your chart of accounts:<\/p>\n<ul>\n<li><strong>What the provider still owes you<\/strong> (the\n<em>clearing<\/em> account): payments the provider confirmed and has not\nyet paid out.<\/li>\n<li><strong>Payouts arrive in<\/strong> (the <em>payout<\/em> account):\nthe wallet or bank account the provider pays into.<\/li>\n<\/ul>\n<p>With the Rwanda chart, MTN Mobile Money uses clearing account 1021\nand wallet 1011; Airtel Money uses 1022 and 1012; Card uses 1030 and the\nbank account 1013 for card settlements. (Chad chart: 5215 and 5217, 5216\nand 5218, 5213 and 5219.) The old shared Mobile Money Clearing (1020,\nChad 5212) stays for the test provider and for orders paid before these\naccounts existed.<\/p>\n<p>Open <strong>Online Store &gt; Online payments &gt; Accounts by\nprovider<\/strong> to see every provider, switched on or not, and choose\nits two accounts. Each can be an existing asset account or a new one\ncreated on the spot (<strong>Create a new account...<\/strong>, with a\nsuggested name and the next free code). <strong>None<\/strong> for the\npayout account means Cash and Bank. When you add a new provider (MOOV,\nORANGE, a bank gateway), it appears in this list once a developer has\nconnected it, and you choose its accounts here.<\/p>\n<p>Rules the screen enforces:<\/p>\n<ul>\n<li>a clearing account belongs to <strong>one<\/strong> provider and must\nbe an ordinary asset account (not Cash and Bank or another system\naccount);<\/li>\n<li>a clearing account <strong>cannot be changed while the provider\nstill owes you money on it<\/strong>: record its payouts first;<\/li>\n<li>a payout account may be shared (for example one bank account for all\ncard payouts);<\/li>\n<li>the clearing and payout accounts of a provider must be\ndifferent.<\/li>\n<\/ul>\n<p>Orders paid before you set or changed the accounts keep using the\naccounts they were booked to, so no balance moves.<\/p>\n<h2 id=\"what-the-program-posts-for-an-online-order\">What the program\nposts for an online order<\/h2>\n<p>You do not post any of this by hand; it is here so that the\naccountant can follow the entries. Every entry's description ends with\nthe order code, for example <em>(online order 9FMMY2MC)<\/em>, so\nsearching the journal for the code finds all the entries of an\norder.<\/p>\n<div class=\"tablewrap\"><table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>When<\/th>\n<th>Debit<\/th>\n<th>Credit<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>The provider confirms the payment<\/td>\n<td>The provider's clearing account<\/td>\n<td>Online Customer Deposits (2810)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>The order is delivered: the deposit is applied to the invoice<\/td>\n<td>Online Customer Deposits<\/td>\n<td>Accounts Receivable<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>The order is delivered: goods, VAT and cost<\/td>\n<td>Accounts Receivable; Cost of Goods Sold<\/td>\n<td>Sales Revenue, VAT Payable; Inventory<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>The order is delivered: the discount and the delivery fee are shown\napart<\/td>\n<td>Sales Discounts Given (4040); Sales Revenue (the fee)<\/td>\n<td>Sales Revenue (the discount); Delivery Income (4030)<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>A paid order is cancelled or rejected and the money is paid\nback<\/td>\n<td>Online Customer Deposits<\/td>\n<td>The provider's clearing account (refund through the provider) or\nCash and Bank (refunded by hand)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Part of a paid order is not delivered and the difference is paid\nback<\/td>\n<td>Online Customer Deposits<\/td>\n<td>The same<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Goods are returned and refunded<\/td>\n<td>Sales Revenue, VAT Payable, Inventory (at the cost sold); Accounts\nReceivable<\/td>\n<td>Accounts Receivable, Cost of Goods Sold; the provider's clearing\naccount or Cash and Bank<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>A cash order is delivered<\/td>\n<td>Cash with Drivers (1050)<\/td>\n<td>Accounts Receivable<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>The driver hands in the cash<\/td>\n<td>Cash and Bank (what he handed in); Cash Over / Short if short<\/td>\n<td>Cash with Drivers; Cash Over / Short if over<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>A customer earns loyalty points<\/td>\n<td>Customer Rewards Expense<\/td>\n<td>Loyalty Points Liability (2820)<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Points are spent on a delivered order<\/td>\n<td>Loyalty Points Liability<\/td>\n<td>Customer Rewards Expense<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>The provider pays out<\/td>\n<td>The provider's payout account (net); Payment Provider Fees\n(5240)<\/td>\n<td>The provider's clearing account (gross)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Things to know:<\/p>\n<ul>\n<li><strong>Sales Revenue shows the full price of the goods.<\/strong>\nThe coupon and points discount is in <strong>Sales Discounts\nGiven<\/strong>, before tax, and the delivery fee is in <strong>Delivery\nIncome<\/strong>, before tax. The total income of an order does not\nchange.<\/li>\n<li><strong>A return reverses the VAT too<\/strong>, not only the net\nprice, and the goods go back into Inventory at the cost they had when\nthey were sold, not at today's cost price. A cash-on-delivery order\nwhose payment was never collected has nothing to hand back: no cash\nentry.<\/li>\n<li>Nothing is booked for an order that is <strong>cancelled or\nrejected<\/strong> before delivery, except the deposit paid back when it\nwas paid online.<\/li>\n<li><strong>Branch<\/strong>: with more than one branch, the shop's\nentries carry the branch chosen in Shop settings &gt; <em>Branch the\nshop sells for<\/em>.<\/li>\n<li><strong>Orders from before the accounting releases.<\/strong> Orders\npaid before version 1.71.0 have no deposit: their payment is booked to\nthe provider's clearing account when they are delivered. Orders\ndelivered before version 1.72.0 settle driver cash with the difference\nonly. Returns made before version 1.70.0 keep their old net refund\nfigure. Loyalty points earned before version 1.73.0 are not in the\nliability: post one manual opening entry for the points customers\nalready hold (Dr Customer Rewards Expense, Cr Loyalty Points Liability,\none point = one unit of currency).<\/li>\n<\/ul>\n<h2 id=\"payouts-recording-what-the-provider-paid-you\">Payouts: recording\nwhat the provider paid you<\/h2>\n<p>Open <strong>Online Store &gt; Online payments &gt; Payouts from the\nproviders<\/strong>. It shows one balance per provider with a clearing\naccount, then Card: <strong>what the provider still owes you<\/strong>.\nThese balances come straight from the ledger (debits minus credits), so\nthey always agree with the books.<\/p>\n<p>To record a payout, choose the provider (<strong>Way<\/strong>), type\n<strong>Paid by customers (gross)<\/strong> (the total of the payments\nthis payout covers), the <strong>Provider fee<\/strong>, the\n<strong>Date<\/strong> and a <strong>Reference<\/strong> from the\nprovider's statement, and press <strong>Record payout<\/strong>.\n<strong>Reached the bank<\/strong> is worked out for you (gross minus\nfee). The net goes to the provider's payout account and the fee to\n<strong>Payment Provider Fees<\/strong>. If a provider pays out net of\nits fee and of refunds, still enter the gross the payout covers and the\nfee, so the rest reaches the right account.<\/p>\n<p>To move money from a provider's wallet to your main bank, or to pay a\nsupplier from it, post a transfer with a manual journal entry on those\naccounts.<\/p>\n<p>A balance on the old shared Mobile Money account (payments from\nbefore the provider accounts) is cleared with a payout of the way\n<em>Mobile money (earlier payments)<\/em>, which lands in Cash and\nBank.<\/p>\n<h2 id=\"routines-for-the-shops-money\">Routines for the shop's money<\/h2>\n<p><strong>Daily<\/strong> (owner or cashier): count the till and record\nthe difference; compare <strong>Cash with Drivers<\/strong> with the\n<em>To hand in<\/em> total of <strong>Driver cash<\/strong>; look at\n<strong>Online payments<\/strong> for payments <em>Under review<\/em> and\n<em>Refunds due<\/em>.<\/p>\n<p><strong>Weekly<\/strong> (one named person): record every provider\npayout received, with its fee. Each provider's balance should be about\nwhat it has collected since its last payout; a balance that keeps\ngrowing or goes negative means a payout or a payment is missing. Look\nfor orders stuck in one status, failed deliveries and returns\nwaiting.<\/p>\n<p><strong>Monthly<\/strong> (accountant): the bank, MTN, Airtel and card\nstatements agree with their accounts; the trial balance balances; VAT\nPayable agrees with the tax return; Accounts Receivable, Accounts\nPayable and Inventory (against a stock count of a few products) are\nright; <strong>Customer Credit Payable<\/strong>, <strong>Gift Card\nLiability<\/strong> and <strong>Loyalty Points Liability<\/strong> agree\nwith their customer lists; review <strong>Cash Over / Short<\/strong>,\n<strong>Payment Provider Fees<\/strong> and <strong>Suspense<\/strong>\n(Suspense must be zero: anything in it is an error to find). Then lock\nthe month in Accounting and take a backup with the month's name.<\/p>\n<h2 id=\"advertising\">Advertising<\/h2>\n<p>The shop can sell space to other businesses. Open <strong>Online\nStore &gt; Advertising<\/strong>, which has three tabs:<\/p>\n<ul>\n<li><strong>Advertisers<\/strong>: the businesses that pay you.<\/li>\n<li><strong>Ads<\/strong>: a picture, a link (a plain web address, http\nor https), the places it appears, the dates, a note about the fee and a\n<em>paid<\/em> flag. The picture is checked by its content and a big JPEG\nor PNG is shrunk; pictures up to 5 MB.<\/li>\n<li><strong>Report<\/strong>: views, clicks and the click rate for each\nad over a period, for one advertiser or all, with the fee and whether it\nis paid. Print it or save it as PDF, or download it as CSV.<\/li>\n<\/ul>\n<p>There are three <strong>places<\/strong>: the top of the first page,\nabove the product list (also on product pages), and the order tracking\npage. Several ads in a place take turns, every ad is labelled\n<strong>Advertisement<\/strong>, and links open in a new tab. An ad\ncounts as <em>shown<\/em> when it is really on screen (once per visitor\nand half an hour). A click goes through the shop, which counts it and\nsends the visitor to the saved address.<\/p>\n<h2 id=\"online-sales-reports\">Online sales reports<\/h2>\n<p><strong>Online Store &gt; Sales reports<\/strong> has six reports,\neach with a from and to date and the usual <strong>Excel<\/strong> and\n<strong>PDF<\/strong> download. They are also in the list of reports you\ncan have e-mailed on a schedule (Reports &gt; Scheduled).<\/p>\n<p><strong>An order counts as a sale on the day it was\ncompleted<\/strong>, the day it was handed over and the invoice was\nissued, not the day the customer ordered or paid. The money is what the\ninvoice says, so the totals agree with your invoices. Refunds of returns\nare shown on the day they were refunded.<\/p>\n<ul>\n<li><strong>Online sales by day<\/strong>: for each day, the orders\ncompleted, how many were delivery and how many pick-up, goods, coupon\ndiscounts, delivery fees, <strong>Invoiced<\/strong>, returns refunded\nthat day and <strong>Net<\/strong> (invoiced minus refunded).<\/li>\n<li><strong>Online sales orders<\/strong>: every completed order with its\ninvoice number, <strong>Invoiced<\/strong>, <strong>Paid<\/strong> and\n<strong>Refunded<\/strong>, so you can check a total order by order.<\/li>\n<li><strong>Online sales by payment method<\/strong>: how those invoices\nwere paid (cash, mobile money, card), and <strong>Not collected\nyet<\/strong> for the part of the invoices nobody has paid.<\/li>\n<li><strong>Online orders not counted as sales<\/strong>: orders placed\nin the period that are not sales: <strong>Open (being handled)<\/strong>,\n<strong>Waiting for online payment<\/strong>, <strong>Never paid\n(cancelled)<\/strong>, <strong>Cancelled<\/strong> and\n<strong>Rejected<\/strong>, with their value, what was paid online and\nwhat was refunded. Use it to see money that is still waiting or must be\ngiven back.<\/li>\n<li><strong>Online sales by coupon<\/strong>: for each coupon the orders,\nthe discount given, the delivery fees waived and the amount\ninvoiced.<\/li>\n<li><strong>Online best-selling products<\/strong>: quantity sold,\nrevenue after coupons, returned quantity and refunds, and the net, best\nfirst.<\/li>\n<\/ul>\n<div class=\"callout note\">\n<p><strong>Note:<\/strong> An order whose invoice was voided still shows\nas an order but with <strong>Invoiced<\/strong> 0, and a payment on a\nvoided invoice is not counted. The by-day and payment reports are cut at\nmidnight in the time zone of the server.<\/p>\n<\/div>\n<h2 id=\"known-limits\">Known limits<\/h2>\n<ul>\n<li>A payment under review is not in the books until staff deal with\nit.<\/li>\n<li>Real MTN, Airtel and card payments depend on the keys and the\napproval of the provider. Before opening the shop to customers, do a\ntest with each provider: one small real order delivered, one cancelled\nand refunded, one part-returned, and one payout recorded and compared\nwith the provider's own statement.<\/li>\n<li>A provider that pays out net of its fee: enter the gross and the\nfee, as above.<\/li>\n<\/ul>\n", "text": " This chapter is for the person who watches the money of the shop: the owner, the cashier who records payouts, and the accountant. It explains the Online payments screen, how each payment provider is booked, what the program posts at each step of an order, the weekly and monthly checks, advertising and the sales reports. Online payments (screen) Online Store > Online payments lists every online payment for a period, with cards for Paid , In the books , Held for open orders , Refunds due , Refunded , To review and Failed or expired . Use the filters ( Under review , Refunds due , Stuck pending , Paid , Pending , Failed , Expired ) to see what needs a person: Under review : money arrived that needs a person, for example a different amount than the order, or a second payment for the same order. Such a payment is not in the books until a person has dealt with it. Look at it, deal with it (for instance refund the extra), write what you did and press Mark as dealt with . Refunds due (press Go to the orders to refund it ) and Stuck pending (a payment still pending long after it should have closed). The card Needs attention on the Online orders screen shows how many payments wait for a person. Payment providers The customer chooses a provider at checkout when more than one can take the way to pay. The providers are switched on by your administrator (Administrator Manual, chapter 7) and chosen in Shop settings > Online payments : MTN Mobile Money (MoMo) for Rwanda: the customer types an MTN number and t account (not Cash and Bank or another system account); a clearing account cannot be changed while the provider still owes you money on it : record its payouts first; a payout account may be shared (for example one bank account for all card payouts); the clearing and payout accounts of a provider must be different. Orders paid before you set or changed the accounts keep using the accounts they were booked to, so no balance moves. What the program posts for an online order You do not post any of this by hand; it is here so that the accountant can follow the entries. Every entry's description ends with the order code, for example (online order 9FMMY2MC) , so searching the journal for the code finds all the entries of an order. When Debit Credit The provider confirms the payment The provider's clearing account Online Customer Deposits (2810) The order is delivered: the deposit is applied to the invoice Online Customer Deposits Accounts Receivable The order is delivered: goods, VAT and cost Accounts Receivable; Cost of Goods Sold Sales Revenue, VAT Payable; Inventory The order is delivered: the discount and the delivery fee are shown apart Sales Discounts Given (4040); Sales Revenue (the fee) Sales Revenue (the discount); Delivery Income (4030) A paid order is cancelled or rejected and the money is paid back Online Customer Deposits The provider's clearing account (refund through the provider) or Cash and Bank (refunded by hand) Part of a paid order is not delivered and the difference is paid back Online Customer Deposits The same Goods are returned and refunded Sales Revenue, VAT Payable, Inventory (at the cost sold); Accounts Receivable Accounts Receivable, Cost of Goods Sold; the provider's clearing account or Cash and Bank A cash order is delivered Cash with Drivers (1050) Accounts Receivable The driver hands in the cash Cash and Bank (what he handed in); Cash Over / Short if short Cash with Drivers; Cash Over / Short if over A customer earns loyalty points Customer Rewards Expense Loyalty Points Liability (2820) Points are spent on a delivered order Loyalty Points Liability Customer Rewards Expense The provider pays out The provider's payout account (net); Payment Provider Fees (5240) The provider's clearing account (gross) Things to know: Sales Revenue shows the full price of the goods. The coupon and points discount is in Sales Discounts Given , before tax, and the delivery fee is in Delivery Income , before tax. The total income of an order does not change. A return reverses the VAT too , not only the net price, and the goods go back into Inventory at the cost they had when they were sold, not at today's cost price. A cash-on-delivery order whose payment was never collected has nothing to hand back: no cash entry. Nothing is booked for an order that is cancelled or rejected before delivery, except the deposit paid back when it was paid online. Branch : with more than one branch, the shop's entries carry the branch chosen in Shop settings > Branch the shop sells for . Orders from before the accounting releases. Orders paid before version 1.71.0 have no deposit: their payment is booked to the provider's clearing account when they are delivered. Orders delivered before version 1.72.0 settle driver cash with the difference only. Returns made before version 1.70.0 keep their old net refund figure. Loyalty points earned before version 1.73.0 are not in the liability: post one manual opening entry for the points customers already hold (Dr Customer Rewards Expense, Cr Loyalty Points Liability, one point = one unit of currency). Payouts: recording what the provider paid you Open Online Store > Online payments > Payouts from the providers . It shows one balance per provider with a clearing account, then Card: what the provider still owes you . These balances come straight from the ledger (debits minus credits), so they always agree with the books. To record a payout, choose the provider ( Way ), type Paid by customers (gross) (the  which has three tabs: Advertisers : the businesses that pay you. Ads : a picture, a link (a plain web address, http or https), the places it appears, the dates, a note about the fee and a paid flag. The picture is checked by its content and a big JPEG or PNG is shrunk; pictures up to 5 MB. Report : views, clicks and the click rate for each ad over a period, for one advertiser or all, with the fee and whether it is paid. Print it or save it as PDF, or download it as CSV. There are three places : the top of the first page, above the product list (also on product pages), and the order tracking page. Several ads in a place take turns, every ad is labelled Advertisement , and links open in a new tab. An ad counts as shown when it is really on screen (once per visitor and half an hour). A click goes through the shop, which counts it and sends the visitor to the saved address. Online sales reports Online Store > Sales reports has six reports, each with a from and to date and the usual Excel and PDF download. They are also in the list of reports you can have e-mailed on a schedule (Reports > Scheduled). An order counts as a sale on the day it was completed , the day it was handed over and the invoice was issued, not the day the customer ordered or paid. The money is what the invoice says, so the totals agree with your invoices. Refunds of returns are shown on the day they were refunded. Online sales by day : for each day, the orders completed, how many were delivery and how many pick-up, goods, coupon discounts, delivery fees, Invoiced , returns refunded that day and Net (invoiced minus refunded). Online sales orders : every completed order with its invoice number, Invoiced , Paid and Refunded , so you can check a total order by order. Online sales by payment method : how those invoices were paid (cash, mobile money, card), and Not collected yet for the part of the invoices nobody has paid. Online orders not counted as sales : orders placed in the period that are not sales: Open (being handled) , Waiting for online payment , Never paid (cancelled) , Cancelled and Rejected , with their value, what was paid online and what was refunded. Use it to see money that is still waiting or must be given back. Online sales by coupon : for each coupon the orders, the discount given, the delivery fees waived and the amount invoiced. Online best-selling products : quantity sold, revenue after coupons, returned quantity and refunds, and the net, best first. Note: An order whose invoice was voided still shows as an order but with Invoiced 0, and a payment on a voided invoice is not counted. The by-day and payment reports are cut at midnight in the time zone of the server. Known limits A payment under review is not in the books until staff deal with it. Real MTN, Airtel and card payments depend on the keys and the approval of the provider. Before opening the shop to customers, do a test with each provider: one small real order delivered, one cancelled and refunded, one part-returned, and one payout recorded and compared with the provider's own statement. A provider that pays out net of its fee: enter the gross and the fee, as above. "}, {"id": "user-26-glossary-and-common-questions", "manual": "user", "n": 26, "title": "Glossary and common\nquestions", "html": "\n<h2 id=\"glossary\">Glossary<\/h2>\n<div class=\"tablewrap\"><table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Term<\/th>\n<th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>Online order<\/strong><\/td>\n<td>An order a customer placed on the public shop at <code>/shop<\/code>.\nIt waits for staff, then becomes a sale order.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Sellable now<\/strong><\/td>\n<td>What the online shop may still sell of a product: stock in sellable\nwarehouse locations, minus quantities reserved on confirmed sales\norders, minus the shop's buffer.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Buffer (Units kept back for the till)<\/strong><\/td>\n<td>The number of units per product the shop never sells, so the last\nunit is not sold twice. 1 unless changed.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Delivery code<\/strong><\/td>\n<td>A 4-digit code the customer receives when the order goes out. The\ndriver types it to hand the order over. Staff never see it.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Return code<\/strong><\/td>\n<td>The same idea for a return pick-up: the customer gives it to the\ndriver who collects the goods.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Run sheet / Delivery slip<\/strong><\/td>\n<td>Printed lists for a driver: all his stops for the day (run sheet)\nand one page per order (slip).<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Driver link and PIN<\/strong><\/td>\n<td>The private web address and 4-digit PIN that let a driver use his\nown page on a phone without a staff login.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Driver cash<\/strong><\/td>\n<td>Cash a driver took at the door and has not yet handed in. Followed\nin Online Store &gt; Driver cash and in the account Cash with\nDrivers.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Payment provider<\/strong><\/td>\n<td>The company that takes an online payment: MTN Mobile Money, Airtel\nMoney, a card gateway.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Clearing account<\/strong><\/td>\n<td>The account showing what a payment provider still owes the shop\nuntil it pays out.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Payout<\/strong><\/td>\n<td>The provider paying what it collected, minus its fee, into the\nshop's wallet or bank account.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Online Customer Deposits<\/strong><\/td>\n<td>Money a customer paid online for an order that is not yet\ndelivered.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Loyalty Points Liability<\/strong><\/td>\n<td>What the shop owes customers for the loyalty points they hold.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Delivery window<\/strong><\/td>\n<td>A time slot (for example 08:00-11:00) the customer may choose for\ndelivery.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Coupon<\/strong><\/td>\n<td>A code a customer types at checkout on the online shop for a\npercentage or amount off the items, or free delivery.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Webhook<\/strong><\/td>\n<td>The address a payment provider calls to say a payment was made. The\nshop also checks pending payments itself.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Register<\/strong><\/td>\n<td>A physical till.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Session / Shift<\/strong><\/td>\n<td>One working period on a register, opened with a float and closed\nwith a count.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Float<\/strong><\/td>\n<td>The cash put in the drawer at the start of a shift.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>X report / Z report<\/strong><\/td>\n<td>A mid-shift snapshot (X) and the closing, numbered report (Z).<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Void<\/strong><\/td>\n<td>Cancelling a document before or instead of correcting it; leaves a\ntrail.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Credit note<\/strong><\/td>\n<td>A document that reduces what a customer owes, issued when an invoice\nis voided or cancelled.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Quotation / Sale order / Invoice<\/strong><\/td>\n<td>An offer / a confirmed order / a request for payment.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Bill<\/strong><\/td>\n<td>A supplier's invoice to you.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>GRN<\/strong><\/td>\n<td>Goods received note, printed when stock is received.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>BOM<\/strong><\/td>\n<td>Bill of materials: the recipe for a manufactured product.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>SKU<\/strong><\/td>\n<td>Stock keeping unit: a product's own code.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Landed cost<\/strong><\/td>\n<td>Freight, duty and clearing added to the cost of goods received.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Reorder level<\/strong><\/td>\n<td>The stock level at which a product should be re-bought.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Warehouse / Location<\/strong><\/td>\n<td>A place stock is kept, and a shelf or area inside it (Receiving,\nSales, Storage, Damaged).<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Branch<\/strong><\/td>\n<td>A business location for reporting: sales, purchases and expenses are\ntagged with it.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Cost center<\/strong><\/td>\n<td>A tag (department, project) for cost reporting.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Chart of accounts<\/strong><\/td>\n<td>The list of accounts the ledger posts to.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Journal entry<\/strong><\/td>\n<td>A set of debit and credit lines that balance.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Approver / Manager PIN<\/strong><\/td>\n<td>A person with the right to approve; their PIN confirms it at your\nscreen.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Accrual / Depreciation<\/strong><\/td>\n<td>Recognising a cost when incurred / spreading an asset's cost over\nits life.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>ADR / RevPAR<\/strong><\/td>\n<td>Average daily rate / revenue per available room (hotels).<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>SLA<\/strong><\/td>\n<td>A promised reply or resolution time (Help Desk deadlines).<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>MRR / Churn<\/strong><\/td>\n<td>Monthly recurring revenue / share of subscriptions lost\n(Subscriptions).<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Trust account<\/strong><\/td>\n<td>The account holding a client's money, separate from the firm's (Law\nfirm).<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"common-questions\">Common questions<\/h2>\n<p><strong>I cannot see a menu item mentioned in this manual.<\/strong>\nYour business may not use that module, or your role does not include it.\nAsk your administrator.<\/p>\n<p><strong>I made a mistake on an invoice.<\/strong> If it is still a\ndraft, edit or delete it. If it is issued, void it (or cancel and credit\nit if payments exist) and create it again.<\/p>\n<p><strong>A sale was refused because of stock.<\/strong> Stock may be\nlow and negative stock is not allowed. Receive or adjust stock first, or\nask a manager.<\/p>\n<p><strong>A discount asks for a manager.<\/strong> The discount is above\nyour allowed limit. A manager types their PIN on your screen.<\/p>\n<p><strong>The till shows Offline.<\/strong> Keep selling; sales queue\nand sync automatically when the connection returns. Do not clear browser\ndata meanwhile.<\/p>\n<p><strong>I forgot my password or PIN.<\/strong> Use <em>Forgot\npassword?<\/em> if your e-mail is on your profile; otherwise ask an\nadministrator. Change your own PIN in <strong>My profile<\/strong>.<\/p>\n<p><strong>How do I get the numbers out to Excel?<\/strong> Every list\nand report has <strong>Excel, PDF and CSV<\/strong> buttons; they export\nexactly what is on screen, with the same filters.<\/p>\n<p><strong>Who changed this?<\/strong> Ask an administrator to check the\n<strong>Audit Log<\/strong>; most important actions are recorded with the\nperson and time.<\/p>\n", "text": " Glossary Term Meaning Online order An order a customer placed on the public shop at /shop . It waits for staff, then becomes a sale order. Sellable now What the online shop may still sell of a product: stock in sellable warehouse locations, minus quantities reserved on confirmed sales orders, minus the shop's buffer. Buffer (Units kept back for the till) The number of units per product the shop never sells, so the last unit is not sold twice. 1 unless changed. Delivery code A 4-digit code the customer receives when the order goes out. The driver types it to hand the order over. Staff never see it. Return code The same idea for a return pick-up: the customer gives it to the driver who collects the goods. Run sheet / Delivery slip Printed lists for a driver: all his stops for the day (run sheet) and one page per order (slip). Driver link and PIN The private web address and 4-digit PIN that let a driver use his own page on a phone without a staff login. Driver cash Cash a driver took at the door and has not yet handed in. Followed in Online Store > Driver cash and in the account Cash with Drivers. Payment provider The company that takes an online payment: MTN Mobile Money, Airtel Money, a card gateway. Clearing account The account showing what a payment provider still owes the shop until it pays out. Payout The provider paying what it collected, minus its fee, into the shop's wallet or bank account. Online Customer Deposits Money a customer paid online for an order that is not yet delivered. Loyalty Points Liability What the shop owes customers for the loyalty points they hold. Delivery window A time slot (for example 08:00-11:00) the customer may choose for delivery. Coupon A code a customer types at checkout on the online shop for a percentage or amount off the items, or free delivery. Webhook The address a payment provider calls to say a payment was made. The shop also checks pending payments itself. Register A physical till. Session / Shift One working period on a register, opened with a float and closed with a count. Float The cash put in the drawer at the start of a shift. X report / Z report A mid-shift snapshot (X) and the closing, numbered report (Z). Void Cancelling a document before or instead of correcting it; leaves a trail. Credit note A document that reduces what a customer owes, issued when an invoice is voided or cancelled. Quotation / Sale order / Invoice An offer / a confirmed order / a request for payment. Bill A supplier's invoice to you. GRN Goods received note, printed when stock is received. BOM Bill of materials: the recipe for a manufactured product. SKU Stock keeping unit: a product's own code. Landed cost Freight, duty and clearing added to the cost of goods received. Reorder level The stock level at which a product should be re-bought. Warehouse / Location A place stock is kept, and a shelf or area inside it (Receiving, Sales, Storage, Damaged). Branch A business location for reporting: sales, purchases and expenses are tagged with it. Cost center A tag (department, project) for cost reporting. Chart of accounts The list of accounts the ledger posts to. Journal entry A set of debit and credit lines that balance. Approver / Manager PIN A person with the right to approve; their PIN confirms it at your screen. Accrual / Depreciation Recognising a cost when incurred / spreading an asset's cost over its life. ADR / RevPAR Average daily rate / revenue per available room (hotels). SLA A promised reply or resolution time (Help Desk deadlines). MRR / Churn Monthly recurring revenue / share of subscriptions lost (Subscriptions). Trust account The account holding a client's money, separate from the firm's (Law firm). Common questions I cannot see a menu item mentioned in this manual. Your business may not use that module, or your role does not include it. Ask your administrator. I made a mistake on an invoice. If it is still a draft, edit or delete it. If it is issued, void it (or cancel and credit it if payments exist) and create it again. A sale was refused because of stock. Stock may be low and negative stock is not allowed. Receive or adjust stock first, or ask a manager. A discount asks for a manager. The discount is above your allowed limit. A manager types their PIN on your screen. The till shows Offline. Keep selling; sales queue and sync automatically when the connection returns. Do not clear browser data meanwhile. I forgot my password or PIN. Use Forgot password? if your e-mail is on your profile; otherwise ask an administrator. Change your own PIN in My profile . How do I get the numbers out to Excel? Every list and report has Excel, PDF and CSV buttons; they export exactly what is on screen, with the same filters. Who changed this? Ask an administrator to check the Audit Log ; most important actions are recorded with the person and time. "}, {"id": "cards-1-cashier", "manual": "cards", "n": 1, "title": "Cashier", "html": "\n<p><em>Sell, take payment, count the till.<\/em><\/p>\n<h2 id=\"start-of-shift\">Start of shift<\/h2>\n<ul>\n<li>Your supervisor opens the session on your register with the opening\nfloat (POS &gt; Registers &amp; Terminal &gt; Open session).<\/li>\n<li>Press <strong>Go to terminal<\/strong> and type your\n<strong>PIN<\/strong>.<\/li>\n<\/ul>\n<h2 id=\"selling\">Selling<\/h2>\n<ul>\n<li>Scan the barcode or tap a product tile. Search by name or SKU if\nneeded.<\/li>\n<li>Choose or add the <strong>customer<\/strong> if needed (credit,\nloyalty points).<\/li>\n<li>Press <strong>Payment<\/strong>, pick the method (split across\nseveral if needed), complete the sale.<\/li>\n<li>A discount over your limit, a void or a hand-changed price needs a\n<strong>manager's PIN<\/strong>.<\/li>\n<\/ul>\n<h2 id=\"returns-and-mistakes\">Returns and mistakes<\/h2>\n<ul>\n<li><strong>Receipts<\/strong> shows this shift's sales with <strong>View\n/ Reprint<\/strong> (reprints are marked COPY).<\/li>\n<li>A return: <strong>Process a return<\/strong>, type the invoice\nnumber, choose items, refund method and reason.<\/li>\n<\/ul>\n<h2 id=\"cash\">Cash<\/h2>\n<ul>\n<li>Press <strong>Cash<\/strong> for paid-in, paid-out and safe drops.\nDrop cash into the safe when the drawer is heavy.<\/li>\n<li><strong>X report<\/strong> any time; it changes nothing.<\/li>\n<\/ul>\n<h2 id=\"end-of-shift\">End of shift<\/h2>\n<ul>\n<li>Record paid-in, paid-out and drops first. Open the close screen,\n<strong>count the drawer<\/strong> by notes and coins, explain any\ndifference, <strong>Close session<\/strong>, print the <strong>Z\nreport<\/strong>.<\/li>\n<\/ul>\n<h2 id=\"if-the-connection-drops\">If the connection drops<\/h2>\n<ul>\n<li>Keep selling: sales are queued and sync by themselves. Do not clear\nthe browser or close it while the offline queue has sales.<\/li>\n<\/ul>\n<div class=\"callout note\">\n<p><strong>Need more?<\/strong> See the matching chapter of the User\nManual, or ask your administrator.<\/p>\n<\/div>\n", "text": " Sell, take payment, count the till. Start of shift Your supervisor opens the session on your register with the opening float (POS > Registers & Terminal > Open session). Press Go to terminal and type your PIN . Selling Scan the barcode or tap a product tile. Search by name or SKU if needed. Choose or add the customer if needed (credit, loyalty points). Press Payment , pick the method (split across several if needed), complete the sale. A discount over your limit, a void or a hand-changed price needs a manager's PIN . Returns and mistakes Receipts shows this shift's sales with View / Reprint (reprints are marked COPY). A return: Process a return , type the invoice number, choose items, refund method and reason. Cash Press Cash for paid-in, paid-out and safe drops. Drop cash into the safe when the drawer is heavy. X report any time; it changes nothing. End of shift Record paid-in, paid-out and drops first. Open the close screen, count the drawer by notes and coins, explain any difference, Close session , print the Z report . If the connection drops Keep selling: sales are queued and sync by themselves. Do not clear the browser or close it while the offline queue has sales. Need more? See the matching chapter of the User Manual, or ask your administrator. "}, {"id": "cards-2-shift-supervisor-and-manager", "manual": "cards", "n": 2, "title": "Shift supervisor and manager", "html": "\n<p><em>Open and close tills, approve exceptions, watch for\nloss.<\/em><\/p>\n<h2 id=\"open-and-close\">Open and close<\/h2>\n<ul>\n<li><strong>POS &gt; Registers &amp; Terminal &gt; Open\nsession<\/strong>: assign the cashier, enter the float.<\/li>\n<li><strong>POS &gt; Shifts<\/strong>: see every shift with variance;\n<strong>Force close<\/strong> or <strong>Close all sessions<\/strong> if\nsomeone left without closing.<\/li>\n<\/ul>\n<h2 id=\"approvals-at-the-till\">Approvals at the till<\/h2>\n<ul>\n<li>Type your <strong>PIN<\/strong> on the cashier's screen to approve a\nlarge discount, a void, an old return, a changed price or a big\npaid-out. Your name is recorded as the approver.<\/li>\n<\/ul>\n<h2 id=\"daily-review\">Daily review<\/h2>\n<ul>\n<li><strong>POS &gt; Voids &amp; returns<\/strong>: every void, return,\ndiscount, price change and reprint, with who approved.<\/li>\n<li><strong>POS &gt; Cash movements<\/strong> and each shift's\nvariance.<\/li>\n<li>Reports: <strong>POS Exceptions<\/strong>, <strong>POS Shift\nComparison<\/strong>, <strong>POS Sales by Cashier<\/strong>.<\/li>\n<\/ul>\n<h2 id=\"restaurant-managers\">Restaurant managers<\/h2>\n<ul>\n<li><strong>End of day<\/strong>: settle open orders, count the drawer,\nclose the day (Z report).<\/li>\n<li><strong>Voids &amp; comps<\/strong> log; <strong>Wastage<\/strong>\nconfirmations.<\/li>\n<\/ul>\n<h2 id=\"remember\">Remember<\/h2>\n<ul>\n<li>You see the dashboard's <strong>Needs your attention<\/strong> list:\nact on overdue items, low stock and pending approvals.<\/li>\n<\/ul>\n<div class=\"callout note\">\n<p><strong>Need more?<\/strong> See the matching chapter of the User\nManual, or ask your administrator.<\/p>\n<\/div>\n", "text": " Open and close tills, approve exceptions, watch for loss. Open and close POS > Registers & Terminal > Open session : assign the cashier, enter the float. POS > Shifts : see every shift with variance; Force close or Close all sessions if someone left without closing. Approvals at the till Type your PIN on the cashier's screen to approve a large discount, a void, an old return, a changed price or a big paid-out. Your name is recorded as the approver. Daily review POS > Voids & returns : every void, return, discount, price change and reprint, with who approved. POS > Cash movements and each shift's variance. Reports: POS Exceptions , POS Shift Comparison , POS Sales by Cashier . Restaurant managers End of day : settle open orders, count the drawer, close the day (Z report). Voids & comps log; Wastage confirmations. Remember You see the dashboard's Needs your attention list: act on overdue items, low stock and pending approvals. Need more? See the matching chapter of the User Manual, or ask your administrator. "}, {"id": "cards-3-sales-clerk", "manual": "cards", "n": 3, "title": "Sales clerk", "html": "\n<p><em>Quote, order, invoice and get paid.<\/em><\/p>\n<h2 id=\"the-path\">The path<\/h2>\n<ul>\n<li><strong>Quotation<\/strong> (offer) then <strong>Sale order<\/strong>\n(agreed) then <strong>Fulfil<\/strong> (deliver) then\n<strong>Invoice<\/strong> then <strong>Record payment<\/strong>. You can\nstart at any step.<\/li>\n<\/ul>\n<h2 id=\"quotation-or-order\">Quotation or order<\/h2>\n<ul>\n<li>Sales &gt; Quotations or Sale orders &gt; <strong>New<\/strong>.\nChoose the customer (or <strong>+ New customer<\/strong>), add products\nby name, SKU or code, check the totals, <strong>Save\ndraft<\/strong>.<\/li>\n<li>On a quotation: <strong>Send to customer<\/strong>, <strong>Mark\naccepted<\/strong>, <strong>Convert to sale order<\/strong>.<\/li>\n<li>On an order: <strong>Confirm<\/strong>, <strong>Fulfil\norder<\/strong>, <strong>Generate invoice<\/strong>.<\/li>\n<\/ul>\n<h2 id=\"invoice\">Invoice<\/h2>\n<ul>\n<li><strong>Issue invoice<\/strong> makes it official. <strong>Record\npayment<\/strong> (part payments are fine).<\/li>\n<li>Wrong invoice? Draft: edit or delete. Issued: <strong>Void\ninvoice<\/strong>, or <strong>Cancel &amp; credit invoice<\/strong> if\npayments exist.<\/li>\n<\/ul>\n<h2 id=\"customers\">Customers<\/h2>\n<ul>\n<li><strong>Customers &gt; Collections<\/strong> shows who owes and for\nhow long; tick customers and <strong>Send reminder<\/strong>.<\/li>\n<li><strong>Customer statement<\/strong> for any customer and\nperiod.<\/li>\n<\/ul>\n<h2 id=\"prices\">Prices<\/h2>\n<ul>\n<li>Customers in a <strong>customer group<\/strong> get the group's\n<strong>price list<\/strong> automatically. A price you type by hand is\nnever replaced.<\/li>\n<\/ul>\n<div class=\"callout note\">\n<p><strong>Need more?<\/strong> See the matching chapter of the User\nManual, or ask your administrator.<\/p>\n<\/div>\n", "text": " Quote, order, invoice and get paid. The path Quotation (offer) then Sale order (agreed) then Fulfil (deliver) then Invoice then Record payment . You can start at any step. Quotation or order Sales > Quotations or Sale orders > New . Choose the customer (or + New customer ), add products by name, SKU or code, check the totals, Save draft . On a quotation: Send to customer , Mark accepted , Convert to sale order . On an order: Confirm , Fulfil order , Generate invoice . Invoice Issue invoice makes it official. Record payment (part payments are fine). Wrong invoice? Draft: edit or delete. Issued: Void invoice , or Cancel & credit invoice if payments exist. Customers Customers > Collections shows who owes and for how long; tick customers and Send reminder . Customer statement for any customer and period. Prices Customers in a customer group get the group's price list automatically. A price you type by hand is never replaced. Need more? See the matching chapter of the User Manual, or ask your administrator. "}, {"id": "cards-4-accountant", "manual": "cards", "n": 4, "title": "Accountant", "html": "\n<p><em>Keep the books right, close the period.<\/em><\/p>\n<h2 id=\"daily-and-weekly\">Daily and weekly<\/h2>\n<ul>\n<li><strong>Customers &gt; Collections<\/strong> and <strong>Purchases\n&gt; Payables Aging<\/strong>: chase and pay on time.<\/li>\n<li>Approve <strong>Expenses<\/strong> (Expenses &gt; Expenses &gt; tick,\n<strong>Approve selected<\/strong>); check <strong>Overview<\/strong> for\nbills overdue or due soon.<\/li>\n<li>Record <strong>supplier payments<\/strong> with the oldest-first\nsuggestion.<\/li>\n<\/ul>\n<h2 id=\"month-end\">Month end<\/h2>\n<ul>\n<li>Review the <strong>Trial Balance<\/strong>, <strong>Income\nStatement<\/strong>, <strong>Balance Sheet<\/strong>, <strong>Cash\nFlow<\/strong>; run the <strong>Tax Report<\/strong>.<\/li>\n<li><strong>Accounting &gt; Controls &gt; Bank reconciliation<\/strong>:\nenter the statement date and balance, tick matching lines until the\ndifference is zero.<\/li>\n<li>Post depreciation (<strong>Assets &gt; Run depreciation<\/strong>)\nand any manual <strong>journal entries<\/strong> (debits = credits).<\/li>\n<li><strong>Close the books<\/strong> up to the month end (admin).<\/li>\n<\/ul>\n<h2 id=\"online-shop-money-if-the-business-has-an-online-shop\">Online\nshop money (if the business has an online shop)<\/h2>\n<ul>\n<li>Each provider (MTN, Airtel, card) has a <strong>clearing\naccount<\/strong> (what it still owes) and a <strong>payout\naccount<\/strong>. <strong>Online Store &gt; Online payments &gt;\nPayouts<\/strong>: record each payout with its fee; a balance that keeps\ngrowing or goes negative means a payment or payout is missing.<\/li>\n<li>Compare each clearing and wallet account with the provider's\nstatement every month. Check that <strong>Cash with Drivers<\/strong>\nagrees with the <em>To hand in<\/em> total of Driver cash, and that\n<strong>Suspense<\/strong> is zero.<\/li>\n<li><strong>Customer Credit Payable<\/strong>, <strong>Gift Card\nLiability<\/strong> and <strong>Loyalty Points Liability<\/strong> must\nagree with their customer lists.<\/li>\n<\/ul>\n<h2 id=\"rules-to-remember\">Rules to remember<\/h2>\n<ul>\n<li>Do not edit posted entries; reverse or void the source\ndocument.<\/li>\n<li>Freight on a purchase goes in the receipt's <strong>Landed\ncost<\/strong>, not in a separate expense.<\/li>\n<li>Gift card money is owed (liability) until the card is spent.<\/li>\n<\/ul>\n<h2 id=\"payroll\">Payroll<\/h2>\n<ul>\n<li>Run payroll monthly, <strong>Approve and post<\/strong>, pay by the\nbank file, record tax and social-security payments. Rates are a starting\npoint: confirm with your accountant.<\/li>\n<\/ul>\n<div class=\"callout note\">\n<p><strong>Need more?<\/strong> See the matching chapter of the User\nManual, or ask your administrator.<\/p>\n<\/div>\n", "text": " Keep the books right, close the period. Daily and weekly Customers > Collections and Purchases > Payables Aging : chase and pay on time. Approve Expenses (Expenses > Expenses > tick, Approve selected ); check Overview for bills overdue or due soon. Record supplier payments with the oldest-first suggestion. Month end Review the Trial Balance , Income Statement , Balance Sheet , Cash Flow ; run the Tax Report . Accounting > Controls > Bank reconciliation : enter the statement date and balance, tick matching lines until the difference is zero. Post depreciation ( Assets > Run depreciation ) and any manual journal entries (debits = credits). Close the books up to the month end (admin). Online shop money (if the business has an online shop) Each provider (MTN, Airtel, card) has a clearing account (what it still owes) and a payout account . Online Store > Online payments > Payouts : record each payout with its fee; a balance that keeps growing or goes negative means a payment or payout is missing. Compare each clearing and wallet account with the provider's statement every month. Check that Cash with Drivers agrees with the To hand in total of Driver cash, and that Suspense is zero. Customer Credit Payable , Gift Card Liability and Loyalty Points Liability must agree with their customer lists. Rules to remember Do not edit posted entries; reverse or void the source document. Freight on a purchase goes in the receipt's Landed cost , not in a separate expense. Gift card money is owed (liability) until the card is spent. Payroll Run payroll monthly, Approve and post , pay by the bank file, record tax and social-security payments. Rates are a starting point: confirm with your accountant. Need more? See the matching chapter of the User Manual, or ask your administrator. "}, {"id": "cards-5-store-keeper", "manual": "cards", "n": 5, "title": "Store keeper", "html": "\n<p><em>Know what you have and where it is.<\/em><\/p>\n<h2 id=\"receiving\">Receiving<\/h2>\n<ul>\n<li><strong>Purchases &gt; Purchase orders<\/strong>, open the order,\n<strong>Record a receipt<\/strong>: quantities now, batch/lot or serial\nnumbers, <strong>Landed cost<\/strong>. Print the GRN.<\/li>\n<li>Goods land in the warehouse's <strong>Receiving<\/strong> location.\nMove them to a <strong>Sales<\/strong> location with a <strong>Stock\ntransfer<\/strong>.<\/li>\n<\/ul>\n<h2 id=\"corrections\">Corrections<\/h2>\n<ul>\n<li><strong>Stock adjustments &gt; New<\/strong>: product, quantity\nchange (+/-), reason. It stays <em>logged<\/em> until an approver presses\n<strong>Confirm<\/strong>.<\/li>\n<li><strong>Stock counts<\/strong>: <strong>Start a stock count<\/strong>,\nprint the sheet, enter counted quantities, <strong>Submit for\napproval<\/strong>.<\/li>\n<\/ul>\n<h2 id=\"reorder\">Reorder<\/h2>\n<ul>\n<li><strong>Inventory &gt; Reorder<\/strong> lists what is at or below\nits reorder level. <strong>Create requisition<\/strong> to turn it into a\npurchase request.<\/li>\n<\/ul>\n<h2 id=\"if-the-business-has-an-online-shop\">If the business has an\nonline shop<\/h2>\n<ul>\n<li>The shop sells only from <strong>Sales locations<\/strong> outside\nthe Main warehouse. Stock that arrives sits in <em>Receiving<\/em> until\nyou move it to a Sales location. Expired batches are never sold.<\/li>\n<li><strong>Reorder<\/strong> shows two more columns: <strong>Online\norders<\/strong> (units held by orders nobody answered yet) and\n<strong>Waiting customers<\/strong> (people waiting for a product to be\nback).<\/li>\n<\/ul>\n<h2 id=\"moving-stock\">Moving stock<\/h2>\n<ul>\n<li><strong>Stock transfers &gt; New<\/strong>: product, from and to\nlocations, quantity. Between branches, the receiver presses\n<strong>Receive<\/strong> and records any shortage.<\/li>\n<\/ul>\n<h2 id=\"look-it-up\">Look it up<\/h2>\n<ul>\n<li>Product page &gt; <strong>Stock movement history<\/strong>. Reports:\nStock On Hand &amp; Valuation, Expiring Stock, Dead Stock.<\/li>\n<\/ul>\n<div class=\"callout note\">\n<p><strong>Need more?<\/strong> See the matching chapter of the User\nManual, or ask your administrator.<\/p>\n<\/div>\n", "text": " Know what you have and where it is. Receiving Purchases > Purchase orders , open the order, Record a receipt : quantities now, batch/lot or serial numbers, Landed cost . Print the GRN. Goods land in the warehouse's Receiving location. Move them to a Sales location with a Stock transfer . Corrections Stock adjustments > New : product, quantity change (+/-), reason. It stays logged until an approver presses Confirm . Stock counts : Start a stock count , print the sheet, enter counted quantities, Submit for approval . Reorder Inventory > Reorder lists what is at or below its reorder level. Create requisition to turn it into a purchase request. If the business has an online shop The shop sells only from Sales locations outside the Main warehouse. Stock that arrives sits in Receiving until you move it to a Sales location. Expired batches are never sold. Reorder shows two more columns: Online orders (units held by orders nobody answered yet) and Waiting customers (people waiting for a product to be back). Moving stock Stock transfers > New : product, from and to locations, quantity. Between branches, the receiver presses Receive and records any shortage. Look it up Product page > Stock movement history . Reports: Stock On Hand & Valuation, Expiring Stock, Dead Stock. Need more? See the matching chapter of the User Manual, or ask your administrator. "}, {"id": "cards-6-purchasing-officer", "manual": "cards", "n": 6, "title": "Purchasing officer", "html": "\n<p><em>Order, track and pay suppliers.<\/em><\/p>\n<h2 id=\"order\">Order<\/h2>\n<ul>\n<li><strong>Purchase requisitions<\/strong> to ask, <strong>Purchase\norders &gt; New<\/strong> to buy: supplier, expected date, receive-into\nwarehouse, lines with unit cost.<\/li>\n<li><strong>Send to supplier<\/strong> by e-mail or\n<strong>Print<\/strong>.<\/li>\n<\/ul>\n<h2 id=\"receive-and-bill\">Receive and bill<\/h2>\n<ul>\n<li>Partial deliveries are fine. When fully received a\n<strong>Bill<\/strong> is generated. <strong>Issue bill<\/strong>, then\n<strong>Record payment<\/strong>.<\/li>\n<li>Wrong goods? <strong>Process a return<\/strong> on the order.<\/li>\n<\/ul>\n<h2 id=\"pay\">Pay<\/h2>\n<ul>\n<li><strong>Suppliers &gt; Record payment<\/strong>: amount, then\n<strong>Suggest oldest-first<\/strong> to allocate. Print the\nreceipt.<\/li>\n<\/ul>\n<h2 id=\"prices\">Prices<\/h2>\n<ul>\n<li><strong>Supplier prices<\/strong> keep agreed costs with validity\ndates.<\/li>\n<\/ul>\n<h2 id=\"reports\">Reports<\/h2>\n<ul>\n<li>Outstanding Payables, Payables Aging, Purchases by Supplier or\nProduct.<\/li>\n<\/ul>\n<div class=\"callout note\">\n<p><strong>Need more?<\/strong> See the matching chapter of the User\nManual, or ask your administrator.<\/p>\n<\/div>\n", "text": " Order, track and pay suppliers. Order Purchase requisitions to ask, Purchase orders > New to buy: supplier, expected date, receive-into warehouse, lines with unit cost. Send to supplier by e-mail or Print . Receive and bill Partial deliveries are fine. When fully received a Bill is generated. Issue bill , then Record payment . Wrong goods? Process a return on the order. Pay Suppliers > Record payment : amount, then Suggest oldest-first to allocate. Print the receipt. Prices Supplier prices keep agreed costs with validity dates. Reports Outstanding Payables, Payables Aging, Purchases by Supplier or Product. Need more? See the matching chapter of the User Manual, or ask your administrator. "}, {"id": "cards-7-restaurant-waiter", "manual": "cards", "n": 7, "title": "Restaurant waiter", "html": "\n<p><em>Take orders, send to kitchen, bill the table.<\/em><\/p>\n<h2 id=\"open-a-table\">Open a table<\/h2>\n<ul>\n<li>Floor plan &gt; tap a free table &gt; enter <strong>Guests<\/strong>\n&gt; <strong>Open order<\/strong>. Note <strong>allergies<\/strong>.<\/li>\n<\/ul>\n<h2 id=\"order\">Order<\/h2>\n<ul>\n<li>Tap menu items; choose options; add a <strong>note for the\nkitchen<\/strong>; set <strong>Seat<\/strong> and\n<strong>Course<\/strong>.<\/li>\n<li><strong>Send to kitchen<\/strong>. Later courses wait <em>on\nhold<\/em> until you <strong>Fire course<\/strong>.<\/li>\n<\/ul>\n<h2 id=\"changes\">Changes<\/h2>\n<ul>\n<li>After an item is sent, removing it needs a <strong>manager<\/strong>\nand a reason (<strong>Void it<\/strong>). <strong>Give free<\/strong>\nneeds a reason.<\/li>\n<li><strong>Move table<\/strong>, <strong>Merge into<\/strong>,\n<strong>Split / move items<\/strong> for guests who pay separately.<\/li>\n<\/ul>\n<h2 id=\"bill-and-pay\">Bill and pay<\/h2>\n<ul>\n<li><strong>Bill<\/strong> prints the pre-bill.\n<strong>Checkout<\/strong>: add payments (split equally, by item or by\nshares), choose the <strong>tip<\/strong>, or <strong>Charge to\nroom<\/strong> for hotel guests. Give back the change shown.<\/li>\n<\/ul>\n<div class=\"callout note\">\n<p><strong>Need more?<\/strong> See the matching chapter of the User\nManual, or ask your administrator.<\/p>\n<\/div>\n", "text": " Take orders, send to kitchen, bill the table. Open a table Floor plan > tap a free table > enter Guests > Open order . Note allergies . Order Tap menu items; choose options; add a note for the kitchen ; set Seat and Course . Send to kitchen . Later courses wait on hold until you Fire course . Changes After an item is sent, removing it needs a manager and a reason ( Void it ). Give free needs a reason. Move table , Merge into , Split / move items for guests who pay separately. Bill and pay Bill prints the pre-bill. Checkout : add payments (split equally, by item or by shares), choose the tip , or Charge to room for hotel guests. Give back the change shown. Need more? See the matching chapter of the User Manual, or ask your administrator. "}, {"id": "cards-8-kitchen-and-bar", "manual": "cards", "n": 8, "title": "Kitchen and bar", "html": "\n<p><em>Prepare, mark ready, remake.<\/em><\/p>\n<h2 id=\"kitchen-display\">Kitchen display<\/h2>\n<ul>\n<li>Tickets move <strong>waiting, cooking, ready<\/strong>. <strong>Start\npreparing<\/strong>, <strong>Mark ready<\/strong>, <strong>Mark\nserved<\/strong>, <strong>Bump all<\/strong> for an order.<\/li>\n<li>Tickets turn amber then red as time runs out.\n<strong>ALLERGY<\/strong> warnings show in red.<\/li>\n<li><strong>Remake<\/strong> records a remade dish (counted in wastage\nreports).<\/li>\n<\/ul>\n<h2 id=\"sold-out\">Sold out<\/h2>\n<ul>\n<li>Press <strong>Sold out (86)<\/strong>, search the item, add a reason.\nIt disappears from the waiters' menu until switched back.<\/li>\n<\/ul>\n<h2 id=\"expo\">Expo<\/h2>\n<ul>\n<li>The pass: check an order is complete, <strong>Mark everything\nready<\/strong> or <strong>Serve<\/strong>.<\/li>\n<\/ul>\n<div class=\"callout note\">\n<p><strong>Need more?<\/strong> See the matching chapter of the User\nManual, or ask your administrator.<\/p>\n<\/div>\n", "text": " Prepare, mark ready, remake. Kitchen display Tickets move waiting, cooking, ready . Start preparing , Mark ready , Mark served , Bump all for an order. Tickets turn amber then red as time runs out. ALLERGY warnings show in red. Remake records a remade dish (counted in wastage reports). Sold out Press Sold out (86) , search the item, add a reason. It disappears from the waiters' menu until switched back. Expo The pass: check an order is complete, Mark everything ready or Serve . Need more? See the matching chapter of the User Manual, or ask your administrator. "}, {"id": "cards-9-hotel-front-desk", "manual": "cards", "n": 9, "title": "Hotel front desk", "html": "\n<p><em>Book, check in, bill, check out.<\/em><\/p>\n<h2 id=\"start-of-day\">Start of day<\/h2>\n<ul>\n<li><strong>Hotel &gt; Front desk<\/strong>: arrivals, in-house,\ndepartures, rooms to clean, out of order.<\/li>\n<\/ul>\n<h2 id=\"booking\">Booking<\/h2>\n<ul>\n<li><strong>New booking<\/strong> or <strong>Walk-in<\/strong>: choose or\nadd the guest, arrival and departure, room type and room, rate plan,\nsource, deposit.<\/li>\n<\/ul>\n<h2 id=\"check-in\">Check in<\/h2>\n<ul>\n<li>Open the booking &gt; <strong>Check in<\/strong> &gt; confirm the\nroom (the room should be clean). Print the <strong>Registration\ncard<\/strong>.<\/li>\n<\/ul>\n<h2 id=\"during-the-stay\">During the stay<\/h2>\n<ul>\n<li><strong>+ Charge<\/strong> for extras. <strong>Move room<\/strong>,\n<strong>Change departure<\/strong>.<\/li>\n<li><strong>+ Split bill / bill a company<\/strong> when someone else\npays part.<\/li>\n<\/ul>\n<h2 id=\"check-out\">Check out<\/h2>\n<ul>\n<li>Open the booking &gt; <strong>Check out<\/strong>, take payment,\n<strong>Print invoice<\/strong>.<\/li>\n<\/ul>\n<h2 id=\"remember\">Remember<\/h2>\n<ul>\n<li>VIP and blacklist flags show on the guest. Cancellation, no-show and\nlate check-out fees follow the hotel policy; the desk may waive.<\/li>\n<\/ul>\n<div class=\"callout note\">\n<p><strong>Need more?<\/strong> See the matching chapter of the User\nManual, or ask your administrator.<\/p>\n<\/div>\n", "text": " Book, check in, bill, check out. Start of day Hotel > Front desk : arrivals, in-house, departures, rooms to clean, out of order. Booking New booking or Walk-in : choose or add the guest, arrival and departure, room type and room, rate plan, source, deposit. Check in Open the booking > Check in > confirm the room (the room should be clean). Print the Registration card . During the stay + Charge for extras. Move room , Change departure . + Split bill / bill a company when someone else pays part. Check out Open the booking > Check out , take payment, Print invoice . Remember VIP and blacklist flags show on the guest. Cancellation, no-show and late check-out fees follow the hotel policy; the desk may waive. Need more? See the matching chapter of the User Manual, or ask your administrator. "}, {"id": "cards-10-hr-officer", "manual": "cards", "n": 10, "title": "HR officer", "html": "\n<p><em>People, leave, attendance and pay.<\/em><\/p>\n<h2 id=\"new-employee\">New employee<\/h2>\n<ul>\n<li><strong>Employees &gt; New employee<\/strong>; give a\n<strong>login<\/strong> so they can use My HR; set <strong>Track\nattendance for pay<\/strong> only for staff who clock in.<\/li>\n<li><strong>Contracts &gt; New<\/strong>: salary and allowances, then\n<strong>activate<\/strong> when signed.<\/li>\n<\/ul>\n<h2 id=\"every-month\">Every month<\/h2>\n<ul>\n<li>Approve <strong>Leave<\/strong> requests; correct\n<strong>Attendance<\/strong>; enter <strong>Adjustments<\/strong> (bonus,\nfine) and loans.<\/li>\n<li><strong>Payroll &gt; Run payroll for a month<\/strong>, review,\n<strong>Approve and post<\/strong>, download the <strong>bank transfer\nfile<\/strong>, <strong>Mark salaries as paid<\/strong>, e-mail\npayslips.<\/li>\n<li><strong>Record payments<\/strong> of tax and social security by their\ndue date.<\/li>\n<\/ul>\n<h2 id=\"when-someone-leaves\">When someone leaves<\/h2>\n<ul>\n<li>Employee page &gt; <strong>Employee left<\/strong>; open\n<strong>Final pay<\/strong>.<\/li>\n<\/ul>\n<h2 id=\"remember\">Remember<\/h2>\n<ul>\n<li>Check tax bands and contribution rates with your accountant. Salary\nreports are restricted to payroll access.<\/li>\n<\/ul>\n<div class=\"callout note\">\n<p><strong>Need more?<\/strong> See the matching chapter of the User\nManual, or ask your administrator.<\/p>\n<\/div>\n", "text": " People, leave, attendance and pay. New employee Employees > New employee ; give a login so they can use My HR; set Track attendance for pay only for staff who clock in. Contracts > New : salary and allowances, then activate when signed. Every month Approve Leave requests; correct Attendance ; enter Adjustments (bonus, fine) and loans. Payroll > Run payroll for a month , review, Approve and post , download the bank transfer file , Mark salaries as paid , e-mail payslips. Record payments of tax and social security by their due date. When someone leaves Employee page > Employee left ; open Final pay . Remember Check tax bands and contribution rates with your accountant. Salary reports are restricted to payroll access. Need more? See the matching chapter of the User Manual, or ask your administrator. "}, {"id": "cards-11-booking-and-reception", "manual": "cards", "n": 11, "title": "Booking and reception", "html": "\n<p><em>Appointments and walk-ins.<\/em><\/p>\n<h2 id=\"make-a-booking\">Make a booking<\/h2>\n<ul>\n<li>Booking &gt; <strong>New appointment<\/strong>: service, date,\npreferred person, a free time, who it is for. If a deposit is needed an\ninvoice holds the time; tick <strong>Confirm now<\/strong> to skip.<\/li>\n<\/ul>\n<h2 id=\"the-day\">The day<\/h2>\n<ul>\n<li><strong>Calendar<\/strong> by person or room; <strong>Print day\nsheet<\/strong>.<\/li>\n<li>On the visit: <strong>Mark done<\/strong> or\n<strong>No-show<\/strong>. <strong>Move to another time<\/strong> or\n<strong>Cancel appointment<\/strong> (unpaid invoice is voided).<\/li>\n<\/ul>\n<h2 id=\"reminders\">Reminders<\/h2>\n<ul>\n<li><strong>Send reminder now<\/strong> or <strong>Download calendar\nfile<\/strong>. Automatic reminders go out before the visit.<\/li>\n<\/ul>\n<div class=\"callout note\">\n<p><strong>Need more?<\/strong> See the matching chapter of the User\nManual, or ask your administrator.<\/p>\n<\/div>\n", "text": " Appointments and walk-ins. Make a booking Booking > New appointment : service, date, preferred person, a free time, who it is for. If a deposit is needed an invoice holds the time; tick Confirm now to skip. The day Calendar by person or room; Print day sheet . On the visit: Mark done or No-show . Move to another time or Cancel appointment (unpaid invoice is voided). Reminders Send reminder now or Download calendar file . Automatic reminders go out before the visit. Need more? See the matching chapter of the User Manual, or ask your administrator. "}, {"id": "cards-12-help-desk-agent", "manual": "cards", "n": 12, "title": "Help desk agent", "html": "\n<p><em>Answer fast, keep deadlines.<\/em><\/p>\n<h2 id=\"start\">Start<\/h2>\n<ul>\n<li><strong>Help Desk &gt; Overview<\/strong>: unanswered, overdue, due\nsoon, mine. Open <strong>Needs attention<\/strong> first.<\/li>\n<\/ul>\n<h2 id=\"work-a-ticket\">Work a ticket<\/h2>\n<ul>\n<li><strong>Reply to the customer<\/strong> (e-mailed) or add an\n<strong>Internal note<\/strong>; <strong>Insert a saved reply<\/strong>\nfor common answers.<\/li>\n<li>Waiting on the customer? <strong>Wait for customer<\/strong> pauses\nthe deadline clock.<\/li>\n<li><strong>Resolve<\/strong> with notes; <strong>Close<\/strong>;\n<strong>Reopen<\/strong> if needed.<\/li>\n<\/ul>\n<h2 id=\"housekeeping\">Housekeeping<\/h2>\n<ul>\n<li><strong>Merge into another ticket<\/strong> for duplicates. Link an\n<strong>Invoice<\/strong> or <strong>Job<\/strong>. Add\n<strong>Tags<\/strong>. Only tick <strong>Customer can see<\/strong> on\nfiles you want shared.<\/li>\n<\/ul>\n<div class=\"callout note\">\n<p><strong>Need more?<\/strong> See the matching chapter of the User\nManual, or ask your administrator.<\/p>\n<\/div>\n", "text": " Answer fast, keep deadlines. Start Help Desk > Overview : unanswered, overdue, due soon, mine. Open Needs attention first. Work a ticket Reply to the customer (e-mailed) or add an Internal note ; Insert a saved reply for common answers. Waiting on the customer? Wait for customer pauses the deadline clock. Resolve with notes; Close ; Reopen if needed. Housekeeping Merge into another ticket for duplicates. Link an Invoice or Job . Add Tags . Only tick Customer can see on files you want shared. Need more? See the matching chapter of the User Manual, or ask your administrator. "}, {"id": "cards-13-every-employee-my-hr-and-my-time", "manual": "cards", "n": 13, "title": "Every employee (My HR and My\ntime)", "html": "\n<p><em>Self-service.<\/em><\/p>\n<h2 id=\"my-hr\">My HR<\/h2>\n<ul>\n<li><strong>Clock in<\/strong> and <strong>Clock out<\/strong>.\n<strong>Request leave<\/strong> (type, dates, half days). See payslips\nonce payroll is approved, your leave balance and documents. Update your\nphone, e-mail, address and emergency contact.<\/li>\n<\/ul>\n<h2 id=\"my-time\">My time<\/h2>\n<ul>\n<li>Start the <strong>timer<\/strong> or add time by hand (type 1:30,\n1.5, 90m or 2h). At the end of the week press <strong>Submit for\napproval<\/strong>. Fix anything <strong>Sent back<\/strong>.<\/li>\n<\/ul>\n<h2 id=\"my-profile\">My profile<\/h2>\n<ul>\n<li>Change your password and your <strong>PIN<\/strong> (4 to 6 digits).\nKeep both private.<\/li>\n<\/ul>\n<div class=\"callout note\">\n<p><strong>Need more?<\/strong> See the matching chapter of the User\nManual, or ask your administrator.<\/p>\n<\/div>\n", "text": " Self-service. My HR Clock in and Clock out . Request leave (type, dates, half days). See payslips once payroll is approved, your leave balance and documents. Update your phone, e-mail, address and emergency contact. My time Start the timer or add time by hand (type 1:30, 1.5, 90m or 2h). At the end of the week press Submit for approval . Fix anything Sent back . My profile Change your password and your PIN (4 to 6 digits). Keep both private. Need more? See the matching chapter of the User Manual, or ask your administrator. "}, {"id": "cards-14-administrator", "manual": "cards", "n": 14, "title": "Administrator", "html": "\n<p><em>Set up, secure, back up.<\/em><\/p>\n<h2 id=\"first-day\">First day<\/h2>\n<ul>\n<li>Change the <strong>admin password<\/strong> and the JWT secret; set\n<strong>Business details<\/strong>, <strong>System settings<\/strong>,\n<strong>Taxes<\/strong>, <strong>Payment methods<\/strong>.<\/li>\n<li><strong>Settings &gt; Modules<\/strong>: copy the installation id,\ninstall the licence, activate only needed modules.<\/li>\n<\/ul>\n<h2 id=\"people\">People<\/h2>\n<ul>\n<li><strong>Staff &gt; Roles<\/strong> for access areas (None / View /\nManage). On each person: role, extra approval permissions, branch\naccess, <strong>PIN<\/strong>.<\/li>\n<\/ul>\n<h2 id=\"every-week\">Every week<\/h2>\n<ul>\n<li>Check the <strong>backup<\/strong> exists and download one off the\nserver. Review the <strong>Sign-in log<\/strong> and <strong>Audit\nLog<\/strong>. Look at <strong>Server logs<\/strong> if anything\nfailed.<\/li>\n<\/ul>\n<h2 id=\"for-an-online-shop\">For an online shop<\/h2>\n<ul>\n<li>Set <code>app.frontend-url<\/code> to the public https address.\nSwitch each payment provider on with its own keys in the server's\nenvironment, never in a file that is copied around. Give each provider\nits <strong>accounts<\/strong> (Online Store &gt; Online payments &gt;\nAccounts by provider).<\/li>\n<li>Give each driver a <strong>link and PIN<\/strong> (Shop settings &gt;\nDrivers). Add the web-server rule for link previews. Read and adapt the\nshop's Terms and Privacy pages.<\/li>\n<\/ul>\n<h2 id=\"before-an-upgrade\">Before an upgrade<\/h2>\n<ul>\n<li><strong>Backup now<\/strong>, download it, then follow the release\nnotes.<\/li>\n<\/ul>\n<h2 id=\"remember\">Remember<\/h2>\n<ul>\n<li>Module activation is permanent. Restoring a backup replaces\neverything and needs a restart.<\/li>\n<\/ul>\n<div class=\"callout note\">\n<p><strong>Need more?<\/strong> See the matching chapter of the User\nManual, or ask your administrator.<\/p>\n<\/div>\n", "text": " Set up, secure, back up. First day Ch
