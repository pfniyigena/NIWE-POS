<style>

}

  --bg:#12171f; --panel:#1a212b; --fg:#e6eaf0; --muted:#9aa6b6; --line:#2b3441;

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15.5px;line-height:1.65;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--panel);z-index:30}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;gap:12px;align-items:center}

.menu-btn{display:none;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:6px;padding:6px 10px;font:inherit;cursor:pointer}

.search input:focus,.menu-btn:focus,.nav a:focus,.card:focus{outline:2px solid var(--accent);outline-offset:2px}
.results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;max-height:60vh;overflow:auto;box-shadow:0 10px 30px rgba(0,0,0,.15)}

article p,article li{max-width:70ch}
article li{margin:.25rem 0}
code{font-family:var(--font-mono);font-size:.86em;background:var(--code);padding:.1em .35em;border-radius:4px}

td{padding:8px 12px;border-top:1px solid var(--line);vertical-align:top}
tr:nth-child(even) td{background:color-mix(in srgb,var(--accent-soft) 35%,transparent)}
.callout{margin:1.1rem 0;padding:.7rem 1rem;border-left:4px solid var(--note-line);background:var(--note);border-radius:0 8px 8px 0;max-width:70ch}
.callout p{margin:.3rem 0}.callout.tip{border-color:var(--tip-line);background:var(--tip)}.callout.warning{border-color:var(--warn-line);background:var(--warn)}
ul.task-list{list-style:none;padding-left:0}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:3rem;flex-wrap:wrap}
.pager a{flex:1 1 220px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:12px 16px;text-decoration:none;color:var(--fg)}
.pager a:hover{border-color:var(--accent)}.pager small{display:block;font-family:var(--font-mono);color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em}
.pager a.next{text-align:right}
.home h1{font-size:2.5rem}
.lede{font-size:1.1rem;color:var(--muted);max-width:60ch}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin:1.6rem 0}
.card{display:block;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;text-decoration:none;color:var(--fg)}
.card:hover{border-color:var(--accent)}.card b{font-family:var(--font-head);font-size:1.15rem;display:block;color:var(--accent)}
.card span{font-size:.9rem;color:var(--muted)}.card small{display:block;margin-top:8px;font-family:var(--font-mono);font-size:.72rem;color:var(--muted)}
.home h2{border-top:0;padding-top:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:.6rem 0 1.4rem}
.chips a{font-size:.88rem;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 14px;text-decoration:none;color:var(--fg)}
.chips a:hover{border-color:var(--accent);background:var(--accent-soft)}
@media(max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .menu-btn{display:inline-block}.brand small{display:none}
  .nav{display:none;position:fixed;inset:calc(56px + env(safe-area-inset-top,0px)) 0 0 0;z-index:15;max-height:none;border-right:0}
  body.open .nav{display:block}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  h1{font-size:1.65rem}.home h1{font-size:2rem}
}

var D={"pages": [{"id": "admin-1-about-this-manual", "manual": "admin", "n": 1, "title": "About this manual", "html": "\n<h2 id=\"who-it-is-for\">Who it is for<\/h2>\n<p>This is the <strong>Administrator Manual<\/strong> for NIWE ERP (the\nNIWE POS/ERP system). It is written for the person who installs,\nconfigures and looks after the system: the business owner, the IT\nperson, or the office manager who holds the <strong>Admin<\/strong>\naccount. Day-to-day instructions for cashiers, accountants, store\nkeepers and other staff are in the separate <strong>User Manual<\/strong>\nand in the <strong>Role quick-start cards<\/strong>.<\/p>\n<p>You do not need to be a programmer to follow most of this manual.\nChapters 2 and 12 (installation and upgrades) are technical and are\nmeant for whoever manages the server.<\/p>\n<h2 id=\"how-the-manual-is-organised\">How the manual is organised<\/h2>\n<div class=\"tablewrap\"><table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Chapter<\/th>\n<th>What it covers<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>2. Installing and first start<\/td>\n<td>Requirements, database, starting the system, first sign-in<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>3. Licence and modules<\/td>\n<td>Installation id, licence file, activating and requesting\nmodules<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>4. Users, roles and permissions<\/td>\n<td>Staff accounts, custom roles, per-person approval rights, branch\naccess<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>5. Business set-up<\/td>\n<td>Business details, currency, taxes, payment methods, branches,\nwarehouses<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>6. Accounting set-up<\/td>\n<td>Chart of accounts, cost centers, controls, opening balances<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>7. Module settings<\/td>\n<td>Where each module keeps its own settings<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>8. Tills, printers and devices<\/td>\n<td>Thermal printing, cash drawer, customer display, binding a register\nto a PC<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>9. E-mail, alerts and scheduled reports<\/td>\n<td>SMTP, business alerts, scheduled reports, daily stock jobs<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>10. Backup, restore, import and export<\/td>\n<td>Nightly backup, restore, bulk import with check-first, year-end\narchive<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>11. Logs and monitoring<\/td>\n<td>Audit log, sign-in log, server logs<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>12. Upgrades and migrations<\/td>\n<td>Installing a new version, database migrations<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>13. Security checklist<\/td>\n<td>What to change before going live<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>14. Troubleshooting<\/td>\n<td>Common problems and what to do<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"conventions\">Conventions<\/h2>\n<ul>\n<li>Menu paths are written like <strong>Settings &gt; Modules<\/strong>.\nThe words are exactly as they appear on screen.<\/li>\n<li>Buttons and fields are written in <strong>bold<\/strong>.<\/li>\n<li>Boxes marked <em>Note<\/em>, <em>Tip<\/em> and <em>Warning<\/em> call\nattention to things that matter. A warning describes something that\ncannot easily be undone.<\/li>\n<\/ul>\n<h2 id=\"what-is-new-in-this-edition\">What is new in this edition<\/h2>\n<p>This edition covers everything up to <strong>version 1.76.0<\/strong>.\nThe main administrator-facing additions since version 1.12 are:<\/p>\n<ul>\n<li><strong>1.12<\/strong> Thermal (Epson ESC/POS) printing, cash drawer\nand COM customer display.<\/li>\n<li><strong>1.13<\/strong> A register can be tied to one known\ndevice.<\/li>\n<li><strong>1.14<\/strong> Server logs and the sign-in log; more actions\nin the audit log; currency follows the chart of accounts (RWF for\nRwanda, XAF for Chad).<\/li>\n<li><strong>1.15 to 1.22<\/strong> Improvements to Work Orders, Time\nTracking, Booking, Installments, Subscriptions, Help Desk, Expenses and\nAssets, including new approval permissions (<em>Approve large\nexpenses<\/em>, <em>Approve large asset disposals<\/em>) and new reports\navailable to scheduled reports.<\/li>\n<li><strong>1.22.1 to 1.22.5<\/strong> Fixes and hardening: subscription\nmonth-end billing, first-start administrator on a real installation, no\npassword or secret kept in the shipped files, the server logs written\nnext to the jar, and a printable PDF of the modules list.<\/li>\n<li><strong>1.23<\/strong> French. Every user can switch between English\nand Français from the top bar or the sign-in page, and the business has\na default language (Settings &gt; System settings) that follows the\nchart of accounts: Chad starts in French, Rwanda in English. The core\nscreens are translated: sign-in, menus, dashboard, POS, Sales,\nPurchases, Inventory, Customers, Accounting and Settings.<\/li>\n<li><strong>1.24<\/strong> French for the other modules: Restaurant,\nHotel, Manufacturing, Subscriptions, Installments, Help Desk, HR and\nPayroll, Time tracking, Work orders, Booking, Law firm, Real estate,\nProperty management, Assets, Gift cards, Loyalty, Promotions, the client\nportal, My profile and the Invoice list. A phrase without a French\nversion shows in English. Ask a French speaker to read the wording\nbefore customers use it.<\/li>\n<li><strong>1.25<\/strong> French for the messages written in the program\ncode (error messages, \"Are you sure?\" questions, notices), for lists\nsuch as status filters, weekdays and permission names, and for the\ntitles and column headings of every report. A fix makes texts that carry\na value (for example \"3 days left\") show correctly in English. Server\nmessages, e-mails and printed PDF documents were still English in this\nversion.<\/li>\n<li><strong>1.26<\/strong> French for the texts the server writes:\nprinted documents (invoices, quotations, receipts, statements, delivery\nand goods-received notes, payslips, hotel bills, law-firm letters,\ninstalment agreements, the modules list and more), the e-mails sent to\ncustomers, tenants, owners, guests, clients and staff, and the messages\nthe server returns (for example \"Customer not found\"). They follow the\n<strong>business language<\/strong> in Settings &gt; System settings, not\nthe language a user picked on their own screen. Dates and amounts are\nwritten the French way (5 mars 2026, 1 234,50). Audit trail entries and\nnames already stored in the database stay as they were written. Ask a\nFrench speaker to read the wording before customers receive it.<\/li>\n<li><strong>1.26.1<\/strong> Fix: \"Failed to create backup directory\n./backups\" when the server runs as a service. Backups now go to a\n<strong>backups<\/strong> folder next to the jar by default.<\/li>\n<li><strong>1.26.2<\/strong> The log files go into a folder named\n<strong>logs<\/strong> next to the jar (instead of the jar's folder\nitself).<\/li>\n<li><strong>1.27.0<\/strong> New optional module <strong>Online\nStore<\/strong>: a public shop at <code>/shop<\/code> where customers\norder for delivery or pick-up and pay in cash. See <em>Online Store\nsettings<\/em> in chapter 7 and the public-side notes in chapter 13.<\/li>\n<li><strong>1.28 to 1.34<\/strong> The Online Store grows: orders can be\n<strong>paid online<\/strong> (a test provider and MTN Mobile Money for\nRwanda), customers can <strong>sign in<\/strong> with an e-mailed code,\n<strong>coupons<\/strong>, <strong>text messages<\/strong> (SMS or\nWhatsApp, through a provider a developer adds), and <strong>returns and\nrefunds<\/strong> of completed orders. Delivery of order e-mails in the\ncustomer's language, alerts for unanswered orders and resized\nphotos.<\/li>\n<li><strong>1.35 and 1.36<\/strong> The shop's <strong>first\npage<\/strong> has an announcement bar, header with search, a banner of\n<strong>uploaded pictures that slide<\/strong>, four product rows chosen\nby staff (the rows slide), customer reviews (staff approve them), a\nnewsletter sign-up with e-mail confirmation and a footer with links; new\nscreens <strong>Reviews<\/strong> and <strong>Newsletter<\/strong>;\n<strong>Sellable now<\/strong> figures under each product explain the\nstock the shop shows. See <em>Online Store settings<\/em> in chapter\n7.<\/li>\n<li><strong>1.37<\/strong> Online Store: <strong>Sales reports<\/strong>\n(by day, orders with invoices, payment methods, orders not counted as\nsales, coupons, best-selling products), counted on the day an order is\ncompleted and matching the invoices; they can be e-mailed on a schedule.\nNeeds the Reports area or Operations area for the user.<\/li>\n<li><strong>1.38<\/strong> Online Store: <strong>Send a\nnewsletter<\/strong> from the program (subject, text, optional button;\neveryone or only English or French readers; a test e-mail first; sent in\nbatches with a daily limit; progress, stop, retry of failed addresses;\neach e-mail has the person's own unsubscribe link). New tables by\nmigration V74.<\/li>\n<li><strong>1.39<\/strong> Online Store: <strong>abandoned-cart\nreminders<\/strong> (e-mail after 1 hour and after 3 days to visitors who\ntyped an e-mail address at checkout; no discount; a link in every e-mail\nstops them; <strong>Online Store &gt; Abandoned carts<\/strong> lists\nthem); off until switched on in Shop settings; new tables (migration\nV75, runs by itself at start-up).<\/li>\n<li><strong>1.40<\/strong> Online Store: <strong>loyalty points<\/strong>\nfor signed-in shop customers (earned when an order is completed, spent\nat checkout as a discount; given back on cancellation, adjusted on\nreturns; <strong>Online Store &gt; Loyalty points<\/strong> for staff to\nsee and adjust); off until switched on in Shop settings; separate from\nthe till's loyalty programme; new tables (migration V76, runs by itself\nat start-up).<\/li>\n<li><strong>1.41 and 1.42<\/strong> Online Store: <strong>Airtel\nMoney<\/strong> as a second payment provider, and <strong>several\nproviders at once<\/strong>: the customer picks one at checkout. Keys for\neach provider live only in the server's environment.<\/li>\n<li><strong>1.43<\/strong> Online Store: <strong>Advertising<\/strong>\n(advertisers, ads in three places of the shop, a report of views and\nclicks). Migration V78.<\/li>\n<li><strong>1.44 to 1.48<\/strong> Online Store: a <strong>product\npage<\/strong> for each product, search and filters, <strong>ratings\n(stars, at once) and reviews (words, approved by staff)<\/strong>,\ninvoice download, address book, wish list, WhatsApp, product rows that\nslide. Migrations V79 to V82.<\/li>\n<li><strong>1.49<\/strong> The whole site can be <strong>installed as an\napp<\/strong> (PWA); nothing from the server is kept offline. Needs\nhttps.<\/li>\n<li><strong>1.50 to 1.51<\/strong> Online Store: <strong>product\nvariants<\/strong> (size, colour, model) from the ERP's own variants; a\n<strong>contact form<\/strong> and four <strong>information\npages<\/strong>. Migrations V84 to V86.<\/li>\n<li><strong>1.52 to 1.64<\/strong> Online Store delivery:\n<strong>drivers<\/strong>, delivery slips and run sheets; the\n<strong>delivery code<\/strong>; the driver's <strong>private link and\nPIN<\/strong> page; <strong>driver cash<\/strong> hand-in; failed and\npartial deliveries; <strong>delivery time slots<\/strong>; <strong>return\npick-ups<\/strong>; delivery estimate and tax per area. Migrations V87 to\nV97. One web-server rule is needed for link previews (chapter 7).<\/li>\n<li><strong>1.53 and 1.54<\/strong> Link previews and search engines\n(sitemap, robots.txt); <strong>back-in-stock alerts<\/strong>.<\/li>\n<li><strong>1.55<\/strong> The customer <strong>portal<\/strong>\n(<code>/shop/account<\/code>).<\/li>\n<li><strong>1.65 to 1.69<\/strong> Online Store stock and prices: the\n<strong>stock the shop sells<\/strong> (Sales locations), stock\n<strong>held from checkout<\/strong>, a buffer for each product,\nautomatic release of unanswered orders, expiry dates and serial numbers,\ncartons, reorder with shop demand, <strong>prices and promotions from\nSales<\/strong>, products sold by weight or length. Migrations V98 to\nV101.<\/li>\n<li><strong>1.70 to 1.76<\/strong> Online Store\n<strong>accounting<\/strong>: returns post VAT and the refund; online\npayments are held and cleared against <strong>provider payouts<\/strong>;\n<strong>Cash with Drivers<\/strong>; <strong>Sales Discounts\nGiven<\/strong>, <strong>Delivery Income<\/strong> and <strong>Loyalty\nPoints Liability<\/strong>; returns at the cost sold; a branch for the\nshop; <strong>an account for each payment provider<\/strong>, chosen on\nscreen. Migrations V102 to V106. New accounts appear in the chart by\nthemselves.<\/li>\n<\/ul>\n<p>For a list a customer can read, with the steps to take at each\nupgrade, see the separate <strong>Release and upgrade notes for\ncustomers<\/strong>.<\/p>\n", "text": " Who it is for This is the Administrator Manual for NIWE ERP (the NIWE POS/ERP system). It is written for the person who installs, configures and looks after the system: the business owner, the IT person, or the office manager who holds the Admin account. Day-to-day instructions for cashiers, accountants, store keepers and other staff are in the separate User Manual and in the Role quick-start cards . You do not need to be a programmer to follow most of this manual. Chapters 2 and 12 (installation and upgrades) are technical and are meant for whoever manages the server. How the manual is organised Chapter What it covers 2. Installing and first start Requirements, database, starting the system, first sign-in 3. Licence and modules Installation id, licence file, activating and requesting modules 4. Users, roles and permissions Staff accounts, custom roles, per-person approval rights, branch access 5. Business set-up Business details, currency, taxes, payment methods, branches, warehouses 6. Accounting set-up Chart of accounts, cost centers, controls, opening balances 7. Module settings Where each module keeps its own settings 8. Tills, printers and devices Thermal printing, cash drawer, customer display, binding a register to a PC 9. E-mail, alerts and scheduled reports SMTP, business alerts, scheduled reports, daily stock jobs 10. Backup, restore, import and export Nightly backup, restore, bulk import with check-first, year-end archive 11. Logs and monitoring Audit log, sign-in log, server logs 12. Upgrades and migrations Installing a new version, database migrations 13. Security checklist What to change before going live 14. Troubleshooting Common problems and what to do Conventions Menu paths are written like Settings > Modules . The words are exactly as they appear on screen. Buttons and fields are written in bold . Boxes marked Note , Tip and Warning call attention to things that matter. A warning describes something that cannot easily be undone. What is new in this edition This edition covers everything up to version 1.76.0 . The main administrator-facing additions since version 1.12 are: 1.12 Thermal (Epson ESC/POS) printing, cash drawer and COM customer display. 1.13 A register can be tied to one known device. 1.14 Server logs and the sign-in log; more actions in the audit log; currency follows the chart of accounts (RWF for Rwanda, XAF for Chad). 1.15 to 1.22 Improvements to Work Orders, Time Tracking, Booking, Installments, Subscriptions, Help Desk, Expenses and Assets, including new approval permissions ( Approve large expenses , Approve large asset disposals ) and new reports available to scheduled reports. 1.22.1 to 1.22.5 Fixes and hardening: subscription month-end billing, first-start administrator on a real installation, no password or secret kept in the shipped files, the server logs written next to the jar, and a printable PDF of the modules list. 1.23 French. Every user can switch between English and Français from the top bar or the sign-in page, and the business has a default language (Settings > System settings) that follows the chart of accounts: Chad starts in French, Rwanda in English. The core screens are translated: sign-in, menus, dashboard, POS, Sales, Purchases, Inventory, Customers, Accounting and Settings. 1.24 French for the other modules: Restaurant, Hotel, Manufacturing, Subscriptions, Installments, Help Desk, HR and Payroll, Time tracking, Work orders, Booking, Law firm, Real estate, Property management, Assets, Gift cards, Loyalty, Promotions, the client portal, My profile and the Invoice list. A phrase without a French version shows in English. Ask a French speaker to read the wording before customers use it. 1.25 French for the messages written in the program code (error messages, \"Are you sure?\" questions, notices), for lists such as status filters, weekdays and permission names, and for the titles and column headings of every report. A fix makes texts that carry a value (for example \"3 days left\") show correctly in English. Server messages, e-mails and printed PDF documents were still English in this version. 1.26 French for the texts the server writes: printed documents (invoices, quotations, receipts, statements, delivery and goods-received notes, payslips, hotel bills, law-firm letters, instalment agreements, the modules list and more), the e-mails sent to customers, tenants, owners, guests, clients and staff, and the messages the server returns (for example \"Customer not found\"). They follow the business language in Settings > System settings, not the language a user picked on their own screen. Dates and amounts are written the French way (5 mars 2026, 1 234,50). Audit trail entries and names already stored in the database stay as they were written. Ask a French speaker to read the wording before customers receive it. 1.26.1 Fix: \"Failed to create backup directory ./backups\" when the server runs as a service. Backups now go to a backups folder next to the jar by default. 1.26.2 The log files go into a folder named logs next to the jar (instead of the jar's folder itself). 1.27.0 New optional module Online Store : a public shop at /shop where customers order for delivery or pick-up and pay in cash. See Online Store settings in chapter 7 and the public-side notes in chapter 13. 1.28 to 1.34 The Online Store grows: orders can be paid online (a test provider and MTN Mobile Money for Rwanda), customers can sign in with an e-mailed code, coupons , text messages (SMS or WhatsApp, through a provider a developer adds), and returns and refunds of completed orders. Delivery of order e-mails in the customer's language, alerts for unanswered orders and resized photos. 1.35 and 1.36 The shop's first page has an announcement bar, header with search, a banner of uploaded pictures that slide , four product rows chosen by staff (the rows slide), customer reviews (staff approve them), a newsletter sign-up with e-mail confirmation and a footer with links; new screens Reviews and Newsletter ; Sellable now figures under each product explain the stock the shop shows. See Online Store settings in chapter 7. 1.37 Online Store: Sales reports (by day, orders with invoices, payment methods, orders not counted as sales, coupons, best-selling products), counted on the day an order is completed and matching the invoices; they can be e-mailed on a schedule. Needs the Reports area or Operations area for the user. 1.38 Online Store: Send a newsletter from the program (subject, text, optional button; everyone or only English or French readers; a test e-mail first; sent in batches with a daily limit; progress, stop, retry of failed addresses; each e-mail has the person's own unsubscribe link). New tables by migration V74. 1.39 Online Store: abandoned-cart reminders (e-mail after 1 hour and after 3 days to visitors who typed an e-mail address at checkout; no discount; a link in every e-mail stops them; Online Store > Abandoned carts lists them); off until switched on in Shop settings; new tables (migration V75, runs by itself at start-up). 1.40 Online Store: loyalty points for signed-in shop customers (earned when an order is completed, spent at checkout as a discount; given back on cancellation, adjusted on returns; Online Store > Loyalty points for staff to see and adjust); off until switched on in Shop settings; separate from the till's loyalty programme; new tables (migration V76, runs by itself at start-up). 1.41 and 1.42 Online Store: Airtel Money as a second payment provider, and several providers at once : the customer picks one at checkout. Keys for each provider live only in the server's environment. 1.43 Online Store: Advertising (advertisers, ads in three places of the shop, a report of views and clicks). Migration V78. 1.44 to 1.48 Online Store: a product page for each product, search and filters, ratings (stars, at once) and reviews (words, approved by staff) , invoice download, address book, wish list, WhatsApp, product rows that slide. Migrations V79 to V82. 1.49 The whole site can be installed as an app (PWA); nothing from the server is kept offline. Needs https. 1.50 to 1.51 Online Store: product variants (size, colour, model) from the ERP's own variants; a contact form and four information pages . Migrations V84 to V86. 1.52 to 1.64 Online Store delivery: drivers , delivery slips and run sheets; the delivery code ; the driver's private link and PIN page; driver cash hand-in; failed and partial deliveries; delivery time slots ; return pick-ups ; delivery estimate and tax per area. Migrations V87 to V97. One web-server rule is needed for link previews (chapter 7). 1.53 and 1.54 Link previews and search engines (sitemap, robots.txt); back-in-stock alerts . 1.55 The customer portal ( /shop/account ). 1.65 to 1.69 Online Store stock and prices: the stock the shop sells (Sales locations), stock held from checkout , a buffer for each product, automatic release of unanswered orders, expiry dates and serial numbers, cartons, reorder with shop demand, prices and promotions from Sales , products sold by weight or length. Migrations V98 to V101. 1.70 to 1.76 Online Store accounting : returns post VAT and the refund; online payments are held and cleared against provider payouts ; Cash with Drivers ; Sales Discounts Given , Delivery Income and Loyalty Points Liability ; returns at the cost sold; a branch for the shop; an account for each payment provider , chosen on screen. Migrations V102 to V106. New accounts appear in the chart by themselves. For a list a customer can read, with the steps to take at each upgrade, see the separate Release and upgrade notes for customers . "}, {"id": "admin-2-installing-and-first-start", "manual": "admin", "n": 2, "title": "Installing and first start", "html": "\n<h2 id=\"what-the-system-is-made-of\">What the system is made of<\/h2>\n<p>NIWE ERP has two parts that run together:<\/p>\n<ul>\n<li>The <strong>backend<\/strong>, a Java 21 / Spring Boot application,\nwhich holds all the business rules and talks to the database. It listens\non port <strong>8080<\/strong>.<\/li>\n<li>The <strong>frontend<\/strong>, an Angular 18 web application that\nstaff open in a browser. In development it is served on port\n<strong>4200<\/strong>; in production it is normally built into static\nfiles and served by a web server.<\/li>\n<li>A <strong>PostgreSQL<\/strong> database that stores everything. The\ndatabase structure is created and upgraded automatically by\n<strong>Flyway<\/strong>.<\/li>\n<\/ul>\n<p>Staff only need a modern browser (Chrome or Edge is recommended;\nthermal printing needs one of these).<\/p>\n<h2 id=\"requirements\">Requirements<\/h2>\n<ul>\n<li>Java 21 and Maven (to build or run the backend) or the packaged\nbackend you were given.<\/li>\n<li>Node.js and npm (to build the frontend).<\/li>\n<li>PostgreSQL, with an empty database.<\/li>\n<li>For thermal printing from a till PC: Chrome or Edge, opened on\n<strong>https<\/strong> or on <strong>localhost<\/strong> (see chapter\n8).<\/li>\n<\/ul>\n<h2 id=\"first-installation\">First installation<\/h2>\n<ol type=\"1\">\n<li><strong>Create the database.<\/strong> For example:\n<code>createdb pos_app<\/code>.<\/li>\n<li><strong>Set the database connection.<\/strong> Give the backend the\naddress, user and password of your database through environment\nvariables: <code>DB_URL<\/code> (for example\n<code>jdbc:postgresql://localhost:5432/pos_app<\/code>),\n<code>DB_USER<\/code> and <code>DB_PASSWORD<\/code>, and set\n<code>JWT_SECRET<\/code> to a long random value. Alternatively put the\nsame settings (<code>spring.datasource.url<\/code>,\n<code>.username<\/code>, <code>.password<\/code>,\n<code>app.jwt.secret<\/code>) in a private file\n<code>config/application.properties<\/code> next to where the backend is\nstarted. No password is kept in the shipped files; from version 1.22.3\nthe shipped files hold only harmless defaults.<\/li>\n<li><strong>Start the backend.<\/strong> On the very first start Flyway\ncreates all tables (migration V1, the baseline) and the licence tables\n(V2) and then applies every later migration. This can take a minute.\nWait for the message <em>Started PosApplication<\/em>.<\/li>\n<li><strong>Start the frontend.<\/strong> In development:\n<code>npm install<\/code> then <code>npm start<\/code>, and open\n<code>http://localhost:4200<\/code>. If the backend is somewhere other\nthan <code>localhost:8080<\/code>, change <code>API_BASE<\/code> in\n<code>frontend/src/app/core/constants.ts<\/code> before building, and add\nthe frontend's address to <code>app.cors.allowed-origins<\/code> in the\nbackend properties.<\/li>\n<li><strong>Sign in<\/strong> as <code>admin<\/code> with the password\n<code>admin123<\/code> (when demo data is on, the default). On a real\ninstallation without demo data, see <em>A real installation without demo\ndata<\/em> below.<\/li>\n<\/ol>\n<div class=\"callout warning\">\n<p><strong>Warning:<\/strong> The demo accounts (<code>admin<\/code> /\n<code>admin123<\/code>, <code>cashier<\/code> / <code>cashier123<\/code>,\nwith terminal PINs 1234 and 5678) are only meant for the first start.\n<strong>Change the admin password immediately<\/strong>, and set\n<code>JWT_SECRET<\/code> (the <code>app.jwt.secret<\/code> setting) to a\nlong random value of your own. Chapter 13 has the full checklist.<\/p>\n<\/div>\n<h2 id=\"demo-data\">Demo data<\/h2>\n<p>On the first start the system adds demo data: an admin and a cashier,\nfour categories, eight barcoded products, a walk-in customer, the\npayment methods, a standard tax rate and one register. This is helpful\nfor learning or for a first look. It is added only once.<\/p>\n<h3 id=\"a-real-installation-without-demo-data\">A real installation\nwithout demo data<\/h3>\n<p>For a real business, start the very first time with\n<code>app.seed-demo-data=false<\/code>. With no demo data and an empty\ndatabase, the system creates one administrator, <code>admin<\/code>, so\nthat you can sign in:<\/p>\n<ul>\n<li>If you set <code>app.initial-admin-password=<\/code> to a password of\nyour own, that is the password.<\/li>\n<li>If you leave it empty, the system makes a random password and writes\nit <strong>once<\/strong> to the log, in a line that starts with\n<em>FIRST START<\/em> (chapter 11). Copy it, sign in, and change it at\nonce under your profile.<\/li>\n<\/ul>\n<p>This happens only when there are no users at all, so a restart never\nchanges your password or creates another account. Without the demo data\nthere are also no payment methods, taxes or register yet: create them in\n<strong>Settings<\/strong> (steps 5 and 11 below). Do not use the demo\naccounts on a server that real people can reach.<\/p>\n<h2 id=\"order-of-set-up-for-a-new-business\">Order of set-up for a new\nbusiness<\/h2>\n<p>A sensible order that avoids rework:<\/p>\n<ol type=\"1\">\n<li>Change the admin password (<strong>Staff<\/strong>, then your own\naccount) and the JWT secret.<\/li>\n<li>Fill in <strong>Settings &gt; Business details<\/strong>.<\/li>\n<li>Install the licence and activate modules (<strong>Settings &gt;\nModules<\/strong>, chapter 3).<\/li>\n<li>Set <strong>System settings<\/strong> (currency, time zone, date\nformat, discount mode).<\/li>\n<li>Create <strong>Taxes<\/strong> and <strong>Payment\nmethods<\/strong>.<\/li>\n<li>Create <strong>Branches<\/strong> and <strong>Warehouses<\/strong> (if\nyou have more than the head office).<\/li>\n<li>Choose the <strong>chart of accounts<\/strong> and set the accounting\ncontrols (chapter 6).<\/li>\n<li>Create <strong>Roles<\/strong> and <strong>Staff<\/strong> accounts\n(chapter 4).<\/li>\n<li>Set up <strong>E-mail settings<\/strong> (chapter 9), then the\nsettings of each module you use (chapter 7).<\/li>\n<li>Import products, customers, suppliers and opening balances (chapter\n10), checking each file first.<\/li>\n<li>Set up registers, printers and devices (chapter 8).<\/li>\n<li>Make a first manual backup (<strong>Settings &gt; Backup &amp;\nData<\/strong>).<\/li>\n<\/ol>\n<h2 id=\"installing-for-several-businesses\">Installing for several\nbusinesses<\/h2>\n<p>The same build serves every customer: the production build of the\nfrontend asks the <strong>same address<\/strong> for the API\n(<code>/api<\/code>), so one build works behind any domain, and each\ncustomer has <strong>its own database, its own private settings file,\nits own secrets and its own licence<\/strong>. Nothing of one customer is\nin another's database. The separate <strong>Installation and deployment\nguide<\/strong> describes a repeatable way to prepare a server, install a\nnew customer, and what differs from one customer to the next. The\n<strong>Customer onboarding guide<\/strong> describes the first weeks\nwith a new business.<\/p>\n<h2 id=\"where-the-system-keeps-its-files\">Where the system keeps its\nfiles<\/h2>\n<p>Besides the database, the backend writes its log files (chapter 11)\nand keeps uploaded documents and photos in its storage folder. When the\nbackend runs as a jar, for example as a service, the log files are\nwritten to a folder named <strong>logs<\/strong> next to the jar\n(<code>niwe-erp.log<\/code>, <code>niwe-erp-error.log<\/code>,\n<code>niwe-access.log<\/code>) and the database backups to a folder named\n<strong>backups<\/strong> next to the jar; both are created when missing,\nso the account that runs the service must be allowed to write in the\njar's folder. Include both the database backup and the storage folder in\nyour own server backup routine.<\/p>\n", "text": " What the system is made of NIWE ERP has two parts that run together: The backend , a Java 21 / Spring Boot application, which holds all the business rules and talks to the database. It listens on port 8080 . The frontend , an Angular 18 web application that staff open in a browser. In development it is served on port 4200 ; in production it is normally built into static files and served by a web server. A PostgreSQL database that stores everything. The database structure is created and upgraded automatically by Flyway . Staff only need a modern browser (Chrome or Edge is recommended; thermal printing needs one of these). Requirements Java 21 and Maven (to build or run the backend) or the packaged backend you were given. Node.js and npm (to build the frontend). PostgreSQL, with an empty database. For thermal printing from a till PC: Chrome or Edge, opened on https or on localhost (see chapter 8). First installation Create the database. For example: createdb pos_app . Set the database connection. Give the backend the address, user and password of your database through environment variables: DB_URL (for example jdbc:postgresql://localhost:5432/pos_app ), DB_USER and DB_PASSWORD , and set JWT_SECRET to a long random value. Alternatively put the same settings ( spring.datasource.url , .username , .password , app.jwt.secret ) in a private file config/application.properties next to where the backend is started. No password is kept in the shipped files; from version 1.22.3 the shipped files hold only harmless defaults. Start the backend. On the very first start Flyway creates all tables (migration V1, the baseline) and the licence tables (V2) and then applies every later migration. This can take a minute. Wait for the message Started PosApplication . Start the frontend. In development: npm install then npm start , and open http://localhost:4200 . If the backend is somewhere other than localhost:8080 , change API_BASE in frontend/src/app/core/constants.ts before building, and add the frontend's address to app.cors.allowed-origins in the backend properties. Sign in as admin with the password admin123 (when demo data is on, the default). On a real installation without demo data, see A real installation without demo data below. Warning: The demo accounts ( admin / admin123 , cashier / cashier123 , with terminal PINs 1234 and 5678) are only meant for the first start. Change the admin password immediately , and set JWT_SECRET (the app.jwt.secret setting) to a long random value of your own. Chapter 13 has the full checklist. Demo data On the first start the system adds demo data: an admin and a cashier, four categories, eight barcoded products, a walk-in customer, the payment methods, a standard tax rate and one register. This is helpful for learning or for a first look. It is added only once. A real installation without demo data For a real business, start the very first time with app.seed-demo-data=false . With no demo data and an empty database, the system creates one administrator, admin , so that you can sign in: If you set app.initial-admin-password= to a password of your own, that is the password. If you leave it empty, the system makes a random password and writes it once to the log, in a line that starts with FIRST START (chapter 11). Copy it, sign in, and change it at once under your profile. This happens only when there are no users at all, so a restart never changes your password or creates another account. Without the demo data there are also no payment methods, taxes or register yet: create them in Settings (steps 5 and 11 below). Do not use the demo accounts on a server that real people can reach. Order of set-up for a new business A sensible order that avoids rework: Change the admin password ( Staff , then your own account) and the JWT secret. Fill in Settings > Business details . Install the licence and activate modules ( Settings > Modules , chapter 3). Set System settings (currency, time zone, date format, discount mode). Create Taxes and Payment methods . Create Branches and Warehouses (if you have more than the head office). Choose the chart of accounts and set the accounting controls (chapter 6). Create Roles and Staff accounts (chapter 4). Set up E-mail settings (chapter 9), then the settings of each module you use (chapter 7). Import products, customers, suppliers and opening balances (chapter 10), checking each file first. Set up registers, printers and devices (chapter 8). Make a first manual backup ( Settings > Backup & Data ). Installing for several businesses The same build serves every customer: the production build of the frontend asks the same address for the API ( /api ), so one build works behind any domain, and each customer has its own database, its own private settings file, its own secrets and its own licence . Nothing of one customer is in another's database. The separate Installation and deployment guide describes a repeatable way to prepare a server, install a new customer, and what differs from one customer to the next. The Customer onboarding guide describes the first weeks with a new business. Where the system keeps its files Besides the database, the backend writes its log files (chapter 11) and keeps uploaded documents and photos in its storage folder. When the backend runs as a jar, for example as a service, the log files are written to a folder named logs next to the jar ( niwe-erp.log , niwe-erp-error.log , niwe-access.log ) and the database backups to a folder named backups next to the jar; both are created when missing, so the account that runs the service must be allowed to write in the jar's folder. Include both the database backup and the storage folder in your own server backup routine. "}, {"id": "admin-3-licence-and-modules", "manual": "admin", "n": 3, "title": "Licence and modules", "html": "\n<h2 id=\"how-licensing-works\">How licensing works<\/h2>\n<p>Which modules a business may use is decided by a <strong>licence\nfile<\/strong> that NIWE signs for that one installation. A module can be\nused only when it is <strong>in the licence<\/strong> <em>and<\/em> an\nadministrator has <strong>activated<\/strong> it.<\/p>\n<ul>\n<li><strong>Core modules<\/strong> are always active: <strong>Sales,\nPurchases and Accounting<\/strong>.<\/li>\n<li>Products and stock, customers, suppliers, staff and settings are\nshared by every module and are always available.<\/li>\n<li>All other modules (for example Hotel, Restaurant, Online Store,\nPayroll, Assets) need to be in the licence and then activated.<\/li>\n<\/ul>\n<p>The licence file has the extension <code>.niwelic<\/code>. It is\nsigned with a digital signature (Ed25519) and checked inside the\napplication, so it cannot be edited by hand. It is checked offline: no\ninternet connection is needed.<\/p>\n<h2 id=\"the-installation-id\">The installation id<\/h2>\n<p>Every installation gets a random <strong>installation id<\/strong> the\nfirst time it starts. It is stored in the database, so it travels with\nbackups. A licence is issued for exactly this id and will not work on\nanother installation.<\/p>\n<p>You find it on <strong>Settings &gt; Modules<\/strong>, in the\n<em>License<\/em> section, next to a <strong>Copy<\/strong> button.<\/p>\n<h2 id=\"getting-and-installing-a-licence\">Getting and installing a\nlicence<\/h2>\n<ol type=\"1\">\n<li>Open <strong>Settings &gt; Modules<\/strong> and press\n<strong>Copy<\/strong> next to the installation id.<\/li>\n<li>Send the id to NIWE together with the list of modules the business\nbought.<\/li>\n<li>NIWE sends back a <code>.niwelic<\/code> file.<\/li>\n<li>On <strong>Settings &gt; Modules<\/strong>, upload the file. The\nmessage <em>License installed<\/em> appears and the licence is listed\nunder <em>Installed licenses<\/em> (number, issued date, expiry date,\nmodules, who installed it).<\/li>\n<li>Activate the modules the business needs (next section).<\/li>\n<\/ol>\n<p>The screen shows who the licence is issued to, its number, issue date\nand expiry date (or <em>no expiry date<\/em>).<\/p>\n<h2 id=\"activating-modules\">Activating modules<\/h2>\n<p>Each module card on <strong>Settings &gt; Modules<\/strong> shows a\nstate:<\/p>\n<div class=\"tablewrap\"><table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>State on screen<\/th>\n<th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>Core / Always on<\/strong><\/td>\n<td>Sales, Purchases, Accounting. Nothing to do.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>In your license<\/strong><\/td>\n<td>Licensed but not yet switched on. Press\n<strong>Activate<\/strong>.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Active<\/strong><\/td>\n<td>In use. It cannot be turned off again.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Locked (Request)<\/strong><\/td>\n<td>Not in your licence. You may press <strong>Request<\/strong>.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Requested<\/strong><\/td>\n<td>A request was sent; it is waiting for NIWE. You may <strong>Withdraw\nrequest<\/strong>.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>License expired<\/strong><\/td>\n<td>The module was in a licence that has expired.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"callout warning\">\n<p><strong>Warning:<\/strong> Activation is permanent. Once a module is\nactivated it cannot be deactivated. Activate only what the business\nreally needs; a module that is not activated is hidden from every\nmenu.<\/p>\n<\/div>\n<p>Some modules work together. When you activate one, the system may\nactivate another that it depends on and tells you so (\"Also activated,\nbecause it works together with...\"). The module cards show <em>Works\ntogether with<\/em> and <em>Needed by<\/em> lines.<\/p>\n<p>After you activate <strong>Hotel<\/strong>, the screen reminds you to\nset it up in this order: first room types (name and nightly rate), then\nrooms, then the hotel settings (accounting mode, tax, times). The\n<em>Charge to room<\/em> payment method then becomes available in the POS\nand the Restaurant.<\/p>\n<h2 id=\"printing-the-list-of-modules\">Printing the list of modules<\/h2>\n<p>Press <strong>Print PDF<\/strong> at the top of <strong>Settings &gt;\nModules<\/strong> to get an A4 PDF of every module with what it does, the\nmodules it works together with, and its state in this installation. The\ntop of the page shows who the licence is issued to, its number, expiry\ndate and the installation id, followed by a count of core, active,\navailable and locked modules. This is handy to send to NIWE with a\nrequest, or to keep with the business records.<\/p>\n<h2 id=\"requesting-a-module-you-do-not-have\">Requesting a module you do\nnot have<\/h2>\n<p>On a locked module press <strong>Request<\/strong>, optionally add a\nnote (why you need it, how many users, when) and press <strong>Send\nrequest<\/strong>.<\/p>\n<ul>\n<li>If e-mail is set up (<strong>Settings &gt; Email settings<\/strong>)\nand the setting <code>app.license.vendor-email<\/code> has an address,\nthe request is e-mailed to NIWE with the installation id and the\nbusiness name.<\/li>\n<li>Otherwise the screen shows the text so you can send it by hand.<\/li>\n<\/ul>\n<div class=\"callout note\">\n<p><strong>Note:<\/strong> A request unlocks nothing. The module becomes\navailable only when you install a new licence file that contains it.<\/p>\n<\/div>\n<h2 id=\"expiry\">Expiry<\/h2>\n<p>A licence may have an expiry date. During the <strong>last 30\ndays<\/strong> an administrator sees a warning on <strong>Settings &gt;\nModules<\/strong> (\"The license expires on ... (n days). Ask NIWE for a\nrenewal in good time.\"). After the date:<\/p>\n<ul>\n<li>Non-core modules <strong>lock<\/strong>; Sales, Purchases and\nAccounting keep working.<\/li>\n<li><strong>Nothing is deleted.<\/strong> Your data is untouched.<\/li>\n<li>Installing a renewed licence restores access immediately.<\/li>\n<\/ul>\n<h2 id=\"what-a-locked-module-does\">What a locked module does<\/h2>\n<p>It is greyed out on <strong>Settings &gt; Modules<\/strong> and hidden\nfrom menus. The server refuses calls to its own screens' data (HTTP 403,\n\"X is not part of your license\"), its public pages answer \"not\navailable\", and its morning jobs are skipped.<\/p>\n<p>Reports, the dashboard, products, customers, invoices and stock are\nshared and stay open. Scheduled e-mail reports are not stopped when a\nmodule is locked.<\/p>\n<h2 id=\"for-developers-only\">For developers only<\/h2>\n<p>The setting <code>app.license.dev-all-modules=true<\/code>, together\nwith the <code>dev<\/code> profile, makes every module count as licensed.\nIt is ignored unless the <code>dev<\/code> profile is active.<\/p>\n<div class=\"callout warning\">\n<p><strong>Warning:<\/strong> Never start a customer installation with\nthe <code>dev<\/code> profile. If the screen shows \"The developer switch\nis on: every module counts as licensed\", the installation is running in\ndevelopment mode and must be restarted normally.<\/p>\n<\/div>\n", "text": " How licensing works Which modules a business may use is decided by a licence file that NIWE signs for that one installation. A module can be used only when it is in the licence and an administrator has activated it. Core modules are always active: Sales, Purchases and Accounting . Products and stock, customers, suppliers, staff and settings are shared by every module and are always available. All other modules (for example Hotel, Restaurant, Online Store, Payroll, Assets) need to be in the licence and then activated. The licence file has the extension .niwelic . It is signed with a digital signature (Ed25519) and checked inside the application, so it cannot be edited by hand. It is checked offline: no internet connection is needed. The installation id Every installation gets a random installation id the first time it starts. It is stored in the database, so it travels with backups. A licence is issued for exactly this id and will not work on another installation. You find it on Settings > Modules , in the License section, next to a Copy button. Getting and installing a licence Open Settings > Modules and press Copy next to the installation id. Send the id to NIWE together with the list of modules the business bought. NIWE sends back a .niwelic file. On Settings > Modules , upload the file. The message License installed appears and the licence is listed under Installed licenses (number, issued date, expiry date, modules, who installed it). Activate the modules the business needs (next section). The screen shows who the licence is issued to, its number, issue date and expiry date (or no expiry date ). Activating modules Each module card on Settings > Modules shows a state: State on screen Meaning Core / Always on Sales, Purchases, Accounting. Nothing to do. In your license Licensed but not yet switched on. Press Activate . Active In use. It cannot be turned off again. Locked (Request) Not in your licence. You may press Request . Requested A request was sent; it is waiting for NIWE. You may Withdraw request . License expired The module was in a licence that has expired. Warning: Activation is permanent. Once a module is activated it cannot be deactivated. Activate only what the business really needs; a module that is not activated is hidden from every menu. Some modules work together. When you activate one, the system may activate another that it depends on and tells you so (\"Also activated, because it works together with...\"). The module cards show Works together with and Needed by lines. After you activate Hotel , the screen reminds you to set it up in this order: first room types (name and nightly rate), then rooms, then the hotel settings (accounting mode, tax, times). The Charge to room payment method then becomes available in the POS and the Restaurant. Printing the list of modules Press Print PDF at the top of Settings > Modules to get an A4 PDF of every module with what it does, the modules it works together with, and its state in this installation. The top of the page shows who the licence is issued to, its number, expiry date and the installation id, followed by a count of core, active, available and locked modules. This is handy to send to NIWE with a request, or to keep with the business records. Requesting a module you do not have On a locked module press Request , optionally add a note (why you need it, how many users, when) and press Send request . If e-mail is set up ( Settings > Email settings ) and the setting app.license.vendor-email has an address, the request is e-mailed to NIWE with the installation id and the business name. Otherwise the screen shows the text so you can send it by hand. Note: A request unlocks nothing. The module becomes available only when you install a new licence file that contains it. Expiry A licence may have an expiry date. During the last 30 days an administrator sees a warning on Settings > Modules (\"The license expires on ... (n days). Ask NIWE for a renewal in good time.\"). After the date: Non-core modules lock ; Sales, Purchases and Accounting keep working. Nothing is deleted. Your data is untouched. Installing a renewed licence restores access immediately. What a locked module does It is greyed out on Settings > Modules and hidden from menus. The server refuses calls to its own screens' data (HTTP 403, \"X is not part of your license\"), its public pages answer \"not available\", and its morning jobs are skipped. Reports, the dashboard, products, customers, invoices and stock are shared and stay open. Scheduled e-mail reports are not stopped when a module is locked. For developers only The setting app.license.dev-all-modules=true , together with the dev profile, makes every module count as licensed. It is ignored unless the dev profile is active. Warning: Never start a customer installation with the dev profile. If the screen shows \"The developer switch is on: every module counts as licensed\", the installation is running in development mode and must be restarted normally. "}, {"id": "admin-4-users-roles-and-permissions", "manual": "admin", "n": 4, "title": "Users, roles and permissions", "html": "\n<h2 id=\"the-three-layers-of-access\">The three layers of access<\/h2>\n<p>NIWE ERP controls what each person can do in three layers.\nUnderstanding them makes user set-up easy.<\/p>\n<ol type=\"1\">\n<li><strong>The base role<\/strong> of the account:\n<strong>Admin<\/strong> or <strong>Cashier<\/strong>. An Admin can do\neverything. A Cashier does day-to-day work (the till, and anything the\nnext two layers add).<\/li>\n<li><strong>A custom role<\/strong> (optional, one per person), built\nunder <strong>Staff &gt; Roles<\/strong>. It adds <em>access areas<\/em>\nto a Cashier account, each set to <em>No access<\/em>, <em>View only<\/em>\nor <em>Manage<\/em>. Examples: Manager, Accountant, Store keeper.<\/li>\n<li><strong>Extra permissions<\/strong> (optional, per person):\nindividual approval rights, such as <em>Approve expenses<\/em> or\n<em>Override the store-wide discount cap<\/em>, that you grant one by one\nwithout making the person an Admin.<\/li>\n<\/ol>\n<p>On top of this, a Cashier can be limited to specific\n<strong>branches<\/strong>.<\/p>\n<div class=\"callout note\">\n<p><strong>Note:<\/strong> The server enforces all of this. Hiding a menu\nitem is only a convenience; a person without access is also refused by\nthe server if they try to reach the data another way.<\/p>\n<\/div>\n<h2 id=\"creating-a-staff-account\">Creating a staff account<\/h2>\n<p>Go to <strong>Staff<\/strong> and press the button to add a new staff\nmember. The form has these fields:<\/p>\n<div class=\"tablewrap\"><table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Field<\/th>\n<th>What to enter<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>Username<\/strong><\/td>\n<td>The sign-in name.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Password<\/strong><\/td>\n<td>The initial password. Ask the person to change it after the first\nsign-in.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Full name<\/strong><\/td>\n<td>As it should appear in reports and on approvals.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Email<\/strong><\/td>\n<td>Optional. Needed only so the person can use <strong>Forgot\npassword?<\/strong> on the sign-in screen.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Role<\/strong><\/td>\n<td><strong>Cashier<\/strong> or <strong>Admin<\/strong>.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Custom role<\/strong><\/td>\n<td><em>None, plain cashier<\/em>, or a role you built under Staff &gt;\nRoles. Gives the access of that role on top of normal cashier work.\nAdmins always have full access.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Active<\/strong><\/td>\n<td>Untick to stop the person signing in without deleting the\naccount.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Extra permissions<\/strong><\/td>\n<td>Individual approval rights (below).<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Branch access<\/strong><\/td>\n<td>Visible when you have more than one branch and the role is\nCashier.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Press <strong>Save<\/strong>. To stop someone from working, untick\n<strong>Active<\/strong> rather than deleting the account: their name\nstays on past sales, approvals and audit entries.<\/p>\n<div class=\"callout tip\">\n<p><strong>Tip:<\/strong> Give every person their own account. Shared\naccounts make the audit log and the cashier reports useless.<\/p>\n<\/div>\n<h3 id=\"terminal-pins\">Terminal PINs<\/h3>\n<p>Cashiers open the sales terminal and switch cashier by typing a\n<strong>PIN<\/strong>. Each person's PIN identifies them, so two cashiers\ncan ring sales on one shift without logging out. On the\n<strong>Staff<\/strong> list, each row shows whether a PIN is\n<strong>Set<\/strong> or <strong>Not set<\/strong>, with a <strong>Set\nPIN<\/strong> / <strong>Change PIN<\/strong> button. A PIN must be 4 to 6\ndigits and unique among active staff. The demo accounts have PINs 1234\n(admin) and 5678 (cashier); change them.<\/p>\n<h3 id=\"branch-access\">Branch access<\/h3>\n<p>If the business has several branches, tick the branches a Cashier may\nwork in. The person will then see and work only those branches' tills,\nsales and approvals. <strong>Leave all unticked for access to every\nbranch.<\/strong> Admins are never limited.<\/p>\n<h2 id=\"custom-roles\">Custom roles<\/h2>\n<p>Open <strong>Staff &gt; Roles<\/strong> and press <strong>New\nrole<\/strong>.<\/p>\n<ul>\n<li><strong>Role name<\/strong>: for example <em>Manager<\/em>,\n<em>Accountant<\/em>, <em>Store keeper<\/em>.<\/li>\n<li><strong>Description<\/strong>: optional.<\/li>\n<li><strong>Active<\/strong>: an inactive role gives its staff no extra\naccess until it is switched back on.<\/li>\n<li><strong>What this role can do<\/strong>: one line per access area,\neach set to <strong>No access<\/strong>, <strong>View only<\/strong> or\n<strong>Manage<\/strong>. <em>View<\/em> opens the screens and lists\nread-only. <em>Manage<\/em> also lets the person create and change\nthings.<\/li>\n<\/ul>\n<p>Two ready-made roles, <strong>Manager<\/strong> and\n<strong>Accountant<\/strong>, exist for you to use or copy.<\/p>\n<h3 id=\"the-access-areas\">The access areas<\/h3>\n<div class=\"tablewrap\"><table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Area<\/th>\n<th>Typical screens it opens<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>Sales and customers<\/strong><\/td>\n<td>Customers, quotations, sale orders, price lists, promotions, gift\ncards, loyalty, sale-order returns, shifts, cash movements, POS voids\nand returns, registers; customer payments and collections<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Billing and payments<\/strong><\/td>\n<td>Invoices, recurring invoices, credit notes, refunds, bills, supplier\npayments, installments; customer payments and collections; turning\napproved time into an invoice; recurring expenses<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Inventory and purchasing<\/strong><\/td>\n<td>Products, categories, brands, warehouses, suppliers, purchase\nrequisitions and orders, purchase returns, stock adjustments, counts,\ntransfers, reorder, packaging<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Operations<\/strong><\/td>\n<td>Manufacturing, Restaurant, Subscriptions, Help Desk, Time tracking,\nWork orders, Booking, Law firm, Real estate, Property management;\ndevices<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Accounting<\/strong><\/td>\n<td>Chart of accounts, cost centers, journal entries, controls, incomes,\nexpenses, <strong>Assets<\/strong><\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Hotel<\/strong><\/td>\n<td>The whole Hotel module<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Human resources<\/strong><\/td>\n<td>Employees, documents, onboarding, attendance, leave, org chart<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Payroll and contracts<\/strong><\/td>\n<td>Contracts and payroll (these carry salary data, so they have an area\nof their own)<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Reports and dashboard<\/strong><\/td>\n<td>The dashboard and the reports of each module (view only). Some\nsalary reports stay locked even here.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>A report screen opens to a person who has <em>View<\/em> on\n<strong>Reports and dashboard<\/strong> <em>or<\/em> on the module's own\narea, so you can let a store keeper see inventory reports without\nopening the whole reports area.<\/p>\n<p>Only one custom role can be given to a person. If someone needs the\npowers of two roles, make one combined role.<\/p>\n<h3 id=\"screens-that-cannot-be-delegated\">Screens that cannot be\ndelegated<\/h3>\n<p>The following are always <strong>Admin only<\/strong>, whatever roles\nyou build: <strong>Staff and Roles, Settings<\/strong> (Modules, Payment\nmethods, Taxes, Business details, System settings, Email settings,\nScheduled reports, Apps, Audit Log, Sign-in log, Server logs),\n<strong>Backup &amp; Data<\/strong> including import and export, and\nevery module's own <strong>Settings<\/strong> page. Roles never open\nthem.<\/p>\n<h2 id=\"per-person-approval-permissions\">Per-person approval\npermissions<\/h2>\n<p>Some actions need a second pair of eyes: a manager approving a\nwrite-off, for example. Instead of making that manager an Admin, tick\nthe specific rights under <strong>Extra permissions<\/strong> on their\nstaff record. An Admin already has all of them.<\/p>\n<div class=\"tablewrap\"><table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Permission<\/th>\n<th>What it allows<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Confirm/reject Restaurant wastage<\/td>\n<td>Review a logged wastage entry: apply its stock and accounting\neffect, or discard it<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Approve general Inventory stock adjustments<\/td>\n<td>Review a logged stock adjustment<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Approve Purchase requisitions<\/td>\n<td>Approve or reject a requisition awaiting approval<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Override the store-wide discount cap<\/td>\n<td>Apply a discount at checkout and exceed the configured maximum\ndiscount<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Approve/reject Expenses<\/td>\n<td>Approve or reject an expense awaiting approval, and void an approved\none<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Approve large Expenses<\/td>\n<td>Approve an expense above the approval limit set in Expenses &gt;\nSettings<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Approve large asset disposals<\/td>\n<td>Dispose of an asset whose book value is above the limit set in\nAssets &gt; Settings, and undo a disposal<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Approve/reject Stock transfers<\/td>\n<td>Review a logged transfer between warehouses<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Approve voids and returns at the till<\/td>\n<td>Approve a void or a large return by typing a PIN, without any other\nmanager right<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Approve price changes at the till<\/td>\n<td>Approve a hand-changed price by typing a PIN<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Approve big paid-outs and cash corrections<\/td>\n<td>Approve a large paid-out, and cancel a mistaken cash movement<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"callout tip\">\n<p><strong>Tip:<\/strong> The three \"at the till\" permissions let you\ngive a shift supervisor just enough power to approve exceptions by\ntyping their PIN, without opening any back-office screen to them.<\/p>\n<\/div>\n<h2 id=\"good-practice\">Good practice<\/h2>\n<ul>\n<li>Keep the number of Admins small (two is typical: the owner and one\ndeputy).<\/li>\n<li>Review the staff list every quarter; untick <strong>Active<\/strong>\nfor leavers on the day they go.<\/li>\n<li>Use the <strong>Audit Log<\/strong> (chapter 11) to see who approved\nwhat.<\/li>\n<li>Prefer a role plus a few extra permissions to making people\nAdmin.<\/li>\n<\/ul>\n", "text": " The three layers of access NIWE ERP controls what each person can do in three layers. Understanding them makes user set-up easy. The base role of the account: Admin or Cashier . An Admin can do everything. A Cashier does day-to-day work (the till, and anything the next two layers add). A custom role (optional, one per person), built under Staff > Roles . It adds access areas to a Cashier account, each set to No access , View only or Manage . Examples: Manager, Accountant, Store keeper. Extra permissions (optional, per person): individual approval rights, such as Approve expenses or Override the store-wide discount cap , that you grant one by one without making the person an Admin. On top of this, a Cashier can be limited to specific branches . Note: The server enforces all of this. Hiding a menu item is only a convenience; a person without access is also refused by the server if they try to reach the data another way. Creating a staff account Go to Staff and press the button to add a new staff member. The form has these fields: Field What to enter Username The sign-in name. Password The initial password. Ask the person to change it after the first sign-in. Full name As it should appear in reports and on approvals. Email Optional. Needed only so the person can use Forgot password? on the sign-in screen. Role Cashier or Admin . Custom role None, plain cashier , or a role you built under Staff > Roles. Gives the access of that role on top of normal cashier work. Admins always have full access. Active Untick to stop the person signing in without deleting the account. Extra permissions Individual approval rights (below). Branch access Visible when you have more than one branch and the role is Cashier. Press Save . To stop someone from working, untick Active rather than deleting the account: their name stays on past sales, approvals and audit entries. Tip: Give every person their own account. Shared accounts make the audit log and the cashier reports useless. Terminal PINs Cashiers open the sales terminal and switch cashier by typing a PIN . Each person's PIN identifies them, so two cashiers can ring sales on one shift without logging out. On the Staff list, each row shows whether a PIN is Set or Not set , with a Set PIN / Change PIN button. A PIN must be 4 to 6 digits and unique among active staff. The demo accounts have PINs 1234 (admin) and 5678 (cashier); change them. Branch access If the business has several branches, tick the branches a Cashier may work in. The person will then see and work only those branches' tills, sales and approvals. Leave all unticked for access to every branch. Admins are never limited. Custom roles Open Staff > Roles and press New role . Role name : for example Manager , Accountant , Store keeper . Description : optional. Active : an inactive role gives its staff no extra access until it is switched back on. What this role can do : one line per access area, each set to No access , View only or Manage . View opens the screens and lists read-only. Manage also lets the person create and change things. Two ready-made roles, Manager and Accountant , exist for you to use or copy. The access areas Area Typical screens it opens Sales and customers Customers, quotations, sale orders, price lists, promotions, gift cards, loyalty, sale-order returns, shifts, cash movements, POS voids and returns, registers; customer payments and collections Billing and payments Invoices, recurring invoices, credit notes, refunds, bills, supplier payments, installments; customer payments and collections; turning approved time into an invoice; recurring expenses Inventory and purchasing Products, categories, brands, warehouses, suppliers, purchase requisitions and orders, purchase returns, stock adjustments, counts, transfers, reorder, packaging Operations Manufacturing, Restaurant, Subscriptions, Help Desk, Time tracking, Work orders, Booking, Law firm, Real estate, Property management; devices Accounting Chart of accounts, cost centers, journal entries, controls, incomes, expenses, Assets Hotel The whole Hotel module Human resources Employees, documents, onboarding, attendance, leave, org chart Payroll and contracts Contracts and payroll (these carry salary data, so they have an area of their own) Reports and dashboard The dashboard and the reports of each module (view only). Some salary reports stay locked even here. A report screen opens to a person who has View on Reports and dashboard or on the module's own area, so you can let a store keeper see inventory reports without opening the whole reports area. Only one custom role can be given to a person. If someone needs the powers of two roles, make one combined role. Screens that cannot be delegated The following are always Admin only , whatever roles you build: Staff and Roles, Settings (Modules, Payment methods, Taxes, Business details, System settings, Email settings, Scheduled reports, Apps, Audit Log, Sign-in log, Server logs), Backup & Data including import and export, and every module's own Settings page. Roles never open them. Per-person approval permissions Some actions need a second pair of eyes: a manager approving a write-off, for example. Instead of making that manager an Admin, tick the specific rights under Extra permissions on their staff record. An Admin already has all of them. Permission What it allows Confirm/reject Restaurant wastage Review a logged wastage entry: apply its stock and accounting effect, or discard it Approve general Inventory stock adjustments Review a logged stock adjustment Approve Purchase requisitions Approve or reject a requisition awaiting approval Override the store-wide discount cap Apply a discount at checkout and exceed the configured maximum discount Approve/reject Expenses Approve or reject an expense awaiting approval, and void an approved one Approve large Expenses Approve an expense above the approval limit set in Expenses > Settings Approve large asset disposals Dispose of an asset whose book value is above the limit set in Assets > Settings, and undo a disposal Approve/reject Stock transfers Review a logged transfer between warehouses Approve voids and returns at the till Approve a void or a large return by typing a PIN, without any other manager right Approve price changes at the till Approve a hand-changed price by typing a PIN Approve big paid-outs and cash corrections Approve a large paid-out, and cancel a mistaken cash movement Tip: The three \"at the till\" permissions let you give a shift supervisor just enough power to approve exceptions by typing their PIN, without opening any back-office screen to them. Good practice Keep the number of Admins small (two is typical: the owner and one deputy). Review the staff list every quarter; untick Active for leavers on the day they go. Use the Audit Log (chapter 11) to see who approved what. Prefer a role plus a few extra permissions to making people Admin. "}, {"id": "admin-5-business-set-up", "manual": "admin", "n": 5, "title": "Business set-up", "html": "\n<p>This chapter covers the shared settings that every module uses. All\nare under <strong>Settings<\/strong> unless stated.<\/p>\n<h2 id=\"business-details\">Business details<\/h2>\n<p><strong>Settings &gt; Business details<\/strong> holds the name,\naddress, phone, e-mail and <strong>Tax ID<\/strong> of the business, and\nits <strong>logo<\/strong>. These print on receipts, invoices,\nquotations, statements and e-mails, and the business name is included in\nmodule requests to NIWE. Fill it in before you issue the first\ndocument.<\/p>\n<h2 id=\"system-settings\">System settings<\/h2>\n<p><strong>Settings &gt; System settings<\/strong> (press\n<strong>Save<\/strong> at the bottom; <em>System settings saved<\/em>\nconfirms):<\/p>\n<div class=\"tablewrap\"><table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Setting<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>Currency<\/strong><\/td>\n<td>Pick the currency. The <strong>Currency symbol<\/strong> is filled in\nfrom it; override it if you would rather show a code (for example\n\"UGX\").<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Business language<\/strong><\/td>\n<td><strong>English<\/strong> or <strong>Français<\/strong>. This is the\nlanguage everyone sees until they pick their own with the language\nselector on the top bar or the sign-in page. It is set for you when you\nchoose the Chad chart of accounts (Français) and stays English for\nRwanda, but only while it has not been changed. From version 1.26 it\nalso decides the language of printed documents (PDFs), of the e-mails\nthe system sends and of the messages returned by the server, so a\ncustomer receives an invoice or a reminder in the language of your\nbusiness, whatever language the person who sent it uses on screen. A\nchange in Settings reaches the papers and e-mails within seconds.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Time zone<\/strong><\/td>\n<td>Used for shift times, scheduled reports and daily jobs.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Date format<\/strong><\/td>\n<td>How dates show on screen and documents.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Max discount (%)<\/strong><\/td>\n<td>The highest discount percentage allowed on any single sale line,\nstore-wide. Someone with the <em>Override the store-wide discount\ncap<\/em> permission can exceed it.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Discount<\/strong><\/td>\n<td><strong>Off<\/strong>: no discount field on quotations, sale orders,\ninvoices, purchase orders and bills. <strong>Per line<\/strong>: each\nline has its own discount. <strong>Global<\/strong>: one discount for the\nwhole document. Only one mode applies at a time, store-wide. The POS\nterminal's own discount is separate and always available (subject to the\ntill rules in chapter 8).<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"callout note\">\n<p><strong>Note:<\/strong> If you choose the Rwanda or Chad chart of\naccounts while the currency is still the untouched default, the currency\nis set to RWF or XAF for you. In the same way the business language\nbecomes <strong>Français<\/strong> for the Chad chart while it is still\nthe untouched English default.<\/p>\n<\/div>\n<h2 id=\"taxes\">Taxes<\/h2>\n<p><strong>Settings &gt; Taxes<\/strong> lists your tax rates (Code,\nName, Rate, Pricing, Status). Press <strong>New tax rate<\/strong> to add\none.<\/p>\n<ul>\n<li><strong>Pricing<\/strong> is either <em>Tax-inclusive<\/em> (the price\nalready contains the tax) or <em>Tax added on top<\/em>.<\/li>\n<li>Each product picks its own tax rate, or none for tax-exempt goods,\nin <strong>Inventory &gt; Products<\/strong>. Any number of rates can be\nactive at once.<\/li>\n<li>Set a rate to <strong>Inactive<\/strong> instead of deleting it when\nit is no longer used; old documents keep it.<\/li>\n<\/ul>\n<h2 id=\"payment-methods\">Payment methods<\/h2>\n<p><strong>Settings &gt; Payment methods<\/strong> lists the ways\ncustomers pay (Order, Code, Name, Cash-equivalent, Store credit,\nStatus). Press <strong>New payment method<\/strong> to add one.<\/p>\n<ul>\n<li>Flag <strong>Cash-equivalent<\/strong> only for methods that should\ncount as <em>cash in the drawer<\/em> when a till is reconciled.\nEverything else is treated as non-cash at shift close.<\/li>\n<li><strong>Order<\/strong> decides the sequence of the methods on the\ncheckout screen (lower comes first). Set it on the edit screen.<\/li>\n<li><strong>Store credit<\/strong> marks a method that draws on a\ncustomer's credit balance.<\/li>\n<li><strong>Room charge<\/strong> (\"Charge to room\") appears once the\nHotel module is active.<\/li>\n<li>Common choices: Cash, Card, Mobile money, Bank transfer, Cheque,\nGift card, Loyalty.<\/li>\n<\/ul>\n<h2 id=\"branches\">Branches<\/h2>\n<p><strong>Inventory &gt; Branches<\/strong> (or the Branches list in\nyour menu) lists your branches. A branch owns one or more warehouses;\nsales, purchases and expenses are tagged with their branch so that you\ncan report per branch. Everything recorded before branches existed\nbelongs to the <strong>Head office<\/strong> (marked with a star), which\ncannot be deactivated.<\/p>\n<p>Press <strong>New branch<\/strong> and fill in:<\/p>\n<ul>\n<li><strong>Code<\/strong> (for example KLA), <strong>Name<\/strong>,\noptional <strong>Address<\/strong>, <strong>Phone<\/strong>,\n<strong>Email<\/strong>.<\/li>\n<li><strong>Receipt header<\/strong> (optional). Stored per branch.<\/li>\n<li><strong>Tax &amp; numbering<\/strong> (optional): <strong>Tax ID /\nTIN<\/strong>, <strong>EFRIS branch code<\/strong>, <strong>Document\nprefix<\/strong> (for example <code>KLA-<\/code>). These are stored for\neach branch.<\/li>\n<li><strong>Active<\/strong>.<\/li>\n<\/ul>\n<h2 id=\"warehouses-and-locations\">Warehouses and locations<\/h2>\n<p><strong>Inventory &gt; Warehouses<\/strong>. A warehouse is a place\nwhere stock is kept. Fields: <strong>Name<\/strong>, optional\n<strong>Address<\/strong>, the <strong>Branch<\/strong> it belongs to\n(shown when you have more than one branch), and <strong>Low-stock\nthreshold<\/strong>.<\/p>\n<ul>\n<li><strong>Low-stock threshold<\/strong>: a product is flagged low (on\nthe dashboard and the stock-on-hand report), and an alert e-mail is\nsent, when this warehouse's stock of it drops below the number. Leave it\nblank to use the store-wide default (set under Inventory settings).<\/li>\n<li>Your primary warehouse cannot be deactivated.<\/li>\n<li>A warehouse can have <strong>Locations<\/strong>: shelves, bins, a\nreceiving area. Each location has a type that drives behaviour:<\/li>\n<\/ul>\n<div class=\"tablewrap\"><table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Type<\/th>\n<th>Purpose<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>Receiving<\/strong><\/td>\n<td>Every purchase or receipt lands on the warehouse's one Receiving\nlocation.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Sales<\/strong><\/td>\n<td>A sale or return targets a Sales location. Every warehouse always\nhas at least one active.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Storage<\/strong><\/td>\n<td>A plain holding area.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Damaged<\/strong><\/td>\n<td>Stock is tracked but never counted as sellable.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>A location's type cannot be changed after it is created. A register\ncan be pinned to one specific Sales location (chapter 8), and stock\ntransfers can move stock directly between any two locations.<\/p>\n<h2 id=\"apps-efris\">Apps (EFRIS)<\/h2>\n<p><strong>Settings &gt; Apps<\/strong> lists integrations such as the\nEFRIS (tax authority) connection for Uganda, Rwanda and Chad. Open an\napp and fill in its settings. Sales sent to EFRIS keep their own fiscal\nQR code on the receipt.<\/p>\n", "text": " This chapter covers the shared settings that every module uses. All are under Settings unless stated. Business details Settings > Business details holds the name, address, phone, e-mail and Tax ID of the business, and its logo . These print on receipts, invoices, quotations, statements and e-mails, and the business name is included in module requests to NIWE. Fill it in before you issue the first document. System settings Settings > System settings (press Save at the bottom; System settings saved confirms): Setting Notes Currency Pick the currency. The Currency symbol is filled in from it; override it if you would rather show a code (for example \"UGX\"). Business language English or Français . This is the language everyone sees until they pick their own with the language selector on the top bar or the sign-in page. It is set for you when
