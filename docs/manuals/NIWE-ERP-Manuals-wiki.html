 you choose the Chad chart of accounts (Français) and stays English for Rwanda, but only while it has not been changed. From version 1.26 it also decides the language of printed documents (PDFs), of the e-mails the system sends and of the messages returned by the server, so a customer receives an invoice or a reminder in the language of your business, whatever language the person who sent it uses on screen. A change in Settings reaches the papers and e-mails within seconds. Time zone Used for shift times, scheduled reports and daily jobs. Date format How dates show on screen and documents. Max discount (%) The highest discount percentage allowed on any single sale line, store-wide. Someone with the Override the store-wide discount cap permission can exceed it. Discount Off : no discount field on quotations, sale orders, invoices, purchase orders and bills. Per line : each line has its own discount. Global : one discount for the whole document. Only one mode applies at a time, store-wide. The POS terminal's own discount is separate and always available (subject to the till rules in chapter 8). Note: If you choose the Rwanda or Chad chart of accounts while the currency is still the untouched default, the currency is set to RWF or XAF for you. In the same way the business language becomes Français for the Chad chart while it is still the untouched English default. Taxes Settings > Taxes lists your tax rates (Code, Name, Rate, Pricing, Status). Press New tax rate to add one. Pricing is either Tax-inclusive (the price already contains the tax) or Tax added on top . Each product picks its own tax rate, or none for tax-exempt goods, in Inventory > Products . Any number of rates can be active at once. Set a rate to Inactive instead of deleting it when it is no longer used; old documents keep it. Payment methods Settings > Payment methods lists the ways customers pay (Order, Code, Name, Cash-equivalent, Store credit, Status). Press New payment method to add one. Flag Cash-equivalent only for methods that should count as cash in the drawer when a till is reconciled. Everything else is treated as non-cash at shift close. Order decides the sequence of the methods on the checkout screen (lower comes first). Set it on the edit screen. Store credit marks a method that draws on a customer's credit balance. Room charge (\"Charge to room\") appears once the Hotel module is active. Common choices: Cash, Card, Mobile money, Bank transfer, Cheque, Gift card, Loyalty. Branches Inventory > Branches (or the Branches list in your menu) lists your branches. A branch owns one or more warehouses; sales, purchases and expenses are tagged with their branch so that you can report per branch. Everything recorded before branches existed belongs to the Head office (marked with a star), which cannot be deactivated. Press New branch and fill in: Code (for example KLA), Name , optional Address , Phone , Email . Receipt header (optional). Stored per branch. Tax & numbering (optional): Tax ID / TIN , EFRIS branch code , Document prefix (for example KLA- ). These are stored for each branch. Active . Warehouses and locations Inventory > Warehouses . A warehouse is a place where stock is kept. Fields: Name , optional Address , the Branch it belongs to (shown when you have more than one branch), and Low-stock threshold . Low-stock threshold : a product is flagged low (on the dashboard and the stock-on-hand report), and an alert e-mail is sent, when this warehouse's stock of it drops below the number. Leave it blank to use the store-wide default (set under Inventory settings). Your primary warehouse cannot be deactivated. A warehouse can have Locations : shelves, bins, a receiving area. Each location has a type that drives behaviour: Type Purpose Receiving Every purchase or receipt lands on the warehouse's one Receiving location. Sales A sale or return targets a Sales location. Every warehouse always has at least one active. Storage A plain holding area. Damaged Stock is tracked but never counted as sellable. A location's type cannot be changed after it is created. A register can be pinned to one specific Sales location (chapter 8), and stock transfers can move stock directly between any two locations. Apps (EFRIS) Settings > Apps lists integrations such as the EFRIS (tax authority) connection for Uganda, Rwanda and Chad. Open an app and fill in its settings. Sales sent to EFRIS keep their own fiscal QR code on the receipt. "}, {"id": "admin-6-accounting-set-up", "manual": "admin", "n": 6, "title": "Accounting set-up", "html": "\n<p>Accounting is a core module. Every sale, purchase, expense, payroll\nrun, asset and stock movement posts to it, so it is worth setting up\ncarefully before real transactions begin.<\/p>\n<h2 id=\"choosing-the-chart-of-accounts\">Choosing the chart of\naccounts<\/h2>\n<p>The first time Accounting is used, a short wizard (the\nchart-of-accounts country screen) asks which standard chart to start\nfrom. The chart sets the account names and numbers and, for Rwanda (RWF)\nand Chad (XAF), the currency. Choose the chart that matches your country\nand accountant. After the wizard, <strong>Accounting &gt; Chart of\naccounts<\/strong> lets you add, rename and deactivate accounts.<\/p>\n<div class=\"callout tip\">\n<p><strong>Tip:<\/strong> Agree the chart with your accountant before the\nfirst posting. Accounts that already have postings cannot simply be\ndeleted.<\/p>\n<\/div>\n<h2 id=\"accounts-the-online-store-needs\">Accounts the Online Store\nneeds<\/h2>\n<p>When the Online Store is used, these accounts are added to an\nexisting chart by themselves, a few seconds after the program starts\n(<strong>backfill<\/strong>): Online Customer Deposits, a clearing\naccount and a wallet or bank account for MTN Mobile Money, Airtel Money\nand Card, Cash with Drivers, Delivery Income, Sales Discounts Given,\nLoyalty Points Liability and Payment Provider Fees. Chapter 25 of the\nUser Manual (Online Store: payments, accounting and reports) lists their\ncodes in the Rwanda and Chad charts. Do not delete or reuse them. After\nan upgrade, open <strong>Accounting &gt; Chart of accounts<\/strong> once\nand check that they are there.<\/p>\n<p>For each payment provider the business uses, open <strong>Online\nStore &gt; Online payments &gt; Accounts by provider<\/strong> and make\nsure it has <strong>its own clearing account<\/strong> and the\n<strong>wallet or bank account<\/strong> its payouts arrive in (create a\nnew one on the spot if the business has a separate physical account). A\nclearing account belongs to one provider and cannot be changed while the\nprovider still owes money on it, so decide this before the first real\npayment. Before opening the shop, post the <strong>opening\nbalances<\/strong> of these accounts (what each provider owes at the\ncut-over date and the balance of each wallet), and, if the shop already\nhad loyalty points customers, one opening entry for the points they hold\n(Dr Customer Rewards Expense, Cr Loyalty Points Liability).<\/p>\n<h2 id=\"cost-centers\">Cost centers<\/h2>\n<p><strong>Accounting &gt; Cost centers<\/strong> are optional tags (a\ndepartment, a project, a branch) that expenses, bills and journal lines\ncan carry, so that you can report cost per center. Create them before\nyou start entering expenses if you want per-center budgets.<\/p>\n<h2 id=\"journal-entries\">Journal entries<\/h2>\n<p><strong>Accounting &gt; Journal entries<\/strong> is for manual\npostings: accruals, corrections, opening entries. Most entries are\nposted automatically by the modules; manual journals should be rare and\ncarry a clear description.<\/p>\n<h2 id=\"controls\">Controls<\/h2>\n<p><strong>Accounting &gt; Controls<\/strong> holds the period controls\nan accountant uses:<\/p>\n<ul>\n<li><strong>Close books<\/strong>: lock a period so that nothing can be\nposted into it any more. Use it after month-end or year-end review.<\/li>\n<li><strong>Bank reconciliation<\/strong>: match the bank statement\nagainst the ledger. The screen shows at most the latest 2,000 ledger\nlines.<\/li>\n<li><strong>Ledger opening balances<\/strong>: enter the opening balance\nof each account when you start using the system part-way through a\nfinancial year.<\/li>\n<\/ul>\n<h2 id=\"opening-balances-starting-on-a-running-business\">Opening\nbalances (starting on a running business)<\/h2>\n<ol type=\"1\">\n<li>Decide a cut-over date and close the old system for that date.<\/li>\n<li>Import <strong>opening stock<\/strong> (Inventory) and\n<strong>customer and supplier balances<\/strong> with the importers in\n<strong>Settings &gt; Backup &amp; Data<\/strong> (chapter 10). Customer\nand supplier opening balances become real <code>OB-<\/code> invoices and\nbills, so they age and can be collected and paid like any other.<\/li>\n<li>Enter <strong>ledger opening balances<\/strong> under Accounting &gt;\nControls for the accounts that are not covered by the importers (bank,\nequity, fixed assets and similar).<\/li>\n<li>Check the trial balance against your old system before the first\nlive day.<\/li>\n<\/ol>\n<h2 id=\"incomes\">Incomes<\/h2>\n<p><strong>Accounting &gt; Incomes<\/strong> records money received that\nis not a sale (interest, grants). <strong>Expenses<\/strong> have their\nown module with approval rules, VAT handling and budgets, described in\nthe User Manual.<\/p>\n<h2 id=\"year-end\">Year-end<\/h2>\n<p>At year-end: review the reports, post any accruals and depreciation\n(assets depreciate monthly), use <strong>Close books<\/strong> for the\nclosed period, and take a <strong>Year-end archive<\/strong> export\n(chapter 10).<\/p>\n", "text": " Accounting is a core module. Every sale, purchase, expense, payroll run, asset and stock movement posts to it, so it is worth setting up carefully before real transactions begin. Choosing the chart of accounts The first time Accounting is used, a short wizard (the chart-of-accounts country screen) asks which standard chart to start from. The chart sets the account names and numbers and, for Rwanda (RWF) and Chad (XAF), the currency. Choose the chart that matches your country and accountant. After the wizard, Accounting > Chart of accounts lets you add, rename and deactivate accounts. Tip: Agree the chart with your accountant before the first posting. Accounts that already have postings cannot simply be deleted. Accounts the Online Store needs When the Online Store is used, these accounts are added to an existing chart by themselves, a few seconds after the program starts ( backfill ): Online Customer Deposits, a clearing account and a wallet or bank account for MTN Mobile Money, Airtel Money and Card, Cash with Drivers, Delivery Income, Sales Discounts Given, Loyalty Points Liability and Payment Provider Fees. Chapter 25 of the User Manual (Online Store: payments, accounting and reports) lists their codes in the Rwanda and Chad charts. Do not delete or reuse them. After an upgrade, open Accounting > Chart of accounts once and check that they are there. For each payment provider the business uses, open Online Store > Online payments > Accounts by provider and make sure it has its own clearing account and the wallet or bank account its payouts arrive in (create a new one on the spot if the business has a separate physical account). A clearing account belongs to one provider and cannot be changed while the provider still owes money on it, so decide this before the first real payment. Before opening the shop, post the opening balances of these accounts (what each provider owes at the cut-over date and the balance of each wallet), and, if the shop already had loyalty points customers, one opening entry for the points they hold (Dr Customer Rewards Expense, Cr Loyalty Points Liability). Cost centers Accounting > Cost centers are optional tags (a department, a project, a branch) that expenses, bills and journal lines can carry, so that you can report cost per center. Create them before you start entering expenses if you want per-center budgets. Journal entries Accounting > Journal entries is for manual postings: accruals, corrections, opening entries. Most entries are posted automatically by the modules; manual journals should be rare and carry a clear description. Controls Accounting > Controls holds the period controls an accountant uses: Close books : lock a period so that nothing can be posted into it any more. Use it after month-end or year-end review. Bank reconciliation : match the bank statement against the ledger. The screen shows at most the latest 2,000 ledger lines. Ledger opening balances : enter the opening balance of each account when you start using the system part-way through a financial year. Opening balances (starting on a running business) Decide a cut-over date and close the old system for that date. Import opening stock (Inventory) and customer and supplier balances with the importers in Settings > Backup & Data (chapter 10). Customer and supplier opening balances become real OB- invoices and bills, so they age and can be collected and paid like any other. Enter ledger opening balances under Accounting > Controls for the accounts that are not covered by the importers (bank, equity, fixed assets and similar). Check the trial balance against your old system before the first live day. Incomes Accounting > Incomes records money received that is not a sale (interest, grants). Expenses have their own module with approval rules, VAT handling and budgets, described in the User Manual. Year-end At year-end: review the reports, post any accruals and depreciation (assets depreciate monthly), use Close books for the closed period, and take a Year-end archive export (chapter 10). "}, {"id": "admin-7-module-settings", "manual": "admin", "n": 7, "title": "Module settings", "html": "\n<p>Every module that needs choices keeps them on its own\n<strong>Settings<\/strong> page, at the bottom of that module's menu. All\nof these pages are <strong>Admin only<\/strong>. This chapter lists them,\nin the order of the menu, and explains the choices that matter. Press\n<strong>Save<\/strong> on each page; most show <em>Saved<\/em> when\ndone.<\/p>\n<div class=\"callout tip\">\n<p><strong>Tip:<\/strong> Set a module up <em>before<\/em> staff start\nusing it. Some settings (for example Help Desk deadlines) only apply to\nrecords created after you switch them on.<\/p>\n<\/div>\n<h2 id=\"sales-settings-sales-settings\">Sales settings (Sales &gt;\nSettings)<\/h2>\n<ul>\n<li><strong>Features<\/strong>: switch on only what you use:\n<strong>Promotions<\/strong> (discounts, buy-X-get-Y, coupons),\n<strong>Gift cards<\/strong>, <strong>Loyalty points<\/strong> (the\nearning and spending rules are set on the Loyalty page). When a feature\nis off, its menu entries and till parts are hidden and the server\nrefuses to use it. What was already saved is kept and works again when\nyou switch it back on.<\/li>\n<li><strong>Invoice receiver emails<\/strong>: one address per line.\nWhenever an invoice is issued, a PDF copy is e-mailed to the customer's\nown address and to everyone on this list. It is sent only if e-mail is\nset up (chapter 9); a failed send never blocks or undoes the\ninvoice.<\/li>\n<\/ul>\n<h2 id=\"pos-settings-pos-pos-settings\">POS settings (POS &gt; POS\nsettings)<\/h2>\n<p>The rules the till enforces. They are the main control against loss\nat the counter.<\/p>\n<div class=\"tablewrap\"><table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Group<\/th>\n<th>Setting<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>Cash at the till<\/strong><\/td>\n<td>A closing difference up to a set amount is accepted without comment;\na bigger one needs a note saying why. Closing a shift needs the notes\nand coins counted (option). A paid-out from the drawer above an amount\nneeds a manager's PIN (0 = no limit). Remind the cashier to drop cash\ninto the safe when the drawer holds more than an amount (0 = no\nreminder).<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Voids and returns<\/strong><\/td>\n<td>Voiding a sale needs a manager (their sign-in or PIN). A sale can be\nvoided only while its shift is open (afterwards it is a return). A\nreturn needs a reason. Returns of sales older than a number of days need\na manager (0 = no limit). A refund above an amount needs a manager (0 =\nno limit). The reasons offered for a return (separated by commas).<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Discounts and prices at the till<\/strong><\/td>\n<td>A cashier may give a discount up to a percent alone; above it a\nmanager approves (0 = every discount needs a manager). A discount needs\na reason. A manager may change a price at the till. Refuse a price below\nthe item's cost. The reasons offered for a discount.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Receipts<\/strong><\/td>\n<td>Paper: 80 mm or 58 mm thermal roll. Extra lines under the business\ndetails (opening hours, phone, VAT note). Text at the bottom of every\nreceipt. Print the business logo. Print a QR code of the invoice number\n(sales sent to EFRIS keep their own QR code).<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>The first printing of a receipt is the original; every later printing\nis marked <strong>COPY 1, COPY 2...<\/strong> and listed in <strong>Voids\n&amp; returns<\/strong>. \"A manager\" means an Admin, or a person with the\n<em>Approve voids and returns / price changes / big paid-outs<\/em>\npermissions from chapter 4.<\/p>\n<h2 id=\"inventory-settings-inventory-inventory-settings\">Inventory\nsettings (Inventory &gt; Inventory settings)<\/h2>\n<ul>\n<li><strong>Allow negative stock<\/strong> (default on): a sale or manual\nadjustment may take stock below zero. Untick it to make checkout refuse\na sale that would oversell and Stock adjustments refuse a correction\nthat would go negative.<\/li>\n<li><strong>Product packaging &amp; breakdown<\/strong>: lets you break\none product into smaller sellable units (a bottle into shots, a case\ninto bottles). Off by default; packaging rules can be configured but a\nbreakdown is refused until this is on.<\/li>\n<li><strong>Multi-warehouse<\/strong>: off by default, the store stays on\none warehouse (\"Main\"). When on, you can create further warehouses, but\nno sale may complete against Main any more: every register must be\nassigned a different warehouse (<strong>POS &gt; Registers &amp;\nTerminal<\/strong>) before it can ring a sale. Purchases always land on\nMain's default location.<\/li>\n<li><strong>Costing method<\/strong>: <em>Weighted average<\/em>\n(recommended), <em>Last purchase cost<\/em>, or <em>Manual<\/em> (never\nchange cost automatically). Landed cost on receiving needs weighted\naverage or last purchase.<\/li>\n<li><strong>Daily stock jobs<\/strong>: <em>Email a daily low-stock\ndigest<\/em> (one e-mail a day to the notifications address, nothing on a\nday when nothing is low); <em>Draft purchase requisitions\nautomatically<\/em> (each day one DRAFT requisition for products at or\nbelow their reorder level; it never submits or approves, and skips\nproducts already on an open requisition); <em>Run from<\/em> (store\ntime); and a <em>Run now<\/em> button that uses the saved settings.<\/li>\n<li><strong>Restaurant kitchen location<\/strong>: where restaurant\norders and wastage take their stock from (shown when the store has more\nthan one location).<\/li>\n<\/ul>\n<h2 id=\"expenses-settings-expenses-settings\">Expenses settings (Expenses\n&gt; Settings)<\/h2>\n<ul>\n<li><strong>Approval limit<\/strong>: expenses above this amount can only\nbe approved by an Admin or someone with <em>Approve large expenses<\/em>.\n0 = no limit.<\/li>\n<li><strong>Nobody approves, rejects or voids an expense they entered\nthemselves<\/strong> (option).<\/li>\n<li><strong>Block approval when it would go over the monthly\nbudget<\/strong>: an Admin can still approve with an override, which is\nwritten to the expense history.<\/li>\n<li><strong>Days until a bill is due<\/strong> (used when an unpaid bill\nis entered without a due date) and <strong>Warn this many days before\nthe due date<\/strong>.<\/li>\n<\/ul>\n<h2 id=\"assets-settings-assets-settings\">Assets settings (Assets &gt;\nSettings)<\/h2>\n<ul>\n<li><strong>Warn before a warranty or insurance ends\n(days)<\/strong>.<\/li>\n<li><strong>\"Fully depreciated soon\" means within\n(months)<\/strong>.<\/li>\n<li><strong>Disposal approval limit (book value)<\/strong>: disposing of\nan asset whose book value is above this needs an Admin or a user with\n<em>Approve large asset disposals<\/em>. 0 = no limit.<\/li>\n<\/ul>\n<h2 id=\"installments-settings-installments-settings\">Installments\nsettings (Installments &gt; Settings)<\/h2>\n<ul>\n<li><strong>Email reminders<\/strong>: send reminders to customers (needs\ne-mail), how many days before a due date, and how often to chase overdue\ninstalments.<\/li>\n<li><strong>Starting values for a new plan<\/strong>: whole amounts (no\ncents) for currencies such as RWF and XAF, yearly interest %, grace\ndays, late fee (fixed) and late fee (% of unpaid).<\/li>\n<li><strong>Early payoff and default<\/strong>: the percent of interest\nwaived on an early payoff (changeable per payoff); mark a plan defaulted\nafter this many days overdue (0 = never automatically).<\/li>\n<li><strong>Agreement wording<\/strong>: one term per line, printed under\n\"Terms\" on the agreement PDF. Leave empty for the standard wording; have\nyour own text checked by a lawyer.<\/li>\n<\/ul>\n<h2\nid=\"subscriptions-job-settings-subscriptions-job-settings\">Subscriptions\njob settings (Subscriptions &gt; Job settings)<\/h2>\n<ul>\n<li><strong>Run from (store time)<\/strong>: the daily job time, using\nthe time zone in System settings. If the server was off then, it runs\nwhen next up the same day.<\/li>\n<li><strong>Bill due subscriptions automatically<\/strong>: each active\nsubscription whose next billing date has arrived gets its invoice. Turn\noff to bill only by hand with <strong>Bill now<\/strong>.<\/li>\n<li><strong>Email upcoming-billing reminders<\/strong>: how many days\nbefore, to the customer and/or the notifications e-mail.<\/li>\n<li><strong>When an invoice stays unpaid<\/strong>: do nothing, pause the\nsubscription, or cancel it after a number of days past the invoice date.\nPausing can be undone with <strong>Resume<\/strong>; cancelling\ncannot.<\/li>\n<li><strong>Email a daily results digest<\/strong> to the notifications\ne-mail (not sent on days when nothing happened).<\/li>\n<li><strong>Overdue reminders and catching up<\/strong>: e-mail the\ncustomer when a subscription invoice is overdue (first reminder after n\ndays, then every n days, at most n reminders), and <strong>Missed\nbilling cycles to bill in one run<\/strong> (1 = one per day; a higher\nnumber catches up at once, each with its own period).<\/li>\n<li><strong>Run now<\/strong> uses the saved settings and counts as\ntoday's run.<\/li>\n<\/ul>\n<h2 id=\"help-desk-settings-help-desk-settings\">Help Desk settings (Help\nDesk &gt; Settings)<\/h2>\n<ul>\n<li><strong>Public website<\/strong>: when on, anyone can send a support\nrequest and follow a ticket at <code>/helpdesk<\/code> on your site\nwithout signing in; options let customers reply and attach files and\nrate the help. Switch it off to close the page.<\/li>\n<li><strong>Notification emails<\/strong>: one address per line; they get\nan e-mail for each new ticket, for customer replies to an unassigned\nticket, and for missed deadlines.<\/li>\n<li><strong>E-mail each reply to the customer<\/strong> when the ticket\nhas an e-mail address.<\/li>\n<li><strong>Deadlines (SLA)<\/strong>: give every new ticket a\nfirst-reply and a resolution deadline by priority (Urgent, High, Medium,\nLow), counted in calendar hours from creation; time <em>waiting for the\ncustomer<\/em> does not count. Only tickets created after you switch this\non get deadlines. Options: internal tickets too; warning e-mail before\nthe deadline and alert when missed; <strong>Close a resolved ticket\nautomatically after (days)<\/strong>.<\/li>\n<\/ul>\n<h2 id=\"time-tracking-settings-time-tracking-settings\">Time tracking\nsettings (Time tracking &gt; Settings)<\/h2>\n<ul>\n<li>A manager must approve submitted time (switch off to approve\neverything automatically).<\/li>\n<li><strong>Round stopped timers up to<\/strong> exact minutes, 5, 6, 10,\n15, 30 minutes or 1 hour.<\/li>\n<li><strong>Default hourly rate<\/strong>, <strong>most hours one person\ncan log in a day<\/strong>, <strong>working hours in a day<\/strong> (for\nutilisation).<\/li>\n<li><strong>Keeping timesheets tidy<\/strong>: stop a timer running more\nthan n hours (kept as a draft for the person to check; 0 = never);\n<strong>Lock time up to and including<\/strong> a date so approved and\ninvoiced weeks stay as they are; a weekly reminder e-mail to people who\nhave not handed in last week's time; a warning when a project has used\nn% of its budget (recorded in the audit log).<\/li>\n<li><strong>Service product billed time is invoiced under<\/strong>: the\nproduct named \"Professional services (time)\" can be created\nautomatically; its tax rate and accounting follow the product.<\/li>\n<\/ul>\n<h2 id=\"booking-settings-booking-settings\">Booking settings (Booking\n&gt; Settings)<\/h2>\n<ul>\n<li><strong>Opening hours<\/strong>: opens, closes, time between start\ntimes, working days.<\/li>\n<li><strong>Booking rules<\/strong>: earliest booking (minutes ahead),\nfurthest ahead (days), hold for payment (minutes), online cancel until\n(hours before).<\/li>\n<li><strong>Reminders and moving a booking<\/strong>: e-mail the guest a\nreminder (with a calendar file) n hours before; guests may move their\nown booking on the public page.<\/li>\n<li><strong>Public website<\/strong>: guests pick a service and a time\nthemselves at <code>/book<\/code>. Also confirmation e-mail, bookings per\nphone number per day, page title, intro text, and how to pay (shown to\nguests who owe a deposit).<\/li>\n<\/ul>\n<h2 id=\"work-orders-settings-work-orders\">Work orders settings (Work\norders)<\/h2>\n<ul>\n<li><strong>New customer jobs need the customer's approval<\/strong>:\nwork cannot start until an estimate has been sent and approved (can be\nswitched off for a single job).<\/li>\n<li><strong>E-mail the customer when a job is completed<\/strong>: a\ncompletion note (PDF) is sent. If the e-mail fails, the job is still\ncompleted.<\/li>\n<\/ul>\n<h2 id=\"attendance-and-leave-settings-hr-attendance-settings\">Attendance\nand leave settings (HR &gt; Attendance &gt; Settings)<\/h2>\n<ul>\n<li><strong>Working time<\/strong>: work starts at, grace period\n(minutes), hours in a normal day, overtime pays (multiple of normal\nhourly pay), working days. Clocking in after the start time plus grace\ncounts as late.<\/li>\n<li><strong>Leave types<\/strong>: name, days a year, whether days become\navailable all at the start of the year or are earned month by month,\ncarry-over (max days), paid or unpaid, paid out when leaving.<\/li>\n<li><strong>Public holidays<\/strong>: add the holidays of each year;\nthey are not counted as leave or working days.<\/li>\n<\/ul>\n<h2 id=\"hotel-settings-hotel-settings\">Hotel settings (Hotel &gt;\nSettings)<\/h2>\n<ul>\n<li><strong>How room revenue reaches Accounting<\/strong>: <em>Every\nnight<\/em> (posted by the night audit; best for most hotels), <em>At\ncheck-out<\/em>, or <em>At booking and check-out<\/em> (booked value is\nheld as unearned revenue until check-out). The mode can only be changed\nwhen no booking is open.<\/li>\n<li><strong>Tax on rooms and services (%)<\/strong>, <strong>check-in\ntime<\/strong>, <strong>check-out time<\/strong>, <strong>night audit runs\nat<\/strong>.<\/li>\n<li><strong>Cancellation and fee policy<\/strong>: free cancellation\nuntil n days before arrival; late-cancellation, no-show, early-departure\nfees (in nights); late check-out fee. The front desk can waive any fee.\nSee also <strong>Online booking<\/strong> settings for the hotel's public\nbooking page.<\/li>\n<\/ul>\n<h2 id=\"restaurant-settings-restaurant-settings\">Restaurant settings\n(Restaurant &gt; Settings)<\/h2>\n<p>Service charge by order type (dine-in, takeaway, delivery) and VAT on\nit; the most a waiter may discount without a manager; tips (quick-choice\npercents); quick kitchen notes; usual preparation time and amber/red\nthresholds for kitchen tickets; rounding of the bill; and table bookings\nfrom the public site at <code>/reserve<\/code>.<\/p>\n<h2 id=\"online-store-settings-online-store-shop-settings\">Online Store\nsettings (Online Store &gt; Shop settings)<\/h2>\n<p>The Online Store needs the <strong>Online Store<\/strong> module in\nthe licence and activated. Its pages are <code>/shop<\/code> (the public\nshop, also the first page of the site for a visitor who is not signed\nin), <code>/shop/order/&lt;code&gt;<\/code> (where a customer follows an\norder), <code>/shop/account<\/code> (the customer's account),\n<code>/shop/info/...<\/code> (information pages),\n<code>/driver/&lt;secret&gt;<\/code> (a driver's private page) and a few\nsmall pages for the newsletter and carts; staff use the <strong>Online\nStore<\/strong> group of the menu (<strong>Online orders<\/strong>,\n<strong>My deliveries<\/strong>, <strong>Driver cash<\/strong>,\n<strong>Online payments<\/strong>, <strong>Returns<\/strong>,\n<strong>Coupons<\/strong>, <strong>Reviews<\/strong>,\n<strong>Messages<\/strong>, <strong>Waiting customers<\/strong>,\n<strong>Shop pages<\/strong>, <strong>Newsletter<\/strong>, <strong>Send a\nnewsletter<\/strong>, <strong>Abandoned carts<\/strong>, <strong>Loyalty\npoints<\/strong>, <strong>Advertising<\/strong>, <strong>Sales\nreports<\/strong>, <strong>Text messages<\/strong>, <strong>Shop\nsettings<\/strong>). Everything starts closed: the public pages answer\n\"not available\" until the module is activated and <strong>Shop is open\nto the public<\/strong> is ticked. The User Manual (Online Store,\nchapters 23 to 25) describes the screens for the shop staff; this\nsection is for the person who sets it up.<\/p>\n<p>Set up, in this order:<\/p>\n<ol type=\"1\">\n<li><strong>Products on the shop<\/strong>: only products added here are\nshown or sold. The picture is the product's own; the price is the online\nprice if set, otherwise the price list of the shop and the best\npromotion, otherwise the normal price. Prices are shown with tax\nincluded. The ticks <strong>Featured<\/strong>, <strong>Best\nseller<\/strong>, <strong>Offer<\/strong> and <strong>New<\/strong> choose\nthe products of the rows on the first page. Products with variants\nappear as one product with options.<\/li>\n<li><strong>Delivery areas<\/strong> with a fee, an optional minimum\norder, a tax (included in the fee) and an estimate in days each. With\nnone, the shop delivers anywhere for free.<\/li>\n<li><strong>Service product for the delivery fee<\/strong>: a\n<em>service<\/em> product (no stock) that carries the delivery fee on the\nsale order and the invoice. Without it, an order that has a delivery fee\ncannot be accepted. Give it a tax that is <strong>inclusive<\/strong>, or\nnone, and choose each area's own tax, so that the invoice total, and the\ncash a driver must hand in, match what the customer saw.<\/li>\n<li>The shop switches and limits: <strong>Delivery<\/strong>,\n<strong>Pick-up<\/strong>, <strong>Pay cash on delivery or at\npick-up<\/strong>, <strong>Minimum order<\/strong>, <strong>Free delivery\nfrom<\/strong>, <strong>Orders waiting per phone<\/strong> and\n<strong>Orders per connection per hour<\/strong>. <strong>Send new-order\ne-mails to<\/strong> and <strong>Alert by e-mail when an order waits this\nmany minutes<\/strong> tell the shop who to warn. <strong>WhatsApp number\nof the shop<\/strong> and the <strong>Contact e-mail<\/strong> appear on\nthe contact page.<\/li>\n<li><strong>Front page<\/strong>: the announcement, banner texts and\npictures, shop colour, footer text and links (see the User Manual).\nBanner pictures are stored in the database: up to 8, so a backup is\nslightly larger.<\/li>\n<li><strong>Shop pages<\/strong>: read and adapt the four information\npages (Terms, Privacy, Returns, Delivery). They are a starter text, not\nlegal advice.<\/li>\n<li><strong>Branch the shop sells for<\/strong> (only with more than one\nbranch).<\/li>\n<li><strong>Drivers<\/strong> and <strong>Delivery times<\/strong>, if the\nshop delivers.<\/li>\n<li><strong>Accounts by provider<\/strong> (Online Store &gt; Online\npayments), once the providers are switched on.<\/li>\n<\/ol>\n<h3 id=\"stock-the-shop-sells\">Stock the shop sells<\/h3>\n<p>The shop has no stock of its own. It sells what the warehouses hold\nin <strong>sellable locations<\/strong> (with several warehouses: Sales\nlocations outside the Main warehouse; choose one in <strong>Stock the\nshop sells from<\/strong>, or <em>Automatic<\/em>), minus the quantities\nreserved on confirmed sales orders, minus the units\n<strong>held<\/strong> by shop orders nobody has answered yet, minus the\nproduct's <strong>buffer<\/strong>, minus the <strong>Share kept for the\ntill (%)<\/strong>. Expired batches are never counted and, with\n<strong>Do not sell goods with fewer days left than<\/strong>, batches\nclose to their expiry are left out. Cartons that can be opened\n(breakdown on in Inventory) count as units. Under each product in\n<strong>Products on the shop<\/strong> the screen shows every figure. If\nproducts say <em>Sold out<\/em> although you have stock, see <em>The\nonline shop<\/em> in chapter 14.<\/p>\n<ul>\n<li><strong>Release unanswered orders after (hours)<\/strong> (default\n24, 0 = never) cancels an order waiting for a payment, or a cash order\nnobody accepted, so its stock is free again. An order paid online is\nnever cancelled this way. A job checks every 10 minutes.<\/li>\n<li><strong>Price list used by the shop<\/strong> and <strong>Apply\nnow<\/strong>: online prices from Sales (promotions that need a coupon,\ngroup, limit, minimum, \"buy X get Y\" or that cover the whole cart are\nnot applied online). Prices are recalculated every 2 minutes.<\/li>\n<li>A product can be <strong>sold by weight or length<\/strong> (decimals\nfrom 0.1 to 100).<\/li>\n<\/ul>\n<p>Accepting an order creates a confirmed sale order for the customer\n(found by phone number, or created), which holds the stock. Completing\nit fulfils the sale order from the shop's Sales location (or the chosen\none), issues the invoice and records the payment: cash for a cash order,\nor the online payment already received. Staff need the\n<strong>Operations<\/strong> area to answer orders. If completing an\norder is refused, for example for lack of stock, staff see the real\nreason; drivers and customers see \"please call the shop\" and the reason\nis in the order's history.<\/p>\n<h3 id=\"customer-accounts\">Customer accounts<\/h3>\n<p>Tick <strong>Customers can sign in to see their orders<\/strong>. A\ncustomer types an e-mail address and receives a one-time code (valid 10\nminutes, 5 tries); there are no passwords. This needs the <strong>e-mail\nsettings<\/strong> of the business (chapter 9), or text messages for a\ncode sent to a saved phone number.<\/p>\n<h3 id=\"delivery-times-and-drivers\">Delivery times and drivers<\/h3>\n<p><strong>Delivery times<\/strong> is switched off until you add windows\n(from and to, orders per day, weekdays), the switches (customers choose\na time; they must choose one; days ahead; notice in hours) and the days\nwithout deliveries. A delivery window is checked again on the server\nwhen the order is placed.<\/p>\n<p><strong>Drivers<\/strong>: a driver is a list entry (name, phone,\nnote, active). <strong>Give a link<\/strong> makes a private address and\na 4-digit PIN for him (the PIN is shown once and stored scrambled);\n<strong>Show link<\/strong>, <strong>New PIN<\/strong> and <strong>Switch\noff<\/strong> manage it. For the link to be complete\n<strong><code>app.frontend-url<\/code><\/strong> must be the public\naddress, and the site must be served over <strong>HTTPS<\/strong>. Five\nwrong PINs lock the link for 30 minutes; the phone keeps a session for\nup to 14 hours. A driver sees only his own orders and returns and his\nown cash. The code that completes a delivery (4 digits) is sent to the\ncustomer by e-mail and text and is never shown to staff or drivers; five\nwrong tries block it for 30 minutes.<\/p>\n<h3 id=\"online-payments\">Online payments<\/h3>\n<p>In <strong>Online payments<\/strong> tick every\n<strong>provider<\/strong> you want to offer, tick <strong>Customers can\npay online<\/strong>, and set <strong>Minutes the customer has to\npay<\/strong>. Each ticked provider must be switched on and keyed on the\nserver, otherwise saving is refused with a clear message; at least one\nmust stay ticked while online payments are on. When more than one\nprovider can take the customer's way to pay, checkout shows a\n<strong>Pay with<\/strong> row of buttons. A customer who pays online has\nan order that reaches the shop only once the payment is confirmed; an\norder that is never paid is cancelled. Set the <strong>currency of the\nbusiness<\/strong> (Business details) to the currency you charge in. The\nproviders are:<\/p>\n<ul>\n<li><strong>Simulated provider<\/strong> (for tests only; it exists when\nthe server is started with\n<code>app.online-store.payments.simulated.enabled=true<\/code> and a\n<code>...simulated.secret<\/code>). The customer lands on a test page\nwith <strong>Pay<\/strong> and <strong>Decline<\/strong>. Never use it\nwith real customers.<\/li>\n<li><strong>MTN Mobile Money (MoMo)<\/strong> for Rwanda. The customer\ntypes an MTN number and approves on the phone. It stays\n<strong>unavailable<\/strong> until it is switched on and keyed in the\nserver's environment:\n<code>app.online-store.payments.mtn.enabled=true<\/code>,\n<code>...subscription-key<\/code>, <code>...api-user<\/code>,\n<code>...api-key<\/code>, <code>...base-url<\/code> (https only) and\n<code>...target-environment<\/code> (<code>sandbox<\/code> while testing).\nThe step-by-step guide to get sandbox keys, test, and go live is\n<code>docs/online-store-mtn-momo.md<\/code> in the program's files. The\nsandbox accepts only the currency EUR.<\/li>\n<li><strong>Airtel Money<\/strong> for Rwanda. The customer types an\nAirtel number and approves on the phone. Keys:\n<code>app.online-store.payments.airtel.enabled=true<\/code>,\n<code>...client-id<\/code>, <code>...client-secret<\/code>,\n<code>...base-url<\/code> (https only) and <code>...country<\/code>\n(<code>RW<\/code>). Airtel's refund gives back a whole payment and cannot\ndo a part, so <strong>refunds are done by hand<\/strong>: the screen\ntells staff to refund from the Airtel Money account and record it with\n<strong>I refunded it myself<\/strong> and the Airtel reference. The\nguide is <code>docs/online-store-airtel-money.md<\/code>.<\/li>\n<\/ul>\n<p>Put the keys in the <strong>environment of the server<\/strong> or in\nthe private files\n<code>config/application-&lt;provider&gt;-production.properties<\/code>\nthat are never committed; never in a file that is copied around. The\nprogram never shows or logs them. Replace dots and dashes by underscores\nand use capitals for an environment variable\n(<code>APP_ONLINE_STORE_PAYMENTS_MTN_API_KEY<\/code>). <strong>Each\ncustomer business has its own keys<\/strong>: a provider's application is\nregistered in the business's name.<\/p>\n<div class=\"callout warning\">\n<p><strong>Warning:<\/strong> Both real providers have been tested only\nagainst imitations of their systems. Before opening the shop, do a\nsandbox test, then one small real purchase, one cancelled and refunded\norder, one part-returned order and one payout, and compare each with the\nprovider's own statement.<\/p>\n<\/div>\n<p>Give the provider the <strong>webhook address<\/strong> shown on the\nscreen:\n<code>&lt;your address&gt;/api/public/store/payments/&lt;provider code&gt;/webhook<\/code>.\nA callback is never trusted by itself: the shop asks the provider for\nthe payment's status and accepts the callback only when the provider's\nown answer agrees, and it also checks every pending payment about once a\nminute, so a lost call-back only delays the order a little. A payment\nthat does not match its order (another amount or currency, or a double\npayment) goes to <strong>review<\/strong> instead of being accepted:\nwatch <strong>Online Store &gt; Online payments<\/strong>.<\/p>\n<p><strong>Logos.<\/strong> Each provider's button shows its logo if the\nfile exists at\n<code>frontend/src/assets/payment/&lt;code in lower case&gt;.png<\/code>\n(<code>mtn_momo.png<\/code>, <code>airtel_money.png<\/code>). The MTN and\nAirtel logos are trademarks and are not shipped: put the official files\nthere and rebuild the frontend; without them the button shows the\nname.<\/p>\n<p><strong>Accounts by provider.<\/strong> In <strong>Online Store &gt;\nOnline payments &gt; Accounts by provider<\/strong> each provider gets a\n<strong>clearing account<\/strong> (what it still owes the shop) and a\n<strong>payout account<\/strong> (the wallet or bank account it pays\ninto). MTN and Airtel start with accounts the program creates; a\nprovider with none uses the shared Mobile Money or Card clearing account\nand its payouts arrive in Cash and Bank. Decide this with the accountant\nbefore the first real payment (chapter 6).<\/p>\n<p>Another provider (MOOV, ORANGE, a card gateway, IREMBO) is a small\npiece of programming for a developer;\n<code>docs/online-store-payment-providers.md<\/code> describes it. Once\nit exists it appears in the list and in Accounts by provider.<\/p>\n<h3 id=\"text-messages-sms-or-whatsapp\">Text messages (SMS or\nWhatsApp)<\/h3>\n<p>In <strong>Text messages<\/strong> choose a <strong>Text\nprovider<\/strong>, the channel (<strong>Send as<\/strong>), the\n<strong>Country code<\/strong> (250 for Rwanda; it is put in front of\nnumbers that start with 0), <strong>Most texts per day<\/strong> (default\n300; 0 = no limit) and <strong>Text the owner at<\/strong> a phone\nnumber. Nothing is sent until a provider is chosen. The program includes\na <strong>test sender<\/strong> (it sends nothing: every text is listed\nin <strong>Online Store &gt; Text messages<\/strong>) and needs a\ndeveloper to add a real provider\n(<code>docs/online-store-text-providers.md<\/code>). Order updates are\ntexted only to customers who ticked the box at checkout. The delivery,\npick-up, return and new codes are the exception: they are sent by e-mail\nand by text to the order's phone number whatever the box says. Until a\nreal company is connected the built-in sender keeps those texts as\n<em>Waiting for an SMS company<\/em> and nothing leaves the server.<\/p>\n<h3 id=\"returns\">Returns<\/h3>\n<p><strong>Customers can return goods up to this many days after the\norder is completed<\/strong> (14 by default; 0 = no returns through the\nshop). A return of a delivered order is collected by a driver, with a\n4-digit return code.<\/p>\n<h3 id=\"newsletter-and-links-in-e-mails\">Newsletter and links in\ne-mails<\/h3>\n<p>The newsletter sign-up and the sending of newsletters need the e-mail\nsettings to be working. The confirmation link in the e-mail, the\nunsubscribe links, the \"View your order\" link in every customer e-mail,\nthe driver's link, the share previews and the sitemap are built from the\nsetting <code>app.frontend-url<\/code>: <strong>set it to the public\naddress of the site<\/strong> (for example\n<code>https://shop.yourbusiness.com<\/code>, no trailing slash),\notherwise the links will point to the wrong place (the default is\n<code>http://localhost:4200<\/code>).<\/p>\n<p><strong>Sending limits.<\/strong> A newsletter started in\n<strong>Online Store &gt; Send a newsletter<\/strong> goes out in batches\nby a job that runs every minute. Two settings (properties or environment\nvariables) control the pace:\n<code>app.online-store.newsletter.batch-size<\/code> (e-mails per minute,\ndefault 25) and <code>app.online-store.newsletter.daily-limit<\/code>\n(most e-mails in any 24 hours, default 500, 0 = no limit). Set the limit\nto what your mail provider allows: when it is reached the rest waits\nuntil older e-mails are more than 24 hours old, then continues by\nitself. After five failures in a row the batch pauses and the newsletter\nshows the reason. An e-mail is marked as taken before it is handed to\nthe mail server, so a crash can lose one e-mail but never sends one\ntwice; a delivery stuck for more than 10 minutes is shown as failed\n(\"Interrupted\") and can be retried by staff once checked.<\/p>\n<p><strong>Abandoned-cart reminders.<\/strong> Switched on with the box\n<strong>Send reminders for abandoned carts<\/strong> (off by default;\nnothing is saved while it is off). A job looks every 3 minutes for carts\ndue a reminder (first one 1 hour, second one 3 days after the last\nchange) and sends at most\n<code>app.online-store.cart-reminders.batch-size<\/code> e-mails per pass\n(default 20). They use the same e-mail settings and\n<code>app.frontend-url<\/code>. A reminder that fails is tried again 30\nminutes later, three times at most. A cart is deleted after 60 days\nwithout change. The data kept is the e-mail address, the language, the\nproducts and quantities, and the reminder times.<\/p>\n<p><strong>Loyalty points.<\/strong> Switched on with <strong>Customers\nearn and spend loyalty points<\/strong> (off by default; needs\n<strong>Customer accounts<\/strong>). Two numbers: <strong>points earned\nper 100 paid for the goods<\/strong> (1 to 100, default 1) and\n<strong>points may pay at most % of the goods<\/strong> (0 to 100,\ndefault 50); one point is always worth 1 unit of the currency, and\npoints do not expire. These points are <strong>separate from the till's\nloyalty programme<\/strong> in Sales. In the books they are a liability\n(<strong>Loyalty Points Liability<\/strong>) and the discount shows as\n<strong>Sales Discounts Given<\/strong>. Changing the two numbers affects\nlater orders only.<\/p>\n<h3 id=\"link-previews-search-engines-and-the-installable-app\">Link\npreviews, search engines and the installable app<\/h3>\n<p>When a shop link is pasted in WhatsApp, Facebook, Telegram and\nsimilar apps, a card with the product picture, name and price should\nappear, and Google should be able to show price, stock and stars. Those\nprograms do not run the shop, so the web server must hand them a small\npage built by the backend. <strong>Add the nginx rule from\n<code>docs/online-store-seo.md<\/code><\/strong> (a <code>map<\/code> for\nthe crawlers' names, the <code>location<\/code> blocks for\n<code>/shop<\/code>, <code>/shop/info/...<\/code>, <code>/_seo/...<\/code>,\n<code>/sitemap.xml<\/code> and <code>/robots.txt<\/code>, using your\nbackend's address), then\n<code>nginx -t &amp;&amp; nginx -s reload<\/code>. Without it the shop\nworks as before but links show no preview. Check with\n<code>curl -A \"facebookexternalhit/1.1\" \"https://your-shop/shop?product=12\"<\/code>:\nit must return a small page with <code>og:title<\/code> and\n<code>product:price:amount<\/code>. In Google Search Console, add\n<code>sitemap.xml<\/code>.<\/p>\n<p>The site can be installed as an app (PWA) from Chrome, Edge, Android\nand iPhone Safari. This needs <strong>HTTPS<\/strong>. The app keeps only\nthe program's own files and shop pictures; nothing from\n<code>/api<\/code> is kept, so no old figure is ever shown as current. A\nnew release is picked up on the next visit; a till is never reloaded in\nthe middle of a sale.<\/p>\n<h3 id=\"behind-a-reverse-proxy\">Behind a reverse proxy<\/h3>\n<p><strong>Behind a reverse proxy<\/strong> (nginx, IIS, a cloud load\nbalancer): add <code>server.forward-headers-strategy=native<\/code> to\nthe server's settings so that the limit per connection sees each\nvisitor's own address. Without it all visitors share the proxy's address\nand the limit applies to everybody together.<\/p>\n<h2 id=\"law-firm-settings-law-firm-settings\">Law firm settings (Law firm\n&gt; Settings)<\/h2>\n<p>Practice areas and jurisdictions (one per line); \"due soon\" window;\ndefault billing basis for new matters (Hourly, Fixed fee, Retainer,\nContingency, Pro bono); daily e-mail of deadlines and tasks to each\nlawyer; new matters restricted by default; <strong>limitation date\nwarnings<\/strong> (first warning n days before, a second 3 days before,\nand one if the date has passed); and <strong>unpaid fees<\/strong>: the\nusual payment term and automatic client reminders listing late invoices\nwith a statement attached.<\/p>\n<h2 id=\"real-estate-settings-real-estate-settings\">Real Estate settings\n(Real Estate &gt; Settings)<\/h2>\n<p>Areas you work in; how long a viewing lasts; when a lead is \"quiet\";\na morning e-mail to each agent about late and due calls and quiet leads\n(agents need an e-mail address on their user account); and viewing\nreminders to the person viewing and the agent.<\/p>\n<h2\nid=\"property-management-settings-property-management-settings\">Property\nManagement settings (Property management &gt; Settings)<\/h2>\n<p>Areas; when a lease is \"ending soon\"; the day rent usually falls due;\nthe usual management fee % and VAT on it; rent invoicing (how many days\nbefore the due date, and automatically every morning); and <strong>owner\nstatements every month<\/strong> (make last month's statements\nautomatically from a chosen day, and optionally agree them and e-mail\nowners when they have no warnings). There is also a separate reminder\nand late-fee page for tenants.<\/p>\n<h2 id=\"settings-that-are-not-in-a-module\">Settings that are not in a\nmodule<\/h2>\n<p><strong>Settings &gt; System settings, Business details, Email\nsettings, Payment methods, Taxes, Scheduled reports, Apps, Backup &amp;\nData<\/strong> are covered in chapters 5, 9 and 10. The\n<strong>Loyalty<\/strong>, <strong>Promotions<\/strong>, <strong>Gift\ncards<\/strong> and <strong>Price lists<\/strong> pages are maintained by\nstaff with the Sales area and are described in the User Manual.<\/p>\n", "text": " Every module that needs choices keeps them on its own Settings page, at the bottom of that module's menu. All of these pages are Admin only . This chapter lists them, in the order of the menu, and explains the choices that matter. Press Save on each page; most show Saved when done. Tip: Set a module up before staff start using it. Some settings (for example Help Desk deadlines) only apply to records created after you switch them on. Sales settings (Sales > Settings) Features : switch on only what you use: Promotions (discounts, buy-X-get-Y, coupons), Gift cards , Loyalty points (the earning and spending rules are set on the Loyalty page). When a feature is off, its menu entries and till parts are hidden and the server refuses to use it. What was already saved is kept and works again when you switch it back on. Invoice receiver emails : one address per line. Whenever an invoice is issued, a PDF copy is e-mailed to the customer's own address and to everyone on this list. It is sent only if e-mail is set up (chapter 9); a failed send never blocks or undoes the invoice. POS settings (POS > POS settings) The rules the till enforces. They are the main control against loss at the counter. Group Setting Cash at the till A closing difference up to a set amount is accepted without comment; a bigger one needs a note saying why. Closing a shift needs the notes and coins counted (option). A paid-out from the drawer above an amount needs a manager's PIN (0 = no limit). Remind the cashier to drop cash into the safe when the drawer holds more than an amount (0 = no reminder). Voids and returns Voiding a sale needs a manager (their sign-in or PIN). A sale can be voided only while its shift is open (afterwards it is a return). A return needs a reason. Returns of sales older than a number of days need a manager (0 = no limit). A refund above an amount needs a manager (0 = no limit). The reasons offered for a return (separated by commas). Discounts and prices at the till A cashier may give a discount up to a percent alone; above it a manager approves (0 = every discount needs a manager). A discount needs a reason. A manager may change a price at the till. Refuse a price below the item's cost. The reasons offered for a discount. Receipts Paper: 80 mm or 58 mm thermal roll. Extra lines under the business details (opening hours, phone, VAT note). Text at the bottom of every receipt. Print the business logo. Print a QR code of the invoice number (sales sent to EFRIS keep their own QR code). The first printing of a receipt is the original; every later printing is marked COPY 1, COPY 2... and listed in Voids & returns . \"A manager\" means an Admin, or a person with the Approve voids and returns / price changes / big paid-outs permissions from chapter 4. Inventory settings (Inventory > Inventory settings) Allow negative stock (default on): a sale or manual adjustment may take stock below zero. Untick it to make checkout refuse a sale that would oversell and Stock adjustments refuse a correction that would go negative. Product packaging & breakdown : lets you break one product into smaller sellable units (a bottle into shots, a case into bottles). Off by default; packaging rules can be configured but a breakdown is refused until this is on. Multi-warehouse : off by default, the store stays on one warehouse (\"Main\"). When on, you can create further warehouses, but no sale may complete against Main any more: every register must be assigned a different warehouse ( POS > Registers & Terminal ) before it can ring a sale. Purchases always land on Main's default location. Costing method : Weighted average (recommended), Last purchase cost , or Manual (never change cost automatically). Landed cost on receiving needs weighted average or last purchase. Daily stock jobs : Email a daily low-stock digest (one e-mail a day to the notifications address, nothing on a day when nothing is low); Draft purchase requisitions automatically (each day one DRAFT requisition for products at or below their reorder level; it never submits or approves, and skips products already on an open requisition); Run from (store time); and a Run now button that uses the saved settings. Restaurant kitchen location : where restaurant orders and wastage take their stock from (shown when the store has more than one location). Expenses settings (Expenses > Settings) Approval limit : expenses above this amount can only be approved by an Admin or someone with Approve large expenses . 0 = no limit. Nobody approves, rejects or voids an expense they entered themselves (option). Block approval when it would go over the monthly budget : an Admin can still approve with an override, which is written to the expense history. Days until a bill is due (used when an unpaid bill is entered without a due date) and Warn this many days before the due date . Assets settings (Assets > Settings) Warn before a warranty or insurance ends (days) . \"Fully depreciated soon\" means within (months) . Disposal approval limit (book value) : disposing of an asset whose book value is above this needs an Admin or a user with Approve large asset disposals . 0 = no limit. Installments settings (Installments > Settings) Email reminders : send reminders to customers (needs e-mail), how many days before a due date, and how often to chase overdue instalments. Starting values for a new plan : whole amounts (no cents) for currencies such as RWF and XAF, yearly interest %, grace days, late fee (fixed) and late fee (% of unpaid). Early payoff and default : the percent of interest waived on an early payoff (changeable per payoff); mark a plan defaulted after this many days overdue (0 = never automatically). Agreement wording : one term per line, printed under \"Terms\" on the agreement PDF. Leave empty for the standard wording; have your own text checked by a lawyer. <h2 id=\"subscriptions-job-settings-subscriptions-job-settings\">Subscriptions job settings (Subscriptions > Job settings) Run from (store time) : the daily job time, using the time zone in System settings. If the server was off then, it runs when next up the same day. Bill due subscriptions automatically : each active subscription whose next billing date has arrived gets its invoice. Turn off to bill only by hand with Bill now . Email upcoming-billing reminders : how many days before, to the customer and/or the notifications e-mail. When an invoice stays unpaid : do nothing, pause the subscription, or cancel it after a number of days past the invoice date. Pausing can be undone with Resume ; cancelling cannot. Email a daily results digest to the notifications e-mail (not sent on days when nothing happened). Overdue reminders and catching up : e-mail the customer when a subscription invoice is overdue (first reminder after n days, then every n days, at most n reminders), and Missed billing cycles to bill in one run (1 = one per day; a higher number catches up at once, each with its own period). Run now uses the saved settings and counts as today's run. Help Desk settings (Help Desk > Settings) Public website : when on, anyone can send a support request and follow a ticket at /helpdesk on your site without signing in; options let customers reply and attach files and rate the help. Switch it off to close the page. Notification emails : one address per line; they get an e-mail for each new ticket, for customer replies to an unassigned ticket, and for missed deadlines. E-mail each reply to the customer when the ticket has an e-mail address. Deadlines (SLA) : give every new ticket a first-reply and a resolution deadline by priority (Urgent, High, Medium, Low), counted in calendar hours from creation; time waiting for the customer does not count. Only tickets created after you switch this on get deadlines. Options: internal tickets too; warning e-mail before the deadline and alert when missed; Close a resolved ticket automatically after (days) . Time tracking settings (Time tracking > Settings) A manager must approve submitted time (switch off to approve everything automatically). Round stopped timers up to exact minutes, 5, 6, 10, 15, 30 minutes or 1 hour. Default hourly rate , most hours one person can log in a day , working hours in a day (for utilisation). Keeping timesheets tidy : stop a timer running more than n hours (kept as a draft for the person to check; 0 = never); Lock time up to and including a date so approved and invoiced weeks stay as they are; a weekly reminder e-mail to people who have not handed in last week's time; a warning when a project has used n% of its budget (recorded in the audit log). Service product billed time is invoiced under : the product named \"Professional services (time)\" can be created automatically; its tax rate and accounting follow the product. Booking settings (Booking > Settings) Opening hours : opens, closes, time between start times, working days. Booking rules : earliest booking (minutes ahead), furthest ahead (days), hold for payment (minutes), online cancel until (hours before). Reminders and moving a booking : e-mail the guest a reminder (with a calendar file) n hours before; guests may move their own booking on the public page. Public website : guests pick a service and a time themselves at /book . Also confirmation e-mail, bookings per phone number per day, page title, intro text, and how to pay (shown to guests who owe a deposit). Work orders settings (Work orders) New customer jobs need the customer's approval : work cannot start until an estimate has been sent and approved (can be switched off for a single job). E-mail the customer when a job is completed : a completion note (PDF) is sent. If the e-mail fails, the job is still completed. Attendance and leave settings (HR > Attendance > Settings) Working time : work starts at, grace period (minutes), hours in a normal day, overtime pays (multiple of normal hourly pay), working days. Clocking in after the start time plus grace counts as late. Leave types : name, days a year, whether days become available all at the start of the year or are earned month by month, carry-over (max days), paid or unpaid, paid out when leaving. Public holidays : add the holidays of each year; they are not counted as leave or working days. Hotel settings (Hotel > Settings) How room revenue reaches Accounting : Every night (posted by the night audit; best for most hotels), At check-out , or At booking and check-out (booked value is held as unearned revenue until check-out). The mode can only be changed when no booking is open. Tax on rooms and services (%) , check-in time , check-out time , night audit runs at . Cancellation and fee policy : free cancellation until n days before arrival; late-cancellation, no-show, early-departure fees (in nights); late check-out fee. The front desk can waive any fee. See also Online booking settings for the hotel's public booking page. Restaurant settings (Restaurant > Settings) Service charge by order type (dine-in, takeaway, delivery) and VAT on it; the most a waiter may discount without a manager; tips (quick-choice percents); quick kitchen notes; usual preparation time and amber/red thresholds for kitchen tickets; rounding of the bill; and table bookings from the public site at /reserve . Online Store settings (Online Store > Shop settings) The Online Store needs the Online Store module in the licence and activated. Its pages are /shop (the public shop, also the first page of the site for a visitor who is not signed in), /shop/order/<code> (where a customer follows an order), /shop/account (the customer's account), /shop/info/... (information pages), /driver/<secret> (a driver's private page) and a few small pages for the newsletter and carts; staff use the Online Store group of the menu ( Online orders , My deliveries , Driver cash , Online payments , Returns , Coupons , Reviews , Messages , Waiting customers , Shop pages , Newsletter , Send a newsletter , Abandoned carts , Loyalty points , Advertising , Sales reports , Text messages , Shop settings ). Everything starts closed: the public pages answer \"not available\" until the module is activated and Shop is open to the public is ticked. The User Manual (Online Store, chapters 23 to 25) describes the screens for the shop staff; this section is for the person who sets it up. Set up, in this order: Products on the shop : only products added here are shown or sold. The picture is the product's own; the price is the online price if set, otherwise the price list of the shop and the best promotion, otherwise the normal price. Prices are shown with tax included. The ticks Featured , Best seller , Offer and New choose the products of the rows on the first page. Products with variants appear as one product with options. Delivery areas with a fee, an optional minimum order, a tax (included in the fee) and an estimate in days each. With none, the shop delivers anywhere for free. Service product for the delivery fee : a service product (no stock) that carries the delivery fee on the sale order and the invoice. Without it, an order that has a delivery fee cannot be accepted. Give it a tax that is inclusive , or none, and choose each area's own tax, so that the invoice total, and the cash a driver must hand in, match what the customer saw. The shop switches and limits: Delivery , Pick-up , Pay cash on delivery or at pick-up , Minimum order , Free delivery from , Orders waiting per phone and Orders per connection per hour . Send new-order e-mails to and Alert by e-mail when an order waits this many minutes tell the shop who to warn. WhatsApp number of the shop and the Contact e-mail appear on the contact page. Front page : the announcement, banner texts and pictures, shop colour, footer text and links (see the User Manual). Banner pictures are stored in the database: up to 8, so a backup is slightly larger. Shop pages : read and adapt the four information pages (Terms, Privacy, Returns, Delivery). They are a starter text, not legal advice. Branch the shop sells for (only with more than one branch). Drivers and Delivery times , if the shop delivers. Accounts by provider (Online Store > Online payments), once the providers are switched on. Stock the shop sells The shop has no stock of its own. It sells what the warehouses hold in sellable locations (with several warehouses: Sales locations outside the Main warehouse; choose one in Stock the shop sells from , or Automatic ), minus the quantities reserved on confirmed sales orders, minus the units held by shop orders nobody has answered yet, minus the product's buffer , minus the Share kept for the till (%) . Expired batches are never counted and, with Do not sell goods with fewer days left than , batches close to their expiry are left out. Cartons that can be opened (breakdown on in Inventory) count as units. Under each product in Products on the shop the screen shows every figure. If products say Sold out although you have stock, see The online shop in chapter 14. Release unanswered orders after (hours) (default 24, 0 = never) cancels an order waiting for a payment, or a cash order nobody accepted, so its stock is free again. An order paid online is never cancelled this way. A job checks every 10 minutes. Price list used by the shop and Apply now : online prices from Sales (promotions that need a coupon, group, limit, minimum, \"buy X get Y\" or that cover the whole cart are not applied online). Prices are recalculated every 2 minutes. A product can be sold by weight or length (decimals from 0.1 to 100). Accepting an order creates a confirmed sale order for the customer (found by phone number, or created), which holds the stock. Completing it fulfils the sale order from the shop's Sales location (or the chosen one), issues the invoice and records the payment: cash for a cash order, or the online payment already received. Staff need the Operations area to answer orders. If completing an order is refused, for example for lack of stock, staff see the real reason; drivers and customers see \"please call the shop\" and the reason is in the order's history. Customer accounts Tick Customers can sign in to see their orders . A customer types an e-mail address and receives a one-time code (valid 10 minutes, 5 tries); there are no passwords. This needs the e-mail settings of the business (chapter 9), or text messages for a code sent to a saved phone number. Delivery times and drivers Delivery times is switched off until you add windows (from and to, orders per day, weekdays), the switches (customers choose a time; they must choose one; days ahead; notice in hours) and the days without deliveries. A delivery window is checked again on the server when the order is placed. Drivers : a driver is a list entry (name, phone, note, active). Give a link makes a private address and a 4-digit PIN for him (the PIN is shown once and stored scrambled); Show link , New PIN and Switch off manage it. For the link to be complete app.frontend-url must be the public address, and the site must be served over HTTPS . Five wrong PINs lock the link for 30 minutes; the phone keeps a session for up to 14 hours. A driver sees only his own orders and returns and his own cash. The code that completes a delivery (4 digits) is sent to the customer by e-mail and text and is never shown to staff or drivers; five wrong tries block it for 30 minutes. Online payments In Online payments tick every provider you want to offer, tick Customers can pay online , and set Minutes the customer has to pay . Each ticked provider must be switched on and keyed on the server, otherwise saving is refused with a clear message; at least one must stay ticked while online payments are on. When more than one provider can take the customer's way to pay, checkout shows a Pay with row of buttons. A customer who pays online has an order that reaches the shop only once the payment is confirmed; an order that is never paid is cancelled. Set the currency of the business (Business details) to the currency you charge in. The providers are: Simulated provider (for tests only; it exists when the server is started with app.online-store.payments.simulated.enabled=true and a ...simulated.secret ). The customer lands on a test page with Pay and Decline . Never use it with real customers. MTN Mobile Money (MoMo) for Rwanda. The customer types an MTN number and approves on the phone. It stays unavailable until it is switched on and keyed in the server's environment: app.online-store.payments.mtn.enabled=true , ...subscription-key , ...api-user , ...api-key , ...base-url (https only) and ...target-environment ( sandbox while testing). The step-by-step guide to get sandbox keys, test, and go live is docs/online-store-mtn-momo.md in the program's files. The sandbox accepts only the currency EUR. Airtel Money for Rwanda. The customer types an Airtel number and approves on the phone. Keys: app.online-store.payments.airtel.enabled=true , ...client-id , ...client-secret , ...base-url (https only) and ...country ( RW ). Airtel's refund gives back a whole payment and cannot do a part, so refunds are done by hand : the screen tells staff to refund from the Airtel Money account and record it with I refunded it myself and the Airtel reference. The guide is docs/online-store-airtel-money.md . Put the keys in the environment of the server or in the private files config/application-<provider>-production.properties that are never committed; never in a file that is copied around. The program never shows or logs them. Replace dots and dashes by underscores and use capitals for an environment variable ( APP_ONLINE_STORE_PAYMENTS_MTN_API_KEY ). Each customer business has its own keys : a provider's application is registered in the business's name. Warning: Both real providers have been tested only against imitations of their systems. Before opening the shop, do a sandbox test, then one small real purchase, one cancelled and refunded order, one part-returned order and one payout, and compare each with the provider's own statement. Give the provider the webhook address shown on the screen: <your address>/api/public/store/payments/<provider code>/webhook . A callback is never trusted by itself: the shop asks the provider for the payment's status and accepts the callback only when the provider's own answer agrees, and it also checks every pending payment about once a minute, so a lost call-back only delays the order a little. A payment that does not match its order (another amount or currency, or a double payment) goes to review instead of being accepted: watch Online Store > Online payments . Logos. Each provider's button shows its logo if the file exists at frontend/src/assets/payment/<code in lower case>.png ( mtn_momo.png , airtel_money.png ). The MTN and Airtel logos are trademarks and are not shipped: put the official files there and rebuild the frontend; without them the button shows the name. Accounts by provider. In Online Store > Online payments > Accounts by provider each provider gets a clearing account (what it still owes the shop) and a payout account (the wallet or bank account it pays into). MTN and Airtel start with accounts the program creates; a provider with none uses the shared Mobile Money or Card clearing account and its payouts arrive in Cash and Bank. Decide this with the accountant before the first real payment (chapter 6). Another provider (MOOV, ORANGE, a card gateway, IREMBO) is a small piece of programming for a developer; docs/online-store-payment-providers.md describes it. Once it exists it appears in the list and in Accounts by provider. Text messages (SMS or WhatsApp) In Text messages choose a Text provider , the channel ( Send as ), the Country code (250 for Rwanda; it is put in front of numbers that start with 0), Most texts per day (default 300; 0 = no limit) and Text the owner at a phone number. Nothing is sent until a provider is chosen. The program includes a test sender (it sends nothing: every text is listed in Online Store > Text messages ) and needs a developer to add a real provider ( docs/online-store-text-providers.md ). Order updates are texted only to customers who ticked the box at checkout. The delivery, pick-up, return and new codes are the exception: they are sent by e-mail and by text to the order's phone number whatever the box says. Until a real company is connected the built-in sender keeps those texts as Waiting for an SMS company and nothing leaves the server. Returns Customers can return goods up to this many days after the order is completed (14 by default; 0 = no returns through the shop). A return of a delivered order is collected by a driver, with a 4-digit return code. Newsletter and links in e-mails The newsletter sign-up and the sending of newsletters need the e-mail settings to be working. The confirmation link in the e-mail, the unsubscribe links, the \"View your order\" link in every customer e-mail, the driver's link, the share previews and the sitemap are built from the setting app.frontend-url : set it to the public address of the site (for example https://shop.yourbusiness.com , no trailing slash), otherwise the links will point to the wrong place (the default is http://localhost:4200 ). Sending limits. A newsletter started in Online Store > Send a newsletter goes out in batches by a job that runs every minute. Two settings (properties or environment variables) control the pace: app.online-store.newsletter.batch-size (e-mails per minute, default 25) and app.online-store.newsletter.daily-limit (most e-mails in any 24 hours, default 500, 0 = no limit). Set the limit to what your mail provider allows: when it is reached the rest waits until older e-mails are more than 24 hours old, then continues by itself. After five failures in a row the batch pauses and the newsletter shows the reason. An e-mail is marked as taken before it is handed to the mail server, so a crash can lose one e-mail but never sends one twice; a delivery stuck for more than 10 minutes is shown as failed (\"Interrupted\") and can be retried by staff once checked. Abandoned-cart reminders. Switched on with the box Send reminders for abandoned carts (off by default; nothing is saved while it is off). A job looks every 3 minutes for carts due a reminder (first one 1 hour, second one 3 days after the last change) and sends at most app.online-store.cart-reminders.batch-size e-mails per pass (default 20). They use the same e-mail settings and app.frontend-url . A reminder that fails is tried again 30 minutes later, three times at most. A cart is deleted after 60 days without change. The data kept is the e-mail address, the language, the products and quantities, and the reminder times. Loyalty points. Switched on with Customers earn and spend loyalty points (off by default; needs Customer accounts ). Two numbers: points earned per 100 paid for the goods (1 to 100, default 1) and points may pay at most % of the goods (0 to 100, default 50); one point is always worth 1 unit of the currency, and points do not expire. These points are separate from the till's loyalty programme in Sales. In the books they are a liability ( Loyalty Points Liability ) and the discount shows as Sales Discounts Given . Changing the two numbers affects later orders only. Link previews, search engines and the installable app When a shop link is pasted in WhatsApp, Facebook, Telegram and similar apps, a card with the product picture, name and price should appear, and Google should be able to show price, stock and stars. Those programs do not run the shop, so the web server must hand them a small page built by the backend. Add the nginx rule from docs/online-store-seo.md (a map for the crawlers' names, the location blocks for /shop , /shop/info/... , /_seo/... , /sitemap.xml and /robots.txt , using your backend's address), then nginx -t && nginx -s reload . Without it the shop works as before but links show no preview. Check with curl -A \"facebookexternalhit/1.1\" \"https://your-shop/shop?product=12\" : it must return a small page with og:title and product:price:amount . In Google Search Console, add sitemap.xml . The site can be installed as an app (PWA) from Chrome, Edge, Android and iPhone Safari. This needs HTTPS . The app keeps only the program's own files and shop pictures; nothing from /api is kept, so no old figure is ever shown as current. A new release is picked up on the next visit; a till is never reloaded in the middle of a sale. Behind a reverse proxy Behind a reverse proxy (nginx, IIS, a cloud load balancer): add server.forward-headers-strategy=native to the server's settings so that the limit per connection sees each visitor's own address. Without it all visitors share the proxy's address and the limit applies to everybody together. Law firm settings (Law firm > Settings) Practice areas and jurisdictions (one per line); \"due soon\" window; default billing basis for new matters (Hourly, Fixed fee, Retainer, Contingency, Pro bono); daily e-mail of deadlines and tasks to each lawyer; new matters restricted by default; limitation date warnings (first warning n days before, a second 3 days before, and one if the date has passed); and unpaid fees : the usual payment term and automatic client reminders listing late invoices with a statement attached. Real Estate settings (Real Estate > Settings) Areas you work in; how long a viewing lasts; when a lead is \"quiet\"; a morning e-mail to each agent about late and due calls and quiet leads (agents need an e-mail address on their user account); and viewing reminders to the person viewing and the agent. <h2 id=\"property-management-settings-property-management-settings\">Property Management settings (Property management > Settings) Areas; when a lease is \"ending soon\"; the day rent usually falls due; the usual management fee % and VAT on it; rent invoicing (how many days before the due date, and automatically every morning); and owner statements every month (make last month's statements automatically from a chosen day, and optionally agree them and e-mail owners when they have no warnings). There is also a separate reminder and late-fee page for tenants. Settings that are not in a module Settings > System settings, Business details, Email settings, Payment methods, Taxes, Scheduled reports, Apps, Backup & Data are covered in chapters 5, 9 and 10. The Loyalty , Promotions , Gift cards and Price lists pages are maintained by staff with the Sales area and are described in the User Manual. "}, {"id": "admin-8-tills-printers-and-devices", "manual": "admin", "n": 8, "title": "Tills, printers and devices", "html": "\n<h2 id=\"registers\">Registers<\/h2>\n<p>A <strong>register<\/strong> is a till. Create and edit registers\nunder <strong>POS &gt; Registers &amp; Terminal<\/strong> (Admin only).\nEach register has a name, can be pinned to one specific <em>Sales<\/em>\nlocation of a warehouse (and, when multi-warehouse is on, must be\nassigned a warehouse other than Main), and can be tied to one device\n(below).<\/p>\n<p>Cashiers do not need to be given register access one by one: a shift\nis opened on a register, and the terminal always asks for a\n<strong>PIN<\/strong> before it opens. The PIN identifies the cashier and\nstarts or resumes their own working session on that shift.<\/p>\n<h2 id=\"binding-a-register-to-one-device-version-1.13\">Binding a\nregister to one device (version 1.13)<\/h2>\n<p>You can tie a register to <strong>one known device<\/strong>
