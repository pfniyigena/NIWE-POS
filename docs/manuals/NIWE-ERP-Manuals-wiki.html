st and telling everyone. A restore replaces the whole database: sales since the backup are lost. Never turn on the dev profile to bypass a licence or a permission. If a restore really is needed Take a fresh backup of the current state (so you can go back). Tell the customer what will be lost (everything entered since the backup chosen) and get their yes. Restore (Settings > Backup & Data > Restore, or the database tools: Installation guide, chapter 7). The system is in maintenance mode while it runs. Restart the application and check the data. Help the business re-enter what was lost, from paper and from the tills' queues. When SQL is unavoidable Sometimes a defect leaves data in a state no screen can fix. Then: the developer writes and reviews the statement; you take a backup immediately before ; you run it in a transaction on a copy first ; you run it on the live database with the customer's agreement; you check the result in the screens; and you write the statement and its result in the customer's notes. A fix that is needed twice becomes a migration or a screen. "}, {"id": "support-6-incidents-communication-and-routines", "manual": "support", "n": 6, "title": "Incidents, communication\nand routines", "html": "\n<h2 id=\"handling-a-severity-1-incident\">Handling a severity 1\nincident<\/h2>\n<ol type=\"1\">\n<li><strong>Acknowledge<\/strong> the customer within minutes: \"We are on\nit; next update at <time>.\"<\/li>\n<li><strong>Stabilise first<\/strong>: if the service is down, bring it\nup; if money is at stake, stop the cause (switch the provider off in\nShop settings, pause orders with <strong>Pause orders for now<\/strong>)\nbefore finding the reason.<\/li>\n<li><strong>Collect facts<\/strong> (chapter 2), not guesses. Take a\nbackup before any change.<\/li>\n<li><strong>Decide<\/strong>: fix forward, or go back (put the previous\nversion and the last good backup back).<\/li>\n<li><strong>Update the customer<\/strong> every hour, in plain words:\nwhat is known, what is being done, what they should do (for example\n\"keep selling; sales are queued\").<\/li>\n<li><strong>After it is fixed<\/strong>: confirm with the customer that\nit works, and check the books (Suspense zero, balances right).<\/li>\n<li><strong>Write the post-incident note<\/strong> within two days: what\nhappened, the cause, how it was found, how it was fixed, how long it\nlasted, what was lost, and what will stop it happening again (a check,\nan alert, a change in the manual, a defect for the developer).<\/li>\n<\/ol>\n<h2 id=\"messages-that-help\">Messages that help<\/h2>\n<ul>\n<li><strong>Say what you know and what you do not know.<\/strong>\n\"Payments from MTN are accepted but orders are not showing; we are\nchecking\" is better than silence.<\/li>\n<li><strong>Give the customer something to do<\/strong>: a workaround\n(cash only, pick-up only), who to call.<\/li>\n<li><strong>Never promise a time<\/strong> you cannot keep. Promise the\nnext update.<\/li>\n<li>Use the customer's language: French for Chad and many Rwandan users,\nEnglish otherwise.<\/li>\n<\/ul>\n<h2 id=\"escalating-to-the-developer\">Escalating to the developer<\/h2>\n<p>Send the full report of chapter 2, say which customer and which\nseverity, say what you already tried, and keep one person as the contact\nso the developer is not asked the same question by three people. Ask for\na <strong>fix version<\/strong> (with a migration if needed) or a\n<strong>workaround<\/strong>. When the fix is ready, it is tried on a\n<strong>copy of the customer's data<\/strong> before it goes live, and\nthe customer's register is updated with the new version.<\/p>\n<h2 id=\"support-routines-for-every-customer\">Support routines for every\ncustomer<\/h2>\n<p><strong>Weekly<\/strong> (a few minutes per customer): is the service\nup and the version recorded; did last night's backup arrive off the\nserver; disk space; the error log; certificate and licence expiry dates\n(warn the customer 60 days before the licence ends).<\/p>\n<p><strong>Monthly<\/strong>: a short message to the owner with the\nversion, the uptime, the number of problems and how they were solved;\nremind the accountant of the month-end routine (reconciliation, Suspense\nat zero, close the books, a named backup); ask whether staff changes\nneed account changes.<\/p>\n<p><strong>Quarterly<\/strong>: a <strong>restore drill<\/strong>; review\nof staff accounts; applying the security updates of the server; a look\nat the release notes for a useful upgrade and a proposal of a\nwindow.<\/p>\n<p><strong>Yearly<\/strong>: the security checklist (Administrator\nManual, chapter 13) and the secrets rotation (Installation guide,\nchapter 8); the licence renewal; a review of whether the modules and the\nnumber of users still match the business.<\/p>\n<h2 id=\"keeping-the-manuals-honest\">Keeping the manuals honest<\/h2>\n<p>When a customer asks a question that the manuals answer badly, or a\nproblem that the manuals do not list, add it to the\n<em>Troubleshooting<\/em> tables and, if the program should have\nprevented it, send it to the developer as a wish. The best support\ndocument is the one a customer's administrator can use alone.<\/p>\n", "text": " Handling a severity 1 incident Acknowledge the customer within minutes: \"We are on it; next update at .\" Stabilise first : if the service is down, bring it up; if money is at stake, stop the cause (switch the provider off in Shop settings, pause orders with Pause orders for now ) before finding the reason. Collect facts (chapter 2), not guesses. Take a backup before any change. Decide : fix forward, or go back (put the previous version and the last good backup back). Update the customer every hour, in plain words: what is known, what is being done, what they should do (for example \"keep selling; sales are queued\"). After it is fixed : confirm with the customer that it works, and check the books (Suspense zero, balances right). Write the post-incident note within two days: what happened, the cause, how it was found, how it was fixed, how long it lasted, what was lost, and what will stop it happening again (a check, an alert, a change in the manual, a defect for the developer). Messages that help Say what you know and what you do not know. \"Payments from MTN are accepted but orders are not showing; we are checking\" is better than silence. Give the customer something to do : a workaround (cash only, pick-up only), who to call. Never promise a time you cannot keep. Promise the next update. Use the customer's language: French for Chad and many Rwandan users, English otherwise. Escalating to the developer Send the full report of chapter 2, say which customer and which severity, say what you already tried, and keep one person as the contact so the developer is not asked the same question by three people. Ask for a fix version (with a migration if needed) or a workaround . When the fix is ready, it is tried on a copy of the customer's data before it goes live, and the customer's register is updated with the new version. Support routines for every customer Weekly (a few minutes per customer): is the service up and the version recorded; did last night's backup arrive off the server; disk space; the error log; certificate and licence expiry dates (warn the customer 60 days before the licence ends). Monthly : a short message to the owner with the version, the uptime, the number of problems and how they were solved; remind the accountant of the month-end routine (reconciliation, Suspense at zero, close the books, a named backup); ask whether staff changes need account changes. Quarterly : a restore drill ; review of staff accounts; applying the security updates of the server; a look at the release notes for a useful upgrade and a proposal of a window. Yearly : the security checklist (Administrator Manual, chapter 13) and the secrets rotation (Installation guide, chapter 8); the licence renewal; a review of whether the modules and the number of users still match the business. Keeping the manuals honest When a customer asks a question that the manuals answer badly, or a problem that the manuals do not list, add it to the Troubleshooting tables and, if the program should have prevented it, send it to the developer as a wish. The best support document is the one a customer's administrator can use alone. "}], "nav": [{"key": "admin", "title": "Administrator Manual", "desc": "For the person who installs, configures and looks after the system.", "items": ["admin-1-about-this-manual", "admin-2-installing-and-first-start", "admin-3-licence-and-modules", "admin-4-users-roles-and-permissions", "admin-5-business-set-up", "admin-6-accounting-set-up", "admin-7-module-settings", "admin-8-tills-printers-and-devices", "admin-9-e-mail-alerts-and-scheduled-reports", "admin-10-backup-restore-import-and-export", "admin-11-logs-and-monitoring", "admin-12-upgrades-and-migrations", "admin-13-security-checklist", "admin-14-troubleshooting"]}, {"key": "user", "title": "User Manual", "desc": "Day-to-day use of every module, task by task.", "items": ["user-1-about-this-manual-and-getting-started", "user-2-pos-registers-the-sales-terminal-and-shi", "user-3-sales", "user-4-customers", "user-5-purchases-and-suppliers", "user-6-inventory", "user-7-restaurant", "user-8-hotel", "user-9-manufacturing", "user-10-accounting", "user-11-expenses", "user-12-assets", "user-13-human-resources-and-payroll", "user-14-time-tracking", "user-15-work-orders", "user-16-booking-appointments", "user-17-subscriptions", "user-18-installments", "user-19-help-desk", "user-20-law-firm", "user-21-real-estate-sales-and-brokerage", "user-22-property-management-rentals", "user-23-online-store", "user-24-online-store-delivery-drivers-and-cash", "user-25-online-store-payments-accounting-and-rep", "user-26-glossary-and-common-questions"]}, {"key": "cards", "title": "Role quick-start cards", "desc": "One page per role, to get started quickly.", "it var byId={};D.pages.forEach(function(p,i){byId[p.id]=i});
var nav=document.getElementById('nav'),main=document.getElementById('main');
function esc(s){return s.replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
(function buildNav(){
  var h='<a href="#home" data-id="home"><i></i>Start here</a>';
  D.nav.forEach(function(m){
    h+='<h3>'+esc(m.title)+'</h3>';
    m.items.forEach(function(id){var p=D.pages[byId[id]];h+='<a href="#'+id+'" data-id="'+id+'"><i>'+(m.key==='cards'?'':p.n)+'</i>'+esc(p.title)+'</a>'});
  });
  nav.innerHTML=h;
})();
function home(){
  var h='<article class="home"><div class="crumb">NIWE ERP, version 1.76.0</div><h1>Manuals for every person who uses the system</h1>'+
  '<p class="lede">Seven sets of pages, written from the same sources as the Word and PDF editions: the manuals for the people who use and administer the system, the role cards, and four guides for the people who install, onboard and support customers. Pick the one that matches your job, or search for a screen or a word.</p><div class="cards">';
  D.nav.forEach(function(m){h+='<a class="card" href="#'+m.items[0]+'"><b>'+esc(m.title)+'</b><span>'+esc(m.desc)+'</span><small>'+m.items.length+(m.key==='cards'?' cards':' chapters')+'</small></a>'});
  h+='</div><h2>Find your role</h2><div class="chips">';
  D.nav[2].items.forEach(function(id){var p=D.pages[byId[id]];h+='<a href="#'+id+'">'+esc(p.title)+'</a>'});
  h+='</div><h2>Find your module</h2><div class="chips">';
  D.nav[1].items.forEach(function(id){var p=D.pages[byId[id]];h+='<a href="#'+id+'">'+esc(p.title.replace(/^.*?: /,''))+'</a>'});
  h+='</div></article>';return h;
}
function render(){
  var id=(location.hash||'#home').slice(1);
  document.body.classList.remove('open');document.getElementById('menu').setAttribute('aria-expanded','false');
  var links=nav.querySelectorAll('a');for(var i=0;i<links.length;i++){links[i].classList.toggle('on',links[i].getAttribute('data-id')===id)}
  if(!(id in byId)){main.innerHTML=home();document.title='NIWE ERP Manuals';window.scrollTo(0,0);return}
  var i=byId[id],p=D.pages[i],m=D.nav.filter(function(x){return x.key===p.manual})[0];
  var pos=m.items.indexOf(id),prev=m.items[pos-1],next=m.items[pos+1];
  var h='<article><div class="crumb">'+esc(m.title)+(m.key==='cards'?'':' · chapter '+p.n)+'</div><h1>'+esc(p.title)+'</h1>'+p.html+'<div class="pager">';
  h+=prev?'<a href="#'+prev+'"><small>Previous</small>'+esc(D.pages[byId[prev]].title)+'</a>':'<span></span>';
  h+=next?'<a class="next" href="#'+next+'"><small>Next</small>'+esc(D.pages[byId[next]].title)+'</a>':'';
  h+='</div></article>';
  main.innerHTML=h;document.title=p.title+' | NIWE ERP Manuals';window.scrollTo(0,0);
  var on=nav.querySelector('a.on');if(on&&on.scrollIntoView){try{on.scrollIntoView({block:'nearest'})}catch(e){}}
}
window.addEventListener('hashchange',render);render();
document.getElementById('menu').addEventListener('click',function(){var o=document.body.classList.toggle('open');this.setAttribute('aria-expanded',o)});
// search
var q=document.getElementById('q'),res=document.getElementById('res');
q.addEventListener('input',function(){
  var t=q.value.trim().toLowerCase();if(t.length<2){res.hidden=true;return}
  var words=t.split(/\s+/),out=[];
  D.pages.forEach(function(p){
    var low=p.text.toLowerCase(),ok=words.every(function(w){return low.indexOf(w)>-1});
    if(!ok)return;var at=low.indexOf(words[0]),from=Math.max(0,at-50),snip=p.text.substr(from,140);
    var score=(p.title.toLowerCase().indexOf(words[0])>-1?10:0)+(low.split(words[0]).length-1);
    out.push({p:p,s:esc(snip),score:score,w:words[0]});
  });
  out.sort(function(a,b){return b.score-a.score});out=out.slice(0,8);
  if(!out.length){res.innerHTML='<a href="#home"><b>No match</b><span>Try another word, for example a screen name.</span></a>'}
  else res.innerHTML=out.map(function(o){
    var m=D.nav.filter(function(x){return x.key===o.p.manual})[0];
    var s=o.s.replace(new RegExp('('+o.w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<mark>$1</mark>');
    return '<a href="#'+o.p.id+'"><b>'+esc(o.p.title)+'</b><span>'+esc(m.title)+' · ...'+s+'...</span></a>'}).join('');
  res.hidden=false;
});
res.addEventListener('click',function(){res.hidden=true;q.value=''});
document.addEventListener('click',function(e){if(!e.target.closest('.search'))res.hidden=true});
q.addEventListener('keydown',function(e){if(e.key==='Escape'){res.hidden=true;q.blur()}});
// theme
document.getElementById('theme').addEventListener('click',function(){
  var r=document.documentElement,cur=r.getAttribute('data-theme');
  if(!cur){cur=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light'}
  var nx=cur==='dark'?'light':'dark';r.setAttribute('data-theme',nx);
  try{localStorage.setItem('niwe-theme',nx)}catch(e){}
});
try{var st=localStorage.getItem('niwe-theme');if(st)document.documentElement.setAttribute('data-theme',st)}catch(e){}
