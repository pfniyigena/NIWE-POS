ench, Rwanda in English).<\/p>\n<h2 id=\"before-1.23\">Before 1.23<\/h2>\n<p>1.1 module licensing; 1.2 to 1.4 Property Management, Real Estate and\nLaw firm; 1.5 paging, search and exports everywhere, collections,\nimports with check-first, accounting controls, price lists, promotions,\ngift cards and loyalty at the till; 1.6 to 1.10 HR and Payroll, Hotel,\nRestaurant, POS, Manufacturing and decimal quantities; 1.11 receipts\nwith the tax number, dashboard paging; 1.12 thermal printing, cash\ndrawer and customer display; 1.13 a register tied to one device; 1.14\nserver logs, the sign-in log and the wider audit log; 1.15 to 1.22 Work\norders, Time tracking, Booking, Installments, Subscriptions, Help Desk,\nExpenses and Assets.<\/p>\n", "text": " The versions are grouped by what they bring. Each line says what you can now do. Versions before 1.23 are summarised in the last section. 1.76: choose the accounts of each payment provider In Online Store > Online payments > Accounts by provider you choose, for each payment provider (MTN, Airtel, card, and later ones), the account for what the provider still owes you and the wallet or bank account its payouts arrive in . Each can be an existing account or one created on the spot. Payouts are recorded one provider at a time. 1.75: an account for each payment provider MTN Mobile Money, Airtel Money and card each have their own accounts, so each balance can be matched to that provider's own statement. Orders paid before this version keep their old accounts, so no balance moves. <h2 id=\"and-1.74-the-shops-accounts-show-discounts-delivery-income-and-loyalty-points-returns-at-cost\">1.73 and 1.74: the shop's accounts show discounts, delivery income and loyalty points; returns at cost Sales Revenue now shows the full price of the goods; coupon and points discounts are in Sales Discounts Given and delivery fees in Delivery Income . Loyalty points the shop owes are a liability . A return puts the goods back into stock at the cost they were sold at . A branch can be chosen for the online shop. 1.72: cash that drivers hold Cash a driver takes at the door is booked to Cash with Drivers until he hands it in. The hand-in moves it to Cash and Bank and books any difference. 1.71: online payments are held and cleared against payouts Money paid online is recorded when the provider confirms it, held until the order is delivered, and cleared when the provider pays out. A new Payouts panel records each payout and its fee. 1.70: returns post the VAT and the refund A return now reverses the VAT as well as the sale and posts the money handed back to the customer. 1.65 to 1.69: the stock and the prices the shop uses The shop sells only from Sales locations (outside the Main warehouse), one chosen or all. A shop order holds its stock from the moment it is placed , so two customers cannot be sold the last unit; unanswered orders are cancelled after a number of hours you set. A buffer for each product and a share kept for the till . Expired goods are never sold; batches near their expiry can be left out; serial numbers are shown and returned correctly. Cartons count as stock; Reorder takes shop orders and waiting customers into account. Prices and promotions from Sales are used online; products can be sold by weight or length . Fixes: completing an order with several warehouses no longer fails, and refusals show their real reason. 1.52 to 1.64: delivery Drivers , delivery slips and run sheets ; the customer sees his driver's name and phone. A 4-digit delivery code : the customer gives it to the driver to complete the order. Staff never see it. It is sent by e-mail and text (text is a placeholder until a text company is connected). A private page for each driver (link and PIN, no staff login) with his orders, his cash and his returns to collect. Driver cash : follow the cash drivers take until it is handed in, with differences recorded. Failed deliveries and partial deliveries , with the customer choosing a new delivery time . Delivery time windows (limits per window, closed days, notice). Return pick-ups : a driver collects returned goods with a return code. Delivery estimate and tax for each area ; the fee is the amount the customer pays and the tax is included. Every accounting entry from an online order ends with the order number. 1.41 to 1.51 and 1.53 to 1.55: a richer shop Airtel Money as a second payment provider, and several providers at once with a choice at checkout (1.41, 1.42). Advertising : sell space in the shop to other businesses, with a report of views and clicks (1.43). A product page for each product; search, filters and sorting; product cards, quick view, recently viewed; ratings (stars count at once) and reviews (words, approved by staff) (1.44 to 1.46). Invoice download , an address book , a wish list and WhatsApp links (1.47); product rows that slide (1.48). Product variants (size, colour, model) as one product with options (1.50); a contact form with replies inside the program, and four information pages (1.51). Link previews in WhatsApp, Facebook and others, a sitemap and Google product data (1.53); back-in-stock alerts (1.54); the customer portal (1.55); and the installable app for the whole site (1.49). 1.27 to 1.40: the Online Store is born A public shop with delivery and pick-up and cash orders (1.27); e-mails at every step (1.28); online payment with a test provider and then MTN Mobile Money (1.29, 1.34); customer accounts by e-mailed code (1.30); coupons (1.31); text messages (1.32); returns and refunds (1.33); the shop as the first page; a full first page with banner pictures, rows, reviews, newsletter and footer (1.34 to 1.36); six sales reports (1.37); newsletters sent from the program (1.38); abandoned-cart reminders (1.39); loyalty points (1.40). 1.23 to 1.26: French French throughout: screens, messages, lists, report headings, printed documents, e-mails and the messages the server writes. Each user can switch language, and the business has a default language (Chad starts in French, Rwanda in English). Before 1.23 1.1 module licensing; 1.2 to 1.4 Property Management, Real Estate and Law firm; 1.5 paging, search and exports everywhere, collections, imports with check-first, accounting controls, price lists, promotions, gift cards and loyalty at the till; 1.6 to 1.10 HR and Payroll, Hotel, Restaurant, POS, Manufacturing and decimal quantities; 1.11 receipts with the tax number, dashboard paging; 1.12 thermal printing, cash drawer and customer display; 1.13 a register tied to one device; 1.14 server logs, the sign-in log and the wider audit log; 1.15 to 1.22 Work orders, Time tracking, Booking, Installments, Subscriptions, Help Desk, Expenses and Assets. "}, {"id": "releases-3-what-you-must-do-at-each-upgrade", "manual": "releases", "n": 3, "title": "What you must do at each\nupgrade", "html": "\n<p>Most versions need nothing from you. These are the versions that need\na <strong>one-time action<\/strong>. The technician does the technical\nones; the business does the ones marked <em>business<\/em>.<\/p>\n<div class=\"tablewrap\"><table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Version<\/th>\n<th>Action<\/th>\n<th>Who<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Any<\/td>\n<td>Take a <strong>backup<\/strong> and copy it off the server before the\nupgrade. Keep the previous jar and frontend until the new version has\nworked a day.<\/td>\n<td>NIWE<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>1.22.3 and later<\/td>\n<td>The database password, the sign-in secret and the e-mail password\nare <strong>never in the shipped files<\/strong>: they are in the\nserver's private settings or environment.<\/td>\n<td>NIWE<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>1.38<\/td>\n<td>Optional pace settings for newsletters\n(<code>app.online-store.newsletter.batch-size<\/code>,\n<code>daily-limit<\/code>).<\/td>\n<td>NIWE<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>1.39<\/td>\n<td>Abandoned-cart reminders need working e-mail and\n<code>app.frontend-url<\/code> set to the public address. Off until\nswitched on in Shop settings.<\/td>\n<td>NIWE and business<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>1.41, 1.42<\/td>\n<td>Airtel Money and several providers: provider keys go in the server's\nenvironment, and each provider must be switched on there before it can\nbe ticked in Shop settings.<\/td>\n<td>NIWE<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>1.42<\/td>\n<td>Optional: put the official MTN and Airtel logo files in\n<code>frontend/src/assets/payment/<\/code> before building the frontend;\notherwise the buttons show names.<\/td>\n<td>NIWE<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>1.49<\/td>\n<td>The site is installed as an app only over\n<strong>https<\/strong>.<\/td>\n<td>NIWE<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>1.51<\/td>\n<td>Read and adapt the four <strong>information pages<\/strong> (Terms,\nPrivacy, Returns, Delivery) in Online Store &gt; Shop pages. They are\nstarter texts, not legal advice.<\/td>\n<td>Business<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>1.53<\/td>\n<td>Add the <strong>web server rule<\/strong> for link previews, the\nsitemap and robots.txt (<code>docs/online-store-seo.md<\/code>) and set\n<code>app.frontend-url<\/code> to the public address. Without it the shop\nworks but links show no preview.<\/td>\n<td>NIWE<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>1.54<\/td>\n<td>Back-in-stock alerts use e-mail (and text when connected). No\naction.<\/td>\n<td><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>1.57, 1.59.1<\/td>\n<td>Give the <strong>delivery fee product<\/strong> an inclusive tax or\nnone, and set each delivery area's <strong>tax<\/strong>, so that the\ninvoice and the driver's cash match the customer's total.<\/td>\n<td>Business<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>1.59<\/td>\n<td>Set <code>app.frontend-url<\/code>; serve over https; give each\ndriver a <strong>link and PIN<\/strong> in Shop settings &gt;\nDrivers.<\/td>\n<td>NIWE and business<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>1.61<\/td>\n<td>Delivery times are off until windows are added in Shop settings &gt;\nDelivery times.<\/td>\n<td>Business<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>1.65<\/td>\n<td>With several warehouses, choose <strong>Stock the shop sells\nfrom<\/strong> (or leave Automatic). Check the line under a few\nproducts.<\/td>\n<td>Business<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>1.66<\/td>\n<td>Choose <strong>Release unanswered orders after (hours)<\/strong> and\nthe <strong>share kept for the till<\/strong>.<\/td>\n<td>Business<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>1.67<\/td>\n<td>Choose <strong>Do not sell goods with fewer days left than<\/strong>\nif the shop sells expiring goods.<\/td>\n<td>Business<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>1.69<\/td>\n<td>Choose the <strong>price list<\/strong> the shop uses; mark products\nsold by weight or length.<\/td>\n<td>Business<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>1.70 to 1.76<\/td>\n<td>Accounting changes: open <strong>Accounting &gt; Chart of\naccounts<\/strong> a few seconds after the first start and check that the\nnew accounts exist (Rwanda: 1011, 1012, 1013, 1020, 1021, 1022, 1030,\n1050, 2810, 2820, 4030, 4040, 5240; Chad: 5212 to 5219, 4197, 4198, 631,\n7071, 7091).<\/td>\n<td>NIWE and accountant<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>1.71, 1.75, 1.76<\/td>\n<td>Choose each provider's <strong>clearing and payout accounts<\/strong>\nin Online Store &gt; Online payments &gt; Accounts by provider. Record\neach provider <strong>payout<\/strong> in Payouts. Post <strong>opening\nbalances<\/strong> of the provider accounts if you start part-way.<\/td>\n<td>Accountant<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>1.72<\/td>\n<td>Check that <strong>Cash with Drivers<\/strong> agrees with the <em>To\nhand in<\/em> total of Driver cash each day.<\/td>\n<td>Business<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>1.73<\/td>\n<td>Loyalty points customers held before this version are <strong>not in\nthe liability<\/strong>: post one manual opening entry (Dr Customer\nRewards Expense, Cr Loyalty Points Liability).<\/td>\n<td>Accountant<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>1.74<\/td>\n<td>With more than one branch, choose <strong>Branch the shop sells\nfor<\/strong>.<\/td>\n<td>Business<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>If you are several versions behind, do <strong>all<\/strong> the\nactions of every version you pass.<\/p>\n<h2 id=\"known-limits-to-remember-version-1.76\">Known limits to remember\n(version 1.76)<\/h2>\n<ul>\n<li>A payment <em>under review<\/em> (wrong amount, or a second payment\nfor an order already paid) is not in the books until staff deal with\nit.<\/li>\n<li>Orders paid online before 1.71 have no deposit: their payment is\nbooked against the provider's account when they are delivered. Orders\ndelivered before 1.72 settle driver cash with the difference only.\nReturns before 1.70 keep their old refund figure. Orders paid before\n1.75 keep the old accounts.<\/li>\n<li>A provider that pays out net of its fee: enter the gross the payout\ncovers and the fee.<\/li>\n<li>Real MTN, Airtel and card payments depend on your own keys and\napproval; the first live payments must be tested with small\namounts.<\/li>\n<li>The text message sender is a placeholder until a real text company\nis connected: codes by text stay in the text list; the e-mail still\ngoes.<\/li>\n<\/ul>\n", "text": " Most versions need nothing from you. These are the versions that need a one-time action . The technician does the technical ones; the business does the ones marked business . Version Action Who Any Take a backup and copy it off the server before the upgrade. Keep the previous jar and frontend until the new version has worked a day. NIWE 1.22.3 and later The database password, the sign-in secret and the e-mail password are never in the shipped files : they are in the server's private settings or environment. NIWE 1.38 Optional pace settings for newsletters ( app.online-store.newsletter.batch-size , daily-limit ). NIWE 1.39 Abandoned-cart reminders need working e-mail and app.frontend-url set to the public address. Off until switched on in Shop settings. NIWE and business 1.41, 1.42 Airtel Money and several providers: provider keys go in the server's environment, and each provider must be switched on there before it can be ticked in Shop settings. NIWE 1.42 Optional: put the official MTN and Airtel logo files in frontend/src/assets/payment/ before building the frontend; otherwise the buttons show names. NIWE 1.49 The site is installed as an app only over https . NIWE 1.51 Read and adapt the four information pages (Terms, Privacy, Returns, Delivery) in Online Store > Shop pages. They are starter texts, not legal advice. Business 1.53 Add the web server rule for link previews, the sitemap and robots.txt ( docs/online-store-seo.md ) and set app.frontend-url to the public address. Without it the shop works but links show no preview. NIWE 1.54 Back-in-stock alerts use e-mail (and text when connected). No action. 1.57, 1.59.1 Give the delivery fee product an inclusive tax or none, and set each delivery area's tax , so that the invoice and the driver's cash match the customer's total. Business 1.59 Set app.frontend-url ; serve over https; give each driver a link and PIN in Shop settings > Drivers. NIWE and business 1.61 Delivery times are off until windows are added in Shop settings > Delivery times. Business 1.65 With several warehouses, choose Stock the shop sells from (or leave Automatic). Check the line under a few products. Business 1.66 Choose Release unanswered orders after (hours) and the share kept for the till . Business 1.67 Choose Do not sell goods with fewer days left than if the shop sells expiring goods. Business 1.69 Choose the price list the shop uses; mark products sold by weight or length. Business 1.70 to 1.76 Accounting changes: open Accounting > Chart of accounts a few seconds after the first start and check that the new accounts exist (Rwanda: 1011, 1012, 1013, 1020, 1021, 1022, 1030, 1050, 2810, 2820, 4030, 4040, 5240; Chad: 5212 to 5219, 4197, 4198, 631, 7071, 7091). NIWE and accountant 1.71, 1.75, 1.76 Choose each provider's clearing and payout accounts in Online Store > Online payments > Accounts by provider. Record each provider payout in Payouts. Post opening balances of the provider accounts if you start part-way. Accountant 1.72 Check that Cash with Drivers agrees with the To hand in total of Driver cash each day. Business 1.73 Loyalty points customers held before this version are not in the liability : post one manual opening entry (Dr Customer Rewards Expense, Cr Loyalty Points Liability). Accountant 1.74 With more than one branch, choose Branch the shop sells for . Business If you are several versions behind, do all the actions of every version you pass. Known limits to remember (version 1.76) A payment under review (wrong amount, or a second payment for an order already paid) is not in the books until staff deal with it. Orders paid online before 1.71 have no deposit: their payment is booked against the provider's account when they are delivered. Orders delivered before 1.72 settle driver cash with the difference only. Returns before 1.70 keep their old refund figure. Orders paid before 1.75 keep the old accounts. A provider that pays out net of its fee: enter the gross the payout covers and the fee. Real MTN, Airtel and card payments depend on your own keys and approval; the first live payments must be tested with small amounts. The text message sender is a placeholder until a real text company is connected: codes by text stay in the text list; the e-mail still goes. "}, {"id": "releases-4-versions-and-database-changes", "manual": "releases", "n": 4, "title": "Versions and database\nchanges", "html": "\n<p>The database structure changes by numbered\n<strong>migrations<\/strong> (V70, V71, ...). The newest migration a\ndatabase has applied shows which version it was last started on. A\ndatabase made by a <strong>newer<\/strong> version cannot be used with an\n<strong>older<\/strong> program: the program stops at start-up and names\nthe migration it does not know. Restore a backup into the version that\nmade it, or use the newer program.<\/p>\n<div class=\"tablewrap\"><table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Version<\/th>\n<th>Theme<\/th>\n<th>Migrations<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>1.32<\/td>\n<td>Text messages<\/td>\n<td>V70<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>1.33<\/td>\n<td>Returns and refunds<\/td>\n<td>V71<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>1.35, 1.36<\/td>\n<td>Front page, banner pictures<\/td>\n<td>V72, V73<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>1.38<\/td>\n<td>Newsletter sending<\/td>\n<td>V74<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>1.39<\/td>\n<td>Abandoned-cart reminders<\/td>\n<td>V75<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>1.40<\/td>\n<td>Loyalty points<\/td>\n<td>V76<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>1.42<\/td>\n<td>Several payment providers<\/td>\n<td>V77<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>1.43<\/td>\n<td>Advertising<\/td>\n<td>V78<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>1.44<\/td>\n<td>Product page<\/td>\n<td>V79<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>1.45<\/td>\n<td>Shop look and delivery days<\/td>\n<td>V80<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>1.46<\/td>\n<td>Ratings and reviews<\/td>\n<td>V81<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>1.47<\/td>\n<td>Account extras (invoice, addresses, wish list, WhatsApp)<\/td>\n<td>V82<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>1.48<\/td>\n<td>Product rows that slide<\/td>\n<td>V83<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>1.50<\/td>\n<td>Product variants<\/td>\n<td>V84<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>1.51, 1.51.1<\/td>\n<td>Information pages, contact form and replies<\/td>\n<td>V85, V86<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>1.52<\/td>\n<td>Drivers<\/td>\n<td>V87<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>1.54<\/td>\n<td>Back-in-stock alerts<\/td>\n<td>V88<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>1.56<\/td>\n<td>Order reception (codes)<\/td>\n<td>V89<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>1.57<\/td>\n<td>Driver cash<\/td>\n<td>V90<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>1.58<\/td>\n<td>Failed and partial deliveries<\/td>\n<td>V91<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>1.59<\/td>\n<td>Driver private link and PIN<\/td>\n<td>V92<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>1.59.1<\/td>\n<td>Tax for each delivery area<\/td>\n<td>V93<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>1.59.2<\/td>\n<td>Codes by SMS and e-mail<\/td>\n<td>V94<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>1.61<\/td>\n<td>Delivery time slots<\/td>\n<td>V95<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>1.62<\/td>\n<td>Return pick-ups<\/td>\n<td>V96<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>1.63<\/td>\n<td>Delivery estimate per area<\/td>\n<td>V97<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>1.65<\/td>\n<td>Stock location of the shop<\/td>\n<td>V98<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>1.66<\/td>\n<td>Held stock and buffers<\/td>\n<td>V99<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>1.67<\/td>\n<td>Expiry and serials<\/td>\n<td>V100<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>1.69<\/td>\n<td>Prices from Sales, weights and lengths<\/td>\n<td>V101<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>1.71<\/td>\n<td>Online payments in the books, payouts<\/td>\n<td>V102<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>1.72<\/td>\n<td>Cash with Drivers<\/td>\n<td>V103<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>1.74<\/td>\n<td>Cost sold and the shop's branch<\/td>\n<td>V104<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>1.75<\/td>\n<td>An account for each payment provider<\/td>\n<td>V105<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>1.76<\/td>\n<td>Choose the accounts of each provider<\/td>\n<td>V106<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Versions not in the table (for example 1.41, 1.49, 1.53, 1.55,\n1.58.1, 1.58.2, 1.60, 1.64, 1.64.1, 1.68, 1.70, 1.73) have <strong>no\nmigration<\/strong>.<\/p>\n<h2 id=\"checking-what-a-database-is-on\">Checking what a database is\non<\/h2>\n<p>An administrator with database access can run\n<code>select version, description, success from flyway_schema_history order by installed_rank desc limit 5;<\/code>.\nThe first row is the newest migration applied. Without database access,\nthe log of the last start lists the migrations that ran and the version\nof the program.<\/p>\n", "text": " The database structure changes by numbered migrations (V70, V71, ...). The newest migration a database has applied shows which version it was last started on. A database made by a newer version cannot be used with an older program: the program stops at start-up and names the migration it does not know. Restore a backup into the version that made it, or use the newer program. Version Theme Migrations 1.32 Text messages V70 1.33 Returns and refunds V71 1.35, 1.36 Front page, banner pictures V72, V73 1.38 Newsletter sending V74 1.39 Abandoned-cart reminders V75 1.40 Loyalty points V76 1.42 Several payment providers V77 1.43 Advertising V78 1.44 Product page V79 1.45 Shop look and delivery days V80 1.46 Ratings and reviews V81 1.47 Account extras (invoice, addresses, wish list, WhatsApp) V82 1.48 Product rows that slide V83 1.50 Product variants V84 1.51, 1.51.1 Information pages, contact form and replies V85, V86 1.52 Drivers V87 1.54 Back-in-stock alerts V88 1.56 Order reception (codes) V89 1.57 Driver cash V90 1.58 Failed and partial deliveries V91 1.59 Driver private link and PIN V92 1.59.1 Tax for each delivery area V93 1.59.2 Codes by SMS and e-mail V94 1.61 Delivery time slots V95 1.62 Return pick-ups V96 1.63 Delivery estimate per area V97 1.65 Stock location of the shop V98 1.66 Held stock and buffers V99 1.67 Expiry and serials V100 1.69 Prices from Sales, weights and lengths V101 1.71 Online payments in the books, payouts V102 1.72 Cash with Drivers V103 1.74 Cost sold and the shop's branch V104 1.75 An account for each payment provider V105 1.76 Choose the accounts of each provider V106 Versions not in the table (for example 1.41, 1.49, 1.53, 1.55, 1.58.1, 1.58.2, 1.60, 1.64, 1.64.1, 1.68, 1.70, 1.73) have no migration . Checking what a database is on An administrator with database access can run select version, description, success from flyway_schema_history order by installed_rank desc limit 5; . The first row is the newest migration applied. Without database access, the log of the last start lists the migrations that ran and the version of the program. "}, {"id": "releases-5-upgrade-record-one-page-for-each-upgrade", "manual": "releases", "n": 5, "title": "Upgrade record (one\npage for each upgrade)", "html": "\n<p>Copy this page for every upgrade of a customer and keep it with the\ncustomer register.<\/p>\n<div class=\"tablewrap\"><table>\n<tbody>\n<tr class=\"odd\">\n<td>Customer<\/td>\n<td><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>From version, to version<\/td>\n<td><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Date and window agreed with the customer<\/td>\n<td><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Done by<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"before\">Before<\/h2>\n<ul class=\"task-list\">\n<li><label><input type=\"checkbox\" />Release notes of every version\npassed have been read; the actions of chapter 3 are listed\nbelow.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Customer informed; day closed if\npossible.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Backup taken and copied off the\nserver (file name, size, place): ________________<\/label><\/li>\n<li><label><input type=\"checkbox\" />Old jar and old frontend kept\n(where): ________________<\/label><\/li>\n<li><label><input type=\"checkbox\" />For a large gap: tried on a copy of\nthe data (result): ________________<\/label><\/li>\n<\/ul>\n<h2 id=\"during\">During<\/h2>\n<ul class=\"task-list\">\n<li><label><input type=\"checkbox\" />Service stopped; new jar and\nfrontend in place.<\/label><\/li>\n<li><label><input type=\"checkbox\" />One-time actions applied (list):\n________________<\/label><\/li>\n<li><label><input type=\"checkbox\" />Service started; log shows each new\nmigration (last one: V____) and <em>Started PosApplication<\/em>; no\nERROR lines.<\/label><\/li>\n<\/ul>\n<h2 id=\"after\">After<\/h2>\n<ul class=\"task-list\">\n<li><label><input type=\"checkbox\" />Signed in as admin; <strong>Settings\n&gt; Modules<\/strong> shows the licence and the modules.<\/label><\/li>\n<li><label><input type=\"checkbox\" /><strong>Accounting &gt; Chart of\naccounts<\/strong> has the new accounts (when the release said\nso).<\/label><\/li>\n<li><label><input type=\"checkbox\" />A test sale (or order) made and its\nentries read in the Journal.<\/label><\/li>\n<li><label><input type=\"checkbox\" />The customer's administrator checked\nthe screens used every day.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Register updated with the new\nversion and the date.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Problems found and who owns them:\n________________<\/label><\/li>\n<\/ul>\n<p>Signed (NIWE): ______________ Signed (customer): ______________<\/p>\n", "text": " Copy this page for every upgrade of a customer and keep it with the customer register. Customer From version, to version Date and window agreed with the customer Done by Before Release notes of every version passed have been read; the actions of chapter 3 are listed below. Customer informed; day closed if possible. Backup taken and copied off the server (file name, size, place): ________________ Old jar and old frontend kept (where): ________________ For a large gap: tried on a copy of the data (result): ________________ During Service stopped; new jar and frontend in place. One-time actions applied (list): ________________ Service started; log shows each new migration (last one: V____) and Started PosApplication ; no ERROR lines. After Signed in as admin; Settings > Modules shows the licence and the modules. Accounting > Chart of accounts has the new accounts (when the release said so). A test sale (or order) made and its entries read in the Journal. The customer's administrator checked the screens used every day. Register updated with the new version and the date. Problems found and who owns them: ________________ Signed (NIWE): ______________ Signed (customer): ______________ "}, {"id": "support-1-how-support-works", "manual": "support", "n": 1, "title": "How support works", "html": "\n<h2 id=\"who-this-guide-is-for\">Who this guide is for<\/h2>\n<p>This guide is for the people who help a customer when something is\nwrong: the first-line support contact, the technician who looks after\nthe server, and the developer who is called when it is a defect. It also\nhelps a customer's administrator decide whether to fix a thing alone or\nto call. The Administrator Manual's <em>Troubleshooting<\/em> chapter\nholds the customer-level problems; this guide adds the method, the\nplaces to look, the safe ways to correct the books, and the shop and\npayment problems that come up in real life.<\/p>\n<h2 id=\"three-levels\">Three levels<\/h2>\n<div class=\"tablewrap\"><table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Level<\/th>\n<th>Who<\/th>\n<th>What they do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>1. The customer's administrator<\/strong><\/td>\n<td>The person who holds the Admin account<\/td>\n<td>Resets passwords, checks roles and settings, reads the manuals,\nrestarts a till's browser, looks at the screens listed in this guide.\nSolves most problems.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>2. NIWE support / technician<\/strong><\/td>\n<td>The person who looks after the server<\/td>\n<td>Reads the logs, checks the services, backups and the web server,\napplies upgrades, fixes configuration, helps with accounting questions,\ncollects the facts for level 3.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>3. Developer<\/strong><\/td>\n<td>The person who changes the program<\/td>\n<td>Fixes defects and writes migrations. Receives a complete report from\nlevel 2, never \"it does not work\".<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"how-urgent-is-it\">How urgent is it<\/h2>\n<div class=\"tablewrap\"><table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Severity<\/th>\n<th>Meaning<\/th>\n<th>Aim<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>1 Stopped<\/strong><\/td>\n<td>The system is down, nobody can sell, or money is being lost or taken\nwrongly (for example payments accepted and not recorded).<\/td>\n<td>Start at once; update the customer every hour.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>2 Hurt<\/strong><\/td>\n<td>A main function fails for some people (a till cannot print, a module\nwill not open, e-mail fails), with a workaround.<\/td>\n<td>The same day.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>3 Annoying<\/strong><\/td>\n<td>A wrong label, a slow report, a question.<\/td>\n<td>Within a few days.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>4 Wish<\/strong><\/td>\n<td>A request for a change.<\/td>\n<td>Collected for a later version.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"the-rules-that-keep-customers-safe\">The rules that keep\ncustomers safe<\/h2>\n<ol type=\"1\">\n<li><strong>Never change a customer's data by SQL<\/strong> on a live\ndatabase unless the developer has written the statement and you have a\nbackup taken <strong>just before<\/strong>. Use the program's own\nscreens: void, credit note, return, reversing journal entry.<\/li>\n<li><strong>Never edit or delete a migration<\/strong>, and never run an\nold jar against a database made by a newer one.<\/li>\n<li><strong>Never ask for a password<\/strong> on the phone or in a\nmessage. Ask the administrator to type it themselves, or reset it.<\/li>\n<li><strong>Never copy a customer's data<\/strong> (a backup, a\nscreenshot with customers' names) to a place that is not private, and\ndelete test copies when done.<\/li>\n<li><strong>Write it down.<\/strong> Every call gets a line in the\ncustomer's notes: what was reported, what was found, what was done, the\nversion, and the result.<\/li>\n<\/ol>\n", "text": " Who this guide is for This guide is for the people who help a customer when something is wrong: the first-line support contact, the technician who looks after the server, and the developer who is called when it is a defect. It also helps a customer's administrator decide whether to fix a thing alone or to call. The Administrator Manual's Troubleshooting chapter holds the customer-level problems; this guide adds the method, the places to look, the safe ways to correct the books, and the shop and payment problems that come up in real life. Three levels Level Who What they do 1. The customer's administrator The person who holds the Admin account Resets passwords, checks roles and settings, reads the manuals, restarts a till's browser, looks at the screens listed in this guide. Solves most problems. 2. NIWE support / technician The person who looks after the server Reads the logs, checks the services, backups and the web server, applies upgrades, fixes configuration, helps with accounting questions, collects the facts for level 3. 3. Developer The person who changes the program Fixes defects and writes migrations. Receives a complete report from level 2, never \"it does not work\". How urgent is it Severity Meaning Aim 1 Stopped The system is down, nobody can sell, or money is being lost or taken wrongly (for example payments accepted and not recorded). Start at once; update the customer every hour. 2 Hurt A main function fails for some people (a till cannot print, a module will not open, e-mail fails), with a workaround. The same day. 3 Annoying A wrong label, a slow report, a question. Within a few days. 4 Wish A request for a change. Collected for a later version. The rules that keep customers safe Never change a customer's data by SQL on a live database unless the developer has written the statement and you have a backup taken just before . Use the program's own screens: void, credit note, return, reversing journal entry. Never edit or delete a migration , and never run an old jar against a database made by a newer one. Never ask for a password on the phone or in a message. Ask the administrator to type it themselves, or reset it. Never copy a customer's data (a backup, a screenshot with customers' names) to a place that is not private, and delete test copies when done. Write it down. Every call gets a line in the customer's notes: what was reported, what was found, what was done, the version, and the result. "}, {"id": "support-2-collect-the-facts-first", "manual": "support", "n": 2, "title": "Collect the facts first", "html": "\n<p>A problem that arrives with the right facts is half solved. Ask for\nthese before you start, and write them in the ticket.<\/p>\n<h2 id=\"the-standard-information\">The standard information<\/h2>\n<ol type=\"1\">\n<li><strong>Who and where<\/strong>: the customer, the person, their\nrole, the device and browser.<\/li>\n<li><strong>The version<\/strong> of the program and the\n<strong>installation id<\/strong> (Settings &gt; Modules shows the\ninstallation id).<\/li>\n<li><strong>What they did<\/strong>: the exact steps and the screen, from\nthe menu.<\/li>\n<li><strong>What they expected<\/strong> and <strong>what\nhappened<\/strong>: the words of the message, word for word (a screenshot\nis best).<\/li>\n<li><strong>When<\/strong>: the date and time, to the minute, and whether\nit happened once or every time.<\/li>\n<li><strong>Since when<\/strong>: after an upgrade, a settings change, a\npower cut, a new user?<\/li>\n<li><strong>Who else<\/strong> is affected (everybody, one till, one\nperson)?<\/li>\n<li>For an order or a payment: the <strong>order code<\/strong> (for\nexample <code>9FMMY2MC<\/code>) or the invoice number, and the\n<strong>provider's reference<\/strong>.<\/li>\n<li>For an error: the <strong>request id<\/strong> and the matching lines\nof <code>niwe-erp-error.log<\/code> (Settings &gt; Server logs, or the\nfile on the server).<\/li>\n<\/ol>\n<h2 id=\"quick-facts-you-can-read-yourself\">Quick facts you can read\nyourself<\/h2>\n<ul>\n<li><strong>Is the service running?<\/strong>\n<code>systemctl status niwe-&lt;customer&gt;<\/code>;\n<code>curl -I https://&lt;address&gt;/api/public/store/...<\/code> or\njust open the address.<\/li>\n<li><strong>The log<\/strong>:\n<code>tail -n 200 /opt/niwe/&lt;customer&gt;/logs/niwe-erp-error.log<\/code>.\nSearch the request id, the order code, the person's user name.<\/li>\n<li><strong>The audit log<\/strong> (Settings &gt; Audit Log): who did\nwhat, when: voids, returns, price overrides, stock adjustments,\nsettlements, setting changes, with the person's name.<\/li>\n<li><strong>The sign-in log<\/strong> (Settings): successful and failed\nsign-ins and from where.<\/li>\n<li><strong>The journal<\/strong> (Accounting &gt; Journal entries): for\nan order, search its code; every entry from an online order ends with\nthe order number.<\/li>\n<li><strong>The order's history<\/strong> (Online Store &gt; Online\norders &gt; the order): every step with who and when, the code message\nresult (e-mail and text), and the reason of a refused completion.<\/li>\n<li><strong>Text messages<\/strong> (Online Store &gt; Text messages):\nevery text with its result.<\/li>\n<li><strong>Online payments<\/strong> (Online Store &gt; Online\npayments): every online payment with its status and flag.<\/li>\n<\/ul>\n<h2 id=\"what-to-send-the-developer\">What to send the developer<\/h2>\n<p>A complete report holds: the standard information above, the\n<strong>exact steps to repeat it<\/strong>, the <strong>log\nlines<\/strong> around the time (with the request id), a\n<strong>screenshot<\/strong>, what you already tried, whether it is\n<strong>repeatable on a copy of the data<\/strong> (restore a backup into\na spare database to try, never on live), and the severity. If it is\nabout money, add the order code, the invoice number, the journal entries\nand the amounts you expected.<\/p>\n", "text": " A problem that arrives with the right facts is half solved. Ask for these before you start, and write them in the ticket. The standard information Who and where : the customer, the person, their role, the device and browser. The version of the program and the installation id (Settings > Modules shows the installation id). What they did : the exact steps and the screen, from the menu. What they expected and what happened : the words of the message, word for word (a screenshot is best). When : the date and time, to the minute, and whether it happened once or every time. Since when : after an upgrade, a settings change, a power cut, a new user? Who else is affected (everybody, one till, one person)? For an order or a payment: the order code (for example 9FMMY2MC ) or the invoice number, and the provider's reference . For an error: the request id and the matching lines of niwe-erp-error.log (Settings > Server logs, or the file on the server). Quick facts you can read yourself Is the service running? systemctl status niwe-<customer> ; curl -I https://<address>/api/public/store/... or just open the address. The log : tail -n 200 /opt/niwe/<customer>/logs/niwe-erp-error.log . Search the request id, the order code, the person's user name. The audit log (Settings > Audit Log): who did what, when: voids, returns, price overrides, stock adjustments, settlements, setting changes, with the person's name. The sign-in log (Settings): successful and failed sign-ins and from where. The journal (Accounting > Journal entries): for an order, search its code; every entry from an online order ends with the order number. The order's history (Online Store > Online orders > the order): every step with who and when, the code message result (e-mail and text), and the reason of a refused completion. Text messages (Online Store > Text messages): every text with its result. Online payments (Online Store > Online payments): every online payment with its status and flag. What to send the developer A complete report holds: the standard information above, the exact steps to repeat it , the log lines around the time (with the request id), a screenshot , what you already tried, whether it is repeatable on a copy of the data (restore a backup into a spare database to try, never on live), and the severity. If it is about money, add the order code, the invoice number, the journal entries and the amounts you expected. "}, {"id": "support-3-symptoms-and-what-to-do", "manual": "support", "n": 3, "title": "Symptoms and what to do", "html": "\n<p>Each table gives the symptom, the likely cause and the first action.\nCustomer-level problems are also in the Administrator Manual (chapter\n14).<\/p>\n<h2 id=\"the-system-will-not-start-or-is-slow\">The system will not start,\nor is slow<\/h2>\n<div class=\"tablewrap\"><table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Symptom<\/th>\n<th>Likely cause<\/th>\n<th>First action<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>The address does not answer at all<\/td>\n<td>Server down, nginx stopped, certificate expired, DNS<\/td>\n<td>Check the server, <code>systemctl status nginx<\/code>, the\ncertificate date, the DNS record.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>nginx answers <em>502 Bad Gateway<\/em><\/td>\n<td>The backend is not running or is on another port<\/td>\n<td><code>systemctl status niwe-&lt;customer&gt;<\/code>; read the end of\nthe log; check the port in the settings and in the nginx file.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>The service stops by itself right after start<\/td>\n<td>A start-up error<\/td>\n<td>Read the first ERROR line in the log: database password,\n<em>Migration checksum<\/em>, <em>Schema-validation<\/em>, <em>address in\nuse<\/em>, <em>cannot write backups folder<\/em> (Installation guide,\nchapter 6).<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Very slow everywhere<\/td>\n<td>Disk full, memory, the database busy, a huge report<\/td>\n<td><code>df -h<\/code>, <code>free -m<\/code>, <code>top<\/code>; look at\nthe log for long requests; check that backups are not running in the\nmiddle of the day.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>After an upgrade: <em>a migration it does not know<\/em><\/td>\n<td>An older jar on a newer database<\/td>\n<td>Deploy the newer jar. Never use the old jar on that database.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>After a restore, the screens are wrong<\/td>\n<td>A backup from a different version<\/td>\n<td>Restore into the version that made it or newer. Restart the\napplication after a restore.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"sign-in-users-and-licence\">Sign-in, users and licence<\/h2>\n<div class=\"tablewrap\"><table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Symptom<\/th>\n<th>Likely cause<\/th>\n<th>First action<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Everybody is signed out at once<\/td>\n<td>The service restarted, or the sign-in secret changed<\/td>\n<td>Normal after an upgrade or after rotating\n<code>app.jwt.secret<\/code>. Sign in again.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>One person cannot sign in<\/td>\n<td>Wrong password, account inactive, locked after many tries<\/td>\n<td>The administrator resets the password on the Staff record; check\n<em>Active<\/em>; look at the sign-in log.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><em>Forgot password<\/em> sends nothing<\/td>\n<td>E-mail not set up, or the person has no e-mail on file<\/td>\n<td><strong>Send test email<\/strong>; the administrator sets a password\nby hand.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><em>PIN not recognized<\/em><\/td>\n<td>Wrong PIN, inactive person, or two people share it (not\nallowed)<\/td>\n<td>Reset the PIN on the Staff list.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>A module is missing or <em>not part of your licence<\/em><\/td>\n<td>Not in the licence, not activated, expired licence, or the role has\nno access<\/td>\n<td>Settings &gt; Modules: the state of each module; the expiry date;\nthe person's role.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><em>The developer switch is on<\/em><\/td>\n<td>The server was started with the <code>dev<\/code> profile<\/td>\n<td>Restart without the <code>dev<\/code> profile at once.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>A restored backup says the licence is invalid<\/td>\n<td>A new installation id (a new empty database) rather than a\nrestore<\/td>\n<td>A restore keeps the id. For a new database, ask NIWE for a licence\nfor the new id.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"tills-devices-and-printing\">Tills, devices and printing<\/h2>\n<div class=\"tablewrap\"><table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Symptom<\/th>\n<th>Likely cause<\/th>\n<th>First action<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td><em>Offline<\/em> at the till<\/td>\n<td>The connection to the server dropped<\/td>\n<td>Keep selling: sales queue and sync when it returns. Do not clear the\nbrowser; check the offline queue for <em>Failed<\/em> items\nafterwards.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>The till refuses: wrong device<\/td>\n<td>The register is bound to another PC<\/td>\n<td>The administrator unbinds it, or binds it to this PC.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>The thermal printer prints nothing<\/td>\n<td>Browser, https, connection<\/td>\n<td>Chrome or Edge on https or localhost; <em>Connect device<\/em>;\n<em>Print test page<\/em>; read the red line it prints.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Strange characters on receipts<\/td>\n<td>Code page<\/td>\n<td><em>Plain ASCII<\/em> in the device settings.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>A sale is refused for stock<\/td>\n<td>Negative stock is off<\/td>\n<td>Receive or adjust stock first.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"accounting-and-reports\">Accounting and reports<\/h2>\n<div class=\"tablewrap\"><table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Symptom<\/th>\n<th>Likely cause<\/th>\n<th>First action<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>The trial balance does not balance<\/td>\n<td>It cannot normally: every entry balances. A <em>Suspense<\/em>\nbalance means a posting was out of balance and the difference was\nparked<\/td>\n<td>Open Suspense in the ledger; find the entry; correct with a\nreversing entry; report the source type to the developer.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><em>Suspense<\/em> is not zero<\/td>\n<td>As above<\/td>\n<td>Same. It must be zero at every month-end.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><em>Cannot post: the books are closed<\/em><\/td>\n<td>A lock date is set<\/td>\n<td>An admin can reopen to a date (the reason is logged) or the entry is\ndated after the lock.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>A new account (Cash with Drivers, a provider account) is\nmissing<\/td>\n<td>The backfill after start-up has not run, or the chart is a custom\none<\/td>\n<td>Wait a minute after start and reload the chart; if still missing,\ntell the developer the version.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>A report looks wrong<\/td>\n<td>Filters, dates, the lock<\/td>\n<td>Check the dates and filters; open the Trial Balance line for the\nentries behind a figure.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Online reports do not match the invoices<\/td>\n<td>A sale counts on the day the order was <strong>completed<\/strong>,\nnot ordered<\/td>\n<td>Compare by completion date. A voided invoice shows 0.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"e-mail-and-text-messages\">E-mail and text messages<\/h2>\n<div class=\"tablewrap\"><table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Symptom<\/th>\n<th>Likely cause<\/th>\n<th>First action<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>No e-mail arrives (reset, newsletter, order updates)<\/td>\n<td>SMTP not set up or wrong; the mail provider refuses; spam\nfolder<\/td>\n<td><strong>Send test email<\/strong>; read the error; check the sending\nlimit of the provider. A failed e-mail never blocks the work\nitself.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Links in e-mails open the wrong site<\/td>\n<td><code>app.frontend-url<\/code> is wrong<\/td>\n<td>Set it to the public https address and restart.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>No text messages<\/td>\n<td>No provider chosen, daily limit, bad number<\/td>\n<td>Online Store &gt; Text messages shows each text and its result. With\nthe built-in sender, codes stay <em>Waiting for an SMS\ncompany<\/em>.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>A newsletter stays on <em>Sending<\/em><\/td>\n<td>Batches and the daily limit<\/td>\n<td>See the Administrator Manual (chapters 7 and 14).<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n", "text": " Each table gives the symptom, the likely cause and the first action. Customer-level problems are also in the Administrator Manual (chapter 14). The system will not start, or is slow Symptom Likely cause First action The address does not answer at all Server down, nginx stopped, certificate expired, DNS Check the server, systemctl status nginx , the certificate date, the DNS record. nginx answers 502 Bad Gateway The backend is not running or is on another port systemctl status niwe-<customer> ; read the end of the log; check the port in the settings and in the nginx file. The service stops by itself right after start A start-up error Read the first ERROR line in the log: database password, Migration checksum , Schema-validation , address in use , cannot write backups folder (Installation guide, chapter 6). Very slow everywhere Disk full, memory, the database busy, a huge report df -h , free -m , top ; look at the log for long requests; check that backups are not running in the middle of the day. After an upgrade: a migration it does not know An older jar on a newer database Deploy the newer jar. Never use the old jar on that database. After a restore, the screens are wrong A backup from a different version Restore into the version that made it or newer. Restart the application after a restore. Sign-in, users and licence Symptom Likely cause First action Everybody is signed out at once The service restarted, or the sign-in secret changed Normal after an upgrade or after rotating app.jwt.secret . Sign in again. One person cannot sign in Wrong password, account inactive, locked after many tries The administrator resets the password on the Staff record; check Active ; look at the sign-in log. Forgot password sends nothing E-mail not set up, or the person has no e-mail on file Send test email ; the administrator sets a password by hand. PIN not recognized Wrong PIN, inactive person, or two people share it (not allowed) Reset the PIN on the Staff list. A module is missing or not part of your licence Not in the licence, not activated, expired licence, or the role has no access Settings > Modules: the state of each module; the expiry date; the person's role. The developer switch is on The server was started with the dev profile Restart without the dev profile at once. A restored backup says the licence is invalid A new installation id (a new empty database) rather than a restore A restore keeps the id. For a new database, ask NIWE for a licence for the new id. Tills, devices and printing Symptom Likely cause First action Offline at the till The connection to the server dropped Keep selling: sales queue and sync when it returns. Do not clear the browser; check the offline queue for Failed items afterwards. The till refuses: wrong device The register is bound to another PC The administrator unbinds it, or binds it to this PC. The thermal printer prints nothing Browser, https, connection Chrome or Edge on https or localhost; Connect device ; Print test page ; read the red line it prints. Strange characters on receipts Code page Plain ASCII in the device settings. A sale is refused for stock Negative stock is off Receive or adjust stock first. Accounting and reports Symptom Likely cause First action The trial balance does not balance It cannot normally: every entry balances. A Suspense balance means a posting was out of balance and the difference was parked Open Suspense in the ledger; find the entry; correct with a reversing entry; report the source type to the developer. Suspense is not zero As above Same. It must be zero at every month-end. Cannot post: the books are closed A lock date is set An admin can reopen to a date (the reason is logged) or the entry is dated after the lock. A new account (Cash with Drivers, a provider account) is missing The backfill after start-up has not run, or the chart is a custom one Wait a minute after start and reload the chart; if still missing, tell the developer the version. A report looks wrong Filters, dates, the lock Check the dates and filters; open the Trial Balance line for the entries behind a figure. Online reports do not match the invoices A sale counts on the day the order was completed , not ordered Compare by completion date. A voided invoice shows 0. E-mail and text messages Symptom Likely cause First action No e-mail arrives (reset, newsletter, order updates) SMTP not set up or wrong; the mail provider refuses; spam folder Send test email ; read the error; check the sending limit of the provider. A failed e-mail never blocks the work itself. Links in e-mails open the wrong site app.frontend-url is wrong Set it to the public https address and restart. No text messages No provider chosen, daily limit, bad number Online Store > Text messages shows each text and its result. With the built-in sender, codes stay Waiting for an SMS company . A newsletter stays on Sending Batches and the daily limit See the Administrator Manual (chapters 7 and 14). "}, {"id": "support-4-the-online-shop-payments-and-deliveries", "manual": "support", "n": 4, "title": "The online shop,\npayments and deliveries", "html": "\n<p>Money and customers are involved here, so be careful and write down\nwhat you see before you change anything.<\/p>\n<h2 id=\"the-customer-paid-but-the-order-did-not-arrive\">\"The customer\npaid but the order did not arrive\"<\/h2>\n<ol type=\"1\">\n<li>Open <strong>Online Store &gt; Online payments<\/strong> and search\nthe customer's phone or the amount. Look at the <strong>status<\/strong>\nand the flag.<\/li>\n<li><strong>Pending<\/strong>: the customer has not approved the prompt,\nor the provider's answer has not come yet. The shop asks the provider\nabout every pending payment about once a minute; wait a few minutes. If\nit stays pending long after it should have closed it shows under\n<em>Stuck pending<\/em>. Ask the customer to look for the prompt on their\nphone; a payment not approved within the shop's limit expires and the\ncustomer can pay again from the order page.<\/li>\n<li><strong>Paid<\/strong> but no order in <strong>New<\/strong>: the\norder reaches the shop when the payment is confirmed; reload Online\norders and look in <strong>Awaiting payment<\/strong> too.<\/li>\n<li><strong>Under review<\/strong>: the amount or currency differed from\nthe order, or the order was paid twice. The money is with the provider,\n<strong>not in the books<\/strong> until a person deals with it. See the\nnext section.<\/li>\n<li><strong>Failed<\/strong> or <strong>Expired<\/strong>: nothing was\ntaken; the customer can try again.<\/li>\n<li>The provider's own portal shows the truth about the money: check the\npayment there by the reference. If the provider says\n<strong>paid<\/strong> and the shop says <strong>pending<\/strong> for\nmore than ten minutes, check that the <strong>webhook address<\/strong>\nis given to the provider, that the provider's keys are valid (the server\nlog says when a call to the provider fails), and that\n<code>app.frontend-url<\/code> and https are right. Collect the order\ncode and the provider's reference and send the developer a full\nreport.<\/li>\n<\/ol>\n<div class=\"callout warning\">\n<p><strong>Warning:<\/strong> Do not complete an order by hand to \"make\nit work\" while its payment is unclear. Settle what happened to the money\nfirst.<\/p>\n<\/div>\n<h2 id=\"a-payment-under-review\">A payment under review<\/h2>\n<p>Open it, read why. Typical cases:<\/p>\n<ul>\n<li><strong>Paid twice<\/strong> for one order: refund the second payment\nthrough the provider (Airtel: from the Airtel Money account, by hand),\nor record the refund you made yourself with its reference; write what\nyou did; press <strong>Mark as dealt with<\/strong>.<\/li>\n<li><strong>A different amount<\/strong>: decide with the customer\nwhether to refund the whole amount and let them order again, or refund\nthe difference. Never edit the order's price to fit the payment.<\/li>\n<li>After you press <strong>Mark as dealt with<\/strong> nothing is\nposted automatically: the books receive a payment only through the\nnormal order steps, and a refund you made is booked when you record it\non the order. If money is still sitting unposted, tell the accountant\nand the developer.<\/li>\n<\/ul>\n<h2 id=\"a-refund\">A refund<\/h2>\n<ul>\n<li>Cancelled or rejected order, paid online: the order shows in\n<strong>Refunds due<\/strong>. <strong>Refund through the\nprovider<\/strong> (MTN) or by hand (Airtel; any provider that cannot do\nit) and then <strong>I refunded it myself<\/strong> with the\nreference.<\/li>\n<li><em>The provider did not confirm the refund<\/em>: check the\nprovider's portal first. If it went through, record it by hand with the\nreference; <strong>never repeat a refund<\/strong>.<\/li>\n<li>A completed order: use <strong>Returns<\/strong>, not Online\norders.<\/li>\n<li>Check afterwards that the provider's <strong>clearing\naccount<\/strong> has gone down by the refund.<\/li>\n<\/ul>\n<h2 id=\"the-providers-balance-does-not-match-its-statement\">\"The\nprovider's balance does not match its statement\"<\/h2>\n<p>Each provider's clearing account (what it still owes the shop) should\nequal what it has collected since its last payout, minus refunds it\nmade, minus its fees if it keeps them. When it does not:<\/p>\n<ol type=\"1\">\n<li>List what the provider's statement shows for the period: collected\npayments, refunds, fees, payouts. List what the <strong>Payouts<\/strong>\npanel and the clearing account's ledger show.<\/li>\n<li><strong>A payment in the statement and not in the ledger<\/strong>:\nit is <em>Under review<\/em>, <em>Pending<\/em>, or an order that was paid\nbefore the accounts existed. Find it by the reference.<\/li>\n<li><strong>A payout missing<\/strong>: record it (gross, fee, date,\nreference). <strong>A payout recorded twice or against the wrong\nprovider<\/strong>: the accountant corrects it with a reversing journal\nentry.<\/li>\n<li><strong>A fee not recorded<\/strong>: it is part of the payout record\n(gross minus fee reaches the bank).<\/li>\n<li><strong>A balance on the old shared Mobile Money account<\/strong>:\npayments from before the provider accounts existed. Clear it with a\npayout of the way <em>Mobile money (earlier payments)<\/em>.<\/li>\n<li><strong>A refund by hand not recorded<\/strong>: record it on the\norder.<\/li>\n<\/ol>\n<p>A balance that keeps growing means payouts are not being recorded; a\nbalance that goes negative means a payout was recorded twice or for the\nwrong provider.<\/p>\n<h2 id=\"driver-cash-does-not-match\">Driver cash does not match<\/h2>\n<p><em>Cash with Drivers<\/em> in the ledger should equal the <em>To hand\nin<\/em> total of <strong>Driver cash<\/strong>. A difference means: an\norder was delivered before version 1.72 (its cash went to Cash and\nBank); a settlement was posted twice or by hand; or a delivery order\npaid in cash was completed without the cash being recorded (the driver's\ncustomer tapped <em>I received my order<\/em>: that does not prove the\nmoney was collected). A settlement cannot be undone on its screen: the\naccountant corrects it with a journal entry. If a driver's total never\nmatches, check the delivery fee product's tax (a tax added on top makes\nthe cash recorded higher than what the customer paid).<\/p>\n<h2 id=\"deliveries-and-codes\">Deliveries and codes<\/h2>\n<div class=\"tablewrap\"><table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Symptom<\/th>\n<th>Likely cause<\/th>\n<th>First action<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>The customer has no delivery code<\/td>\n<td>The message did not arrive, or the text company is not\nconnected<\/td>\n<td>The code is on his order page and in My orders; the order history\nsays how each message went; staff press <strong>Send a new code to the\ncustomer<\/strong>.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>The driver gets \"wrong code\"<\/td>\n<td>Typed wrongly, or an old code after a new one was sent<\/td>\n<td>Ask the customer to read the code again from his order page. Five\nwrong tries block it for 30 minutes: a new code unlocks it.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>The driver's page says \"please call the shop\"<\/td>\n<td>The completion was refused (stock, batch, another reason)<\/td>\n<td>The order's history has the real reason; fix it (for example stock)\nand try again.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>The driver cannot open his link<\/td>\n<td>Link switched off or replaced, driver not active, five wrong PINs,\nwrong <code>app.frontend-url<\/code>, no https<\/td>\n<td><strong>Show link<\/strong> or <strong>Give a link<\/strong> again;\nmake a <strong>New PIN<\/strong>; check the address.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>An order stays <em>Out for delivery<\/em><\/td>\n<td>Nobody completed it<\/td>\n<td>Complete it with the code, or record <strong>Delivery\nfailed<\/strong>.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>A customer cannot choose a delivery time<\/td>\n<td>Windows are off, full, too close, closed day, beyond days ahead, or\na pick-up order<\/td>\n<td>Shop settings &gt; Delivery times; <strong>Change time<\/strong> on\nthe order lets staff pick any window.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>After a failed visit the customer cannot rebook<\/td>\n<td>Windows are off, or the order is not <em>Packed after a failed\nvisit<\/em><\/td>\n<td>Staff use <strong>Change time<\/strong> and phone the customer.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>A return pick-up cannot be completed<\/td>\n<td>No driver assigned, wrong return code, five wrong tries, the order\nwas picked up at the shop<\/td>\n<td>Assign the driver; <strong>New return code (send again)<\/strong>.\nFor a shop pick-up order the customer brings the goods back.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"stock-and-prices-on-the-shop\">Stock and prices on the shop<\/h2>\n<div class=\"tablewrap\"><table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Symptom<\/th>\n<th>Likely cause<\/th>\n<th>First action<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>A product says <em>Sold out<\/em> but stock exists<\/td>\n<td>Buffer, share kept for the till, units held by unanswered orders,\nexpired batches, stock not in a Sales location<\/td>\n<td>Read the line under the product in Shop settings &gt; Products on\nthe shop: it lists every figure (Administrator Manual, chapter 7).<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>A customer was sold something that is not there<\/td>\n<td>Over-promised: an order was accepted with <strong>Accept\nanyway<\/strong><\/td>\n<td>Phone the customer; receive stock or cancel the order.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>An online price is wrong<\/td>\n<td>An online price was typed on the product, or a promotion applies, or\nthe price list<\/td>\n<td>The product row shows <em>Offer from Sales: price (name)<\/em>.\n<strong>Apply now<\/strong> recalculates; prices refresh every 2\nminutes.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>A product does not appear<\/td>\n<td>Not added, <strong>Shown<\/strong> unticked, inactive, or a variant\nswitched off<\/td>\n<td>Products on the shop.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>A link pasted in WhatsApp has no card<\/td>\n<td>The nginx rule or <code>app.frontend-url<\/code><\/td>\n<td><code>curl -A \"facebookexternalhit/1.1\" \"https://&lt;address&gt;/shop?product=12\"<\/code>\nmust return a page with <code>og:title<\/code>. WhatsApp keeps old\npreviews for a while: add <code>&amp;v=2<\/code> to the link.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n", "text": " Money and customers are involved here, so be careful and write down what you see before you change anything. \"The customer paid but the order did not arrive\" Open Online Store > Online payments and search the customer's phone or the amount. Look at the status and the flag. Pending : the customer has not approved the prompt, or the provider's answer has not come yet. The shop asks the provider about every pending payment about once a minute; wait a few minutes. If it stays pending long after it should have closed it shows under Stuck pending . Ask the customer to look for the prompt on their phone; a payment not approved within the shop's limit expires and the customer can pay again from the order page. Paid but no order in New : the order reaches the shop when the payment is confirmed; reload Online orders and look in Awaiting payment too. Under review : the amount or currency differed from the order, or the order was paid twice. The money is with the provider, not in the books until a person deals with it. See the next section. Failed or Expired : nothing was taken; the customer can try again. The provider's own portal shows the truth about the money: check the payment there by the reference. If the provider says paid and the shop says pending for more than ten minutes, check that the webhook address is given to the provider, that the provider's keys are valid (the server log says when a call to the provider fails), and that app.frontend-url and https are right. Collect the order code and the provider's reference and send the developer a full report. Warning: Do not complete an order by hand to \"make it work\" while its payment is unclear. Settle what happened to the money first. A payment under review Open it, read why. Typical cases: Paid twice for one order: refund the second payment through the provider (Airtel: from the Airtel Money account, by hand), or record the refund you made yourself with its reference; write what you did; press Mark as dealt with . A different amount : decide with the customer whether to refund the whole amount and let them order again, or refund the difference. Never edit the order's price to fit the payment. After you press Mark as dealt with nothing is posted automatically: the books receive a payment only through the normal order steps, and a refund you made is booked when you record it on the order. If money is still sitting unposted, tell the accountant and the developer. A refund Cancelled or rejected order, paid online: the order shows in Refunds due . Refund through the provider (MTN) or by hand (Airtel; any provider that cannot do it) and then I refunded it myself with the reference. The provider did not confirm the refund : check the provider's portal first. If it went through, record it by hand with the reference; never repeat a refund . A completed order: use Returns , not Online orders. Check afterwards that the provider's clearing account has gone down by the refund. \"The provider's balance does not match its statement\" Each provider's clearing account (what it still owes the shop) should equal what it has collected since its last payout, minus refunds it made, minus its fees if it keeps them. When it does not: List what the provider's statement shows for the period: collected payments, refunds, fees, payouts. List what the Payouts panel and the clearing account's ledger show. A payment in the statement and not in the ledger : it is Under review , Pending , or an order that was paid before the accounts existed. Find it by the reference. A payout missing : record it (gross, fee, date, reference). A payout recorded twice or against the wrong provider : the accountant corrects it with a reversing journal entry. A fee not recorded : it is part of the payout record (gross minus fee reaches the bank). A balance on the old shared Mobile Money account : payments from before the provider accounts existed. Clear it with a payout of the way Mobile money (earlier payments) . A refund by hand not recorded : record it on the order. A balance that keeps growing means payouts are not being recorded; a balance that goes negative means a payout was recorded twice or for the wrong provider. Driver cash does not match Cash with Drivers in the ledger should equal the To hand in total of Driver cash . A difference means: an order was delivered before version 1.72 (its cash went to Cash and Bank); a settlement was posted twice or by hand; or a delivery order paid in cash was completed without the cash being recorded (the driver's customer tapped I received my order : that does not prove the money was collected). A settlement cannot be undone on its screen: the accountant corrects it with a journal entry. If a driver's total never matches, check the delivery fee product's tax (a tax added on top makes the cash recorded higher than what the customer paid). Deliveries and codes Symptom Likely cause First action The customer has no delivery code The message did not arrive, or the text company is not connected The code is on his order page and in My orders; the order history says how each message went; staff press Send a new code to the customer . The driver gets \"wrong code\" Typed wrongly, or an old code after a new one was sent Ask the customer to read the code again from his order page. Five wrong tries block it for 30 minutes: a new code unlocks it. The driver's page says \"please call the shop\" The completion was refused (stock, batch, another reason) The order's history has the real reason; fix it (for example stock) and try again. The driver cannot open his link Link switched off or replaced, driver not active, five wrong PINs, wrong app.frontend-url , no https Show link or Give a link again; make a New PIN ; check the address. An order stays Out for delivery Nobody completed it Complete it with the code, or record Delivery failed . A customer cannot choose a delivery time Windows are off, full, too close, closed day, beyond days ahead, or a pick-up order Shop settings > Delivery times; Change time on the order lets staff pick any window. After a failed visit the customer cannot rebook Windows are off, or the order is not Packed after a failed visit Staff use Change time and phone the customer. A return pick-up cannot be completed No driver assigned, wrong return code, five wrong tries, the order was picked up at the shop Assign the driver; New return code (send again) . For a shop pick-up order the customer brings the goods back. Stock and prices on the shop Symptom Likely cause First action A product says Sold out but stock exists Buffer, share kept for the till, units held by unanswered orders, expired batches, stock not in a Sales location Read the line under the product in Shop settings > Products on the shop: it lists every figure (Administrator Manual, chapter 7). A customer was sold something that is not there Over-promised: an order was accepted with Accept anyway Phone the customer; receive stock or cancel the order. An online price is wrong An online price was typed on the product, or a promotion applies, or the price list The product row shows Offer from Sales: price (name) . Apply now recalculates; prices refresh every 2 minutes. A product does not appear Not added, Shown unticked, inactive, or a variant switched off Products on the shop. A link pasted in WhatsApp has no card The nginx rule or app.frontend-url curl -A \"facebookexternalhit/1.1\" \"https://<address>/shop?product=12\" must return a page with og:title . WhatsApp keeps old previews for a while: add &v=2 to the link. "}, {"id": "support-5-correcting-mistakes-safely", "manual": "support", "n": 5, "title": "Correcting mistakes safely", "html": "\n<p>NIWE ERP keeps an honest trail: most things are <strong>voided,\ncredited, returned or reversed<\/strong>, not deleted, and every\ncorrection is in the audit log with the person's name. Use that.<\/p>\n<h2 id=\"which-tool-for-which-mistake\">Which tool for which mistake<\/h2>\n<div class=\"tablewrap\"><table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Mistake<\/th>\n<th>Tool<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>A draft document is wrong<\/td>\n<td>Edit or delete it<\/td>\n<td>Only a draft can be changed freely.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>An issued invoice is wrong<\/td>\n<td><strong>Void<\/strong> it (or <strong>cancel and credit<\/strong> it\nif payments exist) and create it again<\/td>\n<td>The stock and the books follow.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Goods came back<\/td>\n<td><strong>Sale order return<\/strong> (or <strong>Process a\nreturn<\/strong> at the till)<\/td>\n<td>Takes the VAT and the cost back too.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>A wrong stock quantity<\/td>\n<td><strong>Stock adjustment<\/strong> or a <strong>stock\ncount<\/strong><\/td>\n<td>Always with a reason.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>A wrong manual journal entry<\/td>\n<td>A <strong>reversing entry<\/strong><\/td>\n<td>Posted entries are not edited.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>A wrong amount handed in by a driver<\/td>\n<td>A <strong>journal entry<\/strong> on Cash with Drivers, Cash and Bank\nand Cash Over / Short<\/td>\n<td>A settlement cannot be undone on its screen.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>A payout recorded twice or for the wrong provider<\/td>\n<td>A <strong>reversing journal entry<\/strong> by the accountant<\/td>\n<td>Keep the provider's reference in the memo.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>A refund made by hand and not recorded<\/td>\n<td>Record it on the order (<strong>I refunded it myself<\/strong> with\nthe reference)<\/td>\n<td><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>A payment that is <em>Under review<\/em><\/td>\n<td>Deal with it, write what you did, <strong>Mark as dealt\nwith<\/strong><\/td>\n<td>It is not in the books until then.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>A wrong amount in a closed month<\/td>\n<td>An <strong>admin<\/strong> reopens the books to a date (the reason is\nlogged), the correction is made, the books are closed again<\/td>\n<td>Or post the correction in the open period with a clear memo.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>A customer's data to remove<\/td>\n<td>The customer deletes their account in the portal; staff\n<strong>Remove<\/strong> a newsletter address or an abandoned cart<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"what-never-to-do\">What never to do<\/h2>\n<ul>\n<li><strong>Never delete rows by SQL<\/strong> on a live database to\n\"tidy up\": the books reference them.<\/li>\n<li><strong>Never edit a posted journal line<\/strong> in the\ndatabase.<\/li>\n<li><strong>Never change a licence or an installation id<\/strong> by\nhand.<\/li>\n<li><strong>Never restore a backup over a live system<\/strong> without\ntaking a fresh backup of the current state first and telling everyone. A\nrestore replaces the whole database: sales since the backup are\nlost.<\/li>\n<li><strong>Never turn on the <code>dev<\/code> profile<\/strong> to\nbypass a licence or a permission.<\/li>\n<\/ul>\n<h2 id=\"if-a-restore-really-is-needed\">If a restore really is\nneeded<\/h2>\n<ol type=\"1\">\n<li>Take a <strong>fresh backup<\/strong> of the current state (so you\ncan go back).<\/li>\n<li>Tell the customer what will be lost (everything entered since the\nbackup chosen) and get their yes.<\/li>\n<li>Restore (Settings &gt; Backup &amp; Data &gt; Restore, or the\ndatabase tools: Installation guide, chapter 7). The system is in\nmaintenance mode while it runs.<\/li>\n<li><strong>Restart<\/strong> the application and check the data.<\/li>\n<li>Help the business re-enter what was lost, from paper and from the\ntills' queues.<\/li>\n<\/ol>\n<h2 id=\"when-sql-is-unavoidable\">When SQL is unavoidable<\/h2>\n<p>Sometimes a defect leaves data in a state no screen can fix. Then:\nthe developer writes and reviews the statement; you take a\n<strong>backup immediately before<\/strong>; you run it in a transaction\non a <strong>copy first<\/strong>; you run it on the live database with\nthe customer's agreement; you check the result in the screens; and you\nwrite the statement and its result in the customer's notes. A fix that\nis needed twice becomes a migration or a screen.<\/p>\n", "text": " NIWE ERP keeps an honest trail: most things are voided, credited, returned or reversed , not deleted, and every correction is in the audit log with the person's name. Use that. Which tool for which mistake Mistake Tool Notes A draft document is wrong Edit or delete it Only a draft can be changed freely. An issued invoice is wrong Void it (or cancel and credit it if payments exist) and create it again The stock and the books follow. Goods came back Sale order return (or Process a return at the till) Takes the VAT and the cost back too. A wrong stock quantity Stock adjustment or a stock count Always with a reason. A wrong manual journal entry A reversing entry Posted entries are not edited. A wrong amount handed in by a driver A journal entry on Cash with Drivers, Cash and Bank and Cash Over / Short A settlement cannot be undone on its screen. A payout recorded twice or for the wrong provider A reversing journal entry by the accountant Keep the provider's reference in the memo. A refund made by hand and not recorded Record it on the order ( I refunded it myself with the reference) A payment that is Under review Deal with it, write what you did, Mark as dealt with It is not in the books until then. A wrong amount in a closed month An admin reopens the books to a date (the reason is logged), the correction is made, the books are closed again Or post the correction in the open period with a clear memo. A customer's data to remove The customer deletes their account in the portal; staff Remove a newsletter address or an abandoned cart What never to do Never delete rows by SQL on a live database to \"tidy up\": the books reference them. Never edit a posted journal line in the database. Never change a licence or an installation id by hand. Never restore a backup over a live system without taking a fresh backup of the current state fir
