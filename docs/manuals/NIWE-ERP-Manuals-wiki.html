le (the screen shows only the last part of a large file). Before the server has written anything the page says No log files yet . Only files whose names start with niwe- and end with .log appear here. Other files in the same folder are never shown or downloadable from the screen. When you ask NIWE for support, send the request id and the relevant part of niwe-erp-error.log . The log behaviour is controlled by the app.logging.* properties in the backend settings (folder, size and number of files to keep). The account that runs the service must be allowed to write in the log folder; if it is not, no log files appear. Tip: After installing the backend as a service, start it once, then open Settings > Server logs to confirm the files appear. If the page says No log files yet , check that the service account can write in the jar's folder (it has to create the logs folder). Other places to look The dashboard has a Needs your attention section (overdue invoices, low stock, pending approvals and similar). Settings > Modules shows the licence status and expiry. Each module's Overview and Reports pages show its day-to-day health. "}, {"id": "admin-12-upgrades-and-migrations", "manual": "admin", "n": 12, "title": "Upgrades and migrations", "html": "\n<h2 id=\"how-the-database-stays-in-step\">How the database stays in\nstep<\/h2>\n<p>The database structure is owned by <strong>Flyway<\/strong>. Each\nrelease carries numbered SQL migration files; on start-up Flyway applies\nany the database has not seen and records them in the\n<code>flyway_schema_history<\/code> table. Hibernate only\n<em>validates<\/em> that the code and the database agree\n(<code>ddl-auto=validate<\/code>); it never changes tables.<\/p>\n<p>Rules that matter to an administrator:<\/p>\n<ol type=\"1\">\n<li><strong>Never edit or delete a migration that has been\napplied.<\/strong> Flyway stores a checksum and refuses to start if a\nfile changed.<\/li>\n<li>A new release is simply started: the new migrations run once, each\nin its own transaction.<\/li>\n<li><strong>Back up first.<\/strong> Always (chapter 10).<\/li>\n<\/ol>\n<h2 id=\"installing-a-new-release\">Installing a new release<\/h2>\n<p>Each release is delivered as a package (for example\n<code>niwe-pos-v1.22.0.tgz<\/code>) with its own release notes\n(<code>RELEASE-NOTES-v1.22.0.md<\/code>). The usual steps:<\/p>\n<ol type=\"1\">\n<li>Announce a short maintenance window. Take a <strong>Backup\nnow<\/strong> and download it.<\/li>\n<li>Stop the backend.<\/li>\n<li>Unpack the package over the project folder.<\/li>\n<li>Run the release's apply script(s), as named in the release notes:\n<code>tools/apply-vXXXX.py<\/code> and\n<code>tools/wire-vXXX.py frontend/src/app<\/code>.<\/li>\n<li>Build the frontend and the backend.<\/li>\n<li>Start the backend. Watch the log for Flyway applying the new\nmigrations and for <em>Started PosApplication<\/em>.<\/li>\n<li>Open the system, sign in, and check <strong>Settings &gt;\nModules<\/strong> (licence and module states) and a few screens.<\/li>\n<\/ol>\n<p>If a release adds a new permission (for example <em>Approve large\nasset disposals<\/em>), nobody has it until you grant it under\n<strong>Staff<\/strong>; Admins have all permissions automatically.<\/p>\n<h2 id=\"the-first-time-on-an-old-database-one-time-per-database\">The\nfirst time on an old database (one time per database)<\/h2>\n<p>The current builds start with schema validation. If an old database\nwas created before Flyway and lacks tables or columns:<\/p>\n<ol type=\"1\">\n<li>Take a backup.<\/li>\n<li>Start the backend <strong>once<\/strong> with the extra profile\n<code>dbsync<\/code> (for example\n<code>mvn spring-boot:run -Dspring-boot.run.profiles=dbsync<\/code>, or\nyour usual profile plus <code>dbsync<\/code>).<\/li>\n<li>Wait for <em>Started PosApplication<\/em>, then stop it.<\/li>\n<li>Start normally. Flyway baselines the database and carries on.<\/li>\n<\/ol>\n<div class=\"callout warning\">\n<p><strong>Warning:<\/strong> Never use <code>dbsync<\/code> on a database\nthat Flyway already manages.<\/p>\n<\/div>\n<p>A database created during development with the older 23 migrations\nmust be dropped and recreated (safe only if it has no real data),\nbecause the single V1 baseline has a different checksum.<\/p>\n<h2 id=\"version-history-in-brief\">Version history in brief<\/h2>\n<div class=\"tablewrap\"><table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Version<\/th>\n<th>Main theme<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>1.1<\/td>\n<td>Module licensing<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>1.2 to 1.4<\/td>\n<td>Property Management, Real Estate and Law firm improvements<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>1.5<\/td>\n<td>Core: paging, search and exports everywhere; collections; imports\nwith check-first; accounting controls; price lists; promotions, gift\ncards and loyalty<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>1.6 to 1.10<\/td>\n<td>HR and Payroll, Hotel, Restaurant, POS, Manufacturing; decimal\nquantities<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>1.11<\/td>\n<td>Receipt tax ID, dashboard paging, sales feature switches<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>1.12<\/td>\n<td>Thermal printing and COM customer display<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>1.13<\/td>\n<td>Register tied to one device<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>1.14<\/td>\n<td>Server logs, sign-in log, wider audit log<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>1.15 to 1.22<\/td>\n<td>Work orders, Time tracking, Booking, Installments, Subscriptions,\nHelp Desk, Expenses, Assets<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>1.23 to 1.26<\/td>\n<td>French throughout: screens, messages, lists, reports and printed\ndocuments<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>1.27<\/td>\n<td>Online Store: the public shop, cash orders<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>1.28 to 1.34<\/td>\n<td>Online Store: shop improvements, online payments (simulated\nprovider, then MTN Mobile Money), customer accounts, coupons, text\nmessages, returns and refunds<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>1.35 to 1.36<\/td>\n<td>Online Store: a full first page (announcement, banner pictures that\nslide, product rows, reviews, newsletter, footer), Reviews and\nNewsletter screens, \"Sellable now\" figures<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"if-a-start-up-fails\">If a start-up fails<\/h2>\n<ul>\n<li><em>Migration checksum mismatch<\/em>: a migration file was changed\nafter being applied. Restore the original file.<\/li>\n<li><em>Schema-validation: missing column/table<\/em>: the database is\nbehind the code. Run the one-time <code>dbsync<\/code> start described\nabove (after a backup).<\/li>\n<li>A message naming a <em>migration it does not know<\/em>: you are\nrunning an older build against a database made by a newer one. Deploy\nthe newer build.<\/li>\n<\/ul>\n", "text": " How the database stays in step The database structure is owned by Flyway . Each release carries numbered SQL migration files; on start-up Flyway applies any the database has not seen and records them in the flyway_schema_history table. Hibernate only validates that the code and the database agree ( ddl-auto=validate ); it never changes tables. Rules that matter to an administrator: Never edit or delete a migration that has been applied. Flyway stores a checksum and refuses to start if a file changed. A new release is simply started: the new migrations run once, each in its own transaction. Back up first. Always (chapter 10). Installing a new release Each release is delivered as a package (for example niwe-pos-v1.22.0.tgz ) with its own release notes ( RELEASE-NOTES-v1.22.0.md ). The usual steps: Announce a short maintenance window. Take a Backup now and download it. Stop the backend. Unpack the package over the project folder. Run the release's apply script(s), as named in the release notes: tools/apply-vXXXX.py and tools/wire-vXXX.py frontend/src/app . Build the frontend and the backend. Start the backend. Watch the log for Flyway applying the new migrations and for Started PosApplication . Open the system, sign in, and check Settings > Modules (licence and module states) and a few screens. If a release adds a new permission (for example Approve large asset disposals ), nobody has it until you grant it under Staff ; Admins have all permissions automatically. The first time on an old database (one time per database) The current builds start with schema validation. If an old database was created before Flyway and lacks tables or columns: Take a backup. Start the backend once with the extra profile dbsync (for example mvn spring-boot:run -Dspring-boot.run.profiles=dbsync , or your usual profile plus dbsync ). Wait for Started PosApplication , then stop it. Start normally. Flyway baselines the database and carries on. Warning: Never use dbsync on a database that Flyway already manages. A database created during development with the older 23 migrations must be dropped and recreated (safe only if it has no real data), because the single V1 baseline has a different checksum. Version history in brief Version Main theme 1.1 Module licensing 1.2 to 1.4 Property Management, Real Estate and Law firm improvements 1.5 Core: paging, search and exports everywhere; collections; imports with check-first; accounting controls; price lists; promotions, gift cards and loyalty 1.6 to 1.10 HR and Payroll, Hotel, Restaurant, POS, Manufacturing; decimal quantities 1.11 Receipt tax ID, dashboard paging, sales feature switches 1.12 Thermal printing and COM customer display 1.13 Register tied to one device 1.14 Server logs, sign-in log, wider audit log 1.15 to 1.22 Work orders, Time tracking, Booking, Installments, Subscriptions, Help Desk, Expenses, Assets 1.23 to 1.26 French throughout: screens, messages, lists, reports and printed documents 1.27 Online Store: the public shop, cash orders 1.28 to 1.34 Online Store: shop improvements, online payments (simulated provider, then MTN Mobile Money), customer accounts, coupons, text messages, returns and refunds 1.35 to 1.36 Online Store: a full first page (announcement, banner pictures that slide, product rows, reviews, newsletter, footer), Reviews and Newsletter screens, \"Sellable now\" figures If a start-up fails Migration checksum mismatch : a migration file was changed after being applied. Restore the original file. Schema-validation: missing column/table : the database is behind the code. Run the one-time dbsync start described above (after a backup). A message naming a migration it does not know : you are running an older build against a database made by a newer one. Deploy the newer build. "}, {"id": "admin-13-security-checklist", "manual": "admin", "n": 13, "title": "Security checklist", "html": "\n<p>Work through this list before the system holds real data, and again\nonce a year.<\/p>\n<h2 id=\"before-going-live\">Before going live<\/h2>\n<ul class=\"task-list\">\n<li><label><input type=\"checkbox\" /><strong>Change the admin\npassword<\/strong> and remove or deactivate the demo <code>cashier<\/code>\naccount (or change its password and PIN).<\/label><\/li>\n<li><label><input type=\"checkbox\" />Change <strong>all terminal\nPINs<\/strong> from the demo values (1234 and 5678).<\/label><\/li>\n<li><label><input type=\"checkbox\" />Set a long random\n<strong><code>JWT_SECRET<\/code><\/strong> (the\n<code>app.jwt.secret<\/code> setting). Anyone who knows it can forge a\nsign-in.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Set\n<strong><code>app.seed-demo-data=false<\/code><\/strong>.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Use your own database user and\npassword (<code>DB_USER<\/code>, <code>DB_PASSWORD<\/code>), never share\nthem in files that are copied around, and do not expose the database\nport to the network.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Serve the system over\n<strong>https<\/strong> (a reverse proxy or web server certificate). This\nis also required for direct thermal printing on till PCs that are not on\nlocalhost.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Set\n<code>app.cors.allowed-origins<\/code> to your real address\nonly.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Make sure the\n<strong><code>dev<\/code> profile<\/strong> is never used and\n<code>app.license.dev-all-modules<\/code> is off.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Set up <strong>E-mail\nsettings<\/strong> so that staff can use <em>Forgot password?<\/em>, and\ngive each person an e-mail address.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Confirm that a nightly backup exists\nand that a copy leaves the server.<\/label><\/li>\n<\/ul>\n<h2 id=\"ongoing\">Ongoing<\/h2>\n<ul>\n<li>Give each person their own account; use custom roles and the\napproval permissions rather than extra Admins.<\/li>\n<li>Review <strong>Staff<\/strong> quarterly and untick <em>Active<\/em>\nfor leavers immediately.<\/li>\n<li>Review the <strong>Sign-in log<\/strong> weekly for repeated\nfailures.<\/li>\n<li>Review the <strong>Audit Log<\/strong> for voids, returns, price\noverrides and stock adjustments.<\/li>\n<li>Keep the server's operating system, Java, PostgreSQL and the browser\nup to date.<\/li>\n<li>Restrict who can reach the server physically and by remote\naccess.<\/li>\n<li>Bind each register to its till PC (chapter 8) where tills sit in\npublic areas.<\/li>\n<li>Download a backup before every upgrade and keep one off-site.<\/li>\n<\/ul>\n<h2 id=\"if-you-open-the-online-store-to-the-internet\">If you open the\nOnline Store to the internet<\/h2>\n<p>The public shop is the one part of NIWE ERP meant for strangers, so\ntreat the server as exposed.<\/p>\n<ul>\n<li>Serve it over <strong>HTTPS only<\/strong> (a certificate on the web\nserver or load balancer) and keep the admin screens behind the same\naddress or a separate one you can restrict.<\/li>\n<li>Only <code>/shop<\/code>, <code>/shop/order/...<\/code> and the\n<code>/api/public/...<\/code> addresses are meant to be public. The staff\nscreens still need a sign-in, and the shop's server calls never return\ncosts, suppliers or other customers.<\/li>\n<li>Set <code>server.forward-headers-strategy=native<\/code> when a proxy\nsits in front, so the per-connection limit works (chapter 7).<\/li>\n<li>Keep <strong>Orders waiting per phone<\/strong> and <strong>Orders\nper connection per hour<\/strong> low, watch the <strong>New<\/strong>\norders tab, and phone a customer before packing an unusual order.<\/li>\n<li>Only <code>/shop<\/code>, <code>/shop/order/...<\/code>,\n<code>/shop/newsletter/...<\/code> and the <code>/api/public/...<\/code>\naddresses are public. Customer sign-in uses one-time codes that expire\nand are limited; reviews, newsletter sign-ups and returns are limited\nper connection and per phone number, and a hidden field catches simple\nrobots.<\/li>\n<li>Online payments: keep the payment provider's keys in the server's\nenvironment, never in a file that is copied or committed, and use the\n<strong>live<\/strong> keys only on the live server. A payment call-back\nis never believed on its own: the shop checks the payment again with the\nprovider.<\/li>\n<li>Banner pictures are checked by their content, not their name, and\nshrunk; the footer and banner links written by staff are limited to\n<code>/<\/code>, <code>https://<\/code>, <code>http://<\/code>,\n<code>mailto:<\/code> and <code>tel:<\/code> addresses.<\/li>\n<li>Customers' names, phone numbers, addresses and newsletter e-mail\naddresses are personal data: back up daily, keep the backups private,\nand check what the data-protection rules of your country require before\nyou launch.<\/li>\n<li>Have the server tested by someone outside the team before the shop\nis announced.<\/li>\n<\/ul>\n<h2 id=\"what-the-system-does-for-you\">What the system does for you<\/h2>\n<ul>\n<li>Passwords and PINs are stored securely, not in clear text.<\/li>\n<li>Sign-in uses signed tokens that expire; every server request is\nchecked against the person's role, areas and branch access, not just\nhidden in the menu.<\/li>\n<li>Locked modules are refused by the server, not only hidden.<\/li>\n<li>Deleting is limited: most records are voided, reversed or\ndeactivated, leaving a trail in the audit log.<\/li>\n<\/ul>\n", "text": " Work through this list before the system holds real data, and again once a year. Before going live Change the admin password and remove or deactivate the demo cashier account (or change its password and PIN). Change all terminal PINs from the demo values (1234 and 5678). Set a long random JWT_SECRET (the app.jwt.secret setting). Anyone who knows it can forge a sign-in. Set app.seed-demo-data=false . Use your own database user and password ( DB_USER , DB_PASSWORD ), never share them in files that are copied around, and do not expose the database port to the network. Serve the system over https (a reverse proxy or web server certificate). This is also required for direct thermal printing on till PCs that are not on localhost. Set app.cors.allowed-origins to your real address only. Make sure the dev profile is never used and app.license.dev-all-modules is off. Set up E-mail settings so that staff can use Forgot password? , and give each person an e-mail address. Confirm that a nightly backup exists and that a copy leaves the server. Ongoing Give each person their own account; use custom roles and the approval permissions rather than extra Admins. Review Staff quarterly and untick Active for leavers immediately. Review the Sign-in log weekly for repeated failures. Review the Audit Log for voids, returns, price overrides and stock adjustments. Keep the server's operating system, Java, PostgreSQL and the browser up to date. Restrict who can reach the server physically and by remote access. Bind each register to its till PC (chapter 8) where tills sit in public areas. Download a backup before every upgrade and keep one off-site. If you open the Online Store to the internet The public shop is the one part of NIWE ERP meant for strangers, so treat the server as exposed. Serve it over HTTPS only (a certificate on the web server or load balancer) and keep the admin screens behind the same address or a separate one you can restrict. Only /shop , /shop/order/... and the /api/public/... addresses are meant to be public. The staff screens still need a sign-in, and the shop's server calls never return costs, suppliers or other customers. Set server.forward-headers-strategy=native when a proxy sits in front, so the per-connection limit works (chapter 7). Keep Orders waiting per phone and Orders per connection per hour low, watch the New orders tab, and phone a customer before packing an unusual order. Only /shop , /shop/order/... , /shop/newsletter/... and the /api/public/... addresses are public. Customer sign-in uses one-time codes that expire and are limited; reviews, newsletter sign-ups and returns are limited per connection and per phone number, and a hidden field catches simple robots. Online payments: keep the payment provider's keys in the server's environment, never in a file that is copied or committed, and use the live keys only on the live server. A payment call-back is never believed on its own: the shop checks the payment again with the provider. Banner pictures are checked by their content, not their name, and shrunk; the footer and banner links written by staff are limited to / , https:// , http:// , mailto: and tel: addresses. Customers' names, phone numbers, addresses and newsletter e-mail addresses are personal data: back up daily, keep the backups private, and check what the data-protection rules of your country require before you launch. Have the server tested by someone outside the team before the shop is announced. What the system does for you Passwords and PINs are stored securely, not in clear text. Sign-in uses signed tokens that expire; every server request is checked against the person's role, areas and branch access, not just hidden in the menu. Locked modules are refused by the server, not only hidden. Deleting is limited: most records are voided, reversed or deactivated, leaving a trail in the audit log. "}, {"id": "admin-14-troubleshooting", "manual": "admin", "n": 14, "title": "Troubleshooting", "html": "\n<div class=\"tablewrap\"><table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Problem<\/th>\n<th>Likely cause and what to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>A module is missing from the menu<\/strong><\/td>\n<td>It is not in the licence, not yet activated, or the person's role\nhas no access to it. Check <strong>Settings &gt; Modules<\/strong>.\nActivation is by an Admin and is permanent.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>\"X is not part of your license\" (403)<\/strong><\/td>\n<td>The module is locked. Install a licence that contains it (chapter\n3).<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>All non-core modules locked suddenly<\/strong><\/td>\n<td>The licence has expired. Nothing is lost. Install the renewal.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>A person cannot see a screen they should<\/strong><\/td>\n<td>Their custom role has <em>No access<\/em> for its area, the role is\n<em>inactive<\/em>, or the screen is admin-only (Settings, Staff,\nBackup). See the area table in chapter 4.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>A cashier cannot approve a void/discount<\/strong><\/td>\n<td>They lack the matching approval permission. Add it under\n<strong>Extra permissions<\/strong> on their staff record, or ask an\nAdmin to type their PIN.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>\"PIN not recognized\" at the terminal<\/strong><\/td>\n<td>The PIN is wrong, or belongs to an inactive person. PINs are 4 to 6\ndigits and unique among active staff. Reset it on the Staff list.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>A till says it is refused / wrong device<\/strong><\/td>\n<td>The register is bound to another device. Unbind it (Admin) or bind\nit to this PC (chapter 8).<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Cannot sell: warehouse message<\/strong><\/td>\n<td>Multi-warehouse is on and the register still uses the Main\nwarehouse. Assign a different warehouse to the register.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Sale refused because of stock<\/strong><\/td>\n<td><em>Allow negative stock<\/em> is off and the sale would oversell.\nReceive stock or adjust it.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>A thermal printer does nothing<\/strong><\/td>\n<td>Check the connection type, that the browser is Chrome or Edge on\nhttps/localhost, press <em>Connect device...<\/em>, then <em>Print test\npage<\/em>. A red line on the printout says why it fell back to the\ndriver.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Strange characters on receipts<\/strong><\/td>\n<td>Change the code page to <em>Plain ASCII<\/em> in the PC's device\nsettings.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>No e-mail arrives<\/strong><\/td>\n<td>Check <strong>Email settings<\/strong> and use <strong>Send test\nemail<\/strong>. Check the recipient's address and the server log. A\nfailed e-mail never blocks the work itself.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Daily job did not run<\/strong><\/td>\n<td>Check the module settings for the job's on/off switch and time, and\nthat the time zone in System settings is right. A job runs when the\nserver is next up that day.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Backup restore stuck on \"please wait\"<\/strong><\/td>\n<td>Restore is running. Wait, then restart the application when it\nfinishes.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Server will not start: checksum or schema\nmessage<\/strong><\/td>\n<td>See chapter 12, <em>If a start-up fails<\/em>.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Import skips many rows<\/strong><\/td>\n<td>Read the reasons in <em>Rows that will be skipped<\/em> after\n<strong>Check file<\/strong>; correct and check again.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>A report looks wrong<\/strong><\/td>\n<td>Check the filters and dates, and whether the books were closed for\nthat period (Accounting &gt; Controls).<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>A user forgot their password<\/strong><\/td>\n<td>If they have an e-mail address on file, use <em>Forgot\npassword?<\/em> on the sign-in screen. Otherwise an Admin sets a new\npassword on the Staff record.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"the-online-shop\">The online shop<\/h2>\n<div class=\"tablewrap\"><table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Problem<\/th>\n<th>Likely cause and what to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>The shop says \"Sold out\" but I have stock<\/strong><\/td>\n<td>The shop sells <em>stock in sellable locations − reserved on\nconfirmed sales orders − Units kept back for the till<\/em> (default 1).\nOpen <strong>Online Store &gt; Shop settings &gt; Products on the\nshop<\/strong>: the line under the product shows each number. A single\nunit shows as sold out because of the buffer (set it to 0 to change\nthat). Stock in a <em>Receiving<\/em>, <em>Damaged<\/em> or inactive\nlocation, or never entered per warehouse, is not counted: move it to a\nsales location with a stock transfer. Goods promised on confirmed sales\norders are not counted either.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>A product does not appear on the shop<\/strong><\/td>\n<td>It is not added in <strong>Products on the shop<\/strong>,\n<strong>Shown<\/strong> is unticked, or the product is inactive. A\nproduct appears in a row only when its tick (<strong>Featured<\/strong>,\n<strong>Best seller<\/strong>, <strong>Offer<\/strong>,\n<strong>New<\/strong>) is on.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>The first page has no banner picture, or shows a plain\ncolour<\/strong><\/td>\n<td>No banner picture is uploaded (Shop settings &gt; Front page &gt;\nBanner pictures), or the upload was refused: only JPEG, PNG, WebP and\nGIF pictures up to 8 MB are accepted, at most 8.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>A review does not appear<\/strong><\/td>\n<td>New reviews wait for staff: approve it in <strong>Online Store &gt;\nReviews<\/strong>. Only reviews with words appear on the first page, and\nonly for completed orders.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>A customer pressed Subscribe but nothing\narrived<\/strong><\/td>\n<td>The newsletter needs working e-mail settings (<strong>Send test\nemail<\/strong>, chapter 9). Ask them to look in the spam folder; an\naddress can ask for a new e-mail once every 10 minutes. The address\nstays <strong>Not confirmed<\/strong> until the link is opened.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>The confirmation or unsubscribe link opens the wrong\nsite<\/strong><\/td>\n<td><code>app.frontend-url<\/code> is not set to the public address of\nthe site (chapter 7). The unsubscribe links in the downloaded newsletter\nlist are built from the same setting.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>The online payment option is missing at\ncheckout<\/strong><\/td>\n<td><strong>Customers can pay online<\/strong> is off, no provider is\nchosen, or the provider is not available (for MTN: not switched on, a\nkey missing, or the base address is not https; the server log says\nwhich).<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>An order stays \"Awaiting payment\"<\/strong><\/td>\n<td>The customer has not approved the payment. A pending payment is\nchecked about once a minute and the order is cancelled after a day. Look\nat <strong>Online Store &gt; Online payments<\/strong> for <em>Stuck\npending<\/em>.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>A payment is under review<\/strong><\/td>\n<td>The amount or currency the provider reports differs from the order,\nor the order was paid twice. Look at it in <strong>Online\npayments<\/strong>, handle it (refund the difference if needed) and press\n<strong>Mark as dealt with<\/strong>.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>A refund says the provider did not confirm it<\/strong><\/td>\n<td>Check the refund in the provider's portal. If it went through,\nrecord it by hand with the provider's reference (<strong>I refunded it\nmyself<\/strong>); never refund twice.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>No texts are sent<\/strong><\/td>\n<td>No text provider is chosen, the daily limit is reached, or the\nnumber is not valid. <strong>Online Store &gt; Text messages<\/strong>\nlists every text with its result.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Everyone is \"too many requests\"<\/strong><\/td>\n<td>The server sits behind a proxy and\n<code>server.forward-headers-strategy=native<\/code> is not set (chapter\n7).<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"when-you-contact-support\">When you contact support<\/h2>\n<p>Send NIWE: the <strong>version number<\/strong>, the\n<strong>installation id<\/strong> (Settings &gt; Modules), what you did,\nwhat you expected and what happened, a screenshot, and the\n<strong>request id<\/strong> and the matching lines from\n<code>niwe-erp-error.log<\/code> (Settings &gt; Server logs).<\/p>\n", "text": " Problem Likely cause and what to do A module is missing from the menu It is not in the licence, not yet activated, or the person's role has no access to it. Check Settings > Modules . Activation is by an Admin and is permanent. \"X is not part of your license\" (403) The module is locked. Install a licence that contains it (chapter 3). All non-core modules locked suddenly The licence has expired. Nothing is lost. Install the renewal. A person cannot see a screen they should Their custom role has No access for its area, the role is inactive , or the screen is admin-only (Settings, Staff, Backup). See the area table in chapter 4. A cashier cannot approve a void/discount They lack the matching approval permission. Add it under Extra permissions on their staff record, or ask an Admin to type their PIN. \"PIN not recognized\" at the terminal The PIN is wrong, or belongs to an inactive person. PINs are 4 to 6 digits and unique among active staff. Reset it on the Staff list. A till says it is refused / wrong device The register is bound to another device. Unbind it (Admin) or bind it to this PC (chapter 8). Cannot sell: warehouse message Multi-warehouse is on and the register still uses the Main warehouse. Assign a different warehouse to the register. Sale refused because of stock Allow negative stock is off and the sale would oversell. Receive stock or adjust it. A thermal printer does nothing Check the connection type, that the browser is Chrome or Edge on https/localhost, press Connect device... , then Print test page . A red line on the printout says why it fell back to the driver. Strange characters on receipts Change the code page to Plain ASCII in the PC's device settings. No e-mail arrives Check Email settings and use Send test email . Check the recipient's address and the server log. A failed e-mail never blocks the work itself. Daily job did not run Check the module settings for the job's on/off switch and time, and that the time zone in System settings is right. A job runs when the server is next up that day. Backup restore stuck on \"please wait\" Restore is running. Wait, then restart the application when it finishes. Server will not start: checksum or schema message See chapter 12, If a start-up fails . Import skips many rows Read the reasons in Rows that will be skipped after Check file ; correct and check again. A report looks wrong Check the filters and dates, and whether the books were closed for that period (Accounting > Controls). A user forgot their password If they have an e-mail address on file, use Forgot password? on the sign-in screen. Otherwise an Admin sets a new password on the Staff record. The online shop Problem Likely cause and what to do The shop says \"Sold out\" but I have stock The shop sells stock in sellable locations − reserved on confirmed sales orders − Units kept back for the till (default 1). Open Online Store > Shop settings > Products on the shop : the line under the product shows each number. A single unit shows as sold out because of the buffer (set it to 0 to change that). Stock in a Receiving , Damaged or inactive location, or never entered per warehouse, is not counted: move it to a sales location with a stock transfer. Goods promised on confirmed sales orders are not counted either. A product does not appear on the shop It is not added in Products on the shop , Shown is unticked, or the product is inactive. A product appears in a row only when its tick ( Featured , Best seller , Offer , New ) is on. The first page has no banner picture, or shows a plain colour No banner picture is uploaded (Shop settings > Front page > Banner pictures), or the upload was refused: only JPEG, PNG, WebP and GIF pictures up to 8 MB are accepted, at most 8. A review does not appear New reviews wait for staff: approve it in Online Store > Reviews . Only reviews with words appear on the first page, and only for completed orders. A customer pressed Subscribe but nothing arrived The newsletter needs working e-mail settings ( Send test email , chapter 9). Ask them to look in the spam folder; an address can ask for a new e-mail once every 10 minutes. The address stays Not confirmed until the link is opened. The confirmation or unsubscribe link opens the wrong site app.frontend-url is not set to the public address of the site (chapter 7). The unsubscribe links in the downloaded newsletter list are built from the same setting. The online payment option is missing at checkout Customers can pay online is off, no provider is chosen, or the provider is not available (for MTN: not switched on, a key missing, or the base address is not https; the server log says which). An order stays \"Awaiting payment\" The customer has not approved the payment. A pending payment is checked about once a minute and the order is cancelled after a day. Look at Online Store > Online payments for Stuck pending . A payment is under review The amount or currency the provider reports differs from the order, or the order was paid twice. Look at it in Online payments , handle it (refund the difference if needed) and press Mark as dealt with . A refund says the provider did not confirm it Check the refund in the provider's portal. If it went through, record it by hand with the provider's reference ( I refunded it myself ); never refund twice. No texts are sent No text provider is chosen, the daily limit is reached, or the number is not valid. Online Store > Text messages lists every text with its result. Everyone is \"too many requests\" The server sits behind a proxy and server.forward-headers-strategy=native is not set (chapter 7). When you contact support Send NIWE: the version number , the installation id (Settings > Modules), what you did, what you expected and what happened, a screenshot, and the request id and the matching lines from niwe-erp-error.log (Settings > Server logs). "}, {"id": "user-1-about-this-manual-and-getting-started", "manual": "user", "n": 1, "title": "About this manual and\ngetting started", "html": "\n<h2 id=\"who-this-manual-is-for\">Who this manual is for<\/h2>\n<p>This is the <strong>User Manual<\/strong> for NIWE ERP. It is for\neveryone who uses the system day to day: cashiers, sales staff, store\nkeepers, accountants, HR officers, front-desk and booking staff,\nmanagers and owners. It explains <strong>what you do<\/strong> in each\npart of the system, step by step, using the words you see on screen.<\/p>\n<p>You do not need to read it from start to finish. Read <em>Getting\nstarted<\/em> (this chapter), then the chapter or chapters for your own\nwork. The last page of each chapter lists the <strong>reports<\/strong>\nfor that module.<\/p>\n<p>Setting up the system (users, licences, printers, backups) is covered\nin the separate <strong>Administrator Manual<\/strong>. If you are a\ncashier, accountant or store keeper, the one-page <strong>Quick-start\ncard<\/strong> for your role is the fastest way to start.<\/p>\n<div class=\"callout note\">\n<p><strong>Note:<\/strong> You only see the parts of the system your\nbusiness has switched on and that your job needs. If a menu in this\nmanual is missing on your screen, your business may not use that module,\nor your role may not include it. Ask your administrator.<\/p>\n<\/div>\n<h2 id=\"signing-in\">Signing in<\/h2>\n<ol type=\"1\">\n<li>Open the system address in your browser (Chrome or Edge is\nrecommended). The home page shows a <strong>Staff Login<\/strong> button,\nand, if your business has switched them on, tiles for public pages such\nas booking or help requests.<\/li>\n<li>Press <strong>Staff Login<\/strong> and enter your\n<strong>Username<\/strong> and <strong>Password<\/strong>.<\/li>\n<li>After signing in you land on the screen that suits your role:\ncashiers on the registers list, managers on the dashboard, and so\non.<\/li>\n<\/ol>\n<p>If you forget your password, press <strong>Forgot password?<\/strong>\non the sign-in screen. A link is e-mailed to the address on your\nprofile. If you have no e-mail address on your profile, ask an\nadministrator to set a new password for you.<\/p>\n<div class=\"callout warning\">\n<p><strong>Warning:<\/strong> Never share your password or PIN.\nEverything you do is recorded under your name in the audit log.<\/p>\n<\/div>\n<h2 id=\"your-profile\">Your profile<\/h2>\n<p>Open <strong>My profile<\/strong> from the menu to:<\/p>\n<ul>\n<li>Change your <strong>Full name<\/strong> and <strong>Email<\/strong>.\nYour e-mail is needed to use <em>Forgot password?<\/em>.<\/li>\n<li><strong>Change password<\/strong>: enter your <strong>Current\npassword<\/strong>, a <strong>New password<\/strong> and <strong>Confirm\nnew password<\/strong>.<\/li>\n<li><strong>Change PIN<\/strong>: your PIN (4 to 6 digits) identifies you\nat the sales terminal and when you approve something at the till. It\nmust be different from every other active staff member's PIN.<\/li>\n<\/ul>\n<h2 id=\"appearance\">Appearance<\/h2>\n<p><strong>Appearance<\/strong> (under your settings) lets you choose\n<strong>Light<\/strong>, <strong>Dark<\/strong> or your own colours (a\npage background and an accent colour). The choice is saved for your\naccount and follows you to any device. Printed receipts, purchase orders\nand reports always stay white so that they print cleanly.<\/p>\n<h2 id=\"language\">Language<\/h2>\n<p>Use the language selector on the top bar (or on the sign-in page) to\nswitch between <strong>English<\/strong> and <strong>Français<\/strong>.\nYour choice is kept on this browser and wins over the business default.\nIf you have not chosen, you see the language your business set (Chad\nbusinesses start in French). Every module's screens, messages and report\nheadings are translated; printed documents (PDFs), e-mails and most\nmessages from the server are written in your <strong>business<\/strong>\nlanguage (Settings &gt; System settings), not in the language you picked\non your own screen, so that a customer gets a document in the language\nof the business. A few messages that carry a status word can still show\nthat word in English.<\/p>\n<h2 id=\"finding-your-way-around\">Finding your way around<\/h2>\n<ul>\n<li>The <strong>menu on the left<\/strong> is grouped by module (POS,\nSales, Customers, Inventory, Accounting, and so on). Click a group to\nopen it. On a phone, open the menu with the menu button at the top.<\/li>\n<li>Most lists have a <strong>search box<\/strong>,\n<strong>filters<\/strong> and <strong>quick views<\/strong> at the top,\npaging at the bottom, and <strong>Excel, PDF and CSV<\/strong> export\nbuttons that export exactly what is filtered on screen.<\/li>\n<li>Most records follow a path: <em>Draft<\/em> (you can still change\nit), then confirmed or issued, then paid or completed. Mistakes after\nthat are corrected by a <strong>void<\/strong>, a <strong>credit\nnote<\/strong> or a <strong>return<\/strong>, not by deleting, so that the\nbooks stay honest.<\/li>\n<li>Where a button is greyed out or missing, you either do not have the\npermission or the record is in a state that does not allow it.<\/li>\n<\/ul>\n<h2 id=\"approvals-manager-pin\">Approvals (manager PIN)<\/h2>\n<p>Some actions need a second person: a large discount, a void, a return\nafter many days, a hand-changed price, a big cash paid-out, an expense\nabove a limit. When this happens the screen asks for a <strong>Manager\nPIN<\/strong>, or says that an approver is needed. A manager types their\nown PIN on your screen; their name is recorded as the approver. You\nnever need to know their PIN.<\/p>\n<h2 id=\"my-hr-for-every-employee\">My HR (for every employee)<\/h2>\n<p>If your login is linked to an employee record, <strong>My HR<\/strong>\nshows your <strong>payslips<\/strong>, <strong>leave balance<\/strong>,\n<strong>attendance<\/strong> and documents, and lets you <strong>Clock\nin<\/strong> and <strong>Clock out<\/strong>, <strong>Request\nleave<\/strong> (choose the type, the dates, whether the first or last\nday is a half day, and a reason), and update your own <strong>contact\ndetails<\/strong> (phone, e-mail, address, emergency contact). Your bank\naccount, tax number and job details can only be changed by HR. If you\nsee \"Your login isn't linked to an employee record\", ask HR to link\nit.<\/p>\n<h2 id=\"dashboard\">Dashboard<\/h2>\n<p>Managers and accountants with access see the\n<strong>Dashboard<\/strong>, which summarises sales, stock and money owed\nand has a <strong>Needs your attention<\/strong> section: overdue\ninvoices, low stock, pending approvals and similar items that need\naction.<\/p>\n<h2 id=\"tips-that-apply-everywhere\">Tips that apply everywhere<\/h2>\n<ul>\n<li><strong>Type to search<\/strong> in any picker (customer, product,\nsupplier) instead of scrolling.<\/li>\n<li><strong>Export<\/strong> buttons give you the same list you are\nlooking at, filtered the same way.<\/li>\n<li><strong>Print and PDF<\/strong> buttons are on documents such as\ninvoices, quotations, purchase orders and statements.<\/li>\n<li><strong>Attachments<\/strong>: many records let you attach files or\nphotos; use them for proof (a signed delivery note, a supplier's\ninvoice).<\/li>\n<li>If something looks wrong, do not delete and re-enter. Ask a manager\nhow to correct it, and keep the reference number.<\/li>\n<\/ul>\n", "text": " Who this manual is for This is the User Manual for NIWE ERP. It is for everyone who uses the system day to day: cashiers, sales staff, store keepers, accountants, HR officers, front-desk and booking staff, managers and owners. It explains what you do in each part of the system, step by step, using the words you see on screen. You do not need to read it from start to finish. Read Getting started (this chapter), then the chapter or chapters for your own work. The last page of each chapter lists the reports for that module. Setting up the system (users, licences, printers, backups) is covered in the separate Administrator Manual . If you are a cashier, accountant or store keeper, the one-page Quick-start card for your role is the fastest way to start. Note: You only see the parts of the system your business has switched on and that your job needs. If a menu in this manual is missing on your screen, your business may not use that module, or your role may not include it. Ask your administrator. Signing in Open the system address in your browser (Chrome or Edge is recommended). The home page shows a Staff Login button, and, if your business has switched them on, tiles for public pages such as booking or help requests. Press Staff Login and enter your Username and Password . After signing in you land on the screen that suits your role: cashiers on the registers list, managers on the dashboard, and so on. If you forget your password, press Forgot password? on the sign-in screen. A link is e-mailed to the address on your profile. If you have no e-mail address on your profile, ask an administrator to set a new password for you. Warning: Never share your password or PIN. Everything you do is recorded under your name in the audit log. Your profile Open My profile from the menu to: Change your Full name and Email . Your e-mail is needed to use Forgot password? . Change password : enter your Current password , a New password and Confirm new password . Change PIN : your PIN (4 to 6 digits) identifies you at the sales terminal and when you approve something at the till. It must be different from every other active staff member's PIN. Appearance Appearance (under your settings) lets you choose Light , Dark or your own colours (a page background and an accent colour). The choice is saved for your account and follows you to any device. Printed receipts, purchase orders and reports always stay white so that they print cleanly. Language Use the language selector on the top bar (or on the sign-in page) to switch between English and Français . Your choice is kept on this browser and wins over the business default. If you have not chosen, you see the language your business set (Chad businesses start in French). Every module's screens, messages and report headings are translated; printed documents (PDFs), e-mails and most messages from the server are written in your business language (Settings > System settings), not in the language you picked on your own screen, so that a customer gets a document in the language of the business. A few messages that carry a status word can still show that word in English. Finding your way around The menu on the left is grouped by module (POS, Sales, Customers, Inventory, Accounting, and so on). Click a group to open it. On a phone, open the menu with the menu button at the top. Most lists have a search box , filters and quick views at the top, paging at the bottom, and Excel, PDF and CSV export buttons that export exactly what is filtered on screen. Most records follow a path: Draft (you can still change it), then confirmed or issued, then paid or completed. Mistakes after that are corrected by a void , a credit note or a return , not by deleting, so that the books stay honest. Where a button is greyed out or missing, you either do not have the permission or the record is in a state that does not allow it. Approvals (manager PIN) Some actions need a second person: a large discount, a void, a return after many days, a hand-changed price, a big cash paid-out, an expense above a limit. When this happens the screen asks for a Manager PIN , or says that an approver is needed. A manager types their own PIN on your screen; their name is recorded as the approver. You never need to know their PIN. My HR (for every employee) If your login is linked to an employee record, My HR shows your payslips , leave balance , attendance and documents, and lets you Clock in and Clock out , Request leave (choose the type, the dates, whether the first or last day is a half day, and a reason), and update your own contact details (phone, e-mail, address, emergency contact). Your bank account, tax number and job details can only be changed by HR. If you see \"Your login isn't linked to an employee record\", ask HR to link it. Dashboard Managers and accountants with access see the Dashboard , which summarises sales, stock and money owed and has a Needs your attention section: overdue invoices, low stock, pending approvals and similar items that need action. Tips that apply everywhere Type to search in any picker (customer, product, supplier) instead of scrolling. Export buttons give you the same list you are looking at, filtered the same way. Print and PDF buttons are on documents such as invoices, quotations, purchase orders and statements. Attachments : many records let you attach files or photos; use them for proof (a signed delivery note, a supplier's invoice). If something looks wrong, do not delete and re-enter. Ask a manager how to correct it, and keep the reference number. "}, {"id": "user-2-pos-registers-the-sales-terminal-and-shi", "manual": "user", "n": 2, "title": "POS: registers, the\nsales terminal and shifts", "html": "\n<p>The <strong>POS<\/strong> (point of sale) group is where cashiers\nsell, count the till and handle returns. Its menu has: <strong>Registers\n&amp; Terminal, Shifts, Voids &amp; returns, Cash movements, POS\nsettings, Devices, Reports<\/strong>.<\/p>\n<h2 id=\"how-a-day-at-the-till-works\">How a day at the till works<\/h2>\n<ol type=\"1\">\n<li>A manager or admin <strong>opens a session (shift)<\/strong> on a\nregister and assigns it to a cashier, with an <strong>opening cash\nfloat<\/strong>.<\/li>\n<li>The cashier opens the <strong>terminal<\/strong> with their\n<strong>PIN<\/strong> and rings up sales. Payments are taken at\n<strong>Checkout<\/strong>.<\/li>\n<li>During the shift: cash <strong>paid in or out<\/strong>,\n<strong>drops into the safe<\/strong>, returns, and X reports as\nneeded.<\/li>\n<li>At the end the shift is <strong>closed<\/strong>: the drawer is\ncounted and the difference is recorded. A <strong>Z report<\/strong> is\nprinted.<\/li>\n<\/ol>\n<p>A <strong>register<\/strong> is the physical till. A\n<strong>session<\/strong> (or <strong>shift<\/strong>) is one working\nperiod on a register. One shift can have several\n<strong>cashiers<\/strong>, each with their own PIN and their own\ncarts.<\/p>\n<h2 id=\"opening-a-session\">Opening a session<\/h2>\n<p>Go to <strong>POS &gt; Registers &amp; Terminal<\/strong>. The list\nshows each register's <strong>Name, Location, Warehouse, Float,\nCashiers, Device<\/strong> and <strong>Status<\/strong> (<em>Switched\noff<\/em>, <em>Open session<\/em>, <em>Closed<\/em>).<\/p>\n<ol type=\"1\">\n<li>Press <strong>Open session<\/strong> on the register.<\/li>\n<li>In <strong>Assign to<\/strong>, choose the staff member who will work\nthe till.<\/li>\n<li>Enter the <strong>Opening cash float<\/strong>. (The most the till\nmay open with is shown.)<\/li>\n<li>Press <strong>Open till<\/strong>.<\/li>\n<\/ol>\n<p>If a register is tied to one PC, a note shows <em>Works on ...\nonly<\/em> and <em>Go to terminal<\/em> is available only on that PC.<\/p>\n<h2 id=\"opening-the-terminal\">Opening the terminal<\/h2>\n<p>Press <strong>Go to terminal<\/strong> on the open session. The\nterminal asks for your <strong>PIN<\/strong> first: type it and press\nEnter. A wrong PIN leaves the PIN screen up. If you do not have a PIN,\nask an admin to set one, or set your own in <strong>My\nprofile<\/strong>.<\/p>\n<div class=\"callout note\">\n<p><strong>Note:<\/strong> Your PIN opens <em>your own<\/em> working\nsession on the shift. Another cashier can use the same terminal by\npressing <strong>Switch cashier<\/strong> and typing their PIN; carts are\nkept separate.<\/p>\n<\/div>\n<h2 id=\"selling-at-the-terminal\">Selling at the terminal<\/h2>\n<h3 id=\"adding-items\">Adding items<\/h3>\n<ul>\n<li><strong>Scan a barcode<\/strong> into the barcode box (type it and\npress Enter), or tap a <strong>product tile<\/strong>, or <strong>search\nby name or SKU<\/strong>. The category tiles filter the product tiles.\n\"Showing the first 200 matches\" means: type more to narrow the\nsearch.<\/li>\n<li>Each line shows <strong>Item, Qty, Discount, Price<\/strong>. Use the\npencil to change quantity, the bin to remove a line. For serial-numbered\ngoods the terminal asks for the <strong>Serial no(s)<\/strong>.\nQuantities may be decimal where the product allows it (for example\n2.5).<\/li>\n<li>The cart shows <strong>Subtotal<\/strong>, <strong>Tax<\/strong>, any\n<strong>Discount on the sale<\/strong> and the\n<strong>Total<\/strong>.<\/li>\n<\/ul>\n<h3 id=\"customer\">Customer<\/h3>\n<p>Use the customer box to <strong>search by name or phone<\/strong>, or\npress <strong>Add<\/strong> to create one on the spot (name, phone,\ne-mail, <strong>Tax ID<\/strong>), which selects them for this sale. The\nbox shows if the customer <strong>Owes<\/strong> money, their\n<strong>available credit<\/strong>, and their <strong>loyalty\npoints<\/strong> and what the points are worth.<\/p>\n<h3 id=\"discounts\">Discounts<\/h3>\n<ul>\n<li><strong>% Discount<\/strong> gives a discount on the sale: choose\n<strong>Percent<\/strong> or <strong>Amount<\/strong>, enter it and a\n<strong>Reason<\/strong>.<\/li>\n<li>A cashier can give a discount only up to the limit in POS settings.\nA bigger one needs a manager's PIN (the <strong>Manager PIN<\/strong>\nbox). A reason is required when POS settings say so.<\/li>\n<li><strong>Promotions<\/strong> (such as buy-X-get-Y) apply\nautomatically and the cart shows <em>Saved with promotions<\/em>. Type a\n<strong>Coupon code<\/strong> and press <strong>Apply<\/strong> for\ncoupons.<\/li>\n<li>If your price differs from the product's price, the line shows\n<em>Price changed<\/em>. A manager may need to approve, and prices below\ncost may be refused.<\/li>\n<\/ul>\n<h3 id=\"several-carts-hold-and-discard\">Several carts: hold and\ndiscard<\/h3>\n<ul>\n<li><strong>+<\/strong> starts another cart tab. <strong>Hold<\/strong>\nparks the cart with a note and opens a new one. <strong>Discard<\/strong>\ncancels an open cart outright (stock is untouched).<\/li>\n<\/ul>\n<h3 id=\"payment-checkout\">Payment (checkout)<\/h3>\n<p>Press <strong>Payment<\/strong>. On <strong>Checkout<\/strong> choose\nhow the customer pays. Tap a payment method to enter an amount; you can\n<strong>split the payment across several methods<\/strong>.<\/p>\n<ul>\n<li><strong>Gift card<\/strong>: type the <strong>Gift card\ncode<\/strong>, press <strong>Check balance<\/strong>, then <strong>Use on\nthis sale<\/strong>.<\/li>\n<li><strong>Loyalty points<\/strong>: shows the points available and what\nthey are worth; enter the <strong>Points<\/strong> and press <strong>Use\npoints<\/strong>. Points can be used only when the amount reaches the\nminimum.<\/li>\n<li><strong>Store credit<\/strong> (credit sale): select a customer\nfirst. The customer must be enabled for credit (set on the customer\nrecord) and within their limit. You may set a <strong>Due date<\/strong>;\notherwise the customer's own payment term is used.<\/li>\n<li><strong>Charge to room<\/strong> (hotels): choose the guest who is\nchecked in and the <strong>Room<\/strong>.<\/li>\n<\/ul>\n<p>Press the final button to complete the sale. The receipt prints.\nChange due is shown for cash.<\/p>\n<h3 id=\"receipts-and-reprints\">Receipts and reprints<\/h3>\n<p><strong>Receipts<\/strong> shows this shift's completed sales (Time,\nInvoice, Customer, Total, Payment) with <strong>View / Reprint<\/strong>.\nThe first print is the original; each later print is marked <strong>COPY\n1, COPY 2...<\/strong> and is listed in <strong>Voids &amp;\nreturns<\/strong>.<\/p>\n<h3 id=\"gift-cards-at-the-till\">Gift cards at the till<\/h3>\n<p><strong>Gift card<\/strong> lets you <strong>Check / add\nmoney<\/strong> (type the code and press <strong>Check<\/strong>, see the\nbalance and expiry, then <strong>Add money<\/strong>) or <strong>Sell a\nnew card<\/strong> (amount, how it was paid, who it is for), and gives\nyou the code to hand over.<\/p>\n<h3 id=\"customer-display\">Customer display<\/h3>\n<p><strong>Customer display<\/strong> opens a second window for the\ncustomer showing the cart and total, then <em>Thank you<\/em>. Drag it to\nthe customer-facing screen.<\/p>\n<h3 id=\"offline-mode\">Offline mode<\/h3>\n<p>If the connection drops, the terminal shows <strong>Offline<\/strong>\nand keeps working from the catalogue of the last sync. Sales you ring up\nare <strong>queued<\/strong> on the PC (<strong>Offline queue<\/strong>)\nand sync automatically when the connection returns. Credit limits and\nsome checks are applied only when the sale syncs; a sale that cannot be\naccepted appears as <em>Failed<\/em> in the queue for review, where you\ncan <strong>Discard<\/strong> it or ask a manager.<\/p>\n<div class=\"callout warning\">\n<p><strong>Warning:<\/strong> Do not clear the browser's data or close\nthe browser while sales are waiting in the offline queue.<\/p>\n<\/div>\n<h3 id=\"other-terminal-buttons\">Other terminal buttons<\/h3>\n<p><strong>Cash<\/strong> (cash control), <strong>X report<\/strong>,\n<strong>Open drawer<\/strong>, <strong>Devices<\/strong> (printer set-up),\n<strong>Switch cashier<\/strong>, <strong>End my session<\/strong> (ends\n<em>your<\/em> session on the shift and discards carts you never checked\nout) and <strong>Exit<\/strong>.<\/p>\n<h2 id=\"cash-during-the-shift\">Cash during the shift<\/h2>\n<p>Press <strong>Cash<\/strong> to open the cash drawer screen. It shows\n<strong>Opening float, Cash sales, Cash refunds, Paid in, Paid out,\nDropped into the safe<\/strong> and <strong>Cash that should be in the\ndrawer<\/strong>.<\/p>\n<ul>\n<li><strong>Record<\/strong> a movement: choose the kind (<em>paid\nin<\/em>, <em>paid out<\/em>, <em>drop into the safe<\/em>), the\n<strong>Amount<\/strong>, and <strong>What was it for?<\/strong> A\npaid-out above the limit needs a <strong>Manager's PIN<\/strong>. If the\ndrawer holds more than the reminder level, you are told to drop some\ncash into the safe.<\/li>\n<li><strong>Count the drawer without closing the shift<\/strong> gives a\nspot check: nothing moves, and the difference is kept on record.<\/li>\n<li>A mistaken movement can be <strong>voided<\/strong> (a manager may be\nneeded). Voided movements stay visible.<\/li>\n<\/ul>\n<p>The page also has buttons for the <strong>X report<\/strong> and\n<strong>Z report<\/strong>, and <strong>Close the shift<\/strong>.<\/p>\n<h2 id=\"x-and-z-reports\">X and Z reports<\/h2>\n<ul>\n<li><strong>X report<\/strong>: a mid-shift snapshot of sales, payments,\nreturns and cash. Run it as often as you like; it changes nothing.<\/li>\n<li><strong>Z report<\/strong>: the closing report, numbered. It is\nprinted when the shift is closed.<\/li>\n<\/ul>\n<p>Both print to the receipt printer if one is set up.<\/p>\n<h2 id=\"closing-a-session\">Closing a session<\/h2>\n<ol type=\"1\">\n<li>Record any cash paid in, paid out or dropped, <strong>before\ncounting<\/strong>.<\/li>\n<li>Open the close screen. It shows <strong>Opening float, Cash sales,\nCash refunds, Paid in, Paid out, Dropped into the safe<\/strong> and\n<strong>Expected cash in drawer<\/strong>, plus <strong>Non-cash sales\n(card/mobile/bank)<\/strong> and <strong>Total sales this\nsession<\/strong>.<\/li>\n<li><strong>Count the drawer<\/strong> by notes and coins (enter the\nnumber of each denomination, or use <strong>+ Another value<\/strong>).\nThe system totals it.<\/li>\n<li>If the count differs from the expected cash by more than the allowed\namount, a note is required: <strong>Why is the count off?<\/strong><\/li>\n<li>Press <strong>Close session<\/strong>, then print the <strong>Z\nreport<\/strong>.<\/li>\n<\/ol>\n<p>Admins can <strong>Force close<\/strong> a shift or <strong>Close all\nsessions<\/strong> from <strong>POS &gt; Shifts<\/strong> if a cashier has\nleft without closing.<\/p>\n<h2 id=\"voids-and-returns\">Voids and returns<\/h2>\n<h3 id=\"returning-goods\">Returning goods<\/h3>\n<p>Use <strong>Process a return<\/strong>: type the <strong>Invoice\nnumber<\/strong> (for example the number on the receipt) and press\n<strong>Find<\/strong>. Choose the lines and <strong>Return qty<\/strong>\n(or <strong>Return all items<\/strong>), the <strong>Refund\nmethod<\/strong> and the <strong>Reason<\/strong>. Returns of old sales\n(older than the limit in POS settings), or refunds above a limit, need a\n<strong>Manager's PIN<\/strong>. Press <strong>Process return<\/strong>; a\nreturn receipt prints.<\/p>\n<h3 id=\"voiding-a-sale\">Voiding a sale<\/h3>\n<p>A sale can be voided only while its shift is open (after that it is a\nreturn). Voiding needs a manager's sign-in or PIN, and usually a\nreason.<\/p>\n<h3 id=\"the-log\">The log<\/h3>\n<p><strong>POS &gt; Voids &amp; returns<\/strong> lists every void,\nreturn, discount, price change and receipt reprint: When, What,\nReference, Customer, Register, By, Amount, Reason and <strong>Approved\nby<\/strong>. Use the search box and the register filter. This is where\nmanagers look when a till is short.<\/p>\n<h2 id=\"shifts-list-supervisors\">Shifts list (supervisors)<\/h2>\n<p><strong>POS &gt; Shifts<\/strong> lists shifts with <strong>Register,\nZ, Cashier, Opened, Closed, Status, Sales, Variance<\/strong>, with\nfilters for register and date, and buttons for <strong>Cash<\/strong>,\n<strong>X report<\/strong> and <strong>Z report<\/strong>. Expand a shift\nto see its <strong>Cashiers<\/strong> and add or end cashier\nsessions.<\/p>\n<h2 id=\"cash-movements-list\">Cash movements list<\/h2>\n<p><strong>POS &gt; Cash movements<\/strong> lists every paid-in,\npaid-out and safe drop (When, Register, What, Reason, Amount, By,\nApproved by), including voided ones.<\/p>\n<h2 id=\"devices\">Devices<\/h2>\n<p><strong>POS &gt; Devices<\/strong> sets up the receipt printer,\nkitchen and bar printers, the cash drawer and the customer display\n<strong>for this PC<\/strong>. Settings are kept in the browser of that\nPC. Your administrator normally does this once (see the Administrator\nManual, chapter 8). Use <strong>Print test page<\/strong> and\n<strong>Open cash drawer<\/strong> to check.<\/p>\n<h2 id=\"reports\">Reports<\/h2>\n<p><strong>POS &gt; Reports<\/strong> has these reports, each with\nfilters and export to Excel, PDF and CSV:<\/p>\n<ul>\n<li><strong>Sales and transactions<\/strong>: Total POS Categories Sales,\nTotal POS Brands Sales, Total POS Products Sales, POS Shifts Sales,\nDetailed POS Shifts Transactions.<\/li>\n<li><strong>Profit<\/strong>: POS Shifts Profit, Total POS Categories\nProfit, Total POS Brands Profit, Total POS Products Profit.<\/li>\n<li><strong>Operations<\/strong>: POS Sales by Cashier, POS Sales by\nHour, POS Sales by Payment Method, <strong>POS Exceptions<\/strong>\n(voids, returns, discounts, price changes, reprints) and POS Shift\nComparison.<\/li>\n<li><strong>Credit<\/strong>: Credit Sale Report, Daily Credit Collection\nReport, Outstanding Credit Report, Overdue Credit Report.<\/li>\n<\/ul>\n<div class=\"callout tip\">\n<p><strong>Tip:<\/strong> Managers should read <strong>POS\nExceptions<\/strong> and <strong>POS Shift Comparison<\/strong> weekly.\nThey show unusual voids, discounts and cash differences by cashier.<\/p>\n<\/div>\n", "text": " The POS (point of sale) group is where cashiers sell, count the till and handle returns. Its menu has: Registers & Terminal, Shifts, Voids & returns, Cash movements, POS settings, Devices, Reports . How a day at the till works A manager or admin opens a session (shift) on a register and assigns it to a cashier, with an opening cash float . The cashier opens the terminal with their PIN and rings up sales. Payments are taken at Checkout . During the shift: cash paid in or out , drops into the safe , returns, and X reports as needed. At the end the shift is closed : the drawer is counted and the difference is recorded. A Z report is printed. A register is the physical till. A session (or shift ) is one working period on a register. One shift can have several cashiers , each with their own PIN and their own carts. Opening a session Go to POS > Registers & Terminal . The list shows each register's Name, Location, Warehouse, Float, Cashiers, Device and Status ( Switched off , Open session , Closed ). Press Open session on the register. In Assign to , choose the staff member who will work the till. Enter the Opening cash float . (The most the till may open with is shown.) Press Open till . If a register is tied to one PC, a note shows Works on ... only and Go to terminal is available only on that PC. Opening the terminal Press Go to terminal on the open session. The terminal asks for your PIN first: type it and press Enter. A wrong PIN leaves the PIN screen up. If you do not have a PIN, ask an admin to set one, or set your own in My profile . Note: Your PIN opens your own working session on the shift. Another cashier can use the same terminal by pressing Switch cashier and typing their PIN; carts are kept separate. Selling at the terminal Adding items Scan a barcode into the barcode box (type it and press Enter), or tap a product tile , or search by name or SKU . The category tiles filter the product tiles. \"Showing the first 200 matches\" means: type more to narrow the search. Each line shows Item, Qty, Discount, Price . Use the pencil to change quantity, the bin to remove a line. For serial-numbered goods the terminal asks for the Serial no(s) . Quantities may be decimal where the product allows it (for example 2.5). The cart shows Subtotal , Tax , any Discount on the sale and the Total . Customer Use the customer box to search by name or phone , or press Add to create one on the spot (name, phone, e-mail, Tax ID ), which selects them for this sale. The box shows if the customer Owes money, their available credit , and their loyalty points and what the points are worth. Discounts % Discount gives a discount on the sale: choose Percent or Amount , enter it and a Reason . A cashier can give a discount only up to the limit in POS settings. A bigger one needs a manager's PIN (the Manager PIN box). A reason is required when POS settings say so. Promotions (such as buy-X-get-Y) apply automatically and the cart shows Saved with promotions . Type a Coupon code and press Apply for coupons. If your price differs from the product's price, the line shows Price changed . A manager may need to approve, and prices below cost may be refused. Several carts: hold and discard + starts another cart tab. Hold parks the cart with a note and opens a new one. Discard cancels an open cart outright (stock is untouched). Payment (checkout) Press Payment . On Checkout choose how the customer pays. Tap a payment method to enter an amount; you can split the payment across several methods . Gift card : type the Gift card code , press Check balance , then Use on this sale . Loyalty points : shows the points available and what they are worth; enter the Points and press Use points . Points can be used only when the amount reaches the minimum. Store credit (credit sale): select a customer first. The customer must be enabled for credit (set on the customer record) and within their limit. You may set a Due date ; otherwise the customer's own payment term is used. Charge to room (hotels): choose the guest who is checked in and the Room . Press the final button to complete the sale. The receipt prints. Change due is shown for cash. Receipts and reprints Receipts shows this shift's completed sales (Time, Invoice, Customer, Total, Payment) with View / Reprint . The first print is the original; each later print is marked COPY 1, COPY 2... and is listed in Voids & returns . Gift cards at the till Gift card lets you Check / add money (type the code and press Check , see the balance and expiry, then Add money ) or Sell a new card (amount, how it was paid, who it is for), and gives you the code to hand over. Customer display Customer display opens a second window for the customer showing the cart and total, then Thank you . Drag it to the customer-facing screen. Offline mode If the connection drops, the terminal shows Offline and keeps working from the catalogue of the last sync. Sales you ring up are queued on the PC ( Offline queue ) and sync automatically when the connection returns. Credit limits and some checks are applied only when the sale syncs; a sale that cannot be accepted appears as Failed in the queue for review, where you can Discard it or ask a manager. Warning: Do not clear the browser's data or close the browser while sales are waiting in the offline queue. Other terminal buttons Cash (cash control), X report , Open drawer , Devices (printer set-up), Switch cashier , End my session (ends your session on the shift and discards carts you never checked out) and Exit . Cash during the shift Press Cash to open the cash drawer screen. It shows Opening float, Cash sales, Cash refunds, Paid in, Paid out, Dropped into the safe and Cash that should be in the drawer . Record a movement: choose the kind ( paid in , paid out , drop into the safe ), the Amount , and What was it for? A paid-out above the limit needs a Manager's PIN . If the drawer holds more than the reminder level, you are told to drop some cash into the safe. Count the drawer without closing the shift gives a spot check: nothing moves, and the difference is kept on record. A mistaken movement can be voided (a manager may be needed). Voided movements stay visible. The page also has buttons for the X report and Z report , and Close the shift . X and Z reports X report : a mid-shift snapshot of sales, payments, returns and cash. Run it as often as you like; it changes nothing. Z report : the closing report, numbered. It is printed when the shift is closed. Both print to the receipt printer if one is set up. Closing a session Record any cash paid in, paid out or dropped, before counting . Open the close screen. It shows Opening float, Cash sales, Cash refunds, Paid in, Paid out, Dropped into the safe and Expected cash in drawer , plus Non-cash sales (card/mobile/bank) and Total sales this session . Count the drawer by notes and coins (enter the number of each denomination, or use + Another value ). The system totals it. If the count differs from the expected cash by more than the allowed amount, a note is required: Why is the count off? Press Close session , then print the Z report . Admins can Force close a shift or Close all sessions from POS > Shifts if a cashier has left without closing. Voids and returns Returning goods Use Process a return : type the Invoice number (for example the number on the receipt) and press Find . Choose the lines and Return qty (or Return all items ), the Refund method and the Reason . Returns of old sales (older than the limit in POS settings), or refunds above a limit, need a Manager's PIN . Press Process return ; a return receipt prints. Voiding a sale A sale can be voided only while its shift is open (after that it is a return). Voiding needs a manager's sign-in or PIN, and usually a reason. The log POS > Voids & returns lists every void, return, discount, price change and receipt reprint: When, What, Reference, Customer, Register, By, Amount, Reason and Approved by . Use the search box and the register filter. This is where managers look when a till is short. Shifts list (supervisors) POS > Shifts lists shifts with Register, Z, Cashier, Opened, Closed, Status, Sales, Variance , with filters for register and date, and buttons for Cash , X report and Z report . Expand a shift to see its Cashiers and add or end cashier sessions. Cash movements list POS > Cash movements lists every paid-in, paid-out and safe drop (When, Register, What, Reason, Amount, By, Approved by), including voided ones. Devices POS > Devices sets up the receipt printer, kitchen and bar printers, the cash drawer and the customer display for this PC . Settings are kept in the browser of that PC. Your administrator normally does this once (see the Administrator Manual, chapter 8). Use Print test page and Open cash drawer to check. Reports POS > Reports has these reports, each with filters and export to Excel, PDF and CSV: Sales and transactions : Total POS Categories Sales, Total POS Brands Sales, Total POS Products Sales, POS Shifts Sales, Detailed POS Shifts Transactions. Profit : POS Shifts Profit, Total POS Categories Profit, Total POS Brands Profit, Total POS Products Profit. Operations : POS Sales by Cashier, POS Sales by Hour, POS Sales by Payment Method, POS Exceptions (voids, returns, discounts, price changes, reprints) and POS Shift Comparison. Credit : Credit Sale Report, Daily Credit Collection Report, Outstanding Credit Report, Overdue Credit Report. Tip: Managers should read POS Exceptions and POS Shift Comparison weekly. They show unusual voids, discounts and cash differences by cashier. "}, {"id": "user-3-sales", "manual": "user", "n": 3, "title": "Sales", "html": "\n<p>The <strong>Sales<\/strong> group (back-office selling, as opposed to\nthe till) has: <strong>Quotations, Sale orders, Price lists, Customer\ngroups, Sale order returns, Invoices, Recurring invoices, Credit notes,\nReports, Settings<\/strong>. Promotions, gift cards and loyalty (switched\non in <strong>Sales &gt; Settings<\/strong>) have their own pages.<\/p>\n<h2 id=\"the-selling-path\">The selling path<\/h2>\n<p>For business-to-business or on-account selling the usual path is:<\/p>\n<p><strong>Quotation<\/strong> (an offer) → <strong>Sale order<\/strong>\n(the customer has agreed) → <strong>Fulfil<\/strong> (deliver the goods)\n→ <strong>Invoice<\/strong> (ask for payment) → <strong>Record\npayment<\/strong>.<\/p>\n<p>You can start at any step: an invoice can be raised without a\nquotation or order.<\/p>\n<h2 id=\"quotations\">Quotations<\/h2>\n<p>A quotation is an offer with a validity date. It does not move stock\nor accounting.<\/p>\n<ol type=\"1\">\n<li><strong>Sales &gt; Quotations &gt; New<\/strong>.<\/li>\n<li>Choose the <strong>Customer<\/strong> (or press <strong>+ New\ncustomer<\/strong> to add one: name, phone, e-mail, Tax ID).<\/li>\n<li>Optionally set <strong>Valid until<\/strong>, <strong>Branch<\/strong>\n(if you have several), and <strong>Notes<\/strong>.<\/li>\n<li>Optionally set a <strong>Discount (whole quotation)<\/strong> as a\n<strong>Percentage<\/strong> or <strong>Fixed amount<\/strong> (this field\nappears only when your administrator set discounts to <em>Global<\/em>;\nin <em>Per line<\/em> mode each line has its own <strong>Discount\n%<\/strong>).<\/li>\n<li>Under <strong>Line items<\/strong>, search a product by name, SKU or\ncode. The list shows stock and price. Set <strong>Quantity<\/strong> and\n<strong>Unit price<\/strong>. <strong>+ New product<\/strong> adds a quick\nproduct (name, unit price, description) that you complete later.<\/li>\n<li>Check the totals (<strong>Subtotal, Tax, Discount, Grand\ntotal<\/strong>) and press <strong>Save draft<\/strong>.<\/li>\n<\/ol>\n<p>On the quotation, buttons follow its status: <strong>Edit<\/strong>,\n<strong>Send to customer<\/strong> (e-mails the PDF, status\n<em>Sent<\/em>), <strong>Mark accepted<\/strong>, <strong>Mark\nexpired<\/strong>, <strong>Reject<\/strong>, and <strong>Convert to sale\norder<\/strong>. Statuses: <em>Draft, Sent, Accepted, Rejected,\nExpired<\/em>.<\/p>\n<div class=\"callout tip\">\n<p><strong>Tip:<\/strong> If the customer belongs to a <em>customer\ngroup<\/em>, the group's price list is used for the prices\nautomatically.<\/p>\n<\/div>\n<h2 id=\"sale-orders\">Sale orders<\/h2>\n<p>A sale order records what the customer has agreed to buy. It reserves\nnothing until you fulfil it.<\/p>\n<ol type=\"1\">\n<li><strong>Sales &gt; Sale orders &gt; New<\/strong> (or <strong>Convert\nto sale order<\/strong> on a quotation). The form is the same as a\nquotation, with <strong>Expected date<\/strong>.<\/li>\n<li><strong>Save draft<\/strong>. Press <strong>Confirm<\/strong> when it\nis agreed. A confirmed order cannot be freely edited; use <strong>Cancel\norder<\/strong> if it will not go ahead.<\/li>\n<li><strong>Fulfil order<\/strong>: choose <strong>Fulfil from<\/strong>\n(the warehouse or location), enter <strong>Fulfilling now<\/strong> for\neach line (the remaining quantity is shown), enter <strong>Serial\nnumbers delivered<\/strong> if the product is serial-tracked (otherwise\nthe oldest in stock is used), and press <strong>Record\nfulfillment<\/strong>. Stock goes down. Partly delivered orders are\n<em>Partially fulfilled<\/em>; when everything is delivered it is\n<em>Fulfilled<\/em>. You can print a <strong>delivery note<\/strong>.<\/li>\n<li><strong>Generate invoice<\/strong> creates the invoice for the order;\n<strong>View invoice<\/strong> opens it.<\/li>\n<\/ol>\n<p>The order page shows <strong>Paid<\/strong>,\n<strong>Outstanding<\/strong>, <strong>Returned<\/strong> and\n<strong>Refund due to customer<\/strong>.<\/p>\n<h3 id=\"returns-on-a-sale-order\">Returns on a sale order<\/h3>\n<p><strong>Process a return<\/strong> lets you choose what the customer\nis returning (<strong>Returning now<\/strong>), where to put the stock\nback (<strong>Return stock to<\/strong>) and a <strong>Reason<\/strong>.\nThe return appears under <strong>Return history<\/strong> and in\n<strong>Sales &gt; Sale order returns<\/strong>. A <strong>Refund\ndue<\/strong> amount is created if the order was already paid.<\/p>\n<h2 id=\"invoices\">Invoices<\/h2>\n<p><strong>Sales &gt; Invoices<\/strong> lists all invoices (search by\ninvoice number, customer or sale order; filter by status, date and\nbranch).<\/p>\n<ul>\n<li><strong>New invoice<\/strong>: same form as an order, plus\n<strong>Due date<\/strong>. Press <strong>Save draft<\/strong>.<\/li>\n<li>A <strong>Draft<\/strong> can still be edited or deleted\n(<strong>Delete draft<\/strong>). Press <strong>Issue invoice<\/strong> to\nmake it official: it gets its number, posts to accounting, reduces stock\nif not already fulfilled, and may be e-mailed to the customer and to the\ninvoice-receiver list set in Sales settings.<\/li>\n<li><strong>Record payment<\/strong>: enter the <strong>Payment\namount<\/strong> (up to the outstanding), the <strong>Payment\nmethod<\/strong> and an optional <strong>Note<\/strong>. Part-payments are\nnormal. <strong>Payment history for this invoice<\/strong> shows each\nreceipt. <strong>Record another payment<\/strong> for further\ninstalments.<\/li>\n<li><strong>Pay in instalments<\/strong> (if the Installments module is\non) turns an unpaid invoice into a payment plan.<\/li>\n<li>Mistakes after issuing: <strong>Void invoice<\/strong> (give a\nreason; nothing has been paid) or <strong>Cancel &amp; credit\ninvoice<\/strong> (when payments exist: you choose to\n<strong>Refund<\/strong> by a method or move the money to\n<strong>Customer credit<\/strong>). Both create a <strong>credit\nnote<\/strong>.<\/li>\n<\/ul>\n<p>Statuses: <em>Draft, Issued, Partially paid, Paid, Void,\nCancelled<\/em>.<\/p>\n<h2 id=\"credit-notes\">Credit notes<\/h2>\n<p><strong>Sales &gt; Credit notes<\/strong> lists credit notes (Credit\nnote #, Invoice #, Customer, Voided, Reason, Amount) with <strong>View\ninvoice<\/strong> and <strong>Print<\/strong>. A credit note is issued\nautomatically when an invoice is voided or cancelled; you do not create\none by hand.<\/p>\n<h2 id=\"recurring-invoices\">Recurring invoices<\/h2>\n<p>For regular billing (a monthly retainer, rent, service fees).<\/p>\n<ol type=\"1\">\n<li><strong>Sales &gt; Recurring invoices &gt; New<\/strong>.<\/li>\n<li>Give it a <strong>Name<\/strong>, the <strong>Customer<\/strong>, the\n<strong>Frequency<\/strong> (<em>Weekly, Monthly, Quarterly,\nYearly<\/em>), the <strong>Next run date<\/strong>, and <strong>Due in\ndays<\/strong>.<\/li>\n<li>Add the lines; the <strong>Grand total (each cycle)<\/strong> is\nshown.<\/li>\n<li>Tick <strong>Active<\/strong> and save.<\/li>\n<\/ol>\n<p>A daily job generates the next invoice on or after the next run date,\nthen moves the date forward one cycle. Untick <strong>Active<\/strong> to\npause.<\/p>\n<h2 id=\"price-lists-and-customer-groups\">Price lists and customer\ngroups<\/h2>\n<ul>\n<li><strong>Price lists<\/strong> hold spec
