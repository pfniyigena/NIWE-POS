ange the admin password and the JWT secret; set Business details , System settings , Taxes , Payment methods . Settings > Modules : copy the installation id, install the licence, activate only needed modules. People Staff > Roles for access areas (None / View / Manage). On each person: role, extra approval permissions, branch access, PIN . Every week Check the backup exists and download one off the server. Review the Sign-in log and Audit Log . Look at Server logs if anything failed. For an online shop Set app.frontend-url to the public https address. Switch each payment provider on with its own keys in the server's environment, never in a file that is copied around. Give each provider its accounts (Online Store > Online payments > Accounts by provider). Give each driver a link and PIN (Shop settings > Drivers). Add the web-server rule for link previews. Read and adapt the shop's Terms and Privacy pages. Before an upgrade Backup now , download it, then follow the release notes. Remember Module activation is permanent. Restoring a backup replaces everything and needs a restart. Need more? See the matching chapter of the User Manual, or ask your administrator. "}, {"id": "cards-15-online-shop-staff", "manual": "cards", "n": 15, "title": "Online shop staff", "html": "\n<p><em>Answer orders, keep the shop fresh, watch the money.<\/em><\/p>\n<h2 id=\"every-day\">Every day<\/h2>\n<ul>\n<li><strong>Online Store &gt; Online orders<\/strong>, tab\n<strong>New<\/strong>: <strong>Accept<\/strong> (holds the stock) or\n<strong>Reject<\/strong> (give a reason). A delivery order gets a\n<strong>Driver<\/strong>; then <strong>Mark packed<\/strong>, <strong>Out\nfor delivery<\/strong> or <strong>Ready for pick-up<\/strong>. The\ncustomer receives a 4-digit <strong>delivery code<\/strong>.<\/li>\n<li><strong>Complete<\/strong> by typing the code the customer reads out.\nStaff never see the code; <strong>Send a new code to the\ncustomer<\/strong> if it was lost. Print the <strong>Delivery\nslip<\/strong> (one order) or the <strong>Run sheet<\/strong> (a driver's\nday).<\/li>\n<li><strong>Delivery failed<\/strong> (pick a reason) when nobody was\nhome; the customer chooses a new time. <strong>Keeps only part<\/strong>\nwhen the customer takes some of the goods.<\/li>\n<li><strong>Refunds due<\/strong>: <strong>Refund through the\nprovider<\/strong>, or refund by hand (always for Airtel) and enter the\nreference with <strong>I refunded it myself<\/strong>.<\/li>\n<li><strong>Online payments<\/strong>: look at <em>Under review<\/em>\n(money that needs a person; it is not in the books until you deal with\nit), <em>Refunds due<\/em> and <em>Stuck pending<\/em>.<\/li>\n<li><strong>Messages<\/strong> (contact form) and <strong>Waiting\ncustomers<\/strong> (people to tell when a product is back): answer\nthem.<\/li>\n<\/ul>\n<h2 id=\"money-every-week\">Money, every week<\/h2>\n<ul>\n<li><strong>Driver cash<\/strong>: type what each driver really handed\nin, write a reason for any difference, <strong>Settle the\nselected<\/strong>. It should agree with the account <em>Cash with\nDrivers<\/em>.<\/li>\n<li><strong>Online payments &gt; Payouts<\/strong>: record each provider\npayout (gross, provider fee, date, reference from the provider's\nstatement).<\/li>\n<li><strong>Online Store &gt; Sales reports<\/strong>: a sale counts on\nthe day the order was <strong>completed<\/strong>.<\/li>\n<\/ul>\n<h2 id=\"when-asked\">When asked<\/h2>\n<ul>\n<li><strong>Returns<\/strong>: <strong>Approve<\/strong> (a driver\ncollects the goods with a return code) or <strong>Refuse<\/strong>; when\nthe goods are back press <strong>Goods received: put back and\nrefund<\/strong> (tick the serial numbers that came back).<\/li>\n<li><strong>Reviews<\/strong>: <strong>Approve<\/strong> or\n<strong>Hide<\/strong> the new written reviews; <strong>Remove\nrating<\/strong> for an unfair rating.<\/li>\n<\/ul>\n<h2 id=\"keep-the-shop-fresh\">Keep the shop fresh<\/h2>\n<ul>\n<li><strong>Shop settings &gt; Products on the shop<\/strong>: titles,\nonline prices, product page, and the ticks <strong>Featured<\/strong>,\n<strong>Best seller<\/strong>, <strong>Offer<\/strong>,\n<strong>New<\/strong>.<\/li>\n<li><strong>Front page<\/strong>: announcement, banner pictures, colour,\nfooter links. <strong>Shop pages<\/strong>: read and adapt the Terms,\nPrivacy, Returns and Delivery pages.<\/li>\n<li><strong>Delivery areas<\/strong> (fee, tax, days), <strong>Delivery\ntimes<\/strong>, <strong>Drivers<\/strong> (<strong>Give a link<\/strong>\ngives a private page and PIN).<\/li>\n<li><strong>Abandoned carts<\/strong>, <strong>Loyalty points<\/strong>,\n<strong>Coupons<\/strong>, <strong>Newsletter<\/strong>, <strong>Send a\nnewsletter<\/strong> (test to yourself first),\n<strong>Advertising<\/strong>.<\/li>\n<\/ul>\n<h2 id=\"it-says-sold-out\">\"It says Sold out\"<\/h2>\n<ul>\n<li>Under the product: <em>sellable stock − reserved − held by\nunanswered orders − buffer − share kept for the till = sellable\nnow<\/em>. Lower the buffer, move stock to a Sales location, answer the\norders in <strong>New<\/strong>, or look at expired batches.<\/li>\n<\/ul>\n<div class=\"callout note\">\n<p><strong>Need more?<\/strong> See <em>Online Store<\/em> (chapters 23 to\n25) in the User Manual, or ask your administrator.<\/p>\n<\/div>\n", "text": " Answer orders, keep the shop fresh, watch the money. Every day Online Store > Online orders , tab New : Accept (holds the stock) or Reject (give a reason). A delivery order gets a Driver ; then Mark packed , Out for delivery or Ready for pick-up . The customer receives a 4-digit delivery code . Complete by typing the code the customer reads out. Staff never see the code; Send a new code to the customer if it was lost. Print the Delivery slip (one order) or the Run sheet (a driver's day). Delivery failed (pick a reason) when nobody was home; the customer chooses a new time. Keeps only part when the customer takes some of the goods. Refunds due : Refund through the provider , or refund by hand (always for Airtel) and enter the reference with I refunded it myself . Online payments : look at Under review (money that needs a person; it is not in the books until you deal with it), Refunds due and Stuck pending . Messages (contact form) and Waiting customers (people to tell when a product is back): answer them. Money, every week Driver cash : type what each driver really handed in, write a reason for any difference, Settle the selected . It should agree with the account Cash with Drivers . Online payments > Payouts : record each provider payout (gross, provider fee, date, reference from the provider's statement). Online Store > Sales reports : a sale counts on the day the order was completed . When asked Returns : Approve (a driver collects the goods with a return code) or Refuse ; when the goods are back press Goods received: put back and refund (tick the serial numbers that came back). Reviews : Approve or Hide the new written reviews; Remove rating for an unfair rating. Keep the shop fresh Shop settings > Products on the shop : titles, online prices, product page, and the ticks Featured , Best seller , Offer , New . Front page : announcement, banner pictures, colour, footer links. Shop pages : read and adapt the Terms, Privacy, Returns and Delivery pages. Delivery areas (fee, tax, days), Delivery times , Drivers ( Give a link gives a private page and PIN). Abandoned carts , Loyalty points , Coupons , Newsletter , Send a newsletter (test to yourself first), Advertising . \"It says Sold out\" Under the product: sellable stock − reserved − held by unanswered orders − buffer − share kept for the till = sellable now . Lower the buffer, move stock to a Sales location, answer the orders in New , or look at expired batches. Need more? See Online Store (chapters 23 to 25) in the User Manual, or ask your administrator. "}, {"id": "cards-16-delivery-driver", "manual": "cards", "n": 16, "title": "Delivery driver", "html": "\n<p><em>Deliver, take the code, hand in the cash.<\/em><\/p>\n<h2 id=\"your-private-page\">Your private page<\/h2>\n<ul>\n<li>The shop gives you a <strong>link<\/strong> and a\n<strong>PIN<\/strong> (sent separately). Open the link on your phone and\ntype the PIN. You see only <strong>your<\/strong> orders. Do not share\nthe link or the PIN; if the phone is lost, tell the shop for a new\nPIN.<\/li>\n<li>After five wrong PINs the link is locked for 30 minutes; the shop\ncan unlock it with a new PIN.<\/li>\n<\/ul>\n<h2 id=\"a-delivery\">A delivery<\/h2>\n<ul>\n<li>Each order shows the customer, phone (tap to call), address and map,\nthe delivery time, <strong>what to collect<\/strong> and the goods.<\/li>\n<li>Hand the goods over. Ask the customer for his <strong>4-digit\ndelivery code<\/strong> and type it under <strong>Hand over<\/strong>. The\norder is then complete. Never ask for the code before the goods are\nhanded over, and never write it down.<\/li>\n<li>If the customer is not there, refuses, or the address is wrong:\n<strong>do not complete<\/strong>. Phone the shop; staff record the\nfailed delivery.<\/li>\n<li>If the customer keeps only part of the goods: phone the shop; staff\nrecord it.<\/li>\n<li>Wrong code: ask the customer to read it again from his order page.\nAfter five wrong tries the code is blocked for 30 minutes: the shop\nsends a new one.<\/li>\n<\/ul>\n<h2 id=\"cash\">Cash<\/h2>\n<ul>\n<li>A cash order: collect exactly what the page says (<strong>what to\ncollect<\/strong>). An order paid online has nothing to collect.<\/li>\n<li><strong>Cash I hold<\/strong> at the top shows what you took and have\nnot handed in. Hand it to the shop; staff record what you handed in. A\ndifference needs a reason.<\/li>\n<\/ul>\n<h2 id=\"returns-to-collect\">Returns to collect<\/h2>\n<ul>\n<li>A <strong>Returns to collect<\/strong> list shows customers' returns\nassigned to you. Collect the goods, ask for the customer's\n<strong>return code<\/strong>, tap <strong>Collect the goods<\/strong> and\ntype it. The shop checks the goods and refunds the customer.<\/li>\n<\/ul>\n<div class=\"callout note\">\n<p><strong>Need more?<\/strong> Call the shop (its phone is on your\npage).<\/p>\n<\/div>\n", "text": " Deliver, take the code, hand in the cash. Your private page The shop gives you a link and a PIN (sent separately). Open the link on your phone and type the PIN. You see only your orders. Do not share the link or the PIN; if the phone is lost, tell the shop for a new PIN. After five wrong PINs the link is locked for 30 minutes; the shop can unlock it with a new PIN. A delivery Each order shows the customer, phone (tap to call), address and map, the delivery time, what to collect and the goods. Hand the goods over. Ask the customer for his 4-digit delivery code and type it under Hand over . The order is then complete. Never ask for the code before the goods are handed over, and never write it down. If the customer is not there, refuses, or the address is wrong: do not complete . Phone the shop; staff record the failed delivery. If the customer keeps only part of the goods: phone the shop; staff record it. Wrong code: ask the customer to read it again from his order page. After five wrong tries the code is blocked for 30 minutes: the shop sends a new one. Cash A cash order: collect exactly what the page says ( what to collect ). An order paid online has nothing to collect. Cash I hold at the top shows what you took and have not handed in. Hand it to the shop; staff record what you handed in. A difference needs a reason. Returns to collect A Returns to collect list shows customers' returns assigned to you. Collect the goods, ask for the customer's return code , tap Collect the goods and type it. The shop checks the goods and refunds the customer. Need more? Call the shop (its phone is on your page). "}, {"id": "install-1-what-a-deployment-is-made-of", "manual": "install", "n": 1, "title": "What a deployment is made of", "html": "\n<h2 id=\"who-this-guide-is-for\">Who this guide is for<\/h2>\n<p>This guide is for the person at NIWE (or a partner) who\n<strong>installs NIWE ERP for a customer business<\/strong> and keeps it\nrunning: a developer, a system administrator or a technically able\nconsultant. It assumes you can use a Linux shell, edit a text file and\nread a log. The customer's own administrator uses the\n<strong>Administrator Manual<\/strong> instead; the first weeks with a\nnew customer are in the <strong>Customer onboarding guide<\/strong>,\nversions and upgrades in the <strong>Release and upgrade notes for\ncustomers<\/strong>, and problems in the <strong>Support and\ntroubleshooting guide<\/strong>.<\/p>\n<p>The aim is a deployment that is <strong>the same for every\ncustomer<\/strong> except for a short list of things that belong to that\ncustomer. Do the same steps in the same order every time, write down\nwhat you did in the customer register (chapter 8), and no installation\ndepends on anybody's memory.<\/p>\n<h2 id=\"the-pieces\">The pieces<\/h2>\n<p>Every customer installation has four pieces:<\/p>\n<div class=\"tablewrap\"><table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Piece<\/th>\n<th>What it is<\/th>\n<th>Where it runs<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>Backend<\/strong><\/td>\n<td>One Java 21 / Spring Boot program\n(<code>pos-app-&lt;version&gt;.jar<\/code>) holding all the business\nrules and the public shop's server side.<\/td>\n<td>A service on the server, on a local port (for example 9101).<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Database<\/strong><\/td>\n<td>One PostgreSQL database for this customer only. The structure is\ncreated and upgraded by the program itself (Flyway migrations).<\/td>\n<td>PostgreSQL on the same server or a managed database.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Frontend<\/strong><\/td>\n<td>One folder of static files made by <code>ng build<\/code>. The same\nfiles serve staff screens, the public shop and the installable app.<\/td>\n<td>Served by nginx (or another web server).<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Web server<\/strong><\/td>\n<td>Terminates <strong>HTTPS<\/strong>, serves the frontend files, passes\n<code>/api/<\/code> to the backend, and carries the rules for share\npreviews.<\/td>\n<td>nginx on the same server.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Staff and customers only need a modern browser. A till PC that prints\ndirectly to a thermal printer needs Chrome or Edge on https (or on\nlocalhost).<\/p>\n<h2 id=\"one-customer-one-set-of-everything\">One customer, one set of\neverything<\/h2>\n<p>Never share any of these between two customers:<\/p>\n<ul>\n<li>the <strong>database<\/strong> (each customer has its own database,\nuser and password);<\/li>\n<li>the <strong>secret that signs sign-ins<\/strong>\n(<code>app.jwt.secret<\/code>): anyone who knows it can forge a sign-in\nfor that installation;<\/li>\n<li>the <strong>licence file<\/strong> (it is signed for that\ninstallation's id only);<\/li>\n<li>the <strong>payment provider keys<\/strong> (MTN, Airtel, a card\ngateway are registered in the customer's business name);<\/li>\n<li>the <strong>e-mail account<\/strong> the shop sends from, and the\n<strong>text message provider<\/strong> account;<\/li>\n<li>the <strong>domain name and its certificate<\/strong>.<\/li>\n<\/ul>\n<p>What is the same for every customer: the <strong>jar<\/strong>, the\n<strong>frontend build<\/strong> (the production build asks for the API\nat the relative address <code>/api<\/code>, so one build works behind any\ndomain), and the <strong>procedure<\/strong>.<\/p>\n<h2 id=\"two-layouts\">Two layouts<\/h2>\n<p><strong>One server per customer<\/strong> (a small virtual server for\neach business). It is the simplest to reason about and to move, and a\nproblem at one customer cannot touch another. Choose it when a customer\nwill have many users or the shop, or when the customer owns the\nserver.<\/p>\n<p><strong>Several customers on one server.<\/strong> Each customer still\nhas its own folder, its own jar process on its own port, its own\ndatabase, its own nginx site and its own domain. Choose it for small\ncustomers to share a cost. Plan the memory: allow about 1 GB of memory\nfor each running backend, plus the database. Do not share a database\nserver's superuser between them.<\/p>\n<p>Whichever layout you use, the folder and naming plan below keeps the\ncustomers apart.<\/p>\n<h2 id=\"naming-plan\">Naming plan<\/h2>\n<p>Pick a short <strong>customer code<\/strong> (lower case, no spaces,\nfor example <code>acme<\/code>) and use it everywhere:<\/p>\n<div class=\"tablewrap\"><table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Thing<\/th>\n<th>Name<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Linux folder of the backend<\/td>\n<td><code>/opt/niwe/acme/<\/code> (the jar, <code>config/<\/code>,\n<code>logs/<\/code>, <code>backups/<\/code> live here)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Frontend files<\/td>\n<td><code>/var/www/niwe/acme/<\/code><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Database and database user<\/td>\n<td><code>niwe_acme<\/code> and <code>niwe_acme<\/code><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Backend service<\/td>\n<td><code>niwe-acme.service<\/code><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Local port<\/td>\n<td>one number per customer, for example 9101, 9102, ... (write it in\nthe register)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>nginx site<\/td>\n<td><code>/etc/nginx/sites-available/acme.conf<\/code><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Domain<\/td>\n<td>for example <code>erp.acme.com<\/code> (staff and shop on the same\naddress)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Keep the <strong>customer register<\/strong> (chapter 8): one line for\neach customer with these names, the port, the version running, the\nlicence number, the modules, the backup place, and who to call.<\/p>\n", "text": " Who this guide is for This guide is for the person at NIWE (or a partner) who installs NIWE ERP for a customer business and keeps it running: a developer, a system administrator or a technically able consultant. It assumes you can use a Linux shell, edit a text file and read a log. The customer's own administrator uses the Administrator Manual instead; the first weeks with a new customer are in the Customer onboarding guide , versions and upgrades in the Release and upgrade notes for customers , and problems in the Support and troubleshooting guide . The aim is a deployment that is the same for every customer except for a short list of things that belong to that customer. Do the same steps in the same order every time, write down what you did in the customer register (chapter 8), and no installation depends on anybody's memory. The pieces Every customer installation has four pieces: Piece What it is Where it runs Backend One Java 21 / Spring Boot program ( pos-app-<version>.jar ) holding all the business rules and the public shop's server side. A service on the server, on a local port (for example 9101). Database One PostgreSQL database for this customer only. The structure is created and upgraded by the program itself (Flyway migrations). PostgreSQL on the same server or a managed database. Frontend One folder of static files made by ng build . The same files serve staff screens, the public shop and the installable app. Served by nginx (or another web server). Web server Terminates HTTPS , serves the frontend files, passes /api/ to the backend, and carries the rules for share previews. nginx on the same server. Staff and customers only need a modern browser. A till PC that prints directly to a thermal printer needs Chrome or Edge on https (or on localhost). One customer, one set of everything Never share any of these between two customers: the database (each customer has its own database, user and password); the secret that signs sign-ins ( app.jwt.secret ): anyone who knows it can forge a sign-in for that installation; the licence file (it is signed for that installation's id only); the payment provider keys (MTN, Airtel, a card gateway are registered in the customer's business name); the e-mail account the shop sends from, and the text message provider account; the domain name and its certificate . What is the same for every customer: the jar , the frontend build (the production build asks for the API at the relative address /api , so one build works behind any domain), and the procedure . Two layouts One server per customer (a small virtual server for each business). It is the simplest to reason about and to move, and a problem at one customer cannot touch another. Choose it when a customer will have many users or the shop, or when the customer owns the server. Several customers on one server. Each customer still has its own folder, its own jar process on its own port, its own database, its own nginx site and its own domain. Choose it for small customers to share a cost. Plan the memory: allow about 1 GB of memory for each running backend, plus the database. Do not share a database server's superuser between them. Whichever layout you use, the folder and naming plan below keeps the customers apart. Naming plan Pick a short customer code (lower case, no spaces, for example acme ) and use it everywhere: Thing Name Linux folder of the backend /opt/niwe/acme/ (the jar, config/ , logs/ , backups/ live here) Frontend files /var/www/niwe/acme/ Database and database user niwe_acme and niwe_acme Backend service niwe-acme.service Local port one number per customer, for example 9101, 9102, ... (write it in the register) nginx site /etc/nginx/sites-available/acme.conf Domain for example erp.acme.com (staff and shop on the same address) Keep the customer register (chapter 8): one line for each customer with these names, the port, the version running, the licence number, the modules, the backup place, and who to call. "}, {"id": "install-2-preparing-the-server", "manual": "install", "n": 2, "title": "Preparing the server", "html": "\n<p>These steps are done <strong>once per server<\/strong>, not once per\ncustomer. The commands are for Ubuntu Server 22.04 or 24.04 LTS; use the\nequivalent on another system.<\/p>\n<h2 id=\"size\">Size<\/h2>\n<p>For one customer with up to about 20 staff and a public shop of\nmoderate traffic: <strong>2 vCPU, 4 GB of memory, 40 GB of\ndisk<\/strong>, with the disk growing with the number of invoices,\nproduct pictures and backups. Add 1 GB of memory and a vCPU for each\nextra customer on the same server. Put the backups on a\n<strong>different disk or machine<\/strong> than the database.<\/p>\n<h2 id=\"install-the-programs\">Install the programs<\/h2>\n<ol type=\"1\">\n<li><strong>Update the system<\/strong> and set the <strong>time\nzone<\/strong> to the customer's:\n<code>sudo timedatectl set-timezone Africa/Kigali<\/code> (Rwanda) or\n<code>Africa/Ndjamena<\/code> (Chad). The program's reports, daily jobs\nand the shop's \"today\" use the server's time zone. A server in the wrong\ntime zone puts sales on the wrong day.<\/li>\n<li><strong>Java 21<\/strong>:\n<code>sudo apt install openjdk-21-jre-headless<\/code>. Check with\n<code>java -version<\/code>.<\/li>\n<li><strong>PostgreSQL<\/strong> (a supported version, for example 16):\n<code>sudo apt install postgresql postgresql-client<\/code>. The backup\nfeature runs <code>pg_dump<\/code> and <code>psql<\/code> from the\napplication server, so the <strong>client tools must be installed on the\nmachine that runs the backend<\/strong> and be of the <strong>same major\nversion as the database<\/strong>.<\/li>\n<li><strong>nginx<\/strong>: <code>sudo apt install nginx<\/code>. And\n<strong>certbot<\/strong> for free certificates:\n<code>sudo apt install certbot python3-certbot-nginx<\/code>.<\/li>\n<li><strong>A service account<\/strong>:\n<code>sudo useradd --system --home /opt/niwe --shell /usr/sbin/nologin niwe<\/code>,\nand\n<code>sudo mkdir -p /opt/niwe /var/www/niwe &amp;&amp; sudo chown niwe:niwe /opt/niwe<\/code>.<\/li>\n<\/ol>\n<h2 id=\"firewall-and-access\">Firewall and access<\/h2>\n<ul>\n<li>Allow only <strong>22<\/strong> (SSH, ideally from known addresses or\nwith keys only), <strong>80<\/strong> and <strong>443<\/strong>. The\nbackend ports and <strong>PostgreSQL (5432) must not be reachable from\nthe internet<\/strong>: bind the database to <code>localhost<\/code> (the\ndefault) and let nginx be the only public door.<\/li>\n<li>Turn off SSH password login and use keys.<\/li>\n<li>Turn on automatic security updates\n(<code>unattended-upgrades<\/code>).<\/li>\n<\/ul>\n<h2 id=\"time-disk-and-memory-checks\">Time, disk and memory checks<\/h2>\n<ul>\n<li>Time must be correct (<code>timedatectl<\/code> says \"System clock\nsynchronized: yes\"): sign-in tokens and payment checks depend on\nit.<\/li>\n<li>Make sure there is free disk for at least three nightly backups plus\nthe database. A full disk stops the database.<\/li>\n<li>Give Java enough memory: the default is a quarter of the memory; for\na server with several customers set <code>-Xmx1g<\/code> for each service\n(see the service file).<\/li>\n<\/ul>\n<h2 id=\"the-web-server-in-front\">The web server in front<\/h2>\n<p>The backend must never face the internet directly. nginx does the\nfollowing for each customer (chapter 5 has the full site file):<\/p>\n<ol type=\"1\">\n<li>answers on <strong>HTTPS<\/strong> with the customer's certificate\nand redirects http to https;<\/li>\n<li>serves the static frontend, with every unknown path falling back to\n<code>index.html<\/code> (the staff screens and the shop are one\nsingle-page app);<\/li>\n<li>passes <code>/api/<\/code> to the customer's backend port, adding the\nheaders that tell the backend the visitor's real address and that the\nconnection was https;<\/li>\n<li>allows uploads up to 100 MB\n(<code>client_max_body_size 110m<\/code>), because the program accepts\nbackup files and imports of that size;<\/li>\n<li>carries the rules that give share previews,\n<code>/sitemap.xml<\/code> and <code>/robots.txt<\/code> to the shop.<\/li>\n<\/ol>\n<p>Because nginx sits in front, set\n<code>server.forward-headers-strategy=native<\/code> in the customer's\nsettings, so the limits \"per connection\" see each visitor's real address\n(otherwise everybody shares one address and is limited together).<\/p>\n", "text": " These steps are done once per server , not once per customer. The commands are for Ubuntu Server 22.04 or 24.04 LTS; use the equivalent on another system. Size For one customer with up to about 20 staff and a public shop of moderate traffic: 2 vCPU, 4 GB of memory, 40 GB of disk , with the disk growing with the number of invoices, product pictures and backups. Add 1 GB of memory and a vCPU for each extra customer on the same server. Put the backups on a different disk or machine than the database. Install the programs Update the system and set the time zone to the customer's: sudo timedatectl set-timezone Africa/Kigali (Rwanda) or Africa/Ndjamena (Chad). The program's reports, daily jobs and the shop's \"today\" use the server's time zone. A server in the wrong time zone puts sales on the wrong day. Java 21 : sudo apt install openjdk-21-jre-headless . Check with java -version . PostgreSQL (a supported version, for example 16): sudo apt install postgresql postgresql-client . The backup feature runs pg_dump and psql from the application server, so the client tools must be installed on the machine that runs the backend and be of the same major version as the database . nginx : sudo apt install nginx . And certbot for free certificates: sudo apt install certbot python3-certbot-nginx . A service account : sudo useradd --system --home /opt/niwe --shell /usr/sbin/nologin niwe , and sudo mkdir -p /opt/niwe /var/www/niwe && sudo chown niwe:niwe /opt/niwe . Firewall and access Allow only 22 (SSH, ideally from known addresses or with keys only), 80 and 443 . The backend ports and PostgreSQL (5432) must not be reachable from the internet : bind the database to localhost (the default) and let nginx be the only public door. Turn off SSH password login and use keys. Turn on automatic security updates ( unattended-upgrades ). Time, disk and memory checks Time must be correct ( timedatectl says \"System clock synchronized: yes\"): sign-in tokens and payment checks depend on it. Make sure there is free disk for at least three nightly backups plus the database. A full disk stops the database. Give Java enough memory: the default is a quarter of the memory; for a server with several customers set -Xmx1g for each service (see the service file). The web server in front The backend must never face the internet directly. nginx does the following for each customer (chapter 5 has the full site file): answers on HTTPS with the customer's certificate and redirects http to https; serves the static frontend, with every unknown path falling back to index.html (the staff screens and the shop are one single-page app); passes /api/ to the customer's backend port, adding the headers that tell the backend the visitor's real address and that the connection was https; allows uploads up to 100 MB ( client_max_body_size 110m ), because the program accepts backup files and imports of that size; carries the rules that give share previews, /sitemap.xml and /robots.txt to the shop. Because nginx sits in front, set server.forward-headers-strategy=native in the customer's settings, so the limits \"per connection\" see each visitor's real address (otherwise everybody shares one address and is limited together). "}, {"id": "install-3-the-customer-s-database", "manual": "install", "n": 3, "title": "The customer's database", "html": "\n<p>One database for each customer, with its own user. Run this as the\nPostgreSQL administrator (<code>sudo -u postgres psql<\/code>), replacing\n<code>acme<\/code> with the customer code and the password with a long\nrandom one made on the spot (for example\n<code>openssl rand -base64 24<\/code>):<\/p>\n<pre class=\"sql\"><code>CREATE ROLE niwe_acme LOGIN PASSWORD &#39;PUT-A-LONG-RANDOM-PASSWORD-HERE&#39;;\nCREATE DATABASE niwe_acme OWNER niwe_acme ENCODING &#39;UTF8&#39;;<\/code><\/pre>\n<p>Notes:<\/p>\n<ul>\n<li>The database must be <strong>empty<\/strong>. On the first start the\nprogram creates every table by itself (Flyway: migration V1 is the\nbaseline, V2 the licence tables, then every later migration). This takes\nabout a minute. Never create tables by hand.<\/li>\n<li>The user owns the database and needs no other rights. Do\n<strong>not<\/strong> give the application the PostgreSQL superuser.<\/li>\n<li>Write the password in the customer's <strong>private settings\nfile<\/strong> (chapter 5) or in the service's environment, and in your\npassword manager. It must <strong>not<\/strong> be in a repository, an\ne-mail or a chat.<\/li>\n<li>PostgreSQL listens on <code>localhost<\/code> only. If a managed\ndatabase is used, allow only the application server's address.<\/li>\n<\/ul>\n<h2 id=\"checks\">Checks<\/h2>\n<ul>\n<li><code>psql -h localhost -U niwe_acme niwe_acme -c \"select 1\"<\/code>\nworks.<\/li>\n<li>After the first start of the backend, <code>\\dt<\/code> lists\nhundreds of tables and\n<code>select count(*) from flyway_schema_history;<\/code> shows the\napplied migrations. The newest migration of the version being installed\nmust be the last row, with <code>success<\/code> true.<\/li>\n<\/ul>\n<h2 id=\"backups-at-the-database-level\">Backups at the database\nlevel<\/h2>\n<p>The program takes <strong>its own nightly backup<\/strong> (a\n<code>pg_dump<\/code> into the <code>backups<\/code> folder next to the\njar; see chapter 7). That is a good first line. For a customer that\nmatters, also make a <strong>server-level<\/strong> backup: a cron job\nthat runs <code>pg_dump -Fc<\/code> to another disk and copies it off the\nmachine. Both are described in chapter 7. A backup that has never been\nrestored is not a backup: restore one into a spare database during the\ninstallation (chapter 6, step 12).<\/p>\n", "text": " One database for each customer, with its own user. Run this as the PostgreSQL administrator ( sudo -u postgres psql ), replacing acme with the customer code and the password with a long random one made on the spot (for example openssl rand -base64 24 ): CREATE ROLE niwe_acme LOGIN PASSWORD 'PUT-A-LONG-RANDOM-PASSWORD-HERE'; CREATE DATABASE niwe_acme OWNER niwe_acme ENCODING 'UTF8'; Notes: The database must be empty . On the first start the program creates every table by itself (Flyway: migration V1 is the baseline, V2 the licence tables, then every later migration). This takes about a minute. Never create tables by hand. The user owns the database and needs no other rights. Do not give the application the PostgreSQL superuser. Write the password in the customer's private settings file (chapter 5) or in the service's environment, and in your password manager. It must not be in a repository, an e-mail or a chat. PostgreSQL listens on localhost only. If a managed database is used, allow only the application server's address. Checks psql -h localhost -U niwe_acme niwe_acme -c \"select 1\" works. After the first start of the backend, \\dt lists hundreds of tables and select count(*) from flyway_schema_history; shows the applied migrations. The newest migration of the version being installed must be the last row, with success true. Backups at the database level The program takes its own nightly backup (a pg_dump into the backups folder next to the jar; see chapter 7). That is a good first line. For a customer that matters, also make a server-level backup: a cron job that runs pg_dump -Fc to another disk and copies it off the machine. Both are described in chapter 7. A backup that has never been restored is not a backup: restore one into a spare database during the installation (chapter 6, step 12). "}, {"id": "install-4-building-the-program", "manual": "install", "n": 4, "title": "Building the program", "html": "\n<p>You build <strong>once for each version<\/strong>, not once for each\ncustomer. The same jar and the same frontend folder go to every\ncustomer.<\/p>\n<h2 id=\"what-you-need-on-the-build-machine\">What you need on the build\nmachine<\/h2>\n<p>Java 21 and Maven for the backend; Node.js (the version the project\nuses) and npm for the frontend; the project's source at the tag of the\nversion you are building.<\/p>\n<h2 id=\"backend\">Backend<\/h2>\n<pre class=\"bash\"><code>cd backend\nmvn clean verify          # compiles, runs the tests, makes target/pos-app-&lt;version&gt;.jar<\/code><\/pre>\n<p>The result is <code>backend/target/pos-app-&lt;version&gt;.jar<\/code>\n(for example <code>pos-app-1.76.0.jar<\/code>). It contains the program\nand its migrations. Check that the version number in the file name is\nthe one you meant to build. Keep the jar: the same file goes to every\ncustomer, and the old jar is your way back (chapter 7).<\/p>\n<div class=\"callout warning\">\n<p><strong>Warning:<\/strong> Do not start a customer's server with the\n<code>dev<\/code> profile. It turns on demo data, a known admin password\nand the switch that treats every module as licensed. Customer servers\nuse no profile, or the customer's own private settings file.<\/p>\n<\/div>\n<h2 id=\"frontend\">Frontend<\/h2>\n<pre class=\"bash\"><code>cd frontend\nnpm ci\nnpx ng build --configuration production<\/code><\/pre>\n<p>The result is the folder\n<code>frontend/dist/pos-frontend/browser/<\/code> (the folder that\ncontains <code>index.html<\/code>). Pack it for shipping:\n<code>tar -czf niwe-1.76.0-frontend.tgz -C dist/pos-frontend/browser .<\/code>.\nThe production build asks for the API at the <strong>relative address\n<code>/api<\/code><\/strong>, so it works behind any domain and any\ncertificate with no change.<\/p>\n<ul>\n<li>Do <strong>not<\/strong> use the <code>niweSoft<\/code>,\n<code>accounting<\/code> or <code>store<\/code> build configurations for a\ncustomer: they are NIWE's own sites and may point to NIWE's own\naddresses.<\/li>\n<li>The files carry a hash in their names, so a browser fetches new\nfiles after each release; the page <code>index.html<\/code> itself is\nalways asked from the network first.<\/li>\n<li><strong>Payment logos.<\/strong> If the customer uses MTN Mobile\nMoney or Airtel Money, put the official logo files at\n<code>frontend/src/assets/payment/mtn_momo.png<\/code> and\n<code>airtel_money.png<\/code> <strong>before<\/strong> building (the\nlogos are trademarks and are not shipped). Without them the buttons show\nthe provider's name, which works.<\/li>\n<\/ul>\n<h2 id=\"what-to-keep\">What to keep<\/h2>\n<p>For each version keep: the jar, the zipped frontend folder, the\nrelease notes, and the output of the build (so you can show it was\nclean). Name them with the version, for example\n<code>niwe-1.76.0-backend.jar<\/code> and\n<code>niwe-1.76.0-frontend.tgz<\/code>, in one place that everybody who\ndeploys can reach. The customer servers receive these files; they do not\nbuild.<\/p>\n<h2 id=\"before-you-ship-a-version-to-customers\">Before you ship a\nversion to customers<\/h2>\n<ol type=\"1\">\n<li>The build is clean and the tests pass.<\/li>\n<li>The version was tried on a <strong>copy of a real customer's\ndatabase<\/strong> (a restored backup): the migrations ran, you could\nsign in, and the main screens opened.<\/li>\n<li>The release notes list every <strong>one-time action<\/strong> (a new\nsetting, a new web server rule, a new key) and say which versions they\napply to.<\/li>\n<li>The <strong>Release and upgrade notes for customers<\/strong> has a\nnew row for the version.<\/li>\n<\/ol>\n", "text": " You build once for each version , not once for each customer. The same jar and the same frontend folder go to every customer. What you need on the build machine Java 21 and Maven for the backend; Node.js (the version the project uses) and npm for the frontend; the project's source at the tag of the version you are building. Backend cd backend mvn clean verify # compiles, runs the tests, makes target/pos-app-<version>.jar The result is backend/target/pos-app-<version>.jar (for example pos-app-1.76.0.jar ). It contains the program and its migrations. Check that the version number in the file name is the one you meant to build. Keep the jar: the same file goes to every customer, and the old jar is your way back (chapter 7). Warning: Do not start a customer's server with the dev profile. It turns on demo data, a known admin password and the switch that treats every module as licensed. Customer servers use no profile, or the customer's own private settings file. Frontend cd frontend npm ci npx ng build --configuration production The result is the folder frontend/dist/pos-frontend/browser/ (the folder that contains index.html ). Pack it for shipping: tar -czf niwe-1.76.0-frontend.tgz -C dist/pos-frontend/browser . . The production build asks for the API at the relative address /api , so it works behind any domain and any certificate with no change. Do not use the niweSoft , accounting or store build configurations for a customer: they are NIWE's own sites and may point to NIWE's own addresses. The files carry a hash in their names, so a browser fetches new files after each release; the page index.html itself is always asked from the network first. Payment logos. If the customer uses MTN Mobile Money or Airtel Money, put the official logo files at frontend/src/assets/payment/mtn_momo.png and airtel_money.png before building (the logos are trademarks and are not shipped). Without them the buttons show the provider's name, which works. What to keep For each version keep: the jar, the zipped frontend folder, the release notes, and the output of the build (so you can show it was clean). Name them with the version, for example niwe-1.76.0-backend.jar and niwe-1.76.0-frontend.tgz , in one place that everybody who deploys can reach. The customer servers receive these files; they do not build. Before you ship a version to customers The build is clean and the tests pass. The version was tried on a copy of a real customer's database (a restored backup): the migrations ran, you could sign in, and the main screens opened. The release notes list every one-time action (a new setting, a new web server rule, a new key) and say which versions they apply to. The Release and upgrade notes for customers has a new row for the version. "}, {"id": "install-5-installing-a-customer", "manual": "install", "n": 5, "title": "Installing a customer", "html": "\n<p>This is the routine for a <strong>new customer on a prepared\nserver<\/strong>. Replace <code>acme<\/code> and the numbers with the\ncustomer's. It takes about an hour once the domain points to the\nserver.<\/p>\n<h2 id=\"point-the-domain\">Point the domain<\/h2>\n<p>Create the DNS record (for example <code>erp.acme.com<\/code>)\npointing to the server's address, and wait until it answers.<\/p>\n<h2 id=\"create-the-folders-and-put-the-files\">Create the folders and put\nthe files<\/h2>\n<pre class=\"bash\"><code>sudo mkdir -p /opt/niwe/acme/config /var/www/niwe/acme\nsudo cp niwe-1.76.0-backend.jar /opt/niwe/acme/pos-app.jar\nsudo tar -xzf niwe-1.76.0-frontend.tgz -C /var/www/niwe/acme\nsudo chown -R niwe:niwe /opt/niwe/acme<\/code><\/pre>\n<p>The jar has a <strong>fixed name<\/strong> (<code>pos-app.jar<\/code>)\ninside the customer's folder, so the service file never changes. Keep\nthe version-named copy in your store.<\/p>\n<h2 id=\"the-customers-private-settings\">The customer's private\nsettings<\/h2>\n<p>Create <code>/opt/niwe/acme/config/application.properties<\/code>. The\nprogram reads a <code>config<\/code> folder next to where it is started,\nand this file wins over the defaults inside the jar. It holds\n<strong>this customer's<\/strong> values and secrets, and it lives only\non this server (never in a repository):<\/p>\n<pre class=\"properties\"><code># --- database (chapter 3)\nspring.datasource.url=jdbc:postgresql://localhost:5432/niwe_acme\nspring.datasource.username=niwe_acme\nspring.datasource.password=THE-DATABASE-PASSWORD\n\n# --- the program\nserver.port=9101\nserver.forward-headers-strategy=native\napp.jwt.secret=A-LONG-RANDOM-VALUE-OF-AT-LEAST-32-BYTES\napp.frontend-url=https://erp.acme.com\napp.cors.allowed-origins=https://erp.acme.com\n\n# --- first start\napp.seed-demo-data=false\napp.accounting.chart-country=RWANDA\n# optional: the first administrator&#39;s password; if empty a random one is written once to the log\n# app.initial-admin-password=\n\n# --- licence requests are e-mailed here\napp.license.vendor-email=licences@niwe.example<\/code><\/pre>\n<p>Make the file readable only by the service account:\n<code>sudo chmod 600 /opt/niwe/acme/config/application.properties<\/code>.<\/p>\n<p>What each line means and how to choose it:<\/p>\n<div class=\"tablewrap\"><table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Setting<\/th>\n<th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td><code>spring.datasource.*<\/code><\/td>\n<td>The customer's database address, user and password.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><code>server.port<\/code><\/td>\n<td>The local port of this customer's backend (from your port\nplan).<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><code>server.forward-headers-strategy=native<\/code><\/td>\n<td>Needed behind nginx, so limits per connection see each visitor.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><code>app.jwt.secret<\/code><\/td>\n<td><strong>Unique for each customer.<\/strong> Make it with\n<code>openssl rand -base64 48<\/code>. The value inside the jar is public\n(it is in the source): leaving it means anybody can forge a\nsign-in.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><code>app.frontend-url<\/code><\/td>\n<td>The public address, <code>https://<\/code> and no trailing slash. It\nbuilds the links in e-mails, driver links, share previews and the\nsitemap.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><code>app.cors.allowed-origins<\/code><\/td>\n<td>The same address (comma-separated if there are more).<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><code>app.seed-demo-data=false<\/code><\/td>\n<td>Keep it <code>false<\/code>. Demo data and demo passwords are for\nlearning only.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><code>app.accounting.chart-country<\/code><\/td>\n<td><code>RWANDA<\/code> or <code>CHAD<\/code>: the suggestion on the\nfirst-time chart screen. The administrator picks the chart on screen at\nthe first sign-in and it is then locked in.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><code>app.initial-admin-password<\/code><\/td>\n<td>Optional. Without it a random password is written once to the log on\nthe very first start (look for <em>FIRST START<\/em>).<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><code>app.backup.directory<\/code><\/td>\n<td>Optional. Where backups go (default: the <code>backups<\/code> folder\nnext to the jar).<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><code>app.backup.pg-dump-path<\/code>,\n<code>app.backup.psql-path<\/code><\/td>\n<td>Only if <code>pg_dump<\/code> and <code>psql<\/code> are not on the\nservice's PATH.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Payment provider keys, text provider and anything else\nsecret<\/strong> are added to this same file, or to the service's\nenvironment, only when the customer is ready to use them (see the\nonboarding guide). Never put the same value in two customers' files.\nEnvironment variables are the setting names in capitals with dots and\ndashes turned into underscores (<code>APP_JWT_SECRET<\/code>).<\/p>\n<h2 id=\"the-service\">The service<\/h2>\n<p><code>/etc/systemd/system/niwe-acme.service<\/code>:<\/p>\n<pre class=\"ini\"><code>[Unit]\nDescription=NIWE ERP (acme)\nAfter=network.target postgresql.service\n\n[Service]\nUser=niwe\nWorkingDirectory=/opt/niwe/acme\nExecStart=/usr/bin/java -Xmx1g -jar /opt/niwe/acme/pos-app.jar\nRestart=on-failure\nRestartSec=10\nSuccessExitStatus=143\n\n[Install]\nWantedBy=multi-user.target<\/code><\/pre>\n<p>The <strong>working directory<\/strong> is what makes\n<code>config/<\/code>, <code>logs/<\/code> and <code>backups/<\/code> live\nnext to the jar. The account that runs the service must be allowed to\nwrite in that folder (the program creates <code>logs<\/code> and\n<code>backups<\/code> when they are missing).<\/p>\n<pre class=\"bash\"><code>sudo systemctl daemon-reload\nsudo systemctl enable --now niwe-acme\nsudo journalctl -u niwe-acme -f        # or: tail -f /opt/niwe/acme/logs/niwe-erp.log<\/code><\/pre>\n<p>Wait for the line <strong>Started PosApplication<\/strong>. The first\nstart applies every migration and takes about a minute; a few seconds\nafter it the program also adds missing accounts to the chart (backfill).\nWatch for lines that say <em>ERROR<\/em>, <em>Migration<\/em> failed or\n<em>Schema-validation<\/em>.<\/p>\n<h2 id=\"nginx\">nginx<\/h2>\n<p><code>/etc/nginx/sites-available/acme.conf<\/code>, then link it into\n<code>sites-enabled<\/code>:<\/p>\n<pre class=\"nginx\"><code>server {\n    listen 80;\n    server_name erp.acme.com;\n    location /.well-known/acme-challenge/ { root /var/www/certbot; }\n    location / { return 301 https://$host$request_uri; }\n}\n\nserver {\n    listen 443 ssl http2;\n    server_name erp.acme.com;\n    # certificate lines are added by certbot\n    root /var/www/niwe/acme;\n    index index.html;\n    client_max_body_size 110m;\n\n    location /api/ {\n        proxy_pass http://127.0.0.1:9101;\n        proxy_set_header Host $host;\n        proxy_set_header X-Real-IP $remote_addr;\n        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n        proxy_set_header X-Forwarded-Proto $scheme;\n        proxy_set_header X-Forwarded-Host $host;\n        proxy_read_timeout 120s;\n    }\n\n    # the page itself is always asked from the network\n    location = /index.html { add_header Cache-Control &quot;no-cache&quot;; }\n\n    # the share-preview, sitemap and robots rules of the Online Store go here\n    # (copy them from docs/online-store-seo.md, using this customer&#39;s backend port)\n\n    location / { try_files $uri $uri/ /index.html; }\n}<\/code><\/pre>\n<p>Get the certificate with\n<code>sudo certbot --nginx -d erp.acme.com<\/code>, then\n<code>sudo nginx -t &amp;&amp; sudo systemctl reload nginx<\/code>.<\/p>\n<p>For a customer who uses the <strong>Online Store<\/strong>, add the\nrules from <code>docs/online-store-seo.md<\/code> (the <code>map<\/code>\nfor crawlers goes in the <code>http<\/code> block, the\n<code>location<\/code> blocks in the <code>server<\/code> block, and the\nbackend address is <code>127.0.0.1:9101<\/code> for this customer). Where\nthe file says <code>try_files /index.html =404<\/code> use\n<code>try_files $uri $uri/ /index.html<\/code> as noted there. Test with\n<code>curl -A \"facebookexternalhit/1.1\" \"https://erp.acme.com/shop\"<\/code>.<\/p>\n<h2 id=\"open-it\">Open it<\/h2>\n<p>Open <code>https://erp.acme.com<\/code>. The first page shows the\nstaff login (or the shop when the Online Store module is on). Sign in as\n<code>admin<\/code> with the password from the settings file or from the\nlog line <em>FIRST START<\/em>, <strong>change the password at\nonce<\/strong> (My profile), and carry on with chapter 6.<\/p>\n", "text": " This is the routine for a new customer on a prepared server . Replace acme and the numbers with the customer's. It takes about an hour once the domain points to the server. Point the domain Create the DNS record (for example erp.acme.com ) pointing to the server's address, and wait until it answers. Create the folders and put the files sudo mkdir -p /opt/niwe/acme/config /var/www/niwe/acme sudo cp niwe-1.76.0-backend.jar /opt/niwe/acme/pos-app.jar sudo tar -xzf niwe-1.76.0-frontend.tgz -C /var/www/niwe/acme sudo chown -R niwe:niwe /opt/niwe/acme The jar has a fixed name ( pos-app.jar ) inside the customer's folder, so the service file never changes. Keep the version-named copy in your store. The customer's private settings Create /opt/niwe/acme/config/application.properties . The program reads a config folder next to where it is started, and this file wins over the defaults inside the jar. It holds this customer's values and secrets, and it lives only on this server (never in a repository): # --- database (chapter 3) spring.datasource.url=jdbc:postgresql://localhost:5432/niwe_acme spring.datasource.username=niwe_acme spring.datasource.password=THE-DATABASE-PASSWORD # --- the program server.port=9101 server.forward-headers-strategy=native app.jwt.secret=A-LONG-RANDOM-VALUE-OF-AT-LEAST-32-BYTES app.frontend-url=https://erp.acme.com app.cors.allowed-origins=https://erp.acme.com # --- first start app.seed-demo-data=false app.accounting.chart-country=RWANDA # optional: the first administrator's password; if empty a random one is written once to the log # app.initial-admin-password= # --- licence requests are e-mailed here app.license.vendor-email=licences@niwe.example Make the file readable only by the service account: sudo chmod 600 /opt/niwe/acme/config/application.properties . What each line means and how to choose it: Setting Meaning spring.datasource.* The customer's database address, user and password. server.port The local port of this customer's backend (from your port plan). server.forward-headers-strategy=native Needed behind nginx, so limits per connection see each visitor. app.jwt.secret Unique for each customer. Make it with openssl rand -base64 48 . The value inside the jar is public (it is in the source): leaving it means anybody can forge a sign-in. app.frontend-url The public address, https:// and no trailing slash. It builds the links in e-mails, driver links, share previews and the sitemap. app.cors.allowed-origins The same address (comma-separated if there are more). app.seed-demo-data=false Keep it false . Demo data and demo passwords are for learning only. app.accounting.chart-country RWANDA or CHAD : the suggestion on the first-time chart screen. The administrator picks the chart on screen at the first sign-in and it is then locked in. app.initial-admin-password Optional. Without it a random password is written once to the log on the very first start (look for FIRST START ). app.backup.directory Optional. Where backups go (default: the backups folder next to the jar). app.backup.pg-dump-path , app.backup.psql-path Only if pg_dump and psql are not on the service's PATH. Payment provider keys, text provider and anything else secret are added to this same file, or to the service's environment, only when the customer is ready to use them (see the onboarding guide). Never put the same value in two customers' files. Environment variables are the setting names in capitals with dots and dashes turned into underscores ( APP_JWT_SECRET ). The service /etc/systemd/system/niwe-acme.service : [Unit] Description=NIWE ERP (acme) After=network.target postgresql.service [Service] User=niwe WorkingDirectory=/opt/niwe/acme ExecStart=/usr/bin/java -Xmx1g -jar /opt/niwe/acme/pos-app.jar Restart=on-failure RestartSec=10 SuccessExitStatus=143 [Install] WantedBy=multi-user.target The working directory is what makes config/ , logs/ and backups/ live next to the jar. The account that runs the service must be allowed to write in that folder (the program creates logs and backups when they are missing). sudo systemctl daemon-reload sudo systemctl enable --now niwe-acme sudo journalctl -u niwe-acme -f # or: tail -f /opt/niwe/acme/logs/niwe-erp.log Wait for the line Started PosApplication . The first start applies every migration and takes about a minute; a few seconds after it the program also adds missing accounts to the chart (backfill). Watch for lines that say ERROR , Migration failed or Schema-validation . nginx /etc/nginx/sites-available/acme.conf , then link it into sites-enabled : server { listen 80; server_name erp.acme.com; location /.well-known/acme-challenge/ { root /var/www/certbot; } location / { return 301 https://$host$request_uri; } } server { listen 443 ssl http2; server_name erp.acme.com; # certificate lines are added by certbot root /var/www/niwe/acme; index index.html; client_max_body_size 110m; location /api/ { proxy_pass http://127.0.0.1:9101; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-Host $host; proxy_read_timeout 120s; } # the page itself is always asked from the network location = /index.html { add_header Cache-Control \"no-cache\"; } # the share-preview, sitemap and robots rules of the Online Store go here # (copy them from docs/online-store-seo.md, using this customer's backend port) location / { try_files $uri $uri/ /index.html; } } Get the certificate with sudo certbot --nginx -d erp.acme.com , then sudo nginx -t && sudo systemctl reload nginx . For a customer who uses the Online Store , add the rules from docs/online-store-seo.md (the map for crawlers goes in the http block, the location blocks in the server block, and the backend address is 127.0.0.1:9101 for this customer). Where the file says try_files /index.html =404 use try_files $uri $uri/ /index.html as noted there. Test with curl -A \"facebookexternalhit/1.1\" \"https://erp.acme.com/shop\" . Open it Open https://erp.acme.com . The first page shows the staff login (or the shop when the Online Store module is on). Sign in as admin with the password from the settings file or from the log line FIRST START , change the password at once (My profile), and carry on with chapter 6. "}, {"id": "install-6-first-start-and-acceptance", "manual": "install", "n": 6, "title": "First start and acceptance", "html": "\n<p>After chapter 5 the program is running. These steps turn a running\nprogram into a customer's installation. Do them in this order and tick\neach one in the customer register.<\/p>\n<h2 id=\"the-checklist\">The checklist<\/h2>\n<ol type=\"1\">\n<li><strong>Sign in<\/strong> as <code>admin<\/code> over https and\n<strong>change the password<\/strong> (My profile). Remove or deactivate\nany demo account if one exists (there should be none with\n<code>app.seed-demo-data=false<\/code>).<\/li>\n<li><strong>Settings &gt; Modules<\/strong>: copy the\n<strong>installation id<\/strong> and send it to NIWE with the list of\nmodules the customer bought. NIWE issues a <code>.niwelic<\/code> licence\nfile signed for this id; <strong>upload<\/strong> it. The message\n<em>License installed<\/em> appears. A licence for another installation\nwill not work, and an installation restored from a backup keeps its\nid.<\/li>\n<li><strong>Activate<\/strong> the modules the customer needs. Activation\nis <strong>permanent<\/strong>, so activate only what the business will\nuse. Only the core modules (Sales, Purchases, Accounting) work with no\nlicence.<\/li>\n<li><strong>Accounting<\/strong>: the first-time screen asks for the\n<strong>chart of accounts country<\/strong> (Rwanda or Chad). It sets the\naccount numbers and the currency (RWF or XAF) and is locked afterwards:\nagree it with the customer's accountant first.<\/li>\n<li><strong>Settings &gt; Business details<\/strong> (name, address, tax\nnumber, logo), <strong>System settings<\/strong> (currency symbol, date\nformat, language: Chad starts in French, Rwanda in English),\n<strong>Taxes<\/strong> (VAT 18% for Rwanda) and <strong>Payment\nmethods<\/strong>.<\/li>\n<li><strong>Branches and warehouses<\/strong>, if the business has more\nthan the head office.<\/li>\n<li><strong>Roles and staff<\/strong>: one account for each person,\ncustom roles for the accountant, the store keeper and the cashiers, and\nthe approval permissions only for the people who need them\n(Administrator Manual, chapter 4).<\/li>\n<li><strong>E-mail settings<\/strong>: enter the sending account and\npress <strong>Send test email<\/strong>; a real message must arrive at a\nreal address. Password resets, reports and the shop's messages depend on\nit.<\/li>\n<li><strong>Server settings seen on screen<\/strong>: <strong>Settings\n&gt; Modules<\/strong> must not say <em>The developer switch is on<\/em>;\nthe page must be served over https (the padlock).<\/li>\n<li><strong>Backup now<\/strong> (Settings &gt; Backup &amp; Data) and\ncheck that the file appears in the list and in\n<code>/opt/niwe/acme/backups/<\/code>.<\/li>\n<li><strong>Copy the backup off the server<\/strong> (another machine or\ncloud storage), and set up the routine of chapter 7.<\/li>\n<li><strong>Restore test<\/strong>: restore that backup into a\n<strong>separate empty database<\/strong> (a spare one on this server),\nstart a second copy of the backend on a different port against it, sign\nin, and see the data. Then delete the test copy. A restore that has\nnever worked is not a backup.<\/li>\n<li><strong>Smoke test<\/strong> of the modules in use: make a sale at\nthe till and print a receipt, create an invoice, receive a purchase, and\ncheck that the entries appear in the Journal. For the Online Store: open\n<code>/shop<\/code>, place a cash order, accept and complete it, and read\nthe entries.<\/li>\n<li><strong>Write down<\/strong> in the customer register: the version,\nthe licence number and its expiry, the installation id, the modules, the\nport, the backup place, the date of the restore test and who to\ncall.<\/li>\n<\/ol>\n<h2 id=\"reading-the-first-start-log\">Reading the first-start log<\/h2>\n<p>On a clean first start you should see, in this order: Flyway creating\nthe schema and applying each migration (the last is the newest of this\nversion), the line <strong>Started PosApplication<\/strong>, then a few\nseconds later the accounting backfill adding any missing accounts. If\nthe administrator password was not set, a line starting <strong>FIRST\nSTART<\/strong> gives the one-time password: copy it once and then change\nit.<\/p>\n<h2 id=\"when-the-first-start-fails\">When the first start fails<\/h2>\n<div class=\"tablewrap\"><table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>What the log says<\/th>\n<th>What to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td><em>Connection refused<\/em> or <em>password authentication\nfailed<\/em><\/td>\n<td>The database is not running, the address is wrong, or the user or\npassword in <code>config/application.properties<\/code> is wrong. Test\nwith <code>psql<\/code> using the same values.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><em>Migration checksum mismatch<\/em><\/td>\n<td>A migration file differs from the one this database applied. You are\nrunning a different build than the database was made with. Use the right\njar; never edit a migration.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><em>Detected applied migration not resolved locally<\/em> or <em>a\nmigration it does not know<\/em><\/td>\n<td>The database was made by a <strong>newer<\/strong> version than this\njar. Deploy the newer version.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><em>Schema-validation: missing column / table<\/em><\/td>\n<td>The database is behind the code. This should not happen on an empty\ndatabase; if it is an old database, see the upgrade chapter of the\nAdministrator Manual (the one-time <code>dbsync<\/code> start, after a\nbackup).<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><em>Address already in use<\/em><\/td>\n<td>Another program (often a second copy of the same customer) uses the\nport. Check the port plan.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><em>Failed to create backup directory<\/em><\/td>\n<td>The service account cannot write in the folder next to the jar. Fix\nthe owner of <code>/opt/niwe/acme<\/code>.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"handing-over\">Handing over<\/h2>\n<p>Before you leave the customer: give the administrator the\n<strong>Administrator Manual<\/strong>, the <strong>User Manual<\/strong>\nand the <strong>Quick Start cards<\/strong> for the roles in use; tell\nthem who to call; and agree the date of the first upgrade window. The\n<strong>Customer onboarding guide<\/strong> carries on from here.<\/p>\n", "text": " After chapter 5 the program is running. These steps turn a running program into a customer's installation. Do them in this order and tick each one in the customer register. The checklist Sign in as admin over https and change the password (My profile). Remove or deactivate any demo account if one exists (there should be none with app.seed-demo-data=false ). Settings > Modules : copy the installation id and send it to NIWE with the list of modules the customer bought. NIWE issues a .niwelic licence file signed for this id; upload it. The message License installed appears. A licence for another installation will not work, and an installation restored from a backup keeps its id. Activate the modules the customer needs. Activation is permanent , so activate only what the business will use. Only the core modules (Sales, Purchases, Accounting) work with no licence. Accounting : the first-time screen asks for the chart of accounts country (Rwanda or Chad). It sets the account numbers and the currency (RWF or XAF) and is locked afterwards: agree it with the customer's accountant first. Settings > Business details (name, address, tax number, logo), System settings (currency symbol, date format, language: Chad starts in French, Rwanda in English), Taxes (VAT 18% for Rwanda) and Payment methods . Branches and warehouses , if the business has more than the head office. Roles and staff : one account for each person, custom roles for the accountant, the store keeper and the cashiers, and the approval permissions only for the people who need them (Administrator Manual, chapter 4). E-mail settings : enter the sending account and press Send test email ; a real message must arrive at a real address. Password resets, reports and the shop's messages depend on it. Server settings seen on screen : Settings > Modules must not say The developer switch is on ; the page must be served over https (the padlock). Backup now (Settings > Backup & Data) and check that the file appears in the list and in /opt/niwe/acme/backups/ . Copy the backup off the server (another machine or cloud storage), and set up the routine of chapter 7. Restore test : restore that backup into a separate empty database (a spare one on this server), start a second copy of the backend on a different port against it, sign in, and see the data. Then delete the test copy. A restore that has never worked is not a backup. Smoke test of the modules in use: make a sale at the till and print a receipt, create an invoice, receive a purchase, and check that the entries appear in the Journal. For the Online Store: open /shop , place a cash order, accept and complete it, and read the entries. Write down in the customer register: the version, the licence number and its expiry, the installation id, the modules, the port, the backup place, the date of the restore test and who to call. Reading the first-start log On a clean first start you should see, in this order: Flyway creating the schema and applying each migration (the last is the newest of this version), the line Started PosApplication , then a few seconds later the accounting backfill adding any missing accounts. If the administrator password was not set, a line starting FIRST START gives the one-time password: copy it once and then change it. When the first start fails What the log says What to do Connection refused or password authentication failed The database is not running, the address is wrong, or the user or password in config/application.properties is wrong. Test with psql using the same values. Migration checksum mismatch A migration file differs from the one this database applied. You are running a different build than the database was made with. Use the right jar; never edit a migration. Detected applied migration not resolved locally or a migration it does not know The database was made by a newer version than this jar. Deploy the newer version. Schema-validation: missing column / table The database is behind the code. This should not happen on an empty database; if it is an old database, see the upgrade chapter of the Administrator Manual (the one-time dbsync start, after a backup). Address already in use Another program (often a second copy of the same customer) uses the port. Check the port plan. Failed to create backup directory The service account cannot write in the folder next to the jar. Fix the owner of /opt/niwe/acme . Handing over Before you leave the customer: give the administrator the Administrator Manual , the User Manual and the Quick Start cards for the roles in use; tell them who to call; and agree the date of the first upgrade window. The Customer onboarding guide carries on from here. "}, {"id": "install-7-running-it-backups-upgrades-and-monitori", "manual": "install", "n": 7, "title": "Running it: backups,\nupgrades and monitoring", "html": "\n<h2 id=\"backups-three-layers\">Backups: three layers<\/h2>\n<ol type=\"1\">\n<li><strong>The program's nightly backup.<\/strong> A full database\nbackup runs every night (2 a.m. server time unless changed by\n<code>app.backup.cron<\/code>) into the <code>backups<\/code> folder next\nto the jar. Staff can also press <strong>Backup now<\/strong> in Settings\n&gt; Backup &amp; Data. These files include the migration history, so a\nrestore brings data and structure back together.<\/li>\n<li><strong>A server-level copy off the machine.<\/strong> The nightly\nfiles are on the same server, so if the server is lost the backups are\nlost with it. Copy the <code>backups<\/code> folder to another machine or\ncloud storage every day (for example <code>rclone<\/code> or\n<code>rsync<\/code> in a cron job), and keep the copies: <strong>daily\nfor 30 days, one a week for three months, one a month for a\nyear<\/strong>. Encrypt the copy if it leaves the customer's country or\nyour control, because a backup holds customers' names, phone numbers and\naddresses.<\/li>\n<li><strong>Files outside the database.<\/strong> If the customer uses a\nstorage folder for uploaded documents, include it in the same copy.\nBanner and product pictures are in the database and so in the\nbackup.<\/li>\n<\/ol>\n<div class=\"callout warning\">\n<p><strong>Warning:<\/strong> Restoring a backup made by a\n<strong>newer<\/strong> version into an <strong>older<\/strong> version\nfails (\"a migration it does not know\"). Restore into the version that\nmade it, or a newer one.<\/p>\n<\/div>\n<p><strong>Restore drill.<\/strong> Every quarter, and once at\ninstallation: restore the latest copy into a spare database, start a\nspare backend against it, and check that you can sign in and that\ntoday's sales are there. Write the date in the register.<\/p>\n<p><strong>Restoring in an emergency.<\/strong> In the program: Settings\n&gt; Backup &amp; Data &gt; <strong>Restore<\/strong> (or upload a file).\nIt puts the whole system in maintenance mode while it runs, and you\nrestart the application when it finishes. If the program itself will not\nstart, restore with the database tools: stop the service, drop and\nrecreate the empty database (chapter 3), <code>pg_restore<\/code> the\ndump, start the service of the same version as the dump.<\/p>\n<h2 id=\"upgrading-a-customer\">Upgrading a customer<\/h2>\n<p>The same routine for every customer, whether the gap is one version\nor twenty:<\/p>\n<ol type=\"1\">\n<li><strong>Read the release notes<\/strong> of every version between the\ncustomer's version and the target, and the <strong>one-time\nactions<\/strong> in the <em>Release and upgrade notes for customers<\/em>\n(a new setting, a new nginx rule, a new key, a check of the chart of\naccounts).<\/li>\n<li><strong>Announce<\/strong> a short window to the customer.<\/li>\n<li><strong>Backup<\/strong>: press Backup now, then copy the file off\nthe server. Note the current version and keep the <strong>old\njar<\/strong>.<\/li>\n<li>For a customer far behind, <strong>try the upgrade first on a\ncopy<\/strong>: restore the backup into a spare database and start the\nnew jar against it. Watch the migrations run.<\/li>\n<li><strong>Stop<\/strong> the service:\n<code>sudo systemctl stop niwe-acme<\/code>.<\/li>\n<li><strong>Replace<\/strong> the jar (<code>cp<\/code> the new one over\n<code>/opt/niwe/acme/pos-app.jar<\/code>, keeping the old one as\n<code>pos-app.jar.prev-1.75.0<\/code>) and the frontend folder (replace\nthe files in <code>/var/www/niwe/acme<\/code>).<\/li>\n<li>Apply the <strong>one-time actions<\/strong> (settings in\n<code>config/application.properties<\/code>, nginx rules, then\n<code>nginx -t &amp;&amp; systemctl reload nginx<\/code>).<\/li>\n<li><strong>Start<\/strong> the service and watch the log: every new\nmigration applied, then <strong>Started PosApplication<\/strong>.<\/li>\n<li><strong>Check<\/strong>: sign in, Settings &gt; Modules (licence and\nmodules), open a few screens, make a test sale; after a few seconds\ncheck <strong>Accounting &gt; Chart of accounts<\/strong> for new\naccounts when the release notes say so.<\/li>\n<li>Write the new version and the date in the customer register.<\/li>\n<\/ol>\n<p><strong>Going back.<\/strong> If the upgrade fails <em>before<\/em> the\nmigrations ran, put the old jar and frontend back and start. If\nmigrations ran, the database is already newer: <strong>restore the\nbackup<\/strong> you took in step 3 into an empty database (the program\ncannot undo a migration), put the old jar and frontend back and start.\nTell the developer the exact error from the log.<\/p>\n<p>Never edit or delete a migration, never run SQL by hand on a\ncustomer's database without a backup, and never upgrade on a Friday\nafternoon.<\/p>\n<h2 id=\"monitoring\">Monitoring<\/h2>\n<p>You do not need much to notice trouble early:<\/p>\n<ul>\n<li><strong>Is it up?<\/strong> An uptime check on\n<code>https://erp.acme.com/<\/code> (a free monitor is enough) that\ne-mails you.<\/li>\n<li><strong>Disk space<\/strong> on the data disk and the backups disk,\nwith an alert at 80%.<\/li>\n<li><strong>The logs<\/strong>: <code>logs/niwe-erp-error.log<\/code>\nholds errors, <code>logs/niwe-erp.log<\/code> everything,\n<code>logs/niwe-access.log<\/code> the requests. Staff can read the\nserver log in Settings &gt; Server logs. Look at the error log after\nevery upgrade and once a week.<\/li>\n<li><strong>Backups arrived<\/strong>: a daily check (or an automatic\none) that last night's file exists off the server and is not empty.<\/li>\n<li><strong>Licence expiry<\/strong>: the administrator sees a warning in\nthe last 30 days; you should know the date from the register too.<\/li>\n<li><strong>Certificate expiry<\/strong>: certbot renews by itself; check\n<code>systemctl list-timers<\/code> shows the renewal timer.<\/li>\n<\/ul>\n<h2 id=\"moving-a-customer-to-another-server\">Moving a customer to\nanother server<\/h2>\n<p>Take a backup; install the same version on the new server as in\nchapters 2 to 5 (the <strong>same installation id comes with the\ndatabase<\/strong>, so the licence keeps working); restore the backup\ninto the new empty database; copy the settings file (change addresses\nonly if they changed); point the domain to the new server; start. Keep\nthe old server unchanged until the customer has worked a day on the new\none.<\/p>\n", "text": " Backups: three layers The program's nightly backup. A full database backup runs every night (2 a.m. server time unless changed by app.backup.cron ) into the backups folder next to the jar. Staff can also press Backup now in Settings > Backup & Data. These files include the migration history, so a restore brings data and structure back together. A server-level copy off the machine. The nightly files are on the same server, so if the server is lost the backups are lost with it. Copy the backups folder to another machine or cloud storage every day (for example rclone or rsync in a cron job), and keep the copies: daily for 30 days, one a week for three months, one a month for a year . Encrypt the copy if it leaves the customer's country or your control, because a backup holds customers' names, phone numbers and addresses. Files outside the database. If the customer uses a storage folder for uploaded documents, include it in the same copy. Banner and product pictures are in the database and so in the backup. Warning: Restoring a backup made by a newer version into an older version fails (\"a migration it does not know\"). Restore into the version that made it, or a newer one. Restore drill. Every quarter, and once at installation: restore the latest copy into a spare database, start a spare backend against it, and check that you can sign in and that today's sales are there. Write the date in the register. Restoring in an emergency. In the program: Settings > Backup & Data > Restore (or upload a file). It puts the whole system in maintenance mode while it runs, and you restart the application when it finishes. If the program itself will not start, restore with the database tools: stop the service, drop and recreate the empty database (chapter 3), pg_restore the dump, start the service of the same version as the dump. Upgrading a customer The same routine for every customer, whether the gap is one version or twenty: Read the release notes of every version between the customer's version and the target, and the one-time actions in the Release and upgrade notes for customers (a new setting, a new nginx rule, a new key, a check of the chart of accounts). Announce a short window to the customer. Backup : press Backup now, then copy the file off the server. Note the current version and keep the old jar . For a customer far behind, try the upgrade first on a copy : restore the backup into a spare database and start the new jar against it. Watch the migrations run. Stop the service: sudo systemctl stop niwe-acme . Replace the jar ( cp the new one over /opt/niwe/acme/pos-app.jar , keeping the old one as pos-app.jar.prev-1.75.0 ) and the frontend folder (replace the files in /var/www/niwe/acme ). Apply the one-time actions (settings in config/application.properties , nginx rules, then nginx -t && systemctl reload nginx ). Start the service and watch the log: every new migration applied, then Started PosApplication . Check : sign in, Settings > Modules (licence and modules), open a few screens, make a test sale; after a few seconds check Accounting > Chart of accounts for new accounts when the release notes say so. Write the new version and the date in the customer register. Going back. If the upgrade fails before the migrations ran, put the old jar and frontend back and start. If migrations ran, the database is already newer: restore the backup you took in step 3 into an empty database (the program cannot undo a migration), put the old jar and frontend back and start. Tell the developer the exact error from the log. Never edit or delete a migration, never run SQL by hand on a customer's database without a backup, and never upgrade on a Friday afternoon. Monitoring You do not need much to notice trouble early: Is it up? An uptime check on https://erp.acme.com/ (a free monitor is enough) that e-mails you. Disk space on the data disk and the backups disk, with an alert at 80%. The logs : logs/niwe-erp-error.log holds errors, logs/niwe-erp.log everything, logs/niwe-access.log the requests. Staff can read the server log in Settings > Server logs. Look at the error log after every upgrade and once a week. Backups arrived : a daily check (or an automatic one) that last night's file exists off the server and is not empty. Licence expiry : the administrator sees a warning in the last 30 days; you should know the date from the register too. Certificate expiry : certbot renews by itself; check systemctl list-timers shows the renewal timer. Moving a customer to another server Take a backup; install the same version on the new server as in chapters 2 to 5 (the same installation id comes with the database , so the licence keeps working); restore the backup into the new empty database; copy the settings file (change addresses only if they changed); point the domain to the new server; start. Keep the old server unchanged until the customer has worked a day on the new one. "}, {"id": "install-8-the-customer-register-and-the-security-r", "manual": "install", "n": 8, "title": "The customer\nregister and the security routine", "html": "\n<h2 id=\"the-customer-register\">The customer register<\/h2>\n<p>Keep one table (a spreadsheet kept in a shared place that only the\nteam can reach) with a line for each customer. It is the first thing you\nopen when anything happens. <strong>It does not hold passwords or\nkeys<\/strong>: those are in the password manager.<\/p>\n<div class=\"tablewrap\"><table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Column<\/th>\n<th>Example<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Customer code, name, country<\/td>\n<td><code>acme<\/code>, Acme Ltd, Rwanda<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Contact person for IT and for the business<\/td>\n<td>names, phones, e-mails<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Server, address and domain<\/td>\n<td>server-3, erp.acme.com<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Backend port, folder, database name<\/td>\n<td>9101, /opt/niwe/acme, niwe_acme<
