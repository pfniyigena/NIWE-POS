> location;\nmove it to a <em>Sales<\/em> location with a stock transfer.)<\/li>\n<li>Add lines: search a product, set <strong>Quantity<\/strong>,\n<strong>Unit cost<\/strong> (and <strong>Discount %<\/strong> or a\nwhole-order <strong>Discount<\/strong>). The form can be\n<strong>pre-filled with low-stock items<\/strong> when you come from\nReorder.<\/li>\n<li><strong>Save draft<\/strong>. On the order, press <strong>Send to\nsupplier<\/strong> (e-mails the order) or <strong>Print<\/strong>. Use\n<strong>Edit<\/strong> while it is still a draft, and <strong>Cancel\norder<\/strong> if it will not go ahead.<\/li>\n<\/ol>\n<h3 id=\"recording-a-receipt-goods-arrive\">Recording a receipt (goods\narrive)<\/h3>\n<p>On the order, <strong>Record a receipt<\/strong>:<\/p>\n<ul>\n<li>For each line enter <strong>Receiving now<\/strong> (the remaining\nquantity is shown). Partial deliveries are fine.<\/li>\n<li>For batch or serial products enter the <strong>Batch / lot\nno.<\/strong> and expiry, or the <strong>Serial numbers<\/strong> (one per\nline or comma-separated).<\/li>\n<li><strong>Landed cost for this delivery (optional)<\/strong>: freight,\nduty, clearing. It is spread over the delivered products by value and\nadded to their cost and to Inventory in the books. Record freight here,\n<strong>not<\/strong> as a separate expense, or it would be counted\ntwice. Tick <em>Already paid<\/em> if you paid it at once; otherwise it\nis recorded as owed.<\/li>\n<li>Press <strong>Record receipt<\/strong>. Stock goes up. When all lines\nare fully received, the order is complete and a bill is generated.<\/li>\n<li>You can print a <strong>goods received note (GRN)<\/strong> for the\ndelivery.<\/li>\n<\/ul>\n<h3 id=\"returning-goods-to-a-supplier\">Returning goods to a\nsupplier<\/h3>\n<p>On the order press <strong>Process a return<\/strong>: choose the\nproduct, <strong>Returning now<\/strong> and a <strong>Reason<\/strong>.\nThe order shows <strong>Returned<\/strong> and <strong>Refund due from\nsupplier<\/strong>. All returns are listed in <strong>Purchase\nreturns<\/strong>.<\/p>\n<h2 id=\"bills\">Bills<\/h2>\n<p>A <strong>bill<\/strong> is the supplier's invoice to you. It is\ngenerated once an order is fully received, or manually from the\norder.<\/p>\n<ul>\n<li><strong>Bills<\/strong> lists them: Bill #, Purchase order, Supplier,\nDate, Status, Total, <strong>Outstanding<\/strong>.<\/li>\n<li>A draft bill can be edited; press <strong>Issue bill<\/strong> to\nmake it official (it then posts to accounting). Use <strong>Delete\ndraft<\/strong> to remove an unissued one.<\/li>\n<li><strong>Record payment<\/strong> from the bill or from the supplier\npage. <strong>Void bill<\/strong> (with a reason) if it was wrong.<\/li>\n<\/ul>\n<h2 id=\"supplier-payments\">Supplier payments<\/h2>\n<p><strong>Suppliers &gt; Record payment<\/strong> (or from a bill):<\/p>\n<ol type=\"1\">\n<li>Enter the <strong>Payment amount<\/strong> and optional\n<strong>Note<\/strong>.<\/li>\n<li>The screen lists the supplier's unpaid orders and bills (Order /\nBill #, Date, Total cost, Outstanding). Press <strong>Suggest\noldest-first<\/strong>, or type an amount in <strong>Allocate<\/strong>\nfor each. The allocated total must equal the payment amount.<\/li>\n<li>Save. <strong>Print receipt<\/strong> gives a Supplier Payment\nReceipt showing what it was applied to and the <strong>Remaining\nbalance<\/strong>.<\/li>\n<\/ol>\n<p><strong>Supplier payments<\/strong> lists all payments, with\n<strong>Payment history<\/strong>.<\/p>\n<h2 id=\"supplier-statement\">Supplier statement<\/h2>\n<p><strong>Suppliers &gt; Supplier statement<\/strong>: choose a supplier\nand dates to see what you bought, what you paid and the balance. Export\nto Excel or PDF.<\/p>\n<h2 id=\"reports\">Reports<\/h2>\n<p><strong>Purchases &gt; Reports<\/strong>: Purchase Orders, Outstanding\nPayables Report, Purchases by Supplier, Purchases by Product, Purchases\nby Category, Bills, Purchase Returns, Supplier Payments,\n<strong>Payables Aging<\/strong>. All filter by date and export to Excel,\nPDF and CSV.<\/p>\n", "text": " The Purchases group covers buying: Purchase requisitions, Purchase orders, Bills, Purchase returns, Reports . Suppliers has the supplier list, Supplier prices , Supplier payments and the Supplier statement . The buying path Requisition (a request to buy, optional) → Purchase order (sent to the supplier) → Receipt (goods arrive, stock goes up) → Bill (what you owe) → Supplier payment . Suppliers Suppliers > New supplier : Name, Contact person, Phone, Email, Tax ID (VAT or tax registration number), Address , Notes , and Active (selectable on a new purchase order). Untick Active for a supplier you no longer use; do not delete a supplier with history. You can also add a supplier on the spot from a purchase order with + New supplier . Supplier prices Supplier prices records agreed costs: Supplier, Product, Unit cost, Valid from, Valid to, Note . When you add that product to a purchase order for that supplier the agreed cost is suggested. Purchase requisitions A requisition asks for something to be bought, and goes to someone who may approve it. Purchase requisitions > New : add Notes , then search products and set Quantity requested (with an optional note per line). Save draft , then submit it for approval. A person with the Approve purchase requisitions right approves or rejects it. An approved requisition can be turned into a purchase order. Tip: The Reorder screen (Inventory) can create a requisition from every product that is low on stock, in one click. Purchase orders Purchase orders > New . Choose the Supplier , Expected date and, if you have several warehouses, Receive into warehouse . (Received stock lands in that warehouse's Receiving location; move it to a Sales location with a stock transfer.) Add lines: search a product, set Quantity , Unit cost (and Discount % or a whole-order Discount ). The form can be pre-filled with low-stock items when you come from Reorder. Save draft . On the order, press Send to supplier (e-mails the order) or Print . Use Edit while it is still a draft, and Cancel order if it will not go ahead. Recording a receipt (goods arrive) On the order, Record a receipt : For each line enter Receiving now (the remaining quantity is shown). Partial deliveries are fine. For batch or serial products enter the Batch / lot no. and expiry, or the Serial numbers (one per line or comma-separated). Landed cost for this delivery (optional) : freight, duty, clearing. It is spread over the delivered products by value and added to their cost and to Inventory in the books. Record freight here, not as a separate expense, or it would be counted twice. Tick Already paid if you paid it at once; otherwise it is recorded as owed. Press Record receipt . Stock goes up. When all lines are fully received, the order is complete and a bill is generated. You can print a goods received note (GRN) for the delivery. Returning goods to a supplier On the order press Process a return : choose the product, Returning now and a Reason . The order shows Returned and Refund due from supplier . All returns are listed in Purchase returns . Bills A bill is the supplier's invoice to you. It is generated once an order is fully received, or manually from the order. Bills lists them: Bill #, Purchase order, Supplier, Date, Status, Total, Outstanding . A draft bill can be edited; press Issue bill to make it official (it then posts to accounting). Use Delete draft to remove an unissued one. Record payment from the bill or from the supplier page. Void bill (with a reason) if it was wrong. Supplier payments Suppliers > Record payment (or from a bill): Enter the Payment amount and optional Note . The screen lists the supplier's unpaid orders and bills (Order / Bill #, Date, Total cost, Outstanding). Press Suggest oldest-first , or type an amount in Allocate for each. The allocated total must equal the payment amount. Save. Print receipt gives a Supplier Payment Receipt showing what it was applied to and the Remaining balance . Supplier payments lists all payments, with Payment history . Supplier statement Suppliers > Supplier statement : choose a supplier and dates to see what you bought, what you paid and the balance. Export to Excel or PDF. Reports Purchases > Reports : Purchase Orders, Outstanding Payables Report, Purchases by Supplier, Purchases by Product, Purchases by Category, Bills, Purchase Returns, Supplier Payments, Payables Aging . All filter by date and export to Excel, PDF and CSV. "}, {"id": "user-6-inventory", "manual": "user", "n": 6, "title": "Inventory", "html": "\n<p>The <strong>Inventory<\/strong> group has: <strong>Products,\nCategories, Brands, Stock adjustments, Stock counts, Reorder, Branches,\nWarehouses, Stock transfers, Packaging rules, Breakdown stock, Reports,\nInventory settings<\/strong>.<\/p>\n<h2 id=\"products\">Products<\/h2>\n<p><strong>Inventory &gt; Products &gt; New product<\/strong>. The\nimportant fields:<\/p>\n<div class=\"tablewrap\"><table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Field<\/th>\n<th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>Name, SKU, Barcode, Code<\/strong><\/td>\n<td>How the product is identified. The <em>Code<\/em> is an optional\nsecond identifier and must be unique if used. Use <strong>Print\nlabel<\/strong> to print barcode labels.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Icon, Description<\/strong><\/td>\n<td>A picture for the till and the default text for invoice lines.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Category, Brand, Tax rate<\/strong><\/td>\n<td>Category and brand for reports; <em>Tax rate<\/em> of <em>None\n(tax-exempt)<\/em> or one of your rates.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Unit price<\/strong><\/td>\n<td>The selling price.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Cost price<\/strong><\/td>\n<td>What the product costs you. Never shown to customers; used for\nprofit reports. Follows purchases automatically depending on the costing\nmethod.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>EFRIS commodity code<\/strong><\/td>\n<td>Only if you submit to EFRIS.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>This is a service, not a physical good<\/strong><\/td>\n<td>For services and made-to-order items.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Track stock for this product<\/strong><\/td>\n<td>Untick for a service; it can always be sold and selling it never\nchanges stock.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Stock quantity<\/strong><\/td>\n<td>Current stock. After the start, change stock with adjustments,\ncounts, receipts or transfers, not by editing here.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Reorder level, Maximum stock level<\/strong><\/td>\n<td>When sellable stock plus open purchase orders falls to the reorder\nlevel the product appears in <strong>Reorder<\/strong>; the suggested\norder quantity brings stock up to the maximum (default: twice the\nreorder level).<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Batch / serial tracking<\/strong><\/td>\n<td><em>None<\/em>, <em>Batches with expiry date<\/em> (sold\nearliest-expiry first), or <em>Serial numbers<\/em> (one per unit). Batch\nand serial numbers are entered when you receive a purchase order or add\nstock by adjustment.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>The product page has <strong>Stock movement history<\/strong>, which\nlists every movement of the product and where it came from.<\/p>\n<div class=\"callout tip\">\n<p><strong>Tip:<\/strong> Import many products at once with\n<strong>Settings &gt; Backup &amp; Data &gt; Bulk import<\/strong> (ask\nyour administrator). Always press <strong>Check file<\/strong> first.<\/p>\n<\/div>\n<h3 id=\"variants\">Variants<\/h3>\n<p>For products that come in sizes or colours, open\n<strong>Variants<\/strong>: add <strong>Options<\/strong> (for example\n<em>Size<\/em>) with <strong>Values<\/strong> (S, M, L), press\n<strong>Generate<\/strong>, and one product is created for each\ncombination (copying price, cost, category, brand and tax). The original\nbecomes an inactive template and must hold no stock. Edit each variant's\nSKU, barcode and price afterwards.<\/p>\n<h3 id=\"labels\">Labels<\/h3>\n<p><strong>Print label<\/strong> from a product, or from the product list\nfor many products, prints barcode labels on your printer.<\/p>\n<h2 id=\"categories-and-brands\">Categories and brands<\/h2>\n<p><strong>Categories<\/strong> and <strong>Brands<\/strong> group\nproducts for the till tiles, reports and promotions. Create a brand\nbefore choosing it on a product.<\/p>\n<h2 id=\"stock-adjustments\">Stock adjustments<\/h2>\n<p>Use an adjustment to correct stock outside a normal purchase or sale\n(damage, theft, expiry, a recount).<\/p>\n<ol type=\"1\">\n<li><strong>Stock adjustments &gt; New<\/strong>. Search the\n<strong>Product<\/strong>; the current stock is shown.<\/li>\n<li>Choose the <strong>Location<\/strong> (default: main warehouse sales\nstock) and enter the <strong>Quantity change<\/strong>: positive to add,\nnegative to remove. The new stock level is shown.<\/li>\n<li>For batch products enter the batch and expiry; removing takes the\nearliest expiry first. For serial products list the serial numbers.<\/li>\n<li>Choose the <strong>Reason<\/strong>: <em>Damage, Theft, Expiry,\nRecount, Other<\/em>, and add a <strong>Note<\/strong>.<\/li>\n<li><strong>Save adjustment<\/strong>.<\/li>\n<\/ol>\n<div class=\"callout note\">\n<p><strong>Note:<\/strong> The adjustment is only <em>logged for\nreview<\/em>. Stock and accounting do not change until someone with the\n<em>Approve stock adjustments<\/em> right confirms it from the Stock\nadjustments list. Rejected adjustments change nothing.<\/p>\n<\/div>\n<h2 id=\"stock-counts\">Stock counts<\/h2>\n<p>A stock count compares the shelf with the system.<\/p>\n<ol type=\"1\">\n<li><strong>Stock counts &gt; Start a stock count<\/strong>: choose the\n<strong>Warehouse<\/strong>, optionally a <strong>Category<\/strong>, and\nadd notes. <strong>Start count<\/strong> freezes the current system\nquantities onto a <strong>count sheet<\/strong>.<\/li>\n<li><strong>Print sheet<\/strong> and count. Sales and receipts can carry\non while you count.<\/li>\n<li>Enter <strong>Counted<\/strong> for each line (the sheet shows\n<strong>System qty, Counted, Variance, Value<\/strong>). Use <strong>Add\na product to the sheet<\/strong> for something found that was not listed.\n<strong>Save counts<\/strong>.<\/li>\n<li><strong>Submit for approval<\/strong>. An approver presses\n<strong>Approve &amp; post differences<\/strong>: only the\n<em>difference<\/em> between what you counted and the frozen figure is\nposted, so anything moved meanwhile is preserved. Use <strong>Reopen for\ncounting<\/strong> to send it back or <strong>Cancel count<\/strong> to\nabandon.<\/li>\n<\/ol>\n<h2 id=\"reorder\">Reorder<\/h2>\n<p><strong>Inventory &gt; Reorder<\/strong> lists products whose sellable\nstock plus open purchase orders is at or below the reorder level (SKU,\nProduct, Category, On hand, On order, Reorder level, Max, Order qty). If\nyour business runs the Online Store, two more columns appear:\n<strong>Online orders<\/strong> (units held by shop orders nobody has\nanswered yet, which are taken away from the stock) and <strong>Waiting\ncustomers<\/strong> (people who asked to be told when the product is\nback; counted as demand). Press <strong>Create requisition<\/strong> to\nturn the list (or ticked lines) into a purchase requisition. Your\nadministrator can also have a draft requisition created automatically\nevery day.<\/p>\n<h2 id=\"warehouses-locations-and-transfers\">Warehouses, locations and\ntransfers<\/h2>\n<ul>\n<li><strong>Branches<\/strong> and <strong>Warehouses<\/strong> are set up\nby an administrator (Administrator Manual, chapter 5). A warehouse may\nhave <em>Receiving, Sales, Storage<\/em> and <em>Damaged<\/em> locations.\nDamaged stock is tracked but never counted as sellable.<\/li>\n<li><strong>Stock transfers &gt; New<\/strong>: choose the\n<strong>Product<\/strong>, <strong>From location<\/strong>, <strong>To\nlocation<\/strong> (the same warehouse or another) and\n<strong>Quantity<\/strong>. The transfer is logged; stock moves only when\nsomeone with the <em>Approve stock transfers<\/em> right presses\n<strong>Confirm<\/strong> (or <strong>Reject<\/strong>).\n<strong>Inter-branch<\/strong> transfers are then received at the other\nend: the receiving branch presses <strong>Receive<\/strong> and enters\nwhat actually arrived (any shortfall is shown as <em>short<\/em>), or\n<strong>Return to sender<\/strong> with a note (for example\n<em>damaged<\/em>). A <strong>transfer note<\/strong> (the <em>Paper<\/em>\ncolumn) can be printed to travel with the goods.<\/li>\n<li>After a purchase receipt, goods sit in the <em>Receiving<\/em>\nlocation until a transfer moves them to a <em>Sales<\/em> location. If a\nregister sells from a particular location, that is where the stock must\nbe.<\/li>\n<\/ul>\n<h2 id=\"packaging-and-breakdown\">Packaging and breakdown<\/h2>\n<p>For selling parts of a product (a bottle in shots, a case in\nbottles). An administrator must switch on <em>Product packaging &amp;\nbreakdown<\/em> in Inventory settings.<\/p>\n<ul>\n<li><strong>Packaging rules &gt; New<\/strong>: choose the <strong>Parent\nproduct<\/strong> (what gets broken down) and the <strong>Child\nproduct<\/strong> (what it becomes; <strong>+ New product<\/strong>\ncreates it on the spot), and <strong>Units per parent<\/strong> (25 shots\nper bottle).<\/li>\n<li><strong>Breakdown stock<\/strong>: choose the <strong>Packaging\nrule<\/strong>, the <strong>Quantity<\/strong> to break down and the\n<strong>Location<\/strong>, optionally a note, and run it. The parent\nstock goes down, the child stock goes up, and the child's cost per unit\nis worked out. The table lists every previous breakdown.<\/li>\n<\/ul>\n<h2 id=\"negative-stock-and-multi-warehouse\">Negative stock and\nmulti-warehouse<\/h2>\n<p>Whether the till and adjustments may take stock below zero, and\nwhether the business uses several warehouses, are set by an\nadministrator in Inventory settings. If a sale is refused for stock,\nreceive or adjust stock first.<\/p>\n<h2 id=\"reports\">Reports<\/h2>\n<p><strong>Inventory &gt; Reports<\/strong>: <strong>Stock On Hand &amp;\nValuation<\/strong> (with an <strong>Online orders<\/strong> column when\nthe Online Store is used), <strong>Stock Aging<\/strong>, <strong>Dead\nStock<\/strong> (no sales in 90 days), <strong>Batch Stock<\/strong> (lots\nand expiry), <strong>Expiring Stock<\/strong> (60 days), <strong>Serial\nNumber Register<\/strong>, <strong>Stock Movement History<\/strong> (for\none product).<\/p>\n", "text": " The Inventory group has: Products, Categories, Brands, Stock adjustments, Stock counts, Reorder, Branches, Warehouses, Stock transfers, Packaging rules, Breakdown stock, Reports, Inventory settings . Products Inventory > Products > New product . The important fields: Field Meaning Name, SKU, Barcode, Code How the product is identified. The Code is an optional second identifier and must be unique if used. Use Print label to print barcode labels. Icon, Description A picture for the till and the default text for invoice lines. Category, Brand, Tax rate Category and brand for reports; Tax rate of None (tax-exempt) or one of your rates. Unit price The selling price. Cost price What the product costs you. Never shown to customers; used for profit reports. Follows purchases automatically depending on the costing method. EFRIS commodity code Only if you submit to EFRIS. This is a service, not a physical good For services and made-to-order items. Track stock for this product Untick for a service; it can always be sold and selling it never changes stock. Stock quantity Current stock. After the start, change stock with adjustments, counts, receipts or transfers, not by editing here. Reorder level, Maximum stock level When sellable stock plus open purchase orders falls to the reorder level the product appears in Reorder ; the suggested order quantity brings stock up to the maximum (default: twice the reorder level). Batch / serial tracking None , Batches with expiry date (sold earliest-expiry first), or Serial numbers (one per unit). Batch and serial numbers are entered when you receive a purchase order or add stock by adjustment. The product page has Stock movement history , which lists every movement of the product and where it came from. Tip: Import many products at once with Settings > Backup & Data > Bulk import (ask your administrator). Always press Check file first. Variants For products that come in sizes or colours, open Variants : add Options (for example Size ) with Values (S, M, L), press Generate , and one product is created for each combination (copying price, cost, category, brand and tax). The original becomes an inactive template and must hold no stock. Edit each variant's SKU, barcode and price afterwards. Labels Print label from a product, or from the product list for many products, prints barcode labels on your printer. Categories and brands Categories and Brands group products for the till tiles, reports and promotions. Create a brand before choosing it on a product. Stock adjustments Use an adjustment to correct stock outside a normal purchase or sale (damage, theft, expiry, a recount). Stock adjustments > New . Search the Product ; the current stock is shown. Choose the Location (default: main warehouse sales stock) and enter the Quantity change : positive to add, negative to remove. The new stock level is shown. For batch products enter the batch and expiry; removing takes the earliest expiry first. For serial products list the serial numbers. Choose the Reason : Damage, Theft, Expiry, Recount, Other , and add a Note . Save adjustment . Note: The adjustment is only logged for review . Stock and accounting do not change until someone with the Approve stock adjustments right confirms it from the Stock adjustments list. Rejected adjustments change nothing. Stock counts A stock count compares the shelf with the system. Stock counts > Start a stock count : choose the Warehouse , optionally a Category , and add notes. Start count freezes the current system quantities onto a count sheet . Print sheet and count. Sales and receipts can carry on while you count. Enter Counted for each line (the sheet shows System qty, Counted, Variance, Value ). Use Add a product to the sheet for something found that was not listed. Save counts . Submit for approval . An approver presses Approve & post differences : only the difference between what you counted and the frozen figure is posted, so anything moved meanwhile is preserved. Use Reopen for counting to send it back or Cancel count to abandon. Reorder Inventory > Reorder lists products whose sellable stock plus open purchase orders is at or below the reorder level (SKU, Product, Category, On hand, On order, Reorder level, Max, Order qty). If your business runs the Online Store, two more columns appear: Online orders (units held by shop orders nobody has answered yet, which are taken away from the stock) and Waiting customers (people who asked to be told when the product is back; counted as demand). Press Create requisition to turn the list (or ticked lines) into a purchase requisition. Your administrator can also have a draft requisition created automatically every day. Warehouses, locations and transfers Branches and Warehouses are set up by an administrator (Administrator Manual, chapter 5). A warehouse may have Receiving, Sales, Storage and Damaged locations. Damaged stock is tracked but never counted as sellable. Stock transfers > New : choose the Product , From location , To location (the same warehouse or another) and Quantity . The transfer is logged; stock moves only when someone with the Approve stock transfers right presses Confirm (or Reject ). Inter-branch transfers are then received at the other end: the receiving branch presses Receive and enters what actually arrived (any shortfall is shown as short ), or Return to sender with a note (for example damaged ). A transfer note (the Paper column) can be printed to travel with the goods. After a purchase receipt, goods sit in the Receiving location until a transfer moves them to a Sales location. If a register sells from a particular location, that is where the stock must be. Packaging and breakdown For selling parts of a product (a bottle in shots, a case in bottles). An administrator must switch on Product packaging & breakdown in Inventory settings. Packaging rules > New : choose the Parent product (what gets broken down) and the Child product (what it becomes; + New product creates it on the spot), and Units per parent (25 shots per bottle). Breakdown stock : choose the Packaging rule , the Quantity to break down and the Location , optionally a note, and run it. The parent stock goes down, the child stock goes up, and the child's cost per unit is worked out. The table lists every previous breakdown. Negative stock and multi-warehouse Whether the till and adjustments may take stock below zero, and whether the business uses several warehouses, are set by an administrator in Inventory settings. If a sale is refused for stock, receive or adjust stock first. Reports Inventory > Reports : Stock On Hand & Valuation (with an Online orders column when the Online Store is used), Stock Aging , Dead Stock (no sales in 90 days), Batch Stock (lots and expiry), Expiring Stock (60 days), Serial Number Register , Stock Movement History (for one product). "}, {"id": "user-7-restaurant", "manual": "user", "n": 7, "title": "Restaurant", "html": "\n<p>The <strong>Restaurant<\/strong> group has: <strong>Voids &amp; comps,\nSales analysis, End of day, Reports, Tables, Menu, Settings<\/strong>,\nand the working screens reached from the <strong>floor plan<\/strong>:\n<em>All orders, Takeaway/Delivery, Deliveries board, Kitchen display,\nReservations, Receipts, Wastage, Reports<\/em>.<\/p>\n<h2 id=\"a-service-day-at-a-glance\">A service day at a glance<\/h2>\n<ol type=\"1\">\n<li>Waiters open the <strong>floor plan<\/strong>, tap a table and\n<strong>open an order<\/strong>.<\/li>\n<li>They add menu items, note allergies, and <strong>Send to\nkitchen<\/strong>. The kitchen prepares on the <strong>Kitchen\ndisplay<\/strong>.<\/li>\n<li>When guests ask for the bill, the waiter prints the\n<strong>Bill<\/strong>, takes payment at <strong>Checkout<\/strong> (cash,\ncard, split, or charged to a hotel room).<\/li>\n<li>At closing time a manager runs <strong>End of day<\/strong> (the\ncash-up).<\/li>\n<\/ol>\n<h2 id=\"setting-up-the-menu-and-tables-manager\">Setting up the menu and\ntables (manager)<\/h2>\n<p><strong>Tables &gt; New table<\/strong>: <strong>Name<\/strong> (Table\n1), <strong>Section<\/strong> (Main Hall), <strong>Capacity<\/strong>,\n<strong>Active<\/strong>. A table can be marked <em>Out of service<\/em>\nand <em>Available<\/em> again.<\/p>\n<p><strong>Menu<\/strong>: create <strong>Categories<\/strong>, then add\nproducts to each category. For each item set:<\/p>\n<ul>\n<li><strong>Station<\/strong> (for example <em>Grill<\/em> or\n<em>Bar<\/em>; used to route kitchen tickets), <strong>Course<\/strong>\n(starter, main, dessert), <strong>Prep (min)<\/strong>.<\/li>\n<li><strong>Allergens<\/strong> and <strong>Choices<\/strong> (sizes,\ncooking, extras: each option can add to the price; a group can be\n<em>Must choose<\/em> or <em>Up to n<\/em>).<\/li>\n<li><strong>Menu price<\/strong>. A <strong>recipe<\/strong> (from\nManufacturing &gt; Bill of materials) makes the system deduct\ningredients from stock when the dish is sold.<\/li>\n<\/ul>\n<h2 id=\"taking-an-order\">Taking an order<\/h2>\n<p>On the <strong>floor plan<\/strong>, tap a free table, enter the\nnumber of <strong>Guests<\/strong> and press <strong>Open order<\/strong>.\nThe order screen shows the menu on the left and the order on the\nright.<\/p>\n<ul>\n<li>Tap a menu item to add it. Items with choices open a window to pick\noptions. Add a <strong>Note for the kitchen<\/strong> (quick-note buttons\nsuch as <em>No onions<\/em> are set in Restaurant settings).<\/li>\n<li>Assign <strong>Seat<\/strong> and <strong>Course<\/strong> to each\nline so the bill can be split by seat and courses can be fired in turn.\nItems for a later course wait <strong>on hold<\/strong> until you press\n<strong>Fire course<\/strong>.<\/li>\n<li><strong>Allergies<\/strong>: record the guests' allergies; the\nkitchen ticket shows ALLERGY warnings and items that contain them.<\/li>\n<li><strong>Send to kitchen<\/strong> prints or shows tickets for each\nstation. The line changes to <em>sent<\/em>.<\/li>\n<li>Before sending, a line can be removed. After it has gone to the\nkitchen, taking it off needs a <strong>manager's approval<\/strong> and a\n<strong>reason<\/strong> (<strong>Void it<\/strong>). <strong>Give\nfree<\/strong> (comp) needs a reason. <strong>Send back<\/strong> records\na remake.<\/li>\n<\/ul>\n<h3 id=\"takeaway-delivery-and-room-service\">Takeaway, delivery and room\nservice<\/h3>\n<p><strong>New order<\/strong> (floor plan): choose\n<strong>Takeaway<\/strong>, <strong>Delivery<\/strong> or <strong>Room\nservice<\/strong>. Enter the customer name and phone; delivery needs an\n<strong>address<\/strong>; room service needs the <strong>guest's\nroom<\/strong> (a guest must be checked in). Then <strong>Open\norder<\/strong>. The <strong>Deliveries board<\/strong> lists deliveries\nwith <strong>Driver<\/strong>, <strong>Out for delivery<\/strong> and\n<strong>Mark delivered<\/strong>.<\/p>\n<h3 id=\"online-orders-and-qr-codes\">Online orders and QR codes<\/h3>\n<p>If the public ordering page is on, guests order at your\n<code>/order<\/code> page (takeaway/delivery) or scan the <strong>table\nQR code<\/strong> and send an order that staff <strong>accept<\/strong>\nunder <strong>Online orders<\/strong>. Set <strong>Delivery\nareas<\/strong> (fee, minimum order, extra minutes) and print the\n<strong>table QR codes<\/strong> under <em>Delivery areas &amp; QR\ncodes<\/em>. A new code replaces and cancels the old one.<\/p>\n<h2 id=\"moving-merging-and-splitting\">Moving, merging and splitting<\/h2>\n<ul>\n<li><strong>Move table<\/strong>: move a whole bill to a free table.<\/li>\n<li><strong>Merge into<\/strong>: merge this order into another open\ntable's order.<\/li>\n<li><strong>Split / move items<\/strong>: move selected lines to a new\ncheck at the same table (by seat, or one by one) so that guests pay\nseparately.<\/li>\n<\/ul>\n<h2 id=\"the-bill-and-payment\">The bill and payment<\/h2>\n<p>The order shows <strong>Subtotal, Discounts given, Service charge,\nTax, Rounding, Total, Tip, Reservation deposit already paid<\/strong> and\n<strong>Balance due<\/strong>.<\/p>\n<ol type=\"1\">\n<li><strong>Bill<\/strong> prints the guest's bill (marked \"not a\nreceipt\").<\/li>\n<li><strong>Discount<\/strong>: a percent or amount on the whole bill\nwith a <strong>Reason<\/strong>. A discount above the waiter limit, or\nwaiving the service charge, needs a manager.<\/li>\n<li><strong>Checkout<\/strong>: add payments with <strong>+ Add\npayment<\/strong>: choose the method and amount, or use <strong>Custom\namount<\/strong>, <strong>Split equally<\/strong>, <strong>Split by\nitem<\/strong> or <strong>Split into guests' shares<\/strong>. Choose a\n<strong>Tip<\/strong> (quick percent buttons or <strong>No tip<\/strong>).\n<strong>Charge to which room?<\/strong> puts it on a hotel guest's\naccount.<\/li>\n<li>The screen shows <strong>Change to give back<\/strong>. A deposit\nalready paid is taken off.<\/li>\n<li>Complete the payment. The receipt prints; the table is freed.<\/li>\n<\/ol>\n<p><strong>Cancel order<\/strong> frees the table without a sale; if part\nhas gone to the kitchen, a reason and a manager's approval are\nrequired.<\/p>\n<h2 id=\"kitchen-display-and-expo\">Kitchen display and expo<\/h2>\n<ul>\n<li><strong>Kitchen display<\/strong>: tickets by status <em>waiting,\ncooking, ready<\/em>. Buttons: <strong>Start preparing<\/strong>,\n<strong>Mark ready<\/strong>, <strong>Mark served<\/strong>, <strong>Bump\nall for this order<\/strong>, <strong>Remake<\/strong>. Tickets turn amber\nthen red as time runs out. <strong>Sold out (86)<\/strong> lets the\nkitchen mark an item as unavailable, with a reason.<\/li>\n<li><strong>Expo<\/strong>: the pass. Shows each order with what is\ncomplete; <strong>Mark everything ready<\/strong>,\n<strong>Serve<\/strong>, <strong>Remake<\/strong>.<\/li>\n<\/ul>\n<h2 id=\"reservations-and-the-waiting-list\">Reservations and the waiting\nlist<\/h2>\n<ul>\n<li><strong>Reservations &gt; New reservation<\/strong>: guest name,\nphone, e-mail (for reminders), <strong>Party size<\/strong>, <strong>Date\n&amp; time<\/strong>, <strong>Minutes at table<\/strong>, optional\n<strong>Table<\/strong>, and a <strong>Deposit<\/strong> that can be taken\nnow with a payment method. The screen lists <strong>Free times that\nday<\/strong>.<\/li>\n<li>Actions on a reservation: <strong>Seat<\/strong>,\n<strong>Change<\/strong>, <strong>Take deposit<\/strong>,\n<strong>Remind<\/strong>, <strong>No-show<\/strong>,\n<strong>Cancel<\/strong>. <strong>Mark overdue bookings as\nno-shows<\/strong> does them in one click. <strong>Seat by reservation\nnumber<\/strong> works when the guest shows their code.<\/li>\n<li><strong>Waiting list<\/strong>: <strong>Add a party<\/strong> (name,\nphone, party size, quoted wait, note). When a table is free the list\nsays <em>Table ready<\/em>; <strong>Seat<\/strong> them or mark\n<em>Left<\/em>.<\/li>\n<li>If the public page <code>/reserve<\/code> is on, guests reserve\nonline and the list shows <em>booked online<\/em>.<\/li>\n<\/ul>\n<h2 id=\"wastage\">Wastage<\/h2>\n<p><strong>Wastage &gt; Record wastage<\/strong>: choose the\n<strong>Product<\/strong>, <strong>Quantity wasted<\/strong> (a positive\nnumber), <strong>Reason<\/strong> (<em>Spoilage, Burnt / overcooked,\nDropped / spilled, Expired, Prep trim, Customer complaint, Other<\/em>)\nand a note. The entry is logged; someone with the <em>Confirm restaurant\nwastage<\/em> right confirms or rejects it. Only then stock and accounts\nchange.<\/p>\n<h2 id=\"voids-and-comps\">Voids and comps<\/h2>\n<p><strong>Voids &amp; comps<\/strong> is the log of every void, comp and\ncancelled order: When, Kind, Table / customer, Item, Qty, Value, Reason,\nBy, Approved by. Managers review it for unusual patterns.<\/p>\n<h2 id=\"end-of-day\">End of day<\/h2>\n<p><strong>End of day<\/strong> is the closing cash-up of the business\nday.<\/p>\n<ol type=\"1\">\n<li>Settle or cancel any orders still open: the screen lists them and\nwill not close until they are cleared.<\/li>\n<li>Review <strong>Sales<\/strong> (checks, covers, gross, discounts,\nnet, service charge, tax, rounding, total billed, tips), <strong>How it\nwas paid<\/strong>, <strong>By order type<\/strong>, <strong>Tips by\nserver<\/strong>, booking <strong>deposits<\/strong> and <strong>Voids,\ncomps and cancelled orders<\/strong>.<\/li>\n<li>In <strong>Cash in the drawer<\/strong> the screen works out\n<em>opening float + cash sales + deposits in - deposits refunded + paid\nin - paid out - tips paid out = should be in drawer<\/em>. Enter the\n<strong>Counted<\/strong> amount; the <strong>Difference<\/strong> shows,\nthen <strong>Left in drawer<\/strong> and <strong>Banked<\/strong>. Add a\nnote.<\/li>\n<li><strong>Close the day<\/strong>. It becomes a numbered\n<strong>Z<\/strong> report that you can <strong>Print<\/strong>, or export\nto Excel, PDF or CSV.<\/li>\n<\/ol>\n<p>If something is paid after the day is closed, <strong>Reopen the\nday<\/strong> (give a reason) and close it again.<\/p>\n<h2 id=\"sales-analysis\">Sales analysis<\/h2>\n<p><strong>Sales analysis<\/strong> shows, for a period: net sales,\nchecks, covers, average check, per cover, margin, tips and time at the\ntable; sales <strong>by hour, weekday, order type, how guests paid, by\nday, by category<\/strong>, and the <strong>Menu mix<\/strong>:\n<em>Star<\/em> (sells well and earns well, protect it),\n<em>Plowhorse<\/em> (sells well, earns little: raise the price or use a\ncheaper recipe), <em>Puzzle<\/em> (earns well, sells little: promote it)\nand <em>Dog<\/em> (sells little and earns little: rework or drop).<\/p>\n<h2 id=\"receipts\">Receipts<\/h2>\n<p><strong>Receipts<\/strong> lists paid bills with <strong>View /\nPrint<\/strong>. A reprint is marked COPY and never opens the cash\ndrawer.<\/p>\n<h2 id=\"settings\">Settings<\/h2>\n<p>An administrator sets <strong>service charge<\/strong> by order type,\nwaiter discount limit, tips, quick kitchen notes, kitchen timing,\nrounding and table bookings (Administrator Manual, chapter 7).<\/p>\n<h2 id=\"reports\">Reports<\/h2>\n<p><strong>Restaurant &gt; Reports<\/strong>: Sales by Order Type, Orders\n(all types), Menu Item Sales, Menu Category Sales, Menu Item Profit,\nMenu Category Profit, Sales by Server, Cancelled Orders and Wastage,\nwith Excel, PDF and CSV export.<\/p>\n", "text": " The Restaurant group has: Voids & comps, Sales analysis, End of day, Reports, Tables, Menu, Settings , and the working screens reached from the floor plan : All orders, Takeaway/Delivery, Deliveries board, Kitchen display, Reservations, Receipts, Wastage, Reports . A service day at a glance Waiters open the floor plan , tap a table and open an order . They add menu items, note allergies, and Send to kitchen . The kitchen prepares on the Kitchen display . When guests ask for the bill, the waiter prints the Bill , takes payment at Checkout (cash, card, split, or charged to a hotel room). At closing time a manager runs End of day (the cash-up). Setting up the menu and tables (manager) Tables > New table : Name (Table 1), Section (Main Hall), Capacity , Active . A table can be marked Out of service and Available again. Menu : create Categories , then add products to each category. For each item set: Station (for example Grill or Bar ; used to route kitchen tickets), Course (starter, main, dessert), Prep (min) . Allergens and Choices (sizes, cooking, extras: each option can add to the price; a group can be Must choose or Up to n ). Menu price . A recipe (from Manufacturing > Bill of materials) makes the system deduct ingredients from stock when the dish is sold. Taking an order On the floor plan , tap a free table, enter the number of Guests and press Open order . The order screen shows the menu on the left and the order on the right. Tap a menu item to add it. Items with choices open a window to pick options. Add a Note for the kitchen (quick-note buttons such as No onions are set in Restaurant settings). Assign Seat and Course to each line so the bill can be split by seat and courses can be fired in turn. Items for a later course wait on hold until you press Fire course . Allergies : record the guests' allergies; the kitchen ticket shows ALLERGY warnings and items that contain them. Send to kitchen prints or shows tickets for each station. The line changes to sent . Before sending, a line can be removed. After it has gone to the kitchen, taking it off needs a manager's approval and a reason ( Void it ). Give free (comp) needs a reason. Send back records a remake. Takeaway, delivery and room service New order (floor plan): choose Takeaway , Delivery or Room service . Enter the customer name and phone; delivery needs an address ; room service needs the guest's room (a guest must be checked in). Then Open order . The Deliveries board lists deliveries with Driver , Out for delivery and Mark delivered . Online orders and QR codes If the public ordering page is on, guests order at your /order page (takeaway/delivery) or scan the table QR code and send an order that staff accept under Online orders . Set Delivery areas (fee, minimum order, extra minutes) and print the table QR codes under Delivery areas & QR codes . A new code replaces and cancels the old one. Moving, merging and splitting Move table : move a whole bill to a free table. Merge into : merge this order into another open table's order. Split / move items : move selected lines to a new check at the same table (by seat, or one by one) so that guests pay separately. The bill and payment The order shows Subtotal, Discounts given, Service charge, Tax, Rounding, Total, Tip, Reservation deposit already paid and Balance due . Bill prints the guest's bill (marked \"not a receipt\"). Discount : a percent or amount on the whole bill with a Reason . A discount above the waiter limit, or waiving the service charge, needs a manager. Checkout : add payments with + Add payment : choose the method and amount, or use Custom amount , Split equally , Split by item or Split into guests' shares . Choose a Tip (quick percent buttons or No tip ). Charge to which room? puts it on a hotel guest's account. The screen shows Change to give back . A deposit already paid is taken off. Complete the payment. The receipt prints; the table is freed. Cancel order frees the table without a sale; if part has gone to the kitchen, a reason and a manager's approval are required. Kitchen display and expo Kitchen display : tickets by status waiting, cooking, ready . Buttons: Start preparing , Mark ready , Mark served , Bump all for this order , Remake . Tickets turn amber then red as time runs out. Sold out (86) lets the kitchen mark an item as unavailable, with a reason. Expo : the pass. Shows each order with what is complete; Mark everything ready , Serve , Remake . Reservations and the waiting list Reservations > New reservation : guest name, phone, e-mail (for reminders), Party size , Date & time , Minutes at table , optional Table , and a Deposit that can be taken now with a payment method. The screen lists Free times that day . Actions on a reservation: Seat , Change , Take deposit , Remind , No-show , Cancel . Mark overdue bookings as no-shows does them in one click. Seat by reservation number works when the guest shows their code. Waiting list : Add a party (name, phone, party size, quoted wait, note). When a table is free the list says Table ready ; Seat them or mark Left . If the public page /reserve is on, guests reserve online and the list shows booked online . Wastage Wastage > Record wastage : choose the Product , Quantity wasted (a positive number), Reason ( Spoilage, Burnt / overcooked, Dropped / spilled, Expired, Prep trim, Customer complaint, Other ) and a note. The entry is logged; someone with the Confirm restaurant wastage right confirms or rejects it. Only then stock and accounts change. Voids and comps Voids & comps is the log of every void, comp and cancelled order: When, Kind, Table / customer, Item, Qty, Value, Reason, By, Approved by. Managers review it for unusual patterns. End of day End of day is the closing cash-up of the business day. Settle or cancel any orders still open: the screen lists them and will not close until they are cleared. Review Sales (checks, covers, gross, discounts, net, service charge, tax, rounding, total billed, tips), How it was paid , By order type , Tips by server , booking deposits and Voids, comps and cancelled orders . In Cash in the drawer the screen works out opening float + cash sales + deposits in - deposits refunded + paid in - paid out - tips paid out = should be in drawer . Enter the Counted amount; the Difference shows, then Left in drawer and Banked . Add a note. Close the day . It becomes a numbered Z report that you can Print , or export to Excel, PDF or CSV. If something is paid after the day is closed, Reopen the day (give a reason) and close it again. Sales analysis Sales analysis shows, for a period: net sales, checks, covers, average check, per cover, margin, tips and time at the table; sales by hour, weekday, order type, how guests paid, by day, by category , and the Menu mix : Star (sells well and earns well, protect it), Plowhorse (sells well, earns little: raise the price or use a cheaper recipe), Puzzle (earns well, sells little: promote it) and Dog (sells little and earns little: rework or drop). Receipts Receipts lists paid bills with View / Print . A reprint is marked COPY and never opens the cash drawer. Settings An administrator sets service charge by order type, waiter discount limit, tips, quick kitchen notes, kitchen timing, rounding and table bookings (Administrator Manual, chapter 7). Reports Restaurant > Reports : Sales by Order Type, Orders (all types), Menu Item Sales, Menu Category Sales, Menu Item Profit, Menu Category Profit, Sales by Server, Cancelled Orders and Wastage, with Excel, PDF and CSV export. "}, {"id": "user-8-hotel", "manual": "user", "n": 8, "title": "Hotel", "html": "\n<p>The <strong>Hotel<\/strong> group has: <strong>Front desk, Bookings,\nReservation chart, Housekeeping, Maintenance, Guests, Guest register,\nRooms, Room types, Rates, Company accounts, Groups, Online booking,\nReports, Settings<\/strong>.<\/p>\n<div class=\"callout note\">\n<p><strong>Note:<\/strong> A hotel is set up once by an administrator in\nthis order: <strong>room types<\/strong> (name and nightly rate), then\n<strong>rooms<\/strong>, then <strong>Settings<\/strong> (how room revenue\nreaches accounting, tax, check-in and check-out times, fee policy). Once\nthe Hotel module is on, a <strong>Charge to room<\/strong> payment method\nis available in the POS and the Restaurant.<\/p>\n<\/div>\n<h2 id=\"the-front-desk\">The front desk<\/h2>\n<p><strong>Hotel &gt; Front desk<\/strong> is the receptionist's home\nscreen. It shows <strong>Occupied, Occupancy %, Free tonight, Arrivals\ndue, Departures due, To clean<\/strong> and <strong>Out of\norder<\/strong>, then three lists: <strong>Arrivals, In-house,\nDepartures<\/strong> (Booking, Guest, Room, Stay, Balance). A star marks\nVIP guests and a flag marks blacklisted guests. Buttons: <strong>New\nbooking<\/strong> and <strong>Walk-in<\/strong> (a guest arriving without\na booking).<\/p>\n<h2 id=\"making-a-booking\">Making a booking<\/h2>\n<p><strong>Bookings &gt; New booking<\/strong> (or\n<strong>Walk-in<\/strong> on the front desk):<\/p>\n<ol type=\"1\">\n<li><strong>Guest<\/strong>: choose an <strong>Existing guest<\/strong>\n(search by name, phone or ID number) or enter a <strong>New\nguest<\/strong> (full name, phone, e-mail, ID number).<\/li>\n<li><strong>Stay<\/strong>: <strong>Arrival<\/strong>,\n<strong>Departure<\/strong>, <strong>Room type<\/strong>,\n<strong>Adults<\/strong>, <strong>Children<\/strong>. Choose a\n<strong>Room<\/strong>, or <em>Assign later<\/em>. If none is free the\nscreen says so.<\/li>\n<li><strong>Rate plan<\/strong>: <em>Standard rate<\/em> or a plan such as\nCorporate. The screen shows the price for each night, the total before\ntax, the tax, and the total with tax.<\/li>\n<li><strong>Source<\/strong>: where the booking came from (phone,\nwebsite, agent), used in reports.<\/li>\n<li>Optionally <strong>Agree a different price with the guest<\/strong>\n(a nightly rate before tax), add <strong>Notes<\/strong> and a\n<strong>Deposit<\/strong> (amount and how it was paid).<\/li>\n<li>Save.<\/li>\n<\/ol>\n<h2 id=\"working-with-a-booking\">Working with a booking<\/h2>\n<p>Open a booking to see the guest, room, stay, rate per night, deposit\nand <strong>Bills<\/strong>. Buttons change with the booking's status\n(<em>Booked, Checked in, Checked out, No-show, Cancelled<\/em>):<\/p>\n<ul>\n<li><strong>Check in<\/strong>: choose the <strong>Room<\/strong>. You may\ncheck in even if the room is not marked clean (tick the option).<\/li>\n<li><strong>Edit<\/strong>, <strong>Move room<\/strong>, <strong>Change\ndeparture<\/strong>.<\/li>\n<li><strong>+ Charge<\/strong> adds an extra (minibar, laundry, service)\nto the guest's bill. <strong>Pay fee owed<\/strong> takes payment of a\ncancellation or no-show fee.<\/li>\n<li><strong>Check out<\/strong>: closes the bill, takes payment, and\nposts the invoice.<\/li>\n<li><strong>No-show<\/strong> and <strong>Cancel booking<\/strong> apply\nthe fee policy set in Hotel settings; the front desk can waive any\nfee.<\/li>\n<li>Documents: <strong>Print invoice<\/strong>, <strong>Bill\n(PDF)<\/strong>, <strong>Registration card<\/strong>,\n<strong>Confirmation<\/strong>, <strong>E-mail\nconfirmation<\/strong>.<\/li>\n<\/ul>\n<h3 id=\"split-bills-and-billing-a-company\">Split bills and billing a\ncompany<\/h3>\n<p>A stay has one bill by default. <strong>+ Split bill / bill a\ncompany<\/strong> adds another bill (for example <em>Extras<\/em>,\n<em>Company<\/em>, <em>Spouse<\/em>). Choose who each bill is\n<strong>Billed to<\/strong>: the guest, a company with credit enabled, or\nthe group. A company must first be set up for credit under\n<strong>Customers<\/strong>. <strong>Room nights here<\/strong> moves the\nroom charges to a particular bill.<\/p>\n<h2 id=\"reservation-chart\">Reservation chart<\/h2>\n<p><strong>Reservation chart<\/strong> shows rooms down the side and days\nacross (two weeks, with « and » buttons to move). Green bars are\nin-house guests, amber are bookings; each bar runs from the arrival day\nup to, but not including, the departure day. Rooms out of order are\nmarked. Use it to see gaps and move bookings.<\/p>\n<h2 id=\"housekeeping\">Housekeeping<\/h2>\n<p><strong>Housekeeping<\/strong> lists rooms with their status:\n<strong>Dirty, Cleaning, Clean, Inspected<\/strong>, plus\n<em>Occupied<\/em>, <em>DND<\/em> (do not disturb), <em>Vacant<\/em> and\n<em>Out of order<\/em>. Housekeepers press <strong>Start\ncleaning<\/strong>, <strong>Clean<\/strong>; a supervisor marks\n<strong>Inspected<\/strong>. Check-in expects a clean room. Housekeeping\nalso has boards for supplies and for <strong>lost and found<\/strong>\nitems.<\/p>\n<h2 id=\"maintenance\">Maintenance<\/h2>\n<p><strong>Maintenance<\/strong> logs room problems. Enter the\n<strong>Room<\/strong>, the <strong>Problem<\/strong> (for example <em>Air\nconditioner not cooling<\/em>), the <strong>Priority<\/strong> (<em>Low,\nNormal, High, Urgent<\/em>) and details. Tick <strong>Take the room out\nof service until fixed<\/strong> and set <strong>Out of service\nfrom<\/strong> / <strong>Back in service on<\/strong>. With dates, only\nthose nights are blocked; with no dates the room is blocked right away\nuntil the request is <strong>Done<\/strong>. If existing bookings fall\ninside the blocked dates the screen warns you; move those guests or\nchange dates. Buttons: <strong>Start<\/strong>, <strong>Done<\/strong>,\n<strong>Reopen<\/strong>, <strong>Delete<\/strong>.<\/p>\n<h2 id=\"guests-and-the-guest-register\">Guests and the guest\nregister<\/h2>\n<ul>\n<li><strong>Guests<\/strong> lists guests. Open a guest to see\n<strong>Stays, Lifetime spend, Average per stay, Last stay, Usually\nbooks via<\/strong>, and <strong>ID documents<\/strong> (passport,\nnational ID, driving licence, visa; upload scans). Mark a guest\n<strong>VIP<\/strong> or <strong>Blacklisted<\/strong>.<\/li>\n<li><strong>Merge a duplicate into<\/strong> combines two records of the\nsame person: all bookings, groups, lost-and-found items and ID documents\nmove over and the other record is removed. <strong>This cannot be\nundone.<\/strong><\/li>\n<li><strong>Guest register<\/strong> is the official\narrivals-and-departures register, with export, for authorities that\nrequire it.<\/li>\n<\/ul>\n<h2 id=\"rooms-room-types-and-rates-set-up\">Rooms, room types and rates\n(set-up)<\/h2>\n<ul>\n<li><strong>Room types<\/strong>: name and nightly rate (the standard\nprice).<\/li>\n<li><strong>Rooms<\/strong>: room number, type, floor and status.<\/li>\n<li><strong>Rates<\/strong>: <strong>Seasonal rules<\/strong> change a\nroom type's price for a date range and optionally certain weekdays (a\nfixed price, a percentage change, or an amount added/taken off;\n<strong>Min nights<\/strong>; <strong>Priority<\/strong>: the rule with\nthe highest priority wins). <strong>Rate plans<\/strong> give a discount\non top (percent or amount). The <strong>Price calendar<\/strong> shows\nthe resulting one-night price per day. Existing bookings keep their\nprice.<\/li>\n<\/ul>\n<h2 id=\"company-accounts\">Company accounts<\/h2>\n<p><strong>Company accounts<\/strong> lists stays billed to a company at\ncheck-out: <strong>Company, Billed, Received, Owing, Overdue, Open\nbills<\/strong>. Open a company, <strong>Show bills<\/strong>, and when it\npays use <strong>Receive money<\/strong>: <strong>Amount, Method,\nReference<\/strong> (cheque or transfer number), <strong>Date<\/strong>.\nOverdue bills are highlighted.<\/p>\n<h2 id=\"groups\">Groups<\/h2>\n<p>For weddings, conferences and tours. <strong>Groups &gt;\nNew<\/strong>: <strong>Group name<\/strong>, <strong>Arrival<\/strong>,\n<strong>Departure<\/strong>, <strong>Contact person<\/strong>, phone,\ne-mail, <strong>Who pays<\/strong> (<em>Each guest pays their own bill;\nThe group pays the rooms, guests pay extras; The group pays\neverything<\/em>) and an invoice-to customer.<\/p>\n<ul>\n<li><strong>Room blocks<\/strong>: hold rooms off general sale\n(<strong>Room type, Rooms, Group rate / night, From, To<\/strong>, and a\n<strong>Release unbooked rooms on<\/strong> date; unbooked rooms go back\non sale then, or <strong>Release now<\/strong>).<\/li>\n<li><strong>Add rooms<\/strong> for the group, then <strong>Rooming\nlist<\/strong>: paste guest names, one per line, with <strong>Put names\non rooms<\/strong>. Export the rooming list to Excel, PDF or CSV.<\/li>\n<li><strong>Statement<\/strong> shows what the group owes.\n<strong>Confirm<\/strong>, <strong>Complete<\/strong> or <strong>Cancel\ngroup<\/strong> (cancels every room that has not arrived; you can waive\ncancellation fees).<\/li>\n<\/ul>\n<h2 id=\"online-booking\">Online booking<\/h2>\n<p>If the hotel's public booking page is on, guests choose room types\nand dates and book online. Bookings arrive in <strong>Bookings<\/strong>\nwith source <em>Website<\/em>. An administrator sets the page's text and\nrules under <strong>Online booking<\/strong>.<\/p>\n<h2 id=\"night-audit\">Night audit<\/h2>\n<p>At the <strong>night audit time<\/strong> set in Hotel settings, the\nsystem posts each night's room charge to accounting. The <strong>Night\naudit<\/strong> report checks the hotel's cash, revenue, tax, deposits,\ncity ledger and group ledger against Accounting, and is the manager's\nend-of-day check.<\/p>\n<h2 id=\"reports\">Reports<\/h2>\n<p><strong>Hotel &gt; Reports<\/strong>: the <strong>Daily<\/strong>\nreport; <strong>Occupancy<\/strong> with <strong>Room nights sold, Room\nnights available, Room revenue, ADR<\/strong> (average daily rate) and\n<strong>RevPAR<\/strong> (revenue per available room); <strong>Revenue by\nbooking source<\/strong>; <strong>Forecast and pick-up<\/strong>; and the\n<strong>Night audit<\/strong>. Choose <em>Last 7 days, Last 30 days<\/em>\nor <em>This month<\/em>, or enter dates. All export to Excel, PDF and\nCSV.<\/p>\n", "text": " The Hotel group has: Front desk, Bookings, Reservation chart, Housekeeping, Maintenance, Guests, Guest register, Rooms, Room types, Rates, Company accounts, Groups, Online booking, Reports, Settings . Note: A hotel is set up once by an administrator in this order: room types (name and nightly rate), then rooms , then Settings (how room revenue reaches accounting, tax, check-in and check-out times, fee policy). Once the Hotel module is on, a Charge to room payment method is available in the POS and the Restaurant. The front desk Hotel > Front desk is the receptionist's home screen. It shows Occupied, Occupancy %, Free tonight, Arrivals due, Departures due, To clean and Out of order , then three lists: Arrivals, In-house, Departures (Booking, Guest, Room, Stay, Balance). A star marks VIP guests and a flag marks blacklisted guests. Buttons: New booking and Walk-in (a guest arriving without a booking). Making a booking Bookings > New booking (or Walk-in on the front desk): Guest : choose an Existing guest (search by name, phone or ID number) or enter a New guest (full name, phone, e-mail, ID number). Stay : Arrival , Departure , Room type , Adults , Children . Choose a Room , or Assign later . If none is free the screen says so. Rate plan : Standard rate or a plan such as Corporate. The screen shows the price for each night, the total before tax, the tax, and the total with tax. Source : where the booking came from (phone, website, agent), used in reports. Optionally Agree a different price with the guest (a nightly rate before tax), add Notes and a Deposit (amount and how it was paid). Save. Working with a booking Open a booking to see the guest, room, stay, rate per night, deposit and Bills . Buttons change with the booking's status ( Booked, Checked in, Checked out, No-show, Cancelled ): Check in : choose the Room . You may check in even if the room is not marked clean (tick the option). Edit , Move room , Change departure . + Charge adds an extra (minibar, laundry, service) to the guest's bill. Pay fee owed takes payment of a cancellation or no-show fee. Check out : closes the bill, takes payment, and posts the invoice. No-show and Cancel booking apply the fee policy set in Hotel settings; the front desk can waive any fee. Documents: Print invoice , Bill (PDF) , Registration card , Confirmation , E-mail confirmation . Split bills and billing a company A stay has one bill by default. + Split bill / bill a company adds another bill (for example Extras , Company , Spouse ). Choose who each bill is Billed to : the guest, a company with credit enabled, or the group. A company must first be set up for credit under Customers . Room nights here moves the room charges to a particular bill. Reservation chart Reservation chart shows rooms down the side and days across (two weeks, with « and » buttons to move). Green bars are in-house guests, amber are bookings; each bar runs from the arrival day up to, but not including, the departure day. Rooms out of order are marked. Use it to see gaps and move bookings. Housekeeping Housekeeping lists rooms with their status: Dirty, Cleaning, Clean, Inspected , plus Occupied , DND (do not disturb), Vacant and Out of order . Housekeepers press Start cleaning , Clean ; a supervisor marks Inspected . Check-in expects a clean room. Housekeeping also has boards for supplies and for lost and found items. Maintenance Maintenance logs room problems. Enter the Room , the Problem (for example Air conditioner not cooling ), the Priority ( Low, Normal, High, Urgent ) and details. Tick Take the room out of service until fixed and set Out of service from / Back in service on . With dates, only those nights are blocked; with no dates the room is blocked right away until the request is Done . If existing bookings fall inside the blocked dates the screen warns you; move those guests or change dates. Buttons: Start , Done , Reopen , Delete . Guests and the guest register Guests lists guests. Open a guest to see Stays, Lifetime spend, Average per stay, Last stay, Usually books via , and ID documents (passport, national ID, driving licence, visa; upload scans). Mark a guest VIP or Blacklisted . Merge a duplicate into combines two records of the same person: all bookings, groups, lost-and-found items and ID documents move over and the other record is removed. This cannot be undone. Guest register is the official arrivals-and-departures register, with export, for authorities that require it. Rooms, room types and rates (set-up) Room types : name and nightly rate (the standard price). Rooms : room number, type, floor and status. Rates : Seasonal rules change a room type's price for a date range and optionally certain weekdays (a fixed price, a percentage change, or an amount added/taken off; Min nights ; Priority : the rule with the highest priority wins). Rate plans give a discount on top (percent or amount). The Price calendar shows the resulting one-night price per day. Existing bookings keep their price. Company accounts Company accounts lists stays billed to a company at check-out: Company, Billed, Received, Owing, Overdue, Open bills . Open a company, Show bills , and when it pays use Receive money : Amount, Method, Reference (cheque or transfer number), Date . Overdue bills are highlighted. Groups For weddings, conferences and tours. Groups > New : Group name , Arrival , Departure , Contact person , phone, e-mail, Who pays ( Each guest pays their own bill; The group pays the rooms, guests pay extras; The group pays everything ) and an invoice-to customer. Room blocks : hold rooms off general sale ( Room type, Rooms, Group rate / night, From, To , and a Release unbooked rooms on date; unbooked rooms go back on sale then, or Release now ). Add rooms for the group, then Rooming list : paste guest names, one per line, with Put names on rooms . Export the rooming list to Excel, PDF or CSV. Statement shows what the group owes. Confirm , Complete or Cancel group (cancels every room that has not arrived; you can waive cancellation fees). Online booking If the hotel's public booking page is on, guests choose room types and dates and book online. Bookings arrive in Bookings with source Website . An administrator sets the page's text and rules under Online booking . Night audit At the night audit time set in Hotel settings, the system posts each night's room charge to accounting. The Night audit report checks the hotel's cash, revenue, tax, deposits, city ledger and group ledger against Accounting, and is the manager's end-of-day check. Reports Hotel > Reports : the Daily report; Occupancy with Room nights sold, Room nights available, Room revenue, ADR (average daily rate) and RevPAR (revenue per available room); Revenue by booking source ; Forecast and pick-up ; and the Night audit . Choose Last 7 days, Last 30 days or This month , or enter dates. All export to Excel, PDF and CSV. "}, {"id": "user-9-manufacturing", "manual": "user", "n": 9, "title": "Manufacturing", "html": "\n<p>The <strong>Manufacturing<\/strong> group has: <strong>Bill of\nmaterials, Production plans, Manufacturing orders, Workstations,\nRoutings, Indirect costs, Reports<\/strong>.<\/p>\n<h2 id=\"how-production-works\">How production works<\/h2>\n<p>A <strong>bill of materials (BOM)<\/strong> is the recipe for one\nfinished product. A <strong>manufacturing order<\/strong> says \"make this\nmany\". When you <strong>record production<\/strong>, the components are\ntaken out of stock, the finished goods are added to stock, and the cost\nof making them is worked out from materials, labour, machine time and\nindirect costs.<\/p>\n<h2 id=\"set-up-once\">Set-up (once)<\/h2>\n<h3 id=\"workstations\">Workstations<\/h3>\n<p><strong>Workstations &gt; New<\/strong>: a <strong>Code<\/strong>\n(cannot change later), <strong>Name<\/strong>,\n<strong>Description<\/strong>, and an <strong>Hourly rate<\/strong>: the\noperating cost of that machine or work area per hour.<\/p>\n<h3 id=\"routings\">Routings<\/h3>\n<p>A routing lists the steps (operations) to make a product.\n<strong>Routings &gt; New<\/strong>: <strong>Name<\/strong>,\n<strong>Description<\/strong>, then <strong>+ Add operation<\/strong> for\neach step: <strong>Seq<\/strong> (order), <strong>Operation name<\/strong>\n(for example Cut, Assemble, Paint, Pack), <strong>Workstation<\/strong>,\n<strong>Est. minutes/unit<\/strong> and <strong>Labour rate /\nhour<\/strong>. At least one operation is needed.<\/p>\n<h3 id=\"indirect-costs\">Indirect costs<\/h3>\n<p>Overheads such as rent share and power. <strong>Indirect costs &gt;\nNew<\/strong>: <strong>Code<\/strong>, <strong>Name<\/strong>,\n<strong>Allocation method<\/strong> and <strong>Rate<\/strong>:<\/p>\n<ul>\n<li><em>Flat<\/em>: a fixed total spread over the order's runs in\nproportion to quantity.<\/li>\n<li><em>Per unit produced<\/em>: the rate for every unit produced.<\/li>\n<li><em>Percent of material cost<\/em>: a percentage of each run's\nmaterial cost.<\/li>\n<\/ul>\n<h3 id=\"bill-of-materials\">Bill of materials<\/h3>\n<p><strong>Bill of materials &gt; New<\/strong>:<\/p>\n<ol type=\"1\">\n<li><strong>Finished-good product<\/strong>: the product this BOM makes\n(cannot be changed after creation).<\/li>\n<li>Optionally a <strong>Name<\/strong> (for example <em>Standard<\/em>,\n<em>Alt, no walnut<\/em>; a product can have several BOMs) and a\n<strong>Routing<\/strong>.<\/li>\n<li><strong>Components<\/strong>: search a product and set\n<strong>Quantity per unit<\/strong>: how many of that component it takes\nto make exactly <strong>one<\/strong> unit of the finished good.<\/li>\n<li>The screen shows the <strong>Cost of one unit (today's\nprices)<\/strong>: <em>Components, Labour, Machines, Cost per unit, After\nby-products, Selling price, Margin<\/em>. Indirect costs are added per\norder and are not included here. Save to refresh after editing.<\/li>\n<li><strong>By-products<\/strong> (optional): bran, offcuts, whey. Each\ngood unit also puts the stated quantity of the by-product into stock,\nand a <strong>Share of the cost (%)<\/strong> is taken off the finished\ngood's unit cost.<\/li>\n<li>Tick <strong>Active<\/strong> and <strong>Save<\/strong>.<\/li>\n<\/ol>\n<h2 id=\"production-plans\">Production plans<\/h2>\n<p><strong>Production plans<\/strong> suggest what to make. A plan looks\nat <strong>sales<\/strong> and <strong>low stock<\/strong> and lists, for\neach product, the <strong>Bill of materials<\/strong>, the quantities\n<strong>From sales<\/strong> and <strong>From low stock<\/strong>, the\n<strong>Suggested qty<\/strong> and any <strong>Component\nshortfalls<\/strong>. Press <strong>Generate order<\/strong> on a line to\nopen <strong>Generate manufacturing order<\/strong>: confirm\n<strong>Quantity<\/strong>, optional <strong>Scheduled date<\/strong> and\nindirect costs, and press <strong>Create manufacturing\norder<\/strong>.<\/p>\n<h2 id=\"manufacturing-orders\">Manufacturing orders<\/h2>\n<h3 id=\"create\">Create<\/h3>\n<p><strong>Manufacturing orders &gt; New<\/strong>: choose the\n<strong>Bill of materials<\/strong>, the <strong>Planned\nquantity<\/strong>, an optional <strong>Scheduled date<\/strong>,\n<strong>Produce at<\/strong> (the location where components are consumed\nand finished goods added), a <strong>Note<\/strong>, and any\n<strong>Indirect costs to apply<\/strong>. Orders are numbered\n<em>MO-0001<\/em>, <em>MO-0002<\/em>...<\/p>\n<h3 id=\"confirm\">Confirm<\/h3>\n<p>An order starts as a draft. <strong>Confirm<\/strong> fixes the\nrecipe, indirect costs and location; afterwards only the planned\nquantity, date and note can change. <strong>Copy as new draft<\/strong>\nrepeats an order. <strong>Cancel order<\/strong> abandons it.\n<strong>Print job card<\/strong> gives the shop floor a sheet with the\nsteps.<\/p>\n<h3 id=\"see-what-you-need\">See what you need<\/h3>\n<p>The order shows <strong>Components for the ... still to\nmake<\/strong>: <em>Per unit, Needed, On hand, Short by<\/em>. It tells\nyou if stock is short (\"Negative stock is allowed, so production will\nstill go through\" if your business allows it).<\/p>\n<h3 id=\"record-production\">Record production<\/h3>\n<p>Press <strong>Record production<\/strong>:<\/p>\n<ul>\n<li><strong>Quantity to produce now<\/strong> (the remaining quantity is\nshown). <strong>Use what stock allows<\/strong> fills in the most you can\nmake today.<\/li>\n<li><strong>Scrapped / rejected units<\/strong> and a\n<strong>Reason<\/strong> (burnt, wrong size, failed check).<\/li>\n<li>Optionally the <strong>Actual quantity used<\/strong> of components\n(otherwise the recipe's quantity is used) and <strong>Actual minutes\ntaken<\/strong>.<\/li>\n<\/ul>\n<p>You can record production in several runs. Each run moves stock and\nposts the cost. The order shows <strong>Produced, Scrapped, Yield %,\nTotal material / overhead / labour / machine cost, Total cost,\nBy-product credit<\/strong> and <strong>Unit cost<\/strong>, compared with\nthe <strong>Planned cost<\/strong>.<\/p>\n<h2 id=\"reports\">Reports<\/h2>\n<p><strong>Manufacturing &gt; Reports<\/strong>: <strong>Production runs,\nCost per product, Component use against recipe, Workstation time and\ncost, Scrap and rejects, Orders: plan against actual.<\/strong> Export to\nExcel, PDF and CSV. <em>Component use against recipe<\/em> and\n<em>Orders: plan against actual<\/em> show where waste and overruns\nhappen.<\/p>\n", "text": " The Manufacturing group has: Bill of materials, Production plans, Manufacturing orders, Workstations, Routings, Indirect costs, Reports . How production works A bill of materials (BOM) is the recipe for one finished product. A manufacturing order says \"make this many\". When you record production , the components are taken out of stock, the finished goods are added to stock, and the cost of making them is worked out from materials, labour, machine time and indirect costs. Set-up (once) Workstations Workstations > New : a Code (cannot change later), Name , Description , and an Hourly rate : the operating cost of that machine or work area per hour. Routings A routing lists the steps (operations) to make a product. Routings > New : Name , Description , then + Add operation for each step: Seq (order), Operation name (for example Cut, Assemble, Paint, Pack), Workstation , Est. minutes/unit and Labour rate / hour . At least one operation is needed. Indirect costs Overheads such as rent share and power. Indirect costs > New : Code , Name , Allocation method and Rate : Flat : a fixed total spread over the order's runs in proportion to quantity. Per unit produced : the rate for every unit produced. Percent of material cost : a percentage of each run's material cost. Bill of materials Bill of materials > New : Finished-good product : the product this BOM makes (cannot be changed after creation). Optionally a Name (for example Standard , Alt, no walnut ; a product can have several BOMs) and a Routing . Components : search a product and set Quantity per unit : how many of that component it takes to make exactly one unit of the finished good. The screen shows the Cost of one unit (today's prices) : Components, Labour, Machines, Cost per unit, After by-products, Selling price, Margin . Indirect costs are added per order and are not included here. Save to refresh after editing. By-products (optional): bran, offcuts, whey. Each good unit also puts the stated quantity of the by-product into stock, and a Share of the cost (%) is taken off the finished good's unit cost. Tick Active and Save . Production plans Production plans suggest what to make. A plan looks at sales and low stock and lists, for each product, the Bill of materials , the quantities From sales and From low stock , the Suggested qty and any Component shortfalls . Press Generate order on a line to open Generate manufacturing order : confirm Quantity , optional Scheduled date and indirect costs, and press Create manufacturing order . Manufacturing orders Create Manufacturing orders > New : choose the Bill of materials , the Planned quantity , an optional Scheduled date , Produce at (the location where components are consumed and finished goods added), a Note , and any Indirect costs to apply . Orders are numbered MO-0001 , MO-0002 ... Confirm An order starts as a draft. Confirm fixes the recipe, indirect costs and location; afterwards only the planned quantity, date and note can change. Copy as new draft repeats an order. Cancel order abandons it. Print job card gives the shop floor a sheet with the steps. See what you need The order shows Components for the ... still to make : Per unit, Needed, On hand, Short by . It tells you if stock is short (\"Negative stock is allowed, so production will still go through\" if your business allows it). Record production Press Record production : Quantity to produce now (the remaining quantity is shown). Use what stock allows fills in the most you can make today. Scrapped / rejected units and a Reason (burnt, wrong size, failed check). Optionally the Actual quantity used of components (otherwise the recipe's quantity is used) and Actual minutes taken . You can record production in several runs. Each run moves stock and posts the cost. The order shows Produced, Scrapped, Yield %, Total material / overhead / labour / machine cost, Total cost, By-product credit and Unit cost , compared with the Planned cost . Reports Manufacturing > Reports : Production runs, Cost per product, Component use against recipe, Workstation time and cost, Scrap and rejects, Orders: plan against actual. Export to Excel, PDF and CSV. Component use against recipe and Orders: plan against actual show where waste and overruns happen. "}, {"id": "user-10-accounting", "manual": "user", "n": 10, "title": "Accounting", "html": "\n<p><strong>Accounting<\/strong> is the ledger that every other module\nposts to. The group has: <strong>Chart of accounts, Cost centers,\nJournal entries, Controls, Incomes, Reports<\/strong>, and, when the\nExpenses module is used, the Expenses pages (next chapter).<\/p>\n<div class=\"callout note\">\n<p><strong>Note:<\/strong> Most entries are posted\n<strong>automatically<\/strong>: a sale posts revenue, tax and stock\ncost; a purchase posts stock and payables; payroll, depreciation, hotel\nnight audit and so on post by themselves. Manual journal entries are for\nthe exceptions. Setting up the chart of accounts and the controls is\ndescribed in the Administrator Manual (chapter 6).<\/p>\n<\/div>\n<h2 id=\"chart-of-accounts\">Chart of accounts<\/h2>\n<p><strong>Accounting &gt; Chart of accounts<\/strong> lists accounts\n(Code, Name, Description, Status). Accounts marked <em>system<\/em> are\nposted to automatically and cannot be deactivated.<\/p>\n<p><strong>New account<\/strong>: <strong>Code<\/strong> (cannot be\nchanged later; for example 5300), <strong>Name<\/strong> (Rent Expense),\n<strong>Type<\/strong> (<em>Asset, Liability, Equity, Revenue,\nExpense<\/em>), <strong>Description<\/strong>, <strong>Active<\/strong>.\nPress <strong>Ledger<\/strong> on an account to see every transaction on\nit between two dates, with a running <strong>Balance<\/strong>.<\/p>\n<h3 id=\"accounts-used-by-the-online-store\">Accounts used by the Online\nStore<\/h3>\n<p>When the Online Store is in use, these accounts appear in the chart\nby themselves a few seconds after the program starts (Rwanda chart code\nfirst, Chad chart code in brackets). Do not use them for anything\nelse.<\/p>\n<div class=\"tablewrap\"><table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Account<\/th>\n<th>What it holds<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Online Customer Deposits 2810 (4197)<\/td>\n<td>Money customers paid online for orders not yet delivered<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>MTN Mobile Money Clearing 1021 (5215), Airtel Money Clearing 1022\n(5216), Card Clearing 1030 (5213), Mobile Money Clearing 1020\n(5212)<\/td>\n<td>What each payment provider still owes the shop until it pays\nout<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>MTN Mobile Money Wallet 1011 (5217), Airtel Money Wallet 1012\n(5218), Bank, card settlements 1013 (5219)<\/td>\n<td>Where each provider's payouts arrive<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Cash with Drivers 1050 (5214)<\/td>\n<td>Cash delivery drivers took at the door and have not handed in<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Delivery Income 4030 (7071)<\/td>\n<td>Delivery fees, before tax<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Sales Discounts Given 4040 (7091)<\/td>\n<td>Coupon and loyalty-point discounts, before tax<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Loyalty Points Liability 2820 (4198)<\/td>\n<td>What the shop owes in loyalty points<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Payment Provider Fees 5240 (631)<\/td>\n<td>Fees providers keep from payouts<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>The Online Store chapters explain the entries. In\n<strong>Controls<\/strong> the shop's providers can be reconciled like\nany account: compare each clearing and wallet account with the\nprovider's own statement.<\/p>\n<h2 id=\"cost-centers\">Cost centers<\/h2>\n<p><strong>Cost centers<\/strong> are tags (department, branch, project)\nthat journal lines, expenses and incomes can carry, so that you can\nreport cost by center. <strong>New cost center<\/strong>: Code, Name. Use\n<em>Inactive<\/em> to retire one.<\/p>\n<h2 id=\"journal-entries\">Journal entries<\/h2>\n<p><strong>Journal entries &gt; New manual journal entry<\/strong>:<\/p>\n<ol type=\"1\">\n<li><strong>Date<\/strong> and <strong>Memo<\/strong> (for example\n<em>Owner contribution<\/em> or <em>March rent<\/em>).<\/li>\n<li>For each line choose the <strong>Account<\/strong>, a\n<strong>Description<\/strong>, an optional <strong>Cost center<\/strong>,\nand a <strong>Debit<\/strong> or a <strong>Credit<\/strong>. <strong>+ Add\nline<\/strong> adds more.<\/li>\n<li><strong>Debits and credits must add up to the same total<\/strong>\nbefore you can save; the screen shows the totals.<\/li>\n<li><strong>Save<\/strong>.<\/li>\n<\/ol>\n<p>The list shows entries from every module as well as manual ones; open\none to see its lines and its source.<\/p>\n<div class=\"callout warning\">\n<p><strong>Warning:<\/strong> Posted entries are not edited. To correct a\nmistake, enter a reversing entry or void the source document. If the\nbooks are closed up to a date, you cannot record anything on or before\nthat date.<\/p>\n<\/div>\n<h2 id=\"incomes-money-received-that-is-not-a-sale\">Incomes (money\nreceived that is not a sale)<\/h2>\n<p><strong>Incomes &gt; New income<\/strong>: <strong>Date<\/strong>,\n<strong>Category<\/strong> (a revenue-type account; add <em>Other\nIncome<\/em> in the chart first if needed), <strong>Received\nfrom<\/strong> (<em>Customer, Vendor (supplier), Staff, Other /\none-off<\/em>), the person or <strong>Payer name<\/strong>,\n<strong>Amount<\/strong>, <strong>Received immediately (into\nCash)<\/strong> (if unticked it is posted as money still owed to the\nstore), optional cost center, branch and memo.<\/p>\n<h2 id=\"controls-accountant-and-administrator\">Controls (accountant and\nadministrator)<\/h2>\n<p><strong>Accounting &gt; Controls<\/strong> has three tabs:<\/p>\n<ul>\n<li><strong>Close the books<\/strong>: close the books up to a date once\na period is final (for example after the March accounts are approved).\nNothing dated on or before that day can then be recorded: invoices,\nbills, expenses, journals, imports. Voiding or correcting still works\nbecause it is recorded today. Enter the date and <strong>Why<\/strong>.\n<strong>Only an admin can close or reopen the books<\/strong>, and every\nchange is logged with the reason and who did it.<\/li>\n<li><strong>Bank reconciliation<\/strong>: <strong>Start a\nreconciliation<\/strong> by choosing the account, the <strong>Statement\ndate<\/strong> and the <strong>Ending balance on the statement<\/strong>.\nTick the ledger lines that appear on your bank or mobile-money\nstatement; the screen shows <strong>Statement balance, Matched so far,\nDifference<\/strong>. When the difference is zero, save and complete it.\n<strong>Undo<\/strong> reverses a reconciliation. The system records all\ncash, bank and mobile money in one account called <em>Cash and\nBank<\/em>; to reconcile a bank separately, add it as an asset account\nand move money to it with a journal entry.<\/li>\n<li><strong>Opening balances<\/strong>: enter the balances of accounts\nwhen you start part-way through a year.<\/li>\n<\/ul>\n<h2
