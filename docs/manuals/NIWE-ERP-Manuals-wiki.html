icks Featured , Best seller , Offer , New for the rows of the first page. Front page : announcement, banner text and up to 8 banner pictures, footer links. Coupons for a promotion; Newsletter to download the confirmed addresses. \"It says Sold out\" Under the product: sellable warehouse stock − reserved − buffer = sellable now . Lower the buffer, move stock to a sales location, or complete the orders that hold it. Need more? See Online Store in the User Manual, or ask your administrator. "}], "nav": [{"key": "admin", "title": "Administrator Manual", "desc": "For the person who installs, configures and looks after the system.", "items": ["admin-1-about-this-manual", "admin-2-installing-and-first-start", "admin-3-licence-and-modules", "admin-4-users-roles-and-permissions", "admin-5-business-set-up", "admin-6-accounting-set-up", "admin-7-module-settings", "admin-8-tills-printers-and-devices", "admin-9-e-mail-alerts-and-scheduled-reports", "admin-10-backup-restore-import-and-export", "admin-11-logs-and-monitoring", "admin-12-upgrades-and-migrations", "admin-13-security-checklist", "admin-14-troubleshooting"]}, {"key": "user", "title": "User Manual", "desc": "Day-to-day use of every module, task by task.", "items": ["user-1-about-this-manual-and-getting-started", "user-2-pos-registers-the-sales-terminal-and-shi", "user-3-sales", "user-4-customers", "user-5-purchases-and-suppliers", "user-6-inventory", "user-7-restaurant", "user-8-hotel", "user-9-manufacturing", "user-10-accounting", "user-11-expenses", "user-12-assets", "user-13-human-resources-and-payroll", "user-14-time-tracking", "user-15-work-orders", "user-16-booking-appointments", "user-17-subscriptions", "user-18-installments", "user-19-help-desk", "user-20-law-firm", "user-21-real-estate-sales-and-brokerage", "user-22-property-management-rentals", "user-23-online-store", "user-24-glossary-and-common-questions"]}, {"key": "cards", "title": "Role quick-start cards", "desc": "One page per role, to get started quickly.", "items": ["cards-1-cashier", "cards-2-shift-supervisor-and-manager", "cards-3-sales-clerk", "cards-4-accountant", "cards-5-store-keeper", "cards-6-purchasing-officer", "cards-7-restaurant-waiter", "cards-8-kitchen-and-bar", "cards-9-hotel-front-desk", "cards-10-hr-officer", "cards-11-booking-and-reception", "cards-12-help-desk-agent", "cards-13-every-employee-my-hr-and-my-time", "cards-14-administrator", "cards-15-online-shop-staff"]}]};
var byId={};D.pages.forEach(function(p,i){byId[p.id]=i});
var nav=document.getElementById('nav'),main=document.getElementById('main');
function esc(s){return s.replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
(function buildNav(){
  var h='<a href="#home" data-id="home"><i></i>Start here</a>';
  D.nav.forEach(function(m){
    h+='<h3>'+esc(m.title)+'</h3>';
    m.items.forEach(function(id){var p=D.pages[byId[id]];h+='<a href="#'+id+'" data-id="'+id+'"><i>'+(m.key==='cards'?'':p.n)+'</i>'+esc(p.title)+'</a>'});
  });
  nav.innerHTML=h;
})();
function home(){
  var h='<article class="home"><div class="crumb">NIWE ERP, version 1.36.3</div><h1>Manuals for every person who uses the system</h1>'+
  '<p class="lede">Three sets of pages, written from the same sources as the Word and PDF editions. Pick the one that matches your job, or search for a screen or a word.</p><div class="cards">';
  D.nav.forEach(function(m){h+='<a class="card" href="#'+m.items[0]+'"><b>'+esc(m.title)+'</b><span>'+esc(m.desc)+'</span><small>'+m.items.length+(m.key==='cards'?' cards':' chapters')+'</small></a>'});
  h+='</div><h2>Find your role</h2><div class="chips">';
  D.nav[2].items.forEach(function(id){var p=D.pages[byId[id]];h+='<a href="#'+id+'">'+esc(p.title)+'</a>'});
  h+='</div><h2>Find your module</h2><div class="chips">';
  D.nav[1].items.forEach(function(id){var p=D.pages[byId[id]];h+='<a href="#'+id+'">'+esc(p.title.replace(/^.*?: /,''))+'</a>'});
  h+='</div></article>';return h;
}
function render(){
  var id=(location.hash||'#home').slice(1);
  document.body.classList.remove('open');document.getElementById('menu').setAttribute('aria-expanded','false');
  var links=nav.querySelectorAll('a');for(var i=0;i<links.length;i++){links[i].classList.toggle('on',links[i].getAttribute('data-id')===id)}
  if(!(id in byId)){main.innerHTML=home();document.title='NIWE ERP Manuals';window.scrollTo(0,0);return}
  var i=byId[id],p=D.pages[i],m=D.nav.filter(function(x){return x.key===p.manual})[0];
  var pos=m.items.indexOf(id),prev=m.items[pos-1],next=m.items[pos+1];
  var h='<article><div class="crumb">'+esc(m.title)+(m.key==='cards'?'':' · chapter '+p.n)+'</div><h1>'+esc(p.title)+'</h1>'+p.html+'<div class="pager">';
  h+=prev?'<a href="#'+prev+'"><small>Previous</small>'+esc(D.pages[byId[prev]].title)+'</a>':'<span></span>';
  h+=next?'<a class="next" href="#'+next+'"><small>Next</small>'+esc(D.pages[byId[next]].title)+'</a>':'';
  h+='</div></article>';
  main.innerHTML=h;document.title=p.title+' | NIWE ERP Manuals';window.scrollTo(0,0);
  var on=nav.querySelector('a.on');if(on&&on.scrollIntoView){try{on.scrollIntoView({block:'nearest'})}catch(e){}}
}
window.addEventListener('hashchange',render);render();
document.getElementById('menu').addEventListener('click',function(){var o=document.body.classList.toggle('open');this.setAttribute('aria-expanded',o)});
// search
var q=document.getElementById('q'),res=document.getElementById('res');
q.addEventListener('input',function(){
  var t=q.value.trim().toLowerCase();if(t.length<2){res.hidden=true;return}
  var words=t.split(/\s+/),out=[];
  D.pages.forEach(function(p){
    var low=p.text.toLowerCase(),ok=words.every(function(w){return low.indexOf(w)>-1});
    if(!ok)return;var at=low.indexOf(words[0]),from=Math.max(0,at-50),snip=p.text.substr(from,140);
    var score=(p.title.toLowerCase().indexOf(words[0])>-1?10:0)+(low.split(words[0]).length-1);
    out.push({p:p,s:esc(snip),score:score,w:words[0]});
  });
  out.sort(function(a,b){return b.score-a.score});out=out.slice(0,8);
  if(!out.length){res.innerHTML='<a href="#home"><b>No match</b><span>Try another word, for example a screen name.</span></a>'}
  else res.innerHTML=out.map(function(o){
    var m=D.nav.filter(function(x){return x.key===o.p.manual})[0];
    var s=o.s.replace(new RegExp('('+o.w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<mark>$1</mark>');
    return '<a href="#'+o.p.id+'"><b>'+esc(o.p.title)+'</b><span>'+esc(m.title)+' · ...'+s+'...</span></a>'}).join('');
  res.hidden=false;
});
res.addEventListener('click',function(){res.hidden=true;q.value=''});
document.addEventListener('click',function(e){if(!e.target.closest('.search'))res.hidden=true});
q.addEventListener('keydown',function(e){if(e.key==='Escape'){res.hidden=true;q.blur()}});
// theme
document.getElementById('theme').addEventListener('click',function(){
  var r=document.documentElement,cur=r.getAttribute('data-theme');
  if(!cur){cur=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light'}
  var nx=cur==='dark'?'light':'dark';r.setAttribute('data-theme',nx);
  try{localStorage.setItem('niwe-theme',nx)}catch(e){}
});
try{var st=localStorage.getItem('niwe-theme');if(st)document.documentElement.setAttribute('data-theme',st)}catch(e){}
</script>
