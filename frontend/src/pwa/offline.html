<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body { display: flex; align-items: center; justify-content: center; background: #12151f; color: #e5e7eb; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 1.5rem; box-sizing: border-box; }
    main { max-width: 26rem; text-align: center; }
    img { width: 84px; height: 84px; border-radius: 18px; }
    h1 { font-size: 1.4rem; margin: 1rem 0 0.4rem; }
    p { color: #9ca3af; line-height: 1.5; margin: 0.4rem 0; }
    button { margin-top: 1.2rem; background: #2fbe72; color: #0b2417; border: 0; border-radius: 8px; padding: 0.65rem 1.3rem; font-size: 1rem; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="">
    <h1>You are offline</h1>
    <p>This page needs an internet connection. Check your connection, then try again.</p>
    <p lang="fr">Cette page a besoin d'une connexion internet. Vérifiez votre connexion puis réessayez.</p>
    <button type="button" onclick="location.reload()">Try again / Réessayer</button>
  </main>
  <script>addEventListener('online', function () { location.reload(); });</script>
</body>
</html>
