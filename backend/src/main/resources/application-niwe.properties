# Default profile: your local PostgreSQL. See README "Running it".
spring.datasource.url=jdbc:postgresql://localhost:5433/pos_app
spring.datasource.username=postgres
spring.datasource.password=npf2020.
# Database schema is owned by Flyway (src/main/resources/db/migration). Hibernate only checks that the entities match
# the database and refuses to start when they do not. A database that already has tables but no Flyway history
# (built before Flyway was introduced) is marked as being at version 1 and keeps its data; a new empty database runs V1.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

server.port=6009

# CORS: the origin(s) the frontend is actually served from (comma-separated if more than one)
app.cors.allowed-origins=http://15.235.206.199:6008,http://localhost:4200

# Fourier: "Add forget password feature" — see application.properties' own comment on this key;
# the first of the two CORS origins above is where this deployment's frontend is actually served.
app.frontend-url=http://15.235.206.199:6008

# JWT
app.jwt.secret=change-this-to-a-long-random-string-before-any-real-deployment-32bytesplus
app.jwt.expiration-minutes=480

# Demo data (admin/cashier users, sample products/categories/register) seeded on first run
app.seed-demo-data=true

# Fourier: "I want to have possibility of selection on Chart while initiating the app at first
# time" — this client is Rwanda-based, so the chart of accounts seeded on first run is Rwanda's
# (see AccountService/ChartCountry's own javadoc). This deployment was already seeded before this
# setting (and the on-screen setup wizard that later replaced it as the primary way to choose —
# see ChartSetupController) existed, so writing RWANDA here changes nothing for it — the real
# answer now lives in StoreSettings.chartCountry, locked in automatically on this app's next
# restart; it's just made explicit here for the next person reading this file.
app.accounting.chart-country=RWANDA

# POS
# Only used once, on first run, to seed the initial admin-manageable TaxRate row (see
# com.posapp.tax.TaxRateService and DataSeeder.seedTaxRate) — after that, tax rates live in the
# database and are managed from Admin > Settings > Taxes, not here.
app.pos.tax-rate=0.15
app.pos.currency-symbol=$
app.pos.low-stock-threshold=10
