# Developer profile (run with -Dspring-boot.run.profiles=niwe,dev or dev alone). NEVER use in a deployment.
# Switches the module license check off: every module counts as licensed, so no license file is needed while developing.
# The switch is honoured only while this profile is active (see LicenseService).
app.license.dev-all-modules=true
server.port=8080
spring.datasource.url=jdbc:postgresql://localhost:5434/pos_app
spring.datasource.username=niwe_soft
spring.datasource.password=niwe_soft
# Demo data for development: a sample cashier, categories and products. The administrator gets this password on the first start of an empty database.
app.seed-demo-data=true
app.initial-admin-password=admin123

# Online Store payments: the pretend provider (no real money). The webhook secret signs the pretend provider's calls; use a real secret for a real provider.
app.online-store.payments.simulated.enabled=true
app.online-store.payments.simulated.secret=dev-simulated-secret

# Customer accounts (dev only): every sign-in code is this one, so the shop can be tried without a mail server
app.online-store.accounts.dev-code=123456
