# ONE-TIME USE, only when moving an existing database to Flyway for the first time.
#
# Before Flyway, Hibernate built and extended the database on every start (ddl-auto=update). A database that has not been
# started with the latest code yet can therefore be missing recent tables or columns. Start the backend ONCE with this
# profile to bring such a database fully up to date, stop it, then start normally (Flyway then marks the database as being
# at version 1 and continues from there):
#
#   mvn spring-boot:run -Dspring-boot.run.profiles=dbsync            (add your usual profile, e.g. niwe,dbsync)
#
# Never use this profile on a database that Flyway already manages, and never on a new empty database.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=update
